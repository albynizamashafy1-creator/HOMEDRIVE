      input[type=datetime-local]:focus{border-color:var(--acct);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 16%,transparent)}
      #snow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:75}
      #garland{position:fixed;left:0;right:0;top:0;height:24px;display:flex;justify-content:space-between;padding:0 6px;pointer-events:none;z-index:80;overflow:hidden}
      #garland::before{content:"";position:absolute;left:0;right:0;top:0;height:7px;border-bottom:2px solid #166534;border-radius:0 0 50% 50%/0 0 100% 100%;opacity:.85}
      #garland i{position:relative;display:block;width:9px;height:13px;border-radius:50% 50% 55% 55%;background:var(--c);box-shadow:0 0 10px 2px var(--c);animation:twk 1.8s ease-in-out infinite;animation-delay:var(--d);flex:none}
      #garland i::before{content:"";position:absolute;left:2px;top:-4px;width:5px;height:5px;background:#334155;border-radius:1px}
      @keyframes twk{0%,100%{opacity:1;filter:brightness(1.15)}50%{opacity:.35;filter:brightness(.7)}}
      html[data-xmas=on] body{background:radial-gradient(1000px 560px at -6% -12%,rgba(193,18,31,.14),transparent 62%),radial-gradient(900px 600px at 106% 110%,rgba(21,128,61,.15),transparent 60%),var(--bg);background-attachment:fixed}
      html[data-xmas=on] .mainc::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;z-index:7;background:repeating-linear-gradient(45deg,#c1121f 0 10px,#fff 10px 20px);opacity:.9}
      html[data-xmas=on] aside .logo i,html[data-xmas=on] .acard .logo i{position:relative}
      html[data-xmas=on] aside .logo i::after{content:"\1F384";position:absolute;right:-7px;top:-9px;font-size:15px}
      html[data-xmas=on] .sbar2 b{background:repeating-linear-gradient(45deg,#c1121f 0 8px,#f8fafc 8px 16px);background-size:22px 22px;animation:candy 1.2s linear infinite}
      html[data-xmas=on] .sbar2.lv1 b,html[data-xmas=on] .sbar2.lv2 b,html[data-xmas=on] .sbar2.lv3 b{animation:none}
      @keyframes candy{to{background-position:22px 0}}
      html[data-xmas=on] .hello h2{font-family:"Mountains of Christmas","Trebuchet MS",var(--font);font-size:30px;letter-spacing:-.3px}
      html[data-xmas=on] .abrand h2{font-family:"Mountains of Christmas","Trebuchet MS",var(--font)}
      html[data-xmas=on] .item.file:hover,html[data-xmas=on] .cat:hover{box-shadow:0 14px 34px -14px rgba(193,18,31,.45)}
      html[data-xmas=on] .chip.on{background:linear-gradient(135deg,#c1121f,#15803d);color:#fff;border-color:transparent}
      html[data-xmas=on] #newBtn{background:linear-gradient(135deg,#c1121f,#15803d)}
      html[data-xmas=on] .btn.pri{background:linear-gradient(135deg,var(--acc),var(--acc2))}
      .xcount{margin:14px 0 4px;padding:14px 18px;border-radius:18px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;color:#fff;position:relative;overflow:hidden;background:linear-gradient(120deg,#9b0f1b,#c1121f 40%,#15803d);box-shadow:0 14px 30px -16px rgba(155,15,27,.7)}
      .xcount::after{content:"\2744";position:absolute;right:14px;top:-6px;font-size:84px;opacity:.14;transform:rotate(14deg)}
      .xcount .xc-t{font-weight:750;font-size:15px;letter-spacing:-.1px;flex:1;min-width:150px}
      .xc-b{display:flex;gap:8px}
