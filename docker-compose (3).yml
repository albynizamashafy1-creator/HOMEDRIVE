      }
      const skeleton = () => '<div class="grid">' + Array.from({length:10}, () => '<div class="sk"></div>').join('') + '</div>';
      let loadSeq = 0;
      async function load(keepSel, silent) {
        if (!S.me) return;
        if (S.view === 'admin') { if (silent) ADM.live(); else renderAdmin(); return; }
        if (!keepSel) S.sel.clear();
        const my = ++loadSeq;
        const sk = setTimeout(() => { if (!keepSel && my === loadSeq) $$('#content').innerHTML = skeleton(); }, 160);
        try {
          const qs = S.term ? 'q='+encodeURIComponent(S.term) : 'view='+S.view+(S.parent?'&parent='+S.parent:'');
          const j = await api('list?'+qs);
          if (my !== loadSeq) { clearTimeout(sk); return; }   // sudah ada permintaan yang lebih baru
          const sig = JSON.stringify([j.items, j.crumbs]);
          const same = silent && sig === S.sig;
          S.sig = sig; S.storage = j.storage || S.storage; S.used = j.used; S.quota = j.quota;
