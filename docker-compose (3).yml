        S.raw = fn(S.raw); S.items = applyFilter(sortItems(S.raw));
        if (opt.keep) { for (const id of [...S.sel]) if (!S.items.some(i => i.id === id)) S.sel.delete(id); } else S.sel.clear();
        render();
        try { await call(); S.sig = null; load(true, true); return true; }
        catch(e) { S.raw = snapRaw; S.items = applyFilter(sortItems(S.raw)); S.sel = snapSel; render(); storeErr(e); return false; }
      }
      async function moveItems(ids, dest) {
