      async function refreshMe() {
        try {
          const j = await fetch('/api/me',{credentials:'same-origin'}).then(r=>r.json());
          if (!j.user) { if (S.me) forceLogout(j.setup_needed, 'Sesi Anda berakhir. Silakan masuk kembali.'); return; }
          const changed = S.me && (j.user.is_admin !== S.me.is_admin || j.user.is_owner !== S.me.is_owner);
          S.me = j.user; S.storage = j.storage; S.notice = j.notice || {}; S.unread = j.unread || 0; S.pending = j.pending || 0; S.limits = j.limits || {};
          setBadge(); renderStorage(); renderBanner(); paintUser(); if (S.me.is_admin) setPending();
