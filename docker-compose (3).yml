      const fmtN = n => (n||0).toLocaleString('id-ID');
      const kpi = (icon, color, label, value, sub) => `<div class="kpi" style="--c:$${color}"><span class="ki">$${ic(icon,20)}</span><span class="kl">$${label}</span><b>$${value}</b><small>$${sub}</small></div>`;
      const emptyBox = (icon, title, text) => `<div class="empty" style="padding:40px 16px"><div class="eic" style="width:68px;height:68px">$${ic(icon,28)}</div><h3 style="font-size:16px">$${title}</h3>$${text||''}</div>`;
      const panel = (title, inner, right, cls) => `<section class="panel $${cls||''}"><div class="ph"><h3>$${title}</h3>$${right||''}</div>$${inner}</section>`;
      const quotaLabel = u => u.is_owner ? 'tanpa batas' : u.quota_gb == null ? 'belum diatur' : (u.quota_gb ? fmtSize(u.quota_gb*1024**3) : 'tanpa batas');

      function setPending() {
        const n = S.pending || 0, a = $$('#navBadge'); if (a) { a.textContent = n > 99 ? '99+' : n; a.classList.toggle('hidden', !n); }
        const t = document.querySelector('.adm-tab[data-at=requests] .nbadge'); if (t) { t.textContent = n; t.classList.toggle('hidden', !n); }
      }
      function buildNav() {
        const adm = S.me.is_admin ? ['#Administrasi'] : [];
        const nav = ['#Pustaka',['files','drive','Drive Saya'],['recent','clock','Terbaru'],['starred','star','Berbintang'],'#Jenis file',['photos','image','Foto'],['videos','video','Video'],['audio','music','Audio'],['documents','fileText','Dokumen'],'#Kelola',['shared','globe','Dibagikan'],['large','weight','File besar'],['trash','trash','Sampah']];
        if (S.me.is_admin) nav.push('#Administrasi', ['admin','shield', S.me.is_owner ? 'Panel owner' : 'Panel admin']);
        $$('#nav').innerHTML = nav.map(n => typeof n==='string' ? `<div class="nl">$${n.slice(1)}</div>` :
          `<a data-v="$${n[0]}" $${n[0]==='files'?'data-drop=""':''}>$${ic(n[1],19)}<span>$${n[2]}</span>$${n[0]==='admin'?'<i class="nbadge hidden" id="navBadge"></i>':''}</a>`).join('');
        setPending();
        document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('active', a.dataset.v===S.view));
      }

      /* ---------- kerangka halaman ---------- */
      function renderAdmin() {
        if (!S.me || !S.me.is_admin) return go('#/files');
        S.sel.clear(); renderSel();
        document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('active', a.dataset.v==='admin'));
        document.querySelectorAll('#tabbar a').forEach(a => a.classList.remove('active'));
        $$('#crumbs').innerHTML = '<button>' + (S.me.is_owner ? 'Panel owner' : 'Panel admin') + '</button>';
        $$('#emptyTrash').classList.add('hidden'); $$('#sortBtn').classList.add('hidden'); $$('#seg').innerHTML = ''; $$('#chips').classList.add('hidden');
        renderStorage(); renderBanner();
        const tabs = ADM_TABS.filter(t => !t[3] || S.me.is_owner).map(t =>
          `<button class="adm-tab $${ADM.tab===t[0]?'on':''}" data-at="$${t[0]}" data-adm-tab="$${t[0]}">$${ic(t[1],17)}<span>$${t[2]}</span>$${t[0]==='requests'?'<i class="nbadge hidden">0</i>':''}</button>`).join('');
        $$('#content').innerHTML = `<div class="adm-tabs">$${tabs}</div><div id="admBody"></div>`;
        setPending();
        ADM.draw();
      }
      ADM.draw = async function(silent) {
        const body = $$('#admBody'); if (!body) return;
        const my = ++ADM.seq, sc = $$('#content').scrollTop;
        if (!silent) body.innerHTML = '<div class="adm-loading"><div class="sk"></div><div class="sk"></div></div>';
        try { await ({overview:admOverview, users:admUsers, requests:admRequests, activity:admActivity, shares:admShares, sessions:admSessions, system:admSystem, settings:admSettings})[ADM.tab](body, my, silent); }
        catch(e) { if (my === ADM.seq) body.innerHTML = emptyBox('alert', 'Gagal memuat', esc(e.message)); }
        if (silent) $$('#content').scrollTop = sc;
      };
      ADM.live = function() {
        clearTimeout(ADM.lt);
        ADM.lt = setTimeout(() => {
          if (S.view !== 'admin' || !S.me || document.querySelector('.mbg') || ['settings','activity'].includes(ADM.tab)) return;
          const a = document.activeElement; if (a && /^(INPUT|TEXTAREA|SELECT)$$/.test(a.tagName) && $$('#content').contains(a)) return;
          ADM.draw(true);
        }, 500);
      };
      function admGoto(v) {
        const [tab, arg] = String(v).split(':');
        if (tab === 'activity') ADM.act = {user:'', action:arg||'', q:'', items:[], more:false, next:null};
        if (tab === 'users') { ADM.uf = arg || 'all'; ADM.uq = ''; }
        go('#/admin/' + tab);
      }

      /* ---------- Ringkasan ---------- */
      function dailyChart(daily) {
        const W = 600, H = 172, pb = 24, pt = 8, n = daily.length, bw = W/n, hh = H - pb - pt, mx = Math.max(1, ...daily.map(d => d.total));
        let g = '';
        for (let i = 1; i <= 3; i++) { const y = pt + hh - hh*i/3; g += `<line x1="0" x2="$${W}" y1="$${y}" y2="$${y}" class="cg"/>`; }
        daily.forEach((d, i) => {
          const x = i*bw + bw*.18, w = bw*.64, dt = new Date(d.ts*1000), lab = dt.toLocaleDateString('id-ID', {day:'numeric', month:'short', timeZone:'UTC'});
          const h1 = d.total ? Math.max(3, d.total/mx*hh) : 0, h2 = d.uploads ? Math.max(3, d.uploads/mx*hh) : 0;
          g += `<g><title>$${lab}: $${d.total} aktivitas, $${d.uploads} unggahan, $${d.logins} login</title><rect x="$${x}" y="$${pt}" width="$${w}" height="$${hh}" fill="transparent"/>` +
            (h1 ? `<rect x="$${x}" y="$${pt+hh-h1}" width="$${w}" height="$${h1}" rx="4" class="bt"/>` : '') + (h2 ? `<rect x="$${x}" y="$${pt+hh-h2}" width="$${w}" height="$${h2}" rx="4" class="bu"/>` : '') + '</g>';
          if (i % 2 === 0 || i === n-1) g += `<text x="$${x+w/2}" y="$${H-7}" text-anchor="middle" class="cl">$${dt.getUTCDate()}</text>`;
        });
        return `<svg viewBox="0 0 $${W} $${H}" class="chart" role="img" aria-label="Aktivitas 14 hari terakhir">$${g}</svg>`;
      }
      async function admOverview(body, my) {
        const j = await api('admin/overview'); if (my !== ADM.seq) return;
        const owner = !!S.me.is_owner, D = j.disk, freePct = D.total ? D.free/D.total*100 : 100, pend = j.pending_users + j.pending_quota, al = [];
        if (owner && pend) al.push(['', 'mail', `<b>$${pend} permintaan</b> menunggu keputusan Anda`, 'requests']);
        if (j.failed_logins) al.push(['', 'shield', `<b>$${j.failed_logins} percobaan login gagal</b> dalam 24 jam terakhir`, 'activity:login_fail']);
        if (D.total && freePct < 10) al.push(['danger', 'alert', `Ruang disk server tinggal <b>$${fmtSize(D.free)}</b> ($${freePct.toFixed(0)}%)`, owner ? 'system' : '']);
        if (D.total && j.alloc > D.total) al.push(['info', 'info', `Total kuota yang dialokasikan ($${fmtSize(j.alloc)}) melebihi kapasitas disk ($${fmtSize(D.total)})`, 'users']);
        if (j.no_quota) al.push(['info', 'lock', `<b>$${j.no_quota} pengguna</b> belum punya kuota sehingga belum bisa mengunggah`, 'users:noquota']);
        if (j.maintenance) al.push(['info', 'lock', '<b>Mode pemeliharaan aktif</b>: penyimpanan hanya-baca bagi pengguna', owner ? 'system' : '']);
        const alerts = al.length ? `<div class="alerts">$${al.map(a => `<div class="alert $${a[0]}" $${a[3] ? `data-adm="goto" data-v="$${a[3]}"` : ''}>$${ic(a[1],19)}<span>$${a[2]}</span>$${a[3] ? ic('chevron',16) : ''}</div>`).join('')}</div>` : '';
        const total = Math.max(1, j.used || 1);
        const segs = Object.keys(CATCOL).map(k => `<b style="width:$${j.categories[k].size/total*100}%;background:$${CATCOL[k]}"></b>`).join('');
        const legend = Object.keys(CATCOL).map(k => `<div><i style="background:$${CATCOL[k]}"></i><span>$${CATNAME[k]} <small style="color:var(--muted)">· $${fmtN(j.categories[k].count)} file</small></span><span>$${fmtSize(j.categories[k].size)}</span></div>`).join('');
        const mxu = Math.max(1, ...j.top.map(t => t.used));
        const top = j.top.filter(t => t.used > 0 || j.top.length <= 3).map(t => {
          const q = t.quota_gb ? t.quota_gb*1024**3 : 0;
          return `<div class="lrow" data-adm="user-open" data-v="$${t.id}" style="grid-template-columns:36px minmax(0,1fr) auto"><span>$${av2(t.username)}</span><div class="un"><b>$${esc(t.username)}</b><div style="margin-top:6px">$${q ? pb2(t.used, q) : pb2(t.used, mxu)}</div></div><span class="muted" style="text-align:right;white-space:nowrap"><b style="color:var(--text)">$${fmtSize(t.used)}</b>$${q ? '<br>dari ' + fmtSize(q) : ''}</span></div>`;
        }).join('') || '<div style="padding:24px;text-align:center;color:var(--muted)">Belum ada pemakaian.</div>';
        const recent = j.recent.map(a => { const x = ACT[a.action] || ['info', a.action]; return `<div class="a $${a.action==='login_fail'?'bad':''}"><span class="ai">$${ic(x[0],18)}</span><div class="at"><b>$${x[1]}</b><span>$${esc(a.who)} · $${esc(a.detail||'')}</span></div><span class="ts">$${ago(a.ts)}</span></div>`; }).join('') || '<div style="padding:24px;text-align:center;color:var(--muted)">Belum ada aktivitas.</div>';
        const dpct = D.total ? D.used/D.total*100 : 0;
        body.innerHTML = alerts +
          `<div class="kpis">$${kpi('users','#6366f1','Pengguna',fmtN(j.users),`$${j.active7d} aktif 7 hari · $${j.admins} admin$${j.disabled?' · '+j.disabled+' nonaktif':''}`)}$${kpi('fileText','#10b981','File',fmtN(j.files),`$${fmtN(j.folders)} folder · sampah $${fmtSize(j.trash)}`)}$${kpi('drive','#f59e0b','Terpakai',fmtSize(j.used),`kuota dialokasikan $${fmtSize(j.alloc)}`)}$${kpi('globe','#0ea5e9','Tautan aktif',fmtN(j.shares),`$${j.sessions} sesi login aktif`)}</div>` +
          `<div class="pgrid">` +
          `<div class="c8">$${panel('Aktivitas 14 hari terakhir', dailyChart(j.daily), '<div class="lg"><span><i style="background:color-mix(in srgb,var(--acc) 30%,var(--surface))"></i>Semua</span><span><i style="background:var(--acc)"></i>Unggahan</span></div>')}</div>` +
          `<div class="c4">$${panel('Disk server', `<div class="big-n">$${fmtSize(D.used)} <small>dari $${fmtSize(D.total)}</small></div><div class="pb2 $${freePct<10?'danger':freePct<20?'warn':''}" style="margin:12px 0 10px"><b style="width:$${dpct.toFixed(1)}%"></b></div><div class="hint" style="margin:0">Kosong <b style="color:var(--text)">$${fmtSize(D.free)}</b> · data HomeDrive <b style="color:var(--text)">$${fmtSize(j.used)}</b></div>`)}</div>` +
          `<div class="c6">$${panel('Komposisi penyimpanan', `<div class="sbar" style="height:10px">$${segs}</div><div class="legend">$${legend}</div>`)}</div>` +
          `<div class="c6">$${panel('Pemakaian per pengguna', `<div style="margin:-6px -18px -18px">$${top}</div>`, `<small>Teratas</small>`)}</div>` +
          `<div class="c12">$${panel('Aktivitas terbaru', `<div class="acl" style="max-height:none">$${recent}</div>`, '<button class="btn sm" data-adm="goto" data-v="activity">Lihat semua</button>')}</div></div>`;
      }

      /* ---------- Pengguna ---------- */
      const UFILTERS = [['all','Semua'],['admin','Admin'],['disabled','Nonaktif'],['noquota','Tanpa kuota'],['want','Minta kuota']];
      async function admUsers(body, my) {
        const j = await api('users'); if (my !== ADM.seq) return;
        ADM.users = j.users;
        const owner = !!S.me.is_owner;
        body.innerHTML = `<div class="toolbar"><div class="tsearch">$${ic('search',16)}<input type="text" id="admQ" placeholder="Cari pengguna…" autocomplete="off" value="$${esc(ADM.uq)}"></div><div class="fchips" id="admChips"></div><span class="grow"></span><button class="btn pri" data-adm="user-add">$${ic('userPlus',17)}$${owner?'Tambah pengguna':'Ajukan pengguna'}</button></div>` +
          `<div class="panel nopad"><div class="lh"><span>$${owner?'<input type="checkbox" data-adm="user-all" title="Pilih semua">':''}</span><span>Pengguna</span><span>Penyimpanan</span><span>Aktif</span><span></span></div><div id="admUl"></div></div><div id="admBulk"></div>`;
        drawUsers();
      }
      function drawUsers() {
        const ul = $$('#admUl'); if (!ul) return;
        const q = ADM.uq.trim().toLowerCase(), f = ADM.uf, owner = !!S.me.is_owner;
        const rows = ADM.users.filter(u => (!q || u.username.toLowerCase().includes(q)) &&
          (f==='all' || (f==='admin' && u.is_admin && !u.is_owner) || (f==='disabled' && u.disabled) || (f==='noquota' && !u.is_owner && u.quota_gb==null) || (f==='want' && u.pending_gb)));
        $$('#admChips').innerHTML = UFILTERS.map(x => `<button class="chip $${f===x[0]?'on':''}" data-adm="uf" data-v="$${x[0]}">$${x[1]}</button>`).join('');
        for (const id of [...ADM.sel]) if (!ADM.users.some(u => u.id===id && !u.is_owner && u.id!==S.me.id)) ADM.sel.delete(id);
        ul.innerHTML = rows.map(u => {
          const q2 = u.quota_gb ? u.quota_gb*1024**3 : 0, canSel = owner && !u.is_owner && u.id !== S.me.id;
          const stor = u.is_owner ? `<span><b>$${fmtSize(u.used)}</b> · tanpa batas</span>` : `<span><b>$${fmtSize(u.used)}</b> dari $${u.quota_gb==null ? '<b style="color:var(--danger)">belum diatur</b>' : quotaLabel(u)}$${u.pending_gb ? ' <em class="pill">minta ' + u.pending_gb + ' GB</em>' : ''}</span>$${q2 ? pb2(u.used, q2) : ''}`;
          return `<div class="lrow ur $${ADM.sel.has(u.id)?'sel':''}" data-adm="user-open" data-v="$${u.id}">$${canSel ? `<input type="checkbox" data-adm="user-chk" data-v="$${u.id}" $${ADM.sel.has(u.id)?'checked':''}>` : '<span></span>'}` +
            `<div class="uwho">$${av2(u.username)}<div class="un"><b>$${esc(u.username)}$${roleTag(u)}$${u.face?'<em class="pill ok">wajah</em>':''}$${u.id===S.me.id?'<em class="pill">Anda</em>':''}$${u.disabled?'<em class="pill warn">nonaktif</em>':''}</b><small class="usub">$${fmtSize(u.used)} · $${u.quota_gb==null&&!u.is_owner?'tanpa kuota':quotaLabel(u)} · $${u.last_seen?ago(u.last_seen):'belum login'}</small><small>Bergabung $${fmtDate(u.created)}</small></div></div>` +
            `<div class="stor">$${stor}</div><div class="seen muted">$${u.last_seen ? ago(u.last_seen) : 'Belum pernah'}</div><button class="ibtn" data-adm="user-menu" data-v="$${u.id}" aria-label="Menu">$${ic('more',18,'fill')}</button></div>`;
        }).join('') || emptyBox('users', 'Tidak ada pengguna', 'Ubah kata kunci atau filter.');
        const n = ADM.sel.size, bk = $$('#admBulk');
        if (bk) bk.innerHTML = n ? `<div class="bulkbar"><b>$${n} dipilih</b><button class="btn sm" data-adm="bulk" data-op="quota">Atur kuota</button><button class="btn sm" data-adm="bulk" data-op="disable">Nonaktifkan</button><button class="btn sm" data-adm="bulk" data-op="enable">Aktifkan</button><button class="btn sm" data-adm="bulk" data-op="logout">Keluarkan perangkat</button><span class="grow"></span><button class="btn sm" data-adm="bulk" data-op="clear">Batal</button></div>` : '';
      }
      async function bulkAct(op) {
        if (op === 'clear') { ADM.sel.clear(); return drawUsers(); }
        const ids = [...ADM.sel], body = {ids, action:op};
        if (op === 'quota') { const v = await ask('Kuota untuk ' + ids.length + ' pengguna (GB). 0 = tanpa batas, kosong = cabut kuota', '', 'Terapkan'); if (v === null) return; body.quota_gb = v.trim(); }
        else if (op === 'disable' && !await confirmBox('Nonaktifkan ' + ids.length + ' pengguna?', 'Mereka langsung dikeluarkan dan tidak bisa login. File tetap aman.', 'Nonaktifkan')) return;
        else if (op === 'logout' && !await confirmBox('Keluarkan ' + ids.length + ' pengguna dari semua perangkat?', 'Semua sesi login mereka diakhiri.', 'Keluarkan')) return;
        try { const r = await api('admin/bulk', body); toast(r.count + ' pengguna diperbarui'); ADM.sel.clear(); ADM.draw(true); } catch(e) { toast(e.message); }
      }
      function userAddDialog() {
        const owner = !!S.me.is_owner, dq = (S.limits || {}).default_quota_gb;
        const m = modal(`<h2>$${owner?'Tambah pengguna':'Ajukan pengguna baru'}</h2>$${owner ? '' : '<p class="hint" style="margin:0 0 4px">Admin tidak bisa menambah pengguna langsung. Permintaan dikirim ke owner dan pengguna dibuat setelah disetujui.</p>'}
          <label class="lbl">Username</label><input type="text" id="nu" autocomplete="off" placeholder="3-32 karakter: huruf, angka, _ . -">
          <label class="lbl">Password awal</label><input type="password" id="np" autocomplete="new-password" placeholder="Minimal 8 karakter">
          $${owner ? `<label class="lbl">Kuota (GB)</label><input type="number" id="nq" min="0" step="any" placeholder="$${dq != null ? 'Kosong = kuota bawaan (' + fmtGB(dq) + ')' : 'Kosong = atur nanti · 0 = tanpa batas'}"><label class="chkline"><input type="checkbox" id="na"> Jadikan admin</label>` : ''}
          <div class="err" id="e"></div><div class="actions"><button class="btn" id="c">Batal</button><button class="btn pri" id="a">$${owner?'Tambah':'Kirim permintaan'}</button></div>`);
        m.querySelector('#nu').focus(); m.querySelector('#c').onclick = () => m.remove();
        m.querySelector('#a').onclick = async () => {
          const un = m.querySelector('#nu').value, pw = m.querySelector('#np').value;
          try {
            if (owner) await api('users', {username:un, password:pw, is_admin:m.querySelector('#na').checked, quota_gb:m.querySelector('#nq').value});
            else await api('requests', {username:un, password:pw});
            m.remove(); toast(owner ? 'Pengguna ditambahkan' : 'Permintaan dikirim ke owner'); ADM.draw(true);
          } catch(e) { m.querySelector('#e').textContent = e.message; }
        };
      }
      const UA = {
        async quota(u) { const v = await ask('Kuota ' + u.username + ' (GB). 0 = tanpa batas, kosong = cabut kuota (tidak bisa unggah)', u.quota_gb==null ? '' : String(u.quota_gb), 'Simpan'); if (v === null) return false; await api('users/quota', {id:u.id, quota_gb:v.trim()}); toast('Kuota diperbarui'); return true; },
        async reset(u) { const v = await ask('Password baru untuk ' + u.username + ' (min. 8 karakter)', '', 'Atur'); if (v === null) return false; await api('users/reset', {id:u.id, password:v}); toast('Password direset dan semua sesi dikeluarkan'); return true; },
        async rename(u) { const v = await ask('Username baru untuk ' + u.username, u.username, 'Simpan'); if (v === null || v.trim() === u.username) return false; await api('admin/rename', {id:u.id, username:v.trim()}); toast('Username diubah'); return true; },
        async disable(u) { if (!u.disabled && !await confirmBox('Nonaktifkan ' + u.username + '?', 'Pengguna langsung dikeluarkan dan tidak bisa login. File tetap aman dan akun bisa diaktifkan kembali.', 'Nonaktifkan')) return false; await api('users/disable', {id:u.id, disabled:!u.disabled}); toast(u.disabled ? 'Akun diaktifkan' : 'Akun dinonaktifkan'); return true; },
        async logout(u) { if (!await confirmBox('Keluarkan ' + u.username + '?', 'Semua sesi login pengguna ini diakhiri.', 'Keluarkan')) return false; await api('users/logout', {id:u.id}); toast('Semua sesi ' + u.username + ' dikeluarkan'); return true; },
        async role(u) { await api('users/role', {id:u.id, is_admin:!u.is_admin}); toast(u.is_admin ? 'Hak admin dicabut' : 'Dijadikan admin'); return true; },
        async trash(u) { if (!await confirmBox('Kosongkan sampah ' + u.username + '?', 'Semua item di sampah pengguna ini dihapus permanen.', 'Kosongkan')) return false; const r = await api('admin/empty-trash', {id:u.id}); toast('Sampah dikosongkan (' + fmtSize(r.freed) + ' dibebaskan)'); return true; },
        async del(u) { if (!await confirmBox('Hapus ' + u.username + '?', 'Akun dan semua file milik pengguna ini terhapus permanen.', 'Hapus')) return false; await api('users/delete', {id:u.id}); toast('Pengguna dihapus'); return 'gone'; },
        async faceReset(u) { if (!await confirmBox('Reset verifikasi wajah ' + u.username + '?', 'Data wajah dihapus dan pengguna kembali login hanya dengan password. Mereka dapat mendaftarkan wajah lagi.', 'Reset')) return false; await api('admin/face-reset', {id:u.id}); toast('Verifikasi wajah direset'); return true; },
        reqQuota(u) { quotaRequestDialog(u.id); return false; },
      };
      async function runUA(name, u, after) {
        try { const r = await UA[name](u); if (r) { ADM.sel.delete(u.id); ADM.draw(true); if (after) after(r); } } catch(e) { toast(e.message); }
      }
      function userMenuEntries(u, after) {
        const owner = !!S.me.is_owner, self = u.id === S.me.id, m = [{h:u.username}, {i:'info', t:'Lihat detail', f:() => userDetail(u.id)}];
        if (owner) {
          m.push({i:'drive', t:'Atur kuota…', f:() => runUA('quota', u, after)}, {i:'edit', t:'Ganti username…', f:() => runUA('rename', u, after)});
          if (!u.is_owner) m.push({i:'key', t:'Reset password…', f:() => runUA('reset', u, after)});
          m.push({i:'trash', t:'Kosongkan sampah', f:() => runUA('trash', u, after)});
          if (!u.is_owner && !self) m.push('-', {i:'lock', t:u.disabled ? 'Aktifkan kembali akun' : 'Nonaktifkan akun', f:() => runUA('disable', u, after)}, {i:'logout', t:'Keluarkan dari semua perangkat', f:() => runUA('logout', u, after)},
            {i:'users', t:u.is_admin ? 'Cabut hak admin' : 'Jadikan admin', f:() => runUA('role', u, after)}, '-', {i:'trash', t:'Hapus pengguna', danger:1, f:() => runUA('del', u, after)});
        } else if (!u.is_owner) m.push({i:'drive', t:'Ajukan kuota…', f:() => UA.reqQuota(u)});
        return m;
      }

      /* detail pengguna */
      async function userDetail(id, mm) {
        let j; try { j = await api('admin/user?id=' + id); } catch(e) { return toast(e.message); }
        const u = j.user, owner = !!S.me.is_owner, self = u.id === S.me.id, qb = u.quota_gb ? u.quota_gb*1024**3 : 0, total = Math.max(1, qb || j.used || 1);
        const segs = Object.keys(CATCOL).map(k => `<b style="width:$${j.categories[k].size/total*100}%;background:$${CATCOL[k]}"></b>`).join('');
        const legend = Object.keys(CATCOL).map(k => `<div><i style="background:$${CATCOL[k]}"></i><span>$${CATNAME[k]} <small style="color:var(--muted)">· $${j.categories[k].count} file</small></span><span>$${fmtSize(j.categories[k].size)}</span></div>`).join('');
        const cell = (l, v) => `<div><small>$${l}</small><b>$${v}</b></div>`;
        const sess = owner ? (j.sessions.length ? j.sessions.map(s => { const d = devInfo(s.ua); return `<div class="a"><span class="ai">$${ic(d.i,18)}</span><div class="at"><b>$${esc(d.n)}$${s.current?'<em class="pill">perangkat ini</em>':''}</b><span>$${esc(s.ip||'IP tidak diketahui')} · $${s.last_seen?'aktif '+ago(s.last_seen):'login '+fmtDate(s.created)}</span></div>$${s.current?'':`<button class="btn sm dng" data-ds="$${s.id}">Keluarkan</button>`}</div>`; }).join('') : '<div style="padding:14px 0;color:var(--muted)">Tidak ada sesi aktif.</div>') : '';
        const rec = j.recent.map(a => { const x = ACT[a.action] || ['info', a.action]; return `<div class="a $${a.action==='login_fail'?'bad':''}"><span class="ai">$${ic(x[0],18)}</span><div class="at"><b>$${x[1]}</b><span>$${esc(a.detail||'')}</span></div><span class="ts">$${ago(a.ts)}</span></div>`; }).join('') || '<div style="padding:14px 0;color:var(--muted)">Belum ada aktivitas.</div>';
        const acts0 = owner ? [['quota','drive','Atur kuota'],['rename','edit','Ganti username']].concat(u.is_owner ? [['trash','trash','Kosongkan sampah']] : [['reset','key','Reset password'],['trash','trash','Kosongkan sampah'],['logout','logout','Keluarkan dari semua perangkat'],['disable','lock',u.disabled?'Aktifkan akun':'Nonaktifkan akun'],['role','users',u.is_admin?'Cabut hak admin':'Jadikan admin']].filter(() => !self)) :
          (u.is_owner ? [] : [['reqQuota','drive','Ajukan kuota']]);
        const acts = acts0.concat(owner && u.face && !self ? [['faceReset','face','Reset verifikasi wajah']] : []);
        const html = `<div class="udh">$${av2(u.username,52)}<div class="un"><h2 style="margin:0">$${esc(u.username)}$${roleTag(u)}$${u.disabled?'<em class="pill warn">nonaktif</em>':''}</h2><small>Bergabung $${fmtDate(u.created)} · login terakhir $${j.last_login ? ago(j.last_login) : 'belum pernah'}</small></div></div>
          $${j.fails7d || j.pending_gb ? `<div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">$${j.fails7d ? `<span class="pill warn" style="margin:0">$${j.fails7d} login gagal 7 hari terakhir</span>` : ''}$${j.pending_gb ? `<span class="pill" style="margin:0">Meminta kuota $${j.pending_gb} GB</span>` : ''}</div>` : ''}
          <div class="sgrid g3">$${cell('Terpakai', fmtSize(j.used) + (qb ? ' / ' + fmtSize(qb) : ''))}$${cell('Kuota', u.is_owner ? 'Tanpa batas' : quotaLabel(u))}$${cell('File', fmtN(j.files))}$${cell('Folder', fmtN(j.folders))}$${cell('Tautan berbagi', fmtN(j.shares))}$${cell('Sampah', fmtSize(j.trash))}$${cell('Verifikasi wajah', u.face ? 'Aktif' : 'Nonaktif')}</div>
          <div class="sbar" style="height:10px;margin-top:16px">$${segs}</div><div class="legend">$${legend}</div>
          $${owner ? `<h3 class="h3">Sesi aktif ($${j.session_count})</h3><div class="acl" style="max-height:200px">$${sess}</div>` : `<div class="hint">Sesi aktif: $${j.session_count}</div>`}
          <h3 class="h3">Aktivitas terakhir</h3><div class="acl" style="max-height:220px">$${rec}</div>
          $${acts.length ? `<h3 class="h3">Tindakan</h3><div class="agrid">$${acts.map(a => `<button class="btn" data-ua="$${a[0]}">$${ic(a[1],17)}$${a[2]}</button>`).join('')}$${owner && !u.is_owner && !self ? `<button class="btn dng" data-ua="del">$${ic('trash',17)}Hapus pengguna</button>` : ''}</div>` : ''}
          <div class="actions"><button class="btn pri" data-uc>Tutup</button></div>`;
        const m = mm || modal('', 'big'), box = m.querySelector('.modal'); m._u = u; box.innerHTML = html;
        if (!m._h) {
          m._h = 1;
          box.addEventListener('click', async e => {
            if (e.target.closest('[data-uc]')) return m.remove();
            const ds = e.target.closest('[data-ds]');
            if (ds) { try { await api('admin/session-revoke', {id:ds.dataset.ds}); toast('Sesi dikeluarkan'); userDetail(m._u.id, m); } catch(er) { toast(er.message); } return; }
            const a = e.target.closest('[data-ua]'); if (!a) return;
            const cur = Object.assign({}, ADM.users.find(x => x.id === m._u.id) || {}, m._u);
            runUA(a.dataset.ua, cur, r => { if (r === 'gone') m.remove(); else userDetail(m._u.id, m); });
          });
        }
      }

      /* ---------- Permintaan ---------- */
      async function admRequests(body, my) {
        const [ur, qr] = await Promise.all([api('requests'), api('quota-requests')]); if (my !== ADM.seq) return;
        const owner = !!S.me.is_owner;
        const st = r => r.status === 'pending' ? '' : r.status === 'approved' ? '<em class="pill ok">disetujui</em>' : '<em class="pill warn">ditolak</em>';
        const uRows = ur.requests.map(r => `<div class="lrow rq">$${av2(r.username)}<div class="un"><b>$${esc(r.username)} $${st(r)}</b><small>Diajukan admin $${esc(r.requester)} · $${ago(r.created)}</small></div><div class="btns">$${r.status !== 'pending' ? '' : owner ? `<button class="btn sm" data-adm="rq" data-k="u" data-op="rj" data-v="$${r.id}">Tolak</button><button class="btn pri sm" data-adm="rq" data-k="u" data-op="ap" data-v="$${r.id}">Setujui</button>` : `<button class="btn sm" data-adm="rq" data-k="u" data-op="cx" data-v="$${r.id}">Batalkan</button>`}</div></div>`).join('') || emptyBox('userPlus', 'Belum ada permintaan', 'Permintaan pengguna baru dari admin tampil di sini.');
        const qRows = qr.requests.map(r => `<div class="lrow rq"><span class="av2" style="--h:$${hueOf(r.target)}">$${ic('drive',18)}</span><div class="un"><b>$${esc(r.target)} · $${fmtGB(r.requested_gb)} $${st(r)}$${r.status==='approved' && r.granted_gb != null ? '<small style="display:inline;margin-left:6px">(diberi ' + fmtGB(r.granted_gb) + ')</small>' : ''}</b><small>$${r.target !== r.requester ? 'Diajukan ' + esc(r.requester) + ' · ' : ''}$${ago(r.created)}$${r.note ? ' · “' + esc(r.note) + '”' : ''}</small></div><div class="btns">$${r.status !== 'pending' ? '' : owner ? `<button class="btn sm" data-adm="rq" data-k="q" data-op="rj" data-v="$${r.id}">Tolak</button><button class="btn sm" data-adm="rq" data-k="q" data-op="ao" data-v="$${r.id}">Atur…</button><button class="btn pri sm" data-adm="rq" data-k="q" data-op="ap" data-v="$${r.id}">Setujui</button>` : (r.requested_by === S.me.id ? `<button class="btn sm" data-adm="rq" data-k="q" data-op="cx" data-v="$${r.id}">Batalkan</button>` : '')}</div></div>`).join('') || emptyBox('drive', 'Belum ada permintaan kuota', 'Pengguna dan admin bisa mengajukan tambahan kuota dari menu akun.');
        ADM.ur = ur.requests; ADM.qr = qr.requests;
        const pu = ur.requests.filter(r => r.status === 'pending').length, pq = qr.requests.filter(r => r.status === 'pending').length;
        body.innerHTML = `<div class="pgrid" style="margin-top:0"><div class="c6">$${panel('Pengguna baru', `<div style="margin:-14px -18px -18px">$${uRows}</div>`, pu ? `<span class="pill" style="margin:0">$${pu} menunggu</span>` : '', '')}</div><div class="c6">$${panel('Kuota', `<div style="margin:-14px -18px -18px">$${qRows}</div>`, pq ? `<span class="pill" style="margin:0">$${pq} menunggu</span>` : '', '')}</div></div>` +
          (owner ? '' : '<p class="hint">Keputusan atas permintaan dibuat oleh owner. Anda mendapat notifikasi saat permintaan diproses.</p>');
      }
      async function reqOp(k, op, id) {
        try {
          if (k === 'u') {
            const r = ADM.ur.find(x => x.id === id);
            if (op === 'ap') { const dq = (S.limits || {}).default_quota_gb; const v = await ask('Kuota untuk ' + r.username + ' (GB). 0 = tanpa batas, kosong = ' + (dq != null ? 'kuota bawaan ' + fmtGB(dq) : 'atur nanti'), '', 'Setujui'); if (v === null) return; await api('requests/approve', {id, quota_gb:v.trim()}); toast('Pengguna dibuat'); }
            else if (op === 'rj') { await api('requests/reject', {id}); toast('Permintaan ditolak'); }
            else { await api('requests/cancel', {id}); toast('Permintaan dibatalkan'); }
          } else {
            const r = ADM.qr.find(x => x.id === id);
            if (op === 'ap') { await api('quota-requests/approve', {id}); toast('Kuota disetujui'); }
            else if (op === 'ao') { const v = await ask('Kuota untuk ' + r.target + ' (GB). 0 = tanpa batas', String(r.requested_gb), 'Setujui'); if (v === null) return; await api('quota-requests/approve', {id, quota_gb:v.trim()}); toast('Kuota disetujui'); }
            else if (op === 'rj') { const v = await ask('Alasan penolakan (opsional)', '', 'Tolak'); if (v === null) return; await api('quota-requests/reject', {id, reason:v.trim()}); toast('Permintaan ditolak'); }
            else { await api('quota-requests/cancel', {id}); toast('Permintaan dibatalkan'); }
          }
        } catch(e) { toast(e.message); }
        ADM.draw(true); pollNotif(); refreshMe();
      }

      /* ---------- Aktivitas ---------- */
      async function admActivity(body, my) {
        const us = (await api('users')).users; if (my !== ADM.seq) return;
        const a = ADM.act;
        body.innerHTML = `<div class="toolbar"><select id="acU"><option value="">Semua pengguna</option>$${us.map(u => `<option value="$${u.id}">$${esc(u.username)}</option>`).join('')}</select><select id="acA"><option value="">Semua aksi</option>$${Object.entries(ACT).map(([k, v]) => `<option value="$${k}">$${v[1]}</option>`).join('')}</select><div class="tsearch">$${ic('search',16)}<input type="text" id="acQ" placeholder="Cari detail…" autocomplete="off" value="$${esc(a.q)}"></div><span class="grow"></span><button class="btn" data-adm="act-export">$${ic('download',16)}Ekspor CSV</button></div><div class="panel nopad"><div id="acL" class="acl" style="max-height:none;margin:0"></div><div id="acM" class="acmore"></div></div>`;
        $$('#acU').value = a.user; $$('#acA').value = a.action;
        await actLoad(true);
      }
      function actQS(extra) {
        const a = ADM.act, qs = new URLSearchParams({all:'1'}); if (a.user) qs.set('user', a.user); if (a.action) qs.set('action', a.action); if (a.q) qs.set('q', a.q);
        for (const k in (extra || {})) qs.set(k, extra[k]); return qs;
      }
      async function actLoad(reset) {
        const a = ADM.act; if (reset) { a.items = []; a.next = null; }
        const j = await api('activity?' + actQS(Object.assign({limit:'60'}, !reset && a.next ? {before:a.next} : {})));
        if (S.view !== 'admin' || ADM.tab !== 'activity') return;
        a.items = a.items.concat(j.items); a.more = j.more; a.next = j.next; drawAct();
      }
      function drawAct() {
        const l = $$('#acL'); if (!l) return;
        l.innerHTML = ADM.act.items.map(a => { const x = ACT[a.action] || ['info', a.action]; return `<div class="a $${a.action==='login_fail'?'bad':''}" style="padding:10px 16px"><span class="ai">$${ic(x[0],18)}</span><div class="at"><b>$${x[1]}</b><span>$${esc(a.who)} · $${esc(a.detail||'')}</span></div><span class="ts" title="$${esc(fmtDT(a.ts))}">$${ago(a.ts)}</span></div>`; }).join('') || emptyBox('pulse', 'Tidak ada aktivitas', 'Ubah filter untuk melihat catatan lain.');
        $$('#acM').innerHTML = ADM.act.more ? '<button class="btn" data-adm="act-more">Muat lebih banyak</button>' : '';
      }

