          if (a.is_folder !== b.is_folder) return a.is_folder ? -1 : 1;
          const r = by==='size' ? a.size-b.size : by==='modified' ? a.modified-b.modified : a.name.localeCompare(b.name,'id',{numeric:true,sensitivity:'base'});
          return r*dir;
        });
      }
      function applyFilter(items) {
        if (S.filter==='all' || !FILTERABLE.includes(S.view)) return items;
