# HomeDrive - satu file saja (app.py + index.html sudah tertanam di sini)
#
# Baru: kuota wajib diatur owner sebelum admin/pengguna bisa unggah, notifikasi real-time,
#       permintaan kuota ke owner, peringatan penyimpanan penuh, tampilan update otomatis (tanpa reload).
#
# Baru lagi (v2): analisis penyimpanan per folder, ekstrak ZIP di server, info ukuran folder, slideshow foto,
#       tempel gambar (Ctrl+V) untuk unggah, halaman Sistem & cadangan database (owner), pembersih file yatim,
#       log aktivitas semua pengguna (admin), PWA (bisa dipasang di HP, butuh HTTPS/localhost).
#
# Fitur owner: Pusat kendali (pengumuman banner + notifikasi massal, mode pemeliharaan hanya-baca, cadangan
#       otomatis terjadwal + unduh, daftar & cabut semua tautan berbagi), nonaktifkan akun, paksa keluar perangkat.
#
# Edisi NATAL (v3): tema merah-hijau, salju turun, lampu hias, hitung mundur Natal/Tahun Baru,
#       Kartu Ucapan Natal dari foto (bingkai permen, simpan ke Drive), Kado Berwaktu (tautan berbagi
#       yang baru bisa dibuka pada tanggal tertentu, dengan hitung mundur), konfeti saat unggah selesai,
#       template pengumuman Natal untuk owner. Semua dekorasi bisa dimatikan di menu akun > Pengaturan Natal.
#
# Jalankan:   docker compose up -d
# Buka:       http://IP-SERVER:8080   (lalu buat akun admin pertama)
# Perbarui:   unduh ulang file ini, lalu  docker compose up -d --force-recreate
#
# Butuh Docker Compose v2.23+ (fitur configs.content). Cek: docker compose version
services:
  homedrive:
    image: python:3.12-alpine
    container_name: homedrive
    restart: unless-stopped
    working_dir: /app
    command: ["python", "/app/app.py"]
    ports:
      - "8080:8080"
    volumes:
      # Ganti sisi kiri dengan folder/disk tempat Anda ingin menyimpan file
      - ./data:/data
    environment:
      DATA_DIR: /data
      HOST: 0.0.0.0
      PORT: "8080"
      PYTHONUNBUFFERED: "1"
      REQUIRE_QUOTA: "1"   # 1 = admin & pengguna belum bisa unggah sebelum owner mengatur kuotanya (owner selalu bisa)
      QUOTA_GB: "0"        # kuota bawaan, hanya dipakai jika REQUIRE_QUOTA="0"
      TRASH_DAYS: "30"     # sampah dikosongkan otomatis setelah N hari, 0 = jangan hapus otomatis
      COOKIE_SECURE: "0"   # ubah ke "1" jika diakses lewat HTTPS
      BACKUP_HOURS: "24"   # cadangan database otomatis tiap N jam (disimpan di data/backups), 0 = nonaktif
      BACKUP_KEEP: "7"     # jumlah cadangan otomatis yang disimpan
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    configs:
      - source: app_py
        target: /app/app.py
      - source: index_html
        target: /app/index.html

configs:
  app_py:
    content: |
      #!/usr/bin/env python3
      """HomeDrive - penyimpanan file pribadi ala Google Drive.

      Hanya memakai pustaka standar Python (3.9+). Tidak perlu pip install.
      Konfigurasi lewat environment variable:
        HOST=0.0.0.0  PORT=8080  DATA_DIR=./data  QUOTA_GB=0 (0 = tanpa batas)
        COOKIE_SECURE=0 (set 1 bila diakses lewat HTTPS)  TRASH_DAYS=30 (0 = jangan hapus otomatis)
              REQUIRE_QUOTA=1 (1 = admin & pengguna belum bisa unggah sebelum owner mengatur kuotanya)
      """
      import collections
      import csv
      import gzip
      import io
      import hashlib
      import hmac
      import json
      import mimetypes
      import os
      import re
      import secrets
      import shutil
      import sqlite3
      import sys
      import tempfile
      import threading
      import time
      import uuid
      import zipfile
      from html import escape as h
      from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
      from pathlib import Path
      from urllib.parse import parse_qs, quote, urlparse

      BASE = Path(__file__).resolve().parent
      HOST = os.environ.get("HOST", "0.0.0.0")
      PORT = int(os.environ.get("PORT", "8080"))
      DATA = Path(os.environ.get("DATA_DIR", BASE / "data")).resolve()
      QUOTA = int(float(os.environ.get("QUOTA_GB", "0")) * 1024**3)
      TRASH_DAYS = int(os.environ.get("TRASH_DAYS", "30"))
      COOKIE_SECURE = os.environ.get("COOKIE_SECURE", "0") == "1"
      REQUIRE_QUOTA = os.environ.get("REQUIRE_QUOTA", "1") == "1"
      DISK_RESERVE = 64 * 1024 * 1024  # sisakan ruang disk server
      APP_VERSION = "3.0 Natal"
      START = time.time()
      BACKUP_HOURS = float(os.environ.get("BACKUP_HOURS", "24"))
      BACKUP_KEEP = max(1, int(os.environ.get("BACKUP_KEEP", "7")))
      RUNTIME = {"maintenance": False, "announcement": "", "max_upload_mb": 0, "default_quota": None, "trash_days": None, "allow_share": True}  # pengaturan owner yang dibaca di tiap permintaan
      BLOBS = DATA / "blobs"
      TMP = DATA / "tmp"
      BACKUPS = DATA / "backups"
      DB_PATH = DATA / "drive.db"
      SESSION_DAYS = 30
      CHUNK = 1 << 20
      SPEED_VIEW = memoryview(os.urandom(CHUNK))  # data acak untuk tes kecepatan

      for d in (DATA, BLOBS, TMP, BACKUPS):
          d.mkdir(parents=True, exist_ok=True)

      _key = DATA / "secret.key"
      if not _key.exists():
          _key.write_bytes(secrets.token_bytes(32))
          os.chmod(_key, 0o600)
      SECRET = _key.read_bytes()

      # Tipe yang aman ditampilkan inline di browser (selain itu dipaksa unduh).
      INLINE_OK = re.compile(r"^(image/(png|jpeg|gif|webp|avif|bmp)|application/pdf|video/|audio/|text/plain)")

      MIME_OVERRIDE = {
          "mkv": "video/x-matroska", "mov": "video/quicktime", "m4v": "video/mp4", "mp4": "video/mp4",
          "webm": "video/webm", "avi": "video/x-msvideo", "3gp": "video/3gpp", "ts": "video/mp2t",
          "heic": "image/heic", "heif": "image/heif", "webp": "image/webp", "avif": "image/avif",
          "docx": "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
          "xlsx": "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
          "pptx": "application/vnd.openxmlformats-officedocument.presentationml.presentation",
          "md": "text/markdown", "csv": "text/csv", "svg": "image/svg+xml",
      }


      def guess_mime(name):
          ext = name.rsplit(".", 1)[-1].lower() if "." in name else ""
          return MIME_OVERRIDE.get(ext) or mimetypes.guess_type(name)[0] or "application/octet-stream"


      CATEGORIES = {
          "photos": (["image/%"], ["jpg", "jpeg", "png", "gif", "webp", "avif", "bmp", "heic", "heif", "tiff", "svg", "raw", "dng"]),
          "videos": (["video/%"], ["mp4", "mkv", "mov", "webm", "avi", "m4v", "3gp", "wmv", "flv", "mpg", "mpeg"]),
          "documents": (["text/%", "application/pdf", "application/msword", "application/rtf", "application/vnd.%"],
                        ["pdf", "doc", "docx", "xls", "xlsx", "ppt", "pptx", "odt", "ods", "odp", "txt", "md", "rtf", "csv", "epub"]),
      }
      AUDIO_EXT = ("mp3", "wav", "flac", "m4a", "ogg", "aac", "opus", "wma")
      CATEGORIES["audio"] = (["audio/%"], list(AUDIO_EXT))


      def category_where(cat):
          pfx, exts = CATEGORIES[cat]
          sql = "(" + " OR ".join(["mime LIKE ?"] * len(pfx) + ["LOWER(name) LIKE ?"] * len(exts)) + ")"
          return sql, pfx + ["%." + e for e in exts]


      def classify(name, mime):
          ext = name.rsplit(".", 1)[-1].lower() if "." in name else ""
          mime = mime or ""
          if mime.startswith("image/") or ext in CATEGORIES["photos"][1]:
              return "photos"
          if mime.startswith("video/") or ext in CATEGORIES["videos"][1]:
              return "videos"
          if mime.startswith("audio/") or ext in AUDIO_EXT:
              return "audio"
          if mime.startswith("text/") or mime == "application/pdf" or mime.startswith("application/vnd.") or ext in CATEGORIES["documents"][1]:
              return "documents"
          return "other"


      # ---------------------------------------------------------------- database
      def db():
          c = sqlite3.connect(DB_PATH, timeout=30)
          c.row_factory = sqlite3.Row
          c.execute("PRAGMA foreign_keys=ON")
          c.execute("PRAGMA synchronous=NORMAL")
          return c


      def init_db():
          with db() as c:
              c.execute("PRAGMA journal_mode=WAL")
              c.executescript(
                  """
                  CREATE TABLE IF NOT EXISTS users(
                    id INTEGER PRIMARY KEY, username TEXT UNIQUE NOT NULL COLLATE NOCASE,
                    pw_hash TEXT NOT NULL, salt TEXT NOT NULL, is_admin INTEGER DEFAULT 0,
                    created REAL NOT NULL);
                  CREATE TABLE IF NOT EXISTS sessions(
                    token_hash TEXT PRIMARY KEY, user_id INTEGER NOT NULL, expires REAL NOT NULL);
                  CREATE TABLE IF NOT EXISTS items(
                    id TEXT PRIMARY KEY, user_id INTEGER NOT NULL, parent_id TEXT,
                    name TEXT NOT NULL, is_folder INTEGER NOT NULL, size INTEGER DEFAULT 0,
                    mime TEXT, created REAL NOT NULL, modified REAL NOT NULL,
                    trashed INTEGER DEFAULT 0, starred INTEGER DEFAULT 0);
                  CREATE INDEX IF NOT EXISTS ix_items_parent ON items(user_id, parent_id);
                  CREATE TABLE IF NOT EXISTS shares(
                    token TEXT PRIMARY KEY, item_id TEXT NOT NULL, created REAL NOT NULL);
                  """
              )
              for col, typ in (("expires", "REAL"), ("pw_hash", "TEXT"), ("salt", "TEXT")):
                  try:
                      c.execute(f"ALTER TABLE shares ADD COLUMN {col} {typ}")
                  except sqlite3.OperationalError:
                      pass
              for tbl, col, typ in (("items", "color", "TEXT"), ("items", "trashed_at", "REAL"),
                                    ("users", "quota_gb", "REAL"), ("shares", "views", "INTEGER DEFAULT 0"),
                                    ("sessions", "ua", "TEXT"), ("sessions", "ip", "TEXT"),
                                    ("sessions", "created", "REAL"), ("sessions", "last_seen", "REAL"),
                                    ("users", "is_owner", "INTEGER DEFAULT 0"),
                                      ("users", "warn_level", "INTEGER DEFAULT 0"), ("users", "disabled", "INTEGER DEFAULT 0"),
                                    ("users", "face", "TEXT"), ("users", "face_codes", "TEXT"), ("users", "face_at", "REAL"),
                                    ("shares", "unlock", "REAL")):
                  try:
                      c.execute(f"ALTER TABLE {tbl} ADD COLUMN {col} {typ}")
                  except sqlite3.OperationalError:
                      pass
              c.execute("CREATE TABLE IF NOT EXISTS user_requests(id INTEGER PRIMARY KEY, requested_by INTEGER NOT NULL, "
                        "username TEXT NOT NULL COLLATE NOCASE, pw_hash TEXT NOT NULL, salt TEXT NOT NULL, "
                        "status TEXT NOT NULL DEFAULT 'pending', created REAL NOT NULL, decided REAL)")
              # instalasi lama: admin pertama otomatis menjadi owner
              if not c.execute("SELECT 1 FROM users WHERE is_owner=1").fetchone():
                  c.execute("UPDATE users SET is_owner=1, is_admin=1 WHERE id=(SELECT MIN(id) FROM users WHERE is_admin=1)")
              c.execute("CREATE TABLE IF NOT EXISTS activity(id INTEGER PRIMARY KEY, user_id INTEGER NOT NULL, "
                        "action TEXT NOT NULL, detail TEXT, ts REAL NOT NULL)")
              c.execute("CREATE INDEX IF NOT EXISTS ix_act ON activity(user_id, ts)")
              c.execute("CREATE TABLE IF NOT EXISTS notifications(id INTEGER PRIMARY KEY, user_id INTEGER NOT NULL, kind TEXT NOT NULL, "
                        "title TEXT NOT NULL, body TEXT, ref INTEGER, created REAL NOT NULL, is_read INTEGER DEFAULT 0)")
              c.execute("CREATE INDEX IF NOT EXISTS ix_notif ON notifications(user_id, is_read, id)")
              c.execute("CREATE TABLE IF NOT EXISTS quota_requests(id INTEGER PRIMARY KEY, user_id INTEGER NOT NULL, requested_by INTEGER NOT NULL, "
                        "requested_gb REAL NOT NULL, note TEXT, status TEXT NOT NULL DEFAULT 'pending', created REAL NOT NULL, "
                        "decided REAL, granted_gb REAL)")
              # indeks tambahan agar daftar, folder bersarang, dan hitung pemakaian tetap cepat
              c.execute("CREATE INDEX IF NOT EXISTS ix_items_pid ON items(parent_id)")
              c.execute("CREATE INDEX IF NOT EXISTS ix_items_user ON items(user_id, is_folder, trashed)")
              c.execute("CREATE INDEX IF NOT EXISTS ix_shares_item ON shares(item_id)")
              c.execute("CREATE INDEX IF NOT EXISTS ix_sessions_user ON sessions(user_id)")
              c.execute("UPDATE items SET trashed_at=? WHERE trashed=1 AND trashed_at IS NULL", (time.time(),))
              c.execute("CREATE TABLE IF NOT EXISTS settings(k TEXT PRIMARY KEY, v TEXT)")
              RUNTIME["maintenance"] = get_setting(c, "maintenance") == "1"
              RUNTIME["announcement"] = get_setting(c, "announcement")
              try:
                  RUNTIME["max_upload_mb"] = max(0, int(float(get_setting(c, "max_upload_mb") or 0)))
                  dq = get_setting(c, "default_quota_gb")
                  RUNTIME["default_quota"] = float(dq) if dq != "" else None
                  td = get_setting(c, "trash_days")
                  RUNTIME["trash_days"] = int(td) if td != "" else None
              except ValueError:
                  pass
              RUNTIME["allow_share"] = get_setting(c, "allow_share", "1") != "0"


      def log(c, uid, action, detail=""):
          c.execute("INSERT INTO activity(user_id,action,detail,ts) VALUES(?,?,?,?)", (uid, action, (detail or "")[:200], time.time()))


      def get_setting(c, k, default=""):
          r = c.execute("SELECT v FROM settings WHERE k=?", (k,)).fetchone()
          return r["v"] if r else default


      def set_setting(c, k, v):
          c.execute("INSERT INTO settings(k,v) VALUES(?,?) ON CONFLICT(k) DO UPDATE SET v=excluded.v", (k, v))


      def trash_days():
          return TRASH_DAYS if RUNTIME["trash_days"] is None else RUNTIME["trash_days"]


      def with_default_quota(v):
          """Kuota kosong (None) memakai kuota bawaan yang diatur owner, bila ada."""
          return v if v is not None else RUNTIME["default_quota"]


      def make_backup(prefix):
          """Salinan konsisten database (SQLite backup API) ke DATA/backups."""
          stamp = time.strftime("%Y%m%d-%H%M%S", time.localtime())
          path = BACKUPS / f"{prefix}-{stamp}.db"
          src = db()
          dst = sqlite3.connect(path)
          try:
              src.backup(dst)
          finally:
              dst.close()
              src.close()
          os.chmod(path, 0o600)
          return path


      def prune_backups():
          autos = sorted(BACKUPS.glob("auto-*.db"), key=lambda p: p.stat().st_mtime)
          for p in autos[:-BACKUP_KEEP]:
              p.unlink(missing_ok=True)


      def list_backups():
          out = []
          for p in BACKUPS.glob("*.db"):
              try:
                  st = p.stat()
                  out.append({"name": p.name, "size": st.st_size, "ts": st.st_mtime})
              except OSError:
                  pass
          return sorted(out, key=lambda x: x["ts"], reverse=True)

      # ---------------------------------------------------------------- utils
      def hash_pw(password, salt):
          return hashlib.pbkdf2_hmac("sha256", password.encode(), bytes.fromhex(salt), 200_000).hex()


      def make_user(c, username, password, is_admin=False, is_owner=False, quota_gb=None):
          salt = secrets.token_hex(16)
          c.execute(
              "INSERT INTO users(username,pw_hash,salt,is_admin,created,is_owner,quota_gb) VALUES(?,?,?,?,?,?,?)",
              (username, hash_pw(password, salt), salt, int(bool(is_admin or is_owner)), time.time(), int(is_owner), quota_gb),
          )


      def tok_hash(t):
          return hashlib.sha256(t.encode()).hexdigest()


      FAILS = {}


      def too_many_fails(key):
          now = time.time()
          FAILS[key] = [t for t in FAILS.get(key, []) if now - t < 300]
          return len(FAILS[key]) >= 10


      FACE_TICKETS = {}      # tiket login tahap 2: token -> {uid, exp, tries}
      FACE_THRESHOLD = 0.5   # jarak Euclid maksimum antar-deskriptor (face-api: makin kecil makin mirip)


      def face_valid(d):
          return (isinstance(d, list) and len(d) == 128
                  and all(isinstance(x, (int, float)) and not isinstance(x, bool) and abs(x) < 10 for x in d))


      def face_dist(a, b):
          return sum((x - y) ** 2 for x, y in zip(a, b)) ** 0.5


      def face_match(samples, probe):
          return bool(samples) and min(face_dist(x, probe) for x in samples) < FACE_THRESHOLD


      def face_new_codes():
          plain = ["-".join(secrets.token_hex(2).upper() for _ in range(3)) for _ in range(8)]
          salt = secrets.token_hex(16)
          return plain, json.dumps({"salt": salt, "h": [hash_pw(c.replace("-", ""), salt) for c in plain]})


      def face_take_code(raw, code):
          """Cocokkan kode pemulihan; mengembalikan JSON baru tanpa kode yang dipakai, atau None."""
          try:
              o = json.loads(raw or "")
          except ValueError:
              return None
          h = hash_pw((code or "").upper().replace("-", "").replace(" ", ""), o["salt"])
          for x in o["h"]:
              if hmac.compare_digest(x, h):
                  o["h"].remove(x)
                  return json.dumps(o)
          return None


      class ApiError(Exception):
          def __init__(self, status, msg, code=None):
              self.status, self.msg, self.code = status, msg, code


      def clean_name(name):
          name = (name or "").replace("\x00", "").strip()
          name = re.sub(r"[\\/]", "_", name)
          if not name or name in (".", ".."):
              raise ApiError(400, "Nama tidak valid")
          return name[:255]


      def unique_name(c, uid, parent, name):
          def exists(n):
              return c.execute("SELECT 1 FROM items WHERE user_id=? AND parent_id IS ? AND trashed=0 AND name=? COLLATE NOCASE",
                               (uid, parent, n)).fetchone()
          if not exists(name):
              return name
          stem, dot, ext = name.rpartition(".")
          if not dot or not stem:
              stem, ext = name, ""
          else:
              ext = "." + ext
          i = 1
          while exists(f"{stem} ({i}){ext}"):
              i += 1
          return f"{stem} ({i}){ext}"


      def descendants(c, ids):
          if not ids:
              return []
          q = ",".join("?" * len(ids))
          rows = c.execute(
              f"""WITH RECURSIVE t(id) AS (
                    SELECT id FROM items WHERE id IN ({q})
                    UNION ALL SELECT i.id FROM items i JOIN t ON i.parent_id=t.id)
                  SELECT id FROM t""", list(ids)).fetchall()
          return [r["id"] for r in rows]


      def item_dict(r, shared=()):
          return {
              "id": r["id"], "parent_id": r["parent_id"], "name": r["name"],
              "is_folder": bool(r["is_folder"]), "size": r["size"], "mime": r["mime"],
              "created": r["created"], "modified": r["modified"],
              "starred": bool(r["starred"]), "trashed": bool(r["trashed"]), "shared": r["id"] in shared,
              "color": r["color"], "trashed_at": r["trashed_at"],
          }


      def fmt_size(n):
          for u in ("B", "KB", "MB", "GB", "TB"):
              if n < 1024 or u == "TB":
                  return f"{n:.0f} {u}" if u == "B" else f"{n:.1f} {u}"
              n /= 1024


      def in_tree(c, root_id, item_id):
          """True jika item_id sama dengan / berada di bawah root_id."""
          cur, hops = item_id, 0
          while cur and hops < 200:
              if cur == root_id:
                  return True
              r = c.execute("SELECT parent_id FROM items WHERE id=?", (cur,)).fetchone()
              cur = r["parent_id"] if r else None
              hops += 1
          return False


      # ---------------------------------------------------------------- pembaruan langsung, notifikasi, kuota
      class Bus:
          """Bus event untuk Server-Sent Events: browser diperbarui otomatis tanpa reload."""

          def __init__(self):
              self.cv = threading.Condition()
              self.seq = 0
              self.log = collections.deque(maxlen=1000)
              self.tl = threading.local()

          def emit(self, topic, uid=None, origin=None):
              """Antrekan event (uid=None -> semua pengguna). Baru dikirim saat flush(), setelah DB di-commit."""
              if not hasattr(self.tl, "p"):
                  self.tl.p = []
              self.tl.p.append((topic, uid, origin))

          def flush(self):
              p = getattr(self.tl, "p", None)
              if not p:
                  return
              self.tl.p = []
              with self.cv:
                  for t, uid, o in p:
                      self.seq += 1
                      self.log.append((self.seq, t, uid, o))
                  self.cv.notify_all()

          def wait(self, seq, timeout):
              with self.cv:
                  if self.seq == seq:
                      self.cv.wait(timeout)

          def since(self, seq, uid, cid):
              with self.cv:
                  cur = self.seq
                  if cur == seq:
                      return cur, set()
                  if self.log and self.log[0][0] > seq + 1:  # ketinggalan terlalu jauh: segarkan semuanya
                      return cur, {"files", "notify", "users"}
                  return cur, {t for s, t, u, o in self.log if s > seq and (u is None or u == uid) and not (o and o == cid)}


      EVENTS = Bus()


      def parse_gb(v):
          """Kosong/None = belum diatur, 0 = tanpa batas, angka lain = batas dalam GB."""
          if v is None or (isinstance(v, str) and not v.strip()):
              return None
          try:
              g = float(str(v).strip().replace(",", "."))
          except ValueError:
              raise ApiError(400, "Kuota tidak valid")
          if g != g or g < 0 or g > 1_000_000:
              raise ApiError(400, "Kuota tidak valid")
          return g


      def fmt_gb(g):
          return "tanpa batas" if not g else f"{g:g} GB"


      def notify(c, uid, kind, title, body="", ref=None):
          c.execute("INSERT INTO notifications(user_id,kind,title,body,ref,created) VALUES(?,?,?,?,?,?)",
                    (uid, kind, title[:120], (body or "")[:300], ref, time.time()))
          c.execute("DELETE FROM notifications WHERE user_id=? AND id NOT IN "
                    "(SELECT id FROM notifications WHERE user_id=? ORDER BY id DESC LIMIT 200)", (uid, uid))
          EVENTS.emit("notify", uid)


      def notify_owners(c, kind, title, body="", ref=None):
          for r in c.execute("SELECT id FROM users WHERE is_owner=1").fetchall():
              notify(c, r["id"], kind, title, body, ref)


      def sync_warn(c, uid):
          """Hitung tingkat keterisian (80% / 90% / penuh) dan kirim peringatan sekali per tingkat. Owner dikecualikan."""
          u = c.execute("SELECT id,username,is_owner,quota_gb,warn_level FROM users WHERE id=?", (uid,)).fetchone()
          if not u or u["is_owner"]:
              return
          qt = int(u["quota_gb"] * 1024**3) if u["quota_gb"] is not None else (0 if REQUIRE_QUOTA else QUOTA)
          used = c.execute("SELECT COALESCE(SUM(size),0) s FROM items WHERE user_id=? AND is_folder=0", (uid,)).fetchone()["s"]
          pct = used / qt * 100 if qt else 0
          level = 3 if pct >= 100 else 2 if pct >= 90 else 1 if pct >= 80 else 0
          old = u["warn_level"] or 0
          if level == old:
              return
          c.execute("UPDATE users SET warn_level=? WHERE id=?", (level, uid))
          if level <= old:
              return  # turun (file dihapus / kuota dinaikkan): cukup reset, tanpa notifikasi
          info = f"Terpakai {fmt_size(used)} dari {fmt_size(qt)} ({min(pct, 100):.0f}%)."
          if level == 1:
              notify(c, uid, "storage", "Penyimpanan mulai penuh", info + " Pertimbangkan membersihkan file atau meminta tambahan kuota.")
          elif level == 2:
              notify(c, uid, "storage", "Penyimpanan hampir penuh", info + " Segera hapus file yang tidak perlu atau minta tambahan kuota ke owner.")
          else:
              notify(c, uid, "storage", "Penyimpanan penuh", info + " Anda tidak bisa mengunggah lagi sampai ada ruang kosong atau kuota ditambah.")
              notify_owners(c, "storage_full", f"Penyimpanan {u['username']} penuh", info + " Atur kuota di Kelola pengguna jika perlu.", uid)


      # ---------------------------------------------------------------- halaman publik (berbagi)
      SHARE_CSS = """
