      @media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#08090f;--surface:#12141d;--s2:#1a1d29;--line:rgba(255,255,255,.08);--text:#eceef8;--muted:#8d93ad;
        --sh:0 32px 80px -24px rgba(0,0,0,.85),0 10px 28px -12px rgba(0,0,0,.6);--sh2:0 1px 1px rgba(0,0,0,.4),0 10px 26px -14px rgba(0,0,0,.7)}}
      body{letter-spacing:-.006em;background:
        radial-gradient(1000px 600px at -8% -14%,color-mix(in srgb,var(--acc2) 20%,transparent),transparent 62%),
        radial-gradient(900px 640px at 108% 4%,color-mix(in srgb,var(--acc) 14%,transparent),transparent 60%),
