          def api_activity(self, method, name, q):
              u = self.need_user()
              allq = q.get("all", [""])[0] == "1" and bool(u["is_admin"])
              export = allq and q.get("export", [""])[0] == "1"
              try:
                  limit = max(1, min(int(q.get("limit", ["150"])[0]), 5000 if export else 500))
              except ValueError:
                  limit = 150
              where, params = [], []
              if allq:
                  uf = q.get("user", [""])[0]
                  if uf.isdigit():
                      where.append("a.user_id=?")
                      params.append(int(uf))
              else:
                  where.append("a.user_id=?")
                  params.append(u["id"])
              act = q.get("action", [""])[0]
              if act:
                  where.append("a.action=?")
                  params.append(act[:30])
              term = q.get("q", [""])[0].strip()
              if term:
                  where.append("a.detail LIKE ? ESCAPE '\\'")
                  params.append("%" + term.replace("\\", "\\\\").replace("%", "\\%").replace("_", "\\_") + "%")
              before = q.get("before", [""])[0]
              if before.isdigit():
                  where.append("a.id<?")
                  params.append(int(before))
              sql = ("SELECT a.id,a.action,a.detail,a.ts,s.username AS who FROM activity a JOIN users s ON s.id=a.user_id"
                     + (" WHERE " + " AND ".join(where) if where else "") + " ORDER BY a.id DESC LIMIT ?")
              with db() as c:
                  rows = c.execute(sql, params + [limit + 1]).fetchall()
                  if export:
                      with_log = c
                      log(with_log, u["id"], "export", "Ekspor log aktivitas")
              more = len(rows) > limit
              rows = rows[:limit]
              if export:
                  buf = io.StringIO()
                  w = csv.writer(buf)
                  w.writerow(["waktu", "pengguna", "aksi", "detail"])
                  safe = lambda v: ("'" + v) if v[:1] in ("=", "+", "-", "@") else v
                  for r in rows:
                      w.writerow([time.strftime("%Y-%m-%d %H:%M:%S", time.localtime(r["ts"])), safe(r["who"]), r["action"], safe(r["detail"] or "")])
                  body = buf.getvalue().encode("utf-8-sig")
                  self._headers(200, "text/csv; charset=utf-8", len(body),
                                {"Content-Disposition": "attachment; filename=homedrive-aktivitas-%s.csv" % time.strftime("%Y%m%d-%H%M"), "Cache-Control": "no-store"})
                  if not self.head_only:
                      self.wfile.write(body)
                  return
              self.send_json({"items": [dict(r) for r in rows], "more": more, "next": rows[-1]["id"] if rows else None})

          def api_duplicates(self, method, name, q):
              u = self.need_user()
              with db() as c:
                  rows = c.execute(
                      "SELECT id,name,size,parent_id,modified FROM items WHERE user_id=? AND trashed=0 AND is_folder=0 AND size>0 AND size IN "
                      "(SELECT size FROM items WHERE user_id=? AND trashed=0 AND is_folder=0 AND size>0 GROUP BY size HAVING COUNT(*)>1) "
                      "ORDER BY size DESC LIMIT 1500", (u["id"], u["id"])).fetchall()
              groups = {}
              for r in rows:
                  path = BLOBS / r["id"]
                  if not path.exists():
                      continue
                  hs = hashlib.sha256()
                  with open(path, "rb") as f:
                      for chunk in iter(lambda: f.read(CHUNK), b""):
                          hs.update(chunk)
                  groups.setdefault((r["size"], hs.hexdigest()), []).append(dict(r))
              out = [{"size": k[0], "items": sorted(v, key=lambda x: x["modified"])} for k, v in groups.items() if len(v) > 1]
              out.sort(key=lambda g: g["size"] * (len(g["items"]) - 1), reverse=True)
              self.send_json({"groups": out[:200], "reclaim": sum(g["size"] * (len(g["items"]) - 1) for g in out)})

          # ---- info folder, analisis penyimpanan, ekstrak ZIP, sistem & cadangan
          def tree_sizes(self, c, uid):
              """Ukuran, jumlah file, dan jumlah subfolder rekursif untuk tiap folder aktif (bukan sampah)."""
              rows = c.execute("SELECT id,parent_id,name,is_folder,size FROM items WHERE user_id=? AND trashed=0", (uid,)).fetchall()
              kids = {}
              for r in rows:
                  kids.setdefault(r["parent_id"], []).append(r)
              order, stack = [], list(kids.get(None, []))
              while stack:
                  r = stack.pop()
                  order.append(r)
                  if r["is_folder"]:
                      stack.extend(kids.get(r["id"], []))
              agg = {}
              for r in reversed(order):  # anak selalu diproses sebelum induknya
                  if not r["is_folder"]:
                      continue
                  s = n = d = 0
                  for k in kids.get(r["id"], []):
                      if k["is_folder"]:
                          a = agg[k["id"]]
                          s += a[0]
                          n += a[1]
                          d += a[2] + 1
                      else:
                          s += k["size"]
                          n += 1
                  agg[r["id"]] = (s, n, d)
              return rows, agg

          def api_info(self, method, name, q):
              u = self.need_user()
              iid = q.get("id", [""])[0]
              with db() as c:
                  r = self.own_item(c, u["id"], iid)
                  if not r["is_folder"]:
                      return self.send_json({"is_folder": False, "size": r["size"]})
                  _, agg = self.tree_sizes(c, u["id"])
              s, n, d = agg.get(iid, (0, 0, 0))
              self.send_json({"is_folder": True, "size": s, "files": n, "folders": d})

          def api_analyze(self, method, name, q):
              """Folder dan file terbesar milik pengguna."""
              u = self.need_user()
              with db() as c:
                  rows, agg = self.tree_sizes(c, u["id"])
              by_id = {r["id"]: r for r in rows}

              def path(r):
                  parts, hops = [], 0
                  while r is not None and hops < 60:
                      parts.append(r["name"])
                      r = by_id.get(r["parent_id"])
                      hops += 1
                  return " / ".join(reversed(parts))

              top = sorted(((v[0], k) for k, v in agg.items()), reverse=True)[:25]
              big = sorted((r for r in rows if not r["is_folder"] and r["size"] > 0), key=lambda r: r["size"], reverse=True)[:15]
              self.send_json({
                  "folders": [{"id": k, "path": path(by_id[k]), "size": s, "files": agg[k][1]} for s, k in top if s > 0],
                  "files": [{"id": r["id"], "name": r["name"], "parent_id": r["parent_id"],
                             "path": path(by_id.get(r["parent_id"])) if r["parent_id"] else "", "size": r["size"]} for r in big],
              })

          def api_extract(self, method, name, q):
              """Ekstrak file .zip milik pengguna ke folder baru di sebelahnya (cek kuota & anti zip-slip)."""
              u = self.need_user()
              d = self.read_json()
              now = time.time()
              made = []
              try:
                  with db() as c:
                      uid = u["id"]
                      r = self.own_item(c, uid, d.get("id"))
                      if r["is_folder"] or r["trashed"] or not r["name"].lower().endswith(".zip") or not (BLOBS / r["id"]).exists():
                          raise ApiError(400, "Hanya file .zip yang bisa diekstrak")
                      try:
                          zf = zipfile.ZipFile(BLOBS / r["id"])
                      except zipfile.BadZipFile:
                          raise ApiError(400, "File ZIP rusak atau tidak valid")
                      with zf:
                          infos = zf.infolist()
                          if len(infos) > 5000:
                              raise ApiError(400, "ZIP berisi terlalu banyak entri (maks. 5000)")
                          self.ensure_space(c, u, sum(i.file_size for i in infos if not i.is_dir()))
                          root = unique_name(c, uid, r["parent_id"], r["name"][:-4] or "Ekstrak")
                          root_id = uuid.uuid4().hex
                          c.execute("INSERT INTO items(id,user_id,parent_id,name,is_folder,created,modified) VALUES(?,?,?,?,1,?,?)",
                                    (root_id, uid, r["parent_id"], root, now, now))
                          cache = {(): root_id}

                          def folder_for(parts):
                              key = tuple(parts)
                              if key in cache:
                                  return cache[key]
                              pid = folder_for(parts[:-1])
                              fid = uuid.uuid4().hex
                              c.execute("INSERT INTO items(id,user_id,parent_id,name,is_folder,created,modified) VALUES(?,?,?,?,1,?,?)",
                                        (fid, uid, pid, parts[-1], now, now))
                              cache[key] = fid
                              return fid

                          count = 0
                          for info in infos:
                              parts = []
                              for p in info.filename.replace("\\", "/").split("/"):
                                  if p in ("", ".", ".."):
                                      continue
                                  try:
                                      parts.append(clean_name(p))
                                  except ApiError:
                                      parts = []
                                      break
                              if not parts or parts[0] == "__MACOSX":
                                  continue
                              if info.is_dir():
                                  folder_for(parts)
                                  continue
                              pid = folder_for(parts[:-1])
                              nm = unique_name(c, uid, pid, parts[-1])
                              iid = uuid.uuid4().hex
                              tmp = TMP / iid
                              made.append(tmp)
                              written = 0
                              try:
                                  with zf.open(info) as src, open(tmp, "wb") as dst:
                                      while True:
                                          chunk = src.read(CHUNK)
                                          if not chunk:
                                              break
                                          written += len(chunk)
                                          if written > info.file_size:
                                              raise ApiError(400, "ZIP tidak valid (ukuran tidak cocok)")
                                          dst.write(chunk)
                              except (RuntimeError, NotImplementedError, zipfile.BadZipFile):
                                  raise ApiError(400, "ZIP terenkripsi atau rusak, tidak bisa diekstrak")
                              os.replace(tmp, BLOBS / iid)
                              made.append(BLOBS / iid)
                              c.execute("INSERT INTO items(id,user_id,parent_id,name,is_folder,size,mime,created,modified) VALUES(?,?,?,?,0,?,?,?,?)",
                                        (iid, uid, pid, nm, written, guess_mime(nm), now, now))
                              count += 1
                      log(c, uid, "extract", f"{r['name']} ({count} file)")
                      sync_warn(c, uid)
              except BaseException:
                  for p in made:
                      p.unlink(missing_ok=True)
                  raise
              self.send_json({"id": root_id, "name": root, "count": count})

          def sys_scan(self, c):
              rows = {r["id"]: r for r in c.execute(
                  "SELECT i.id,i.name,i.size,i.user_id,u.username FROM items i JOIN users u ON u.id=i.user_id WHERE i.is_folder=0").fetchall()}
              disk, now = {}, time.time()
              for p in BLOBS.iterdir():
                  try:
                      st = p.stat()
                      disk[p.name] = (st.st_size, st.st_mtime)
                  except OSError:
                      pass
              orphan = [k for k, v in disk.items() if k not in rows and now - v[1] > 600]  # >10 menit: bukan unggahan yang sedang berjalan
              missing = [k for k in rows if k not in disk]
              mism = [k for k in rows if k in disk and disk[k][0] != rows[k]["size"]]
              return rows, disk, orphan, missing, mism

          def api_system(self, method, name, q):
              """Kesehatan sistem & perawatan (khusus owner)."""
              u = self.need_user()
              if not u["is_owner"]:
                  raise ApiError(403, "Hanya owner")
              sub = name.split("/")[1] if "/" in name else ""
              with db() as c:
                  rows, disk, orphan, missing, mism = self.sys_scan(c)
                  if method == "POST":
                      self.read_json()
                      if sub == "cleanup":
                          freed = 0
                          for k in orphan:
                              freed += disk[k][0]
                              (BLOBS / k).unlink(missing_ok=True)
                          log(c, u["id"], "cleanup", f"{len(orphan)} file yatim, {fmt_size(freed)}")
                          return self.send_json({"ok": True, "removed": len(orphan), "freed": freed})
                      if sub == "drop-missing":
                          owners = {rows[k]["user_id"] for k in missing}
                          for k in missing:
                              c.execute("DELETE FROM shares WHERE item_id=?", (k,))
                              c.execute("DELETE FROM items WHERE id=?", (k,))
                          for o in owners:
                              sync_warn(c, o)
                          log(c, u["id"], "cleanup", f"{len(missing)} catatan tanpa file dihapus")
                          EVENTS.emit("files")
                          return self.send_json({"ok": True, "removed": len(missing)})
                      raise ApiError(404, "Endpoint tidak ada")
                  cnt = c.execute("SELECT COALESCE(SUM(is_folder=0),0) f, COALESCE(SUM(is_folder=1),0) d FROM items WHERE trashed=0").fetchone()
                  data = {
                      "version": APP_VERSION, "python": sys.version.split()[0], "uptime": time.time() - START,
                      "users": c.execute("SELECT COUNT(*) n FROM users").fetchone()["n"],
                      "files": cnt["f"], "folders": cnt["d"],
                      "shares": c.execute("SELECT COUNT(*) n FROM shares").fetchone()["n"],
                      "sessions": c.execute("SELECT COUNT(*) n FROM sessions WHERE expires>?", (time.time(),)).fetchone()["n"],
                      "trash": c.execute("SELECT COALESCE(SUM(size),0) s FROM items WHERE trashed=1 AND is_folder=0").fetchone()["s"],
                  }
              try:
                  du = shutil.disk_usage(DATA)
                  data["disk"] = {"total": du.total, "free": du.free, "used": du.used}
              except OSError:
                  data["disk"] = {"total": 0, "free": 0, "used": 0}
              try:
                  data["db_size"] = DB_PATH.stat().st_size
              except OSError:
                  data["db_size"] = 0
              data["blob_size"] = sum(v[0] for v in disk.values())
              data["orphans"] = {"count": len(orphan), "size": sum(disk[k][0] for k in orphan)}
              data["missing_count"] = len(missing)
              data["missing"] = [{"id": k, "name": rows[k]["name"], "user": rows[k]["username"]} for k in missing[:20]]
              data["mismatch"] = len(mism)
              self.send_json(data)

          def api_backup(self, method, name, q):
              """Unduh salinan konsisten database (akun, struktur folder, tautan). File asli ada di folder data/blobs."""
              u = self.need_user()
              if not u["is_owner"]:
                  raise ApiError(403, "Hanya owner")
              fn = q.get("file", [""])[0]
              if fn:
                  fp = BACKUPS / fn
                  if not re.fullmatch(r"(auto|manual)-\d{8}-\d{6}\.db", fn) or not fp.is_file():
                      raise ApiError(404, "Cadangan tidak ditemukan")
                  self._headers(200, "application/octet-stream", fp.stat().st_size,
                                {"Content-Disposition": f"attachment; filename={fn}", "Cache-Control": "no-store"})
                  if not self.head_only:
                      with open(fp, "rb") as f:
                          shutil.copyfileobj(f, self.wfile, CHUNK)
                  return
              tmp = TMP / ("backup-" + uuid.uuid4().hex)
              try:
                  src = db()
                  dst = sqlite3.connect(tmp)
                  try:
                      src.backup(dst)
                  finally:
                      dst.close()
                      src.close()
                  size = tmp.stat().st_size
                  stamp = time.strftime("%Y%m%d-%H%M", time.localtime())
                  with db() as c:
                      log(c, u["id"], "backup", f"{fmt_size(size)}")
                  self._headers(200, "application/octet-stream", size,
                                {"Content-Disposition": f"attachment; filename=homedrive-{stamp}.db", "Cache-Control": "no-store"})
                  if not self.head_only:
                      with open(tmp, "rb") as f:
                          shutil.copyfileobj(f, self.wfile, CHUNK)
              finally:
                  tmp.unlink(missing_ok=True)
