                      raise ApiError(404, "Endpoint tidak ada")
              self.send_json({"ok": True})

          # ---- panel admin & owner: ringkasan, detail pengguna, aksi massal, kebijakan, sesi
          def user_breakdown(self, c, uid):
              cats = {k: {"size": 0, "count": 0} for k in ("photos", "videos", "audio", "documents", "other")}
              trash = used = folders = 0
              for r in c.execute("SELECT name,mime,size,trashed,is_folder FROM items WHERE user_id=?", (uid,)).fetchall():
                  if r["is_folder"]:
                      if not r["trashed"]:
                          folders += 1
                      continue
                  used += r["size"]
                  if r["trashed"]:
                      trash += r["size"]
                  else:
                      k = cats[classify(r["name"], r["mime"])]
                      k["size"] += r["size"]
                      k["count"] += 1
              return cats, used, trash, folders

