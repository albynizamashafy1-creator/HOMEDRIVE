              <p id="authSub" style="color:var(--muted);margin:0 0 22px">Penyimpanan file pribadi di server rumah Anda.</p>
              <label class="lbl" for="au">Username</label><input type="text" id="au" autocomplete="username" required>
              <label class="lbl" for="ap">Password</label>
              <div class="pwrap"><input type="password" id="ap" autocomplete="current-password" required><button type="button" class="ibtn" id="pwEye" aria-label="Tampilkan password"></button></div>
              <div class="err" id="authErr"></div>
              <button class="btn pri" id="authBtn" style="width:100%">Masuk</button>
            </form>
          </div>
        </div>
      </div>

      <div id="app" class="hidden">
        <aside id="side">
          <div class="logo" style="padding:2px 6px 4px"><i id="sideLogo"></i>HomeDrive</div>
          <button id="newBtn"></button>
          <nav id="nav"></nav>
          <div class="sidefoot">
            <div class="storage" id="storage"></div>
            <div class="uchip" id="uchip"><span class="uav" id="uav"></span><div class="uinfo"><b id="uname"></b><small id="urole"></small></div><button class="ibtn" id="logoutBtn" title="Keluar" aria-label="Keluar"></button></div>
