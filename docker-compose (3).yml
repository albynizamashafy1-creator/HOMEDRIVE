      <body>

      <div id="auth" class="hidden">
        <div class="aw">
          <div class="abrand">
            <div class="logo"><i id="authLogo2"></i>HomeDrive</div>
            <div class="abody">
              <h2>Semua file Anda, aman di server sendiri.</h2>
              <p>Simpan, kelola, dan bagikan foto, video, dan dokumen tanpa bergantung pada layanan pihak ketiga.</p>
              <div class="afeat">
                <div><i id="af1"></i>Unggah dari HP atau laptop, tersinkron seketika</div>
                <div><i id="af2"></i>Kuota, peran, dan kontrol penuh di tangan owner</div>
                <div><i id="af3"></i>Bagikan lewat tautan dengan password dan masa berlaku</div>
              </div>
            </div>
            <small>Privat · Cepat · Sepenuhnya milik Anda</small>
          </div>
          <div class="aform">
            <form class="acard" id="authForm">
              <div class="logo"><i id="authLogo"></i>HomeDrive</div>
