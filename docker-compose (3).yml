        es.addEventListener('users', () => { refreshMe(); LIVE.forEach(fn => fn('users')); if (S.view === 'admin') ADM.live(); });
        es.addEventListener('logout', () => { if (S.me) forceLogout(false, 'Sesi Anda berakhir. Silakan masuk kembali.'); });
        es.onerror = () => { clearTimeout(esTimer); esTimer = setTimeout(async () => {
          try { const j = await fetch('/api/me',{credentials:'same-origin'}).then(r=>r.json()); if (!j.user && S.me) forceLogout(j.setup_needed, 'Sesi Anda berakhir. Silakan masuk kembali.'); } catch(e) {} }, 1200); };
