        };
        m.querySelector('#dvB').onclick = async e => { const r = e.target.closest('[data-rv]'); if (!r) return;
          try { await api('sessions/revoke',{id:r.dataset.rv}); toast('Perangkat dikeluarkan'); draw(); } catch(er) { toast(er.message); } };
        m.querySelector('#dvAll').onclick = async () => { if (!await confirmBox('Keluarkan semua perangkat lain?','Perangkat ini tetap login. Perangkat lain harus login ulang.','Keluarkan')) return;
          try { await api('sessions/revoke-others',{}); toast('Semua perangkat lain dikeluarkan'); draw(); } catch(er) { toast(er.message); } };
        draw();
      }
      async function doLogout(all) {
        if (all && !await confirmBox('Keluar dari semua perangkat?','Semua sesi login akun ini (HP, laptop, dll.) akan diakhiri.','Keluar semua')) return;
        const req = api('logout'+(all?'?all=1':''),{});   // permintaan ke server dikirim, tampilan tidak menunggu
        forceLogout(false);
        try { await req; } catch(e) { toast('Server tidak merespons, sesi mungkin masih aktif. Coba keluar lagi.'); }
      }
      $$('#logoutBtn').onclick = () => doLogout(false);

      /* ---------- aksi ---------- */
      const act = {
        async newFolder() { const n = await ask('Folder baru','Folder tanpa judul','Buat'); if (n===null) return; try { await api('folder',{parent:S.parent,name:n}); load(true,true); } catch(e){toast(e.message);} },
        async newText() { if (!canUpload(0)) return; const n = await ask('Catatan teks baru','Catatan.txt','Buat'); if (n===null) return; try { const j = await api('savetext',{parent:S.parent,name:n,content:''}); await load(true,true); const it=byId(j.id); if (it) preview(it,{edit:true}); } catch(e){storeErr(e);} },
        async rename(it) { const n = await ask('Ubah nama', it.name, 'Simpan'); if (n===null||n===it.name) return; optimistic(raw => raw.map(x => x.id===it.id ? {...x, name:n.trim()||x.name} : x), () => api('rename',{id:it.id,name:n}), {keep:true}); },
        async star(ids) { const val = !ids.every(i=>byId(i)?.starred); optimistic(raw => raw.map(x => ids.includes(x.id) ? {...x, starred:val} : x), () => api('star',{ids,value:val}), {keep:true}); },
        async trash(ids) { if (await optimistic(raw => raw.filter(x => !ids.includes(x.id)), () => api('trash',{ids}))) toast(ids.length+' item dipindahkan ke sampah',{label:'Urungkan',fn:()=>act.restore(ids,true)}); },
        async restore(ids, quiet) {
          const call = () => api('trash',{ids,restore:true});
          if (S.view==='trash') { if (await optimistic(raw => raw.filter(x => !ids.includes(x.id)), call) && !quiet) toast('Item dipulihkan'); }
          else { try { await call(); if (!quiet) toast('Item dipulihkan'); load(true,true); } catch(e){toast(e.message);} }
        },
        async purge(ids) { if (!await confirmBox('Hapus permanen?','Item yang dihapus tidak bisa dikembalikan.')) return; optimistic(raw => raw.filter(x => !ids.includes(x.id)), () => api('delete',{ids})); },
        async dup(ids) { try { await api('copy',{ids}); toast('Salinan dibuat'); load(true,true); } catch(e){ storeErr(e); } },
        async extract(it) { toast('Mengekstrak '+it.name+'…'); try { const j = await api('extract',{id:it.id}); toast(j.count+' file diekstrak ke “'+j.name+'”',{label:'Buka',fn:()=>go('#/files/'+j.id)}); load(true,true); } catch(e){ storeErr(e); } },
        download(ids) { const it = ids.length===1 ? byId(ids[0]) : null; location.href = it && !it.is_folder ? dl(it.id) : (it ? '/api/zip/'+it.id : '/api/zip?ids='+ids.join(',')); },
        async move(ids, copy) {
          let cur = null;
          const m = modal(`<h2>$${copy?'Salin':'Pindahkan'} $${ids.length} item ke…</h2><div id="pkPath" style="color:var(--muted);font-size:13px"></div><div class="picker" id="pk"></div><div class="actions"><button class="btn" id="pkC">Batal</button><button class="btn pri" id="pkOk">$${copy?'Salin':'Pindahkan'} ke sini</button></div>`);
          const draw = async () => {
            const j = await api('list?view=files&folders=1'+(cur?'&parent='+cur:''));
            m.querySelector('#pkPath').textContent = ['Drive Saya', ...j.crumbs.map(c=>c.name)].join('  ›  ');
            const pk = m.querySelector('#pk'); pk.innerHTML = '';
            if (cur) { const b=document.createElement('button'); b.innerHTML=ic('arrowUp',18)+'Naik satu level'; b.onclick=()=>{ cur = j.crumbs.length>1 ? j.crumbs[j.crumbs.length-2].id : null; draw(); }; pk.append(b); }
            j.items.filter(f=>copy||!ids.includes(f.id)).forEach(f => { const b=document.createElement('button'); b.innerHTML=`<span style="color:#f5a524">$${ic('folder',20,'soft')}</span>$${esc(f.name)}`; b.onclick=()=>{cur=f.id; draw();}; pk.append(b); });
            if (!pk.children.length) pk.innerHTML = '<div style="padding:16px;color:var(--muted)">Tidak ada subfolder</div>';
          };
          m.querySelector('#pkC').onclick = () => m.remove();
          m.querySelector('#pkOk').onclick = async () => { m.remove(); if (copy) { try { await api('copy',{ids,parent:cur}); toast('Disalin'); load(true,true); } catch(e){ storeErr(e); } } else moveItems(ids, cur); };
          draw();
        }
      };

      /* ---------- dialog: bagikan ---------- */
      async function shareDialog(it) {
        let info; try { info = await api('share?id='+it.id); } catch(e) { return toast(e.message); }
        const m = modal(`<h2>Bagikan “$${esc(it.name)}”</h2><div id="shB"></div><div class="actions"><button class="btn" id="shX">Selesai</button></div>`, 'wide');
        m.querySelector('#shX').onclick = () => { m.remove(); load(true); };
        const draw = info => {
          const b = m.querySelector('#shB'), has = !!info.token;
          const form = `<label class="lbl">Masa berlaku tautan</label><select id="shExp">$${has?'<option value="">Tidak diubah</option>':''}<option value="0">Tanpa batas waktu</option><option value="1">1 hari</option><option value="7">7 hari</option><option value="30">30 hari</option></select>
            <label class="lbl">$${has&&info.has_password?'Ganti password (kosongkan = tetap)':'Password (opsional)'}</label><input type="password" id="shPw" placeholder="Tanpa password" autocomplete="new-password"><label class="lbl">🎁 Kado: baru bisa dibuka pada (opsional)</label><input type="datetime-local" id="shUn" value="$${info.unlock&&info.unlock>Date.now()/1000?toLocalDT(info.unlock):''}"><div class="hint">Penerima melihat hitung mundur sampai waktu ini. Kosongkan untuk membuka sekarang.</div>`;
          if (!has) { b.innerHTML = `<p style="color:var(--muted);margin:0">Siapa pun yang memiliki tautan dapat melihat dan mengunduh $${it.is_folder?'isi folder':'file'} ini tanpa login.</p>$${form}<div class="actions"><button class="btn pri" id="shOn">$${ic('link',18)}Buat tautan</button></div>`; }
          else {
            const url = location.origin + '/s/' + info.token;
            const status = info.expired ? '<span style="color:var(--danger)">Sudah kedaluwarsa</span>' : (info.expires ? 'Berakhir '+fmtDT(info.expires) : 'Tanpa batas waktu');
            b.innerHTML = `<div style="display:flex;gap:8px"><input type="text" readonly value="$${esc(url)}" id="shUrl"><button class="btn pri" id="shCopy">$${ic('copy',18)}Salin</button></div>
              <div style="margin-top:10px;color:var(--muted);font-size:13px;display:flex;gap:14px;flex-wrap:wrap"><span>$${ic('clock',14)} $${status}</span><span>$${ic('lock',14)} $${info.has_password?'Dilindungi password':'Tanpa password'}</span><span>$${ic('pulse',14)} $${info.views||0}× dibuka</span></div>$${form}
              <div class="actions" style="justify-content:space-between"><button class="btn dng" id="shOff">Hentikan berbagi</button><span style="display:flex;gap:8px">$${info.has_password?'<button class="btn" id="shNoPw">Hapus password</button>':''}<button class="btn pri" id="shSave">Simpan</button></span></div>`;
            const inp = b.querySelector('#shUrl'); inp.onfocus = () => inp.select();
            b.querySelector('#shCopy').onclick = async () => { try { await navigator.clipboard.writeText(url); } catch(e){ inp.select(); document.execCommand('copy'); } toast('Tautan disalin'); };
            b.querySelector('#shOff').onclick = async () => draw(await api('share?id='+it.id,{revoke:true}));
            const np = b.querySelector('#shNoPw'); if (np) np.onclick = async () => { draw(await api('share?id='+it.id,{password:''})); toast('Password dihapus'); };
          }
          const collect = () => { const body={}; const ex=b.querySelector('#shExp').value; if (ex!=='') body.expires_days=+ex; const pw=b.querySelector('#shPw').value; if (pw) body.password=pw; const un=b.querySelector('#shUn'); if (un) body.unlock_at = un.value ? new Date(un.value).getTime()/1000 : 0; return body; };
          const on = b.querySelector('#shOn'); if (on) on.onclick = async () => { try { draw(await api('share?id='+it.id, collect())); } catch(e){toast(e.message);} };
          const sv = b.querySelector('#shSave'); if (sv) sv.onclick = async () => { try { draw(await api('share?id='+it.id, collect())); toast('Pengaturan disimpan'); } catch(e){toast(e.message);} };
        };
        draw(info);
      }

      /* ---------- dialog: detail, penyimpanan, akun ---------- */
      function detailDialog(it) {
        const t = ftype(it);
        const m = modal(`<div style="display:flex;gap:14px;align-items:center"><span style="width:52px;height:52px;border-radius:16px;display:grid;place-items:center;color:$${t.c};background:color-mix(in srgb,$${t.c} 14%,transparent)">$${ic(t.i,28)}</span><h2 style="margin:0">$${esc(it.name)}</h2></div>
          <dl class="kv"><dt>Jenis</dt><dd>$${t.l}$${it.mime&&!it.is_folder?' · '+esc(it.mime):''}</dd><dt>Ukuran</dt><dd id="dSz">$${it.is_folder?'Menghitung…':fmtSize(it.size)+' ('+it.size.toLocaleString('id-ID')+' byte)'}</dd><dt>Dibuat</dt><dd>$${fmtDT(it.created)}</dd><dt>Diubah</dt><dd>$${fmtDT(it.modified)}</dd><dt>Bintang</dt><dd>$${it.starred?'Ya':'Tidak'}</dd><dt>Dibagikan</dt><dd>$${it.shared?'Ya (tautan aktif)':'Tidak'}</dd></dl>
          <div class="actions"><button class="btn" id="dX">Tutup</button></div>`);
        m.querySelector('#dX').onclick = () => m.remove();
        if (it.is_folder) api('info?id='+it.id).then(j => { const e = m.querySelector('#dSz'); if (e) e.textContent = fmtSize(j.size)+' · '+j.files+' file, '+j.folders+' subfolder'; })
          .catch(() => { const e = m.querySelector('#dSz'); if (e) e.textContent = '—'; });
      }
      async function showStats() {
        let st; try { st = await api('stats'); } catch(e) { return toast(e.message); }
        const s = st.storage || S.storage; S.storage = s; renderStorage(); renderBanner();
        const reqBtn = S.me.is_owner ? '' : '<button class="btn" data-rq>Ajukan kuota</button>';
        const wire = m => { m.querySelector('#sX').onclick = () => m.remove(); const b = m.querySelector('[data-rq]'); if (b) b.onclick = () => { m.remove(); quotaRequestDialog(); }; };
        const note = !s.can_upload ? '<div class="err" style="min-height:0;margin-top:12px">Kuota belum diatur oleh owner. Anda belum bisa mengunggah file.</div>' : '';
        if (!S.me.is_admin) {
          const avail = s.available, pct = s.quota ? Math.min(100, s.used/s.quota*100) : 0;
          const m0 = modal(`<h2>Penyimpanan</h2><div class="spbig" style="margin:10px 0 0"><b>$${Math.round(pct)}%</b><small>terpakai</small></div><div class="sbar" style="height:10px;margin-top:8px"><b style="width:$${pct}%;background:var(--grad)"></b></div>
            <div class="sgrid"><div><small>Terpakai</small><b>$${fmtSize(s.used)}</b></div><div><small>Tersedia untuk Anda</small><b>$${avail!=null?fmtSize(avail):'Tanpa batas'}</b></div>$${s.quota?`<div><small>Kuota Anda</small><b>$${fmtSize(s.quota)}</b></div>`:''}</div>$${note}<div class="actions">$${reqBtn}<button class="btn" id="sX">Tutup</button></div>`);
          return wire(m0);
        }
        const total = s.quota || Math.max(s.used,1);
        const segs = Object.keys(CATCOL).map(k => `<b style="width:$${st.categories[k].size/total*100}%;background:$${CATCOL[k]}"></b>`).join('');
        const rows = Object.keys(CATCOL).map(k => `<div><i style="background:$${CATCOL[k]}"></i><span>$${CATNAME[k]} <small style="color:var(--muted)">· $${st.categories[k].count} file</small></span><span>$${fmtSize(st.categories[k].size)}</span></div>`).join('');
        const m = modal(`<h2>Penyimpanan</h2><div style="font-size:26px;font-weight:750;letter-spacing:-.5px">$${fmtSize(s.used)} <small style="font-size:14px;color:var(--muted);font-weight:500">$${s.quota?'dari '+fmtSize(s.quota):'terpakai'}</small></div>
          <div class="sbar" style="height:10px;margin-top:12px">$${segs}</div><div class="legend">$${rows}</div>
          <div class="sgrid"><div><small>Terpakai</small><b>$${fmtSize(s.used)}</b></div><div><small>Tersedia untuk Anda</small><b>$${s.available!=null?fmtSize(s.available):'—'}</b></div>
            $${s.quota?`<div><small>Kuota Anda</small><b>$${fmtSize(s.quota)}</b></div>`:''}
            $${st.disk&&st.disk.total?`<div><small>Disk server (total)</small><b>$${fmtSize(st.disk.total)}</b></div><div><small>Disk server (kosong)</small><b>$${fmtSize(st.disk.free)}</b></div><div><small>Disk server (terpakai)</small><b>$${fmtSize(st.disk.used)}</b></div>`:''}
            $${st.all_used!=null?`<div><small>Total pemakaian semua pengguna</small><b>$${fmtSize(st.all_used)}</b></div>`:''}</div>$${note}
          <div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);display:flex;justify-content:space-between"><span>$${st.folders} folder</span><span>Di sampah: $${fmtSize(st.trash)}</span></div><div class="actions">$${reqBtn}<button class="btn" id="sX">Tutup</button></div>`);
        wire(m);
      }

      function changePw() {
        const m = modal(`<h2>Ganti password</h2><label class="lbl">Password lama</label><input type="password" id="o" autocomplete="current-password"><label class="lbl">Password baru (min. 8 karakter)</label><input type="password" id="n" autocomplete="new-password"><div class="err" id="e"></div><div class="actions"><button class="btn" id="c">Batal</button><button class="btn pri" id="s">Simpan</button></div>`);
        m.querySelector('#c').onclick=()=>m.remove();
        m.querySelector('#s').onclick=async()=>{ try { await api('password',{old:m.querySelector('#o').value,new:m.querySelector('#n').value}); m.remove(); toast('Password diubah'); } catch(e){ m.querySelector('#e').textContent=e.message; } };
      }
      /* ---------- aksen, warna folder, aktivitas, duplikat, bantuan ---------- */
      const ACCENTS = {indigo:['#5b5ff0','#8b5cf6','Indigo'],emerald:['#10b981','#14b8a6','Zamrud'],rose:['#f43f5e','#ec4899','Mawar'],amber:['#f59e0b','#f97316','Amber'],sky:['#0ea5e9','#6366f1','Langit'],slate:['#475569','#64748b','Abu-abu']};
      function applyAccent() {
        const a = ACCENTS[localStorage.getItem('accent')] || (XM.on() ? ACCENTS.natal : ACCENTS.indigo), st = document.documentElement.style;
        st.setProperty('--acc', a[0]); st.setProperty('--acc2', a[1]);
        const mt = document.querySelector('meta[name=theme-color]'); if (mt) mt.content = a[0];
      }
      function accentDialog() {
        const cur = localStorage.getItem('accent') || 'indigo';
        const m = modal(`<h2>Warna aksen</h2><div class="swatches">$${Object.entries(ACCENTS).map(([k,a]) => `<button data-k="$${k}" class="$${cur===k?'on':''}" style="background:linear-gradient(135deg,$${a[0]},$${a[1]})" title="$${a[2]}"></button>`).join('')}</div><div class="actions"><button class="btn" id="aX">Selesai</button></div>`);
        m.querySelector('.swatches').onclick = e => { const b = e.target.closest('[data-k]'); if (!b) return; localStorage.setItem('accent', b.dataset.k); applyAccent(); m.querySelectorAll('.swatches button').forEach(x => x.classList.toggle('on', x===b)); };
        m.querySelector('#aX').onclick = () => m.remove();
      }
      function colorDialog(ids) {
        if (!ids.length) return;
        const cur = byId(ids[0])?.color;
        const m = modal(`<h2>Warna folder</h2><div class="swatches">$${FOLDER_COLORS.map(c => `<button data-c="$${c}" style="--c:$${c}" class="$${cur===c?'on':''}" title="$${c}"></button>`).join('')}</div><div class="actions"><button class="btn" id="cD">Warna bawaan</button><button class="btn" id="cX">Tutup</button></div>`);
        const set = async c => { try { await api('color',{ids,color:c}); m.remove(); load(true); } catch(e) { toast(e.message); } };
        m.querySelector('.swatches').onclick = e => { const b = e.target.closest('[data-c]'); if (b) set(b.dataset.c); };
        m.querySelector('#cD').onclick = () => set(null); m.querySelector('#cX').onclick = () => m.remove();
      }
      const ACT = {upload:['upload','Mengunggah'],folder:['folderPlus','Membuat folder'],edit:['edit','Mengedit file'],rename:['edit','Mengubah nama'],move:['move','Memindahkan'],copy:['copy','Menyalin'],trash:['trash','Ke sampah'],restore:['restore','Memulihkan'],delete:['trash','Hapus permanen'],share:['link','Membagikan'],unshare:['lock','Berhenti berbagi'],login:['key','Masuk'],revoke:['phone','Perangkat dikeluarkan'],request:['users','Mengajukan pengguna'],approve:['check','Menyetujui pengguna'],reject:['x','Menolak permintaan'],extract:['archive','Mengekstrak ZIP'],cleanup:['weight','Pembersihan sistem'],backup:['download','Cadangan database'],quota:['drive','Mengatur kuota'],quota_request:['drive','Meminta kuota'],announce:['bell','Pengumuman'],maintenance:['lock','Mode pemeliharaan'],disable:['lock','Status akun diubah']};
      function ago(t) {
        const s = Math.max(0, Date.now()/1000 - t);
        if (s<60) return 'baru saja'; if (s<3600) return Math.floor(s/60)+' mnt lalu'; if (s<86400) return Math.floor(s/3600)+' jam lalu'; if (s<604800) return Math.floor(s/86400)+' hari lalu';
        return fmtDate(t);
      }
      async function activityDialog(all) {
        let j; try { j = await api('activity'+(all?'?all=1':'')); } catch(e) { return toast(e.message); }
        const rows = j.items.map(a => { const x = ACT[a.action] || ['info',a.action]; return `<div class="a"><span class="ai">$${ic(x[0],18)}</span><div class="at"><b>$${x[1]}</b><span>$${a.who?esc(a.who)+' · ':''}$${esc(a.detail||'')}</span></div><span class="ts" title="$${esc(fmtDT(a.ts))}">$${ago(a.ts)}</span></div>`; }).join('');
        const m = modal(`<h2>$${all?'Aktivitas semua pengguna':'Aktivitas terbaru'}</h2><div class="acl">$${rows || '<div style="padding:30px;text-align:center;color:var(--muted)">Belum ada aktivitas.</div>'}</div><div class="actions">$${S.me.is_admin?`<button class="btn" id="xA">$${all?'Aktivitas saya':'Semua pengguna'}</button>`:''}<button class="btn" id="xX">Tutup</button></div>`, 'wide');
        m.querySelector('#xX').onclick = () => m.remove();
        const xa = m.querySelector('#xA'); if (xa) xa.onclick = () => { m.remove(); activityDialog(!all); };
      }
      async function analyzeDialog() {
        const m = modal(`<h2>Analisis penyimpanan</h2><div id="anB" style="color:var(--muted)">Menghitung…</div><div class="actions"><button class="btn" id="anX">Tutup</button></div>`, 'big');
        m.querySelector('#anX').onclick = () => m.remove();
        let j; try { j = await api('analyze'); } catch(e) { m.remove(); return toast(e.message); }
        if (!document.body.contains(m)) return;
        const b = m.querySelector('#anB'); b.style.color = 'var(--text)';
        if (!j.folders.length && !j.files.length) { b.innerHTML = '<div style="padding:30px;text-align:center;color:var(--muted)">Belum ada file untuk dianalisis.</div>'; return; }
        const mx = Math.max(1, ...j.folders.map(f => f.size));
        const fol = j.folders.map(f => `<div class="a" data-go="$${f.id}" style="cursor:pointer"><span class="ai">$${ic('folder',18)}</span><div class="at"><b>$${esc(f.path)}</b><div class="sbar" style="height:6px;margin-top:6px"><b style="width:$${(f.size/mx*100).toFixed(1)}%;background:var(--grad)"></b></div></div><span class="ts">$${fmtSize(f.size)} · $${f.files} file</span></div>`).join('');
        const fil = j.files.map(f => `<div class="a" data-go="$${f.parent_id||''}" style="cursor:pointer"><span class="ai">$${ic('file',18)}</span><div class="at"><b>$${esc(f.name)}</b><span>$${esc(f.path||'Drive Saya')}</span></div><span class="ts">$${fmtSize(f.size)}</span></div>`).join('');
        b.innerHTML = `<div class="acl">$${fol?`<div class="nfh">Folder terbesar</div>$${fol}`:''}$${fil?`<div class="nfh">File terbesar</div>$${fil}`:''}</div><p style="color:var(--muted);font-size:12.5px;margin:10px 0 0">Klik baris untuk membuka lokasinya. File di sampah tidak dihitung.</p>`;
        b.onclick = e => { const r = e.target.closest('[data-go]'); if (!r) return; m.remove(); go(r.dataset.go ? '#/files/'+r.dataset.go : '#/files'); };
      }
      const fmtUp = s => { s = Math.floor(s); const d = Math.floor(s/86400), h = Math.floor(s%86400/3600), mi = Math.floor(s%3600/60); return (d?d+' hari ':'')+((h||d)?h+' jam ':'')+mi+' mnt'; };
      async function dupDialog() {
        const m = modal(`<h2>Pembersih duplikat</h2><div id="dB" style="color:var(--muted)">Memindai file, mohon tunggu…</div><div class="actions"><button class="btn" id="dX">Tutup</button><button class="btn pri hidden" id="dGo">$${ic('trash',18)}Sampahkan salinan</button></div>`, 'big');
        m.querySelector('#dX').onclick = () => m.remove();
        let j; try { j = await api('duplicates'); } catch(e) { m.remove(); return toast(e.message); }
        if (!document.body.contains(m)) return;
        const b = m.querySelector('#dB');
        if (!j.groups.length) { b.textContent = 'Tidak ada file duplikat. Drive Anda sudah rapi.'; return; }
        b.style.color = 'var(--text)';
        const extra = j.groups.flatMap(g => g.items.slice(1).map(i => i.id));
        b.innerHTML = `<div style="color:var(--text)"><b>$${j.groups.length}</b> grup duplikat · bisa menghemat <b>$${fmtSize(j.reclaim)}</b>. File tertua di tiap grup dipertahankan.</div>` +
