          try {
            if (d.ap) { const r = users.find(x => x.id == d.ap); const v = await ask('Kuota untuk '+r.username+' (GB). 0 = tanpa batas, kosong = atur nanti','','Setujui'); if (v === null) return;
              await api('requests/approve',{id:+d.ap, quota_gb:v.trim()}); toast('Pengguna dibuat'+(v.trim()===''?'. Atur kuotanya agar bisa mengunggah':'')); }
            else if (d.rj) { await api('requests/reject',{id:+d.rj}); toast('Permintaan ditolak'); }
            else if (d.qa) { await api('quota-requests/approve',{id:+d.qa}); toast('Kuota disetujui'); }
            else if (d.qo) { const r = quotas.find(x => x.id == d.qo); const v = await ask('Kuota untuk '+r.target+' (GB). 0 = tanpa batas', String(r.requested_gb), 'Setujui'); if (v === null) return;
              await api('quota-requests/approve',{id:+d.qo, quota_gb:v.trim()}); toast('Kuota disetujui'); }
            else if (d.qr) { await api('quota-requests/reject',{id:+d.qr}); toast('Permintaan ditolak'); }
            else if (d.qc) { await api('quota-requests/cancel',{id:+d.qc}); toast('Permintaan dibatalkan'); }
            else if (d.uc) { await api('requests/cancel',{id:+d.uc}); toast('Permintaan dibatalkan'); }
