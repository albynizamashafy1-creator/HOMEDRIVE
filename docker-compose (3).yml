          `<div class="c6">$${panel('Mode pemeliharaan', `<div class="setrow" style="padding-top:0"><div class="st"><b>$${s.maintenance ? 'Aktif: penyimpanan hanya-baca' : 'Nonaktif'}</b><small>Pengguna lain tidak bisa unggah, ubah, atau hapus. Owner tetap bisa. Cocok sebelum memindahkan disk atau membuat cadangan lengkap.</small></div><label class="sw"><input type="checkbox" data-adm="maint" $${s.maintenance?'checked':''}><i></i></label></div>`)}</div>` +
          `<div class="c12">$${panel('Cadangan database', `<p class="hint" style="margin:0 0 6px">$${s.backup_hours > 0 ? 'Otomatis tiap ' + s.backup_hours + ' jam, menyimpan ' + s.backup_keep + ' terbaru (folder data/backups).' : 'Cadangan otomatis nonaktif (BACKUP_HOURS=0).'} Hanya berisi database; salin juga folder <b>data/blobs</b> untuk cadangan lengkap.</p>$${bk}`, `<button class="btn sm" data-adm="bk-now">$${ic('plus',16)}Buat sekarang</button><a class="btn sm pri" href="/api/backup" style="text-decoration:none">$${ic('download',16)}Unduh terbaru</a>`)}</div></div>`;
      }

