        } catch(e) { clearTimeout(sk); if (my !== loadSeq) return; toast(e.message); if (S.parent) return go('#/files'); }
        clearTimeout(sk); render();
      }
      function renderChips() {
        const c = $$('#chips'), on = FILTERABLE.includes(S.view) && (S.raw||[]).length > 5;
        c.classList.toggle('hidden', !on); if (!on) return;
        c.innerHTML = FILTERS.map(f => `<button class="chip $${S.filter===f[0]?'on':''}" data-f="$${f[0]}">$${f[1]}</button>`).join('');
      }
      $$('#chips').onclick = e => { const b = e.target.closest('[data-f]'); if (!b) return; S.filter = b.dataset.f; S.sel.clear(); S.items = applyFilter(sortItems(S.raw)); render(); };
      function dayLabel(t) {
        const sd = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime(), diff = Math.round((sd(new Date()) - sd(new Date(t*1000))) / 864e5);
        return diff<=0 ? 'Hari ini' : diff===1 ? 'Kemarin' : diff<7 ? 'Minggu ini' : diff<31 ? 'Bulan ini' : 'Lebih lama';
      }

      /* ---------- render ---------- */
      function badges(it) { return (it.starred?`<span class="bd star">$${ic('star',14,'fill')}</span>`:'') + (it.shared?`<span class="bd" title="Dibagikan">$${ic('globe',14)}</span>`:''); }
      function thumb(it) {
        const t = ftype(it);
        if (t.k==='image' && /^image\/(png|jpeg|gif|webp|avif|bmp)$$/.test(it.mime||'')) return `<img loading="lazy" decoding="async" draggable="false" src="$${dl(it.id,true)}" alt="">`;
        if (t.k==='video' && (it.mime||'').startsWith('video/')) return `<video preload="metadata" muted playsinline draggable="false" src="$${dl(it.id,true)}#t=0.5"></video><span class="vbadge">$${ic('video',12)}Video</span>`;
        return `<div class="ficon" style="--c:$${t.c}">$${ic(t.i,40)}</div>`;
      }
      const chk = () => `<div class="chk">$${ic('check',15)}</div>`;
      const moreBtn = id => `<button class="more" data-more="$${id}" aria-label="Menu">$${ic('more',18,'fill')}</button>`;
      function cardHTML(it) {
        const t = ftype(it), drag = S.view==='trash' ? '' : 'draggable="true"';
        if (it.is_folder) return `<div class="item folder" style="--c:$${t.c}" data-id="$${it.id}" data-drop="$${it.id}" $${drag}>$${chk()}<span class="fi" style="--c:$${t.c}">$${ic('folder',24,'soft')}</span><span class="nm" title="$${esc(it.name)}">$${esc(it.name)}</span>$${badges(it)}$${moreBtn(it.id)}</div>`;
        return `<div class="item file" data-id="$${it.id}" $${drag}>$${chk()}<div class="thumb">$${thumb(it)}</div><div class="cap"><span class="ti" style="--c:$${t.c}">$${ic(t.i,17)}</span><span class="nm" title="$${esc(it.name)}">$${esc(it.name)}</span>$${badges(it)}$${moreBtn(it.id)}</div></div>`;
      }
      function photoHTML(it) {
        return `<div class="item ph" data-id="$${it.id}" draggable="true"><div class="thumb">$${thumb(it)}</div>$${chk()}<div class="phcap">$${esc(it.name)}</div>$${it.starred?`<span class="bd">$${ic('star',15,'fill')}</span>`:''}$${moreBtn(it.id)}</div>`;
      }
      function listRow(it) {
        const t = ftype(it);
        return `<div class="row" data-id="$${it.id}" $${it.is_folder?`data-drop="$${it.id}"`:''} $${S.view==='trash'?'':'draggable="true"'}><div class="n"><span class="ti" style="--c:$${t.c}">$${ic(t.i,18)}</span><span class="nmw"><span class="nm" title="$${esc(it.name)}">$${esc(it.name)}</span><small class="sub">$${it.is_folder?'Folder':fmtSize(it.size)} · $${fmtDate(it.modified)}</small></span>$${badges(it)}</div><div class="m">$${fmtDate(it.modified)}</div><div class="m">$${it.is_folder?'—':fmtSize(it.size)}</div>$${moreBtn(it.id)}</div>`;
      }
      function render() {
        document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('active', a.dataset.v===S.view));
        document.querySelectorAll('#tabbar a').forEach(a => a.classList.toggle('active', a.dataset.t===S.view));
        // judul / breadcrumb
        const c = $$('#crumbs'); c.innerHTML='';
        const addCrumb = (label, hash, drop) => { const b=document.createElement('button'); b.textContent=label; b.onclick=()=>go(hash); if (drop!==undefined) b.dataset.drop=drop; c.append(b); };
        const sep = () => { const s=document.createElement('span'); s.className='sep'; s.innerHTML=ic('chevron',16); c.append(s); };
