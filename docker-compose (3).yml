      .xc-b small{font-size:10.5px;opacity:.85;text-transform:uppercase;letter-spacing:.08em}
      .xc-done{font-weight:650}
      .xconf{position:fixed;top:-30px;z-index:140;pointer-events:none;font-size:22px;animation:xfall linear forwards}
      .xconf.sq{width:9px;height:14px;border-radius:2px}
      @keyframes xfall{to{transform:translateY(110vh) rotate(720deg);opacity:.9}}
      @media(max-width:900px){#garland{height:20px}.xc-b div{min-width:48px}.xc-b b{font-size:18px}html[data-xmas=on] .hello h2{font-size:24px}}
      @media(prefers-reduced-motion:reduce){#garland i{animation:none!important}}

