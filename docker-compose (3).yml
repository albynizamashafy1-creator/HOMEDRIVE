      });
      Object.assign(ACT, {login_fail:['shield','Login gagal'], export:['download','Ekspor log'], rename_user:['edit','Mengganti username'], bulk:['users','Aksi massal'],
        transfer:['crown','Serah-terima owner'], message:['send','Mengirim pesan'], config:['sliders','Mengubah kebijakan']});

      const ADM = {tab:'overview', seq:0, users:[], uq:'', uf:'all', sel:new Set(), act:{user:'',action:'',q:'',items:[],more:false,next:null}, shQ:'', seQ:'', shares:[], sess:[], lt:0, qt:0};
      const ADM_TABS = [['overview','gauge','Ringkasan'],['users','users','Pengguna'],['requests','mail','Permintaan'],['activity','pulse','Aktivitas'],['shares','globe','Tautan'],['sessions','phone','Sesi',1],['system','server','Sistem',1],['settings','sliders','Pengaturan',1]];
      const hueOf = s => { let h = 0; for (const ch of String(s)) h = (h*31 + ch.charCodeAt(0)) % 360; return h; };
      const av2 = (n, sz) => `<span class="av2" style="--h:$${hueOf(n)}$${sz ? ';width:'+sz+'px;height:'+sz+'px;font-size:'+Math.round(sz*.38)+'px' : ''}">$${esc((n||'?')[0].toUpperCase())}</span>`;
      const pb2 = (used, quota) => { const p = quota ? Math.min(100, used/quota*100) : 0; return `<div class="pb2 $${p>=100?'danger':p>=85?'warn':''}"><b style="width:$${p.toFixed(1)}%"></b></div>`; };
