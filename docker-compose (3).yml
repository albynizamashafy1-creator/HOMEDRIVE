      .avatar{width:42px;height:42px;border-radius:50%;box-shadow:0 0 0 3px var(--surface),0 0 0 4.5px color-mix(in srgb,var(--acc) 45%,transparent),var(--glow)}
      .seg{background:color-mix(in srgb,var(--s2) 80%,transparent);border:1px solid var(--line)}
      .chip{background:color-mix(in srgb,var(--surface) 80%,transparent);padding:7px 16px}
      .chip.on{background:var(--grad);color:#fff;border-color:transparent;box-shadow:var(--glow)}
      .sec{display:flex;align-items:center;gap:12px;font-size:11px;letter-spacing:.14em}
      .sec::after{content:"";flex:1;height:1px;background:var(--line)}

      /* kartu file & folder */
      .item{background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--sh2);transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s,border-color .2s,background .2s}
      .item:hover{transform:translateY(-4px);box-shadow:var(--sh);border-color:color-mix(in srgb,var(--acc) 30%,var(--line))}
      .item.file .thumb{margin:8px 8px 0;border-radius:16px}
      .item.sel{border-color:var(--acct);background:color-mix(in srgb,var(--acc) 9%,var(--surface));box-shadow:0 0 0 2px var(--acct),var(--sh2)}
      .item.folder{background:linear-gradient(135deg,color-mix(in srgb,var(--c,#f5a524) 17%,var(--surface)),var(--surface) 75%);border-color:color-mix(in srgb,var(--c,#f5a524) 20%,var(--line))}
      .item.folder .fi{border-radius:16px;background:linear-gradient(145deg,color-mix(in srgb,var(--c) 32%,transparent),color-mix(in srgb,var(--c) 12%,transparent));box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
      .item.ph{border-radius:14px;box-shadow:none;border:0}
      .item.ph:hover{transform:scale(1.025);box-shadow:var(--sh);z-index:2}
      .item .chk{border-radius:50%}
      .item.sel .chk{background:var(--grad);border-color:transparent}
      .nm{font-weight:620}
      .row{border-radius:16px}
      .row.head{backdrop-filter:blur(14px);background:color-mix(in srgb,var(--surface) 82%,transparent)}
      .empty .eic{width:104px;height:104px;background:linear-gradient(145deg,color-mix(in srgb,var(--acc) 22%,transparent),color-mix(in srgb,var(--acc2) 10%,transparent));box-shadow:inset 0 1px 0 rgba(255,255,255,.3),var(--sh2)}
      .banner{border-radius:22px}

      /* beranda: sapaan + pintasan kategori */
      .hero{margin:4px 0 6px}
      .hello h2{margin:6px 0 2px;font-size:28px;letter-spacing:-.9px;font-weight:800}
      .hello h2 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
      .hello p{margin:0;color:var(--muted)}
      .cats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0 2px}
      .cat{position:relative;overflow:hidden;display:flex;flex-direction:column;padding:16px;border-radius:22px;cursor:pointer;user-select:none;
        background:linear-gradient(150deg,color-mix(in srgb,var(--c) 18%,var(--surface)),var(--surface) 80%);border:1px solid color-mix(in srgb,var(--c) 18%,var(--line));
        box-shadow:var(--sh2);transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s}
      .cat::after{content:"";position:absolute;right:-26px;top:-26px;width:90px;height:90px;border-radius:50%;background:color-mix(in srgb,var(--c) 14%,transparent)}
      .cat:hover{transform:translateY(-3px);box-shadow:var(--sh)}
      .cat .ci{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;margin-bottom:12px;color:var(--c);background:color-mix(in srgb,var(--c) 20%,transparent);position:relative;z-index:1}
      .cat b{font-size:15px;letter-spacing:-.2px}
      .cat small{color:var(--muted);font-size:12.5px;margin-top:1px}

      /* melayang: bilah pilihan, menu, dialog, notifikasi */
      #selbar{background:color-mix(in srgb,var(--text) 92%,transparent);backdrop-filter:blur(20px) saturate(1.5);border-radius:99px;box-shadow:var(--sh);border:1px solid rgba(255,255,255,.08)}
      #selbar button{border-radius:99px}
      .menu{background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(22px) saturate(1.5);box-shadow:var(--sh);border:1px solid var(--line);padding:7px}
      .menu button{border-radius:12px;padding:10px 12px}
      .menu button:hover{background:color-mix(in srgb,var(--acc) 10%,transparent)}
      .mbg{background:rgba(8,10,22,.5);backdrop-filter:blur(10px)}
      .modal{border:1px solid var(--line);box-shadow:var(--sh)}
      .modal h2{font-size:21px;letter-spacing:-.5px}
      .toast{border-radius:99px;backdrop-filter:blur(14px);box-shadow:var(--sh)}
      #uploads{border-radius:26px;background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(20px) saturate(1.4)}
      #preview{background:rgba(6,8,14,.92);backdrop-filter:blur(18px) saturate(1.2)}
      .pvb{border-radius:50%}

      @media(min-width:901px){
        aside{border-radius:32px;background:color-mix(in srgb,var(--surface) 72%,transparent);backdrop-filter:blur(26px) saturate(1.4);border:1px solid var(--line);box-shadow:var(--sh2);padding:20px 14px 14px}
        .mainc{border-radius:32px;border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 84%,transparent);backdrop-filter:blur(26px) saturate(1.4)}
        .crumbs button{font-size:26px;letter-spacing:-.9px}
        .menu{border-radius:20px}
        .modal{border-radius:30px;background:color-mix(in srgb,var(--surface) 95%,transparent)}
      }
      @media(max-width:900px){
        #tabbar{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));border:1px solid var(--line);border-radius:28px;padding:6px;box-shadow:var(--sh);background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(24px) saturate(1.5)}
        #tabbar a{border-radius:20px;padding:7px 2px}
        #tabbar a.active{background:color-mix(in srgb,var(--acc) 12%,transparent)}
        #tabbar a.active svg{background:none;padding:0;width:22px;height:22px}
        #fab{bottom:calc(92px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:20px}
        #selbar{bottom:calc(88px + env(safe-area-inset-bottom))}
        #toasts{bottom:calc(98px + env(safe-area-inset-bottom))}
        #uploads{bottom:calc(160px + env(safe-area-inset-bottom))}
        .cats{grid-template-columns:repeat(2,1fr);gap:10px}
        .hello h2{font-size:22px}
        .item{border-radius:20px}.item.ph{border-radius:12px}
        .acard{padding:32px 24px}
        .search input[type=text]{padding:12px 14px 12px 44px}
      }
      /* ===== v4: desain baru (bersih, modern, konsisten) ===== */
      :root{--bg:#f5f6fa;--surface:#fff;--s2:#f3f4f9;--line:#e8eaf1;--text:#0f1325;--muted:#687087;--r:16px;
        --soft:color-mix(in srgb,var(--acc) 10%,transparent);--soft2:color-mix(in srgb,var(--acc) 18%,transparent);
        --sh2:0 1px 2px rgba(16,19,37,.04),0 1px 1px rgba(16,19,37,.03);
        --sh:0 18px 40px -16px rgba(16,19,37,.28),0 4px 12px -6px rgba(16,19,37,.12);
        --glow:0 6px 16px -8px color-mix(in srgb,var(--acc) 75%,transparent);
        --ok:#16a34a;--warn:#f59e0b;--font:Inter,"Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
      :root[data-theme=dark]{--bg:#0b0d14;--surface:#12151e;--s2:#191c27;--line:#252938;--text:#eef0f7;--muted:#8b93a8;
        --sh2:0 1px 2px rgba(0,0,0,.35);--sh:0 20px 44px -16px rgba(0,0,0,.75),0 4px 12px -6px rgba(0,0,0,.5)}
      @media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b0d14;--surface:#12151e;--s2:#191c27;--line:#252938;--text:#eef0f7;--muted:#8b93a8;
        --sh2:0 1px 2px rgba(0,0,0,.35);--sh:0 20px 44px -16px rgba(0,0,0,.75),0 4px 12px -6px rgba(0,0,0,.5)}}
      body{font:14px/1.5 var(--font);letter-spacing:0;background:var(--bg);background-image:radial-gradient(900px 420px at 0% -10%,color-mix(in srgb,var(--acc) 9%,transparent),transparent 70%);background-attachment:fixed}
      h1,h2,h3{font-family:var(--font)}

      /* tombol & input */
      .btn{min-height:38px;padding:7px 16px;border-radius:10px;box-shadow:none;font-weight:600;letter-spacing:0}
      .btn:hover{transform:none;background:var(--s2)}
      .btn:active{transform:scale(.98)}
      .btn.sm{min-height:32px;padding:4px 12px;border-radius:9px;font-size:13px}
      .btn.pri{background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:var(--glow)}
      .btn.pri:hover{filter:brightness(1.07);transform:none;background:linear-gradient(135deg,var(--acc),var(--acc2))}
      .btn.dng{color:var(--danger)}.btn.dng:hover{background:color-mix(in srgb,var(--danger) 9%,var(--surface))}
      .btn:disabled{opacity:.55;cursor:default}
      input[type=text],input[type=password],input[type=number],select,textarea{border-radius:10px;padding:10px 13px;background:var(--surface);border:1px solid var(--line)}
      textarea{resize:vertical;line-height:1.5}
      input[type=text]:focus,input[type=password]:focus,input[type=number]:focus,select:focus,textarea:focus{border-color:var(--acct);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 16%,transparent)}
      .pill{border-radius:99px;padding:2px 9px;font-size:11px;letter-spacing:.01em}
      .pill.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
      .hint{color:var(--muted);font-size:12.5px;margin:6px 0 0}
      .chkline{display:flex;gap:9px;margin-top:14px;align-items:center;font-weight:550;cursor:pointer}
      .chkline input{width:17px;height:17px;accent-color:var(--acc)}
      .grow{flex:1}

      /* halaman masuk: panel merek + formulir */
      #auth{display:block;padding:0;overflow:auto;background:var(--bg);align-items:initial;justify-content:initial}
      #auth.hidden{display:none}
      #seg:empty{display:none}
      #auth::before,#auth::after{display:none}
      .aw{width:100%;min-height:100vh;min-height:100dvh;display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr)}
      .abrand{position:relative;overflow:hidden;padding:52px 56px;display:flex;flex-direction:column;justify-content:space-between;gap:36px;color:#fff;background:linear-gradient(150deg,var(--acc),var(--acc2) 80%)}
      .abrand::before,.abrand::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.11);pointer-events:none}
      .abrand::before{width:460px;height:460px;right:-150px;top:-130px}
      .abrand::after{width:320px;height:320px;left:-100px;bottom:-120px;background:rgba(255,255,255,.07)}
      .abrand .logo{color:#fff;font-size:20px;position:relative;z-index:1}.abrand .logo i{background:rgba(255,255,255,.2);box-shadow:none}
      .abrand .abody{position:relative;z-index:1}
      .abrand h2{font-size:40px;line-height:1.1;letter-spacing:-1.3px;margin:0 0 14px;font-weight:800;max-width:470px}
      .abrand p{margin:0;opacity:.86;max-width:440px;font-size:16px}
      .afeat{display:grid;gap:14px;margin-top:32px;position:relative;z-index:1}
      .afeat div{display:flex;gap:13px;align-items:center;font-weight:600}
      .afeat i{width:36px;height:36px;border-radius:11px;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:none}
      .abrand small{position:relative;z-index:1;opacity:.7}
      .aform{display:grid;place-items:center;padding:32px 24px}
      .acard{width:100%;max-width:384px;padding:0;border:0;background:none;box-shadow:none;backdrop-filter:none;border-radius:0}
      .acard .logo{display:none}
      .acard h1{font-size:28px;letter-spacing:-.8px;margin:0 0 4px}
      .acard .btn{min-height:46px;margin-top:18px}
      .pwrap{position:relative}.pwrap input{padding-right:46px}
      .pwrap .ibtn{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:36px;height:36px}
      @media(max-width:900px){.aw{grid-template-columns:1fr}.abrand{display:none}.acard .logo{display:flex;margin-bottom:22px}.aform{align-items:start;padding-top:calc(48px + env(safe-area-inset-top))}}

      /* kerangka */
      @media(min-width:901px){
        #app{padding:10px 10px 10px 0;gap:0}
        aside{background:transparent;backdrop-filter:none;border:0;box-shadow:none;border-radius:0;padding:12px 14px 4px 18px;gap:10px;overflow:hidden}
        .mainc{border-radius:20px;background:var(--surface);backdrop-filter:none;border:1px solid var(--line);box-shadow:var(--sh2)}
      }
      aside .logo{font-size:17px;letter-spacing:-.3px;padding:2px 4px 2px}
      .logo i{width:34px;height:34px;border-radius:10px;box-shadow:var(--glow)}
      #newBtn{min-height:42px;border-radius:11px;padding:10px 16px;font-size:14px;box-shadow:var(--glow)}
      #newBtn::after{display:none}
      #newBtn:hover{transform:none}
      #nav{flex:1;min-height:0;overflow:auto;margin:0 -8px;padding:0 8px;scrollbar-width:thin}
      nav a{padding:8px 11px;border-radius:10px;gap:12px;font-size:13.5px;font-weight:600}
      nav a:hover{transform:none;background:var(--s2);color:var(--text)}
      nav a.active{background:var(--soft);color:var(--acct);box-shadow:none}
      nav a.active::before{display:none}
      nav a.active svg{filter:none}
      nav .nl{font-size:11px;letter-spacing:.09em;padding:14px 11px 5px;opacity:.75}
      .nbadge{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--danger);color:#fff;font-size:11px;font-weight:700;display:inline-grid;place-items:center;font-style:normal}
      .sidefoot{flex:none;display:flex;flex-direction:column;gap:8px}
      .storage{display:block;margin:0;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);box-shadow:none}
      .storage:hover{transform:none;box-shadow:var(--sh2);border-color:color-mix(in srgb,var(--acc) 30%,var(--line))}
      .sbx-h{display:flex;align-items:center;gap:8px;font-weight:650;font-size:13px;margin-bottom:9px}.sbx-h svg{color:var(--acct)}.sbx-h b{margin-left:auto;color:var(--acct)}
      .sbar2{height:6px;border-radius:4px;background:var(--s2);overflow:hidden}
      .sbar2 b{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .4s}
      .sbar2.lv1 b{background:#f59e0b}.sbar2.lv2 b{background:#f97316}.sbar2.lv3 b{background:#ef4444}.sbar2.lv4 b{background:#94a3b8}
      .storage small{display:block;margin-top:8px;color:var(--muted);font-size:12px;line-height:1.4}
      .storage small b{color:var(--text);font-weight:650}
      .uchip{display:flex;align-items:center;gap:10px;padding:7px 8px 7px 7px;border-radius:14px;border:1px solid var(--line);background:var(--surface);cursor:pointer;transition:background .15s}
      .uchip:hover{background:var(--s2)}
      .uav{width:34px;height:34px;border-radius:10px;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
      .uinfo{min-width:0;flex:1;display:flex;flex-direction:column;line-height:1.25}
      .uinfo b{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.uinfo small{color:var(--muted);font-size:11.5px}
      .uchip .ibtn{width:32px;height:32px;border-radius:9px}
      .uchip .ibtn:hover{background:color-mix(in srgb,var(--danger) 10%,transparent);color:var(--danger)}
      header{padding:12px 20px 6px}
      .search input[type=text]{min-height:42px;border-radius:11px;background:var(--s2);border:1px solid transparent;box-shadow:none;padding:10px 44px}
      .search input[type=text]:focus{background:var(--surface);border-color:var(--acct);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 16%,transparent)}
      header .ibtn{background:transparent;border:0;border-radius:11px}
      header .ibtn:hover{background:var(--s2)}
      .avatar{width:38px;height:38px;border-radius:11px;box-shadow:none;font-size:14px}
      #bellBtn .bdg{box-shadow:0 0 0 2px var(--surface)}
      .pagehead{padding:6px 24px 8px}
      .crumbs button{font-size:22px;font-weight:750;letter-spacing:-.5px;border-radius:9px}
      .seg{border-radius:10px;border:0;background:var(--s2)}.seg button{border-radius:8px;width:34px;height:30px}
      .chip{background:var(--surface);padding:5px 14px;border-radius:99px;font-size:13px}
      .chip.on{background:var(--soft);color:var(--acct);border-color:color-mix(in srgb,var(--acc) 32%,transparent);box-shadow:none}
      #chips{padding:2px 24px 10px}
      #content{padding:4px 24px 120px}
      .sec{font-size:11px;letter-spacing:.1em;margin:20px 0 10px}

      /* kartu */
      .item{border-radius:16px;box-shadow:none;border:1px solid var(--line);background:var(--surface)}
      .item:hover{transform:none;box-shadow:var(--sh);border-color:color-mix(in srgb,var(--acc) 28%,var(--line))}
      .item.file .thumb{margin:6px 6px 0;border-radius:11px}
      .item.folder{background:var(--surface);border-color:var(--line);padding:11px 6px 11px 11px}
      .item.folder .fi{background:color-mix(in srgb,var(--c) 14%,transparent);box-shadow:none;border-radius:12px;width:40px;height:40px}
      .item.sel{background:color-mix(in srgb,var(--acc) 7%,var(--surface));border-color:var(--acct);box-shadow:0 0 0 1px var(--acct)}
      .item.ph{border-radius:10px;border:0}.item.ph:hover{transform:none;box-shadow:none}
      .item .chk{border-radius:7px;width:22px;height:22px}
      .nm{font-weight:600}
      .row{border-radius:12px}.row.head{backdrop-filter:none;background:var(--surface)}
      .empty .eic{background:var(--soft);box-shadow:none;width:88px;height:88px}
      .banner{border-radius:14px;margin:2px 24px 10px}
      .hero{margin:0 0 2px}
      .hello h2{font-size:24px;letter-spacing:-.6px;margin:2px 0}
      .hello h2 span{background:none;-webkit-text-fill-color:currentColor;color:var(--acct)}
      .cats{gap:10px;margin:14px 0 2px}
      .cat{flex-direction:row;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);box-shadow:none}
      .cat::after{display:none}
      .cat:hover{transform:none;box-shadow:var(--sh);border-color:color-mix(in srgb,var(--c) 40%,var(--line))}
      .cat .ci{margin:0;width:40px;height:40px;border-radius:12px}
      .cat .ct{display:flex;flex-direction:column;min-width:0;line-height:1.3}.cat b{font-size:14px}.cat small{margin:0}
      #selbar{border-radius:14px;backdrop-filter:none;background:var(--text)}
      #selbar button{border-radius:10px}
      .menu{border-radius:14px;backdrop-filter:none;background:var(--surface);padding:6px}
      .menu button{border-radius:9px;padding:9px 11px}
      .mbg{background:rgba(10,12,24,.45);backdrop-filter:blur(4px)}
      .modal{border-radius:20px;padding:24px;background:var(--surface)}
      .modal h2{font-size:19px;letter-spacing:-.3px}
      .modal.big{max-width:720px}
      .toast{border-radius:12px;backdrop-filter:none}
      #uploads{border-radius:18px;backdrop-filter:none;background:var(--surface)}
      #preview{backdrop-filter:blur(10px)}

      /* ===== panel admin ===== */
      .adm-tabs{display:flex;gap:2px;overflow:auto;padding:0 0 10px;border-bottom:1px solid var(--line);margin:0 0 18px;position:sticky;top:-4px;background:var(--surface);z-index:4;scrollbar-width:none}
      .adm-tabs::-webkit-scrollbar{display:none}
      .adm-tab{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;border:0;background:none;padding:8px 13px;border-radius:10px;font-weight:600;color:var(--muted);font-size:13.5px}
      .adm-tab:hover{background:var(--s2);color:var(--text)}
      .adm-tab.on{background:var(--soft);color:var(--acct)}
      .adm-tab .nbadge{margin-left:2px}
      .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
      .kpi{border:1px solid var(--line);border-radius:16px;padding:16px;background:var(--surface);display:flex;flex-direction:column;gap:2px;min-width:0}
      .kpi .ki{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c);margin-bottom:10px}
      .kpi .kl{color:var(--muted);font-weight:600;font-size:12.5px}
      .kpi b{font-size:26px;letter-spacing:-.8px;line-height:1.15}
      .kpi small{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
      .panel{border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:18px;min-width:0}
      .panel.nopad{padding:0;overflow:hidden}
      .panel .ph{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
      .panel .ph h3{margin:0;flex:1;font-size:15px;letter-spacing:-.2px}
      .panel .ph small{color:var(--muted)}
      .pgrid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px;margin-top:12px}
      .c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
      @media(max-width:1180px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.c3,.c4,.c5,.c6,.c7,.c8{grid-column:span 12}}
      .alerts{display:grid;gap:8px;margin-bottom:12px}
      .alert{--bc:#f59e0b;display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;border:1px solid color-mix(in srgb,var(--bc) 30%,transparent);background:color-mix(in srgb,var(--bc) 9%,var(--surface))}
      .alert.danger{--bc:#ef4444}.alert.info{--bc:var(--acc)}
      .alert>svg{color:var(--bc)}.alert span{flex:1;min-width:0}
      .alert[data-adm]{cursor:pointer}.alert[data-adm]:hover{background:color-mix(in srgb,var(--bc) 14%,var(--surface))}
      .chart{width:100%;height:auto;display:block;overflow:visible}
      .chart .cg{stroke:var(--line);stroke-width:1}
      .chart .bt{fill:color-mix(in srgb,var(--acc) 26%,var(--surface))}
      .chart .bu{fill:var(--acc)}
      .chart .cl{fill:var(--muted);font-size:11px}
      .chart g:hover .bt{fill:color-mix(in srgb,var(--acc) 40%,var(--surface))}
      .lg{display:flex;gap:14px;color:var(--muted);font-size:12.5px;flex-wrap:wrap}.lg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px}
      .big-n{font-size:28px;font-weight:800;letter-spacing:-.9px;line-height:1.1}
      .big-n small{font-size:13px;color:var(--muted);font-weight:500;letter-spacing:0}
      .pb2{height:6px;border-radius:4px;background:var(--s2);overflow:hidden}
      .pb2 b{display:block;height:100%;border-radius:4px;background:var(--acc);transition:width .4s}
      .pb2.warn b{background:#f59e0b}.pb2.danger b{background:#ef4444}.pb2.ok b{background:var(--ok)}
      .av2{width:36px;height:36px;border-radius:11px;background:hsl(var(--h) 62% 52%);color:#fff;font-weight:700;display:grid;place-items:center;flex:none;font-size:14px}
      .lrow{display:grid;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);min-width:0}
      .lrow:last-child{border-bottom:0}
      .lrow[data-adm]{cursor:pointer}.lrow[data-adm]:hover{background:var(--s2)}
      .lrow.sel{background:var(--soft)}
      .lrow .un{min-width:0;display:flex;flex-direction:column;line-height:1.3}
      .lrow .un b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
      .lrow .un small,.lrow .muted{color:var(--muted);font-size:12.5px}
      .lrow .un small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
      .uwho{display:flex;align-items:center;gap:12px;min-width:0}
      .ur{grid-template-columns:24px minmax(0,1.4fr) minmax(0,1.1fr) 110px 36px}
      .ur .stor{min-width:0;display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--muted)}.ur .stor b{color:var(--text);font-weight:650}
      .ur input[type=checkbox],.lh input[type=checkbox]{width:17px;height:17px;accent-color:var(--acc);margin:0}
      .ur .usub{display:none}
      .lh{display:grid;grid-template-columns:24px minmax(0,1.4fr) minmax(0,1.1fr) 110px 36px;gap:12px;padding:10px 16px;color:var(--muted);font-size:12px;font-weight:700;border-bottom:1px solid var(--line);background:var(--s2)}
      @media(max-width:760px){
        .ur{grid-template-columns:24px minmax(0,1fr) 36px}.ur .stor,.ur .seen{display:none}.ur .usub{display:block}.lh{display:none}
      }
      .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
      .toolbar select{width:auto;min-width:150px;max-width:100%}
      .tsearch{position:relative;flex:1;min-width:180px;max-width:340px}
      .tsearch svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
      .tsearch input{padding-left:38px!important}
      .fchips{display:flex;gap:6px;flex-wrap:wrap}
      .bulkbar{position:sticky;bottom:14px;margin-top:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;border-radius:14px;background:var(--text);color:var(--bg);box-shadow:var(--sh);z-index:5}
      .bulkbar b{margin:0 8px 0 6px}
      .bulkbar .btn{background:transparent;color:inherit;border-color:rgba(127,127,127,.35);min-height:32px}
      .bulkbar .btn:hover{background:rgba(127,127,127,.25)}
      .bulkbar .btn.dng{color:#ff8a8f}
      .rq{grid-template-columns:36px minmax(0,1fr) auto}
      .rq .btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
      .pl{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.pl .pill{margin:0}
      .fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
      @media(max-width:760px){.fgrid{grid-template-columns:1fr}}
      .field label,.field .lbl{margin-top:0}
      .setrow{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
      .setrow:last-child{border-bottom:0}.setrow .st{flex:1;min-width:0}.setrow .st small{display:block;color:var(--muted);font-size:12.5px}
      .sw{position:relative;flex:none;width:42px;height:24px;display:inline-block}
      .sw input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:2}
      .sw i{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:.2s}
      .sw i::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:.2s}
      .sw input:checked+i{background:var(--acc)}.sw input:checked+i::after{transform:translateX(18px)}
      .sw input:focus-visible+i{outline:2px solid var(--acct);outline-offset:2px}
      .udh{display:flex;align-items:center;gap:14px}
      .udh .un{min-width:0}.udh small{color:var(--muted)}
      .sgrid.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
      @media(max-width:560px){.sgrid.g3{grid-template-columns:1fr 1fr}}
      .agrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:6px}
      .agrid .btn{justify-content:flex-start}
      .acl .a.bad .ai{background:color-mix(in srgb,var(--danger) 13%,transparent);color:var(--danger)}
      .panel .acl{margin:0}
      .acmore{display:flex;justify-content:center;padding:12px}
      .acmore:empty{display:none}
      .sesrow{grid-template-columns:36px minmax(0,1fr) auto}
      .adm-loading{display:grid;gap:12px}.adm-loading .sk{height:96px}
      @media(max-width:900px){
        .adm-tabs{top:0}
        .banner{margin:2px 14px 8px}
        .cat{padding:10px 12px}
        #content{padding:4px 14px calc(150px + env(safe-area-inset-bottom))}
        .kpi b{font-size:22px}
        .rq{grid-template-columns:36px minmax(0,1fr)}.rq .btns{grid-column:1/-1;justify-content:flex-start}
      }

      /* ===== verifikasi wajah ===== */
      .fscan{display:flex;flex-direction:column;align-items:center;gap:14px;padding:4px 0}
      .fcam{position:relative;width:min(260px,70vw);aspect-ratio:1;border-radius:50%;overflow:hidden;background:#0b1020;box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 30%,transparent)}
      .fcam video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
      .fring{position:absolute;inset:0;border-radius:50%;border:3px solid color-mix(in srgb,var(--acc) 70%,#fff);animation:fpulse 1.8s ease-in-out infinite;pointer-events:none}
      @keyframes fpulse{50%{transform:scale(.97);opacity:.5}}
      .fmsg{font-weight:600;text-align:center;min-height:22px}
      .fsteps{display:flex;gap:8px}.fsteps i{width:34px;height:5px;border-radius:9px;background:var(--line);transition:.25s}.fsteps i.on{background:var(--acc)}
      .fstat{display:flex;gap:14px;align-items:center;padding:14px;border-radius:16px;background:var(--bg);border:1px solid var(--line)}
      .fstat .fi{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--line);color:var(--muted)}
      .fstat.on .fi{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
      .fstat small{display:block;color:var(--muted);margin-top:2px}
      .codes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
      .codes code{padding:9px 10px;border-radius:10px;background:var(--bg);border:1px solid var(--line);font-size:13px;text-align:center;letter-spacing:.5px;font-weight:600;user-select:all}
