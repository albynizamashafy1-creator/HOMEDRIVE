      /* ---------- api / toast / modal ---------- */
      async function api(path, body) {
        const opt = { credentials:'same-origin', headers:{'X-Requested-With':'drive','X-Client-Id':CID} };
        if (body !== undefined) { opt.method='POST'; opt.headers['Content-Type']='application/json'; opt.body=JSON.stringify(body); }
        const r = await fetch('/api/'+path, opt);
        let j = {}; try { j = await r.json(); } catch(e){}
        if (!r.ok) { if (r.status===401 && !/^(login|face\/verify)/.test(path)) { if (S.me) forceLogout(false); else showAuth(); } const er = new Error(j.error || ('Error '+r.status)); er.code = j.code; throw er; }
        return j;
      }
      function toast(msg, o={}) {
        const t = document.createElement('div'); t.className='toast'; t.innerHTML = `<span>$${esc(msg)}</span>`;
        if (o.label) { const b=document.createElement('button'); b.textContent=o.label; b.onclick=()=>{t.remove(); o.fn&&o.fn();}; t.append(b); }
        $$('#toasts').append(t); setTimeout(()=>t.remove(), o.label?6500:3400);
      }
      function modal(html, cls='') {
        const bg = document.createElement('div'); bg.className='mbg'; bg.innerHTML=`<div class="modal $${cls}" role="dialog">$${html}</div>`;
        bg.addEventListener('mousedown', e => { if (e.target===bg) bg.remove(); });
        document.body.append(bg); return bg;
      }
      function ask(title, value='', ok='OK') {
        return new Promise(res => {
          const m = modal(`<h2>$${esc(title)}</h2><input type="text" id="mi" value="$${esc(value)}"><div class="actions"><button class="btn" id="mc">Batal</button><button class="btn pri" id="mo">$${esc(ok)}</button></div>`);
          const i = m.querySelector('#mi'); i.focus(); const dot = value.lastIndexOf('.'); i.setSelectionRange(0, dot>0?dot:value.length);
          const mo = new MutationObserver(()=>{ if(!document.body.contains(m)) { mo.disconnect(); res(null); } });
          const done = v => { mo.disconnect(); m.remove(); res(v); };
          m.querySelector('#mc').onclick = () => done(null); m.querySelector('#mo').onclick = () => done(i.value);
          i.onkeydown = e => { if (e.key==='Enter') done(i.value); };
          mo.observe(document.body,{childList:true});
        });
      }
      function confirmBox(title, text, ok='Hapus') {
        return new Promise(res => {
          const m = modal(`<h2>$${esc(title)}</h2><div style="color:var(--muted)">$${esc(text)}</div><div class="actions"><button class="btn" id="mc">Batal</button><button class="btn pri" id="mo">$${esc(ok)}</button></div>`);
          const mo = new MutationObserver(()=>{ if(!document.body.contains(m)) { mo.disconnect(); res(false); } });
          m.querySelector('#mc').onclick = () => { mo.disconnect(); m.remove(); res(false); }; m.querySelector('#mo').onclick = () => { mo.disconnect(); m.remove(); res(true); };
          mo.observe(document.body,{childList:true});
        });
      }

      /* ---------- tema ---------- */
      function applyTheme() { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
        const dark = t ? t==='dark' : matchMedia('(prefers-color-scheme:dark)').matches; $$('#themeBtn').innerHTML = ic(dark?'sun':'moon',20); }
      $$('#themeBtn').onclick = () => { const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme==='dark' : matchMedia('(prefers-color-scheme:dark)').matches; localStorage.setItem('theme', dark?'light':'dark'); applyTheme(); };

      /* ---------- auth ---------- */
      let setupMode = false;
      function showAuth(setup) {
        try { stopLive(); } catch(e) {}
        setupMode = !!setup; document.body.classList.add('noapp'); $$('#app').classList.add('hidden'); $$('#auth').classList.remove('hidden');
        $$('#authLogo').innerHTML = ic('drive',20); $$('#authLogo2').innerHTML = ic('drive',20);
        $$('#af1').innerHTML = ic('upload',18); $$('#af2').innerHTML = ic('shield',18); $$('#af3').innerHTML = ic('link',18); $$('#pwEye').innerHTML = ic('eye',18);
        $$('#ap').type = 'password';
        $$('#authTitle').textContent = setup ? 'Buat akun owner' : 'Selamat datang'; XM.auth();
        $$('#authSub').textContent = setup ? 'Akun pertama ini akan menjadi owner HomeDrive.' : 'Masuk ke penyimpanan pribadi Anda.';
        $$('#authBtn').textContent = setup ? 'Buat akun & mulai' : 'Masuk';
        $$('#ap').autocomplete = setup ? 'new-password' : 'current-password';
      }
      $$('#pwEye').onclick = () => { const i = $$('#ap'), show = i.type === 'password'; i.type = show ? 'text' : 'password'; $$('#pwEye').innerHTML = ic(show ? 'eyeOff' : 'eye', 18); };
      $$('#authForm').onsubmit = async e => {
        e.preventDefault(); $$('#authErr').textContent='';
        try { const lr = await api(setupMode?'setup':'login', {username:$$('#au').value, password:$$('#ap').value}); if (lr.need_face) return faceLoginStep(lr); $$('#ap').value=''; await boot(); }
        catch(err) { $$('#authErr').textContent = err.message; }
      };
      async function boot() {
        applyTheme(); applyAccent();
        const j = await fetch('/api/me',{credentials:'same-origin'}).then(r=>r.json());
        if (!j.user) return showAuth(j.setup_needed);
        S.me = j.user; S.trashDays = j.trash_days || 0; S.pending = j.pending || 0; S.limits = j.limits || {}; document.body.classList.remove('noapp'); $$('#auth').classList.add('hidden'); $$('#app').classList.remove('hidden');
        $$('#sideLogo').innerHTML = ic('drive',20); $$('#searchIc').innerHTML = ic('search',18); $$('#menuBtn').innerHTML = ic('menu',22);
        $$('#newBtn').innerHTML = ic('plus',20)+'Baru'; $$('#fab').innerHTML = ic('plus',26); $$('#sortBtn').innerHTML = ic('sort',19);
        $$('#emptyTrash').innerHTML = ic('trash',15)+'Kosongkan sampah';
        $$('#userBtn').textContent = S.me.username[0].toUpperCase(); paintUser(); $$('#q').placeholder = matchMedia('(max-width:900px)').matches ? 'Cari file…' : 'Cari file dan folder';
        $$('#logoutBtn').innerHTML = ic('logout',18);
        $$('#bellBtn').innerHTML = ic('bell',20); S.storage = j.storage || null; S.notice = j.notice || {}; S.unread = j.unread || 0; setBadge(); $$('#bellBtn').onclick = notifDialog; startLive(); pollNotif();
        buildNav();
        $$('#tabbar').innerHTML = [['files','drive','Drive'],['recent','clock','Terbaru'],['photos','image','Foto'],['starred','star','Bintang'],['more','menu','Lainnya']].map(t => `<a data-t="$${t[0]}">$${ic(t[1],22)}<span>$${t[2]}</span></a>`).join('');
        route();
      }
      function paintUser() {
        if (!S.me) return; const r = S.me.is_owner ? 'Owner' : S.me.is_admin ? 'Admin' : 'Pengguna';
        $$('#uav').textContent = S.me.username[0].toUpperCase(); $$('#uname').textContent = S.me.username; $$('#urole').textContent = r; $$('#userBtn').textContent = S.me.username[0].toUpperCase();
      }
      $$('#tabbar').onclick = e => { const a = e.target.closest('[data-t]'); if (!a) return; if (a.dataset.t==='more') document.body.classList.add('nav-open'); else go('#/'+a.dataset.t); };

      /* ---------- routing / load ---------- */
      function go(h) { if (location.hash === h) route(); else location.hash = h; }
      function route() {
        if (!S.me) return;
        const p = (decodeURIComponent(location.hash.slice(1)) || '/files').split('/').filter(Boolean);
        S.term = ''; S.view = 'files'; S.parent = null; S.filter = 'all';
        if (p[0]==='search') { S.term = p.slice(1).join('/'); S.view='search'; }
        else if (p[0]==='admin' && S.me.is_admin) { S.view = 'admin'; ADM.tab = ADM_TABS.some(t => t[0]===p[1] && (!t[3] || S.me.is_owner)) ? p[1] : 'overview'; }
        else if (VIEWS.includes(p[0])) S.view = p[0];
        else if (p[0]==='files' && p[1]) S.parent = p[1];
