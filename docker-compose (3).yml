      :root{--g:linear-gradient(135deg,#c1121f,#15803d)}
      body{background:radial-gradient(800px 400px at 10% -10%,rgba(193,18,31,.2),transparent),radial-gradient(700px 400px at 100% 100%,rgba(21,128,61,.2),transparent),var(--bg)}
      .brand i{box-shadow:0 6px 16px rgba(193,18,31,.4)}
      .card{border-top:5px solid transparent;border-image:repeating-linear-gradient(45deg,#c1121f 0 10px,#fff 10px 20px) 1}
      .cdw{display:flex;gap:10px;justify-content:center;margin:20px 0 6px}
      .cdw div{min-width:70px;padding:10px;border-radius:14px;background:var(--g);color:#fff;line-height:1.1}
