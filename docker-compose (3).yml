      const ic = (n, sz=20, cls='') => `<svg class="ic $${cls}" width="$${sz}" height="$${sz}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">$${I[n]||''}</svg>`;

      /* ---------- state ---------- */
      const CID = Math.random().toString(36).slice(2) + Date.now().toString(36);
      const S = { me:null, view:'files', parent:null, term:'', items:[], crumbs:[], sel:new Set(), mode:localStorage.getItem('mode')||'grid',
        sort:JSON.parse(localStorage.getItem('sort')||'{"by":"name","dir":1}'), used:0, quota:0, stats:null, lastClick:null, filter:'all', raw:[], trashDays:0, storage:null, unread:0, sig:null };
      const CATCOL = {photos:'#10b981',videos:'#ef4444',audio:'#f59e0b',documents:'#3b82f6',other:'#94a3b8'};
      const CATNAME = {photos:'Foto',videos:'Video',audio:'Audio',documents:'Dokumen',other:'Lainnya'};
      const TITLES = {recent:'Terbaru',starred:'Berbintang',trash:'Sampah',photos:'Foto',videos:'Video',audio:'Audio',documents:'Dokumen',shared:'Dibagikan',large:'File besar'};
