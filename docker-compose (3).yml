        const miss = j.missing.length ? `<div class="hint" style="margin:0 0 8px">Contoh: $${j.missing.slice(0,5).map(x => esc(x.name) + ' (' + esc(x.user) + ')').join(', ')}$${j.missing_count > 5 ? ', …' : ''}</div>` : '';
        const bk = s.backups.length ? s.backups.map(x => `<div class="setrow"><div class="st"><b>$${esc(x.name)}</b>$${x.name.startsWith('auto') ? '<em class="pill">otomatis</em>' : ''}<small>$${fmtSize(x.size)} · $${fmtDT(x.ts)}</small></div><a class="btn sm" href="/api/backup?file=$${encodeURIComponent(x.name)}" style="text-decoration:none">Unduh</a><button class="btn sm dng" data-adm="bk-del" data-v="$${esc(x.name)}">Hapus</button></div>`).join('') : '<div class="hint">Belum ada cadangan.</div>';
