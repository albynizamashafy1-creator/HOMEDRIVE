        stopLive(); S.me = null; S.sel.clear(); S.items = []; S.raw = []; S.crumbs = []; S.parent = null; S.sig = null; S.stats = null; S.storage = null; S.notice = {}; S.unread = 0;
        NF = {items:[], unread:0, maxId:0, ready:false}; LIVE.clear();
