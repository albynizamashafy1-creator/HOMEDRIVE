       edit:'<path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16z"/><path d="m14 6 4 4"/>',
       move:'<path d="M4 12h15M13 6l6 6-6 6"/>',
       copy:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/>',
       info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5h.01"/>',
       more:'<circle cx="12" cy="5" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="12" cy="19" r="1.3"/>',
       x:'<path d="M6 6l12 12M18 6 6 18"/>',
       check:'<path d="m5 12.5 4.5 4.5L19 7"/>',
       menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',
       logout:'<path d="M9 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h4M16 8l4 4-4 4M20 12H9"/>',
       key:'<circle cx="8" cy="15" r="4"/><path d="m11 12 9-9M16 7l3 3"/>',
       users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5a6.5 6.5 0 0 1 3.5 5.5"/>',
       sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.4 1.4M17.6 17.6 19 19M5 19l1.4-1.4M17.6 6.4 19 5"/>',
       moon:'<path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/>',
       camera:'<path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/>',
       folderPlus:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M12 10.5v5M9.5 13h5"/>',
       filePlus:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M12 12v6M9 15h6"/>',
       chevron:'<path d="m9 6 6 6-6 6"/>',
       restore:'<path d="M4 12a8 8 0 1 0 3-6.2M4 4v5h5"/>',
       drive:'<rect x="3" y="13" width="18" height="7" rx="2"/><path d="M5 13l2.5-8h9L19 13M7 16.5h.01M11 16.5h.01"/>',
       lock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
       sort:'<path d="M7 4v16M3 16l4 4 4-4M17 20V4M13 8l4-4 4 4"/>',
       globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
       arrowUp:'<path d="M12 19V5M6 11l6-6 6 6"/>',
       retry:'<path d="M20 12a8 8 0 1 1-3-6.2M20 4v5h-5"/>',
       palette:'<path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.8-.8 1.8-1.7 0-.5-.2-.9-.5-1.3-.3-.4-.5-.8-.5-1.3 0-1 .8-1.7 1.8-1.7H16a5 5 0 0 0 5-5c0-3.9-4-7-9-7z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10" cy="7" r="1"/><circle cx="15" cy="7" r="1"/>',
       pulse:'<path d="M3 12h4l3-8 4 16 3-8h4"/>',
       layers:'<path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/>',
       keyboard:'<rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h.01M11 10h.01M15 10h.01M7 14h10"/>',
       weight:'<path d="M6 8h12l2 12H4z"/><circle cx="12" cy="5" r="2"/>',
       filter:'<path d="M4 5h16l-6 8v6l-4-2v-4z"/>',
      };
      const ic = (n, sz=20, cls='') => `<svg class="ic $${cls}" width="$${sz}" height="$${sz}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">$${I[n]||''}</svg>`;

      /* ---------- state ---------- */
      const S = { me:null, view:'files', parent:null, term:'', items:[], crumbs:[], sel:new Set(), mode:localStorage.getItem('mode')||'grid',
        sort:JSON.parse(localStorage.getItem('sort')||'{"by":"name","dir":1}'), used:0, quota:0, stats:null, lastClick:null, filter:'all', raw:[], trashDays:0 };
      const CATCOL = {photos:'#10b981',videos:'#ef4444',audio:'#f59e0b',documents:'#3b82f6',other:'#94a3b8'};
      const CATNAME = {photos:'Foto',videos:'Video',audio:'Audio',documents:'Dokumen',other:'Lainnya'};
      const TITLES = {recent:'Terbaru',starred:'Berbintang',trash:'Sampah',photos:'Foto',videos:'Video',audio:'Audio',documents:'Dokumen',shared:'Dibagikan',large:'File besar'};
      const VIEWS = ['recent','starred','trash','photos','videos','audio','documents','shared','large'];
      const NOSORT = ['photos','videos','recent','large'];
      const FILTERABLE = ['files','search','starred','shared','recent'];
      const FILTERS = [['all','Semua'],['folder','Folder'],['image','Gambar'],['video','Video'],['audio','Audio'],['doc','Dokumen'],['file','Lainnya']];
      const FOLDER_COLORS = ['#f5a524','#ef4444','#f97316','#22c55e','#10b981','#14b8a6','#0ea5e9','#6366f1','#8b5cf6','#ec4899','#64748b','#a16207'];
      const dl = (id, inline) => '/api/download/' + id + (inline ? '?inline=1' : '');

      /* ---------- util ---------- */
      function fmtSize(n) { if (!n) return '0 B'; const u=['B','KB','MB','GB','TB']; const i=Math.min(4,Math.floor(Math.log(n)/Math.log(1024))); return (n/1024**i).toFixed(i?1:0)+' '+u[i]; }
      const fmtDate = t => new Date(t*1000).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'});
      const fmtDT = t => new Date(t*1000).toLocaleString('id-ID',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
      function ftype(it) {
        if (it.is_folder) return {k:'folder',i:'folder',c:it.color||'#f5a524',l:'Folder'};
        const n = it.name.toLowerCase(), e = n.includes('.') ? n.split('.').pop() : '', m = it.mime||'';
        if (m.startsWith('image/') || /^(jpe?g|png|gif|webp|avif|bmp|heic|heif|svg|tiff?)$$/.test(e)) return {k:'image',i:'image',c:'#10b981',l:'Gambar'};
        if (m.startsWith('video/') || /^(mp4|mkv|mov|webm|avi|m4v|3gp|wmv)$$/.test(e)) return {k:'video',i:'video',c:'#ef4444',l:'Video'};
        if (m.startsWith('audio/') || /^(mp3|wav|flac|m4a|ogg|aac|opus)$$/.test(e)) return {k:'audio',i:'music',c:'#f59e0b',l:'Audio'};
        if (e==='pdf') return {k:'doc',i:'fileText',c:'#ef4444',l:'PDF'};
        if (/^(docx?|odt|rtf)$$/.test(e)) return {k:'doc',i:'fileText',c:'#3b82f6',l:'Dokumen Word'};
        if (/^(xlsx?|ods|csv)$$/.test(e)) return {k:'doc',i:'table',c:'#22c55e',l:'Spreadsheet'};
        if (/^(pptx?|odp)$$/.test(e)) return {k:'doc',i:'slides',c:'#f97316',l:'Presentasi'};
        if (/^(zip|rar|7z|tar|gz|bz2|xz)$$/.test(e)) return {k:'file',i:'archive',c:'#a855f7',l:'Arsip'};
        if (/^(js|ts|py|html|css|json|sh|yml|yaml|xml|c|cpp|go|rs|java|php|sql|ini|conf|log)$$/.test(e)) return {k:'doc',i:'code',c:'#64748b',l:'Kode / teks'};
        if (/^(txt|md|epub)$$/.test(e) || m.startsWith('text/')) return {k:'doc',i:'fileText',c:'#64748b',l:'Teks'};
        return {k:'file',i:'file',c:'#94a3b8',l:'File'};
      }
      function kind(it) {
        const m = it.mime||'', n = it.name.toLowerCase();
        if (/^image\/(png|jpeg|gif|webp|avif|bmp)$$/.test(m)) return 'image';
        if (m.startsWith('video/')) return 'video'; if (m.startsWith('audio/')) return 'audio';
        if (m==='application/pdf') return 'pdf';
        if (m==='text/plain' || /\.(md|json|log|py|js|ts|css|sh|yml|yaml|csv|ini|conf|txt|xml|html)$$/.test(n)) return 'text';
        return null;
      }

      /* ---------- api / toast / modal ---------- */
      async function api(path, body) {
        const opt = { credentials:'same-origin', headers:{'X-Requested-With':'drive'} };
        if (body !== undefined) { opt.method='POST'; opt.headers['Content-Type']='application/json'; opt.body=JSON.stringify(body); }
        const r = await fetch('/api/'+path, opt);
        let j = {}; try { j = await r.json(); } catch(e){}
        if (!r.ok) { if (r.status===401 && path!=='login') showAuth(); throw new Error(j.error || ('Error '+r.status)); }
        return j;
      }
      function toast(msg, o={}) {
        const t = document.createElement('div'); t.className='toast'; t.innerHTML = `<span>$${esc(msg)}</span>`;
        if (o.label) { const b=document.createElement('button'); b.textContent=o.label; b.onclick=()=>{t.remove(); o.fn&&o.fn();}; t.append(b); }
        $$('#toasts').append(t); setTimeout(()=>t.remove(), o.label?6500:3400);
      }
      function modal(html, cls='') {
        const bg = document.createElement('div'); bg.className='mbg'; bg.innerHTML=`<div class="modal $${cls}" role="dialog">$${html}</div>`;
        bg.addEventListener('mousedown', e => { if (e.target===bg) bg.remove(); });
        document.body.append(bg); return bg;
      }
      function ask(title, value='', ok='OK') {
        return new Promise(res => {
          const m = modal(`<h2>$${esc(title)}</h2><input type="text" id="mi" value="$${esc(value)}"><div class="actions"><button class="btn" id="mc">Batal</button><button class="btn pri" id="mo">$${esc(ok)}</button></div>`);
          const i = m.querySelector('#mi'); i.focus(); const dot = value.lastIndexOf('.'); i.setSelectionRange(0, dot>0?dot:value.length);
          const mo = new MutationObserver(()=>{ if(!document.body.contains(m)) { mo.disconnect(); res(null); } });
          const done = v => { mo.disconnect(); m.remove(); res(v); };
          m.querySelector('#mc').onclick = () => done(null); m.querySelector('#mo').onclick = () => done(i.value);
          i.onkeydown = e => { if (e.key==='Enter') done(i.value); };
          mo.observe(document.body,{childList:true});
        });
      }
      function confirmBox(title, text, ok='Hapus') {
        return new Promise(res => {
          const m = modal(`<h2>$${esc(title)}</h2><div style="color:var(--muted)">$${esc(text)}</div><div class="actions"><button class="btn" id="mc">Batal</button><button class="btn pri" id="mo">$${esc(ok)}</button></div>`);
          const mo = new MutationObserver(()=>{ if(!document.body.contains(m)) { mo.disconnect(); res(false); } });
          m.querySelector('#mc').onclick = () => { mo.disconnect(); m.remove(); res(false); }; m.querySelector('#mo').onclick = () => { mo.disconnect(); m.remove(); res(true); };
          mo.observe(document.body,{childList:true});
        });
      }

      /* ---------- tema ---------- */
      function applyTheme() { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
        const dark = t ? t==='dark' : matchMedia('(prefers-color-scheme:dark)').matches; $$('#themeBtn').innerHTML = ic(dark?'sun':'moon',20); }
      $$('#themeBtn').onclick = () => { const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme==='dark' : matchMedia('(prefers-color-scheme:dark)').matches; localStorage.setItem('theme', dark?'light':'dark'); applyTheme(); };

      /* ---------- auth ---------- */
      let setupMode = false;
      function showAuth(setup) {
        setupMode = !!setup; $$('#app').classList.add('hidden'); $$('#auth').classList.remove('hidden');
        $$('#authLogo').innerHTML = ic('drive',20);
        $$('#authTitle').textContent = setup ? 'Buat akun admin' : 'Selamat datang';
        $$('#authSub').textContent = setup ? 'Akun pertama ini akan menjadi admin HomeDrive.' : 'Masuk ke penyimpanan pribadi Anda.';
        $$('#authBtn').textContent = setup ? 'Buat akun & mulai' : 'Masuk';
        $$('#ap').autocomplete = setup ? 'new-password' : 'current-password';
      }
      $$('#authForm').onsubmit = async e => {
        e.preventDefault(); $$('#authErr').textContent='';
        try { await api(setupMode?'setup':'login', {username:$$('#au').value, password:$$('#ap').value}); $$('#ap').value=''; await boot(); }
        catch(err) { $$('#authErr').textContent = err.message; }
      };
      async function boot() {
        applyTheme(); applyAccent();
        const j = await fetch('/api/me',{credentials:'same-origin'}).then(r=>r.json());
        if (!j.user) return showAuth(j.setup_needed);
        S.me = j.user; S.trashDays = j.trash_days || 0; $$('#auth').classList.add('hidden'); $$('#app').classList.remove('hidden');
        $$('#sideLogo').innerHTML = ic('drive',20); $$('#searchIc').innerHTML = ic('search',18); $$('#menuBtn').innerHTML = ic('menu',22);
        $$('#newBtn').innerHTML = ic('plus',20)+'Baru'; $$('#fab').innerHTML = ic('plus',26); $$('#sortBtn').innerHTML = ic('sort',19);
        $$('#emptyTrash').innerHTML = ic('trash',15)+'Kosongkan sampah';
        $$('#userBtn').textContent = S.me.username[0].toUpperCase();
        $$('#logoutBtn').innerHTML = ic('logout',20)+'Keluar ('+esc(S.me.username)+')';
        const nav = ['#Pustaka',['files','drive','Drive Saya'],['recent','clock','Terbaru'],['starred','star','Berbintang'],'#Jenis file',['photos','image','Foto'],['videos','video','Video'],['audio','music','Audio'],['documents','fileText','Dokumen'],'#Kelola',['shared','globe','Dibagikan'],['large','weight','File besar'],['trash','trash','Sampah']];
        $$('#nav').innerHTML = nav.map(n => typeof n==='string' ? `<div class="nl">$${n.slice(1)}</div>` : `<a data-v="$${n[0]}" $${n[0]==='files'?'data-drop=""':''}>$${ic(n[1],20)}<span>$${n[2]}</span></a>`).join('');
        $$('#tabbar').innerHTML = [['files','drive','Drive'],['recent','clock','Terbaru'],['photos','image','Foto'],['starred','star','Bintang'],['more','menu','Lainnya']].map(t => `<a data-t="$${t[0]}">$${ic(t[1],22)}<span>$${t[2]}</span></a>`).join('');
        route();
      }
      $$('#tabbar').onclick = e => { const a = e.target.closest('[data-t]'); if (!a) return; if (a.dataset.t==='more') document.body.classList.add('nav-open'); else go('#/'+a.dataset.t); };

      /* ---------- routing / load ---------- */
      function go(h) { if (location.hash === h) route(); else location.hash = h; }
      function route() {
        if (!S.me) return;
        const p = (decodeURIComponent(location.hash.slice(1)) || '/files').split('/').filter(Boolean);
        S.term = ''; S.view = 'files'; S.parent = null; S.filter = 'all';
        if (p[0]==='search') { S.term = p.slice(1).join('/'); S.view='search'; }
        else if (VIEWS.includes(p[0])) S.view = p[0];
        else if (p[0]==='files' && p[1]) S.parent = p[1];
        if (S.view!=='search') $$('#q').value = '';
        document.body.classList.remove('nav-open');
        load();
      }
      window.addEventListener('hashchange', route);
      function sortItems(items) {
        if (NOSORT.includes(S.view)) return items;
        const {by,dir} = S.sort;
        return [...items].sort((a,b) => {
          if (a.is_folder !== b.is_folder) return a.is_folder ? -1 : 1;
          const r = by==='size' ? a.size-b.size : by==='modified' ? a.modified-b.modified : a.name.localeCompare(b.name,'id',{numeric:true,sensitivity:'base'});
          return r*dir;
        });
      }
      function applyFilter(items) {
        if (S.filter==='all' || !FILTERABLE.includes(S.view)) return items;
        return items.filter(it => S.filter==='folder' ? it.is_folder : (!it.is_folder && ftype(it).k===S.filter));
      }
      const skeleton = () => '<div class="grid">' + Array.from({length:10}, () => '<div class="sk"></div>').join('') + '</div>';
      async function load(keepSel) {
        if (!keepSel) S.sel.clear();
        const sk = setTimeout(() => { if (!keepSel) $$('#content').innerHTML = skeleton(); }, 160);
        try {
          const qs = S.term ? 'q='+encodeURIComponent(S.term) : 'view='+S.view+(S.parent?'&parent='+S.parent:'');
          const [j, st] = await Promise.all([api('list?'+qs), api('stats').catch(()=>null)]);
          S.raw = j.items; S.items = applyFilter(sortItems(j.items)); S.crumbs = j.crumbs; S.used = j.used; S.quota = j.quota; S.stats = st;
        } catch(e) { clearTimeout(sk); toast(e.message); if (S.parent) return go('#/files'); }
        clearTimeout(sk); render();
      }
      function renderChips() {
        const c = $$('#chips'), on = FILTERABLE.includes(S.view) && (S.raw||[]).length > 5;
        c.classList.toggle('hidden', !on); if (!on) return;
        c.innerHTML = FILTERS.map(f => `<button class="chip $${S.filter===f[0]?'on':''}" data-f="$${f[0]}">$${f[1]}</button>`).join('');
      }
      $$('#chips').onclick = e => { const b = e.target.closest('[data-f]'); if (!b) return; S.filter = b.dataset.f; S.sel.clear(); S.items = applyFilter(sortItems(S.raw)); render(); };
      function dayLabel(t) {
        const sd = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime(), diff = Math.round((sd(new Date()) - sd(new Date(t*1000))) / 864e5);
        return diff<=0 ? 'Hari ini' : diff===1 ? 'Kemarin' : diff<7 ? 'Minggu ini' : diff<31 ? 'Bulan ini' : 'Lebih lama';
      }

      /* ---------- render ---------- */
      function badges(it) { return (it.starred?`<span class="bd star">$${ic('star',14,'fill')}</span>`:'') + (it.shared?`<span class="bd" title="Dibagikan">$${ic('globe',14)}</span>`:''); }
      function thumb(it) {
        const t = ftype(it);
        if (t.k==='image' && /^image\/(png|jpeg|gif|webp|avif|bmp)$$/.test(it.mime||'')) return `<img loading="lazy" decoding="async" draggable="false" src="$${dl(it.id,true)}" alt="">`;
        if (t.k==='video' && (it.mime||'').startsWith('video/')) return `<video preload="metadata" muted playsinline draggable="false" src="$${dl(it.id,true)}#t=0.5"></video><span class="vbadge">$${ic('video',12)}Video</span>`;
        return `<div class="ficon" style="--c:$${t.c}">$${ic(t.i,40)}</div>`;
      }
      const chk = () => `<div class="chk">$${ic('check',15)}</div>`;
      const moreBtn = id => `<button class="more" data-more="$${id}" aria-label="Menu">$${ic('more',18,'fill')}</button>`;
      function cardHTML(it) {
        const t = ftype(it), drag = S.view==='trash' ? '' : 'draggable="true"';
        if (it.is_folder) return `<div class="item folder" style="--c:$${t.c}" data-id="$${it.id}" data-drop="$${it.id}" $${drag}>$${chk()}<span class="fi" style="--c:$${t.c}">$${ic('folder',24,'soft')}</span><span class="nm" title="$${esc(it.name)}">$${esc(it.name)}</span>$${badges(it)}$${moreBtn(it.id)}</div>`;
        return `<div class="item file" data-id="$${it.id}" $${drag}>$${chk()}<div class="thumb">$${thumb(it)}</div><div class="cap"><span class="ti" style="--c:$${t.c}">$${ic(t.i,17)}</span><span class="nm" title="$${esc(it.name)}">$${esc(it.name)}</span>$${badges(it)}$${moreBtn(it.id)}</div></div>`;
      }
      function photoHTML(it) {
        return `<div class="item ph" data-id="$${it.id}" draggable="true"><div class="thumb">$${thumb(it)}</div>$${chk()}<div class="phcap">$${esc(it.name)}</div>$${it.starred?`<span class="bd">$${ic('star',15,'fill')}</span>`:''}$${moreBtn(it.id)}</div>`;
      }
      function listRow(it) {
        const t = ftype(it);
        return `<div class="row" data-id="$${it.id}" $${it.is_folder?`data-drop="$${it.id}"`:''} $${S.view==='trash'?'':'draggable="true"'}><div class="n"><span class="ti" style="--c:$${t.c}">$${ic(t.i,18)}</span><span class="nm" title="$${esc(it.name)}">$${esc(it.name)}</span>$${badges(it)}</div><div class="m">$${fmtDate(it.modified)}</div><div class="m">$${it.is_folder?'—':fmtSize(it.size)}</div>$${moreBtn(it.id)}</div>`;
      }
      function render() {
        document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('active', a.dataset.v===S.view));
        document.querySelectorAll('#tabbar a').forEach(a => a.classList.toggle('active', a.dataset.t===S.view));
        // judul / breadcrumb
        const c = $$('#crumbs'); c.innerHTML='';
        const addCrumb = (label, hash, drop) => { const b=document.createElement('button'); b.textContent=label; b.onclick=()=>go(hash); if (drop!==undefined) b.dataset.drop=drop; c.append(b); };
        const sep = () => { const s=document.createElement('span'); s.className='sep'; s.innerHTML=ic('chevron',16); c.append(s); };
        if (S.view==='files') { addCrumb('Drive Saya','#/files',''); S.crumbs.forEach(x=>{sep(); addCrumb(x.name,'#/files/'+x.id,x.id);}); }
        else addCrumb(S.view==='search' ? 'Hasil: '+S.term : TITLES[S.view], '#/'+S.view);
        const cnt = document.createElement('span'); cnt.className='count'; cnt.textContent = S.items.length+' item' + (S.view==='trash' && S.trashDays ? ' · dihapus otomatis setelah '+S.trashDays+' hari' : ''); c.append(cnt);
        $$('#emptyTrash').classList.toggle('hidden', !(S.view==='trash' && S.items.length));
        $$('#sortBtn').classList.toggle('hidden', NOSORT.includes(S.view));
        $$('#seg').innerHTML = `<button data-m="grid" class="$${S.mode==='grid'?'on':''}" title="Kotak">$${ic('grid',17)}</button><button data-m="list" class="$${S.mode==='list'?'on':''}" title="Daftar">$${ic('list',17)}</button>`;
        renderStorage(); renderChips();
        const el = $$('#content');
        if (!S.items.length) {
          const m = {files:['folder','Folder ini masih kosong','Seret file ke sini, atau gunakan tombol Baru.'],photos:['image','Belum ada foto','Unggah foto pertama Anda.'],videos:['video','Belum ada video','Unggah video pertama Anda.'],documents:['fileText','Belum ada dokumen','Unggah PDF, Word, Excel, dan lainnya.'],recent:['clock','Belum ada file terbaru',''],starred:['star','Belum ada item berbintang','Beri bintang pada file penting agar mudah ditemukan.'],trash:['trash','Sampah kosong','Item yang dihapus akan muncul di sini.'],search:['search','Tidak ada hasil','Coba kata kunci lain.'],audio:['music','Belum ada audio','Unggah musik atau rekaman suara.'],shared:['globe','Belum ada yang dibagikan','Bagikan file atau folder lewat menu titik tiga.'],large:['weight','Belum ada file','File terbesar Anda akan tampil di sini.']}[S.view];
          if (S.raw && S.raw.length) { m[0]='filter'; m[1]='Tidak ada yang cocok'; m[2]='Ganti filter di atas untuk melihat item lain.'; }
          const cta = !(S.raw && S.raw.length) && ['files','photos','videos','audio','documents'].includes(S.view) ? `<button class="btn pri" id="emptyUp">$${ic('upload',18)}Unggah</button>` : '';
          el.innerHTML = `<div class="empty"><div class="eic">$${ic(m[0],40)}</div><h3>$${m[1]}</h3>$${m[2]}<div>$${cta}</div></div>`;
          const b = $$('#emptyUp'); if (b) b.onclick = e => { e.stopPropagation(); bgMenu(e.clientX, e.clientY); };
          return renderSel();
        }
        const photoView = ['photos','videos'].includes(S.view) && S.mode==='grid';
        if (photoView) {
          const groups = []; let last = null;
          S.items.forEach(it => { const k = new Date(it.modified*1000).toLocaleDateString('id-ID',{month:'long',year:'numeric'}); if (k!==last) { groups.push([k,[]]); last=k; } groups[groups.length-1][1].push(it); });
          el.innerHTML = groups.map(g => `<div class="sec">$${esc(g[0])}</div><div class="grid photos">$${g[1].map(photoHTML).join('')}</div>`).join('');
        } else if (S.view==='recent' && S.mode==='grid') {
          const groups = []; let last = null;
          S.items.forEach(it => { const k = dayLabel(it.modified); if (k!==last) { groups.push([k,[]]); last=k; } groups[groups.length-1][1].push(it); });
          el.innerHTML = groups.map(g => `<div class="sec">$${g[0]}</div><div class="grid">$${g[1].map(cardHTML).join('')}</div>`).join('');
        } else if (S.mode==='grid') {
          const folders = S.items.filter(i=>i.is_folder), files = S.items.filter(i=>!i.is_folder);
          el.innerHTML = (folders.length?`<div class="sec">Folder</div><div class="grid fold">$${folders.map(cardHTML).join('')}</div>`:'') + (files.length?`<div class="sec">File</div><div class="grid">$${files.map(cardHTML).join('')}</div>`:'');
        } else {
          const arrow = by => S.sort.by===by ? (S.sort.dir>0?'↑':'↓') : '';
          el.innerHTML = `<div class="row head"><span class="s" data-sort="name">Nama $${arrow('name')}</span><span class="s" data-sort="modified">Diubah $${arrow('modified')}</span><span class="s" data-sort="size">Ukuran $${arrow('size')}</span><span></span></div>` + S.items.map(listRow).join('');
        }
        renderSel();
      }
      function renderStorage() {
        const st = S.stats, box = $$('#storage'); if (!box) return;
        const total = S.quota || Math.max(S.used,1);
        let segs = '';
        if (st) for (const k of Object.keys(CATCOL)) { const w = (st.categories[k].size/total*100); if (w>0) segs += `<b style="width:$${w}%;background:$${CATCOL[k]}"></b>`; }
        const pct = S.quota ? Math.min(100, Math.round(S.used/S.quota*100)) : null;
        const av = st && st.available != null ? `<small>Tersedia: <b style="color:var(--text)">$${fmtSize(st.available)}</b></small>` : '';
        box.innerHTML = `<div class="t">$${ic('drive',18)}Penyimpanan$${pct!==null?`<em>$${pct}%</em>`:''}</div><div class="sbar">$${segs}</div><small>Terpakai: <b style="color:var(--text)">$${fmtSize(S.used)}</b>$${S.quota?' dari '+fmtSize(S.quota):''}</small>$${av}`;
      }
      $$('#storage').onclick = showStats;
      function renderSel() {
        document.querySelectorAll('[data-id]').forEach(e => e.classList.toggle('sel', S.sel.has(e.dataset.id)));
        document.body.classList.toggle('selecting', S.sel.size>0);
        const sb = $$('#selbar'); sb.classList.toggle('hidden', !S.sel.size);
        if (!S.sel.size) return;
        const b = (a, i, t, cls='') => `<button data-a="$${a}" class="$${cls}" title="$${t}">$${ic(i,18)}<span>$${t}</span></button>`;
        const single = S.sel.size===1 ? byId([...S.sel][0]) : null;
        sb.innerHTML = `<button data-a="clear" title="Batal pilih">$${ic('x',18)}</button><span class="cnt">$${S.sel.size} dipilih</span>` +
          (S.view==='trash' ? b('restore','restore','Pulihkan') + b('purge','trash','Hapus permanen','dng')
            : b('download','download','Unduh') + (single?b('share','link','Bagikan'):'') + b('move','move','Pindahkan') + b('copy','copy','Salin') + b('star','star','Bintang') + b('trash','trash','Sampah','dng'));
      }
      $$('#selbar').onclick = e => { const b = e.target.closest('[data-a]'); if (!b) return; const ids=[...S.sel], a=b.dataset.a, it=byId(ids[0]);
        ({clear:()=>{S.sel.clear();renderSel();}, restore:()=>act.restore(ids), purge:()=>act.purge(ids), download:()=>act.download(ids), share:()=>shareDialog(it), move:()=>act.move(ids), copy:()=>act.move(ids,true), star:()=>act.star(ids), trash:()=>act.trash(ids)})[a](); };

      /* ---------- interaksi ---------- */
      const byId = id => S.items.find(i=>i.id===id);
      function open(it) { if (it.is_folder) go('#/files/'+it.id); else if (kind(it)) preview(it); else location.href = dl(it.id); }
      $$('#content').addEventListener('click', e => {
        const more = e.target.closest('[data-more]');
        if (more) { e.stopPropagation(); const r = more.getBoundingClientRect(); return menuFor(more.dataset.more, r.right, r.bottom+4, true); }
        const sortEl = e.target.closest('[data-sort]');
        if (sortEl) { const by = sortEl.dataset.sort; S.sort = {by, dir: S.sort.by===by ? -S.sort.dir : 1}; localStorage.setItem('sort', JSON.stringify(S.sort)); S.items = sortItems(S.items); return render(); }
        const t = e.target.closest('[data-id]');
        if (!t) { S.sel.clear(); return renderSel(); }
        const id = t.dataset.id, it = byId(id);
        if (e.target.closest('.chk')) { S.sel.has(id)?S.sel.delete(id):S.sel.add(id); S.lastClick=id; return renderSel(); }
        if (matchMedia('(hover:none)').matches && !S.sel.size) return open(it);
        if (matchMedia('(hover:none)').matches) { S.sel.has(id)?S.sel.delete(id):S.sel.add(id); return renderSel(); }
        if (e.ctrlKey || e.metaKey) { S.sel.has(id)?S.sel.delete(id):S.sel.add(id); }
        else if (e.shiftKey && S.lastClick) { const ids=S.items.map(i=>i.id), a=ids.indexOf(S.lastClick), b=ids.indexOf(id); S.sel.clear(); ids.slice(Math.min(a,b),Math.max(a,b)+1).forEach(x=>S.sel.add(x)); }
        else { S.sel.clear(); S.sel.add(id); }
        S.lastClick = id; renderSel();
      });
      $$('#content').addEventListener('dblclick', e => { const t=e.target.closest('[data-id]'); if (t && !e.target.closest('.chk')) open(byId(t.dataset.id)); });
      $$('#content').addEventListener('contextmenu', e => {
        e.preventDefault(); const t = e.target.closest('[data-id]');
        if (t) { if (!S.sel.has(t.dataset.id)) { S.sel.clear(); S.sel.add(t.dataset.id); renderSel(); } menuFor(t.dataset.id, e.clientX, e.clientY); }
        else if (S.view!=='trash') bgMenu(e.clientX, e.clientY);
      });
      $$('#seg').onclick = e => { const b=e.target.closest('[data-m]'); if (!b) return; S.mode=b.dataset.m; localStorage.setItem('mode',S.mode); render(); };
      $$('#sortBtn').onclick = e => { e.stopPropagation(); const r=e.currentTarget.getBoundingClientRect(); const o=(by,t)=>({i:S.sort.by===by?(S.sort.dir>0?'arrowUp':'arrowUp'):'sort',t:t+(S.sort.by===by?(S.sort.dir>0?'  ↑':'  ↓'):''),f:()=>{S.sort={by,dir:S.sort.by===by?-S.sort.dir:1};localStorage.setItem('sort',JSON.stringify(S.sort));S.items=sortItems(S.items);render();}});
        showMenu([{h:'Urutkan menurut'},o('name','Nama'),o('modified','Terakhir diubah'),o('size','Ukuran')], r.right, r.bottom+4, true); };

      let menuEl = null;
      function closeMenu() { if (menuEl) { menuEl.remove(); menuEl=null; } }
      document.addEventListener('click', closeMenu); window.addEventListener('blur', closeMenu);
      function showMenu(entries, x, y, alignRight) {
        closeMenu(); const m = document.createElement('div'); m.className='menu';
        entries.forEach(en => {
          if (en==='-') return m.append(document.createElement('hr'));
          if (en.h) { const d=document.createElement('div'); d.className='mh'; d.textContent=en.h; return m.append(d); }
          const b=document.createElement('button'); if (en.danger) b.className='dng'; b.innerHTML = ic(en.i,18)+'<span>'+esc(en.t)+'</span>'; b.onclick=ev=>{ev.stopPropagation(); closeMenu(); en.f();}; m.append(b);
        });
        document.body.append(m); const r = m.getBoundingClientRect();
        let left = alignRight ? x-r.width : x; m.style.left = Math.max(8, Math.min(left, innerWidth-r.width-8))+'px'; m.style.top = Math.max(8, Math.min(y, innerHeight-r.height-8))+'px'; menuEl = m;
      }
      function menuFor(id, x, y, alignRight) {
        if (!S.sel.has(id)) { S.sel.clear(); S.sel.add(id); renderSel(); }
        const ids=[...S.sel], it=byId(id), multi=ids.length>1;
        if (S.view==='trash') return showMenu([{i:'restore',t:'Pulihkan',f:()=>act.restore(ids)},{i:'trash',t:'Hapus permanen',danger:1,f:()=>act.purge(ids)}], x, y, alignRight);
        const m = [];
        if (!multi) {
          m.push({i:it.is_folder?'folder':'info',t:it.is_folder?'Buka':(kind(it)?'Pratinjau':'Unduh'),f:()=>open(it)});
          m.push({i:'download',t:it.is_folder?'Unduh sebagai ZIP':'Unduh',f:()=>act.download(ids)});
          m.push({i:'link',t:it.shared?'Kelola tautan berbagi':'Bagikan',f:()=>shareDialog(it)}, '-');
          m.push({i:'edit',t:'Ubah nama',f:()=>act.rename(it)});
        } else m.push({i:'download',t:'Unduh sebagai ZIP',f:()=>act.download(ids)}, '-');
        m.push({i:'move',t:'Pindahkan ke…',f:()=>act.move(ids)}, {i:'copy',t:'Buat salinan',f:()=>act.dup(ids)}, {i:'star',t:ids.every(i=>byId(i)?.starred)?'Hapus bintang':'Beri bintang',f:()=>act.star(ids)});
        if (!multi) m.push({i:'info',t:'Detail',f:()=>detailDialog(it)});
        if (ids.some(i=>byId(i)?.is_folder)) m.push({i:'palette',t:'Warna folder',f:()=>colorDialog(ids.filter(i=>byId(i)?.is_folder))});
        if (!multi && S.view!=='files') m.push({i:'folder',t:'Buka lokasi',f:()=>go(it.parent_id?'#/files/'+it.parent_id:'#/files')});
        m.push('-', {i:'trash',t:'Pindahkan ke sampah',danger:1,f:()=>act.trash(ids)});
        showMenu(m, x, y, alignRight);
      }
      function bgMenu(x, y, alignRight) {
        const m = [];
        if (S.view==='files') m.push({i:'folderPlus',t:'Folder baru',f:()=>act.newFolder()}, {i:'filePlus',t:'Catatan teks baru',f:()=>act.newText()}, '-');
        m.push({i:'image',t:'Unggah foto',f:()=>$$('#photoIn').click()}, {i:'video',t:'Unggah video',f:()=>$$('#videoIn').click()}, {i:'fileText',t:'Unggah dokumen',f:()=>$$('#docIn').click()},
               {i:'camera',t:'Ambil foto/video (kamera)',f:()=>$$('#camIn').click()}, '-', {i:'upload',t:'Unggah file lain',f:()=>$$('#fileIn').click()}, {i:'folder',t:'Unggah folder',f:()=>$$('#dirIn').click()});
        showMenu(m, x, y, alignRight);
      }
      $$('#newBtn').onclick = e => { e.stopPropagation(); const r=e.currentTarget.getBoundingClientRect(); bgMenu(r.left, r.bottom+6); };
      $$('#fab').onclick = e => { e.stopPropagation(); const r=e.currentTarget.getBoundingClientRect(); bgMenu(r.right, r.top-6, true); };
      $$('#nav').onclick = e => { const a=e.target.closest('a'); if (a) go('#/'+a.dataset.v); };
      $$('#menuBtn').onclick = () => document.body.classList.add('nav-open'); $$('#scrim').onclick = () => document.body.classList.remove('nav-open');
      let st; $$('#q').oninput = e => { clearTimeout(st); st = setTimeout(()=>{ const v=e.target.value.trim(); go(v ? '#/search/'+encodeURIComponent(v) : '#/files'); }, 300); };
      $$('#emptyTrash').onclick = async () => { if (await confirmBox('Kosongkan sampah?','Semua item di sampah akan dihapus permanen.','Kosongkan')) { await api('empty-trash',{}); load(); } };
      $$('#userBtn').onclick = e => { e.stopPropagation(); const r=e.currentTarget.getBoundingClientRect();
        const m=[{h:'Masuk sebagai '+S.me.username+(S.me.is_admin?' (admin)':'')},{i:'drive',t:'Penyimpanan',f:showStats},{i:'pulse',t:'Aktivitas',f:activityDialog},{i:'layers',t:'Pembersih duplikat',f:dupDialog},'-',{i:'palette',t:'Warna aksen',f:accentDialog},{i:'keyboard',t:'Pintasan keyboard',f:helpDialog},{i:'key',t:'Ganti password',f:changePw}];
        if (S.me.is_admin) m.push({i:'users',t:'Kelola pengguna',f:manageUsers});
        m.push('-',{i:'logout',t:'Keluar',f:()=>doLogout(false)},{i:'logout',t:'Keluar dari semua perangkat',danger:1,f:()=>doLogout(true)}); showMenu(m, r.right, r.bottom+6, true); };
      async function doLogout(all) {
        if (all && !await confirmBox('Keluar dari semua perangkat?','Semua sesi login akun ini (HP, laptop, dll.) akan diakhiri.','Keluar semua')) return;
        try { await api('logout'+(all?'?all=1':''),{}); } catch(e) { return toast(e.message); }
        S.me = null; S.sel.clear(); document.body.classList.remove('nav-open'); location.hash = ''; boot();
      }
      $$('#logoutBtn').onclick = () => doLogout(false);

      /* ---------- aksi ---------- */
      const act = {
        async newFolder() { const n = await ask('Folder baru','Folder tanpa judul','Buat'); if (n===null) return; try { await api('folder',{parent:S.parent,name:n}); load(); } catch(e){toast(e.message);} },
        async newText() { const n = await ask('Catatan teks baru','Catatan.txt','Buat'); if (n===null) return; try { const j = await api('savetext',{parent:S.parent,name:n,content:''}); await load(); const it=byId(j.id); if (it) preview(it,{edit:true}); } catch(e){toast(e.message);} },
        async rename(it) { const n = await ask('Ubah nama', it.name, 'Simpan'); if (n===null||n===it.name) return; try { await api('rename',{id:it.id,name:n}); load(); } catch(e){toast(e.message);} },
        async star(ids) { const val = !ids.every(i=>byId(i)?.starred); await api('star',{ids,value:val}); load(true); },
        async trash(ids) { try { await api('trash',{ids}); toast(ids.length+' item dipindahkan ke sampah',{label:'Urungkan',fn:()=>act.restore(ids,true)}); load(); } catch(e){toast(e.message);} },
        async restore(ids, quiet) { try { await api('trash',{ids,restore:true}); if (!quiet) toast('Item dipulihkan'); load(); } catch(e){toast(e.message);} },
        async purge(ids) { if (!await confirmBox('Hapus permanen?','Item yang dihapus tidak bisa dikembalikan.')) return; try { await api('delete',{ids}); load(); } catch(e){toast(e.message);} },
        async dup(ids) { try { await api('copy',{ids}); toast('Salinan dibuat'); load(); } catch(e){toast(e.message);} },
        download(ids) { const it = ids.length===1 ? byId(ids[0]) : null; location.href = it && !it.is_folder ? dl(it.id) : (it ? '/api/zip/'+it.id : '/api/zip?ids='+ids.join(',')); },
        async move(ids, copy) {
          let cur = null;
          const m = modal(`<h2>$${copy?'Salin':'Pindahkan'} $${ids.length} item ke…</h2><div id="pkPath" style="color:var(--muted);font-size:13px"></div><div class="picker" id="pk"></div><div class="actions"><button class="btn" id="pkC">Batal</button><button class="btn pri" id="pkOk">$${copy?'Salin':'Pindahkan'} ke sini</button></div>`);
          const draw = async () => {
            const j = await api('list?view=files&folders=1'+(cur?'&parent='+cur:''));
            m.querySelector('#pkPath').textContent = ['Drive Saya', ...j.crumbs.map(c=>c.name)].join('  ›  ');
            const pk = m.querySelector('#pk'); pk.innerHTML = '';
            if (cur) { const b=document.createElement('button'); b.innerHTML=ic('arrowUp',18)+'Naik satu level'; b.onclick=()=>{ cur = j.crumbs.length>1 ? j.crumbs[j.crumbs.length-2].id : null; draw(); }; pk.append(b); }
            j.items.filter(f=>copy||!ids.includes(f.id)).forEach(f => { const b=document.createElement('button'); b.innerHTML=`<span style="color:#f5a524">$${ic('folder',20,'soft')}</span>$${esc(f.name)}`; b.onclick=()=>{cur=f.id; draw();}; pk.append(b); });
            if (!pk.children.length) pk.innerHTML = '<div style="padding:16px;color:var(--muted)">Tidak ada subfolder</div>';
          };
          m.querySelector('#pkC').onclick = () => m.remove();
          m.querySelector('#pkOk').onclick = async () => { try { await api(copy?'copy':'move',{ids,parent:cur}); m.remove(); toast(copy?'Disalin':'Dipindahkan'); load(); } catch(e){toast(e.message);} };
          draw();
        }
      };

      /* ---------- dialog: bagikan ---------- */
      async function shareDialog(it) {
        let info; try { info = await api('share?id='+it.id); } catch(e) { return toast(e.message); }
        const m = modal(`<h2>Bagikan “$${esc(it.name)}”</h2><div id="shB"></div><div class="actions"><button class="btn" id="shX">Selesai</button></div>`, 'wide');
        m.querySelector('#shX').onclick = () => { m.remove(); load(true); };
        const draw = info => {
          const b = m.querySelector('#shB'), has = !!info.token;
          const form = `<label class="lbl">Masa berlaku tautan</label><select id="shExp">$${has?'<option value="">Tidak diubah</option>':''}<option value="0">Tanpa batas waktu</option><option value="1">1 hari</option><option value="7">7 hari</option><option value="30">30 hari</option></select>
            <label class="lbl">$${has&&info.has_password?'Ganti password (kosongkan = tetap)':'Password (opsional)'}</label><input type="password" id="shPw" placeholder="Tanpa password" autocomplete="new-password">`;
          if (!has) { b.innerHTML = `<p style="color:var(--muted);margin:0">Siapa pun yang memiliki tautan dapat melihat dan mengunduh $${it.is_folder?'isi folder':'file'} ini tanpa login.</p>$${form}<div class="actions"><button class="btn pri" id="shOn">$${ic('link',18)}Buat tautan</button></div>`; }
          else {
            const url = location.origin + '/s/' + info.token;
            const status = info.expired ? '<span style="color:var(--danger)">Sudah kedaluwarsa</span>' : (info.expires ? 'Berakhir '+fmtDT(info.expires) : 'Tanpa batas waktu');
            b.innerHTML = `<div style="display:flex;gap:8px"><input type="text" readonly value="$${esc(url)}" id="shUrl"><button class="btn pri" id="shCopy">$${ic('copy',18)}Salin</button></div>
              <div style="margin-top:10px;color:var(--muted);font-size:13px;display:flex;gap:14px;flex-wrap:wrap"><span>$${ic('clock',14)} $${status}</span><span>$${ic('lock',14)} $${info.has_password?'Dilindungi password':'Tanpa password'}</span><span>$${ic('pulse',14)} $${info.views||0}× dibuka</span></div>$${form}
              <div class="actions" style="justify-content:space-between"><button class="btn dng" id="shOff">Hentikan berbagi</button><span style="display:flex;gap:8px">$${info.has_password?'<button class="btn" id="shNoPw">Hapus password</button>':''}<button class="btn pri" id="shSave">Simpan</button></span></div>`;
            const inp = b.querySelector('#shUrl'); inp.onfocus = () => inp.select();
            b.querySelector('#shCopy').onclick = async () => { try { await navigator.clipboard.writeText(url); } catch(e){ inp.select(); document.execCommand('copy'); } toast('Tautan disalin'); };
            b.querySelector('#shOff').onclick = async () => draw(await api('share?id='+it.id,{revoke:true}));
            const np = b.querySelector('#shNoPw'); if (np) np.onclick = async () => { draw(await api('share?id='+it.id,{password:''})); toast('Password dihapus'); };
          }
          const collect = () => { const body={}; const ex=b.querySelector('#shExp').value; if (ex!=='') body.expires_days=+ex; const pw=b.querySelector('#shPw').value; if (pw) body.password=pw; return body; };
          const on = b.querySelector('#shOn'); if (on) on.onclick = async () => { try { draw(await api('share?id='+it.id, collect())); } catch(e){toast(e.message);} };
          const sv = b.querySelector('#shSave'); if (sv) sv.onclick = async () => { try { draw(await api('share?id='+it.id, collect())); toast('Pengaturan disimpan'); } catch(e){toast(e.message);} };
        };
        draw(info);
      }

