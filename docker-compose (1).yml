      .item{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;user-select:none;transition:box-shadow .18s,border-color .18s,transform .18s,background .18s}
      .item:hover{box-shadow:var(--sh);border-color:transparent;transform:translateY(-2px)}
      .item.sel{border-color:var(--acct);box-shadow:0 0 0 2px var(--acct) inset;background:var(--soft)}
      .item .chk{position:absolute;top:10px;left:10px;width:25px;height:25px;border-radius:9px;background:var(--surface);border:1.5px solid var(--line);display:grid;place-items:center;color:transparent;opacity:0;z-index:3;transition:.12s;box-shadow:var(--sh2)}
      .item:hover .chk,.item.sel .chk,body.selecting .item .chk{opacity:1}
      .item.sel .chk{background:var(--acc);border-color:var(--acc);color:#fff}
      .item.file .thumb{aspect-ratio:4/3;background:var(--s2);position:relative;overflow:hidden;display:grid;place-items:center}
      .thumb img,.thumb video{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s}
      .item:hover .thumb img,.item:hover .thumb video{transform:scale(1.04)}
      .vbadge{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.62);backdrop-filter:blur(6px);color:#fff;border-radius:9px;padding:3px 8px;display:flex;align-items:center;gap:4px;font-size:11px}
      .ficon{width:100%;height:100%;display:grid;place-items:center;color:var(--c);background:linear-gradient(145deg,color-mix(in srgb,var(--c) 15%,transparent),color-mix(in srgb,var(--c) 6%,transparent))}
      .cap{display:flex;align-items:center;gap:9px;padding:11px 6px 11px 13px}
      .cap .ti{color:var(--c)}
      .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
      .more{border:0;background:none;width:30px;height:30px;border-radius:10px;color:var(--muted);display:grid;place-items:center;opacity:0;flex:none}
      .more:hover{background:var(--s2);color:var(--text)}
      .item:hover .more,.item.sel .more,.row:hover .more,.row.sel .more{opacity:1}
      @media(hover:none){.more{opacity:1}}
      .bd{color:var(--muted);display:grid}.bd.star{color:#f5a524}
      .item.folder{display:flex;align-items:center;gap:12px;padding:12px 6px 12px 12px;background:color-mix(in srgb,var(--c,#f5a524) 7%,var(--surface))}
      .item.folder .fi{color:var(--c);display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:color-mix(in srgb,var(--c) 16%,transparent);flex:none}
      .item.folder .chk{top:50%;transform:translateY(-50%);left:auto;right:44px}
      .item.ph{border-radius:12px;aspect-ratio:1;border:0;background:var(--s2)}
      .item.ph .thumb{position:absolute;inset:0}
      .item.ph .phcap{position:absolute;left:0;right:0;bottom:0;padding:22px 9px 7px;background:linear-gradient(transparent,rgba(0,0,0,.65));color:#fff;font-size:12px;opacity:0;transition:.15s}
      .item.ph:hover .phcap{opacity:1}
      .item.ph .more{position:absolute;right:4px;top:4px;color:#fff;background:rgba(0,0,0,.35);z-index:3}
      .item.ph .bd{position:absolute;left:9px;bottom:8px;z-index:3;color:#fff}
      .item.ph.sel{box-shadow:0 0 0 3px var(--acct) inset}
      .item.ph.sel .thumb{transform:scale(.9);border-radius:10px;transition:.12s}
      .sk{height:196px;border-radius:var(--r);background:linear-gradient(90deg,var(--s2) 20%,color-mix(in srgb,var(--s2) 55%,var(--surface)) 50%,var(--s2) 80%);background-size:220% 100%;animation:shim 1.3s linear infinite}
      @keyframes shim{to{background-position:-220% 0}}

      /* list */
      .row{display:grid;grid-template-columns:minmax(0,1fr) 170px 110px 44px;align-items:center;gap:10px;padding:8px 12px;border-radius:14px;cursor:pointer;user-select:none;position:relative;transition:background .1s}
      .row:hover{background:var(--s2)}.row.sel{background:var(--soft)}
      .row.head{color:var(--muted);font-size:12px;font-weight:700;cursor:default;position:sticky;top:-4px;background:var(--surface);z-index:2;border-radius:0;border-bottom:1px solid var(--line)}
      .row.head:hover{background:var(--surface)}
      .row.head span.s{cursor:pointer;display:inline-flex;gap:4px;align-items:center}
      .row .n{display:flex;align-items:center;gap:12px;min-width:0}
      .row .n .ti{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);flex:none}
      .row .m{color:var(--muted);font-size:13px}
      .row .chk{position:absolute;left:-2px;opacity:0}
      .empty{text-align:center;color:var(--muted);padding:80px 20px}
      .empty .eic{width:96px;height:96px;border-radius:30px;background:var(--soft);color:var(--acct);display:grid;place-items:center;margin:0 auto 20px}
      .empty h3{margin:0 0 6px;color:var(--text);font-size:19px;letter-spacing:-.3px}
      .empty .btn{margin-top:18px}

      /* selection bar */
      #selbar{position:fixed;left:calc(var(--sw) + 12px + (100vw - var(--sw) - 24px)/2);bottom:26px;transform:translateX(-50%);display:flex;align-items:center;gap:2px;background:color-mix(in srgb,var(--text) 94%,transparent);backdrop-filter:blur(14px);color:var(--bg);border-radius:20px;padding:8px 10px;box-shadow:var(--sh);z-index:35;animation:pop .18s ease}
      #selbar .cnt{padding:0 14px 0 8px;font-weight:700;white-space:nowrap}
      #selbar button{border:0;background:none;color:inherit;display:flex;align-items:center;gap:7px;padding:8px 11px;border-radius:12px;font-weight:600;white-space:nowrap}
      #selbar button:hover{background:rgba(127,127,127,.28)}
      #selbar button.dng{color:#ff8a8f}
      @keyframes pop{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}

      /* menu / modal / toast */
      .menu{position:fixed;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);padding:6px;min-width:222px;z-index:200;animation:fade .12s ease}
      .menu button{display:flex;gap:12px;align-items:center;width:100%;border:0;background:none;padding:9px 11px;border-radius:10px;text-align:left;font-weight:550}
      .menu button svg{color:var(--muted)}
      .menu button:hover{background:var(--s2)}
      .menu button.dng,.menu button.dng svg{color:var(--danger)}
      .menu hr{border:0;border-top:1px solid var(--line);margin:5px 4px}
      .menu .mh{padding:8px 11px;font-size:12px;color:var(--muted)}
      @keyframes fade{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
      .mbg{position:fixed;inset:0;background:rgba(8,10,18,.5);backdrop-filter:blur(5px);display:grid;place-items:center;z-index:90;padding:16px;animation:fadeb .15s}
      @keyframes fadeb{from{opacity:0}to{opacity:1}}
      .modal{background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:26px;width:100%;max-width:440px;box-shadow:var(--sh);max-height:92vh;overflow:auto;animation:fade .16s ease}
      .modal.wide{max-width:540px}.modal.big{max-width:680px}
      .modal h2{margin:0 0 14px;font-size:20px;letter-spacing:-.4px;word-break:break-word}
      .modal .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:22px;flex-wrap:wrap}
      .h3{margin:22px 0 10px;font-size:15px}
      .picker{border:1px solid var(--line);border-radius:14px;max-height:250px;overflow:auto;margin-top:10px}
      .picker button{display:flex;align-items:center;gap:11px;width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 13px;text-align:left}
      .picker button:last-child{border:0}.picker button:hover{background:var(--s2)}
      .kv{display:grid;grid-template-columns:110px 1fr;gap:10px 12px;font-size:13.5px;margin-top:16px}
      .kv dt{color:var(--muted)}.kv dd{margin:0;word-break:break-word}
      .legend{display:grid;gap:11px;margin-top:16px}
      .legend div{display:flex;align-items:center;gap:10px}.legend i{width:11px;height:11px;border-radius:4px;flex:none}.legend span:last-child{margin-left:auto;color:var(--muted)}
      .urow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
      .urow:last-child{border:0}
      .urow .av{width:38px;height:38px;border-radius:12px;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:750;flex:none}
      .urow .ui{flex:1;min-width:0;display:flex;flex-direction:column}.urow .ui small{color:var(--muted)}
      .swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-top:6px}
      .swatches button{aspect-ratio:1;border-radius:16px;border:3px solid transparent;background:var(--c);transition:.12s;box-shadow:var(--sh2)}
      .swatches button:hover{transform:scale(1.08)}
      .swatches button.on{border-color:var(--text)}
      .acl{display:flex;flex-direction:column;max-height:60vh;overflow:auto;margin:0 -6px}
      .acl .a{display:flex;align-items:center;gap:12px;padding:9px 6px;border-radius:12px}
      .acl .a:hover{background:var(--s2)}
      .acl .ai{width:34px;height:34px;border-radius:11px;background:var(--soft);color:var(--acct);display:grid;place-items:center;flex:none}
      .acl .at{flex:1;min-width:0}.acl .at b{font-weight:650}.acl .at span{display:block;color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
      .acl .ts{color:var(--muted);font-size:12px;white-space:nowrap}
      .dgrp{border:1px solid var(--line);border-radius:16px;padding:6px 14px;margin-top:10px}
      .dgrp .r{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.dgrp .r:last-child{border:0}
      .dgrp .r span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
      .dgrp small{color:var(--muted)}
      .keys{display:grid;grid-template-columns:auto 1fr;gap:10px 16px;align-items:center;margin-top:6px}
      #toasts{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;z-index:220;pointer-events:none}
      .toast{background:var(--text);color:var(--bg);padding:12px 18px;border-radius:15px;box-shadow:var(--sh);display:flex;gap:14px;align-items:center;pointer-events:auto;animation:pop2 .2s ease;font-weight:550}
      .toast button{border:0;background:none;color:var(--acc2);font-weight:750;padding:0}
      @keyframes pop2{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

      /* preview */
      #preview{position:fixed;inset:0;background:rgba(5,7,11,.95);backdrop-filter:blur(10px);z-index:100;display:flex;flex-direction:column;color:#fff;animation:fadeb .15s}
      .pvtop{display:flex;align-items:center;gap:6px;padding:10px 14px;background:linear-gradient(rgba(0,0,0,.45),transparent)}
      .pvt{flex:1;min-width:0;display:flex;flex-direction:column}.pvt b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}.pvt small{opacity:.6}
      .pvb{width:42px;height:42px;border:0;border-radius:13px;background:none;color:#fff;display:inline-grid;place-items:center;text-decoration:none}
      .pvb:hover{background:rgba(255,255,255,.14)}
      .pvstage{flex:1;min-height:0;position:relative;display:grid;place-items:center;padding:6px 64px 20px}
      #pvBody{width:100%;height:100%;display:grid;place-items:center;min-height:0;overflow:auto}
      #pvBody img{max-width:100%;max-height:100%;border-radius:10px;cursor:zoom-in;box-shadow:0 24px 70px rgba(0,0,0,.55)}
      #pvBody.zoom{place-items:start center}#pvBody.zoom img{max-width:none;max-height:none;cursor:zoom-out}
      #pvBody video{max-width:100%;max-height:100%;border-radius:10px;background:#000}
      #pvBody iframe{width:min(1000px,100%);height:100%;border:0;background:#fff;border-radius:10px}
      .txt{width:min(960px,100%);height:100%;display:flex;flex-direction:column;gap:10px}
      .txt .bar{display:flex;gap:8px;justify-content:flex-end}
      .txt pre,.txt textarea{flex:1;min-height:0;margin:0;background:#fff;color:#14171f;border-radius:14px;padding:18px;overflow:auto;white-space:pre-wrap;word-break:break-word;font:13.5px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;border:0;resize:none;width:100%}
      .pvnav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.12);backdrop-filter:blur(8px);border:0;color:#fff;display:grid;place-items:center;z-index:2}
      .pvnav:hover{background:rgba(255,255,255,.26)}.pvnav.l{left:10px}.pvnav.l svg{transform:scaleX(-1)}.pvnav.r{right:10px}
      .nopv{text-align:center;opacity:.92}.nopv .eic{width:100px;height:100px;border-radius:32px;background:rgba(255,255,255,.1);display:grid;place-items:center;margin:0 auto 16px}

      /* uploads */
      #uploads{position:fixed;right:22px;bottom:22px;width:370px;max-width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--sh);z-index:60;overflow:hidden;animation:pop2 .2s}
      #uploads .h{display:flex;align-items:center;gap:8px;padding:13px 14px 13px 18px;font-weight:700}
      #uploads .h span{flex:1}
      #uploads .pbar{height:3px;background:var(--line)}#uploads .pbar b{display:block;height:100%;background:var(--grad);width:0;transition:width .2s}
      #upList{max-height:260px;overflow:auto}
      .up{display:flex;align-items:center;gap:10px;padding:10px 16px;border-top:1px solid var(--line);font-size:13px}
      .up .ti{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);flex:none}
      .up .i{flex:1;min-width:0}.up .nm{font-weight:550;display:block}.up .pb{height:4px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden}.up .pb b{display:block;height:100%;background:var(--grad);width:0}
      .up.err .pb b{background:var(--danger)}.up.done .pb b{background:#16a34a}
      .up small{color:var(--muted)}
      #fab{display:none}
      #scrim{display:none}
      #tabbar{display:none}
      .logoutbtn{width:100%;justify-content:flex-start;padding:11px 14px;color:var(--danger);margin-top:2px}
      .sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
      .sgrid>div{background:var(--s2);border-radius:14px;padding:11px 13px;min-width:0}
      .sgrid small{display:block;color:var(--muted);font-size:12px}
      .sgrid b{font-size:16px;letter-spacing:-.2px}
      @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

      @media(max-width:900px){
        #app{grid-template-columns:1fr;padding:0;gap:0}
        aside{position:fixed;left:0;top:0;bottom:0;width:288px;transform:translateX(-102%);transition:transform .22s;background:var(--bg);padding:16px 12px}
        body.nav-open aside{transform:none;box-shadow:var(--sh)}
        .hsp{display:none}.search{max-width:none}
        .item.folder{gap:10px;padding:10px 4px 10px 10px}.item.folder .fi{width:36px;height:36px;border-radius:11px}
        body.nav-open #scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:39}
        .mainc{border-radius:0;border:0}
        #menuBtn{display:inline-grid}
        header{padding:10px 12px 6px}
        .search kbd{display:none}
        .pagehead{padding:4px 14px 6px}.crumbs button{font-size:18px}
        #chips{padding:2px 14px 8px}
        #content{padding:4px 14px 130px}
        .grid{grid-template-columns:repeat(2,1fr);gap:10px}.grid.fold{grid-template-columns:1fr 1fr}.grid.photos{grid-template-columns:repeat(3,1fr);gap:3px}
        .row{grid-template-columns:minmax(0,1fr) 44px}.row .m{display:none}
        #selbar{left:50%;bottom:calc(74px + env(safe-area-inset-bottom));max-width:calc(100vw - 20px);overflow:auto}#selbar button span{display:none}#selbar .cnt{padding:0 8px}
        #fab{display:grid;position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:18px;border:0;background:var(--grad);color:#fff;place-items:center;box-shadow:var(--glow);z-index:34}
        body.selecting #fab{display:none}
        #uploads{right:10px;bottom:calc(150px + env(safe-area-inset-bottom));width:calc(100vw - 20px)}
        .pvstage{padding:6px 8px 14px}.pvnav{display:none}
        .item .more{opacity:1}
        .swatches{grid-template-columns:repeat(4,1fr)}
        #content{padding:4px 14px calc(150px + env(safe-area-inset-bottom))}
        header{padding:calc(10px + env(safe-area-inset-top)) 12px 6px}
        input[type=text],input[type=password],input[type=number],select,textarea{font-size:16px}
        .ibtn{width:42px;height:42px}
        .search input{padding:12px 14px 12px 42px}
        .pagehead{gap:6px}.crumbs button{max-width:46vw}
        #sortBtn,#seg{flex:none}
        .count{display:block;margin:0 0 0 10px;width:100%;font-size:12px}
        .cap{padding:9px 4px 9px 10px}.thumb{aspect-ratio:1/1}
        .row{padding:10px 8px}.row .n .ti{width:40px;height:40px}
        /* bar tab bawah */
        #tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:36;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
        #tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:12px;color:var(--muted);font-size:11px;font-weight:650;cursor:pointer;user-select:none}
        #tabbar a.active{color:var(--acct)}
        #tabbar a.active svg{background:var(--soft);border-radius:10px;padding:3px;width:30px;height:30px;box-sizing:border-box}
        body.nav-open #tabbar{display:none}
        .storage{margin-bottom:calc(8px + env(safe-area-inset-bottom))}
        /* menu & dialog jadi bottom sheet */
        .menu{left:0!important;right:0;top:auto!important;bottom:0;min-width:0;border-radius:22px 22px 0 0;padding:8px 8px calc(12px + env(safe-area-inset-bottom));max-height:75vh;overflow:auto;animation:sheet .2s ease}
        .menu button{padding:14px 14px;font-size:15px}
        .mbg{align-items:end;padding:0}
        .modal,.modal.wide,.modal.big{max-width:none;border-radius:24px 24px 0 0;padding:22px 18px calc(20px + env(safe-area-inset-bottom));max-height:90vh;animation:sheet .22s ease}
        .modal .actions .btn{flex:1}
        .kv{grid-template-columns:90px 1fr}
        .sgrid{grid-template-columns:1fr 1fr}
        #toasts{bottom:calc(86px + env(safe-area-inset-bottom));max-width:calc(100vw - 24px)}
        .pvtop{padding:calc(8px + env(safe-area-inset-top)) 8px 8px}.pvb{width:38px;height:38px}
        .row.head{display:none}
      }
      @keyframes sheet{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
      </style>
      </head>
      <body>

      <div id="auth" class="hidden">
        <form class="acard" id="authForm">
          <div class="logo"><i id="authLogo"></i>HomeDrive</div>
          <h1 id="authTitle">Masuk</h1>
          <p id="authSub">Penyimpanan file pribadi di server rumah Anda.</p>
          <label class="lbl" for="au">Username</label><input type="text" id="au" autocomplete="username" required>
          <label class="lbl" for="ap">Password</label><input type="password" id="ap" autocomplete="current-password" required>
          <div class="err" id="authErr"></div>
          <button class="btn pri" id="authBtn">Masuk</button>
        </form>
      </div>

      <div id="app" class="hidden">
        <aside id="side">
          <div class="logo" style="padding:2px 6px 4px"><i id="sideLogo"></i>HomeDrive</div>
          <button id="newBtn"></button>
          <nav id="nav"></nav>
          <div class="storage" id="storage"></div>
          <button class="btn logoutbtn" id="logoutBtn"></button>
        </aside>
        <div class="mainc" id="main">
          <header>
            <button class="ibtn" id="menuBtn" aria-label="Menu"></button>
            <div class="search"><span id="searchIc"></span><input type="text" id="q" placeholder="Cari file dan folder" autocomplete="off"><kbd>/</kbd></div>
            <div class="hsp"></div>
            <button class="ibtn" id="themeBtn" title="Ganti tema"></button>
            <button class="avatar" id="userBtn" title="Akun"></button>
          </header>
          <div class="pagehead"><div class="crumbs" id="crumbs"></div><button class="btn sm dng hidden" id="emptyTrash"></button><button class="ibtn" id="sortBtn" title="Urutkan"></button><div class="seg" id="seg"></div></div>
          <div id="chips" class="hidden"></div>
          <div id="content"></div>
          <div id="drop" class="hidden">Lepaskan di sini untuk mengunggah</div>
        </div>
      </div>
      <div id="scrim"></div>
      <nav id="tabbar"></nav>
      <button id="fab" aria-label="Baru"></button>
      <div id="selbar" class="hidden"></div>
      <div id="uploads" class="hidden"></div>
      <div id="toasts"></div>
      <input type="file" id="fileIn" multiple class="hidden">
      <input type="file" id="dirIn" webkitdirectory class="hidden">
      <input type="file" id="photoIn" multiple accept="image/*,.heic,.heif" class="hidden">
      <input type="file" id="videoIn" multiple accept="video/*,.mkv,.mov" class="hidden">
      <input type="file" id="docIn" multiple accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.odt,.ods,.odp,.txt,.md,.rtf,.csv,.epub,text/*" class="hidden">
