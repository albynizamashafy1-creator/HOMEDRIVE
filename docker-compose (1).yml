# HomeDrive - satu file saja (app.py + index.html sudah tertanam di sini)
#
# Jalankan:   docker compose up -d
# Buka:       http://IP-SERVER:8080   (lalu buat akun admin pertama)
# Perbarui:   unduh ulang file ini, lalu  docker compose up -d --force-recreate
#
# Butuh Docker Compose v2.23+ (fitur configs.content). Cek: docker compose version
services:
  homedrive:
    image: python:3.12-alpine
    container_name: homedrive
    restart: unless-stopped
    working_dir: /app
    command: ["python", "/app/app.py"]
    ports:
      - "8080:8080"
    volumes:
      # Ganti sisi kiri dengan folder/disk tempat Anda ingin menyimpan file
      - ./data:/data
    environment:
      DATA_DIR: /data
      HOST: 0.0.0.0
      PORT: "8080"
      PYTHONUNBUFFERED: "1"
      QUOTA_GB: "0"        # batas default per pengguna dalam GB, 0 = tanpa batas
      TRASH_DAYS: "30"     # sampah dikosongkan otomatis setelah N hari, 0 = jangan hapus otomatis
      COOKIE_SECURE: "0"   # ubah ke "1" jika diakses lewat HTTPS
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    configs:
      - source: app_py
        target: /app/app.py
      - source: index_html
        target: /app/index.html

configs:
  app_py:
    content: |
      #!/usr/bin/env python3
      """HomeDrive - penyimpanan file pribadi ala Google Drive.

      Hanya memakai pustaka standar Python (3.9+). Tidak perlu pip install.
      Konfigurasi lewat environment variable:
        HOST=0.0.0.0  PORT=8080  DATA_DIR=./data  QUOTA_GB=0 (0 = tanpa batas)
        COOKIE_SECURE=0 (set 1 bila diakses lewat HTTPS)  TRASH_DAYS=30 (0 = jangan hapus otomatis)
      """
      import hashlib
      import hmac
      import json
      import mimetypes
      import os
      import re
      import secrets
      import shutil
      import sqlite3
      import sys
      import tempfile
      import threading
      import time
      import uuid
      import zipfile
      from html import escape as h
      from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
      from pathlib import Path
      from urllib.parse import parse_qs, quote, urlparse

      BASE = Path(__file__).resolve().parent
      HOST = os.environ.get("HOST", "0.0.0.0")
      PORT = int(os.environ.get("PORT", "8080"))
      DATA = Path(os.environ.get("DATA_DIR", BASE / "data")).resolve()
      QUOTA = int(float(os.environ.get("QUOTA_GB", "0")) * 1024**3)
      TRASH_DAYS = int(os.environ.get("TRASH_DAYS", "30"))
      COOKIE_SECURE = os.environ.get("COOKIE_SECURE", "0") == "1"
      BLOBS = DATA / "blobs"
      TMP = DATA / "tmp"
      DB_PATH = DATA / "drive.db"
      SESSION_DAYS = 30
      CHUNK = 1 << 20

      for d in (DATA, BLOBS, TMP):
          d.mkdir(parents=True, exist_ok=True)

      _key = DATA / "secret.key"
      if not _key.exists():
          _key.write_bytes(secrets.token_bytes(32))
          os.chmod(_key, 0o600)
      SECRET = _key.read_bytes()

      # Tipe yang aman ditampilkan inline di browser (selain itu dipaksa unduh).
      INLINE_OK = re.compile(r"^(image/(png|jpeg|gif|webp|avif|bmp)|application/pdf|video/|audio/|text/plain)")

      MIME_OVERRIDE = {
          "mkv": "video/x-matroska", "mov": "video/quicktime", "m4v": "video/mp4", "mp4": "video/mp4",
          "webm": "video/webm", "avi": "video/x-msvideo", "3gp": "video/3gpp", "ts": "video/mp2t",
          "heic": "image/heic", "heif": "image/heif", "webp": "image/webp", "avif": "image/avif",
          "docx": "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
          "xlsx": "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
          "pptx": "application/vnd.openxmlformats-officedocument.presentationml.presentation",
          "md": "text/markdown", "csv": "text/csv", "svg": "image/svg+xml",
      }


      def guess_mime(name):
          ext = name.rsplit(".", 1)[-1].lower() if "." in name else ""
          return MIME_OVERRIDE.get(ext) or mimetypes.guess_type(name)[0] or "application/octet-stream"


      CATEGORIES = {
          "photos": (["image/%"], ["jpg", "jpeg", "png", "gif", "webp", "avif", "bmp", "heic", "heif", "tiff", "svg", "raw", "dng"]),
          "videos": (["video/%"], ["mp4", "mkv", "mov", "webm", "avi", "m4v", "3gp", "wmv", "flv", "mpg", "mpeg"]),
          "documents": (["text/%", "application/pdf", "application/msword", "application/rtf", "application/vnd.%"],
                        ["pdf", "doc", "docx", "xls", "xlsx", "ppt", "pptx", "odt", "ods", "odp", "txt", "md", "rtf", "csv", "epub"]),
      }
      AUDIO_EXT = ("mp3", "wav", "flac", "m4a", "ogg", "aac", "opus", "wma")
      CATEGORIES["audio"] = (["audio/%"], list(AUDIO_EXT))


      def category_where(cat):
          pfx, exts = CATEGORIES[cat]
          sql = "(" + " OR ".join(["mime LIKE ?"] * len(pfx) + ["LOWER(name) LIKE ?"] * len(exts)) + ")"
          return sql, pfx + ["%." + e for e in exts]


      def classify(name, mime):
          ext = name.rsplit(".", 1)[-1].lower() if "." in name else ""
          mime = mime or ""
          if mime.startswith("image/") or ext in CATEGORIES["photos"][1]:
              return "photos"
          if mime.startswith("video/") or ext in CATEGORIES["videos"][1]:
              return "videos"
          if mime.startswith("audio/") or ext in AUDIO_EXT:
              return "audio"
          if mime.startswith("text/") or mime == "application/pdf" or mime.startswith("application/vnd.") or ext in CATEGORIES["documents"][1]:
              return "documents"
          return "other"


      # ---------------------------------------------------------------- database
      def db():
          c = sqlite3.connect(DB_PATH, timeout=30)
          c.row_factory = sqlite3.Row
          c.execute("PRAGMA foreign_keys=ON")
          return c


      def init_db():
          with db() as c:
              c.execute("PRAGMA journal_mode=WAL")
              c.executescript(
                  """
                  CREATE TABLE IF NOT EXISTS users(
                    id INTEGER PRIMARY KEY, username TEXT UNIQUE NOT NULL COLLATE NOCASE,
                    pw_hash TEXT NOT NULL, salt TEXT NOT NULL, is_admin INTEGER DEFAULT 0,
                    created REAL NOT NULL);
                  CREATE TABLE IF NOT EXISTS sessions(
                    token_hash TEXT PRIMARY KEY, user_id INTEGER NOT NULL, expires REAL NOT NULL);
                  CREATE TABLE IF NOT EXISTS items(
                    id TEXT PRIMARY KEY, user_id INTEGER NOT NULL, parent_id TEXT,
                    name TEXT NOT NULL, is_folder INTEGER NOT NULL, size INTEGER DEFAULT 0,
                    mime TEXT, created REAL NOT NULL, modified REAL NOT NULL,
                    trashed INTEGER DEFAULT 0, starred INTEGER DEFAULT 0);
                  CREATE INDEX IF NOT EXISTS ix_items_parent ON items(user_id, parent_id);
                  CREATE TABLE IF NOT EXISTS shares(
                    token TEXT PRIMARY KEY, item_id TEXT NOT NULL, created REAL NOT NULL);
                  """
              )
              for col, typ in (("expires", "REAL"), ("pw_hash", "TEXT"), ("salt", "TEXT")):
                  try:
                      c.execute(f"ALTER TABLE shares ADD COLUMN {col} {typ}")
                  except sqlite3.OperationalError:
                      pass
              for tbl, col, typ in (("items", "color", "TEXT"), ("items", "trashed_at", "REAL"),
                                    ("users", "quota_gb", "REAL"), ("shares", "views", "INTEGER DEFAULT 0")):
                  try:
                      c.execute(f"ALTER TABLE {tbl} ADD COLUMN {col} {typ}")
                  except sqlite3.OperationalError:
                      pass
              c.execute("CREATE TABLE IF NOT EXISTS activity(id INTEGER PRIMARY KEY, user_id INTEGER NOT NULL, "
                        "action TEXT NOT NULL, detail TEXT, ts REAL NOT NULL)")
              c.execute("CREATE INDEX IF NOT EXISTS ix_act ON activity(user_id, ts)")
              c.execute("UPDATE items SET trashed_at=? WHERE trashed=1 AND trashed_at IS NULL", (time.time(),))


      def log(c, uid, action, detail=""):
          c.execute("INSERT INTO activity(user_id,action,detail,ts) VALUES(?,?,?,?)", (uid, action, (detail or "")[:200], time.time()))


      # ---------------------------------------------------------------- utils
      def hash_pw(password, salt):
          return hashlib.pbkdf2_hmac("sha256", password.encode(), bytes.fromhex(salt), 200_000).hex()


      def make_user(c, username, password, is_admin=False):
          salt = secrets.token_hex(16)
          c.execute(
              "INSERT INTO users(username,pw_hash,salt,is_admin,created) VALUES(?,?,?,?,?)",
              (username, hash_pw(password, salt), salt, int(is_admin), time.time()),
          )


      def tok_hash(t):
          return hashlib.sha256(t.encode()).hexdigest()


      FAILS = {}


      def too_many_fails(key):
          now = time.time()
          FAILS[key] = [t for t in FAILS.get(key, []) if now - t < 300]
          return len(FAILS[key]) >= 10


      class ApiError(Exception):
          def __init__(self, status, msg):
              self.status, self.msg = status, msg


      def clean_name(name):
          name = (name or "").replace("\x00", "").strip()
          name = re.sub(r"[\\/]", "_", name)
          if not name or name in (".", ".."):
              raise ApiError(400, "Nama tidak valid")
          return name[:255]


      def unique_name(c, uid, parent, name):
          def exists(n):
              return c.execute("SELECT 1 FROM items WHERE user_id=? AND parent_id IS ? AND trashed=0 AND name=? COLLATE NOCASE",
                               (uid, parent, n)).fetchone()
          if not exists(name):
              return name
          stem, dot, ext = name.rpartition(".")
          if not dot or not stem:
              stem, ext = name, ""
          else:
              ext = "." + ext
          i = 1
          while exists(f"{stem} ({i}){ext}"):
              i += 1
          return f"{stem} ({i}){ext}"


      def descendants(c, ids):
          if not ids:
              return []
          q = ",".join("?" * len(ids))
          rows = c.execute(
              f"""WITH RECURSIVE t(id) AS (
                    SELECT id FROM items WHERE id IN ({q})
                    UNION ALL SELECT i.id FROM items i JOIN t ON i.parent_id=t.id)
                  SELECT id FROM t""", list(ids)).fetchall()
          return [r["id"] for r in rows]


      def item_dict(r, shared=()):
          return {
              "id": r["id"], "parent_id": r["parent_id"], "name": r["name"],
              "is_folder": bool(r["is_folder"]), "size": r["size"], "mime": r["mime"],
              "created": r["created"], "modified": r["modified"],
              "starred": bool(r["starred"]), "trashed": bool(r["trashed"]), "shared": r["id"] in shared,
              "color": r["color"], "trashed_at": r["trashed_at"],
          }


      def fmt_size(n):
          for u in ("B", "KB", "MB", "GB", "TB"):
              if n < 1024 or u == "TB":
                  return f"{n:.0f} {u}" if u == "B" else f"{n:.1f} {u}"
              n /= 1024


      def in_tree(c, root_id, item_id):
          """True jika item_id sama dengan / berada di bawah root_id."""
          cur, hops = item_id, 0
          while cur and hops < 200:
              if cur == root_id:
                  return True
              r = c.execute("SELECT parent_id FROM items WHERE id=?", (cur,)).fetchone()
              cur = r["parent_id"] if r else None
              hops += 1
          return False


      # ---------------------------------------------------------------- halaman publik (berbagi)
      SHARE_CSS = """
      :root{--bg:#0d0f16;--card:#151822;--line:#252a38;--text:#e9ecf5;--muted:#8d95ab;--accent:#8b9bff;--g:linear-gradient(135deg,#5b5ff0,#8b5cf6)}
      @media(prefers-color-scheme:light){:root{--bg:#f5f6fa;--card:#fff;--line:#e8eaf1;--text:#0f1222;--muted:#6b7085;--accent:#5b5ff0}}
      *{box-sizing:border-box}body{margin:0;font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(800px 400px at 10% -10%,rgba(139,92,246,.18),transparent),radial-gradient(700px 400px at 100% 100%,rgba(91,95,240,.16),transparent),var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}
      .wrap{max-width:860px;margin:0 auto;padding:28px 16px}
      .brand{display:flex;align-items:center;gap:10px;font-weight:750;margin-bottom:20px;letter-spacing:-.2px}
      .brand i{width:32px;height:32px;border-radius:10px;background:var(--g);display:grid;place-items:center;color:#fff;font-style:normal;font-size:14px;box-shadow:0 6px 16px rgba(91,95,240,.4)}
      .card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:26px;box-shadow:0 20px 50px rgba(8,10,20,.18)}
      h1{font-size:22px;margin:0 0 4px;word-break:break-word;letter-spacing:-.4px}.muted{color:var(--muted);font-size:13px}
      .btn{display:inline-flex;align-items:center;gap:8px;background:var(--g);color:#fff;border:0;padding:11px 20px;border-radius:13px;text-decoration:none;font-weight:650;cursor:pointer;font-size:14px;box-shadow:0 8px 20px rgba(91,95,240,.35);transition:.15s}
      .btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
      .btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line);box-shadow:none;padding:7px 13px;border-radius:10px}
      .stage{margin:18px 0;display:grid;place-items:center;background:rgba(127,127,127,.08);border-radius:18px;overflow:hidden;min-height:140px}
      .stage img,.stage video{max-width:100%;max-height:70vh;display:block}.stage iframe{width:100%;height:70vh;border:0;background:#fff}
      .stage .big{font-size:56px;padding:30px}
      .row{display:flex;align-items:center;gap:12px;padding:10px 8px;border-bottom:1px solid var(--line);border-radius:12px}
      .row:hover{background:rgba(127,127,127,.07)}
      .row:last-child{border:0}.row a.n{flex:1;min-width:0;color:inherit;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:550}
      .row a.n:hover{color:var(--accent)}.ic{width:38px;height:38px;border-radius:12px;background:rgba(127,127,127,.12);display:grid;place-items:center;overflow:hidden;flex:none}
      .ic img{width:100%;height:100%;object-fit:cover}
      .crumb{margin:6px 0 14px;font-size:13px;color:var(--muted)}.crumb a{color:var(--accent);text-decoration:none}
      input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--text);font-size:15px;margin:12px 0;outline:none}
      input:focus{border-color:var(--accent)}
      .err{color:#ff6b6b;font-size:13px}
      """


      def share_page(title, body, status=200):
          return status, ("<!doctype html><html lang=id><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'>"
                          f"<title>{h(title)} · HomeDrive</title><meta name=theme-color content='#5b5ff0'><style>{SHARE_CSS}</style><body><div class=wrap>"
                          f"<div class=brand><i>▲</i>HomeDrive</div>{body}</div></body></html>").encode()


      ICON_SVG = (b"<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'>"
                  b"<stop offset='0' stop-color='#5b5ff0'/><stop offset='1' stop-color='#8b5cf6'/></linearGradient></defs>"
                  b"<rect width='512' height='512' rx='120' fill='url(#g)'/><path d='M128 340h256l-51-160H179z' fill='#fff'/></svg>")
      MANIFEST = json.dumps({
          "name": "HomeDrive", "short_name": "HomeDrive", "description": "Penyimpanan file pribadi di server rumah",
          "start_url": "/", "display": "standalone", "background_color": "#f5f6fa", "theme_color": "#5b5ff0",
          "icons": [{"src": "/icon.svg", "sizes": "any", "type": "image/svg+xml", "purpose": "any maskable"}],
      }).encode()


      # ---------------------------------------------------------------- handler
      class Handler(BaseHTTPRequestHandler):
          protocol_version = "HTTP/1.1"
          server_version = "HomeDrive"

          def log_message(self, fmt, *args):
              sys.stderr.write("%s - %s\n" % (self.address_string(), fmt % args))

          def _headers(self, status, ctype, length, extra=None):
              self.send_response(status)
              self.send_header("Content-Type", ctype)
              self.send_header("Content-Length", str(length))
              self.send_header("X-Content-Type-Options", "nosniff")
              self.send_header("Referrer-Policy", "same-origin")
              for k, v in (extra or {}).items():
                  self.send_header(k, v)
              self.end_headers()

          def send_json(self, obj, status=200, extra=None):
              body = json.dumps(obj).encode()
              self._headers(status, "application/json; charset=utf-8", len(body), extra)
              self.wfile.write(body)

          def send_html(self, pair, extra=None):
              status, body = pair
              self._headers(status, "text/html; charset=utf-8", len(body), extra)
              if not self.head_only:
                  self.wfile.write(body)

          def read_json(self, limit=1_000_000):
              n = int(self.headers.get("Content-Length") or 0)
              if n > limit:
                  raise ApiError(413, "Permintaan terlalu besar")
              try:
                  return json.loads(self.rfile.read(n) or b"{}")
              except ValueError:
                  raise ApiError(400, "JSON tidak valid")

          def cookie(self, name):
              for part in (self.headers.get("Cookie") or "").split(";"):
                  k, _, v = part.strip().partition("=")
                  if k == name:
                      return v
              return None

          def current_user(self):
              t = self.cookie("sid")
              if not t:
                  return None
              with db() as c:
                  return c.execute(
                      "SELECT u.* FROM sessions s JOIN users u ON u.id=s.user_id "
                      "WHERE s.token_hash=? AND s.expires>?", (tok_hash(t), time.time())).fetchone()

          def need_user(self):
              u = self.current_user()
              if not u:
                  raise ApiError(401, "Belum login")
              return u

          def start_session(self, user_id):
              t = secrets.token_urlsafe(32)
              with db() as c:
                  c.execute("DELETE FROM sessions WHERE expires<?", (time.time(),))
                  c.execute("INSERT INTO sessions VALUES(?,?,?)", (tok_hash(t), user_id, time.time() + SESSION_DAYS * 86400))
              flags = "HttpOnly; SameSite=Lax; Path=/; Max-Age=%d" % (SESSION_DAYS * 86400)
              if COOKIE_SECURE:
                  flags += "; Secure"
              return {"Set-Cookie": f"sid={t}; {flags}"}

          def quota_for(self, c, uid):
              r = c.execute("SELECT quota_gb FROM users WHERE id=?", (uid,)).fetchone()
              if r and r["quota_gb"] is not None:
                  return int(r["quota_gb"] * 1024**3)
              return QUOTA

          def uquota(self, uid):
              with db() as c:
                  return self.quota_for(c, uid)

          def used_bytes(self, c, uid):
              return c.execute("SELECT COALESCE(SUM(size),0) s FROM items WHERE user_id=? AND is_folder=0", (uid,)).fetchone()["s"]

          # ---- dispatch
          def do_GET(self):
              self.route("GET")

          def do_HEAD(self):
              self.route("GET", head=True)

          def do_POST(self):
              self.route("POST")

          def route(self, method, head=False):
              self.head_only = head
              u = urlparse(self.path)
              q = parse_qs(u.query)
              path = u.path
              try:
                  if method == "GET" and path in ("/", "/index.html"):
                      return self.serve_index()
                  if method == "GET" and path == "/manifest.webmanifest":
                      return self.serve_static("application/manifest+json", MANIFEST)
                  if method == "GET" and path == "/icon.svg":
                      return self.serve_static("image/svg+xml", ICON_SVG)
                  if path.startswith("/s/"):
                      return self.public_share(method, path[3:], q)
                  if not path.startswith("/api/"):
                      raise ApiError(404, "Tidak ditemukan")
                  if method == "POST" and self.headers.get("X-Requested-With") != "drive":
                      raise ApiError(403, "Header X-Requested-With wajib")
                  name = path[5:].strip("/")
                  fn = getattr(self, "api_" + name.split("/")[0].replace("-", "_"), None)
                  if not fn:
                      raise ApiError(404, "Endpoint tidak ada")
                  fn(method, name, q)
              except ApiError as e:
                  if method == "POST":
                      self.close_connection = True
                  try:
                      if path.startswith("/s/"):
                          self.send_html(share_page("Tidak tersedia", f"<div class=card><h1>Tidak tersedia</h1><p class=muted>{h(e.msg)}</p></div>", e.status))
                      else:
                          self.send_json({"error": e.msg}, e.status)
                  except Exception:
                      pass
              except (BrokenPipeError, ConnectionResetError):
                  self.close_connection = True
              except Exception as e:  # noqa
                  self.close_connection = True
                  sys.stderr.write("ERROR: %r\n" % (e,))
                  try:
                      self.send_json({"error": "Kesalahan server"}, 500)
                  except Exception:
                      pass

          def serve_static(self, ctype, body):
              self._headers(200, ctype, len(body), {"Cache-Control": "public, max-age=86400"})
              if not self.head_only:
                  self.wfile.write(body)

          def serve_index(self):
              body = (BASE / "index.html").read_bytes()
              self._headers(200, "text/html; charset=utf-8", len(body), {"Cache-Control": "no-cache"})
              if not self.head_only:
                  self.wfile.write(body)

          # ---- auth endpoints
          def api_me(self, method, name, q):
              u = self.current_user()
              with db() as c:
                  n = c.execute("SELECT COUNT(*) n FROM users").fetchone()["n"]
                  if not u:
                      return self.send_json({"user": None, "setup_needed": n == 0})
                  used = self.used_bytes(c, u["id"])
              self.send_json({"user": {"username": u["username"], "is_admin": bool(u["is_admin"])}, "used": used, "quota": self.uquota(u["id"]), "trash_days": TRASH_DAYS})

          def api_setup(self, method, name, q):
              d = self.read_json()
              with db() as c:
                  if c.execute("SELECT COUNT(*) n FROM users").fetchone()["n"]:
                      raise ApiError(403, "Setup sudah dilakukan")
                  un, pw = (d.get("username") or "").strip(), d.get("password") or ""
                  if not re.fullmatch(r"[A-Za-z0-9_.-]{3,32}", un):
                      raise ApiError(400, "Username 3-32 karakter (huruf, angka, _ . -)")
                  if len(pw) < 8:
                      raise ApiError(400, "Password minimal 8 karakter")
                  make_user(c, un, pw, True)
                  uid = c.execute("SELECT id FROM users WHERE username=?", (un,)).fetchone()["id"]
              self.send_json({"ok": True}, extra=self.start_session(uid))

          def api_login(self, method, name, q):
              ip = self.client_address[0]
              if too_many_fails(ip):
                  raise ApiError(429, "Terlalu banyak percobaan, coba lagi 5 menit lagi")
              d = self.read_json()
              with db() as c:
                  r = c.execute("SELECT * FROM users WHERE username=?", ((d.get("username") or "").strip(),)).fetchone()
              ok = bool(r) and hmac.compare_digest(hash_pw(d.get("password") or "", r["salt"]), r["pw_hash"])
              if not ok:
                  FAILS.setdefault(ip, []).append(time.time())
                  raise ApiError(401, "Username atau password salah")
              with db() as c:
                  log(c, r["id"], "login", ip)
              self.send_json({"ok": True}, extra=self.start_session(r["id"]))

          def api_logout(self, method, name, q):
              t = self.cookie("sid")
              u = self.current_user()
              with db() as c:
                  if u and q.get("all", [""])[0] == "1":
                      c.execute("DELETE FROM sessions WHERE user_id=?", (u["id"],))
                  elif t:
                      c.execute("DELETE FROM sessions WHERE token_hash=?", (tok_hash(t),))
              self.send_json({"ok": True}, extra={"Set-Cookie": "sid=; Path=/; Max-Age=0"})

          def api_password(self, method, name, q):
              u = self.need_user()
              d = self.read_json()
              if not hmac.compare_digest(hash_pw(d.get("old") or "", u["salt"]), u["pw_hash"]):
                  raise ApiError(403, "Password lama salah")
              new = d.get("new") or ""
              if len(new) < 8:
                  raise ApiError(400, "Password baru minimal 8 karakter")
              salt = secrets.token_hex(16)
              with db() as c:
                  c.execute("UPDATE users SET pw_hash=?, salt=? WHERE id=?", (hash_pw(new, salt), salt, u["id"]))
              self.send_json({"ok": True})

          def api_users(self, method, name, q):
              u = self.need_user()
              if not u["is_admin"]:
                  raise ApiError(403, "Hanya admin")
              parts = name.split("/")
              with db() as c:
                  if method == "GET":
                      rows = c.execute(
                          "SELECT u.id,u.username,u.is_admin,u.quota_gb,COALESCE(SUM(i.size),0) used FROM users u "
                          "LEFT JOIN items i ON i.user_id=u.id AND i.is_folder=0 GROUP BY u.id ORDER BY u.id").fetchall()
                      return self.send_json({"users": [dict(r) for r in rows]})
                  d = self.read_json()
                  if len(parts) == 1:
                      un, pw = (d.get("username") or "").strip(), d.get("password") or ""
                      if not re.fullmatch(r"[A-Za-z0-9_.-]{3,32}", un):
                          raise ApiError(400, "Username 3-32 karakter (huruf, angka, _ . -)")
                      if len(pw) < 8:
                          raise ApiError(400, "Password minimal 8 karakter")
                      try:
                          make_user(c, un, pw, bool(d.get("is_admin")))
                      except sqlite3.IntegrityError:
                          raise ApiError(409, "Username sudah dipakai")
                      c.commit()
                      return self.send_json({"ok": True})
                  if parts[1] == "delete":
                      uid = int(d.get("id", 0))
                      if uid == u["id"]:
                          raise ApiError(400, "Tidak bisa menghapus akun sendiri")
                      for r in c.execute("SELECT id FROM items WHERE user_id=? AND is_folder=0", (uid,)).fetchall():
                          (BLOBS / r["id"]).unlink(missing_ok=True)
                      c.execute("DELETE FROM shares WHERE item_id IN (SELECT id FROM items WHERE user_id=?)", (uid,))
                      c.execute("DELETE FROM items WHERE user_id=?", (uid,))
                      c.execute("DELETE FROM sessions WHERE user_id=?", (uid,))
                      c.execute("DELETE FROM activity WHERE user_id=?", (uid,))
                      c.execute("DELETE FROM users WHERE id=?", (uid,))
                      c.commit()
                      return self.send_json({"ok": True})
                  if parts[1] in ("reset", "quota", "role"):
                      uid = int(d.get("id", 0))
                      if not c.execute("SELECT 1 FROM users WHERE id=?", (uid,)).fetchone():
                          raise ApiError(404, "Pengguna tidak ada")
                      if parts[1] == "reset":
                          pw = d.get("password") or ""
                          if len(pw) < 8:
                              raise ApiError(400, "Password minimal 8 karakter")
                          salt = secrets.token_hex(16)
                          c.execute("UPDATE users SET pw_hash=?, salt=? WHERE id=?", (hash_pw(pw, salt), salt, uid))
                          c.execute("DELETE FROM sessions WHERE user_id=?", (uid,))
                      elif parts[1] == "quota":
                          g = d.get("quota_gb")
                          try:
                              val = None if g in (None, "") else max(0.0, float(g))
                          except (TypeError, ValueError):
                              raise ApiError(400, "Kuota tidak valid")
                          c.execute("UPDATE users SET quota_gb=? WHERE id=?", (val, uid))
                      else:
                          if uid == u["id"]:
                              raise ApiError(400, "Tidak bisa mengubah peran akun sendiri")
                          c.execute("UPDATE users SET is_admin=? WHERE id=?", (int(bool(d.get("is_admin"))), uid))
                      c.commit()
                      return self.send_json({"ok": True})
              raise ApiError(404, "Endpoint tidak ada")

          # ---- item helpers
          def own_item(self, c, uid, iid):
              r = c.execute("SELECT * FROM items WHERE id=? AND user_id=?", (iid, uid)).fetchone()
              if not r:
                  raise ApiError(404, "Item tidak ditemukan")
              return r

          def check_parent(self, c, uid, parent):
              if parent in (None, "", "root"):
                  return None
              r = self.own_item(c, uid, parent)
              if not r["is_folder"] or r["trashed"]:
                  raise ApiError(400, "Folder tujuan tidak valid")
              return parent

          # ---- listing & stats
          def api_list(self, method, name, q):
              u = self.need_user()
              view = q.get("view", ["files"])[0]
              parent = q.get("parent", [""])[0] or None
              term = q.get("q", [""])[0].strip()
              only_folders = q.get("folders", [""])[0] == "1"
              crumbs = []
              with db() as c:
                  uid = u["id"]
                  order = "ORDER BY is_folder DESC, name COLLATE NOCASE"
                  if term:
                      like = "%" + term.replace("\\", "\\\\").replace("%", "\\%").replace("_", "\\_") + "%"
                      rows = c.execute(f"SELECT * FROM items WHERE user_id=? AND trashed=0 AND name LIKE ? ESCAPE '\\' {order} LIMIT 500",
                                       (uid, like)).fetchall()
                  elif view in CATEGORIES:
                      where, params = category_where(view)
                      rows = c.execute(f"SELECT * FROM items WHERE user_id=? AND trashed=0 AND is_folder=0 AND {where} "
                                       "ORDER BY modified DESC LIMIT 3000", [uid] + params).fetchall()
                  elif view == "shared":
                      rows = c.execute(f"SELECT * FROM items WHERE user_id=? AND trashed=0 AND id IN (SELECT item_id FROM shares) {order}", (uid,)).fetchall()
                  elif view == "large":
                      rows = c.execute("SELECT * FROM items WHERE user_id=? AND trashed=0 AND is_folder=0 AND size>0 "
                                       "ORDER BY size DESC LIMIT 100", (uid,)).fetchall()
                  elif view == "starred":
                      rows = c.execute(f"SELECT * FROM items WHERE user_id=? AND trashed=0 AND starred=1 {order}", (uid,)).fetchall()
                  elif view == "recent":
                      rows = c.execute("SELECT * FROM items WHERE user_id=? AND trashed=0 AND is_folder=0 "
                                       "ORDER BY modified DESC LIMIT 60", (uid,)).fetchall()
                  elif view == "trash":
                      rows = c.execute(
                          f"SELECT * FROM items WHERE user_id=? AND trashed=1 AND (parent_id IS NULL OR parent_id NOT IN "
                          f"(SELECT id FROM items WHERE trashed=1 AND user_id=?)) {order}", (uid, uid)).fetchall()
                  else:
                      if parent:
                          cur = self.own_item(c, uid, parent)
                          while cur:
                              crumbs.insert(0, {"id": cur["id"], "name": cur["name"]})
                              cur = c.execute("SELECT * FROM items WHERE id=?", (cur["parent_id"],)).fetchone() if cur["parent_id"] else None
                      extra = " AND is_folder=1" if only_folders else ""
                      rows = c.execute(f"SELECT * FROM items WHERE user_id=? AND trashed=0 AND parent_id IS ?{extra} {order}",
                                       (uid, parent)).fetchall()
                  shared = {r["item_id"] for r in c.execute(
                      "SELECT item_id FROM shares WHERE item_id IN (SELECT id FROM items WHERE user_id=?)", (uid,)).fetchall()}
                  used = self.used_bytes(c, uid)
              self.send_json({"items": [item_dict(r, shared) for r in rows], "crumbs": crumbs, "used": used, "quota": self.uquota(u["id"])})

          def api_stats(self, method, name, q):
              u = self.need_user()
              cats = {k: {"size": 0, "count": 0} for k in ("photos", "videos", "audio", "documents", "other")}
              trash = 0
              with db() as c:
                  for r in c.execute("SELECT name,mime,size,trashed FROM items WHERE user_id=? AND is_folder=0", (u["id"],)).fetchall():
                      if r["trashed"]:
                          trash += r["size"]
                      else:
                          k = cats[classify(r["name"], r["mime"])]
                          k["size"] += r["size"]
                          k["count"] += 1
                  folders = c.execute("SELECT COUNT(*) n FROM items WHERE user_id=? AND is_folder=1 AND trashed=0", (u["id"],)).fetchone()["n"]
              qt = self.uquota(u["id"])
              try:
                  du = shutil.disk_usage(DATA)
                  disk = {"total": du.total, "free": du.free, "used": du.used}
              except OSError:
                  disk = {"total": 0, "free": 0, "used": 0}
              used = sum(k["size"] for k in cats.values()) + trash
              avail = max(0, qt - used) if qt else disk["free"]
              avail = min(avail, disk["free"]) if disk["total"] else avail
              all_used = None
              if u["is_admin"]:
                  with db() as c:
                      all_used = c.execute("SELECT COALESCE(SUM(size),0) s FROM items WHERE is_folder=0").fetchone()["s"]
              self.send_json({"categories": cats, "trash": trash, "folders": folders, "quota": qt, "available": avail,
                              "disk": disk, "all_used": all_used})

          # ---- mutations
          def api_folder(self, method, name, q):
              u = self.need_user()
              d = self.read_json()
              now = time.time()
              with db() as c:
                  parent = self.check_parent(c, u["id"], d.get("parent"))
                  nm = clean_name(d.get("name"))
                  if d.get("reuse"):
                      ex = c.execute("SELECT id FROM items WHERE user_id=? AND parent_id IS ? AND is_folder=1 AND trashed=0 AND name=? COLLATE NOCASE",
                                     (u["id"], parent, nm)).fetchone()
                      if ex:
                          return self.send_json({"id": ex["id"]})
                  else:
                      nm = unique_name(c, u["id"], parent, nm)
                  iid = uuid.uuid4().hex
                  c.execute("INSERT INTO items(id,user_id,parent_id,name,is_folder,created,modified) VALUES(?,?,?,?,1,?,?)",
                            (iid, u["id"], parent, nm, now, now))
                  log(c, u["id"], "folder", nm)
              self.send_json({"id": iid})

          def api_upload(self, method, name, q):
              u = self.need_user()
              fname = clean_name(q.get("name", [""])[0])
              length = self.headers.get("Content-Length")
              if length is None or not length.isdigit():
                  raise ApiError(411, "Content-Length wajib")
              length = int(length)
              with db() as c:
                  parent = self.check_parent(c, u["id"], q.get("parent", [""])[0])
                  qt = self.quota_for(c, u["id"])
                  if qt and self.used_bytes(c, u["id"]) + length > qt:
                      raise ApiError(413, "Kuota penyimpanan penuh")
              iid = uuid.uuid4().hex
              tmp = TMP / iid
              remaining = length
              try:
                  with open(tmp, "wb") as f:
                      while remaining > 0:
                          chunk = self.rfile.read(min(CHUNK, remaining))
                          if not chunk:
                              raise ApiError(400, "Upload terputus")
                          f.write(chunk)
                          remaining -= len(chunk)
                  os.replace(tmp, BLOBS / iid)
              except BaseException:
                  tmp.unlink(missing_ok=True)
                  raise
              now = time.time()
              with db() as c:
                  nm = unique_name(c, u["id"], parent, fname)
                  c.execute("INSERT INTO items(id,user_id,parent_id,name,is_folder,size,mime,created,modified) VALUES(?,?,?,?,0,?,?,?,?)",
                            (iid, u["id"], parent, nm, length, guess_mime(nm), now, now))
                  log(c, u["id"], "upload", nm)
              self.send_json({"id": iid, "name": nm})

          def api_savetext(self, method, name, q):
              """Buat file teks baru (tanpa id) atau timpa isi file teks (dengan id)."""
              u = self.need_user()
              d = self.read_json(3_000_000)
              content = d.get("content")
              if not isinstance(content, str):
                  raise ApiError(400, "Isi tidak valid")
              data = content.encode("utf-8")
              now = time.time()
              with db() as c:
                  if d.get("id"):
                      r = self.own_item(c, u["id"], d["id"])
                      if r["is_folder"] or r["trashed"]:
                          raise ApiError(400, "Bukan file")
                      qt = self.quota_for(c, u["id"])
                      if qt and self.used_bytes(c, u["id"]) - r["size"] + len(data) > qt:
                          raise ApiError(413, "Kuota penyimpanan penuh")
                      tmp = TMP / uuid.uuid4().hex
                      tmp.write_bytes(data)
                      os.replace(tmp, BLOBS / r["id"])
                      c.execute("UPDATE items SET size=?, modified=? WHERE id=?", (len(data), now, r["id"]))
                      log(c, u["id"], "edit", r["name"])
                      c.commit()
                      return self.send_json({"id": r["id"]})
                  parent = self.check_parent(c, u["id"], d.get("parent"))
                  qt = self.quota_for(c, u["id"])
                  if qt and self.used_bytes(c, u["id"]) + len(data) > qt:
                      raise ApiError(413, "Kuota penyimpanan penuh")
                  nm = unique_name(c, u["id"], parent, clean_name(d.get("name") or "Catatan.txt"))
                  iid = uuid.uuid4().hex
                  (BLOBS / iid).write_bytes(data)
                  c.execute("INSERT INTO items(id,user_id,parent_id,name,is_folder,size,mime,created,modified) VALUES(?,?,?,?,0,?,?,?,?)",
                            (iid, u["id"], parent, nm, len(data), guess_mime(nm), now, now))
              self.send_json({"id": iid, "name": nm})

          def api_rename(self, method, name, q):
              u = self.need_user()
              d = self.read_json()
              with db() as c:
                  r = self.own_item(c, u["id"], d.get("id"))
                  nm = clean_name(d.get("name"))
                  mime = r["mime"] if r["is_folder"] else guess_mime(nm)
                  c.execute("UPDATE items SET name=?, mime=?, modified=? WHERE id=?", (nm, mime, time.time(), r["id"]))
                  log(c, u["id"], "rename", f"{r['name']} → {nm}")
              self.send_json({"ok": True})

          def api_move(self, method, name, q):
              u = self.need_user()
              d = self.read_json()
              ids = d.get("ids") or []
              with db() as c:
                  parent = self.check_parent(c, u["id"], d.get("parent"))
                  for iid in ids:
                      self.own_item(c, u["id"], iid)
                  if parent and parent in descendants(c, ids):
                      raise ApiError(400, "Tidak bisa memindahkan folder ke dalam dirinya sendiri")
                  c.executemany("UPDATE items SET parent_id=?, modified=? WHERE id=?", [(parent, time.time(), i) for i in ids])
                  log(c, u["id"], "move", f"{len(ids)} item")
              self.send_json({"ok": True})

          def api_copy(self, method, name, q):
              u = self.need_user()
              d = self.read_json()
              ids = d.get("ids") or []
              with db() as c:
                  uid = u["id"]
                  rows = [self.own_item(c, uid, i) for i in ids]
                  for r in rows:
                      if r["trashed"]:
                          raise ApiError(400, "Item ada di sampah")
                  dest_given = "parent" in d
                  dest = self.check_parent(c, uid, d.get("parent")) if dest_given else None
                  qt = self.quota_for(c, uid)
                  if qt:
                      need = sum(c.execute("SELECT COALESCE(SUM(size),0) s FROM items WHERE id IN (%s) AND is_folder=0" % ",".join("?" * len(descendants(c, [r["id"]]))),
                                           descendants(c, [r["id"]])).fetchone()["s"] for r in rows)
                      if self.used_bytes(c, uid) + need > qt:
                          raise ApiError(413, "Kuota penyimpanan penuh")
                  now = time.time()

                  def clone(r, parent, newname):
                      nid = uuid.uuid4().hex
                      c.execute("INSERT INTO items(id,user_id,parent_id,name,is_folder,size,mime,created,modified) VALUES(?,?,?,?,?,?,?,?,?)",
                                (nid, uid, parent, newname, r["is_folder"], r["size"], r["mime"], now, now))
                      if r["is_folder"]:
                          for ch in c.execute("SELECT * FROM items WHERE parent_id=? AND user_id=? AND trashed=0", (r["id"], uid)).fetchall():
                              clone(ch, nid, ch["name"])
                      elif (BLOBS / r["id"]).exists():
                          shutil.copyfile(BLOBS / r["id"], BLOBS / nid)
                      return nid

                  new_ids = []
                  for r in rows:
                      parent = dest if dest_given else r["parent_id"]
                      nm = unique_name(c, uid, parent, ("Salinan " + r["name"])[:255] if not dest_given or parent == r["parent_id"] else r["name"])
                      new_ids.append(clone(r, parent, nm))
                  log(c, uid, "copy", f"{len(rows)} item")
              self.send_json({"ids": new_ids})

          def api_star(self, method, name, q):
              u = self.need_user()
              d = self.read_json()
              ids = d.get("ids") or ([d["id"]] if d.get("id") else [])
              with db() as c:
                  for iid in ids:
                      self.own_item(c, u["id"], iid)
                  c.executemany("UPDATE items SET starred=? WHERE id=?", [(int(bool(d.get("value"))), i) for i in ids])
              self.send_json({"ok": True})

          def api_trash(self, method, name, q):
              u = self.need_user()
              d = self.read_json()
              ids, restore = d.get("ids") or [], bool(d.get("restore"))
              with db() as c:
                  for iid in ids:
                      self.own_item(c, u["id"], iid)
                  all_ids = descendants(c, ids)
                  c.executemany("UPDATE items SET trashed=?, trashed_at=? WHERE id=?",
                                [(int(not restore), None if restore else time.time(), i) for i in all_ids])
                  log(c, u["id"], "restore" if restore else "trash", f"{len(ids)} item")
                  if restore:
                      for iid in ids:
                          r = c.execute("SELECT parent_id FROM items WHERE id=?", (iid,)).fetchone()
                          if r["parent_id"]:
                              p = c.execute("SELECT trashed FROM items WHERE id=?", (r["parent_id"],)).fetchone()
                              if not p or p["trashed"]:
                                  c.execute("UPDATE items SET parent_id=NULL WHERE id=?", (iid,))
              self.send_json({"ok": True})

          def purge(self, c, ids):
              all_ids = descendants(c, ids)
              for i in all_ids:
                  (BLOBS / i).unlink(missing_ok=True)
              c.executemany("DELETE FROM shares WHERE item_id=?", [(i,) for i in all_ids])
              c.executemany("DELETE FROM items WHERE id=?", [(i,) for i in all_ids])

          def api_delete(self, method, name, q):
              u = self.need_user()
              d = self.read_json()
              with db() as c:
                  for iid in d.get("ids") or []:
                      if not self.own_item(c, u["id"], iid)["trashed"]:
                          raise ApiError(400, "Pindahkan ke sampah dulu")
                  self.purge(c, d.get("ids") or [])
                  log(c, u["id"], "delete", f"{len(d.get('ids') or [])} item permanen")
              self.send_json({"ok": True})

          def api_empty_trash(self, method, name, q):
              u = self.need_user()
              with db() as c:
                  ids = [r["id"] for r in c.execute(
                      "SELECT id FROM items WHERE user_id=? AND trashed=1 AND (parent_id IS NULL OR parent_id NOT IN "
                      "(SELECT id FROM items WHERE trashed=1 AND user_id=?))", (u["id"], u["id"])).fetchall()]
                  self.purge(c, ids)
                  log(c, u["id"], "delete", "Sampah dikosongkan")
              self.send_json({"ok": True})

          # ---- sharing (pemilik)
          def share_info(self, row):
              if not row:
                  return {"token": None}
              exp = row["expires"]
              return {"token": row["token"], "expires": exp, "expired": bool(exp and exp < time.time()),
                      "has_password": bool(row["pw_hash"]), "views": row["views"] or 0}

          def api_share(self, method, name, q):
              u = self.need_user()
              iid = q.get("id", [""])[0]
              with db() as c:
                  it = self.own_item(c, u["id"], iid)
                  row = c.execute("SELECT * FROM shares WHERE item_id=?", (iid,)).fetchone()
                  if method == "GET":
                      return self.send_json(self.share_info(row))
                  d = self.read_json()
                  if d.get("revoke"):
                      c.execute("DELETE FROM shares WHERE item_id=?", (iid,))
                      log(c, u["id"], "unshare", it["name"])
                      c.commit()
                      return self.send_json({"token": None})
                  if not row:
                      c.execute("INSERT INTO shares(token,item_id,created) VALUES(?,?,?)", (secrets.token_urlsafe(18), iid, time.time()))
                      log(c, u["id"], "share", it["name"])
                  if "expires_days" in d:
                      days = int(d.get("expires_days") or 0)
                      c.execute("UPDATE shares SET expires=? WHERE item_id=?", (time.time() + days * 86400 if days > 0 else None, iid))
                  if "password" in d:
                      pw = d.get("password") or ""
                      if pw:
                          salt = secrets.token_hex(16)
                          c.execute("UPDATE shares SET pw_hash=?, salt=? WHERE item_id=?", (hash_pw(pw, salt), salt, iid))
                      else:
                          c.execute("UPDATE shares SET pw_hash=NULL, salt=NULL WHERE item_id=?", (iid,))
                  row = c.execute("SELECT * FROM shares WHERE item_id=?", (iid,)).fetchone()
              self.send_json(self.share_info(row))

          # ---- halaman publik
          def share_cookie_val(self, s):
              return hmac.new(SECRET, (s["token"] + (s["pw_hash"] or "")).encode(), "sha256").hexdigest()[:40]

          def public_share(self, method, path, q):
              parts = [p for p in path.split("/") if p]
              if not parts:
                  raise ApiError(404, "Tautan tidak valid")
              token = parts[0]
              with db() as c:
                  s = c.execute("SELECT * FROM shares WHERE token=?", (token,)).fetchone()
                  root = c.execute("SELECT * FROM items WHERE id=?", (s["item_id"],)).fetchone() if s else None
                  if not s or not root or root["trashed"]:
                      raise ApiError(404, "Tautan tidak valid atau sudah dihentikan")
                  if s["expires"] and s["expires"] < time.time():
                      raise ApiError(410, "Tautan ini sudah kedaluwarsa")
                  cname = "shk_" + token[:10]
                  authed = not s["pw_hash"] or hmac.compare_digest(self.cookie(cname) or "", self.share_cookie_val(s))
                  if method == "POST":
                      n = min(int(self.headers.get("Content-Length") or 0), 10_000)
                      form = parse_qs(self.rfile.read(n).decode("utf-8", "ignore"))
                      key = self.client_address[0] + token
                      if too_many_fails(key):
                          raise ApiError(429, "Terlalu banyak percobaan, coba lagi nanti")
                      pw = (form.get("pw") or [""])[0]
                      if s["pw_hash"] and hmac.compare_digest(hash_pw(pw, s["salt"]), s["pw_hash"]):
                          flags = "HttpOnly; SameSite=Lax; Path=/s/; Max-Age=86400" + ("; Secure" if COOKIE_SECURE else "")
                          return self._headers(303, "text/plain", 0, {"Location": "/s/" + token, "Set-Cookie": f"{cname}={self.share_cookie_val(s)}; {flags}"})
                      FAILS.setdefault(key, []).append(time.time())
                      return self.send_html(share_page("Dilindungi", self.pw_form("Password salah"), 401))
                  if not authed:
                      return self.send_html(share_page("Dilindungi", self.pw_form("")))
                  owner = root["user_id"]
                  if len(parts) >= 3 and parts[1] == "file":
                      it = c.execute("SELECT * FROM items WHERE id=? AND user_id=? AND trashed=0 AND is_folder=0", (parts[2], owner)).fetchone()
                      if not it or not in_tree(c, root["id"], it["id"]):
                          raise ApiError(404, "File tidak ditemukan")
                      return self.send_blob(it, inline=q.get("dl", [""])[0] != "1")
                  if len(parts) >= 2 and parts[1] == "zip":
                      cur = q.get("f", [""])[0] or root["id"]
                      if not in_tree(c, root["id"], cur):
                          raise ApiError(404, "Folder tidak ditemukan")
                      r = c.execute("SELECT * FROM items WHERE id=? AND is_folder=1 AND trashed=0", (cur,)).fetchone()
                      if not r:
                          raise ApiError(404, "Folder tidak ditemukan")
                      return self.build_zip(c, owner, [r], r["name"])
                  c.execute("UPDATE shares SET views=COALESCE(views,0)+1 WHERE token=?", (token,))
                  c.commit()
                  base = "/s/" + token
                  if not root["is_folder"]:
                      return self.send_html(share_page(root["name"], self.file_card(base, root)))
                  cur_id = q.get("f", [""])[0] or root["id"]
                  cur = c.execute("SELECT * FROM items WHERE id=? AND user_id=? AND is_folder=1 AND trashed=0", (cur_id, owner)).fetchone()
                  if not cur or not in_tree(c, root["id"], cur["id"]):
                      raise ApiError(404, "Folder tidak ditemukan")
                  trail, node = [], cur
                  while node:
                      trail.insert(0, node)
                      node = None if node["id"] == root["id"] else c.execute("SELECT * FROM items WHERE id=?", (node["parent_id"],)).fetchone()
                  crumb = " › ".join(f"<a href='{base}?f={t['id']}'>{h(t['name'])}</a>" for t in trail)
                  kids = c.execute("SELECT * FROM items WHERE parent_id=? AND user_id=? AND trashed=0 ORDER BY is_folder DESC, name COLLATE NOCASE",
                                   (cur["id"], owner)).fetchall()
                  rows = []
                  for k in kids:
                      if k["is_folder"]:
                          rows.append(f"<div class=row><div class=ic>📁</div><a class=n href='{base}?f={k['id']}'>{h(k['name'])}</a></div>")
                      else:
                          ic = (f"<img loading=lazy src='{base}/file/{k['id']}'>" if (k["mime"] or "").startswith("image/") and INLINE_OK.match(k["mime"]) else "📄")
                          rows.append(f"<div class=row><div class=ic>{ic}</div><a class=n href='{base}/file/{k['id']}' target=_blank>{h(k['name'])}</a>"
                                      f"<span class=muted>{fmt_size(k['size'])}</span><a class='btn ghost' href='{base}/file/{k['id']}?dl=1'>Unduh</a></div>")
                  body = (f"<div class=card><h1>📁 {h(cur['name'])}</h1><div class=crumb>{crumb}</div>"
                          f"{''.join(rows) or '<p class=muted>Folder kosong</p>'}"
                          f"<p><a class=btn href='{base}/zip?f={cur['id']}'>Unduh semua (ZIP)</a></p></div>")
                  self.send_html(share_page(cur["name"], body))

          def pw_form(self, err):
              return ("<div class=card style='max-width:420px;margin:40px auto'><h1>🔒 Tautan dilindungi</h1>"
                      "<p class=muted>Masukkan password untuk membuka file ini.</p><form method=post>"
                      "<input type=password name=pw placeholder=Password autofocus required>"
                      f"<div class=err>{h(err)}</div><button class=btn>Buka</button></form></div>")

          def file_card(self, base, it):
              mime = it["mime"] or ""
              u = f"{base}/file/{it['id']}"
              if re.match(r"image/(png|jpeg|gif|webp|avif|bmp)", mime):
                  stage = f"<img src='{u}' alt=''>"
              elif mime.startswith("video/"):
                  stage = f"<video src='{u}' controls preload=metadata></video>"
              elif mime.startswith("audio/"):
                  stage = f"<audio src='{u}' controls style='width:90%;margin:30px'></audio>"
              elif mime == "application/pdf":
                  stage = f"<iframe src='{u}'></iframe>"
              else:
                  stage = "<div class=big>📄</div>"
              return (f"<div class=card><h1>{h(it['name'])}</h1><div class=muted>{fmt_size(it['size'])}</div>"
                      f"<div class=stage>{stage}</div><a class=btn href='{u}?dl=1'>⬇ Unduh</a></div>")

          # ---- fitur tambahan
          def api_health(self, method, name, q):
              self.send_json({"ok": True})

          def api_color(self, method, name, q):
              u = self.need_user()
              d = self.read_json()
              col = d.get("color")
              if col and not re.fullmatch(r"#[0-9a-fA-F]{6}", col):
                  raise ApiError(400, "Warna tidak valid")
              with db() as c:
                  for iid in d.get("ids") or []:
                      if self.own_item(c, u["id"], iid)["is_folder"]:
                          c.execute("UPDATE items SET color=? WHERE id=?", (col or None, iid))
              self.send_json({"ok": True})

          def api_activity(self, method, name, q):
              u = self.need_user()
              with db() as c:
                  rows = c.execute("SELECT action,detail,ts FROM activity WHERE user_id=? ORDER BY ts DESC, id DESC LIMIT 150", (u["id"],)).fetchall()
              self.send_json({"items": [dict(r) for r in rows]})

          def api_duplicates(self, method, name, q):
              u = self.need_user()
              with db() as c:
                  rows = c.execute(
                      "SELECT id,name,size,parent_id,modified FROM items WHERE user_id=? AND trashed=0 AND is_folder=0 AND size>0 AND size IN "
                      "(SELECT size FROM items WHERE user_id=? AND trashed=0 AND is_folder=0 AND size>0 GROUP BY size HAVING COUNT(*)>1) "
                      "ORDER BY size DESC LIMIT 1500", (u["id"], u["id"])).fetchall()
              groups = {}
              for r in rows:
                  path = BLOBS / r["id"]
                  if not path.exists():
                      continue
                  hs = hashlib.sha256()
                  with open(path, "rb") as f:
                      for chunk in iter(lambda: f.read(CHUNK), b""):
                          hs.update(chunk)
                  groups.setdefault((r["size"], hs.hexdigest()), []).append(dict(r))
              out = [{"size": k[0], "items": sorted(v, key=lambda x: x["modified"])} for k, v in groups.items() if len(v) > 1]
              out.sort(key=lambda g: g["size"] * (len(g["items"]) - 1), reverse=True)
              self.send_json({"groups": out[:200], "reclaim": sum(g["size"] * (len(g["items"]) - 1) for g in out)})

          # ---- download
          def api_download(self, method, name, q):
              u = self.need_user()
              iid = name.split("/", 1)[1] if "/" in name else ""
              with db() as c:
                  r = self.own_item(c, u["id"], iid)
              if r["is_folder"]:
                  raise ApiError(400, "Gunakan /api/zip untuk folder")
              self.send_blob(r, inline=q.get("inline", [""])[0] == "1")

          def send_blob(self, r, inline):
              path = BLOBS / r["id"]
              if not path.exists():
                  raise ApiError(404, "File hilang dari penyimpanan")
              size = path.stat().st_size
              mime = r["mime"] or "application/octet-stream"
              safe = bool(inline and INLINE_OK.match(mime))
              extra = {
                  "Accept-Ranges": "bytes",
                  "Content-Disposition": f"{'inline' if safe else 'attachment'}; filename*=UTF-8''{quote(r['name'])}",
                  "Cache-Control": "private, max-age=0, must-revalidate",
              }
              if not safe:
                  extra["Content-Security-Policy"] = "sandbox"
              start, end, status = 0, size - 1, 200
              rng = self.headers.get("Range")
              if rng:
                  m = re.fullmatch(r"bytes=(\d*)-(\d*)", rng.strip())
                  if m and (m.group(1) or m.group(2)):
                      if m.group(1):
                          start = int(m.group(1))
                          end = int(m.group(2)) if m.group(2) else size - 1
                      else:
                          start = max(0, size - int(m.group(2)))
                      end = min(end, size - 1)
                      if start > end or start >= size:
                          return self._headers(416, "text/plain", 0, {"Content-Range": f"bytes */{size}"})
                      status = 206
                      extra["Content-Range"] = f"bytes {start}-{end}/{size}"
              length = end - start + 1 if size else 0
              self._headers(status, mime if safe else "application/octet-stream", length, extra)
              if self.head_only:
                  return
              with open(path, "rb") as f:
                  f.seek(start)
                  left = length
                  while left > 0:
                      chunk = f.read(min(CHUNK, left))
                      if not chunk:
                          break
                      self.wfile.write(chunk)
                      left -= len(chunk)

          def build_zip(self, c, uid, rows, zname):
              tmp = tempfile.NamedTemporaryFile(dir=TMP, delete=False)
              tmp.close()
              try:
                  with zipfile.ZipFile(tmp.name, "w", zipfile.ZIP_DEFLATED, allowZip64=True) as z:
                      def add(r, prefix):
                          if r["is_folder"]:
                              kids = c.execute("SELECT * FROM items WHERE parent_id=? AND user_id=? AND trashed=0", (r["id"], uid)).fetchall()
                              p = f"{prefix}{r['name']}/"
                              if not kids:
                                  z.writestr(p, "")
                              for k in kids:
                                  add(k, p)
                          elif (BLOBS / r["id"]).exists():
                              z.write(BLOBS / r["id"], f"{prefix}{r['name']}")
                      for r in rows:
                          add(r, "")
                  size = os.path.getsize(tmp.name)
                  self._headers(200, "application/zip", size, {"Content-Disposition": f"attachment; filename*=UTF-8''{quote(zname)}.zip"})
                  if not self.head_only:
                      with open(tmp.name, "rb") as f:
                          shutil.copyfileobj(f, self.wfile, CHUNK)
              finally:
                  os.unlink(tmp.name)

          def api_zip(self, method, name, q):
              """/api/zip/<id> untuk satu item, atau /api/zip?ids=a,b,c untuk banyak item."""
              u = self.need_user()
              ids = [i for i in q.get("ids", [""])[0].split(",") if i]
              if not ids and "/" in name:
                  ids = [name.split("/", 1)[1]]
              if not ids:
                  raise ApiError(400, "Tidak ada item")
              with db() as c:
                  rows = [self.own_item(c, u["id"], i) for i in ids]
                  zname = rows[0]["name"] if len(rows) == 1 else "HomeDrive"
                  self.build_zip(c, u["id"], rows, zname)


      def janitor():
          """Bersihkan sampah yang lebih tua dari TRASH_DAYS dan sesi kedaluwarsa."""
          while True:
              try:
                  with db() as c:
                      c.execute("DELETE FROM sessions WHERE expires<?", (time.time(),))
                      if TRASH_DAYS > 0:
                          cut = time.time() - TRASH_DAYS * 86400
                          ids = [r["id"] for r in c.execute(
                              "SELECT id FROM items WHERE trashed=1 AND trashed_at IS NOT NULL AND trashed_at<? AND "
                              "(parent_id IS NULL OR parent_id NOT IN (SELECT id FROM items WHERE trashed=1))", (cut,)).fetchall()]
                          if ids:
                              Handler.purge(None, c, ids)
              except Exception as e:  # noqa
                  sys.stderr.write("janitor: %r\n" % (e,))
              time.sleep(3600)


      def main():
          init_db()
          threading.Thread(target=janitor, daemon=True).start()
          for p in TMP.glob("*"):
              p.unlink(missing_ok=True)
          srv = ThreadingHTTPServer((HOST, PORT), Handler)
          srv.daemon_threads = True
          print(f"HomeDrive berjalan di http://{HOST}:{PORT}  (data: {DATA})")
          try:
              srv.serve_forever()
          except KeyboardInterrupt:
              pass


      if __name__ == "__main__":
          main()
