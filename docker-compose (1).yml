          <div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);display:flex;justify-content:space-between"><span>$${st.folders} folder</span><span>Di sampah: $${fmtSize(st.trash)}</span></div><div class="actions"><button class="btn" id="sX">Tutup</button></div>`);
