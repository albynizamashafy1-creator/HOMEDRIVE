        b.innerHTML = `<div style="color:var(--text)"><b>$${j.groups.length}</b> grup duplikat · bisa menghemat <b>$${fmtSize(j.reclaim)}</b>. File tertua di tiap grup dipertahankan.</div>` +
          j.groups.map(g => `<div class="dgrp">$${g.items.map((i,k) => `<div class="r"><span title="$${esc(i.name)}">$${esc(i.name)}</span><small>$${fmtSize(i.size)} · $${fmtDate(i.modified)}</small>$${k===0?'<em class="pill">dipertahankan</em>':''}</div>`).join('')}</div>`).join('');
        const go2 = m.querySelector('#dGo'); go2.classList.remove('hidden');
        go2.onclick = async () => { try { await api('trash',{ids:extra}); m.remove(); toast(extra.length+' salinan dipindahkan ke sampah',{label:'Urungkan',fn:()=>act.restore(extra,true)}); load(); } catch(e) { toast(e.message); } };
      }
      function helpDialog() {
        const k = [[['/','Ctrl K'],'Cari'],[['N'],'Folder baru'],[['U'],'Unggah file'],[['G'],'Ganti tampilan kotak / daftar'],[['S'],'Beri bintang item terpilih'],[['F2'],'Ubah nama'],[['Enter'],'Buka item'],[['Del'],'Pindahkan ke sampah'],[['Ctrl A'],'Pilih semua'],[['Esc'],'Batal / tutup'],[['←','→'],'Pratinjau: sebelumnya / berikutnya'],[['?'],'Tampilkan bantuan ini']];
        const m = modal(`<h2>Pintasan keyboard</h2><div class="keys">$${k.map(x => `<span>$${x[0].map(t => `<kbd>$${esc(t)}</kbd>`).join(' ')}</span><span>$${x[1]}</span>`).join('')}</div><div class="actions"><button class="btn" id="hX">Tutup</button></div>`);
        m.querySelector('#hX').onclick = () => m.remove();
      }

      /* ---------- pratinjau (lightbox) ---------- */
      let PV = null;
      function preview(it, opt={}) {
        const list = S.items.filter(i=>!i.is_folder && kind(i)); let idx = list.findIndex(i=>i.id===it.id); if (idx<0) { list.push(it); idx = list.length-1; }
        const pv = document.createElement('div'); pv.id='preview';
        pv.innerHTML = `<div class="pvtop"><button class="pvb" id="pvX" title="Tutup (Esc)">$${ic('x',22)}</button><div class="pvt"><b id="pvName"></b><small id="pvCount"></small></div>
          <button class="pvb" id="pvStar" title="Bintang"></button><button class="pvb" id="pvInfo" title="Detail">$${ic('info',20)}</button><button class="pvb" id="pvShare" title="Bagikan">$${ic('link',20)}</button><a class="pvb" id="pvDl" title="Unduh">$${ic('download',20)}</a><button class="pvb" id="pvTrash" title="Sampah">$${ic('trash',20)}</button></div>
          <div class="pvstage"><button class="pvnav l" id="pvL">$${ic('chevron',24)}</button><div id="pvBody"></div><button class="pvnav r" id="pvR">$${ic('chevron',24)}</button></div>`;
        document.body.append(pv);
        const cur = () => list[idx];
        const close = () => { pv.remove(); PV = null; };
        const show = async (edit) => {
          const f = cur(), u = dl(f.id,true), k = kind(f), b = pv.querySelector('#pvBody'); b.classList.remove('zoom');
          pv.querySelector('#pvName').textContent = f.name; pv.querySelector('#pvCount').textContent = list.length>1 ? `$${idx+1} / $${list.length}` : fmtSize(f.size);
          pv.querySelector('#pvDl').href = dl(f.id); pv.querySelector('#pvStar').innerHTML = ic('star',20,f.starred?'fill':'');
          pv.querySelector('#pvStar').style.color = f.starred ? '#f5a524' : '';
          pv.querySelector('#pvL').classList.toggle('hidden', list.length<2); pv.querySelector('#pvR').classList.toggle('hidden', list.length<2);
          if (k==='image') { b.innerHTML = `<img src="$${u}" alt="">`; b.querySelector('img').onclick = () => b.classList.toggle('zoom'); }
          else if (k==='video') b.innerHTML = `<video src="$${u}" controls autoplay playsinline></video>`;
          else if (k==='audio') b.innerHTML = `<div class="nopv"><div class="eic">$${ic('music',44)}</div><div style="margin-bottom:16px">$${esc(f.name)}</div><audio src="$${u}" controls autoplay></audio></div>`;
          else if (k==='pdf') b.innerHTML = `<iframe src="$${u}"></iframe>`;
          else if (k==='text') {
            b.innerHTML = '<div class="nopv">Memuat…</div>';
            try {
              if (f.size > 1e6) throw 0;
              const text = await fetch(u,{credentials:'same-origin'}).then(r=>r.text()); if (cur()!==f) return;
              const draw = editing => {
                b.innerHTML = `<div class="txt"><div class="bar">$${editing?`<button class="btn sm" id="txC">Batal</button><button class="btn pri sm" id="txS">$${ic('check',16)}Simpan</button>`:`<button class="btn sm" id="txE" style="background:transparent;color:#fff;border-color:rgba(255,255,255,.3)">$${ic('edit',16)}Edit</button>`}</div>$${editing?'<textarea id="txA" spellcheck="false"></textarea>':'<pre id="txP"></pre>'}</div>`;
                if (editing) { const a=b.querySelector('#txA'); a.value=text; a.focus(); b.querySelector('#txC').onclick=()=>draw(false);
                  b.querySelector('#txS').onclick = async () => { try { await api('savetext',{id:f.id,content:b.querySelector('#txA').value}); toast('Tersimpan'); load(true); close(); } catch(e){toast(e.message);} }; }
                else { b.querySelector('#txP').textContent = text; b.querySelector('#txE').onclick=()=>draw(true); }
              };
              draw(!!edit);
            } catch(e) { b.innerHTML = `<div class="nopv"><div class="eic">$${ic('fileText',44)}</div>Pratinjau tidak tersedia untuk file ini.</div>`; }
          }
        };
        const step = d => { if (list.length<2) return; idx=(idx+d+list.length)%list.length; show(); };
        PV = { step, close };
        pv.querySelector('#pvX').onclick = close; pv.querySelector('#pvL').onclick=()=>step(-1); pv.querySelector('#pvR').onclick=()=>step(1);
        pv.querySelector('#pvStar').onclick = async () => { const f=cur(); f.starred=!f.starred; await api('star',{ids:[f.id],value:f.starred}); show(); load(true); };
        pv.querySelector('#pvInfo').onclick = () => detailDialog(cur());
        pv.querySelector('#pvShare').onclick = () => shareDialog(cur());
        pv.querySelector('#pvTrash').onclick = async () => { const f=cur(); await act.trash([f.id]); list.splice(idx,1); if (!list.length) return close(); idx=Math.min(idx,list.length-1); show(); };
        pv.querySelector('.pvstage').addEventListener('click', e => { if (e.target.classList.contains('pvstage')) close(); });
        show(opt.edit);
      }

      /* ---------- unggah ---------- */
      const U = { queue:[], jobs:[], running:0 };
      let uid = 0, uploadsDone = false;
      function ensureFolder(parent, name, cache) { const k=(parent||'')+'/'+name; return cache[k] ? Promise.resolve(cache[k]) : api('folder',{parent,name,reuse:true}).then(j=>cache[k]=j.id); }
      async function uploadPaths(entries, forceParent) {
        const cache = {}; let base = forceParent!==undefined ? (forceParent||null) : S.parent;
        if (forceParent===undefined && ['photos','videos','audio','documents'].includes(S.view)) {
          try { base = await ensureFolder(null, {photos:'Foto',videos:'Video',audio:'Audio',documents:'Dokumen'}[S.view], cache); } catch(e) { return toast(e.message); }
        } else if (forceParent===undefined && S.view!=='files') return toast('Buka Drive Saya, Foto, Video, atau Dokumen untuk mengunggah');
        for (const {file, path} of entries) {
          const parts = path.split('/'); parts.pop(); let p = base;
          try { for (const seg of parts) p = await ensureFolder(p, seg, cache); } catch(e) { return toast(e.message); }
          const job = {id:++uid, file, parent:p, name:path, loaded:0, state:'wait', xhr:null};
          U.jobs.push(job); U.queue.push(job);
        }
        uploadsDone = false; renderUploads(); pump();
      }
      function pump() {
        while (U.running < 3 && U.queue.length) {
          const job = U.queue.shift(); if (job.state!=='wait') continue;
          U.running++; job.state='up';
          const x = new XMLHttpRequest(); job.xhr = x;
          x.open('POST', '/api/upload?parent='+encodeURIComponent(job.parent||'')+'&name='+encodeURIComponent(job.file.name));
          x.setRequestHeader('X-Requested-With','drive');
          x.upload.onprogress = e => { job.loaded = e.loaded; updUploads(); };
          const fin = (st, msg) => { U.running--; job.state=st; job.msg=msg; if (st==='done') job.loaded=job.file.size; renderUploads(); pump(); checkDone(); };
          x.onload = () => { if (x.status===200) fin('done'); else { let m='Gagal'; try{m=JSON.parse(x.responseText).error}catch(e){} fin('err',m); } };
          x.onerror = () => fin('err','Koneksi gagal'); x.onabort = () => fin('cancel');
          x.send(job.file); renderUploads();
        }
      }
      function checkDone() { if (!U.running && !U.queue.length && !uploadsDone) { uploadsDone = true; load(true); } }
      function updUploads() {
        const tot = U.jobs.reduce((a,j)=>a+j.file.size,0) || 1, ld = U.jobs.reduce((a,j)=>a+(j.state==='done'?j.file.size:j.loaded),0);
        const pb = $$('#uploads .pbar b'); if (pb) pb.style.width = (ld/tot*100)+'%';
        U.jobs.forEach(j => { const r = document.querySelector(`[data-job="$${j.id}"] .pb b`); if (r) r.style.width = (j.state==='done'?100:j.file.size?j.loaded/j.file.size*100:0)+'%'; });
      }
      function renderUploads() {
        const box = $$('#uploads'); if (!U.jobs.length) return box.classList.add('hidden');
        box.classList.remove('hidden');
        const active = U.jobs.filter(j=>j.state==='wait'||j.state==='up').length, errs = U.jobs.filter(j=>j.state==='err').length, done = U.jobs.filter(j=>j.state==='done').length;
        const title = active ? `Mengunggah $${active} file…` : (errs ? `$${done} selesai, $${errs} gagal` : `$${done} file terunggah`);
        box.innerHTML = `<div class="h"><span>$${title}</span><button class="ibtn" id="upX" title="$${active?'Batalkan semua':'Tutup'}">$${ic('x',18)}</button></div><div class="pbar"><b></b></div><div id="upList">$${[...U.jobs].reverse().map(j => {
          const t = ftype({name:j.file.name,mime:j.file.type});
          const st = j.state==='done' ? `<small>$${ic('check',14)}</small>` : j.state==='err' ? `<button class="ibtn" data-retry="$${j.id}" title="Coba lagi">$${ic('retry',16)}</button>` : j.state==='cancel' ? '<small>Dibatalkan</small>' : `<button class="ibtn" data-cancel="$${j.id}" title="Batal">$${ic('x',16)}</button>`;
          return `<div class="up $${j.state}" data-job="$${j.id}"><span class="ti" style="--c:$${t.c}">$${ic(t.i,16)}</span><div class="i"><span class="nm">$${esc(j.name)}</span>$${j.msg?`<small style="color:var(--danger)">$${esc(j.msg)}</small>`:`<div class="pb"><b></b></div>`}</div>$${st}</div>`; }).join('')}</div>`;
        updUploads();
      }
      $$('#uploads').onclick = e => {
        if (e.target.closest('#upX')) { if (U.jobs.some(j=>j.state==='up'||j.state==='wait')) { U.queue.length=0; U.jobs.forEach(j=>{ if (j.state==='wait') j.state='cancel'; if (j.state==='up') j.xhr.abort(); }); renderUploads(); } else { U.jobs.length=0; renderUploads(); } return; }
        const c = e.target.closest('[data-cancel]'); if (c) { const j=U.jobs.find(x=>x.id==c.dataset.cancel); if (j.state==='up') j.xhr.abort(); else { j.state='cancel'; renderUploads(); } return; }
        const r = e.target.closest('[data-retry]'); if (r) { const j=U.jobs.find(x=>x.id==r.dataset.retry); j.state='wait'; j.loaded=0; j.msg=''; U.queue.push(j); uploadsDone=false; renderUploads(); pump(); }
      };
      const fromInput = e => { uploadPaths([...e.target.files].map(f=>({file:f,path:f.name}))); e.target.value=''; };
      for (const id of ['fileIn','photoIn','videoIn','docIn','camIn']) $$('#'+id).onchange = fromInput;
      $$('#dirIn').onchange = e => { uploadPaths([...e.target.files].map(f=>({file:f,path:f.webkitRelativePath||f.name}))); e.target.value=''; };
      window.addEventListener('beforeunload', e => { if (U.running||U.queue.length) { e.preventDefault(); e.returnValue=''; } });

      /* ---------- seret & lepas ---------- */
      let dragDepth = 0;
      const hasFiles = e => e.dataTransfer && [...e.dataTransfer.types].includes('Files');
      const hasInternal = e => e.dataTransfer && [...e.dataTransfer.types].includes('application/x-hd');
      window.addEventListener('dragenter', e => { if (hasFiles(e) && S.me) { dragDepth++; $$('#drop').classList.remove('hidden'); } });
      window.addEventListener('dragleave', e => { if (hasFiles(e) && --dragDepth<=0) { dragDepth=0; $$('#drop').classList.add('hidden'); } });
      let lastDrop = null;
      window.addEventListener('dragover', e => {
        if (!hasFiles(e) && !hasInternal(e)) return; e.preventDefault();
        const t = e.target.closest && e.target.closest('[data-drop]');
        if (lastDrop && lastDrop!==t) lastDrop.classList.remove('dropping');
        if (t && !(hasInternal(e) && S.sel.has(t.dataset.id))) { t.classList.add('dropping'); lastDrop = t; } else lastDrop = null;
      });
      window.addEventListener('dragstart', e => {
        const t = e.target.closest && e.target.closest('.item[data-id],.row[data-id]'); if (!t || S.view==='trash') return;
        if (!S.sel.has(t.dataset.id)) { S.sel.clear(); S.sel.add(t.dataset.id); renderSel(); }
        e.dataTransfer.setData('application/x-hd', JSON.stringify([...S.sel])); e.dataTransfer.effectAllowed = 'move';
      });
      window.addEventListener('drop', async e => {
        if (lastDrop) lastDrop.classList.remove('dropping');
        const tgt = e.target.closest && e.target.closest('[data-drop]'); lastDrop = null;
        if (hasInternal(e)) {
          e.preventDefault(); if (!tgt) return;
          const dest = tgt.dataset.drop, ids = JSON.parse(e.dataTransfer.getData('application/x-hd')).filter(i=>i!==dest);
          if (!ids.length) return; try { await api('move',{ids,parent:dest||null}); toast('Dipindahkan'); load(); } catch(err){ toast(err.message); } return;
        }
        if (!hasFiles(e)) return; e.preventDefault(); dragDepth=0; $$('#drop').classList.add('hidden');
        const out = [];
        const walk = async (entry, prefix) => {
          if (entry.isFile) await new Promise(r => entry.file(f => { out.push({file:f, path:prefix+entry.name}); r(); }, r));
          else if (entry.isDirectory) { const rd = entry.createReader(); let batch; do { batch = await new Promise(r => rd.readEntries(r, ()=>r([]))); for (const c of batch) await walk(c, prefix+entry.name+'/'); } while (batch.length); }
        };
        const ents = [...e.dataTransfer.items].map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
        if (ents.length) for (const en of ents) await walk(en, ''); else [...e.dataTransfer.files].forEach(f=>out.push({file:f,path:f.name}));
        uploadPaths(out, tgt && S.view==='files' ? tgt.dataset.drop : undefined);
      });

      /* ---------- pintasan keyboard ---------- */
      document.addEventListener('keydown', e => {
        const typing = /^(INPUT|TEXTAREA|SELECT)$$/.test(document.activeElement.tagName);
        if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='k' && S.me) { e.preventDefault(); $$('#q').focus(); $$('#q').select(); return; }
        if (e.key==='Escape') {
          if (menuEl) return closeMenu();
          const mb = document.querySelectorAll('.mbg'); if (mb.length) return mb[mb.length-1].remove();
          if (PV) return PV.close();
          if (typing) return document.activeElement.blur();
          if (S.sel.size) { S.sel.clear(); renderSel(); } return;
        }
        if (PV && !typing) { if (e.key==='ArrowLeft') PV.step(-1); else if (e.key==='ArrowRight') PV.step(1); return; }
        if (typing || document.querySelector('.mbg') || !S.me) return;
        if (e.key==='/') { e.preventDefault(); $$('#q').focus(); }
        else if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='a') { e.preventDefault(); S.items.forEach(i=>S.sel.add(i.id)); renderSel(); }
        else if ((e.key==='Delete'||e.key==='Backspace') && S.sel.size && S.view!=='trash') { e.preventDefault(); act.trash([...S.sel]); }
        else if (e.key==='F2' && S.sel.size===1) { e.preventDefault(); act.rename(byId([...S.sel][0])); }
        else if (e.key==='Enter' && S.sel.size===1) open(byId([...S.sel][0]));
        else if (e.key==='?') helpDialog();
        else if (e.key.toLowerCase()==='n' && S.view==='files' && !e.ctrlKey && !e.metaKey) { e.preventDefault(); act.newFolder(); }
        else if (e.key.toLowerCase()==='u' && !e.ctrlKey && !e.metaKey) $$('#fileIn').click();
        else if (e.key.toLowerCase()==='g' && !e.ctrlKey && !e.metaKey) { S.mode = S.mode==='grid' ? 'list' : 'grid'; localStorage.setItem('mode', S.mode); render(); }
        else if (e.key.toLowerCase()==='s' && S.sel.size && S.view!=='trash' && !e.ctrlKey && !e.metaKey) act.star([...S.sel]);
      });

      boot();
      </script>
      </body>
      </html>
