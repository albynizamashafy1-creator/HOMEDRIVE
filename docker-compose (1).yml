      /* ---------- aksen, warna folder, aktivitas, duplikat, bantuan ---------- */
      const ACCENTS = {indigo:['#5b5ff0','#8b5cf6','Indigo'],emerald:['#10b981','#14b8a6','Zamrud'],rose:['#f43f5e','#ec4899','Mawar'],amber:['#f59e0b','#f97316','Amber'],sky:['#0ea5e9','#6366f1','Langit'],slate:['#475569','#64748b','Abu-abu']};
      function applyAccent() {
        const a = ACCENTS[localStorage.getItem('accent')] || ACCENTS.indigo, st = document.documentElement.style;
        st.setProperty('--acc', a[0]); st.setProperty('--acc2', a[1]);
        const mt = document.querySelector('meta[name=theme-color]'); if (mt) mt.content = a[0];
      }
      function accentDialog() {
        const cur = localStorage.getItem('accent') || 'indigo';
        const m = modal(`<h2>Warna aksen</h2><div class="swatches">$${Object.entries(ACCENTS).map(([k,a]) => `<button data-k="$${k}" class="$${cur===k?'on':''}" style="background:linear-gradient(135deg,$${a[0]},$${a[1]})" title="$${a[2]}"></button>`).join('')}</div><div class="actions"><button class="btn" id="aX">Selesai</button></div>`);
        m.querySelector('.swatches').onclick = e => { const b = e.target.closest('[data-k]'); if (!b) return; localStorage.setItem('accent', b.dataset.k); applyAccent(); m.querySelectorAll('.swatches button').forEach(x => x.classList.toggle('on', x===b)); };
        m.querySelector('#aX').onclick = () => m.remove();
      }
      function colorDialog(ids) {
        if (!ids.length) return;
        const cur = byId(ids[0])?.color;
        const m = modal(`<h2>Warna folder</h2><div class="swatches">$${FOLDER_COLORS.map(c => `<button data-c="$${c}" style="--c:$${c}" class="$${cur===c?'on':''}" title="$${c}"></button>`).join('')}</div><div class="actions"><button class="btn" id="cD">Warna bawaan</button><button class="btn" id="cX">Tutup</button></div>`);
        const set = async c => { try { await api('color',{ids,color:c}); m.remove(); load(true); } catch(e) { toast(e.message); } };
        m.querySelector('.swatches').onclick = e => { const b = e.target.closest('[data-c]'); if (b) set(b.dataset.c); };
        m.querySelector('#cD').onclick = () => set(null); m.querySelector('#cX').onclick = () => m.remove();
      }
      const ACT = {upload:['upload','Mengunggah'],folder:['folderPlus','Membuat folder'],edit:['edit','Mengedit file'],rename:['edit','Mengubah nama'],move:['move','Memindahkan'],copy:['copy','Menyalin'],trash:['trash','Ke sampah'],restore:['restore','Memulihkan'],delete:['trash','Hapus permanen'],share:['link','Membagikan'],unshare:['lock','Berhenti berbagi'],login:['key','Masuk']};
      function ago(t) {
        const s = Math.max(0, Date.now()/1000 - t);
        if (s<60) return 'baru saja'; if (s<3600) return Math.floor(s/60)+' mnt lalu'; if (s<86400) return Math.floor(s/3600)+' jam lalu'; if (s<604800) return Math.floor(s/86400)+' hari lalu';
        return fmtDate(t);
      }
      async function activityDialog() {
        let j; try { j = await api('activity'); } catch(e) { return toast(e.message); }
        const rows = j.items.map(a => { const x = ACT[a.action] || ['info',a.action]; return `<div class="a"><span class="ai">$${ic(x[0],18)}</span><div class="at"><b>$${x[1]}</b><span>$${esc(a.detail||'')}</span></div><span class="ts" title="$${esc(fmtDT(a.ts))}">$${ago(a.ts)}</span></div>`; }).join('');
        const m = modal(`<h2>Aktivitas terbaru</h2><div class="acl">$${rows || '<div style="padding:30px;text-align:center;color:var(--muted)">Belum ada aktivitas.</div>'}</div><div class="actions"><button class="btn" id="xX">Tutup</button></div>`, 'wide');
        m.querySelector('#xX').onclick = () => m.remove();
      }
      async function dupDialog() {
        const m = modal(`<h2>Pembersih duplikat</h2><div id="dB" style="color:var(--muted)">Memindai file, mohon tunggu…</div><div class="actions"><button class="btn" id="dX">Tutup</button><button class="btn pri hidden" id="dGo">$${ic('trash',18)}Sampahkan salinan</button></div>`, 'big');
