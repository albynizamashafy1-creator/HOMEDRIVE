      GROUP_ID = {"person": "Orang", "vehicle": "Kendaraan", "animal": "Hewan"}
      GROUP_ORDER = ("person", "vehicle", "animal")
      MW, MH = 64, 36


      def manual_left(cid):
          return max(0, int(MANUAL.get(cid, 0) - time.time()))


      # ---------------------------------------------------------------- zona & jadwal
      def zone_pixels(zone):
          if not zone or len(zone) != 144 or "1" not in zone:
              return None
          idx = []
          for cy in range(9):
              for cx in range(16):
                  if zone[cy * 16 + cx] == "1":
                      for y in range(cy * 4, cy * 4 + 4):
                          idx.extend(range(y * MW + cx * 4, y * MW + cx * 4 + 4))
          return idx


      def _hm(s):
          h, m = str(s).split(":")
          return int(h) * 60 + int(m)


      def sched_ok(raw, now=None):
          if not raw:
              return True
          try:
              s = json.loads(raw)
              loc = datetime.datetime.fromtimestamp((now or time.time()) + int(s.get("tz", 0)) * 60, datetime.timezone.utc)
              if loc.weekday() not in s.get("days", []):
                  return False
              t, f, e = loc.hour * 60 + loc.minute, _hm(s.get("from", "00:00")), _hm(s.get("to", "23:59"))
          except (ValueError, TypeError, AttributeError, OverflowError, OSError):
              return True
          return f <= t < e if f <= e else (t >= f or t < e)


      def sched_clean(raw):
          if not raw:
              return ""
          s = raw
          if isinstance(raw, str):
              try:
                  s = json.loads(raw)
              except ValueError:
                  raise ApiError(400, "Jadwal gerakan tidak valid")
          if not isinstance(s, dict):
              raise ApiError(400, "Jadwal gerakan tidak valid")
          days = sorted({int(x) for x in s.get("days", []) if str(x).isdigit() and 0 <= int(x) <= 6})
          if not days:
              raise ApiError(400, "Pilih minimal satu hari untuk jadwal gerakan")
          for k in ("from", "to"):
              if not re.fullmatch(r"([01]\d|2[0-3]):[0-5]\d", str(s.get(k, ""))):
                  raise ApiError(400, "Jam jadwal tidak valid (HH:MM)")
          tz = _int(s.get("tz"), 0, -840, 840)
          return json.dumps({"days": days, "from": s["from"], "to": s["to"], "tz": tz})


      def _pump_motion(p, st, cam):
          """Baca frame abu-abu 64x36 dari ffmpeg, hitung piksel berubah di dalam zona; picu kejadian bila cukup banyak."""
          FS = MW * MH
          sens = max(1, min(100, int(cam.get("sens") or 50)))
          pt = 14 + int((100 - sens) * 0.3)
          need = 0.004 + 0.06 * ((1 - sens / 100.0) ** 2)
          idx = zone_pixels(cam.get("motion_zone")) or list(range(FS))
          prev, hits, warned = None, 0, False
          try:
              while True:
                  buf = b""
                  while len(buf) < FS:
                      d = p.stdout.read(FS - len(buf))
                      if not d:
                          return
                      buf += d
                  try:
                      now = time.time()
                      if prev is not None and now - st.started > 8:
                          ch = sum(1 for i in idx if abs(buf[i] - prev[i]) > pt)
                          ratio = ch / len(idx)
                          if ratio > 0.6:  # perubahan cahaya mendadak (mis. mode IR), abaikan
                              hits = 0
                          elif ratio >= need:
                              hits += 1
                          else:
                              hits = 0
                          if hits >= 2 and now - st.last_event > 45 and sched_ok(cam.get("motion_sched"), now):
                              st.last_event, hits = now, 0
                              try:
                                  cctv_event(cam, ratio)
                              except Exception as e:  # noqa
                                  sys.stderr.write("cctv event: %r\n" % (e,))
                  except Exception as e:  # noqa  satu frame bermasalah tidak boleh menghentikan pembaca
                      hits = 0
                      if not warned:
                          warned = True
                          sys.stderr.write("cctv motion: %r\n" % (e,))
                  prev = buf
          except Exception:
              pass
          finally:
              # pipa HARUS terus dikuras sampai ffmpeg berhenti; kalau tidak, ffmpeg macet menulis ke pipa dan seluruh siaran ikut beku
              try:
                  while p.stdout.read(65536):
                      pass
              except Exception:
                  pass


      # ---------------------------------------------------------------- AI
      def ai_request(path, data=None, timeout=25):
          if not AI_URL:
              return None
          req = urllib.request.Request(AI_URL + path, data=data, headers={"Content-Type": "image/jpeg"} if data is not None else {})
          try:
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  AI["why"] = ""
                  return json.loads(r.read(30_000_000))
          except Exception as e:
              reason = getattr(e, "reason", e)
              txt = str(reason).lower()
              if isinstance(e, urllib.error.HTTPError):
                  AI["why"] = "Layanan AI membalas error HTTP %d. Lihat log: docker logs homedrive-cctv-ai" % e.code
              elif isinstance(reason, TimeoutError) or "timed out" in txt:
                  AI["why"] = "Layanan AI terlalu lama menjawab (CPU lambat atau model sedang dimuat/diunduh). Tunggu beberapa menit lalu coba lagi."
              elif "name or service not known" in txt or "nodename" in txt or "temporary failure in name" in txt or "getaddrinfo" in txt:
                  AI["why"] = "Kontainer cctv-ai tidak ditemukan. Pastikan service cctv-ai ada di compose dan AI_URL=http://cctv-ai:5000, lalu jalankan: docker compose up -d"
              elif "refused" in txt or "reset" in txt or "unreachable" in txt:
                  AI["why"] = "Kontainer cctv-ai belum siap (sedang memasang paket ±150 MB pada start pertama, atau berhenti karena gagal). Cek: docker logs homedrive-cctv-ai"
              else:
                  AI["why"] = "Tidak bisa menghubungi layanan AI: %s" % str(reason)[:100]
              return None


      def ai_status(force=False):
          now = time.time()
          if AI["st"] is not None and not force and now - AI["t"] < 8:
              return AI["st"]
          if not AI_URL:
              st = {"ok": False, "off": True, "error": "Layanan AI belum dipasang. Tambahkan service cctv-ai di docker-compose."}
          else:
              j = ai_request("/health", None, 3)
              st = j if j and j.get("ok") else {"ok": False, "error": AI.get("why") or "Layanan AI tidak menjawab (masih dimuat atau tidak berjalan)."}
          AI.update(t=now, st=st)
          return st


      def ai_detect(jpg, conf, age=False):
          return ai_request("/detect?conf=%.2f&annotate=1%s" % (conf, "&age=1" if age else ""), jpg, 60)


      def det_label(d):
          """Teks ringkas satu deteksi, mis. 'Orang dewasa ±25-32 (91%)'."""
          base = GROUP_ID.get(d.get("group"), d.get("label", "?"))
          ag = d.get("age")
          if ag and ag.get("face"):
              base += " %s ±%s" % (ag.get("group", ""), ag.get("range", ""))
          elif d.get("group") == "person" and ag is not None:
              base += " (usia tidak terlihat)"
          return "%s %d%%" % (base, int(d.get("conf", 0) * 100))


      def box_in_zone(box, zone):
          if not zone or len(zone) != 144 or "1" not in zone:
              return True
          cx = min(15, max(0, int((box[0] + box[2]) / 2 * 16)))
          cy = min(8, max(0, int((box[1] + box[3]) / 2 * 9)))
          return zone[cy * 16 + cx] == "1"


      def ai_filter(cam, res):
          classes = set((cam.get("ai_classes") or "person").split(","))
          zone = cam.get("motion_zone")
          rel = [d for d in res.get("detections", []) if d.get("group") in classes and box_in_zone(d["box"], zone)]
          rel.sort(key=lambda d: (GROUP_ORDER.index(d["group"]) if d["group"] in GROUP_ORDER else 9, -d["conf"]))
          return rel


      def _ai_event(cam, score):
          time.sleep(1.0)
          jpg = cam_snapshot(cam, late=True)
          st = CAMS.get(cam["id"])
          if not jpg:
              return make_event(cam, "motion", score)
          res = ai_detect(jpg, int(cam.get("ai_conf") or 50) / 100.0, bool(cam.get("ai_age")))
          if res is None:
              return make_event(cam, "motion", score, {"ai": "off"}, jpg)
          rel = ai_filter(cam, res)
          if not rel:
              AI_STATS["filtered"] += 1
              if st:
                  st.last_event = time.time() - 30  # coba lagi 15 dtk kemudian
              return
          AI_STATS["events"] += 1
          img = base64.b64decode(res["image"]) if res.get("image") else jpg
          make_event(cam, rel[0]["group"], rel[0]["conf"], [{"group": d["group"], "label": d["label"], "conf": d["conf"], **({"age": d["age"]} if d.get("age") is not None else {})} for d in rel], img)


      # ---------------------------------------------------------------- Telegram
      def tg_call(method, fields, photo=None):
          token = CCTV.get("tg_token")
          if not token:
              raise ValueError("Token bot belum diisi")
          b = "----hd" + secrets.token_hex(8)
          body = b""
          for k, v in fields.items():
              body += ('--%s\r\nContent-Disposition: form-data; name="%s"\r\n\r\n%s\r\n' % (b, k, v)).encode()
          if photo:
              body += ('--%s\r\nContent-Disposition: form-data; name="photo"; filename="kejadian.jpg"\r\nContent-Type: image/jpeg\r\n\r\n' % b).encode() + photo + b"\r\n"
          body += ("--%s--\r\n" % b).encode()
          req = urllib.request.Request("%s/bot%s/%s" % (TG_API, token, method), data=body, headers={"Content-Type": "multipart/form-data; boundary=" + b})
          try:
              with urllib.request.urlopen(req, timeout=25) as r:
                  res = json.loads(r.read(200000))
          except urllib.error.HTTPError as e:
              try:
                  res = json.loads(e.read(20000))
              except ValueError:
                  raise ValueError("Telegram menolak permintaan (HTTP %d)" % e.code)
          except (urllib.error.URLError, OSError):
              raise ValueError("Tidak bisa menghubungi Telegram (periksa internet server)")
          if not res.get("ok"):
              raise ValueError(str(res.get("description") or "Telegram menolak permintaan")[:150])
          return res


      def tg_notify(name, kind, info, ts, jpg):
          if not (CCTV.get("tg_on") and CCTV.get("tg_token") and CCTV.get("tg_chat")):
              return
          when = datetime.datetime.fromtimestamp(ts + int(CCTV.get("tz", 0)) * 60, datetime.timezone.utc).strftime("%H:%M:%S %d/%m/%Y")
          extra = ""
          if isinstance(info, list) and info:
              extra = "\n" + ", ".join(det_label(d) for d in info[:6])
          cap = "\U0001F4F7 %s\n%s • %s%s" % (name, KIND_LABEL.get(kind, KIND_LABEL["motion"]), when, extra)
          try:
              if jpg:
                  tg_call("sendPhoto", {"chat_id": CCTV["tg_chat"], "caption": cap}, jpg)
              else:
                  tg_call("sendMessage", {"chat_id": CCTV["tg_chat"], "text": cap})
              CCTV["tg_err"] = ""
          except ValueError as e:
              CCTV["tg_err"] = str(e)


      # ---------------------------------------------------------------- kejadian
      def make_event(cam, kind, score, info=None, jpg=None):
          cam = dict(cam)
          ts = time.time()
          body = cam["name"]
          if isinstance(info, list) and info:
              body += " · " + ", ".join(det_label(d) for d in info[:4])
          with db() as c:
              eid = c.execute("INSERT INTO cctv_events(cam_id,kind,score,ts,info) VALUES(?,?,?,?,?)",
                              (cam["id"], kind, score, ts, json.dumps(info) if info else None)).lastrowid
              for uid in cctv_notify_targets(c, cam["id"]):
                  notify(c, uid, "cctv", KIND_LABEL.get(kind, KIND_LABEL["motion"]), body, eid)
          EVENTS.emit("cctv")
          EVENTS.flush()
          threading.Thread(target=_event_finish, args=(cam, eid, kind, info, ts, jpg), daemon=True).start()


      def _event_finish(cam, eid, kind, info, ts, jpg):
          if jpg is None:
              time.sleep(1.5)
              jpg = cam_snapshot(cam, late=True)
          if jpg:
              (CCTV_EVT / ("%d.jpg" % eid)).write_bytes(jpg)
              with db() as c:
                  c.execute("UPDATE cctv_events SET snap=1 WHERE id=?", (eid,))
              EVENTS.emit("cctv")
              EVENTS.flush()
          tg_notify(cam["name"], kind, info, ts, jpg)


      def cctv_event(cam, score):
          with db() as c:
              r = c.execute("SELECT * FROM cameras WHERE id=?", (cam["id"],)).fetchone()
          if not r:
              return
          cam = dict(r)
          if cam.get("ai") and AI_URL:
              threading.Thread(target=_ai_event, args=(cam, score), daemon=True).start()
          else:
              make_event(cam, "motion", score)


      # ---------------------------------------------------------------- klip rekaman & timelapse
      def _concat_quote(p):
          return str(p).replace("'", "'\\''")


      def run_ffmpeg_file(cmd, out, timeout):
          try:
              r = subprocess.run(cmd, stdout=subprocess.DEVNULL, stderr=subprocess.PIPE, timeout=timeout)
          except subprocess.TimeoutExpired:
              raise ApiError(504, "Pembuatan video terlalu lama, coba rentang yang lebih pendek")
          if r.returncode != 0 or not os.path.exists(out) or os.path.getsize(out) < 1000:
              sys.stderr.write("ffmpeg: %s\n" % r.stderr.decode("utf-8", "ignore")[-300:])
              raise ApiError(500, "Gagal membuat video")


      def build_clip(cid, f, t):
          if t - f < 2 or t - f > 7200:
              raise ApiError(400, "Panjang klip harus 2 detik sampai 2 jam")
          items = cctv_list_rec(cid, f - 1, t + 1)
          if not items:
              raise ApiError(404, "Tidak ada rekaman pada rentang waktu itu")
          tmpd = tempfile.mkdtemp(dir=TMP)
          lst, out = os.path.join(tmpd, "list.txt"), os.path.join(tmpd, "clip.mp4")
          lines = ["ffconcat version 1.0"]
          for it in items:
              lines.append("file '%s'" % _concat_quote(CCTV_REC / str(cid) / it["name"]))
              if f > it["start"]:
                  lines.append("inpoint %.3f" % (f - it["start"]))
              if t < it["end"]:
                  lines.append("outpoint %.3f" % (t - it["start"]))
          open(lst, "w").write("\n".join(lines) + "\n")
          try:
              with BUILD_SEM:
                  run_ffmpeg_file([FFMPEG, "-loglevel", "error", "-nostdin", "-f", "concat", "-safe", "0", "-i", lst, "-c", "copy",
                                   "-movflags", "+faststart", "-y", out], out, 600)
          except Exception:
              shutil.rmtree(tmpd, ignore_errors=True)
              raise
          return out, tmpd


      def ts_parse(name):
          m = re.fullmatch(r"(\d{8}-\d{6})\.jpg", name)
          if not m:
              return None
          try:
              return time.mktime(time.strptime(m.group(1), "%Y%m%d-%H%M%S"))
          except ValueError:
              return None


      def tl_list(cid, f, t, limit=3000):
          d, out = CCTV_TL / str(cid), []
          if d.is_dir():
              for p in sorted(d.glob("*.jpg")):
                  ts = ts_parse(p.name)
                  if ts is not None and f <= ts <= t:
                      out.append({"name": p.name, "ts": ts})
          return out[-limit:]


      def build_timelapse(cid, f, t, fps):
          items = tl_list(cid, f, t, 9000)
          if len(items) < 2:
              raise ApiError(404, "Butuh minimal 2 gambar pada rentang waktu itu")
          tmpd = tempfile.mkdtemp(dir=TMP)
          lst, out = os.path.join(tmpd, "list.txt"), os.path.join(tmpd, "timelapse.mp4")
          lines = ["ffconcat version 1.0"]
          for it in items:
              lines += ["file '%s'" % _concat_quote(CCTV_TL / str(cid) / it["name"]), "duration %.5f" % (1.0 / fps)]
          lines.append("file '%s'" % _concat_quote(CCTV_TL / str(cid) / items[-1]["name"]))
          open(lst, "w").write("\n".join(lines) + "\n")
          try:
              with BUILD_SEM:
                  run_ffmpeg_file([FFMPEG, "-loglevel", "error", "-nostdin", "-f", "concat", "-safe", "0", "-i", lst,
                                   "-vf", "scale=1280:-2:flags=lanczos,format=yuv420p", "-r", str(fps), "-c:v", "libx264", "-preset", "veryfast",
                                   "-crf", "24", "-movflags", "+faststart", "-y", out], out, 900)
          except Exception:
              shutil.rmtree(tmpd, ignore_errors=True)
              raise
          return out, tmpd


      def cctv_snap_tick():
          if not FFMPEG:
              return
          now = time.time()
          with db() as c:
              cams = [dict(r) for r in c.execute("SELECT * FROM cameras WHERE enabled=1 AND snap_min>0").fetchall()]
          for cam in cams:
              cid = cam["id"]
              if cid in SNAP_BUSY or now - SNAPT.get(cid, 0) < cam["snap_min"] * 60:
                  continue
              SNAPT[cid] = now
              SNAP_BUSY.add(cid)
              threading.Thread(target=_snap_job, args=(cam,), daemon=True).start()


      def _snap_job(cam):
          try:
              jpg = cam_snapshot(cam)
              if jpg:
                  d = CCTV_TL / str(cam["id"])
                  d.mkdir(parents=True, exist_ok=True)
                  (d / (time.strftime("%Y%m%d-%H%M%S") + ".jpg")).write_bytes(jpg)
          finally:
              SNAP_BUSY.discard(cam["id"])


      def tl_prune():
          now = time.time()
          for d in CCTV_TL.iterdir():
              if not d.is_dir():
                  continue
              files = sorted(d.glob("*.jpg"))
              if CCTV["keep_days"] > 0:
                  for p in files[:]:
                      ts = ts_parse(p.name)
                      if ts is not None and now - ts > CCTV["keep_days"] * 86400:
                          p.unlink(missing_ok=True)
                          files.remove(p)
              for p in files[:-60000]:
                  p.unlink(missing_ok=True)


      def send_temp_file(self, path, tmpd, ctype, filename):
          try:
              size = os.path.getsize(path)
              self._headers(200, ctype, size, {"Content-Disposition": 'attachment; filename="%s"' % filename, "Cache-Control": "no-store"})
              if not self.head_only:
                  with open(path, "rb") as f:
                      shutil.copyfileobj(f, self.wfile, CHUNK)
          finally:
              shutil.rmtree(tmpd, ignore_errors=True)


      # ---------------------------------------------------------------- endpoint tambahan
      def _qf(q, k, default=None):
          try:
              return float((q.get(k) or [default])[0])
          except (TypeError, ValueError):
              raise ApiError(400, "Parameter tidak valid")


      def _safe_name(s):
          return re.sub(r"[^A-Za-z0-9_-]+", "_", s) or "kamera"


      def _done(x):
          return x if callable(x) else True


      def cctv_extra_get(self, c, u, p, sub, parts, q):
          owner = bool(p.get("owner"))
          if sub == "clip" and len(parts) == 3:
              r = get_cam(c, p, parts[2], "rec")
              f, t = _qf(q, "from"), _qf(q, "to")
              if f is None or t is None:
                  raise ApiError(400, "Parameter from/to wajib")

              def go():
                  path, tmpd = build_clip(r["id"], f, t)
                  send_temp_file(self, path, tmpd, "video/mp4", "%s-%s.mp4" % (_safe_name(r["name"]), time.strftime("%Y%m%d-%H%M%S", time.localtime(f))))
              return go
          if sub == "aiview" and len(parts) == 3:
              r = get_cam(c, p, parts[2], "live")
              try:
                  since = int((q.get("since") or ["0"])[0])
              except ValueError:
                  since = 0
              return _done(self.send_json(liveai_get(r["id"], since)))
          if sub == "tl" and len(parts) == 3:
              r = get_cam(c, p, parts[2], "rec")
              f, t = _qf(q, "from", 0), _qf(q, "to", time.time() + 86400)
              items = tl_list(r["id"], f, t, 600)
              return _done(self.send_json({"items": items, "total": len(tl_list(r["id"], 0, time.time() + 86400, 100000)), "snap_min": r["snap_min"]}))
          if sub == "tlimg" and len(parts) == 4:
              r = get_cam(c, p, parts[2], "rec")
              if not re.fullmatch(r"\d{8}-\d{6}\.jpg", parts[3]):
                  raise ApiError(400, "Nama file tidak valid")
              try:
                  body = (CCTV_TL / str(r["id"]) / parts[3]).read_bytes()
              except OSError:
                  raise ApiError(404, "Gambar tidak ada")
              return _done(serve_bytes_nocache(self, "image/jpeg", body, {"Cache-Control": "private, max-age=3600"}))
          if sub == "tlvideo" and len(parts) == 3:
              r = get_cam(c, p, parts[2], "rec")
              f, t = _qf(q, "from", 0), _qf(q, "to", time.time() + 86400)
              fps = int(max(2, min(60, _qf(q, "fps", 12))))

              def go():
                  path, tmpd = build_timelapse(r["id"], f, t, fps)
                  send_temp_file(self, path, tmpd, "video/mp4", "timelapse-%s.mp4" % _safe_name(r["name"]))
              return go
          if sub == "ai" and owner:
              return _done(self.send_json({"status": ai_status(True), "stats": AI_STATS}))
          if sub == "notify" and owner:
              return _done(self.send_json({"on": bool(CCTV.get("tg_on")), "has_token": bool(CCTV.get("tg_token")), "chat": CCTV.get("tg_chat", ""),
                                     "tz": CCTV.get("tz", 0), "err": CCTV.get("tg_err", "")}))
          return None


      def cctv_extra_post(self, c, u, p, sub, parts, q, d):
          owner = bool(p.get("owner"))
          if sub == "recnow":
              r = get_cam(c, p, d.get("cam"), "rec")
              if d.get("on"):
                  m = _int(d.get("minutes"), 10, 1, 120)
                  MANUAL[r["id"]] = time.time() + m * 60
                  log(c, u["id"], "cctv", "Rekam manual %d menit: %s" % (m, r["name"]))
              else:
                  MANUAL.pop(r["id"], None)
              cctv_tick_soon()
              EVENTS.emit("cctv")
              return _done(self.send_json({"ok": True, "left": manual_left(r["id"])}))
          if not owner:
              return None
          if sub == "aitest":
              r = get_cam(c, p, d.get("cam"))
              cam = dict(r)

              def go():
                  st = ai_status(True)
                  if not st.get("ok"):
                      raise ApiError(503, st.get("error") or "Layanan AI belum siap")
                  jpg = cam_snapshot(cam, late=True)
                  if not jpg:
                      raise ApiError(502, "Tidak bisa mengambil gambar dari kamera")
                  res = ai_detect(jpg, _int(d.get("conf"), cam.get("ai_conf") or 50, 20, 95) / 100.0, bool(d.get("age", cam.get("ai_age"))))
                  if res is None:
                      raise ApiError(502, "Layanan AI gagal memproses gambar")
                  rel = ai_filter(cam, res)
                  self.send_json({"ok": True, "mode": res.get("mode"), "model": res.get("model"), "found": len(res.get("detections", [])),
                                  "relevant": [{"group": x["group"], "label": x["label"], "conf": x["conf"], "age": x.get("age")} for x in rel], "age_state": res.get("age_state"), "age_ready": bool(res.get("age_ready")),
                                  "image": res.get("image") or base64.b64encode(jpg).decode()})
              return go
          if sub == "notify" and len(parts) == 2:
              tok = str(d.get("token") or "").strip()
              if tok and not re.fullmatch(r"\d{5,12}:[A-Za-z0-9_-]{20,60}", tok):
                  raise ApiError(400, "Format token bot tidak valid (contoh 123456789:AAH...)")
              chat = str(d.get("chat") or "").strip()[:64]
              if chat and not re.fullmatch(r"-?\d{3,20}|@[A-Za-z0-9_]{4,64}", chat):
                  raise ApiError(400, "Chat ID tidak valid (angka, atau @namakanal)")
              tz = _int(d.get("tz"), CCTV.get("tz", 0), -840, 840)
              if tok:
                  CCTV["tg_token"] = tok
                  set_setting(c, "cctv_tg_token", enc_secret(tok))
              if d.get("clear_token"):
                  CCTV["tg_token"] = ""
                  set_setting(c, "cctv_tg_token", "")
              CCTV["tg_chat"], CCTV["tg_on"], CCTV["tz"] = chat, bool(d.get("on")), tz
              set_setting(c, "cctv_tg_chat", chat)
              set_setting(c, "cctv_tg_on", "1" if d.get("on") else "0")
              set_setting(c, "cctv_tz", str(tz))
              log(c, u["id"], "cctv", "Mengubah pengaturan Telegram")
              return _done(self.send_json({"ok": True}))
          if sub == "notifytest":
              def go():
                  try:
                      tg_call("sendMessage", {"chat_id": CCTV.get("tg_chat", ""), "text": "✅ Tes notifikasi CCTV HomeDrive berhasil."})
                  except ValueError as e:
                      raise ApiError(400, str(e))
                  self.send_json({"ok": True})
              return go
          if sub == "tldelete":
              r = get_cam(c, p, d.get("cam"))
              shutil.rmtree(CCTV_TL / str(r["id"]), ignore_errors=True)
              return _done(self.send_json({"ok": True}))
          return None


      # ===================== Perangkat lokal server (webcam/mic/speaker), suara ke perangkat, baterai =====================
      import glob

      DEVQ = {}
      DEVQ_LOCK = threading.Lock()
      BAT_WARN = {}


      def hw_video():
          out = []
          for p in sorted(glob.glob("/dev/video*")):
              nm = ""
              try:
                  nm = open("/sys/class/video4linux/%s/name" % os.path.basename(p)).read().strip()
              except OSError:
                  pass
              out.append({"dev": p, "name": nm or os.path.basename(p)})
          return out


      def hw_audio():
          out = [{"dev": "default", "name": "Bawaan sistem (default)", "play": True, "cap": True}]
          try:
              for ln in open("/proc/asound/pcm").read().splitlines():
                  m = re.match(r"(\d+)-(\d+):\s*([^:]*):\s*([^:]*)((?::.*)?)", ln)
                  if not m:
                      continue
                  rest = m.group(5)
                  out.append({"dev": "hw:%d,%d" % (int(m.group(1)), int(m.group(2))), "name": (m.group(3).strip() or m.group(4).strip()),
                              "play": "playback" in rest, "cap": "capture" in rest})
          except OSError:
              pass
          return out


      def hw_battery():
          for d in sorted(glob.glob("/sys/class/power_supply/BAT*")):
              try:
                  lvl = int(open(d + "/capacity").read().strip())
                  stt = open(d + "/status").read().strip()
                  return {"level": lvl, "charging": stt != "Discharging", "status": stt}
              except (OSError, ValueError):
                  continue
          return None


      def spk_dev(c=None):
          try:
              if c is not None:
                  return get_setting(c, "local_spk", "default") or "default"
              with db() as cc:
                  return get_setting(cc, "local_spk", "default") or "default"
          except Exception:
              return "default"


      class SpeakerSink:
          """Memutar suara dari browser di speaker server (laptop rumah) lewat ffmpeg -> ALSA."""
          codec = "PCM"

          def __init__(self, dev):
              if not FFMPEG:
                  raise ApiError(503, "ffmpeg belum terpasang di server.")
              self.alive = True
              try:
                  self.p = subprocess.Popen([FFMPEG, "-loglevel", "error", "-fflags", "nobuffer", "-f", "s16le", "-ar", "8000", "-ac", "1", "-i", "pipe:0",
                                             "-af", "aresample=48000", "-f", os.environ.get("SPK_FMT", "alsa"), dev], stdin=subprocess.PIPE, stdout=subprocess.DEVNULL, stderr=subprocess.PIPE)
              except OSError as e:
                  raise ApiError(500, "Gagal membuka speaker server: %s" % e)
              time.sleep(0.4)
              if self.p.poll() is not None:
                  err = (self.p.stderr.read() or b"").decode("utf-8", "ignore")[-160:]
                  raise ApiError(502, "Speaker server tidak bisa dibuka (%s). Pastikan /dev/snd diteruskan ke kontainer." % (err.strip() or "perangkat tidak ada"))

          def send(self, fr):
              try:
                  self.p.stdin.write(fr)
                  self.p.stdin.flush()
              except (OSError, ValueError):
                  self.alive = False

          def keepalive(self):
              if self.p.poll() is not None:
                  self.alive = False

          def close(self):
              self.alive = False
              try:
                  self.p.stdin.close()
              except Exception:
                  pass
              try:
                  self.p.terminate()
              except Exception:
                  pass


      def devq(cid):
          with DEVQ_LOCK:
              return DEVQ.setdefault(cid, {"cv": threading.Condition(), "items": collections.deque(maxlen=600)})


      def devq_put(cid, item):
          q = devq(cid)
          with q["cv"]:
              q["items"].append(item)
              q["cv"].notify_all()


      class DeviceSink:
          """Mengirim suara ke HP/laptop yang sedang menyiarkan kamera (lewat polling dari browser perangkat itu)."""
          codec = "PCM"

          def __init__(self, cid):
              self.cid, self.alive = cid, True
              q = devq(cid)
              with q["cv"]:
                  q["items"].clear()

          def send(self, fr):
              devq_put(self.cid, {"t": "pcm", "d": base64.b64encode(fr).decode()})

          def keepalive(self):
              pass

          def close(self):
              self.alive = False


      def bat_note(cam_id, name, level, chg):
          """Peringatan baterai rendah (sekali per 30 menit) ke owner."""
          if level is None or chg or level > 15:
              return
          now = time.time()
          if now - BAT_WARN.get(cam_id, 0) < 1800:
              return
          BAT_WARN[cam_id] = now
          try:
              with db() as c:
                  for r in c.execute("SELECT id FROM users WHERE is_owner=1 AND COALESCE(disabled,0)=0").fetchall():
                      notify(c, r["id"], "cctv", "Baterai perangkat rendah", "%s: %d%% dan tidak sedang diisi" % (name, level), None)
              EVENTS.emit("cctv")
              EVENTS.flush()
              if CCTV.get("tg_on") and CCTV.get("tg_token") and CCTV.get("tg_chat"):
                  threading.Thread(target=lambda: tg_call("sendMessage", {"chat_id": CCTV["tg_chat"], "text": "\U0001F50B Baterai %s tinggal %d%% (tidak diisi)" % (name, level)}), daemon=True).start()
          except Exception as e:  # noqa
              sys.stderr.write("bat: %r\n" % (e,))


