          <dl class="kv"><dt>Jenis</dt><dd>$${t.l}$${it.mime&&!it.is_folder?' · '+esc(it.mime):''}</dd><dt>Ukuran</dt><dd id="dSz">$${it.is_folder?'Menghitung…':fmtSize(it.size)+' ('+it.size.toLocaleString('id-ID')+' byte)'}</dd><dt>Dibuat</dt><dd>$${fmtDT(it.created)}</dd><dt>Diubah</dt><dd>$${fmtDT(it.modified)}</dd><dt>Bintang</dt><dd>$${it.starred?'Ya':'Tidak'}</dd><dt>Dibagikan</dt><dd>$${it.shared?'Ya (tautan aktif)':'Tidak'}</dd></dl>
