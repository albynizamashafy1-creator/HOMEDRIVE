        const bk = s.backups.length ? s.backups.map(x => `<div class="setrow"><div class="st"><b>$${esc(x.name)}</b>$${x.name.startsWith('auto') ? '<em class="pill">otomatis</em>' : ''}<small>$${fmtSize(x.size)} · $${fmtDT(x.ts)}</small></div><a class="btn sm" href="/api/backup?file=$${encodeURIComponent(x.name)}" style="text-decoration:none">Unduh</a><button class="btn sm dng" data-adm="bk-del" data-v="$${esc(x.name)}">Hapus</button></div>`).join('') : '<div class="hint">Belum ada cadangan.</div>';
        body.innerHTML = `<div class="pgrid" style="margin-top:0"><div class="c12">$${panel('Status server', `<div class="sgrid g3" style="margin-top:0">$${cell('Versi','HomeDrive '+esc(j.version)+' · Python '+esc(j.python))}$${cell('Aktif sejak',fmtUp(j.uptime))}$${cell('Pengguna',j.users+' (sesi: '+j.sessions+')')}$${cell('Isi drive',fmtN(j.files)+' file · '+fmtN(j.folders)+' folder')}$${cell('Database',fmtSize(j.db_size))}$${cell('Data file (blobs)',fmtSize(j.blob_size))}$${j.disk.total ? cell('Disk server kosong', fmtSize(j.disk.free)+' / '+fmtSize(j.disk.total)) : ''}$${cell('Tautan berbagi',fmtN(j.shares))}$${cell('Sampah',fmtSize(j.trash))}</div>`)}</div>` +
          `<div class="c6">$${panel('Kesehatan data', row('File yatim (ada di disk, tidak ada di database)', j.orphans.count ? j.orphans.count + ' · ' + fmtSize(j.orphans.size) : 'aman', j.orphans.count, j.orphans.count ? '<button class="btn sm" data-adm="sys" data-v="cleanup">Bersihkan</button>' : '') + row('Catatan tanpa file di disk', j.missing_count || 'aman', j.missing_count, j.missing_count ? '<button class="btn sm dng" data-adm="sys" data-v="drop">Hapus catatan</button>' : '') + miss + row('Ukuran file tidak cocok dengan database', j.mismatch || 'aman', j.mismatch))}</div>` +
          `<div class="c6">$${panel('Mode pemeliharaan', `<div class="setrow" style="padding-top:0"><div class="st"><b>$${s.maintenance ? 'Aktif: penyimpanan hanya-baca' : 'Nonaktif'}</b><small>Pengguna lain tidak bisa unggah, ubah, atau hapus. Owner tetap bisa. Cocok sebelum memindahkan disk atau membuat cadangan lengkap.</small></div><label class="sw"><input type="checkbox" data-adm="maint" $${s.maintenance?'checked':''}><i></i></label></div>`)}</div>` +
          `<div class="c12">$${panel('Cadangan database', `<p class="hint" style="margin:0 0 6px">$${s.backup_hours > 0 ? 'Otomatis tiap ' + s.backup_hours + ' jam, menyimpan ' + s.backup_keep + ' terbaru (folder data/backups).' : 'Cadangan otomatis nonaktif (BACKUP_HOURS=0).'} Hanya berisi database; salin juga folder <b>data/blobs</b> untuk cadangan lengkap.</p>$${bk}`, `<button class="btn sm" data-adm="bk-now">$${ic('plus',16)}Buat sekarang</button><a class="btn sm pri" href="/api/backup" style="text-decoration:none">$${ic('download',16)}Unduh terbaru</a>`)}</div></div>`;
      }

