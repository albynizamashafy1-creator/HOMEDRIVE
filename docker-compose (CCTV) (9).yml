        const P = {dead:false, hls:null, t:null, wd:null, lt:-1, playing:false, since:Date.now(), snap:false, merr:0};
        const set = (txt, cls) => { if (st) { st.textContent = txt; st.className = 'cst ' + (cls||''); } };
        const note = t => { if (msg) { msg.textContent = t || ''; msg.classList.toggle('on', !!t); } };
        const hint = () => { const c = CCT.cam(cam.id); note(P.merr >= 2 ? 'Browser tidak bisa memutar format video kamera ini (mungkin H.265). Owner: aktifkan "Mode kompatibilitas" di pengaturan kamera.' : c && c.err ? c.err : (Date.now() - P.since > 12000 ? 'Menunggu siaran dari kamera… ini bisa memakan waktu beberapa detik.' : '')); };
        const again = ms => { clearTimeout(P.t); P.t = setTimeout(start, ms); };
        const killHls = () => { if (P.hls) { try { P.hls.destroy(); } catch(e) {} P.hls = null; } };
        function snapLoop() {
          if (P.dead) return; P.snap = true; box.classList.add('snapmode'); set('Gambar', 'wait'); note('');
          const n = new Image(); n.onload = () => { img.src = n.src; set('Gambar', 'live'); P.t = setTimeout(snapLoop, 1500); };
          n.onerror = () => { set('Offline', 'off'); hint(); P.t = setTimeout(snapLoop, 4000); };
          n.src = '/api/cctv/snap/' + cam.id + '?t=' + Date.now();
        }
        function start() {
          if (P.dead || P.snap) return; killHls(); P.playing = false; P.since = P.since || Date.now();
          set('Menyambung…', 'wait');
          const url = '/api/cctv/hls/' + cam.id + '/live.m3u8';
          if (v.canPlayType('application/vnd.apple.mpegurl')) { v.src = url; v.play().catch(() => {}); return; }
          cctLoadHls().then(H => {
            if (P.dead) return; if (!H) return snapLoop();
            const h = P.hls = new H({lowLatencyMode:false, liveSyncDuration:1.5, liveMaxLatencyDuration:4, maxLiveSyncPlaybackRate:1.25, maxBufferLength:4, maxMaxBufferLength:8, backBufferLength:4, maxBufferHole:0.4, highBufferWatchdogPeriod:1, startFragPrefetch:true, manifestLoadingTimeOut:12000, manifestLoadingMaxRetry:3, manifestLoadingRetryDelay:600, manifestLoadingMaxRetryTimeout:2000, levelLoadingMaxRetry:5, levelLoadingRetryDelay:600, levelLoadingMaxRetryTimeout:2000, fragLoadingMaxRetry:4, fragLoadingRetryDelay:400, fragLoadingMaxRetryTimeout:2000});
            h.on(H.Events.ERROR, (e, d) => { if (!d.fatal) return; if (d.type === H.ErrorTypes.MEDIA_ERROR && P.merr++ < 1) { try { h.recoverMediaError(); return; } catch(er) {} } if (d.type === H.ErrorTypes.MEDIA_ERROR) P.merr = Math.max(P.merr, 2); killHls(); set('Menyambung ulang…', 'wait'); hint(); again(P.merr >= 2 ? 4000 : 1500); });
            h.loadSource(url); h.attachMedia(v); v.play().catch(() => {});
          });
        }
        v.addEventListener('playing', () => { P.playing = true; P.merr = 0; set('LIVE', 'live'); note(''); });
        v.addEventListener('error', () => { if (!P.dead && !P.hls) { set('Menyambung ulang…', 'wait'); hint(); again(3000); } });
        // kejar tepi siaran: kalau pemutar tertinggal (jaringan lambat, tab sempat di-background), loncat/percepat ke siaran terkini
        const catchUp = () => {
          if (!P.playing || v.paused || !v.seekable || !v.seekable.length) return;
          const lag = v.seekable.end(v.seekable.length - 1) - v.currentTime;
          if (lag > 6) { try { v.currentTime = v.seekable.end(v.seekable.length - 1) - 1.5; } catch(e) {} }
          else if (!P.hls) v.playbackRate = lag > 3 ? 1.2 : 1;
        };
        P.tick = 0;
        P.wd = setInterval(() => {
          if (P.dead || P.snap) return;
          catchUp();
          if (++P.tick % 3) return;
          if (P.playing && !v.paused && v.currentTime === P.lt) { set('Menyambung ulang…', 'wait'); P.since = Date.now(); start(); }
          else if (!P.playing) hint();
          P.lt = v.currentTime;
        }, 2000);
        P.destroy = () => { P.dead = true; clearTimeout(P.t); clearInterval(P.wd); killHls(); try { v.pause(); v.removeAttribute('src'); v.load(); } catch(e) {} };
        start();
        return P;
      }

      CCT.stop = function() {
        if (CCT.talk) { try { CCT.talk.stop(); } catch(e) {} CCT.talk = null; }
        CCT.players.forEach(p => p.destroy()); CCT.players.clear();
        if (CCT.fo) { CCT.fo.remove(); CCT.fo = null; }
        clearInterval(CCT.tm); CCT.tm = null;
      };
      CCT.closeFocus = function() {
        if (CCT.talk) { try { CCT.talk.stop(); } catch(e) {} CCT.talk = null; }
        const p = CCT.players.get('focus'); if (p) { p.destroy(); CCT.players.delete('focus'); }
        const pa = CCT.players.get('aifocus'); if (pa) { pa.destroy(); CCT.players.delete('aifocus'); }
        if (CCT.fo) { CCT.fo.remove(); CCT.fo = null; }
      };
      document.addEventListener('keydown', e => { if (e.key === 'Escape' && CCT.fo && !document.querySelector('.mbg')) CCT.closeFocus(); });
      document.addEventListener('visibilitychange', () => {
        if (!S.me || S.view !== 'cctv') return;
        if (document.hidden) { CCT.stop(); CCT.paused = true; }
        else if (CCT.paused) { CCT.paused = false; CCT.start(); }
      });

      async function renderCctv(silent) {
        if (!S.me || !S.me.cctv) return go('#/files');
        document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('active', a.dataset.v === 'cctv'));
        document.querySelectorAll('#tabbar a').forEach(a => a.classList.remove('active'));
        $$('#crumbs').innerHTML = '<button>CCTV</button>';
        $$('#emptyTrash').classList.add('hidden'); $$('#sortBtn').classList.add('hidden'); $$('#seg').innerHTML = ''; $$('#chips').classList.add('hidden');
        renderStorage(); renderBanner();
        if (silent && $$('#cctBody')) return CCT.refresh();
        CCT.stop(); S.sel.clear(); renderSel();
        $$('#content').innerHTML = '<div class="adm-tabs" id="cctTabs"></div><div id="cctBody"></div>';
        await CCT.start();
      }
      CCT.start = async function() {
        const my = ++CCT.seq;
        try { await CCT.load(); } catch(e) { $$('#cctBody').innerHTML = emptyBox('alert', 'Gagal memuat CCTV', esc(e.message)); return; }
        if (my !== CCT.seq) return;
        const tabs = CCT.tabs(); if (!tabs.some(t => t[0] === CCT.tab)) CCT.tab = tabs[0][0];
        $$('#cctTabs').innerHTML = tabs.map(t => `<button class="adm-tab $${CCT.tab===t[0]?'on':''}" data-ct="$${t[0]}">$${ic(t[1],17)}<span>$${t[2]}</span></button>`).join('');
        $$('#cctTabs').onclick = e => { const b = e.target.closest('[data-ct]'); if (b) go('#/cctv/' + b.dataset.ct); };
        CCT.draw();
        clearInterval(CCT.tm); CCT.tm = setInterval(() => CCT.refresh(true), 8000);
      };
      CCT.load = async function() {
        const j = await api('cctv/cams'); CCT.cams = j.cams; CCT.perms = j.perms; CCT.ffmpeg = j.ffmpeg; CCT.ffver = j.ffver; CCT.aiSvc = !!j.ai_service;
      };
      CCT.draw = function() {
        const b = $$('#cctBody'); if (!b) return; CCT.closeFocus();
        CCT.players.forEach(p => p.destroy()); CCT.players.clear();
        ({live:CCT.drawLive, rec:CCT.drawRec, events:CCT.drawEvents, tl:CCT.drawTl, cams:CCT.drawCams, ai:CCT.drawAi, access:CCT.drawAccess, sys:CCT.drawSys})[CCT.tab](b);
      };
      CCT.refresh = async function(poll) {
        if (!$$('#cctBody') || document.hidden) return;
        try { await CCT.load(); } catch(e) { return; }
        CCT.updBat();
        if (CCT.tab === 'cams' && !document.querySelector('.mbg')) CCT.drawCams($$('#cctBody'));
        if (CCT.tab === 'events' && !poll && !document.querySelector('.clight')) CCT.drawEvents($$('#cctBody'));
        const gone = CCT.tab === 'live' && document.querySelectorAll('.cct-grid .ctile').length !== CCT.cams.filter(c => c.enabled).length;
        if (gone) CCT.draw();
      };

      /* ---------- siaran langsung ---------- */
      function cctTile(c, big) {
        return `<div class="ctile $${big?'big':''}" data-id="$${c.id}"><video muted playsinline autoplay></video><img class="csnap" alt=""><canvas class="caicv"></canvas><div class="cov"><span class="cname">$${esc(c.name)}</span>$${cBat(c)}$${c.manual_left?'<span class="cbadge rec">REC</span>':''}$${c.ai?'<span class="cbadge">AI</span>':''}<span class="cst wait" data-st>Menyambung…</span></div>`
          + `<div class="cmsg"></div>$${big ? '' : `<div class="cact">$${CCT.aiSvc?`<button data-a="ai" title="Mode AI: kotak deteksi orang, kendaraan, hewan">$${ic('sparkle',17)}</button>`:''}$${c.audio?`<button data-a="mute" title="Dengarkan suara kamera">$${ic('volOff',17)}</button>`:''}$${CCT.perms.snap?`<button data-a="snap" title="Simpan gambar">$${ic('camera',17)}</button>`:''}<button data-a="full" title="Layar penuh">$${ic('expand',17)}</button></div>`}</div>`;
      }
      CCT.drawLive = function(b) {
        const cams = CCT.cams.filter(c => c.enabled);
        if (!CCT.ffmpeg) { b.innerHTML = emptyBox('alert', 'ffmpeg belum terpasang', 'Server membutuhkan ffmpeg. Jalankan ulang kontainer dengan koneksi internet agar terpasang otomatis.'); return; }
        if (!cams.length) { b.innerHTML = emptyBox('cctv', 'Belum ada kamera', S.me.is_owner ? 'Buka tab <b>Kamera</b> untuk menambahkan kamera V380 Anda.' : 'Owner belum memberi Anda kamera untuk dilihat.'); return; }
        const cols = CCT.cols || (cams.length <= 1 ? 1 : cams.length <= 4 ? 2 : 3);
        b.innerHTML = `<div class="cct-bar"><span class="cct-msg">$${cams.length} kamera · klik kamera untuk tampilan besar$${CCT.perms.ptz?' dan kendali PTZ':''}</span><div class="seg">$${[1,2,3,4].map(n => `<button data-c="$${n}" class="$${cols===n?'on':''}" title="$${n} kolom">$${n}</button>`).join('')}</div></div>`
          + `<div class="cct-grid" style="--cols:$${cols};--mc:$${cols>=3?2:1}">$${cams.map(c => cctTile(c)).join('')}</div>`;
        b.querySelector('.seg').onclick = e => { const x = e.target.closest('[data-c]'); if (!x) return; CCT.cols = +x.dataset.c; try { localStorage.setItem('cctCols', CCT.cols); } catch(er) {} CCT.draw(); };
        b.querySelectorAll('.ctile').forEach(t => {
          const c = CCT.cam(+t.dataset.id); CCT.players.set(c.id, cctPlayer(t, c));
          t.onclick = e => {
            const a = e.target.closest('[data-a]');
            if (a && a.dataset.a === 'mute') { e.stopPropagation(); const v = t.querySelector('video'), on = v.muted; document.querySelectorAll('.cct-grid .ctile').forEach(x => { x.querySelector('video').muted = true; const mb = x.querySelector('[data-a=mute]'); if (mb) mb.innerHTML = ic('volOff',17); }); if (on) { v.muted = false; a.innerHTML = ic('vol',17); v.play().catch(() => {}); } return; }
            if (a && a.dataset.a === 'ai') { e.stopPropagation(); const k = 'ai' + c.id, ex = CCT.players.get(k); if (ex) { ex.destroy(); CCT.players.delete(k); a.classList.remove('hold'); } else { CCT.players.set(k, cctAiView(t, c)); a.classList.add('hold'); } return; }
            if (a && a.dataset.a === 'snap') { e.stopPropagation(); cctSnap(c); return; }
            if (a && a.dataset.a === 'full') { e.stopPropagation(); (t.requestFullscreen || t.webkitRequestFullscreen || (() => {})).call(t); return; }
            cctFocus(c.id);
          };
        });
      };
      const cBat = c => c.battery ? `<span class="cbatt $${c.battery.level <= 15 && !c.battery.charging ? 'low' : ''}" data-bat>$${c.battery.charging ? '⚡' : ''}$${c.battery.level}%</span>` : '';
      CCT.updBat = function() { document.querySelectorAll('.ctile[data-id]').forEach(t => { const c = CCT.cam(+t.dataset.id); if (!c) return; const old = t.querySelector('[data-bat]'); const h = cBat(c); if (old) { if (h) old.outerHTML = h; else old.remove(); } else if (h) { const st = t.querySelector('[data-st]'); if (st) st.insertAdjacentHTML('beforebegin', h); } }); };
      const AI_COL = {person:'#22d3ee', vehicle:'#fb923c', animal:'#4ade80'}, AI_NAME = {person:'ORANG', vehicle:'KENDARAAN', animal:'HEWAN'};
      function cctAiView(tile, cam) {
        const cv = tile.querySelector('.caicv'), g = cv.getContext('2d'), badge = document.createElement('div'); badge.className = 'caibadge'; badge.textContent = 'AI · memuat…'; tile.append(badge);
        tile.classList.add('aimode'); let seq = 0, stop = false, timer = null;
        const draw = j => new Promise(res => {
          const im = new Image(); im.onload = () => {
            const W = cv.width = im.naturalWidth, H = cv.height = im.naturalHeight; g.drawImage(im, 0, 0, W, H);
            const lw = Math.max(2, W / 380), fs = Math.max(12, Math.round(W / 56)); g.font = '700 ' + fs + 'px system-ui,sans-serif'; g.textBaseline = 'middle';
            for (const d of j.dets) {
              const x = d.box[0] * W, y = d.box[1] * H, w = (d.box[2] - d.box[0]) * W, h = (d.box[3] - d.box[1]) * H, col = AI_COL[d.group] || '#fff';
              g.save(); g.shadowColor = col; g.shadowBlur = lw * 3; g.strokeStyle = col; g.lineWidth = lw; g.strokeRect(x, y, w, h); g.restore();
              const ag = d.age && d.age.face ? ' · ' + (AGE_LAB[d.age.group] || d.age.group).toUpperCase() + ' ' + (d.age.stale ? '~' : '±') + d.age.range : '';
              const txt = (AI_NAME[d.group] || d.label.toUpperCase()) + ' #' + d.id + ag + ' ' + Math.round(d.conf * 100) + '%';
              const tw = g.measureText(txt).width + fs * 0.8, th = fs * 1.5, ty = y - th < 0 ? y : y - th;
              g.fillStyle = col; g.globalAlpha = .85; g.fillRect(x, ty, Math.min(tw, W - x), th); g.globalAlpha = 1; g.fillStyle = '#04222a'; g.fillText(txt, x + fs * 0.4, ty + th / 2 + 1);
            }
            res();
          }; im.onerror = () => res(); im.src = 'data:image/jpeg;base64,' + j.img;
        });
        const poll = async () => {
          if (stop) return;
          try {
            const j = await api('cctv/aiview/' + cam.id + '?since=' + seq);
            if (j.err && !j.img && j.same !== false) badge.textContent = 'AI · ' + j.err;
            if (!j.same && j.img) {
              seq = j.seq; await draw(j);
              const cnt = {}; j.dets.forEach(d => cnt[d.group] = (cnt[d.group] || 0) + 1);
              const parts = Object.keys(cnt).map(k => cnt[k] + ' ' + (AI_NAME[k] || k).toLowerCase());
              badge.textContent = 'AI · ' + (parts.length ? parts.join(', ') : 'tidak ada objek') + (j.mode === 'hog' ? ' (mode dasar)' : '');
            }
          } catch(er) { badge.textContent = 'AI · ' + er.message; }
          if (!stop) timer = setTimeout(poll, 450);
        };
        poll();
        return {destroy() { stop = true; clearTimeout(timer); tile.classList.remove('aimode'); badge.remove(); }};
      }
      function cctSnap(c) { const a = document.createElement('a'); a.href = '/api/cctv/snap/' + c.id + '?dl=1'; a.download = ''; document.body.append(a); a.click(); a.remove(); toast('Mengambil gambar…'); }

      function cctFocus(id) {
        const c = CCT.cam(id); if (!c) return; CCT.closeFocus();
        const P = CCT.perms, d = document.createElement('div'); d.className = 'cfocus';
        d.innerHTML = `<div class="cf-main">$${cctTile(c, true)}</div><div class="cf-side"><div style="display:flex;align-items:center;gap:8px"><h3 style="margin:0;flex:1;font-size:17px">$${esc(c.name)}</h3><button class="ibtn" id="cfX" title="Tutup">$${ic('x',20)}</button></div>`
          + `<div class="cf-btns">$${P.snap?`<button class="btn sm" id="cfSnap">$${ic('camera',16)}Simpan gambar</button>`:''}<button class="btn sm" id="cfFull">$${ic('expand',16)}Layar penuh</button>$${c.audio?`<button class="btn sm" id="cfMute">$${ic('vol',16)}<span>Suara nyala</span></button>`:''}$${CCT.aiSvc?`<button class="btn sm" id="cfAiV">$${ic('sparkle',16)}<span>Mode AI</span></button>`:''}$${P.talk?`<button class="btn sm" id="cfTalk">$${ic('mic',16)}<span>Bicara</span></button>`:''}$${P.talk&&c.device?`<button class="btn sm" id="cfSiren">$${ic('alert',16)}Bunyikan sirene</button><button class="btn sm" id="cfSay">$${ic('vol',16)}Ucapkan teks</button>`:''}$${P.rec&&(c.rec||c.manual_left)?`<button class="btn sm" id="cfRec">$${ic('clock',16)}Rekaman</button>`:''}$${P.rec?`<button class="btn sm $${c.manual_left?'dng':''}" id="cfRn">$${ic('video',16)}<span>$${c.manual_left?'Stop rekam':'Rekam sekarang'}</span></button>`:''}</div>`
          + (c.ptz ? `<div class="lbl" style="margin-top:6px">Gerak kamera (tahan tombol)</div><div class="ptz"><button class="sm" data-p="in" title="Zoom masuk">＋</button><button data-p="up">▲</button><button class="sm" data-p="out" title="Zoom keluar">－</button><button data-p="left">◀</button><button class="sm" data-p="stop">■</button><button data-p="right">▶</button><span></span><button data-p="down">▼</button><span></span></div>`
            + `<label class="lbl">Kecepatan</label><input type="range" id="ptzSp" min="20" max="100" value="60" style="width:100%"><div class="lbl">Posisi tersimpan</div><div id="cfPre"><div class="hint">Memuat…</div></div>`
            : `<p class="hint">$${P.ptz ? 'Kamera ini belum diatur untuk PTZ (isi port ONVIF di pengaturan kamera).' : 'Anda tidak punya izin kendali PTZ.'}</p>`) + `</div>`;
        document.body.append(d); CCT.fo = d;
        d.addEventListener('mousedown', e => { if (e.target === d) CCT.closeFocus(); });
        d.querySelector('#cfX').onclick = () => CCT.closeFocus();
        const tile = d.querySelector('.ctile'); CCT.players.set('focus', cctPlayer(tile, c));
        const vid = tile.querySelector('video'); if (c.audio) vid.muted = false;
        const sn = d.querySelector('#cfSnap'); if (sn) sn.onclick = () => cctSnap(c);
        d.querySelector('#cfFull').onclick = () => (tile.requestFullscreen || tile.webkitRequestFullscreen || (() => {})).call(tile);
        const av = d.querySelector('#cfAiV');
        if (av) av.onclick = () => { const ex = CCT.players.get('aifocus'); if (ex) { ex.destroy(); CCT.players.delete('aifocus'); av.classList.remove('pri'); } else { CCT.players.set('aifocus', cctAiView(tile, c)); av.classList.add('pri'); } };
        const tk = d.querySelector('#cfTalk');
        if (tk) {
          let T = null, prevMuted = false;
          const lab = (on, txt) => { tk.classList.toggle('pri', on); tk.innerHTML = ic('mic',16) + '<span>' + txt + '</span>'; };
          tk.onclick = async () => {
            if (T) { T.stop(); return; }
            tk.disabled = true; lab(false, 'Menghubungkan…');
            try {
              prevMuted = vid.muted;
              T = CCT.talk = await cctTalk(c, msg => { T = null; CCT.talk = null; vid.muted = prevMuted; if (mu) mu.innerHTML = ic(vid.muted ? 'volOff' : 'vol', 16) + '<span>' + (vid.muted ? 'Suara mati' : 'Suara nyala') + '</span>'; lab(false, 'Bicara'); if (msg) toast(msg); });
              vid.muted = true; lab(true, 'Bicara… (klik untuk berhenti)');
            } catch(er) { lab(false, 'Bicara'); if (er.message) toast(er.message); }
            finally { tk.disabled = false; }
          };
        }
        const dv = async (o, ok) => { try { await api('cctv/devcmd', Object.assign({cam:c.id}, o)); if (ok) toast(ok); } catch(er) { toast(er.message); } };
        const sr = d.querySelector('#cfSiren'); if (sr) sr.onclick = () => dv({type:'siren', seconds:8}, 'Sirene dibunyikan di ' + c.name);
        const sy = d.querySelector('#cfSay'); if (sy) sy.onclick = async () => { const t = await ask('Teks yang diucapkan di ' + c.name, '', 'Ucapkan'); if (t && t.trim()) dv({type:'tts', text:t.trim()}, 'Pesan dikirim'); };
        const mu = d.querySelector('#cfMute'); if (mu) mu.onclick = () => { vid.muted = !vid.muted; mu.innerHTML = ic(vid.muted ? 'volOff' : 'vol', 16) + '<span>' + (vid.muted ? 'Suara mati' : 'Suara nyala') + '</span>'; };
        const rn = d.querySelector('#cfRn');
        if (rn) rn.onclick = async () => {
          try {
            if (c.manual_left) { await api('cctv/recnow', {cam:c.id, on:false}); c.manual_left = 0; rn.classList.remove('dng'); rn.querySelector('span').textContent = 'Rekam sekarang'; toast('Perekaman manual dihentikan'); return; }
            const v = await ask('Rekam berapa menit? (1–120)', '10', 'Mulai'); if (v == null) return;
            const mn = Math.max(1, Math.min(120, parseInt(v, 10) || 0)); if (!mn) return toast('Isi angka menit');
            const j = await api('cctv/recnow', {cam:c.id, on:true, minutes:mn}); c.manual_left = j.left; rn.classList.add('dng'); rn.querySelector('span').textContent = 'Stop rekam'; toast('Merekam ' + mn + ' menit');
          } catch(er) { toast(er.message); }
        };
        const rc = d.querySelector('#cfRec'); if (rc) rc.onclick = () => { CCT.rec.cam = c.id; CCT.closeFocus(); go('#/cctv/rec'); };
        if (!c.ptz) return;
        const vec = {up:[0,1,0], down:[0,-1,0], left:[-1,0,0], right:[1,0,0], in:[0,0,1], out:[0,0,-1]};
        d.querySelectorAll('.ptz [data-p]').forEach(btn => {
          const k = btn.dataset.p; let pend = null;
          const down = e => {
            e.preventDefault(); if (k === 'stop') { api('cctv/ptz', {cam:c.id, op:'stop'}).catch(er => toast(er.message)); return; }
            try { btn.setPointerCapture(e.pointerId); } catch(er) {}
            btn.classList.add('hold'); const s = (+d.querySelector('#ptzSp').value) / 100, v = vec[k];
            pend = api('cctv/ptz', {cam:c.id, op:'move', pan:v[0]*s, tilt:v[1]*s, zoom:v[2]*s, ms:2500}); pend.catch(er => toast(er.message));
          };
          const up = async () => { if (!btn.classList.contains('hold')) return; btn.classList.remove('hold'); try { await pend; } catch(er) { return; } api('cctv/ptz', {cam:c.id, op:'stop'}).catch(() => {}); };
          btn.addEventListener('pointerdown', down); btn.addEventListener('pointerup', up); btn.addEventListener('pointercancel', up); btn.addEventListener('lostpointercapture', up);
        });
        /* kendali keyboard: panah / WASD = gerak, + / - (atau Q / E) = zoom, spasi = berhenti; tahan tombol untuk bergerak terus */
        const kmap = {ArrowUp:'up', w:'up', W:'up', ArrowDown:'down', s:'down', S:'down', ArrowLeft:'left', a:'left', A:'left', ArrowRight:'right', d:'right', D:'right', '+':'in', '=':'in', e:'in', E:'in', '-':'out', '_':'out', q:'out', Q:'out'};
        let held = null, rep = 0;
        const kStop = () => { if (!held) return; clearInterval(rep); const h = held; held = null; d.querySelectorAll('.ptz [data-p]').forEach(b => b.classList.remove('hold')); api('cctv/ptz', {cam:c.id, op:'stop'}).catch(() => {}); };
        const kSend = k => { const s = (+d.querySelector('#ptzSp').value) / 100, v = vec[k]; api('cctv/ptz', {cam:c.id, op:'move', pan:v[0]*s, tilt:v[1]*s, zoom:v[2]*s, ms:2500}).catch(er => { toast(er.message); kStop(); }); };
        const kd = e => {
          if (!document.body.contains(d)) { document.removeEventListener('keydown', kd, true); document.removeEventListener('keyup', ku, true); clearInterval(rep); return; }
          if (e.ctrlKey || e.metaKey || e.altKey || /^(INPUT|TEXTAREA|SELECT)$$/.test((e.target.tagName || ''))) return;
          if (e.key === ' ' && held) { e.preventDefault(); kStop(); return; }
          const k = kmap[e.key]; if (!k) return;
          e.preventDefault(); e.stopPropagation(); if (e.repeat || held === k) return;
          if (held) kStop();
          held = k; const b = d.querySelector(`.ptz [data-p="$${k}"]`); if (b) b.classList.add('hold');
          kSend(k); rep = setInterval(() => kSend(k), 2000);
        };
        const ku = e => { const k = kmap[e.key]; if (k && k === held) { e.preventDefault(); kStop(); } };
        document.addEventListener('keydown', kd, true); document.addEventListener('keyup', ku, true);
        window.addEventListener('blur', kStop);
        const ptzBox = d.querySelector('.ptz'); if (ptzBox) ptzBox.insertAdjacentHTML('afterend', '<p class="hint" style="margin:6px 0 0">Keyboard: <b>← ↑ ↓ →</b> atau <b>W A S D</b> untuk menggerakkan (tahan tombol), <b>+ / −</b> atau <b>E / Q</b> untuk zoom, <b>Spasi</b> untuk berhenti.</p>');
        const loadPre = async () => {
          const box = d.querySelector('#cfPre'); if (!box) return;
          try {
            const j = await api('cctv/presets?cam=' + c.id);
            box.innerHTML = (j.items.length ? j.items.map(p => `<div class="cpre"><span>$${esc(p.name)}</span><button class="btn sm" data-go="$${esc(p.token)}">Pergi</button>$${S.me.is_owner?`<button class="ibtn" data-rm="$${esc(p.token)}" title="Hapus" style="width:30px;height:30px">$${ic('trash',15)}</button>`:''}</div>`).join('') : '<div class="hint">Belum ada posisi tersimpan.</div>')
              + (S.me.is_owner ? `<button class="btn sm" id="preAdd" style="margin-top:10px">$${ic('plus',15)}Simpan posisi sekarang</button>` : '');
            box.onclick = async e => {
              const g = e.target.closest('[data-go]'), r = e.target.closest('[data-rm]'), a = e.target.closest('#preAdd');
              try {
                if (g) await api('cctv/preset', {cam:c.id, op:'goto', token:g.dataset.go});
                else if (r) { if (await confirmBox('Hapus posisi?', 'Posisi tersimpan akan dihapus dari kamera.', 'Hapus')) { await api('cctv/preset', {cam:c.id, op:'remove', token:r.dataset.rm}); loadPre(); } }
                else if (a) { const n = await ask('Nama posisi', '', 'Simpan'); if (n && n.trim()) { await api('cctv/preset', {cam:c.id, op:'set', name:n.trim()}); toast('Posisi disimpan'); loadPre(); } }
              } catch(er) { toast(er.message); }
            };
          } catch(er) { box.innerHTML = `<div class="hint">$${esc(er.message)}</div>`; }
        };
        loadPre();
      }

      /* ---------- rekaman ---------- */
      CCT.drawRec = async function(b) {
        const R = CCT.rec, cams = CCT.cams.filter(c => c.enabled || S.me.is_owner);
        if (!cams.length) { b.innerHTML = emptyBox('clock', 'Belum ada kamera', 'Belum ada kamera yang bisa Anda lihat rekamannya.'); return; }
        if (!R.cam || !cams.some(c => c.id === R.cam)) R.cam = (cams.find(c => c.rec) || cams[0]).id;
        if (!R.date) R.date = cDay(new Date());
        const cam = CCT.cam(R.cam), from = new Date(R.date + 'T00:00:00').getTime() / 1000;
        b.innerHTML = `<div class="cct-bar"><select id="rcCam" style="width:auto;min-width:160px">$${cams.map(c => `<option value="$${c.id}" $${c.id===R.cam?'selected':''}>$${esc(c.name)}$${c.rec?'':' (rekam mati)'}</option>`).join('')}</select>`
          + `<button class="btn sm" id="rcPrev">‹</button><input type="date" id="rcDate" value="$${R.date}" style="width:auto"><button class="btn sm" id="rcNext">›</button><button class="btn sm" id="rcToday">Hari ini</button></div><div id="rcBody"><div class="adm-loading"><div class="sk"></div></div></div>`;
        const shift = n => { const d = new Date(R.date + 'T00:00:00'); d.setDate(d.getDate() + n); R.date = cDay(d); R.cur = null; R.seek = 0; CCT.drawRec(b); };
        b.querySelector('#rcCam').onchange = e => { R.cam = +e.target.value; R.cur = null; R.seek = 0; CCT.drawRec(b); };
        b.querySelector('#rcDate').onchange = e => { if (e.target.value) { R.date = e.target.value; R.cur = null; R.seek = 0; CCT.drawRec(b); } };
        b.querySelector('#rcPrev').onclick = () => shift(-1); b.querySelector('#rcNext').onclick = () => shift(1);
        b.querySelector('#rcToday').onclick = () => { R.date = cDay(new Date()); R.cur = null; R.seek = 0; CCT.drawRec(b); };
        let items = [], evs = [];
        try {
          items = (await api(`cctv/rec/$${R.cam}?from=$${from}&to=$${from + 86400}`)).items;
          try { evs = (await api('cctv/events?cam=' + R.cam + '&limit=200')).items.filter(e => e.ts >= from && e.ts < from + 86400); } catch(e) {}
        } catch(e) { $$('#rcBody').innerHTML = emptyBox('alert', 'Gagal memuat rekaman', esc(e.message)); return; }
        R.items = items;
        const body = $$('#rcBody'); if (!body) return;
        if (!items.length) {
          body.innerHTML = emptyBox('clock', 'Tidak ada rekaman', cam && !cam.rec ? 'Perekaman belum diaktifkan untuk kamera ini.' + (S.me.is_owner ? ' Aktifkan di tab Kamera → ubah kamera → "Rekam terus-menerus".' : '') : 'Tidak ada rekaman pada tanggal ini.');
          return;
        }
        const tl = items.map((it, i) => `<i data-i="$${i}" style="left:$${Math.max(0,(it.start-from)/864)}%;width:$${Math.max(.25,(Math.min(it.end,from+86400)-Math.max(it.start,from))/864)}%" title="$${cHM(it.start)}–$${cHM(it.end)}"></i>`).join('')
          + evs.map(e => `<u style="left:$${(e.ts-from)/864}%" title="Gerakan $${cHMS(e.ts)}"></u>`).join('');
        const total = items.reduce((s, x) => s + x.size, 0);
        body.innerHTML = `<video class="crec" id="rcVid" controls playsinline></video><div class="cct-bar" style="margin:8px 0 0"><span id="rcInfo" class="cct-msg">Klik garis waktu atau daftar untuk memutar.</span><select id="rcSpd" title="Kecepatan putar" style="width:auto">$${[0.5,1,2,4,8].map(v => `<option value="$${v}" $${v===(R.spd||1)?'selected':''}>$${v}×</option>`).join('')}</select><button class="btn sm" id="rcClip">$${ic('download',15)}Ekspor klip</button></div>`
          + `<div class="ctl" id="rcTl">$${tl}</div><div class="ctl-t"><span>00</span><span>06</span><span>12</span><span>18</span><span>24</span></div>`
          + `<div class="panel nopad"><div style="padding:14px 18px 0" class="ph"><h3>$${items.length} berkas · $${fmtSize(total)}</h3>$${S.me.is_owner && items.length?`<span style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn sm dng" id="rcDelSel" disabled>$${ic('trash',15)}Hapus terpilih</button><button class="btn sm dng" id="rcDelDay">$${ic('trash',15)}Hapus sehari</button></span>`:''}$${evs.length?`<small>garis oranye = gerakan terdeteksi</small>`:''}</div><div id="rcList" style="padding:0 14px 8px">`
          + items.slice().reverse().map(it => { const i = items.indexOf(it); return `<div class="crow" data-i="$${i}">$${S.me.is_owner && !it.live?`<input type="checkbox" class="rcSel" data-s="$${i}" style="width:18px;height:18px;flex:none">`:''}<span class="ai">$${ic('video',18)}</span><div class="ct"><b>$${cHM(it.start)} – $${it.live ? 'sekarang' : cHM(it.end)}</b>$${it.live?'<em class="pill">merekam</em>':''}<small>$${cDur(it.end-it.start)} · $${fmtSize(it.size)}</small></div><button class="btn sm" data-p="$${i}">$${ic('play',15)}Putar</button><a class="ibtn" href="/api/cctv/recfile/$${R.cam}/$${it.name}?dl=1" download title="Unduh">$${ic('download',18)}</a>$${S.me.is_owner?`<button class="ibtn" data-d="$${i}" title="Hapus">$${ic('trash',18)}</button>`:''}</div>`; }).join('') + `</div></div>`;
        const vid = $$('#rcVid');
        const play = (i, off) => {
          const it = items[i]; if (!it) return; R.cur = i;
          vid.src = `/api/cctv/recfile/$${R.cam}/$${it.name}`; vid.onloadedmetadata = () => { vid.playbackRate = R.spd || 1; if (off > 1) try { vid.currentTime = off; } catch(e) {} };
          vid.play().catch(() => {});
          $$('#rcInfo').textContent = cam.name + ' · ' + cHMS(it.start) + (it.live ? ' (sedang merekam)' : '');
          body.querySelectorAll('.crow').forEach(r => r.classList.toggle('on', +r.dataset.i === i));
          body.querySelectorAll('#rcTl i').forEach(r => r.classList.toggle('on', +r.dataset.i === i));
        };
        $$('#rcSpd').onchange = e => { R.spd = +e.target.value; vid.playbackRate = R.spd; };
        $$('#rcClip').onclick = () => cctClip(R.cam, from, items, R.cur != null ? items[R.cur] : null, vid.currentTime || 0);
        vid.onended = () => { if (R.cur != null && R.cur + 1 < items.length) play(R.cur + 1, 0); };
        $$('#rcTl').onclick = e => {
          const r = e.currentTarget.getBoundingClientRect(), t = from + (e.clientX - r.left) / r.width * 86400;
          const i = items.findIndex(x => t >= x.start && t <= x.end);
          if (i < 0) { const n = items.findIndex(x => x.start > t); if (n < 0) return toast('Tidak ada rekaman setelah jam itu'); return play(n, 0); }
          play(i, t - items[i].start);
        };
        $$('#rcList').onclick = async e => {
          const p = e.target.closest('[data-p]'), d = e.target.closest('[data-d]');
          if (p) play(+p.dataset.p, 0);
          else if (d) { const it = items[+d.dataset.d]; if (await cctDelRec({msg:cHM(it.start) + ' – ' + cHM(it.end) + ' (' + fmtSize(it.size) + ') akan dihapus permanen. Masukkan password untuk melanjutkan.', req:{cam:R.cam, name:it.name}})) CCT.drawRec(b); }
        };
        const selBtn = $$('#rcDelSel'), dayBtn = $$('#rcDelDay');
        if (selBtn) {
          const sel = () => [...body.querySelectorAll('.rcSel:checked')].map(x => items[+x.dataset.s]);
          $$('#rcList').addEventListener('change', e => { if (e.target.classList.contains('rcSel')) { const n = sel().length; selBtn.disabled = !n; selBtn.lastChild.textContent = n ? 'Hapus terpilih (' + n + ')' : 'Hapus terpilih'; } });
          selBtn.onclick = async () => { const l = sel(); if (l.length && await cctDelRec({msg:l.length + ' rekaman (' + fmtSize(l.reduce((a, x) => a + x.size, 0)) + ') akan dihapus permanen. Masukkan password untuk melanjutkan.', req:{cam:R.cam, names:l.map(x => x.name)}})) CCT.drawRec(b); };
          dayBtn.onclick = async () => { const l = items.filter(x => !x.live); if (!l.length) return toast('Tidak ada rekaman selesai untuk dihapus'); if (await cctDelRec({msg:'SEMUA ' + l.length + ' rekaman pada ' + esc(cDay(new Date(from * 1000))) + ' (' + fmtSize(l.reduce((a, x) => a + x.size, 0)) + ') akan dihapus permanen. Masukkan password untuk melanjutkan.', req:{cam:R.cam, names:l.map(x => x.name)}})) CCT.drawRec(b); };
        }
        if (R.seek) { const t = R.seek; R.seek = 0; let i = items.findIndex(x => t >= x.start && t <= x.end); if (i >= 0) play(i, t - items[i].start); else { i = items.findIndex(x => x.start > t); if (i >= 0) play(i, 0); } }
      };

      function evCountdown(key, secs = 5) {
        return new Promise(res => {
          const def = (typeof EVD !== 'undefined' && EVD[key]) || {emo:'🎉', name:'Event'};
          const o = document.createElement('div');
          o.style.cssText = 'position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(circle at 50% 40%,rgba(30,20,60,.94),rgba(0,0,0,.97));color:#fff;text-align:center;font-family:inherit';
          o.innerHTML = `<style>@keyframes evpop{0%{transform:scale(.4);opacity:0}30%{transform:scale(1.15);opacity:1}100%{transform:scale(1);opacity:.9}}@keyframes evring{from{stroke-dashoffset:0}to{stroke-dashoffset:565}}</style><div style="font-size:20px;opacity:.85">$${def.emo} Peluncuran event <b>$${esc(def.name)}</b> dalam…</div><div style="position:relative;width:220px;height:220px"><svg width="220" height="220" viewBox="0 0 200 200" style="position:absolute;inset:0;transform:rotate(-90deg)"><circle cx="100" cy="100" r="90" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="8"/><circle id="evR" cx="100" cy="100" r="90" fill="none" stroke="#fbbf24" stroke-width="8" stroke-linecap="round" stroke-dasharray="565" style="animation:evring $${secs}s linear forwards"/></svg><div id="evN" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:110px;font-weight:800;animation:evpop .9s ease-out infinite"></div></div><button class="btn" id="evC" style="margin-top:8px">Batalkan</button>`;
          document.body.append(o);
          let n = secs, done = false;
          const num = o.querySelector('#evN'), show = () => { num.textContent = n; num.style.animation = 'none'; void num.offsetWidth; num.style.animation = 'evpop .9s ease-out'; };
          const fin = v => { if (done) return; done = true; clearInterval(t); document.removeEventListener('keydown', kd, true); o.remove(); res(v); };
          const kd = e => { if (e.key === 'Escape') fin(false); };
          document.addEventListener('keydown', kd, true);
          o.querySelector('#evC').onclick = () => fin(false);
          show();
          const t = setInterval(() => { n--; if (n <= 0) { num.textContent = '🚀'; clearInterval(t); setTimeout(() => fin(true), 700); } else show(); }, 1000);
        });
      }
      function cctPw(title, text, okLabel) {
        return new Promise(res => {
          const m = modal(`<h2>$${esc(title)}</h2><p class="hint" style="margin:0 0 8px">$${text}</p><label class="lbl">Password akun Anda ($${esc(S.me.username)})</label><input type="password" id="pwI" autocomplete="current-password"><div class="cres bad" id="pwE" style="display:none;margin-top:8px"></div><div class="actions"><button class="btn" id="pwX">Batal</button><button class="btn pri dng" id="pwOk">$${esc(okLabel || 'Hapus')}</button></div>`);
          const i = m.querySelector('#pwI'); let done = false;
          const fin = v => { if (done) return; done = true; m.remove(); res(v); };
          m.querySelector('#pwX').onclick = () => fin(null);
          m.querySelector('#pwOk').onclick = () => { if (!i.value) { i.focus(); return; } fin(i.value); };
          i.onkeydown = e => { if (e.key === 'Enter') m.querySelector('#pwOk').click(); };
          setTimeout(() => i.focus(), 50);
        });
      }
      async function cctDelRec(body) {
        const pw = await cctPw('Hapus rekaman', body.msg, 'Hapus permanen'); if (!pw) return false;
        try { const j = await api('cctv/recdelete', Object.assign({}, body.req, {password:pw})); toast(j.deleted + ' rekaman dihapus'); return true; }
        catch(er) { toast(er.code === 'bad_password' || /password/i.test(er.message) ? 'Password salah. Rekaman tidak dihapus.' : er.message); return false; }
      }
      function cctClip(camId, dayStart, items, cur, off) {
        const cam = CCT.cam(camId), t0 = cur ? cur.start + off : (items[0] ? items[0].start : dayStart);
        const tv = t => { const d = new Date(t * 1000); return cPad(d.getHours()) + ':' + cPad(d.getMinutes()) + ':' + cPad(d.getSeconds()); };
        const m = modal(`<h2>Ekspor klip</h2><p class="hint" style="margin:0 0 6px">$${esc(cam ? cam.name : '')} · $${esc(cDay(new Date(dayStart * 1000)))}. Klip dipotong dari rekaman (maks. 2 jam) dan diunduh sebagai MP4. Awal klip dibulatkan ke keyframe terdekat.</p>`
          + `<div class="cfld"><div><label class="lbl">Dari jam</label><input type="time" step="1" id="clFrom" value="$${tv(t0)}"></div><div><label class="lbl">Sampai jam</label><input type="time" step="1" id="clTo" value="$${tv(Math.min(t0 + 60, dayStart + 86399))}"></div></div><div id="clRes"></div>`
          + `<div class="actions"><button class="btn" id="clX">Batal</button><button class="btn pri" id="clGo">$${ic('download',16)}Unduh klip</button></div>`);
        const ts = v => { const p = v.split(':').map(Number); return dayStart + p[0] * 3600 + p[1] * 60 + (p[2] || 0); };
        m.querySelector('#clX').onclick = () => m.remove();
        m.querySelector('#clGo').onclick = async () => {
          const f = ts(m.querySelector('#clFrom').value), t = ts(m.querySelector('#clTo').value), r = m.querySelector('#clRes');
          if (!(t > f) || t - f > 7200) { r.innerHTML = '<div class="cres bad">Jam akhir harus setelah jam awal, maksimal 2 jam.</div>'; return; }
          const btn = m.querySelector('#clGo'); btn.disabled = true; r.innerHTML = '<div class="cres">Membuat klip…</div>';
          try {
            const url = `/api/cctv/clip/$${camId}?from=$${f}&to=$${t}`, resp = await fetch(url, {credentials:'same-origin'});
            if (!resp.ok) { let j = {}; try { j = await resp.json(); } catch(e) {} throw new Error(j.error || 'Gagal membuat klip'); }
            const blob = await resp.blob(), a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = (cam ? cam.name : 'klip').replace(/[^\w-]+/g, '_') + '-' + tv(f).replace(/:/g, '') + '.mp4';
            document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 60000); m.remove(); toast('Klip diunduh');
          } catch(er) { r.innerHTML = `<div class="cres bad">$${esc(er.message)}</div>`; btn.disabled = false; }
        };
      }

      /* ---------- kejadian ---------- */
      const EV_LAB = {person:'Orang', vehicle:'Kendaraan', animal:'Hewan', motion:'Gerakan'};
      const AGE_LAB = {anak:'Anak', remaja:'Remaja', dewasa:'Dewasa', lansia:'Lansia'};
      const cAgeTxt = d => d.age && d.age.face ? ` · $${AGE_LAB[d.age.group] || d.age.group} ±$${esc(d.age.range)}` : (d.group === 'person' && d.age ? ' · usia tidak terlihat' : '');
      const cEvLabel = e => {
        if (e.info && e.info.length) return e.info.slice(0, 3).map(d => `<span class="evtag $${esc(d.group||'')}">$${esc(EV_LAB[d.group] || d.label || '?')}$${cAgeTxt(d)} $${Math.round((d.conf||0)*100)}%</span>`).join('');
        return `<span class="evtag">$${esc(EV_LAB[e.kind] || 'Gerakan')}</span>`;
      };
      CCT.drawEvents = async function(b, more, keep) {
        const E = CCT.ev, evOk = x => (!E.kind || x.kind === E.kind) && (!E.age || (x.info || []).some(d => d.age && d.age.face && d.age.group === E.age));
        if (!more) { E.items = []; E.sel.clear(); }
        const cams = CCT.cams;
        try { if (keep) throw {keep:1};
          const j = await api('cctv/events?limit=60' + (E.cam ? '&cam=' + E.cam : '') + (more && E.items.length ? '&before=' + E.items[E.items.length-1].id : ''));
          E.items = E.items.concat(j.items); E.more = j.more;
        } catch(e) { if (!e.keep) { b.innerHTML = emptyBox('alert', 'Gagal memuat kejadian', esc(e.message)); return; } }
        const own = S.me.is_owner;
        b.innerHTML = `<div class="cct-bar"><select id="evCam" style="width:auto;min-width:160px"><option value="">Semua kamera</option>$${cams.map(c => `<option value="$${c.id}" $${String(c.id)===E.cam?'selected':''}>$${esc(c.name)}</option>`).join('')}</select><select id="evKind" style="width:auto"><option value="">Semua jenis</option><option value="person">Orang</option><option value="vehicle">Kendaraan</option><option value="animal">Hewan</option><option value="motion">Gerakan biasa</option></select><select id="evAge" style="width:auto"><option value="">Semua usia</option><option value="anak">Anak</option><option value="remaja">Remaja</option><option value="dewasa">Dewasa</option><option value="lansia">Lansia</option></select><span class="cct-msg">Gerakan & deteksi AI dari kamera yang diaktifkan owner.</span>$${own&&E.items.length?`<button class="btn sm dng" id="evDel">$${ic('trash',15)}<span>Hapus</span></button>`:''}</div>`
          + (E.items.filter(evOk).length ? `<div class="cev">$${E.items.filter(evOk).map(e => `<div class="cevc" data-id="$${e.id}">$${own?`<input type="checkbox" class="ck" data-k="$${e.id}" $${E.sel.has(e.id)?'checked':''}>`:''}$${e.snap?`<img loading="lazy" src="/api/cctv/evsnap/$${e.id}" alt="">`:`<div class="noimg"></div>`}<div class="m"><div><b>$${esc(e.name)}</b><small>$${cEvLabel(e)} · $${esc(fmtDT(e.ts))}</small></div>$${CCT.perms.rec&&(CCT.cam(e.cam_id)||{}).rec?`<button class="btn sm" data-r="$${e.id}">$${ic('play',14)}Rekaman</button>`:''}<button class="btn sm" data-ai="$${e.id}" title="Tanya Asisten AI tentang kejadian ini">$${ic('bot',14)}Tanya AI</button></div></div>`).join('')}</div>$${E.more?'<div style="text-align:center;margin:16px"><button class="btn" id="evMore">Muat lebih banyak</button></div>':''}`
            : emptyBox('bell', 'Belum ada kejadian', 'Aktifkan "Deteksi gerakan" pada kamera, lalu kejadian akan muncul di sini dan dikirim sebagai notifikasi.'));
        b.querySelector('#evCam').onchange = e => { E.cam = e.target.value; CCT.drawEvents(b); };
        const ea = b.querySelector('#evAge'); ea.value = E.age; ea.onchange = e => { E.age = e.target.value; CCT.drawEvents(b, true, true); };
        const ek = b.querySelector('#evKind'); ek.value = E.kind; ek.onchange = e => { E.kind = e.target.value; CCT.drawEvents(b, true, true); };
        const mo = b.querySelector('#evMore'); if (mo) mo.onclick = () => CCT.drawEvents(b, true);
        b.querySelectorAll('.cevc').forEach(card => card.onclick = async e => {
          const id = +card.dataset.id, ev = E.items.find(x => x.id === id);
          if (e.target.closest('[data-k]')) { const k = e.target.closest('[data-k]'); k.checked ? E.sel.add(id) : E.sel.delete(id); return; }
          if (e.target.closest('[data-ai]')) { AS.pre = 'Jelaskan kejadian di kamera ' + ev.name + ' pada ' + fmtDT(ev.ts) + '. Apakah ada kejadian lain yang mirip hari ini dan apakah perlu dikhawatirkan?'; return go('#/assist'); }
          if (e.target.closest('[data-r]')) { CCT.rec.cam = ev.cam_id; CCT.rec.date = cDay(new Date(ev.ts*1000)); CCT.rec.seek = ev.ts - 5; return go('#/cctv/rec'); }
          if (e.target.tagName === 'IMG') { const l = document.createElement('div'); l.className = 'clight'; l.innerHTML = `<img src="$${e.target.src}" alt="">`; l.onclick = () => l.remove(); document.body.append(l); }
        });
        const del = b.querySelector('#evDel');
        if (del) del.onclick = async () => {
          const ids = [...E.sel], all = !ids.length;
          if (!await confirmBox('Hapus kejadian?', all ? 'Semua kejadian' + (E.cam ? ' kamera ini' : '') + ' akan dihapus.' : ids.length + ' kejadian akan dihapus.', 'Hapus')) return;
          try { await api('cctv/evdelete', all ? {all:true, cam:E.cam || null} : {ids}); CCT.drawEvents(b); } catch(er) { toast(er.message); }
        };
      };

      /* ---------- kamera (owner) ---------- */
      CCT.drawCams = function(b) {
        const cams = CCT.cams;
        b.innerHTML = `<div class="cct-bar"><span class="cct-msg">$${cams.length} kamera terdaftar</span><button class="btn sm" id="cmDev">$${ic('camera',16)}Kamera HP/laptop</button><button class="btn sm" id="cmHot">$${ic('radar',16)}Hotspot V380</button><button class="btn sm" id="cmScan">$${ic('radar',16)}Cari di jaringan</button><button class="btn pri sm" id="cmAdd">$${ic('plus',16)}Tambah kamera</button></div>`
          + panel('Daftar kamera', cams.length ? cams.map(c => `<div class="ccam" data-id="$${c.id}"><span class="cdot $${c.online?'on':c.err?'bad':''}"></span><div class="ct"><b>$${esc(c.name)}</b>$${c.enabled?'':'<em class="pill">nonaktif</em>'}$${c.rec?'<em class="pill">rekam</em>':''}$${c.motion?'<em class="pill">gerak</em>':''}$${c.ai?'<em class="pill">AI</em>':''}$${c.battery?`<em class="pill">baterai $${c.battery.level}%$${c.battery.charging?' ⚡':''}</em>`:''}$${c.local?'<em class="pill">webcam server</em>':''}$${c.snap_min?'<em class="pill">timelapse</em>':''}$${c.ptz?'<em class="pill">PTZ</em>':''}<small>$${c.local?'Webcam laptop server ' + esc(c.host):c.device?'Kamera HP/laptop':c.custom?'URL kustom':esc(c.host)+':'+c.port+esc(c.path)}$${c.online?' · online':c.err?' · '+esc(c.err):c.running?' · menyambung…':' · siaga (menyala saat dilihat)'}</small></div>$${c.device?`<button class="btn pri sm" data-b="$${c.id}">$${ic('camera',15)}Siarkan</button>`:''}<button class="btn sm" data-e="$${c.id}">$${ic('edit',15)}Ubah</button><button class="ibtn" data-x="$${c.id}" title="Hapus">$${ic('trash',18)}</button></div>`).join('')
            : `<div class="hint">Belum ada kamera. Klik "Tambah kamera".</div>`)
          + `<p class="hint" style="margin-top:14px">Kamera V380 hanya bisa tersambung bila model Anda mendukung RTSP/ONVIF. Alamat yang umum: <b>rtsp://admin:PASSWORD@IP-KAMERA:554/live/ch00_0</b> (HD) atau <b>/live/ch00_1</b> (SD); ONVIF biasanya di port <b>8899</b>. Aktifkan RTSP/ONVIF di pengaturan kamera (aplikasi V380 Pro), pakai password yang Anda atur, lalu klik <b>Tes koneksi</b>.</p>`;
        if (S.me.is_owner) { const hp = document.createElement('div'); hp.id = 'cmHw'; b.insertBefore(hp, b.children[1]); cctHwPanel(hp); }
        b.querySelector('#cmAdd').onclick = () => cctCamForm(null);
        b.querySelector('#cmScan').onclick = cctScan;
        b.querySelector('#cmHot').onclick = cctHotspot;
        b.querySelector('#cmDev').onclick = async () => {
          const n = await ask('Nama kamera perangkat ini', 'Kamera HP', 'Buat'); if (!n || !n.trim()) return;
          try { const j = await api('cctv/cam', {name:n.trim(), brand:'device', mode:'device', audio:true, rec:false, motion:false}); await CCT.load(); CCT.drawCams(b); cctBroadcast(CCT.cam(j.id)); } catch(er) { toast(er.message); }
        };
        b.querySelectorAll('[data-b]').forEach(x => x.onclick = () => cctBroadcast(CCT.cam(+x.dataset.b)));
        b.querySelectorAll('[data-e]').forEach(x => x.onclick = () => cctCamForm(CCT.cam(+x.dataset.e)));
        b.querySelectorAll('[data-x]').forEach(x => x.onclick = async () => {
          const c = CCT.cam(+x.dataset.x);
          if (!await confirmBox('Hapus kamera?', `"$${c.name}" beserta semua rekaman dan kejadiannya akan dihapus permanen.`, 'Hapus')) return;
          try { await api(`cctv/cam/$${c.id}/delete`, {}); toast('Kamera dihapus'); await CCT.load(); CCT.drawCams(b); } catch(er) { toast(er.message); }
        });
      };
      function cctCamForm(cam, pre) {
        pre = pre || {}; const edit = !!cam, c = cam || {};
        let zone = c.motion_zone || '', sch = null, aiCl = (c.ai_classes || 'person,vehicle,animal').split(',');
        try { sch = c.motion_sched ? JSON.parse(c.motion_sched) : null; } catch(e) {}
        const val = (k, d) => esc(pre[k] != null ? pre[k] : c[k] != null ? c[k] : d);
        let mode = edit ? (c.local ? 'local' : c.device ? 'device' : c.custom ? 'custom' : (c.brand === 'rtsp' ? 'rtsp' : 'v380')) : (pre.mode || 'v380');
        const m = modal(`<h2>$${edit ? 'Ubah kamera' : 'Tambah kamera'}</h2><div class="cfld">`
          + `<div class="full"><label class="lbl">Nama kamera</label><input type="text" id="cfName" maxlength="40" value="$${val('name','')}" placeholder="Contoh: Teras depan"></div>`
          + `<div class="full"><label class="lbl">Jenis</label><select id="cfMode"><option value="v380">V380 (RTSP)</option><option value="rtsp">Kamera RTSP / ONVIF lain</option><option value="custom">URL stream kustom</option><option value="device">Kamera HP / laptop (siaran dari browser)</option><option value="local">Webcam & mic laptop server (USB / bawaan)</option></select></div>`
          + `<div class="full" id="cfUrlBox"><label class="lbl">URL stream</label><input type="text" id="cfUrl" placeholder="$${edit && c.custom ? '(tidak diubah — isi untuk mengganti)' : 'rtsp://user:pass@192.168.1.10:554/stream'}" autocomplete="off"></div>`
          + `<div class="full" id="cfLocBox" style="display:none"><div class="cfld"><div><label class="lbl">Perangkat kamera</label><input type="text" id="cfLDev" list="cfLDevL" value="$${edit && c.local ? esc(c.host) : '/dev/video0'}"><datalist id="cfLDevL"></datalist></div>`
          + `<div><label class="lbl">Resolusi</label><select id="cfLSize">$${['640x480','1280x720','1920x1080'].map(x => `<option $${(edit && c.local ? c.username : '1280x720') === x ? 'selected' : ''}>$${x}</option>`).join('')}</select></div>`
          + `<div class="full"><label class="lbl">Mikrofon (ALSA)</label><input type="text" id="cfLAud" list="cfLAudL" value="$${edit && c.local ? esc(c.path) : 'default'}"><datalist id="cfLAudL"></datalist></div></div>`
          + `<div class="cct-bar" style="margin:6px 0"><button class="btn sm" type="button" id="cfLDet">$${ic('radar',15)}Deteksi perangkat server</button><span class="cct-msg" id="cfLMsg">Webcam harus diteruskan ke kontainer (lihat komentar "devices" di compose).</span></div></div>`
          + `<div class="ipf"><label class="lbl">Alamat IP kamera</label><input type="text" id="cfHost" value="$${val('host','')}" placeholder="192.168.1.50"></div>`
          + `<div class="ipf"><label class="lbl">Port RTSP</label><input type="number" id="cfPort" value="$${val('port',554)}"></div>`
          + `<div class="ipf"><label class="lbl">Username</label><input type="text" id="cfUser" value="$${val('username','admin')}" autocomplete="off"></div>`
          + `<div class="ipf"><label class="lbl">Password</label><input type="password" id="cfPass" placeholder="$${edit && c.has_pass ? '(tidak diubah)' : ''}" autocomplete="new-password"></div>`
          + `<div class="ipf"><label class="lbl">Path stream</label><input type="text" id="cfPath" value="$${val('path','/live/ch00_0')}"></div>`
          + `<div class="ipf"><label class="lbl">Port ONVIF (untuk PTZ)</label><input type="number" id="cfOnvif" value="$${val('onvif_port',8899)}" placeholder="0 = tanpa PTZ"></div></div>`
          + `<div class="chk"><div><b>Suara</b><small>Ikutkan audio dari mikrofon kamera</small></div><label class="sw"><input type="checkbox" id="cfAudio" $${c.audio===false?'':'checked'}><i></i></label></div>`
          + `<div class="chk"><div><b>Rekam terus-menerus</b><small>Disimpan di server per 10 menit, dihapus otomatis sesuai batas penyimpanan</small></div><label class="sw"><input type="checkbox" id="cfRec" $${c.rec?'checked':''}><i></i></label></div>`
          + `<div class="chk"><div><b>Deteksi gerakan</b><small>Kirim notifikasi ke owner & admin yang berhak, simpan foto kejadian</small></div><label class="sw"><input type="checkbox" id="cfMot" $${c.motion?'checked':''}><i></i></label></div>`
          + `<div id="cfSensBox"><label class="lbl">Kepekaan gerakan: <span id="cfSensV">$${c.sens||50}</span></label><input type="range" id="cfSens" min="1" max="100" value="$${c.sens||50}" style="width:100%">`
          + `<div class="cct-bar" style="margin:10px 0 0"><button class="btn sm" id="cfZone" type="button">$${ic('sliders',15)}<span>Zona gerakan</span></button><span class="cct-msg" id="cfZoneT"></span></div>`
          + `<div class="chk"><div><b>Jadwal deteksi</b><small>Deteksi hanya aktif pada hari & jam tertentu</small></div><label class="sw"><input type="checkbox" id="cfSch" $${sch?'checked':''}><i></i></label></div>`
          + `<div id="cfSchBox" style="display:none"><div class="cdays" id="cfDays">$${['Sen','Sel','Rab','Kam','Jum','Sab','Min'].map((n,i) => `<label><input type="checkbox" data-d="$${i}" $${(sch?sch.days:[0,1,2,3,4,5,6]).includes(i)?'checked':''}>$${n}</label>`).join('')}</div><div class="cfld"><div><label class="lbl">Dari jam</label><input type="time" id="cfSchF" value="$${sch?sch.from:'18:00'}"></div><div><label class="lbl">Sampai jam</label><input type="time" id="cfSchT" value="$${sch?sch.to:'06:00'}"></div></div><p class="hint" style="margin:4px 0 0">Jika jam akhir lebih awal dari jam awal, jadwal melewati tengah malam. Zona waktu mengikuti browser Anda saat menyimpan.</p></div></div>`
          + `<div class="chk"><div><b>Deteksi AI (orang, kendaraan, hewan)</b><small>Gerakan dicek ulang oleh AI; hanya objek yang dipilih yang memicu notifikasi, sehingga bayangan, serangga, dan angin tidak menjadi alarm palsu.</small></div><label class="sw"><input type="checkbox" id="cfAi" $${c.ai?'checked':''}><i></i></label></div>`
          + `<div id="cfAiBox" style="display:none"><label class="lbl">Objek yang dideteksi</label><div class="dchips">$${[['person','Orang'],['vehicle','Kendaraan'],['animal','Hewan']].map(x => `<label><input type="checkbox" data-ac="$${x[0]}" $${aiCl.includes(x[0])?'checked':''}>$${x[1]}</label>`).join('')}</div>`
          + `<div class="chk"><div><b>Perkirakan usia orang</b><small>Anak / remaja / dewasa / lansia, hanya bila wajah terlihat jelas. Perkiraan kasar, bukan data pasti.</small></div><label class="sw"><input type="checkbox" id="cfAge" $${c.ai_age?'checked':''}><i></i></label></div>`
          + `<label class="lbl">Keyakinan minimum: <span id="cfAiCV">$${c.ai_conf||50}</span>%</label><input type="range" id="cfAiC" min="20" max="95" value="$${c.ai_conf||50}" style="width:100%">`
          + `<div class="cct-bar" style="margin:10px 0 0"><button class="btn sm" id="cfAiTest" type="button">$${ic('radar',15)}Uji deteksi sekarang</button><span class="cct-msg">$${edit ? 'Mengambil gambar dari kamera lalu menjalankan AI.' : 'Simpan kamera dulu untuk menguji.'}</span></div></div>`
          + `<div><label class="lbl">Timelapse: ambil gambar berkala</label><select id="cfSnapMin">$${[[0,'Mati'],[1,'Tiap 1 menit'],[5,'Tiap 5 menit'],[10,'Tiap 10 menit'],[15,'Tiap 15 menit'],[30,'Tiap 30 menit'],[60,'Tiap 1 jam']].map(x => `<option value="$${x[0]}" $${(c.snap_min||0)===x[0]?'selected':''}>$${x[1]}</option>`).join('')}</select></div>`
          + `<div class="chk"><div><b>Mode kompatibilitas (transcode)</b><small>Aktifkan jika video hitam/tidak tampil, misalnya kamera H.265. Memakai lebih banyak CPU.</small></div><label class="sw"><input type="checkbox" id="cfTr" $${c.transcode?'checked':''}><i></i></label></div>`
          + `<div class="chk"><div><b>Aktif</b></div><label class="sw"><input type="checkbox" id="cfOn" $${c.enabled===false?'':'checked'}><i></i></label></div>`
          + `<div id="cfRes"></div><div class="actions"><button class="btn" id="cfCancel">Batal</button><button class="btn" id="cfTest">Tes koneksi</button><button class="btn pri" id="cfSave">Simpan</button></div>`, 'cwide');
        const g = id => m.querySelector('#' + id);
        const preset = () => {
          if (mode === 'v380') { if (!edit || !g('cfPath').value) g('cfPath').value = '/live/ch00_0'; if (!g('cfOnvif').value || +g('cfOnvif').value === 0) g('cfOnvif').value = 8899; if (!g('cfUser').value) g('cfUser').value = 'admin'; g('cfPort').value = g('cfPort').value || 554; }
          else if (mode === 'rtsp') { if (!g('cfPath').value || g('cfPath').value === '/live/ch00_0') g('cfPath').value = '/stream1'; }
        };
        const paint = () => {
          m.querySelectorAll('.ipf').forEach(x => x.style.display = mode === 'custom' || mode === 'device' || mode === 'local' ? 'none' : ''); g('cfLocBox').style.display = mode === 'local' ? '' : 'none'; g('cfUrlBox').style.display = mode === 'custom' ? '' : 'none';
          g('cfSensBox').style.display = g('cfMot').checked || g('cfAi').checked ? '' : 'none';
          g('cfSchBox').style.display = g('cfSch').checked ? '' : 'none'; g('cfAiBox').style.display = g('cfAi').checked ? '' : 'none';
          g('cfZoneT').textContent = zone.includes('1') ? 'Zona khusus aktif (' + zone.split('').filter(x => x === '1').length + ' dari 144 kotak)' : 'Seluruh layar';
        };
        g('cfMode').value = mode; paint();
        g('cfMode').onchange = e => { mode = e.target.value; if (!edit) { if (mode === 'v380') { g('cfPath').value = '/live/ch00_0'; g('cfOnvif').value = 8899; } if (mode === 'rtsp') { g('cfPath').value = '/stream1'; g('cfOnvif').value = 0; } } else preset(); paint(); };
        g('cfMot').onchange = paint; g('cfSch').onchange = paint;
        g('cfLDet').onclick = async () => {
          try { const j = await api('cctv/hw'); g('cfLDevL').innerHTML = j.video.map(v => `<option value="$${esc(v.dev)}">$${esc(v.name)}</option>`).join(''); g('cfLAudL').innerHTML = j.audio.filter(a => a.cap).map(a => `<option value="$${esc(a.dev)}">$${esc(a.name)}</option>`).join('');
            g('cfLMsg').textContent = j.video.length ? 'Ditemukan ' + j.video.length + ' perangkat video. Pilih dari daftar pada kolom.' : 'Tidak ada /dev/video* di kontainer. Aktifkan baris devices di compose.'; if (j.video[0] && !edit) g('cfLDev').value = j.video[0].dev; } catch(er) { g('cfLMsg').textContent = er.message; }
        };
        g('cfAi').onchange = () => { if (g('cfAi').checked) g('cfMot').checked = true; paint(); };
        g('cfAiC').oninput = e => g('cfAiCV').textContent = e.target.value;
        g('cfZone').onclick = () => { if (!edit) return toast('Simpan kamera dulu, lalu ubah kamera untuk mengatur zona'); cctZone(c, zone, z => { zone = z; paint(); }); };
        g('cfAiTest').onclick = () => { if (!edit) return toast('Simpan kamera dulu untuk menguji AI'); cctAiTest(c, +g('cfAiC').value, g('cfAge').checked); };
        g('cfSens').oninput = e => g('cfSensV').textContent = e.target.value;
        const body = () => ({id:edit ? c.id : undefined, name:g('cfName').value, brand:mode, mode:mode === 'custom' ? 'custom' : mode === 'device' ? 'device' : mode === 'local' ? 'local' : 'ip', host:mode === 'local' ? g('cfLDev').value.trim() : g('cfHost').value, size:g('cfLSize').value, audio_dev:g('cfLAud').value.trim(), url:g('cfUrl').value, port:g('cfPort').value, username:g('cfUser').value, password:g('cfPass').value, path:g('cfPath').value, onvif_port:g('cfOnvif').value,
          audio:g('cfAudio').checked, rec:g('cfRec').checked, motion:g('cfMot').checked || g('cfAi').checked, sens:g('cfSens').value, transcode:g('cfTr').checked, enabled:g('cfOn').checked,
          motion_zone:zone.includes('1') ? zone : '', motion_sched:g('cfSch').checked ? JSON.stringify({days:[...m.querySelectorAll('#cfDays [data-d]:checked')].map(x => +x.dataset.d), from:g('cfSchF').value || '00:00', to:g('cfSchT').value || '23:59', tz:-new Date().getTimezoneOffset()}) : '',
          snap_min:+g('cfSnapMin').value, ai:g('cfAi').checked, ai_age:g('cfAge').checked, ai_classes:[...m.querySelectorAll('[data-ac]:checked')].map(x => x.dataset.ac).join(',') || 'person', ai_conf:+g('cfAiC').value});
        const res = (html, cls) => { g('cfRes').innerHTML = `<div class="cres $${cls||''}">$${html}</div>`; };
        g('cfCancel').onclick = () => m.remove();
        g('cfTest').onclick = async () => {
          if (mode === 'local') return res('Webcam server dites saat disimpan: buka tab Siaran langsung dan lihat statusnya. Jika "Perangkat tidak ditemukan", teruskan /dev/video0 dan /dev/snd di compose.');
          if (mode === 'device') return res('Kamera HP/laptop tidak perlu dites di sini. Simpan, lalu klik <b>Siarkan</b> di daftar kamera pada HP/laptop yang dipakai.');
          if (!g('cfName').value.trim()) g('cfName').value = 'Kamera'; g('cfTest').disabled = true; res('Menguji koneksi… (maks. 25 detik)');
          try {
            const j = await api('cctv/test', body());
            if (!j.ok) return res(esc(j.error), 'bad');
            const v = j.info.video, a = j.info.audio; let t = `Terhubung · video $${esc(String(v.codec||'?')).toUpperCase()} $${v.w||'?'}×$${v.h||'?'}$${a ? ' · audio ' + esc(a.codec) : ' · tanpa audio'}`;
            if (/hevc|265/i.test(v.codec||'') && !g('cfTr').checked) { g('cfTr').checked = true; t += '<br>Kamera memakai H.265, <b>mode kompatibilitas diaktifkan otomatis</b> agar tampil di browser.'; }
            if (+g('cfOnvif').value) t += j.ptz ? '<br>PTZ (ONVIF) didukung.' : '<br>PTZ tidak tersedia: ' + esc(j.onvif_error || 'kamera tidak melaporkan layanan PTZ') + '.';
            res(t, 'ok');
          } catch(er) { res(esc(er.message), 'bad'); } finally { g('cfTest').disabled = false; }
        };
        g('cfSave').onclick = async () => {
          g('cfSave').disabled = true;
          try { await api(edit ? 'cctv/cam/' + c.id : 'cctv/cam', body()); m.remove(); toast(edit ? 'Kamera diperbarui' : 'Kamera ditambahkan'); await CCT.load(); if (CCT.tab === 'cams') CCT.drawCams($$('#cctBody')); }
          catch(er) { res(esc(er.message), 'bad'); g('cfSave').disabled = false; }
        };
      }
      function cctZone(c, zone, done) {
        let z = (zone && zone.length === 144 ? zone : '0'.repeat(144)).split('');
        const m = modal(`<h2>Zona gerakan</h2><p class="hint" style="margin:0 0 8px">Gambar atau ketuk kotak hijau = area yang dipantau. Kosongkan semua untuk memantau seluruh layar. Kotak di luar zona diabaikan (misalnya jalan raya atau pohon).</p>`
          + `<div class="zwrap" id="zw"><img id="zImg" alt=""><div class="zgrid" id="zg">$${z.map((v, i) => `<i data-i="$${i}" class="$${v === '1' ? 'on' : ''}"></i>`).join('')}</div></div>`
          + `<div class="cct-bar" style="margin:10px 0 0"><button class="btn sm" id="zAll">Pilih semua</button><button class="btn sm" id="zNone">Kosongkan</button><button class="btn sm" id="zInv">Balik</button><span class="cct-msg" id="zMsg"></span></div>`
          + `<div class="actions"><button class="btn" id="zX">Batal</button><button class="btn pri" id="zOk">Terapkan</button></div>`, 'cwide');
