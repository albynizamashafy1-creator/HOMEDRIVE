          since = time.time() - hours * 3600
          if a.get("since_local_midnight"):
              loc = datetime.datetime.fromtimestamp(time.time() + tz * 60, datetime.timezone.utc).replace(hour=0, minute=0, second=0, microsecond=0)
              since = loc.timestamp() - tz * 60
          where, args = ["e.ts>=?"], [since]
          if a.get("camera"):
              where.append("e.cam_id=?")
              args.append(as_cam(ctx, a["camera"])["id"])
          kind = str(a.get("kind") or "")
          if kind in ("person", "vehicle", "animal", "motion"):
              where.append("e.kind=?")
              args.append(kind)
          if p["cams"] != "all" and not p.get("owner"):
              ids = [int(x) for x in p["cams"]] or [-1]
              where.append("e.cam_id IN (%s)" % ",".join("?" * len(ids)))
              args += ids
          return c.execute("SELECT e.id,e.cam_id,e.kind,e.score,e.ts,e.snap,e.info,m.name FROM cctv_events e JOIN cameras m ON m.id=e.cam_id WHERE " + " AND ".join(where)
