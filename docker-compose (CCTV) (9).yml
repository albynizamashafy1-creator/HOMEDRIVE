      def as_http(url, headers, body, timeout=60, method=None):
          req = urllib.request.Request(url, data=json.dumps(body).encode() if body is not None else None,
                                       headers=dict({"User-Agent": "HomeDrive-Assistant/1.0", "Accept": "application/json"}, **headers, **({"Content-Type": "application/json"} if body is not None else {})), method=method)
          try:
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return json.loads(r.read(5_000_000))
          except urllib.error.HTTPError as e:
              try:
                  msg = json.loads(e.read(20000))
                  msg = (msg.get("error") or {})
                  msg = msg.get("message") if isinstance(msg, dict) else str(msg)
              except Exception:
                  msg = ""
              hint = {401: " — API key salah/kedaluwarsa", 403: " — akses ditolak (cek key/wilayah)", 404: " — model/alamat tidak ditemukan", 429: " — kuota gratis habis, coba lagi nanti"}.get(e.code, "")
              raise ApiError(502, "Model bahasa menolak permintaan (HTTP %d%s)%s" % (e.code, hint, ": " + str(msg)[:160] if msg else ""), "http_%d" % e.code)
          except (urllib.error.URLError, OSError, ValueError) as e:
              if isinstance(e, ValueError):
                  raise ApiError(502, "Jawaban model bahasa bukan JSON yang valid", "badjson")
              raise ApiError(502, "Tidak bisa menghubungi model bahasa (periksa alamat dan internet server)", "net")


      def as_llm(ctx, cfg, history):
          tools = as_tools(ctx)
          system = as_system(ctx)
          if cfg["provider"] == "anthropic":
              base = cfg["url"] or "https://api.anthropic.com"
              msgs = [{"role": m["role"], "content": m["content"]} for m in history]
              tdefs = [{"name": t[0], "description": t[1], "input_schema": {"type": "object", "properties": t[2], "required": t[3]}} for t in tools]
              for _ in range(ASSIST_MAX_STEPS):
                  r = as_http(base + "/v1/messages", {"x-api-key": cfg["key"], "anthropic-version": "2023-06-01"},
                              {"model": cfg["model"] or "claude-sonnet-5-5", "max_tokens": 1200, "system": system, "tools": tdefs, "messages": msgs}, 60)
                  blocks = r.get("content") or []
                  calls = [b for b in blocks if b.get("type") == "tool_use"]
                  if not calls:
                      return "".join(b.get("text", "") for b in blocks if b.get("type") == "text").strip() or "(tidak ada jawaban)"
                  msgs.append({"role": "assistant", "content": blocks})
                  msgs.append({"role": "user", "content": [{"type": "tool_result", "tool_use_id": b["id"], "content": as_run_tool(ctx, b["name"], b.get("input"))} for b in calls]})
              return "Maaf, saya belum bisa menyelesaikan permintaan ini. Coba pertanyaan yang lebih spesifik."
          base = cfg["url"].rstrip("/")
          msgs = [{"role": "system", "content": system}] + [{"role": m["role"], "content": m["content"]} for m in history]
          tdefs = [{"type": "function", "function": {"name": t[0], "description": t[1], "parameters": {"type": "object", "properties": t[2], "required": t[3]}}} for t in tools]
          hdr = {"Authorization": "Bearer " + cfg["key"]} if cfg["key"] else {}
          tools_on = True
          for step in range(ASSIST_MAX_STEPS):
              body = {"model": cfg["model"], "messages": msgs, "max_tokens": 1200}
              if tools_on:
                  body["tools"] = tdefs
              try:
                  r = as_http(base + "/chat/completions", hdr, body, 50)
              except ApiError as e:
                  if tools_on and step == 0 and e.code in ("http_400", "http_404", "http_422"):
                      tools_on = False
                      ctx["notools"] = True
                      body.pop("tools", None)
                      r = as_http(base + "/chat/completions", hdr, body, 50)
                  else:
                      raise
              try:
                  m = r["choices"][0]["message"]
              except (KeyError, IndexError, TypeError):
                  raise ApiError(502, "Jawaban model bahasa tidak dikenali")
              calls = m.get("tool_calls") or []
              if not calls:
                  cont = m.get("content")
                  if isinstance(cont, list):
                      cont = "".join(x.get("text", "") for x in cont if isinstance(x, dict))
                  cont = re.sub(r"<think>.*?</think>", "", cont or "", flags=re.S).strip()
                  if not cont:
                      raise ApiError(502, "Model mengembalikan jawaban kosong", "empty")
                  return cont
              for i, tc in enumerate(calls):
                  tc.setdefault("id", "call_%d_%d" % (step, i))
                  tc.setdefault("type", "function")
              msgs.append({"role": "assistant", "content": m.get("content") or "", "tool_calls": calls})
              for tc in calls:
                  try:
                      args = json.loads(tc["function"].get("arguments") or "{}")
                  except ValueError:
                      args = {}
                  msgs.append({"role": "tool", "tool_call_id": tc["id"], "content": as_run_tool(ctx, tc["function"]["name"], args)})
          return "Maaf, saya belum bisa menyelesaikan permintaan ini. Coba pertanyaan yang lebih spesifik."


      def as_basic(ctx, text):
          """Mode dasar tanpa model bahasa: menjawab pertanyaan umum lewat kata kunci, memakai alat yang sama."""
          t = text.lower()
          has = lambda *w: any(x in t for x in w)
          cctv = ctx["p"].get("any")
          hours = 24.0
          args = {}
          if has("hari ini"):
              args["since_local_midnight"] = True
          elif has("semalam", "tadi malam"):
              hours = 12
          elif has("kemarin"):
              hours = 48
          elif has("minggu"):
              hours = 168
          elif has("jam terakhir", "barusan", "tadi"):
              hours = 3
          args.setdefault("hours_back", hours)
          for words, k in ((("orang", "maling", "tamu"), "person"), (("mobil", "motor", "kendaraan", "truk"), "vehicle"), (("hewan", "kucing", "anjing", "binatang"), "animal")):
              if has(*words):
                  args["kind"] = k
                  break
          file_q = has("cari", "carikan", "mana") and has("foto", "file", "gambar", "dokumen") and not has("kamera", "cctv", "kejadian")
          if cctv and not file_q:
              cams = tool_cameras(ctx, {})["kamera"]
              for cm in cams:
                  if cm["nama"].lower() in t:
                      args["camera"] = cm["nama"]
              if has("sekarang", "lihat", "live", "saat ini") and has("kamera", "cctv", "teras", "pintu", "depan", "belakang") and ctx["p"].get("snap"):
                  try:
                      r = tool_look_now(ctx, {"camera": args.get("camera", "")})
                      ctx["used"].append("cctv_look_now")
                      objs = ", ".join("%s (%d%%)" % (o["jenis"], o["yakin"]) for o in r.get("objek_terlihat", [])) or "tidak ada orang, kendaraan, atau hewan yang terdeteksi"
                      return "Di kamera **%s** sekarang: %s." % (r["kamera"], objs)
                  except ValueError as e:
                      return str(e)
              if has("kamera", "cctv", "gerak", "kejadian", "terdeteksi", "lewat", "maling", "masuk", "keamanan", "rekam") or ("kind" in args and has("ada ", "terlihat", "semalam", "hari ini", "tadi")):
                  if has("ringkas", "berapa", "jumlah", "statistik", "rekap"):
                      r = tool_event_summary(ctx, args)
                      ctx["used"].append("cctv_summary")
                      if not r["total"]:
                          return "Tidak ada kejadian CCTV pada rentang waktu itu."
                      lines = ["**%d kejadian.**" % r["total"]] + ["- %s: %s" % (k, ", ".join("%s %d" % (a, b) for a, b in v.items())) for k, v in r["per_kamera"].items()]
                      if r["jam_tersibuk"]:
                          lines.append("Jam tersibuk: " + ", ".join("%s (%d)" % (x["jam"], x["jumlah"]) for x in r["jam_tersibuk"]))
                      return "\n".join(lines)
                  r = tool_events(ctx, dict(args, limit=10))
                  ctx["used"].append("cctv_events")
                  if not r["jumlah"]:
                      return "Tidak ada kejadian%s pada rentang waktu itu." % (" " + ID_KIND[args["kind"]] if args.get("kind") else "")
                  return "Ada **%d kejadian** terbaru:\n" % r["jumlah"] + "\n".join("- %s · %s · %s%s" % (e["waktu"], e["kamera"], e["jenis"], " (" + e["deteksi"] + ")" if e["deteksi"] else "") for e in r["kejadian"])
          if has("penyimpanan", "kuota", "ruang", "kapasitas", "sisa"):
              r = tool_storage(ctx, {})
              ctx["used"].append("storage_summary")
              return "Terpakai **%s** dari kuota %s.\n" % (r["terpakai"], r["kuota"]) + "\n".join("- %s: %s" % (k, v) for k, v in r["per_jenis"].items())
          if has("kembar", "duplikat", "bersihkan", "rapikan") or (has("buram", "gelap") and not has("cari", "tampilkan", "mana", "foto yang", "carikan")):
              r = tool_photo_insights(ctx, {})
              ctx["used"].append("photo_insights")
              return "Dari %d foto yang dianalisis: **%d buram**, **%d gelap**, dan **%d foto kembar** (bisa dihapus) dalam %d kelompok. Buka menu **AI Pintar** untuk membersihkannya." % (
                  r["foto_dianalisis"], r["buram"], r["gelap"], r["foto_kembar_bisa_dihapus"], r["kelompok_foto_kembar"])
          stop = {"cari", "carikan", "foto", "file", "gambar", "dokumen", "yang", "ada", "tolong", "saya", "milik", "dong", "tampilkan", "lihat", "di", "dan", "tentang", "berisi"}
          words = [w for w in re.findall(r"[a-z0-9-]{3,}", t) if w not in stop]
          if words and has("cari", "foto", "file", "gambar", "dokumen", "mana"):
              r = tool_search_files(ctx, {"query": words[0]})
              ctx["used"].append("search_files")
              if not r["jumlah"]:
                  return "Tidak ada file yang cocok dengan \"%s\"." % words[0]
              return "Ditemukan **%d file** untuk \"%s\":\n" % (r["jumlah"], words[0]) + "\n".join("- %s (%s)%s" % (x["nama"], x["ukuran"], " · " + x["label_ai"] if x["label_ai"] else "") for x in r["hasil"])
          mr = as_basic_math(ctx, t, has)
          if mr:
              return mr
          expr = re.sub(r"(?i)^(berapa|hitung|hitunglah|berapakah)\s+", "", t.strip(" ?=")).strip()
          if re.fullmatch(r"[0-9+\-*/^%().,x\s]{3,}", expr) and re.search(r"\d\s*[-+*/^%x]\s*\d", expr):
              try:
                  ctx["used"].append("calculator")
                  return "Hasilnya **%s**." % tool_calc(ctx, {"expression": expr})["hasil"]
              except ValueError as e:
                  return "Maaf, " + str(e)
          if has("jam berapa", "tanggal berapa", "hari apa", "hari ini hari"):
              return "Sekarang " + datetime.datetime.fromtimestamp(time.time() + ctx["tz"] * 60, datetime.timezone.utc).strftime("%d/%m/%Y pukul %H:%M") + " (waktu perangkat Anda)."
          topic = re.sub(r"(?i)^(tolong\s+)?(jelaskan|ceritakan|terangkan|apa itu|apa yang dimaksud(?: dengan)?|apakah|apa|siapa itu|siapa|di mana|dimana|kapan|bagaimana|kenapa|mengapa|sebutkan|definisi)\s+", "", text.strip(" ?!.")).strip()
          if len(topic) >= 3 and (has("apa", "siapa", "jelaskan", "ceritakan", "kenapa", "mengapa", "bagaimana", "kapan", "dimana", "di mana", "definisi", "sejarah", "arti")):
              try:
                  r = tool_wiki(ctx, {"query": topic})
                  ctx["used"].append("wikipedia")
                  return "**%s**\n%s\n\nSumber: %s%s. (Mode dasar hanya merangkum Wikipedia; hubungkan model bahasa di Pengaturan untuk jawaban bebas.)" % (r["judul"], r["ringkasan"], r["sumber"], " — " + r["url"] if r["url"] else "")
              except ValueError as e:
                  return "Saya belum bisa menjawab itu: %s. Hubungkan model bahasa (Claude/Ollama) di **Pengaturan** agar saya bisa menjawab semua pertanyaan." % e
          return ("Saya masih dalam **mode dasar** (belum terhubung ke model bahasa), jadi hanya paham kata kunci sederhana. Coba:\n- \"Ada orang lewat semalam?\"\n- \"Ringkas kejadian CCTV hari ini\"\n"
                  "- \"Cari foto kucing\"\n- \"Berapa sisa penyimpanan saya?\"\n- \"Ada foto kembar?\"\n\nOwner dapat menghubungkan model bahasa (Claude, Ollama, dll.) lewat tombol pengaturan agar saya bisa menjawab bebas.")


      def api_assistant(self, method, name, q):
          u = self.need_user()
          parts = name.split("/")
          sub = parts[1] if len(parts) > 1 else ""
          with db() as c:
              cfg = as_cfg(c)
              p = cctv_perms(c, u)
              provs = as_provs(c)
              chain = as_chain(c)
              if method == "GET" and sub == "config":
                  d = {"ready": bool(chain), "providers_n": len(chain), "provider": cfg["provider"], "model": chain[0]["model"] if chain else "", "cctv": bool(p.get("any")), "owner": bool(u["is_owner"]),
                       "names": [x["name"] for x in chain]}
                  if u["is_owner"]:
                      d.update(presets=AS_PRESETS, providers=[{"id": x.get("id"), "name": x.get("name"), "kind": x.get("kind", "openai"), "url": x.get("url", ""), "model": x.get("model", ""),
                                                                "enabled": x.get("enabled", True), "has_key": bool(dec_secret(x.get("key") or ""))} for x in provs])
                  return self.send_json(d)
              if method == "POST" and sub in ("config", "models") and not u["is_owner"]:
                  raise ApiError(403, "Hanya owner")
              if method == "POST" and sub == "config":
                  d = self.read_json()
                  lst = d.get("providers")
                  if not isinstance(lst, list) or len(lst) > 12:
                      raise ApiError(400, "Daftar penyedia tidak valid (maks. 12)")
                  old = {x.get("id"): x for x in provs}
                  new, seen = [], set()
                  for x in lst:
                      if not isinstance(x, dict):
                          continue
                      pid = re.sub(r"[^\w-]", "", str(x.get("id") or ""))[:24] or ("p" + secrets.token_hex(3))
                      if pid in seen:
                          pid = "p" + secrets.token_hex(3)
                      seen.add(pid)
                      url = str(x.get("url") or "").strip().rstrip("/")[:200]
                      kind = "anthropic" if x.get("kind") == "anthropic" else "openai"
                      if url and not re.fullmatch(r"https?://[^\s'\"<>]{3,190}", url):
                          raise ApiError(400, "Alamat harus diawali http:// atau https://")
                      if kind == "openai" and not url:
                          raise ApiError(400, "Alamat API wajib untuk " + str(x.get("name") or "penyedia"))
                      key = old.get(pid, {}).get("key", "")
                      if x.get("clear_key"):
                          key = ""
                      elif str(x.get("key") or "").strip():
                          key = enc_secret(str(x["key"]).strip()[:400])
                      new.append({"id": pid, "name": (str(x.get("name") or "").strip() or "AI")[:40], "kind": kind, "url": url,
                                  "model": re.sub(r"[^\w.:/@+-]", "", str(x.get("model") or ""))[:100], "key": key, "enabled": bool(x.get("enabled", True))})
                  set_setting(c, "as_providers", json.dumps(new))
                  for k in ("as_url", "as_key", "as_model"):
                      set_setting(c, k, "")
                  log(c, u["id"], "config", "Mengubah pengaturan asisten AI (%d penyedia)" % len(new))
                  return self.send_json({"ok": True})
              if method == "POST" and sub in ("models", "test"):
                  d = self.read_json()
                  pid = str(d.get("id") or "")
                  base = next((x for x in provs if x.get("id") == pid), {})
                  pv = dict(base)
                  for k in ("kind", "url", "model"):
                      if d.get(k) is not None:
                          pv[k] = d[k]
                  if str(d.get("key") or "").strip():
                      pv["key"] = enc_secret(str(d["key"]).strip()[:400])
                  pcfg = as_pv_cfg(pv)
                  if sub == "models":
                      if pcfg["provider"] == "openai" and not pcfg["url"]:
                          raise ApiError(400, "Isi alamat API dulu")
                      return self.send_json({"models": as_list_models(pcfg)})
                  if not as_ready(pcfg):
                      raise ApiError(400, "Lengkapi alamat, model" + (" dan API key" if pcfg["provider"] == "anthropic" else "") + " dulu")
                  tctx = {"c": c, "u": u, "p": {"any": False}, "self": self, "tz": 0, "att": [], "used": [], "subject": "", "level": "sma"}
                  t0 = time.time()
                  rep_ = as_llm(tctx, pcfg, [{"role": "user", "content": "Balas hanya dengan satu kata: siap"}])
                  return self.send_json({"ok": True, "reply": rep_[:200], "ms": int((time.time() - t0) * 1000), "tools": not tctx.get("notools")})
              if method == "POST" and sub == "chat":
                  d = self.read_json()
                  tz = _int(d.get("tz"), 0, -840, 840)
                  sbj, lvl = str(d.get("subject") or ""), str(d.get("level") or "")
                  ctx = {"c": c, "u": u, "p": p, "self": self, "tz": tz, "att": [], "used": [], "subject": sbj if sbj in SUBJECTS else "", "level": lvl if lvl in LEVELS else "sma"}
                  msgs = [m for m in (d.get("messages") or [])[-16:] if isinstance(m, dict) and m.get("role") in ("user", "assistant") and isinstance(m.get("content"), str) and m["content"].strip()]
                  if not msgs or msgs[-1]["role"] != "user":
                      raise ApiError(400, "Pesan kosong")
                  msgs = [{"role": m["role"], "content": m["content"][:4000]} for m in msgs]
                  only = str(d.get("provider") or "") or None
                  chain = as_chain(c, only) if only else chain
                  reply, mode, used, errs = None, "basic", "", []
                  for pcfg in chain:
                      ctx["used"], ctx["att"] = [], []
                      ctx.pop("notools", None)
                      try:
                          reply, mode, used = as_llm(ctx, pcfg, msgs), "llm", pcfg["name"]
                          break
                      except ApiError as e:
                          errs.append("%s: %s" % (pcfg["name"], str(getattr(e, "msg", e))[:150]))
                  if reply is None:
                      ctx["used"], ctx["att"] = [], []
                      reply = as_basic(ctx, msgs[-1]["content"])
                      if errs:
                          reply += "\n\n(⚠ Semua AI online gagal sehingga dijawab dengan mode dasar: " + " | ".join(errs)[:400] + ")"
                  return self.send_json({"reply": reply, "mode": mode, "provider": used, "fallbacks": errs[:6], "notools": bool(ctx.get("notools")),
                                         "attachments": ctx["att"][:8], "tools": list(dict.fromkeys(ctx["used"]))})
          raise ApiError(404, "Endpoint tidak ada")


      Handler.api_assistant = api_assistant


      # ===================== Mode AI siaran langsung: kotak deteksi + nomor pelacak + usia =====================
      LIVEAI = {}
      LIVEAI_LOCK = threading.Lock()


      def _iou(a, b):
          ix = max(0.0, min(a[2], b[2]) - max(a[0], b[0]))
          iy = max(0.0, min(a[3], b[3]) - max(a[1], b[1]))
          inter = ix * iy
          u = (a[2] - a[0]) * (a[3] - a[1]) + (b[2] - b[0]) * (b[3] - b[1]) - inter
          return inter / u if u > 0 else 0.0


      def liveai_track(S, dets, now):
          tr = S.setdefault("tracks", [])
          S.setdefault("next", 1)
          used = set()
          for d in sorted(dets, key=lambda x: -x["conf"]):
              best, bi = None, 0.25
              for t in tr:
                  if t["id"] in used or t["group"] != d["group"]:
                      continue
                  v = _iou(t["box"], d["box"])
                  if v > bi:
                      best, bi = t, v
              if best is None:
                  best = {"id": S["next"], "group": d["group"], "age": None}
                  S["next"] += 1
                  tr.append(best)
              used.add(best["id"])
              best.update(box=d["box"], seen=now)
              d["id"] = best["id"]
              ag = d.get("age")
              if ag and ag.get("face"):
                  best["age"] = ag
              elif best.get("age"):
                  d["age"] = dict(best["age"], stale=True)
          S["tracks"] = [t for t in tr if now - t["seen"] < 6]


      def liveai_job(cid):
          S = LIVEAI[cid]
          try:
              with db() as c:
                  r = c.execute("SELECT * FROM cameras WHERE id=?", (cid,)).fetchone()
              if not r:
                  return
              cam = dict(r)
              jpg = cam_snapshot(cam, late=True)
              if not jpg:
                  S.update(err="Belum ada gambar dari kamera (offline?)", t=time.time())
                  return
              res = ai_request("/detect?conf=%.2f%s" % (max(0.3, int(cam.get("ai_conf") or 50) / 100.0 - 0.1), "&age=1" if cam.get("ai_age") else ""), jpg, 30)
              if res is None:
                  S.update(err=AI.get("why") or "Layanan AI tidak menjawab", t=time.time())
                  return
              now = time.time()
              dets = [d for d in res.get("detections", []) if d.get("group") in ("person", "vehicle", "animal")]
              liveai_track(S, dets, now)
              S.update(err="", t=now, jpg=jpg, dets=dets, w=res.get("w"), h=res.get("h"), mode=res.get("mode"), age_ready=bool(res.get("age_ready")), seq=S.get("seq", 0) + 1)
          except Exception as e:  # noqa
              S["err"] = "Gagal: %s" % str(e)[:80]
          finally:
              S["busy"] = False


      def liveai_loop():
          while True:
              time.sleep(0.25)
              now = time.time()
              for cid, S in list(LIVEAI.items()):
                  if now - S.get("want", 0) > 10:
                      if now - S.get("want", 0) > 60:
                          LIVEAI.pop(cid, None)
                      continue
                  if S.get("busy") or now - S.get("t", 0) < 0.6:
                      continue
                  S["busy"] = True
                  threading.Thread(target=liveai_job, args=(cid,), daemon=True).start()


      def liveai_get(cam_id, since):
          if not AI_URL:
              raise ApiError(503, "Layanan AI belum dipasang (service cctv-ai).")
          with LIVEAI_LOCK:
              S = LIVEAI.setdefault(cam_id, {})
          S["want"] = time.time()
          cctv_wake(cam_id)
          if S.get("seq", 0) == since:
              return {"seq": since, "same": True, "err": S.get("err", "")}
          return {"seq": S.get("seq", 0), "err": S.get("err", ""), "w": S.get("w"), "h": S.get("h"), "mode": S.get("mode"), "age_ready": S.get("age_ready"),
                  "dets": [{"id": d.get("id"), "label": d["label"], "group": d["group"], "conf": d["conf"], "box": d["box"], "age": d.get("age")} for d in S.get("dets", [])],
                  "img": base64.b64encode(S["jpg"]).decode() if S.get("jpg") else ""}


      def cctv_tick_soon():
          threading.Thread(target=lambda: (time.sleep(0.3), cctv_tick()), daemon=True).start()


      def api_cctv(self, method, name, q):
          u = self.need_user()
          parts = name.split("/")
          sub = parts[1] if len(parts) > 1 else ""
          with db() as c:
              p = cctv_perms(c, u)
              if not p["any"]:
                  raise ApiError(403, "Anda belum diberi akses CCTV oleh owner", "no_cctv")
              out = cctv_dispatch(self, c, u, p, method, sub, parts, q)
          if callable(out):
              out()


      Handler.api_cctv = api_cctv


      def janitor():
          """Bersihkan sampah yang lebih tua dari TRASH_DAYS dan sesi kedaluwarsa."""
          while True:
              try:
                  with db() as c:
                      c.execute("DELETE FROM sessions WHERE expires<?", (time.time(),))
                      c.execute("DELETE FROM activity WHERE ts<?", (time.time() - 180 * 86400,))
                      if trash_days() > 0:
                          cut = time.time() - trash_days() * 86400
                          ids = [r["id"] for r in c.execute(
                              "SELECT id FROM items WHERE trashed=1 AND trashed_at IS NOT NULL AND trashed_at<? AND "
                              "(parent_id IS NULL OR parent_id NOT IN (SELECT id FROM items WHERE trashed=1))", (cut,)).fetchall()]
                          if ids:
                              Handler.purge(None, c, ids)
                              EVENTS.emit("files")
                      for r in c.execute("SELECT id FROM users WHERE is_owner=0").fetchall():
                          sync_warn(c, r["id"])
                  if BACKUP_HOURS > 0:
                      autos = sorted(BACKUPS.glob("auto-*.db"), key=lambda p: p.stat().st_mtime)
                      if not autos or time.time() - autos[-1].stat().st_mtime >= BACKUP_HOURS * 3600 - 60:
                          make_backup("auto")
                          prune_backups()
                  EVENTS.flush()
              except Exception as e:  # noqa
                  sys.stderr.write("janitor: %r\n" % (e,))
              time.sleep(3600)


      def main():
          init_db()
          cctv_boot()
          threading.Thread(target=janitor, daemon=True).start()
          threading.Thread(target=sched_loop, daemon=True).start()
          for p in TMP.glob("*"):
              p.unlink(missing_ok=True)
          srv = ThreadingHTTPServer((HOST, PORT), Handler)
          srv.daemon_threads = True
          print(f"HomeDrive berjalan di http://{HOST}:{PORT}  (data: {DATA})")
          try:
              srv.serve_forever()
          except KeyboardInterrupt:
              pass


      if __name__ == "__main__":
          main()
