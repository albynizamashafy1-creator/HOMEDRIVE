      def _ham(a, b):
          return bin(a ^ b).count("1")


      def smart_dupes(c, uid, maxd=5):
          rows = c.execute("SELECT i.*, a.hash h FROM items i JOIN ai_files a ON a.item_id=i.id WHERE i.user_id=? AND i.trashed=0 AND a.ok=1 AND a.hash!=''", (uid,)).fetchall()
          vals = []
          for r in rows:
              try:
                  vals.append(int(r["h"], 16))
              except ValueError:
                  vals.append(0)
          n = len(rows)
          parent = list(range(n))

          def find(x):
              while parent[x] != x:
                  parent[x] = parent[parent[x]]
                  x = parent[x]
              return x
          chunks = maxd + 1
          width = 64 // chunks + 1
          for ci in range(chunks):
              sh = ci * width
              bucket = {}
              for i, v in enumerate(vals):
                  bucket.setdefault((v >> sh) & ((1 << width) - 1), []).append(i)
              for ids in bucket.values():
                  if len(ids) < 2 or len(ids) > 400:
                      continue
                  for x in range(len(ids)):
                      for y in range(x + 1, len(ids)):
                          a, b = ids[x], ids[y]
                          if find(a) != find(b) and _ham(vals[a], vals[b]) <= maxd:
                              parent[find(a)] = find(b)
          groups = {}
          for i in range(n):
              groups.setdefault(find(i), []).append(i)
          out = []
          for g in groups.values():
              if len(g) < 2:
                  continue
              g.sort(key=lambda i: -rows[i]["size"])
              out.append([item_dict(rows[i]) for i in g])
          out.sort(key=lambda g: -len(g))
          return out[:60]


      def api_ai(self, method, name, q):
          u = self.need_user()
          parts = name.split("/")
          sub = parts[1] if len(parts) > 1 else ""
          uid = u["id"]
          with db() as c:
              if method == "GET" and sub == "status":
                  st = ai_status() if AI_URL else {"ok": False, "off": True, "error": "Layanan AI belum dipasang (service cctv-ai di docker-compose)."}
                  tot = c.execute("SELECT COUNT(*) n FROM items i WHERE i.user_id=? AND i.is_folder=0 AND i.trashed=0 AND " + _IMG_SQL, (uid,)).fetchone()["n"]
                  done = c.execute("SELECT COUNT(*) n FROM items i JOIN ai_files a ON a.item_id=i.id WHERE i.user_id=? AND i.trashed=0 AND a.ok=1", (uid,)).fetchone()["n"]
                  fail = c.execute("SELECT COUNT(*) n FROM items i JOIN ai_files a ON a.item_id=i.id WHERE i.user_id=? AND i.trashed=0 AND a.ok=0", (uid,)).fetchone()["n"]
                  cnt = collections.Counter()
                  for r in c.execute("SELECT a.tags FROM items i JOIN ai_files a ON a.item_id=i.id WHERE i.user_id=? AND i.trashed=0 AND a.ok=1", (uid,)).fetchall():
                      for t in r["tags"].split():
                          if t not in TAG_EN.values():
                              cnt[t] += 1
                  return self.send_json({"ai": st, "index_on": get_setting(c, "ai_index", "1") == "1", "images": tot, "done": done, "failed": fail,
                                         "busy": SMART["busy"], "tags": cnt.most_common(30), "owner": bool(u["is_owner"])})
              if method == "GET" and sub == "review":
                  kind = (q.get("kind") or [""])[0]
                  if kind == "dupes":
                      return self.send_json({"groups": smart_dupes(c, uid)})
                  if kind in ("blurry", "dark"):
                      tag = "% buram %" if kind == "blurry" else "% gelap %"
                      rows = c.execute("SELECT i.* FROM items i JOIN ai_files a ON a.item_id=i.id WHERE i.user_id=? AND i.trashed=0 AND a.ok=1 AND a.tags LIKE ? "
                                       "ORDER BY i.modified DESC LIMIT 200", (uid, tag)).fetchall()
                      return self.send_json({"items": [item_dict(r) for r in rows]})
                  raise ApiError(400, "Jenis tidak dikenal")
              if method == "POST":
                  d = self.read_json()
                  if sub == "index":
                      if not u["is_owner"]:
                          raise ApiError(403, "Hanya owner")
                      set_setting(c, "ai_index", "1" if d.get("on") else "0")
                      SMART["poke"].set()
                      return self.send_json({"ok": True})
                  if sub == "retry":
                      if d.get("all") and u["is_owner"]:
                          c.execute("DELETE FROM ai_files")
                      else:
                          c.execute("DELETE FROM ai_files WHERE ok=0")
                      SMART["poke"].set()
                      return self.send_json({"ok": True})
                  if sub == "poke":
                      SMART["poke"].set()
                      return self.send_json({"ok": True})
          raise ApiError(404, "Endpoint tidak ada")


