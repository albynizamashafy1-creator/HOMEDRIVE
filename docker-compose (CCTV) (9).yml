      def tool_convert(ctx, a):
          v, u1, u2 = float(a.get("value")), str(a.get("from") or "").lower().strip(), str(a.get("to") or "").lower().strip()
          t = {"c": 0, "f": 1, "k": 2, "celsius": 0, "fahrenheit": 1, "kelvin": 2}
          if u1 in t and u2 in t:
              c = v if t[u1] == 0 else (v - 32) * 5 / 9 if t[u1] == 1 else v - 273.15
              r = c if t[u2] == 0 else c * 9 / 5 + 32 if t[u2] == 1 else c + 273.15
              return {"hasil": round(r, 6), "satuan": u2}
          for tab in _UNITS.values():
              if u1 in tab and u2 in tab:
                  return {"hasil": round(v * tab[u1] / tab[u2], 10), "satuan": u2}
          raise ValueError("Satuan tidak dikenal (didukung: panjang, massa, volume, waktu, suhu)")


      def tool_geometry(ctx, a):
          sh = str(a.get("shape") or "").lower().replace(" ", "_")
          p = {}
          for k, v in (a.get("values") or {}).items():
              try:
                  p[str(k).lower()] = float(v)
              except (TypeError, ValueError):
                  pass
          pi = _math.pi
          g = lambda *k: next((p[x] for x in k if x in p), None)
          try:
              if sh == "lingkaran":
                  r = g("r", "jari-jari") if g("r", "jari-jari") is not None else g("d", "diameter") / 2
                  return {"luas": round(pi * r * r, 4), "keliling": round(2 * pi * r, 4), "rumus": "L = πr², K = 2πr, dengan π ≈ 3,1416"}
              if sh == "persegi":
                  s_ = g("sisi", "s")
                  return {"luas": s_ * s_, "keliling": 4 * s_, "rumus": "L = s², K = 4s"}
              if sh == "persegi_panjang":
                  return {"luas": g("p") * g("l"), "keliling": 2 * (g("p") + g("l")), "rumus": "L = p × l, K = 2(p + l)"}
              if sh == "segitiga":
                  return {"luas": 0.5 * g("alas", "a") * g("tinggi", "t"), "rumus": "L = ½ × alas × tinggi"}
              if sh == "kubus":
                  s_ = g("sisi", "s")
                  return {"volume": s_ ** 3, "luas_permukaan": 6 * s_ * s_, "rumus": "V = s³, LP = 6s²"}
              if sh == "balok":
                  return {"volume": g("p") * g("l") * g("t"), "luas_permukaan": 2 * (g("p") * g("l") + g("p") * g("t") + g("l") * g("t")), "rumus": "V = p × l × t, LP = 2(pl + pt + lt)"}
              if sh == "tabung":
                  r, t = g("r", "jari-jari"), g("t", "tinggi")
                  return {"volume": round(pi * r * r * t, 4), "luas_permukaan": round(2 * pi * r * (r + t), 4), "rumus": "V = πr²t, LP = 2πr(r + t)"}
          except TypeError:
              raise ValueError("Nilai yang dibutuhkan kurang lengkap untuk bangun %s" % sh)
          raise ValueError("Bangun tidak didukung (lingkaran, persegi, persegi_panjang, segitiga, kubus, balok, tabung)")


