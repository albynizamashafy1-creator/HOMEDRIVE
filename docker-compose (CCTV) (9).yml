      const fmtGB = g => g ? (+g)+' GB' : 'tanpa batas';
      function onLive(m, fn) { const h = t => { if (!document.body.contains(m)) LIVE.delete(h); else fn(t); }; LIVE.add(h); }
      function setBadge() {
        const b = $$('#bellBtn'); if (!b) return;
