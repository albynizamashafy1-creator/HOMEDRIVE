        const pct = j.disk.total ? Math.min(100, (j.disk.total - j.disk.free) / j.disk.total * 100) : 0;
        b.innerHTML = `<div class="pgrid"><div class="c6">$${panel('Status server', `<div class="setrow" style="padding-top:0"><div class="st"><b>ffmpeg</b><small>$${j.ffmpeg ? 'Terpasang · ' + esc(j.ffver) : 'Belum terpasang — pasang otomatis saat kontainer dijalankan dengan internet'}</small></div><span class="cdot $${j.ffmpeg?'on':'bad'}"></span></div>`
            + `<div class="setrow"><div class="st"><b>Disk server</b><small>$${fmtSize(j.disk.free)} kosong dari $${fmtSize(j.disk.total)}</small><div class="cbar" style="margin-top:8px"><b style="width:$${pct}%"></b></div></div></div>`
            + `<div class="setrow" style="border:0"><div class="st"><b>Rekaman CCTV</b><small>$${fmtSize(j.total)} total</small></div></div>`
            + CCT.cams.map(c => { const u = j.usage[c.id] || {size:0, count:0}; return `<div class="setrow"><div class="st"><b>$${esc(c.name)}</b><small>$${u.count} berkas · $${fmtSize(u.size)}</small></div></div>`; }).join(''))}</div>`
          + `<div class="c6">$${panel('Kebijakan rekaman', `<label class="lbl" style="margin-top:0">Simpan rekaman selama (hari) — 0 = tanpa batas waktu</label><input type="number" id="syDays" min="0" max="3650" value="$${j.keep_days}"><label class="lbl">Batas total ruang rekaman (GB) — 0 = tanpa batas</label><input type="number" id="syGb" min="0" step="1" value="$${j.max_gb}"><p class="hint">Rekaman terlama dihapus otomatis bila batas terlampaui atau disk tersisa kurang dari 1 GB. Pembersihan berjalan tiap 10 menit.</p><div style="margin-top:14px"><button class="btn pri" id="sySave">Simpan</button></div>`)}</div></div>`;
        b.querySelector('#sySave').onclick = async () => { try { await api('cctv/settings', {keep_days:b.querySelector('#syDays').value, max_gb:b.querySelector('#syGb').value}); toast('Pengaturan disimpan'); } catch(er) { toast(er.message); } };
      };


      /* ---------- timelapse ---------- */
      CCT.tlS = {cam:null, from:null, to:null, fps:12};
      CCT.drawTl = async function(b) {
        const T = CCT.tlS, cams = CCT.cams;
        if (!cams.length) { b.innerHTML = emptyBox('camera', 'Belum ada kamera', 'Belum ada kamera yang bisa Anda lihat.'); return; }
        if (!T.cam || !cams.some(c => c.id === T.cam)) T.cam = (cams.find(c => c.snap_min) || cams[0]).id;
        if (!T.to) T.to = cDay(new Date()); if (!T.from) T.from = T.to;
        const cam = CCT.cam(T.cam), f = new Date(T.from + 'T00:00:00').getTime() / 1000, t = new Date(T.to + 'T00:00:00').getTime() / 1000 + 86400;
        b.innerHTML = `<div class="cct-bar"><select id="tlCam" style="width:auto;min-width:160px">$${cams.map(c => `<option value="$${c.id}" $${c.id===T.cam?'selected':''}>$${esc(c.name)}$${c.snap_min?'':' (timelapse mati)'}</option>`).join('')}</select><input type="date" id="tlF" value="$${T.from}" style="width:auto"><span>–</span><input type="date" id="tlT" value="$${T.to}" style="width:auto"></div><div id="tlBody"><div class="adm-loading"><div class="sk"></div></div></div>`;
        b.querySelector('#tlCam').onchange = e => { T.cam = +e.target.value; CCT.drawTl(b); };
        b.querySelector('#tlF').onchange = e => { if (e.target.value) { T.from = e.target.value; if (T.to < T.from) T.to = T.from; CCT.drawTl(b); } };
        b.querySelector('#tlT').onchange = e => { if (e.target.value) { T.to = e.target.value; if (T.to < T.from) T.from = T.to; CCT.drawTl(b); } };
        let j; try { j = await api(`cctv/tl/$${T.cam}?from=$${f}&to=$${t}`); } catch(e) { $$('#tlBody').innerHTML = emptyBox('alert', 'Gagal memuat', esc(e.message)); return; }
        const body = $$('#tlBody'); if (!body) return;
        const items = j.items;
        if (!items.length) { body.innerHTML = emptyBox('camera', 'Belum ada gambar', cam.snap_min ? 'Gambar diambil tiap ' + cam.snap_min + ' menit. Pilih rentang tanggal lain atau tunggu gambar pertama.' : 'Timelapse belum diaktifkan untuk kamera ini.' + (S.me.is_owner ? ' Aktifkan di tab Kamera → Ubah → "Timelapse: ambil gambar berkala".' : '')); return; }
        body.innerHTML = `<img class="tlprev" id="tlImg" alt=""><input type="range" id="tlR" min="0" max="$${items.length - 1}" value="$${items.length - 1}" style="width:100%;margin-top:10px"><div class="cct-bar"><span class="cct-msg" id="tlWhen"></span><button class="btn sm" id="tlPlay">$${ic('play',15)}Putar</button></div>`
          + panel('Buat video timelapse', `<p class="hint" style="margin:0 0 8px">$${items.length}$${j.total > items.length ? ' (tampil terbaru)' : ''} gambar pada rentang ini · interval $${cam.snap_min || '?'} menit.</p><div class="cct-bar"><label class="lbl" style="margin:0">Kecepatan</label><select id="tlFps" style="width:auto">$${[[6,'Lambat (6 gambar/dtk)'],[12,'Sedang (12 gambar/dtk)'],[24,'Cepat (24 gambar/dtk)'],[30,'Sangat cepat (30 gambar/dtk)']].map(x => `<option value="$${x[0]}" $${x[0]===T.fps?'selected':''}>$${x[1]}</option>`).join('')}</select><button class="btn pri sm" id="tlMake">$${ic('download',15)}Buat & unduh MP4</button>$${S.me.is_owner?`<button class="btn sm dng" id="tlDel">$${ic('trash',15)}Hapus semua gambar</button>`:''}</div><div id="tlRes"></div>`);
        const img = $$('#tlImg'), rg = $$('#tlR'), show = () => { const it = items[+rg.value]; img.src = `/api/cctv/tlimg/$${T.cam}/$${it.name}`; $$('#tlWhen').textContent = fmtDT(it.ts); };
        rg.oninput = show; show();
        let tm = null; $$('#tlPlay').onclick = () => { if (tm) { clearInterval(tm); tm = null; $$('#tlPlay').innerHTML = ic('play',15) + 'Putar'; return; } if (+rg.value >= items.length - 1) rg.value = 0; $$('#tlPlay').innerHTML = ic('x',15) + 'Berhenti'; tm = setInterval(() => { if (!document.body.contains(rg) || +rg.value >= items.length - 1) { clearInterval(tm); tm = null; const pb = $$('#tlPlay'); if (pb) pb.innerHTML = ic('play',15) + 'Putar'; return; } rg.value = +rg.value + 1; show(); }, 150); };
        $$('#tlFps').onchange = e => T.fps = +e.target.value;
        $$('#tlMake').onclick = async () => {
          const btn = $$('#tlMake'), r = $$('#tlRes'); btn.disabled = true; r.innerHTML = '<div class="cres">Membuat video… (bisa memakan waktu 1 menit atau lebih)</div>';
          try {
            const resp = await fetch(`/api/cctv/tlvideo/$${T.cam}?from=$${f}&to=$${t}&fps=$${T.fps}`, {credentials:'same-origin'});
            if (!resp.ok) { let e = {}; try { e = await resp.json(); } catch(x) {} throw new Error(e.error || 'Gagal membuat video'); }
            const blob = await resp.blob(), a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'timelapse-' + T.from + '.mp4'; document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 60000);
            r.innerHTML = '<div class="cres ok">Video diunduh.</div>';
          } catch(er) { r.innerHTML = `<div class="cres bad">$${esc(er.message)}</div>`; } finally { btn.disabled = false; }
        };
        const dl = $$('#tlDel'); if (dl) dl.onclick = async () => { if (await confirmBox('Hapus gambar timelapse?', 'Semua gambar timelapse kamera ini akan dihapus permanen.', 'Hapus')) { try { await api('cctv/tldelete', {cam:T.cam}); CCT.drawTl(b); } catch(er) { toast(er.message); } } };
      };

      /* ---------- AI & Telegram (owner) ---------- */
      CCT.drawAi = async function(b) {
        let ai, tg;
        try { ai = await api('cctv/ai'); tg = await api('cctv/notify'); } catch(e) { b.innerHTML = emptyBox('alert', 'Gagal memuat', esc(e.message)); return; }
        const st = ai.status || {}, tz = -new Date().getTimezoneOffset();
        const mode = st.off ? 'Belum dipasang' : !st.ok ? 'Tidak aktif' : st.mode === 'hog' ? 'Dasar (hanya orang)' : 'Model AI aktif';
        b.innerHTML = `<div class="pgrid"><div class="c6">$${panel('Mesin deteksi AI', `<div class="setrow" style="padding-top:0"><div class="st"><b>$${mode}</b><small>$${st.ok ? (st.model ? esc(st.model) + ' · ' : '') + (st.count || 0) + ' gambar diproses' + (st.last_ms ? ' · ' + st.last_ms + ' md terakhir' : '') : esc(st.error || '')}</small></div><span class="cdot $${st.ok?'on':'bad'}"></span></div>`
            + (st.ok && st.mode === 'hog' ? `<p class="hint">Model AI belum termuat$${st.error ? ' (' + esc(st.error) + ')' : ''}. Sementara hanya orang yang dikenali. Pastikan server punya internet untuk mengunduh model pertama kali, atau isi AI_MODEL_URL.</p>` : '')
            + `<div class="setrow"><div class="st"><b>Perkiraan usia orang</b><small>$${st.age === 'ready' ? 'Siap (anak / remaja / dewasa / lansia dari wajah)' : st.age === 'loading' ? 'Memuat model…' : esc(st.age_error || 'Model usia belum tersedia')}</small></div><span class="cdot $${st.age==='ready'?'on':'bad'}"></span></div><p class="hint">Cara kerja: kamera memantau gerakan; saat ada gerakan, satu gambar dikirim ke layanan <b>cctv-ai</b> yang menyaring orang / kendaraan / hewan. Aktifkan per kamera di tab Kamera → Ubah → "Deteksi AI".</p><p class="hint">Kejadian lolos: <b>$${ai.stats.events}</b> · disaring (bukan objek pilihan): <b>$${ai.stats.filtered}</b></p><div style="margin-top:12px"><button class="btn sm" id="aiRef">$${ic('radar',15)}Periksa ulang</button></div>`)}</div>`
          + `<div class="c6">$${panel('Notifikasi Telegram', `<div class="chk" style="padding-top:0"><div><b>Kirim ke Telegram</b><small>Foto kejadian + jam dikirim ke chat Anda</small></div><label class="sw"><input type="checkbox" id="tgOn" $${tg.on?'checked':''}><i></i></label></div>`
            + `<label class="lbl">Token bot (dari @BotFather)</label><input type="password" id="tgTok" placeholder="$${tg.has_token ? '(tersimpan — isi untuk mengganti)' : '123456789:AAH...'}" autocomplete="new-password"><label class="lbl">Chat ID</label><input type="text" id="tgChat" value="$${esc(tg.chat)}" placeholder="Contoh: 123456789 atau -100123..."><p class="hint">Buat bot lewat @BotFather, kirim pesan apa saja ke bot Anda, lalu buka <b>api.telegram.org/bot&lt;TOKEN&gt;/getUpdates</b> untuk melihat chat id. Server perlu akses internet.</p>`
            + (tg.err ? `<div class="cres bad">Kiriman terakhir gagal: $${esc(tg.err)}</div>` : '') + `<div id="tgRes"></div><div class="cct-bar" style="margin-top:12px"><button class="btn pri sm" id="tgSave">Simpan</button><button class="btn sm" id="tgTest">Kirim tes</button>$${tg.has_token?'<button class="btn sm dng" id="tgClr">Hapus token</button>':''}</div>`)}</div></div>`;
        const res = (h, c) => b.querySelector('#tgRes').innerHTML = `<div class="cres $${c||''}">$${h}</div>`;
        b.querySelector('#aiRef').onclick = () => CCT.drawAi(b);
        const save = async extra => api('cctv/notify', Object.assign({on:b.querySelector('#tgOn').checked, token:b.querySelector('#tgTok').value.trim(), chat:b.querySelector('#tgChat').value.trim(), tz}, extra || {}));
        b.querySelector('#tgSave').onclick = async () => { try { await save(); toast('Pengaturan Telegram disimpan'); CCT.drawAi(b); } catch(er) { res(esc(er.message), 'bad'); } };
        b.querySelector('#tgTest').onclick = async () => { res('Mengirim pesan tes…'); try { await save(); await api('cctv/notifytest', {}); res('Pesan tes terkirim. Periksa Telegram Anda.', 'ok'); } catch(er) { res(esc(er.message), 'bad'); } };
        const cl = b.querySelector('#tgClr'); if (cl) cl.onclick = async () => { if (await confirmBox('Hapus token bot?', 'Notifikasi Telegram akan berhenti.', 'Hapus')) { try { await save({clear_token:true, on:false}); CCT.drawAi(b); } catch(er) { toast(er.message); } } };
      };

      /* ---------- bicara ke kamera (mikrofon -> PCM 8 kHz -> server -> RTSP backchannel) ---------- */
      function cctMicHelp() {
        const m = modal(`<h2>Mikrofon butuh koneksi aman</h2><p style="color:var(--muted);margin:0 0 10px">Browser hanya mengizinkan mikrofon lewat <b>HTTPS</b> atau <b>localhost</b>. Alamat Anda sekarang (<b>$${esc(location.origin)}</b>) belum aman. Pilih salah satu:</p>`
          + `<p style="margin:0 0 8px"><b>A. Cepat (Chrome / Edge di komputer ini)</b><br><span style="color:var(--muted)">1. Buka <b>chrome://flags/#unsafely-treat-insecure-origin-as-secure</b> (Edge: edge://flags/...).<br>2. Isi kotak dengan <b>$${esc(location.origin)}</b> dan ubah ke <b>Enabled</b>.<br>3. Klik <b>Relaunch</b>, lalu izinkan mikrofon saat diminta.</span></p>`
          + `<p style="margin:0"><b>B. Permanen</b><br><span style="color:var(--muted)">Pasang HTTPS (Cloudflare Tunnel, Tailscale, atau Caddy), lalu ubah COOKIE_SECURE ke "1".</span></p><div class="actions"><button class="btn pri" id="mhOk">Mengerti</button></div>`);
        m.querySelector('#mhOk').onclick = () => m.remove();
      }
      async function cctTalk(c, onEnd) {
        if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { cctMicHelp(); throw new Error(''); }
        let stream;
        try { stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true, autoGainControl:true, channelCount:1}}); }
        catch(e) { throw new Error('Izin mikrofon ditolak atau mikrofon tidak ditemukan. Izinkan mikrofon untuk situs ini di browser.'); }
        let j;
        try { j = await api('cctv/talk/start', {cam:c.id}); } catch(er) { stream.getTracks().forEach(t => t.stop()); throw er; }
        const sid = j.sid, AC = window.AudioContext || window.webkitAudioContext, ac = new AC();
        if (ac.state === 'suspended') { try { await ac.resume(); } catch(e) {} }
        const src = ac.createMediaStreamSource(stream), pr = ac.createScriptProcessor(4096, 1, 1), zero = ac.createGain(); zero.gain.value = 0;
        const ratio = ac.sampleRate / 8000; let ph = 0, sum = 0, n = 0, out = [], queue = [], sending = false, dead = false;
        const finish = msg => {
          if (dead) return; dead = true;
          try { pr.disconnect(); src.disconnect(); zero.disconnect(); } catch(e) {}
          stream.getTracks().forEach(t => t.stop()); try { ac.close(); } catch(e) {}
          api('cctv/talk/stop', {sid}).catch(() => {}); if (onEnd) onEnd(msg);
        };
        async function pump() {
          if (sending) return; sending = true;
          while (queue.length && !dead) {
            const b = queue.shift();
            try {
              const r = await fetch('/api/cctv/talk/data?sid=' + encodeURIComponent(sid), {method:'POST', credentials:'same-origin', headers:{'X-Requested-With':'drive', 'X-Client-Id':CID, 'Content-Type':'application/octet-stream'}, body:b});
              if (!r.ok) { finish(r.status === 410 ? 'Sesi bicara berakhir' : 'Gagal mengirim suara ke kamera'); break; }
            } catch(e) { finish('Koneksi ke server terputus'); break; }
          }
          sending = false;
        }
        pr.onaudioprocess = e => {
          if (dead) return; const x = e.inputBuffer.getChannelData(0);
          for (let i = 0; i < x.length; i++) {
            sum += x[i]; n++; ph += 1;
            if (ph >= ratio) { ph -= ratio; const v = Math.max(-1, Math.min(1, sum / n)); out.push(v < 0 ? v * 32768 : v * 32767); sum = 0; n = 0; }
          }
          if (out.length >= 1600) { queue.push(new Int16Array(out.splice(0, out.length)).buffer); if (queue.length > 20) queue.shift(); pump(); }
        };
        src.connect(pr); pr.connect(zero); zero.connect(ac.destination);
        return {stop: () => finish('')};
      }

      /* ---------- tambah kamera lewat hotspot V380 ---------- */
      function cctHotspot() {
        const m = modal(`<h2>Tambah lewat hotspot V380</h2><p class="hint" style="margin:0 0 8px">Untuk kamera yang belum tersambung ke WiFi rumah dan masih memancarkan WiFi (hotspot) sendiri.</p>`
          + `<ol style="margin:8px 0 8px 18px;padding:0;line-height:1.7"><li>Nyalakan kamera dan aktifkan mode hotspot (lihat petunjuk di aplikasi V380 Pro atau buku kamera).</li><li>Sambungkan <b>komputer/server HomeDrive</b> ke WiFi hotspot kamera (nama dan sandi ada di label kamera atau aplikasi).</li><li>Klik <b>Pindai hotspot</b>, lalu pilih kamera yang ditemukan.</li></ol>`
          + `<div class="cres">Server HomeDrive yang disambungkan ke hotspot akan terputus dari WiFi rumah, kecuali memakai kabel LAN atau adaptor WiFi kedua. Setelah kamera ditambahkan, atur WiFi rumah pada kamera lewat aplikasi V380 Pro agar tersambung ke router, lalu ubah alamat IP kamera di HomeDrive (tombol Ubah).</div>`
          + `<div id="hsRes"></div><label class="lbl">Atau isi IP hotspot kamera sendiri</label><div style="display:flex;gap:8px"><input type="text" id="hsIp" placeholder="contoh 192.168.1.1"><button class="btn" id="hsUse" style="white-space:nowrap;flex:none">Pakai IP ini</button></div>`
          + `<div class="actions"><button class="btn" id="hsX">Tutup</button><button class="btn pri" id="hsGo">$${ic('radar',16)}Pindai hotspot</button></div>`, 'cwide');
        const open = (host, ports) => { m.remove(); const ps = ports || []; cctCamForm(null, {mode:'v380', host, port:ps.includes(554) ? 554 : ps.includes(8554) ? 8554 : 554, onvif_port:ps.includes(8899) || !ps.length ? 8899 : 0}); };
        m.querySelector('#hsX').onclick = () => m.remove();
        m.querySelector('#hsUse').onclick = () => { const v = m.querySelector('#hsIp').value.trim(); if (!/^[A-Za-z0-9._-]{3,253}$$/.test(v)) return toast('Isi alamat IP kamera yang benar'); open(v); };
        m.querySelector('#hsGo').onclick = async () => {
          const r = m.querySelector('#hsRes'), btn = m.querySelector('#hsGo'); btn.disabled = true; r.innerHTML = '<div class="cres">Memindai jaringan hotspot… (sekitar 15–30 detik)</div>';
          try {
            const j = await api('cctv/hotspot', {});
            r.innerHTML = j.found.length ? '<div style="margin-top:10px">' + j.found.map(f => `<div class="ccam"><div class="ct"><b>$${esc(f.host)}</b><small>Port terbuka: $${f.ports.join(', ')}$${f.known?' · sudah terdaftar':''}</small></div><button class="btn sm" data-h="$${esc(f.host)}" data-p="$${f.ports.join(',')}">Tambah</button></div>`).join('') + '</div>'
              : `<div class="cres bad">Tidak ada kamera ditemukan di jaringan $${esc(j.nets.join(', '))}. Pastikan server sudah tersambung ke WiFi hotspot kamera, atau isi IP kamera secara manual di bawah.</div>`;
            r.onclick = e => { const x = e.target.closest('[data-h]'); if (x) open(x.dataset.h, x.dataset.p.split(',').map(Number)); };
          } catch(er) { r.innerHTML = `<div class="cres bad">$${esc(er.message)}</div>`; } finally { btn.disabled = false; }
        };
      }

      boot();
      </script>
      </body>
      </html>
  studio_html:
    content: |
      <!doctype html>
      <html lang="id">
      <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width,initial-scale=1">
      <meta name="robots" content="noindex">
      <title>Studio Desain</title>
      <style>
      :root{--bg:#eef0f6;--panel:#fff;--p2:#f2f3f8;--line:#e1e4ee;--text:#12141f;--muted:#6b7188;--pri:#5b5ff0;--pri2:#8b5cf6;--ok:#16a34a;--danger:#dc2626;--grad:linear-gradient(135deg,var(--pri),var(--pri2));color-scheme:light}
      @media(prefers-color-scheme:dark){:root{--bg:#0b0c11;--panel:#14161d;--p2:#1b1e28;--line:#292d3a;--text:#eceef6;--muted:#8d93aa;color-scheme:dark}}
      *{box-sizing:border-box}
      html,body{height:100%;margin:0}
      body{font:13px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
      button,input,select,textarea{font:inherit;color:inherit}
      button{cursor:pointer}
      svg{display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
      .hidden{display:none!important}
      #app{height:100%;display:grid;grid-template-rows:52px 1fr}
      /* ---- bilah atas */
      #top{display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line);min-width:0;overflow-x:auto}
      #top::-webkit-scrollbar{display:none}
      #top .grp{display:flex;align-items:center;gap:6px;flex:none}
      #top .sp{flex:1;min-width:8px}
      .brand{display:flex;align-items:center;gap:9px;font-weight:750;font-size:14px;white-space:nowrap}
      .brand i{width:28px;height:28px;border-radius:9px;background:var(--grad);display:grid;place-items:center;color:#fff}
      .back{color:var(--muted);text-decoration:none;display:flex;align-items:center;gap:4px;padding:6px 8px;border-radius:9px;white-space:nowrap}
      .back:hover{background:var(--p2);color:var(--text)}
      .btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);padding:7px 12px;border-radius:10px;font-weight:600;white-space:nowrap}
      .btn:hover{background:var(--p2)}
      .btn.pri{background:var(--grad);border-color:transparent;color:#fff}
      .btn.pri:hover{filter:brightness(1.08)}
      .btn.pri[disabled]{opacity:.45;cursor:default;filter:none}
      .btn.sm{padding:5px 9px;font-size:12px;border-radius:8px}
      .btn.dng{color:var(--danger)}
      .btn svg{width:16px;height:16px}
      .ib{width:34px;height:34px;display:grid;place-items:center;border:0;background:none;border-radius:9px;color:var(--muted)}
      .ib:hover:not([disabled]){background:var(--p2);color:var(--text)}
      .ib[disabled]{opacity:.35;cursor:default}
      .ib svg{width:18px;height:18px}
      .seg{display:inline-flex;background:var(--p2);border-radius:10px;padding:3px;gap:2px}
      .seg button{border:0;background:none;padding:5px 10px;border-radius:8px;color:var(--muted);font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
      .seg button svg{width:15px;height:15px}
      .seg button.on{background:var(--panel);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.15)}
      select{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:6px 8px;max-width:150px}
      .chip{font-size:12px;font-weight:650;padding:4px 10px;border-radius:99px;background:var(--p2);color:var(--muted);white-space:nowrap}
      .chip.dirty{background:color-mix(in srgb,#f59e0b 20%,transparent);color:#b45309}
      .chip.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
      /* ---- badan */
      #main{display:grid;grid-template-columns:380px minmax(0,1fr);min-height:0}
      #left{display:grid;grid-template-columns:62px minmax(0,1fr);background:var(--panel);border-right:1px solid var(--line);min-height:0}
      #rail{display:flex;flex-direction:column;gap:2px;padding:10px 6px;border-right:1px solid var(--line);overflow-y:auto;background:var(--p2)}
      #rail button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;border:0;background:none;border-radius:11px;color:var(--muted);font-size:10.5px;font-weight:650}
      #rail button svg{width:20px;height:20px}
      #rail button:hover{background:var(--panel);color:var(--text)}
      #rail button.on{background:var(--panel);color:var(--pri);box-shadow:0 1px 4px rgba(0,0,0,.12)}
      #panel{overflow-y:auto;padding:16px 16px 40px;min-height:0}
      #panel h3{margin:0 0 4px;font-size:16px;letter-spacing:-.2px}
      #panel .lead{margin:0 0 14px;color:var(--muted)}
      #panel h4{margin:20px 0 8px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
      .fld{margin:0 0 13px}
      .fl{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:5px}
      .fl label{font-weight:650;font-size:12.5px}
      .fld small{display:block;color:var(--muted);margin-top:4px;font-size:11.5px}
      .rs{border:0;background:none;color:var(--muted);padding:2px;border-radius:6px;visibility:hidden;display:grid}
      .rs:hover{color:var(--text);background:var(--p2)}.rs svg{width:14px;height:14px}
      input[type=text],input[type=search],textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);outline:none}
      input[type=text]:focus,textarea:focus{border-color:var(--pri);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 20%,transparent)}
      textarea{resize:vertical;min-height:70px}
      .colr{display:flex;gap:8px;align-items:center}
      .colr input[type=color]{width:42px;height:34px;padding:2px;border:1px solid var(--line);border-radius:9px;background:var(--bg);cursor:pointer;flex:none}
      .colr input[type=text]{font-family:ui-monospace,Menlo,monospace;text-transform:lowercase}
      .slr{display:flex;align-items:center;gap:10px}
      .slr input[type=range]{flex:1;accent-color:var(--pri);min-width:0}
      .slr output{min-width:54px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-weight:650}
      .fld .seg{display:flex;width:100%;flex-wrap:wrap}.fld .seg button{flex:1;justify-content:center;padding:6px 4px}
      .tg{display:flex;align-items:center;gap:10px;cursor:pointer}
      .tg input{width:38px;height:22px;appearance:none;background:var(--line);border-radius:99px;position:relative;cursor:pointer;transition:.15s;flex:none}
      .tg input::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
      .tg input:checked{background:var(--pri)}.tg input:checked::after{left:19px}
      .tg span{font-weight:600;font-size:12.5px}
      /* kartu */
      .cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
      .tcard{border:1px solid var(--line);border-radius:13px;overflow:hidden;background:var(--bg);cursor:pointer;text-align:left;padding:0;transition:.15s}
      .tcard:hover{border-color:var(--pri);transform:translateY(-1px)}
      .tcard .mini{height:84px;position:relative;overflow:hidden}
      .tcard .tt{padding:8px 10px}.tcard b{display:block;font-size:12.5px}.tcard small{color:var(--muted);font-size:11px}
      .mini .sb{position:absolute;left:8px;top:8px;bottom:8px;width:22%;border-radius:6px}
      .mini .mn{position:absolute;left:calc(22% + 14px);right:8px;top:8px;bottom:8px;border-radius:7px;padding:6px;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;align-content:start}
      .mini .mn i{height:22px;display:block}
      .mini .bt{position:absolute;right:14px;bottom:14px;width:26px;height:9px;border-radius:99px}
      .fcards{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
      .fcard{border:1.5px solid var(--line);background:var(--bg);border-radius:11px;padding:10px;text-align:left}
      .fcard b{font-size:20px;display:block;line-height:1.1}.fcard small{color:var(--muted);font-size:11px}
      .fcard.on{border-color:var(--pri);background:color-mix(in srgb,var(--pri) 9%,var(--bg))}
      .swr{display:flex;flex-wrap:wrap;gap:7px}
      .swr button{width:30px;height:30px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);padding:0}
      .swr button:hover{transform:scale(1.12)}
      .ctr{display:flex;gap:6px;align-items:center;font-size:11.5px;color:var(--muted);margin-top:5px}
      .ctr b{padding:1px 7px;border-radius:99px;font-size:11px}
      .ctr b.g{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}.ctr b.b{background:color-mix(in srgb,var(--danger) 16%,transparent);color:var(--danger)}.ctr b.m{background:color-mix(in srgb,#f59e0b 20%,transparent);color:#b45309}
      .gradbar{height:30px;border-radius:9px;margin-bottom:10px;border:1px solid var(--line)}
      .row{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;background:var(--bg)}
      .row .t{flex:1;min-width:0}.row .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .t small{color:var(--muted)}
      .imgf{display:flex;gap:10px;align-items:center}
      .imgf .th{width:64px;height:64px;border-radius:10px;border:1px dashed var(--line);background:var(--bg) center/cover no-repeat;flex:none;display:grid;place-items:center;color:var(--muted);font-size:11px}
      .imgf .bs{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
      .assets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
      .asset{position:relative;aspect-ratio:1;border-radius:10px;border:1px solid var(--line);background:var(--bg) center/cover no-repeat;display:grid;place-items:center;font-size:22px;font-weight:700;overflow:hidden;cursor:pointer}
      .asset .x{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;display:none;place-items:center;padding:0}
      .asset:hover .x{display:grid}.asset .x svg{width:12px;height:12px}
      .emo{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
      .emo button{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--bg);font-size:19px;padding:0}
