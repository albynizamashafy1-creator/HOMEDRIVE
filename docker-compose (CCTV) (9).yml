      /* ---------- kartu ucapan (semua event) ---------- */
      function evCard(it) {
        var e = XM.ev(), a = e ? e.st.a : '#5b5ff0', b = e ? e.st.b : '#8b5cf6', emo = e ? e.d.emo : '🎁', def = e ? e.d.card : 'Salam hangat dari kami';
        var m = modal('<h2>' + emo + ' Kartu ucapan</h2><div style="text-align:center"><canvas id="xcv" style="max-width:100%;max-height:46vh;border-radius:12px;box-shadow:var(--sh2)"></canvas></div>'
          + '<label class="lbl">Ucapan</label><input type="text" id="xcT" maxlength="60" value="' + esc(def) + '">'
          + '<label class="lbl">Bingkai</label><select id="xcF"><option value="0">Garis permen</option><option value="1">Garis lembut</option><option value="2">Emas</option></select>'
          + '<div class="actions"><button class="btn" id="xcC">Tutup</button><button class="btn" id="xcD">Unduh</button><button class="btn pri" id="xcS">Simpan ke Drive</button></div>', 'wide');
        var cv = m.querySelector('#xcv'), img = new Image();
        var draw = function() {
          if (!img.naturalWidth) return;
          var W = Math.min(img.naturalWidth, 1400), sc = W / img.naturalWidth, Hh = Math.round(img.naturalHeight * sc), bw = Math.round(W * 0.055), band = Math.round(W * 0.13);
          cv.width = W + bw * 2; cv.height = Hh + bw * 2 + band;
          var x = cv.getContext('2d'), f = +m.querySelector('#xcF').value, pal = [[a, '#ffffff'], [b, '#ffffff'], ['#b45309', '#fde68a']][f];
          x.fillStyle = pal[0]; x.fillRect(0, 0, cv.width, cv.height);
          x.save(); x.beginPath(); x.rect(0, 0, cv.width, cv.height); x.rect(bw, bw, W, Hh); x.clip('evenodd');
          x.strokeStyle = pal[1]; x.lineWidth = bw * 0.35; x.globalAlpha = 0.9;
          for (var i = -cv.height; i < cv.width + cv.height; i += bw * 1.1) { x.beginPath(); x.moveTo(i, 0); x.lineTo(i + cv.height, cv.height); x.stroke(); }
          x.restore(); x.globalAlpha = 1;
          x.fillStyle = pal[0]; x.fillRect(0, Hh + bw, cv.width, band + bw);
          x.drawImage(img, bw, bw, W, Hh);
          x.strokeStyle = '#facc15'; x.lineWidth = 4; x.strokeRect(bw - 2, bw - 2, W + 4, Hh + 4);
          var seed = 7, rnd = function() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
          var gl = e ? e.d.bu : ['✨'];
          x.textAlign = 'center'; x.textBaseline = 'middle';
          for (var k = 0; k < 26; k++) { x.font = Math.round(bw * (0.6 + rnd() * 0.7)) + 'px serif'; x.globalAlpha = 0.9; x.fillText(gl[k % gl.length], bw + rnd() * W, bw + rnd() * Hh); }
          x.globalAlpha = 1;
          var txt = emo + ' ' + (m.querySelector('#xcT').value || def) + ' ' + emo, fs = Math.round(band * 0.5);
          x.fillStyle = '#ffffff';
          do { x.font = 'bold ' + fs + 'px Georgia, serif'; fs -= 2; } while (x.measureText(txt).width > cv.width * 0.9 && fs > 12);
          x.fillText(txt, cv.width / 2, Hh + bw + band / 2 + bw / 2);
        };
        img.onload = draw; img.onerror = function() { toast('Gambar tidak bisa dimuat'); };
        img.src = dl(it.id, true);
        m.querySelector('#xcT').oninput = draw; m.querySelector('#xcF').onchange = draw;
        m.querySelector('#xcC').onclick = function() { m.remove(); };
        var di = it.name.lastIndexOf('.'), nm = (di > 0 ? it.name.slice(0, di) : it.name) + '-kartu.jpg';
        m.querySelector('#xcD').onclick = function() {
          cv.toBlob(function(bl) { var l = document.createElement('a'); l.href = URL.createObjectURL(bl); l.download = nm; l.click(); setTimeout(function() { URL.revokeObjectURL(l.href); }, 2000); }, 'image/jpeg', 0.92);
        };
        m.querySelector('#xcS').onclick = function() {
          cv.toBlob(function(bl) { m.remove(); toast('Menyimpan kartu ke Drive…'); uploadPaths([{file:new File([bl], nm, {type:'image/jpeg'}), path:nm}], it.parent_id || null); }, 'image/jpeg', 0.92);
        };
      }

      /* ---------- NATAL: Kalender Advent ---------- */
      const ADV = ['Selamat memasuki Desember! Awali bulan ini dengan merapikan folder Anda.', 'Tip: tekan Ctrl+V untuk menempel gambar langsung ke Drive.', 'Tip: tekan / untuk langsung mencari file.',
        'Beri bintang pada foto terbaik tahun ini agar mudah ditemukan.', 'Tip: seret folder ke jendela browser untuk mengunggah seluruh isinya.', 'Hari Santo Nikolas: bagikan satu kebaikan kecil hari ini. 🎅',
        'Coba Analisis penyimpanan di menu akun untuk melihat folder terbesar.', 'Tip: Pembersih duplikat membantu menghemat ruang.', 'Buat folder "Foto Natal" lalu beri warna merah.',
        'Tip: tekan G untuk berganti tampilan kotak dan daftar.', 'Kirim kartu ucapan: buka foto lalu tekan ikon kado.', 'Bagikan album liburan lewat tautan berpassword.',
        'Tip: tekan N untuk membuat folder baru dengan cepat.', 'Coba Kado Berwaktu: kunci tautan sampai pagi Natal.', 'Aktifkan verifikasi wajah di menu akun untuk keamanan ekstra.',
        'Cek Perangkat login dan keluarkan perangkat yang tidak dikenal.', 'Tip: slideshow foto ada di ikon putar saat pratinjau.', 'Cadangan itu penting: minta owner mengunduh cadangan database.',
        'Kosongkan Sampah agar penyimpanan lega sebelum liburan.', 'Ekstrak ZIP kiriman keluarga langsung di server lewat menu Ekstrak.', 'Hari terpendek di belahan utara: hangatkan hati dengan menelepon keluarga.',
        'Tip: tes kecepatan ada di menu akun.', 'Besok Malam Natal. Siapkan foto keluarga untuk dibagikan!', 'Malam Natal: damai di bumi, sukacita di hati. 🌟'];
      function adventDialog() {
        var now = new Date(), y = now.getFullYear(), key = 'adv' + y, peek = false;
        var opened = function() { try { return JSON.parse(localStorage.getItem(key) || '[]'); } catch(e) { return []; } };
        var unlocked = function(n) { return peek || (now.getMonth() === 11 && now.getDate() >= n); };
        var m = modal('<h2>🎁 Kalender Advent</h2><div id="avI" class="hint" style="margin:-6px 0 12px"></div><div class="advg" id="avG"></div><div id="avM" class="advm"></div><div class="actions"><button class="btn" id="avP">Mode intip</button><button class="btn pri" id="avX">Tutup</button></div>', 'wide');
        var draw = function() {
          var op = opened(), h = '';
          for (var n = 1; n <= 24; n++) h += '<button class="advd' + (op.indexOf(n) >= 0 ? ' open' : '') + (unlocked(n) ? '' : ' lock') + '" data-n="' + n + '">' + (op.indexOf(n) >= 0 ? '🎁' : n) + '</button>';
          m.querySelector('#avG').innerHTML = h;
          var dd = Math.ceil((new Date(y, 11, 1) - now) / 86400000);
          m.querySelector('#avI').textContent = now.getMonth() === 11 ? 'Pintu hari ini sudah terbuka. Buka satu per hari!' : (dd > 0 && now.getMonth() < 11 ? 'Pintu pertama terbuka 1 Desember (' + dd + ' hari lagi). Aktifkan Mode intip untuk mencoba.' : 'Kalender Advent tahun ini sudah berakhir.');
        };
        m.querySelector('#avG').onclick = function(ev) {
          var b = ev.target.closest('[data-n]'); if (!b) return; var n = +b.dataset.n;
          if (!unlocked(n)) { b.classList.remove('shk'); void b.offsetWidth; b.classList.add('shk'); return toast('Pintu ' + n + ' baru terbuka pada ' + n + ' Desember'); }
          var op = opened(); if (op.indexOf(n) < 0) { op.push(n); try { localStorage.setItem(key, JSON.stringify(op)); } catch(e) {} XM.burst(14); }
          m.querySelector('#avM').innerHTML = '<b>Hari ke-' + n + '</b><br>' + esc(ADV[n - 1]); draw();
        };
        m.querySelector('#avP').onclick = function() { peek = !peek; this.textContent = peek ? 'Matikan intip' : 'Mode intip'; draw(); };
        m.querySelector('#avX').onclick = function() { m.remove(); };
        draw();
      }

      /* ---------- HARI IBU: Surat untuk Ibu ---------- */
      function suratDialog() {
        var tpl = ['Ibu tersayang,', '', 'Terima kasih untuk setiap doa yang Ibu panjatkan, setiap masakan yang Ibu siapkan, dan setiap pelukan yang membuatku merasa pulang.', '',
          'Maaf bila aku belum sering bilang betapa berartinya Ibu. Hari ini aku ingin Ibu tahu: aku bangga menjadi anak Ibu.', '', 'Dengan cinta,', S.me ? S.me.username : ''].join('\n');
        var m = modal('<h2>💌 Surat untuk Ibu</h2><label class="lbl">Isi surat</label><textarea id="srT" rows="10" maxlength="3000"></textarea><label class="chkline"><input type="checkbox" id="srS" checked> Buat tautan berbagi agar mudah dikirim</label><div id="srL" class="hint"></div><div class="err" id="srE"></div><div class="actions"><button class="btn" id="srC">Batal</button><button class="btn pri" id="srO">Simpan surat</button></div>', 'wide');
