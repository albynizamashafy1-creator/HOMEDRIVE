      @media(max-width:900px){
        #tabbar{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));border:1px solid var(--line);border-radius:28px;padding:6px;box-shadow:var(--sh);background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(24px) saturate(1.5)}
        #tabbar a{border-radius:20px;padding:7px 2px}
