            const cams = all ? 'all' : [...card.querySelectorAll('[data-c]:checked')].map(x => +x.dataset.c);
            if (!all && !cams.length) return toast('Pilih minimal satu kamera');
            try { await api('cctv/access', {user_id:uid, live:k('live'), ptz:k('ptz'), rec:k('rec'), snap:k('snap'), talk:k('talk'), cams}); toast('Akses disimpan'); CCT.drawAccess(b); } catch(er) { toast(er.message); }
          };
