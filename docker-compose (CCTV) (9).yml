      # ===================== CCTV: zona/jadwal gerakan, deteksi AI, Telegram, klip, rekam manual, timelapse =====================
      import datetime

      AI_URL = os.environ.get("AI_URL", "").rstrip("/")
      TG_API = os.environ.get("TELEGRAM_API", "https://api.telegram.org").rstrip("/")
      CCTV_TL = CCTV_DIR / "tl"
      CCTV_TL.mkdir(parents=True, exist_ok=True)
