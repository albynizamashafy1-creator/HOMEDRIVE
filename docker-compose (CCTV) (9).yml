            XM.burst(30); load(true, true); m.querySelector('#srL').textContent = msg; btn.textContent = 'Selesai'; btn.disabled = false; btn.onclick = function() { m.remove(); };
          } catch(e) { er.textContent = e.message; btn.disabled = false; }
        };
      }

      /* ---------- VALENTINE: Kapsul Cinta ---------- */
