        m.addEventListener('click', async e => {
          const b = e.target.closest('[data-f]'); if (!b) return; const k = b.dataset.f;
          const pw = await pwPrompt(k === 'off' ? 'Nonaktifkan verifikasi wajah' : k === 'codes' ? 'Kode pemulihan baru' : 'Konfirmasi password', k === 'codes' ? 'Kode lama tidak berlaku lagi.' : '');
