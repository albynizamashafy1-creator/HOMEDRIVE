# HomeDrive - satu file saja (app.py + index.html sudah tertanam di sini)
#
# Baru: kuota wajib diatur owner sebelum admin/pengguna bisa unggah, notifikasi real-time,
#       permintaan kuota ke owner, peringatan penyimpanan penuh, tampilan update otomatis (tanpa reload).
#
# Baru lagi (v2): analisis penyimpanan per folder, ekstrak ZIP di server, info ukuran folder, slideshow foto,
#       tempel gambar (Ctrl+V) untuk unggah, halaman Sistem & cadangan database (owner), pembersih file yatim,
#       log aktivitas semua pengguna (admin), PWA (bisa dipasang di HP, butuh HTTPS/localhost).
#
# Fitur owner: Pusat kendali (pengumuman banner + notifikasi massal, mode pemeliharaan hanya-baca, cadangan
#       otomatis terjadwal + unduh, daftar & cabut semua tautan berbagi), nonaktifkan akun, paksa keluar perangkat.
#
# Edisi EVENT (v3): owner bisa meluncurkan event dari Panel owner > Event. Pilihan: Natal, Hari Ibu, Hari Valentine,
#       Paskah, 17 Agustus, dan Sumpah Pemuda, masing-masing 3 gaya tampilan (tema warna, efek melayang, hiasan atas,
#       hitung mundur, kartu ucapan dari foto, folder bertema, konfeti, halaman berbagi bertema) dan SATU FITUR KHAS:
#         Natal = Kalender Advent + Kado Berwaktu | Hari Ibu = Surat untuk Ibu | Valentine = Kapsul Cinta
#         Paskah = Berburu Telur | 17 Agustus = Kuis Kemerdekaan | Sumpah Pemuda = Dinding Ikrar bersama
#       Pengguna bisa mematikan dekorasi di menu akun > Dekorasi event. Event bisa dijadwalkan berakhir otomatis.
#
# Edisi STUDIO DESAIN (v4): owner bisa mendesain tampilan HomeDrive sendiri lewat Studio Desain (menu akun > Studio desain,
#       atau Panel owner > Desain, atau buka http://IP-SERVER:8080/studio). Ada galeri tema siap pakai, editor warna (terang & gelap,
#       cek kontras), huruf (termasuk unggah font), bentuk & efek, tata letak, latar (polos/gradien/mesh/pola/gambar), nama & logo,
#       halaman login, CSS kustom, pratinjau langsung (desktop/tablet/ponsel, terang/gelap, bandingkan), urungkan/ulangi, preset
#       bernama, riwayat versi, ekspor/impor JSON. Desain yang diterbitkan tersimpan di database dan tampil real-time ke semua pengguna.
#       Darurat: buka http://IP-SERVER:8080/?nodesign=1 untuk melihat aplikasi tanpa desain kustom.
#
# Edisi ANIMASI + APLIKASI (v5): tab Animasi di Studio (kemunculan file, transisi halaman, hover, riak tombol, dialog, latar
#       aurora/melayang, kecepatan & irama). Aplikasi bisa DIPASANG di HP & laptop (PWA): menu akun > Pasang aplikasi. Ikon PNG
#       otomatis mengikuti warna desain, halaman offline, tampilan tetap terbuka tanpa koneksi, pembaruan otomatis.
#       SYARAT PEMASANGAN: akses lewat HTTPS (Cloudflare Tunnel / Tailscale / Caddy) atau http://localhost; lewat http://IP biasa
#       browser menolak memasang. Setelah HTTPS aktif, ubah COOKIE_SECURE ke "1".
#
# Edisi CCTV (v6): menu CCTV untuk OWNER. Sambungkan kamera V380 (lewat RTSP/ONVIF) atau kamera RTSP lain:
#       siaran langsung beberapa kamera, tampilan besar, layar penuh, suara, simpan gambar, PTZ (arah, zoom, posisi tersimpan),
#       rekaman terus-menerus per 10 menit dengan timeline & unduh, deteksi gerakan + foto kejadian + notifikasi, pencarian kamera di
#       jaringan, tes koneksi, DETEKSI AI (orang/kendaraan/hewan), zona & jadwal gerakan, notifikasi Telegram, ekspor klip, rekam manual, timelapse, batas hari/ukuran penyimpanan rekaman, BICARA ke kamera (suara dua arah; butuh speaker + ONVIF backchannel di kamera
#       dan HTTPS/localhost untuk mikrofon), tambah kamera lewat HOTSPOT V380. Owner bisa MEMBERI AKSES ke tiap admin (lihat langsung / PTZ /
#       rekaman / simpan gambar, semua kamera atau hanya kamera tertentu) dan mencabutnya kapan saja. Password kamera disimpan terenkripsi.
#       Kamera dari HP/laptop: CCTV > Kamera > "Kamera HP/laptop" lalu "Siarkan" (butuh HTTPS atau localhost untuk akses kamera browser).
#       AI PINTAR di HomeDrive (menu "AI Pintar"): foto diberi label otomatis (orang, kucing, mobil, warna, buram, gelap) dan bisa dicari, pencari foto kembar, pembersih foto buram/gelap. Butuh service cctv-ai.
#       ASISTEN AI (menu "Asisten AI"): tanya jawab dalam bahasa Indonesia yang terhubung ke file/foto HomeDrive DAN kejadian/kamera CCTV. Mode dasar tanpa model; owner bisa menghubungkan Claude atau model lokal (Ollama) di Pengaturan.
#       Perkiraan USIA orang di CCTV (anak/remaja/dewasa/lansia) lewat service cctv-ai, bila wajah terlihat.
#       HomeDrive: tombol Putar semua / Acak + putar berurutan otomatis di Audio & Video, filter ukuran (>10 MB, >100 MB) dan waktu (7/30 hari).
#       Syarat: kamera mendukung RTSP/ONVIF dan satu jaringan dengan server. Contoh V380: rtsp://admin:PASSWORD@IP:554/live/ch00_0.
#
# v6.1 (perbaikan CCTV): latensi siaran langsung dipangkas (segmen HLS 1 dtk, probe ffmpeg singkat, pemutar mengejar tepi siaran),
#       playlist menunggu siap (tidak 404 lalu tunggu 4 dtk), segmen tidak di-cache (gambar basi setelah sambung ulang),
#       pembaca deteksi gerakan tahan banting & selalu menguras pipa (sebelumnya bisa membuat siaran beku), sambung ulang lebih cepat.
#       Opsi baru CCTV_ALWAYS_ON=1 (siaran terbuka seketika) dan CCTV_LIVE_REENCODE=1 (latensi rendah walau keyframe kamera panjang).
#
# Jalankan:   docker compose up -d
# Buka:       http://IP-SERVER:8080   (lalu buat akun admin pertama)
# Perbarui:   unduh ulang file ini, lalu  docker compose up -d --force-recreate
#
# Butuh Docker Compose v2.23+ (fitur configs.content). Cek: docker compose version
services:
  homedrive:
    image: python:3.12-alpine
    container_name: homedrive
    restart: unless-stopped
    working_dir: /app
    # ffmpeg dipasang otomatis saat kontainer dibuat (butuh internet), lalu aplikasi dijalankan
    command: ["sh", "-c", "apk add --no-cache ffmpeg >/dev/null 2>&1 || echo 'PERINGATAN: ffmpeg gagal dipasang (butuh internet), fitur CCTV nonaktif'; exec python /app/app.py"]
    ports:
      - "8080:8080"
    volumes:
      # Ganti sisi kiri dengan folder/disk tempat Anda ingin menyimpan file
      - ./data:/data
    # Agar Asisten AI bisa memakai Ollama yang berjalan di laptop server (http://host.docker.internal:11434/v1)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # ===== WEBCAM, MIKROFON & SPEAKER LAPTOP SERVER (CCTV -> Tambah kamera -> "Webcam & mic laptop server") =====
    # Hanya untuk server LINUX. Hapus tanda # pada 4 baris di bawah SETELAH memastikan /dev/video0 dan /dev/snd ada
    # (cek: ls /dev/video* /dev/snd). Jika perangkat tidak ada, "docker compose up" akan GAGAL, jadi biarkan terkomentar.
    # Docker Desktop (Windows/Mac) tidak bisa meneruskan webcam/audio: pakai fitur "Kamera HP/laptop" (siaran dari browser).
    # devices:
    #   - "/dev/video0:/dev/video0"
    #   - "/dev/snd:/dev/snd"
    # group_add: ["video", "audio"]
    environment:
      DATA_DIR: /data
      AI_URL: "http://cctv-ai:5000"   # layanan deteksi AI (service cctv-ai di bawah); kosongkan untuk mematikan fitur AI
      # TELEGRAM_API: "https://api.telegram.org"   # ubah hanya jika memakai proxy/server Bot API sendiri
      HOST: 0.0.0.0
      PORT: "8080"
      PYTHONUNBUFFERED: "1"
      REQUIRE_QUOTA: "1"   # 1 = admin & pengguna belum bisa unggah sebelum owner mengatur kuotanya (owner selalu bisa)
      QUOTA_GB: "0"        # kuota bawaan, hanya dipakai jika REQUIRE_QUOTA="0"
      TRASH_DAYS: "30"     # sampah dikosongkan otomatis setelah N hari, 0 = jangan hapus otomatis
      COOKIE_SECURE: "0"   # ubah ke "1" jika diakses lewat HTTPS
      BACKUP_HOURS: "24"   # cadangan database otomatis tiap N jam (disimpan di data/backups), 0 = nonaktif
      BACKUP_KEEP: "7"     # jumlah cadangan otomatis yang disimpan
      CCTV_LIVE_REENCODE: "0"  # 1 = tampilan langsung di-encode ulang (keyframe 1 dtk) -> latensi ~2 dtk walau keyframe kamera panjang; butuh CPU ~10-25% per kamera. Rekaman tetap tanpa encode.
      CCTV_ALWAYS_ON: "0"  # 1 = kamera selalu tersambung sehingga siaran langsung terbuka seketika (boros bandwidth/CPU sedikit); 0 = hanya menyala saat ditonton/direkam
      EVENT_DEFAULT: "natal"  # event awal sebelum owner memilih: natal, ibu, valentine, paskah, agustus, sumpah, atau kosong = tanpa event
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s
    configs:
      - source: app_py
        target: /app/app.py
      - source: index_html
        target: /app/index.html
      - source: studio_html
        target: /app/studio.html

  # Layanan deteksi AI (orang / kendaraan / hewan) untuk CCTV. Dipasang otomatis saat pertama jalan (butuh internet: paket Python
  # sekitar 150 MB + model AI sekitar 30 MB, tersimpan di ./data/ai). Jika gagal, aplikasi utama TETAP jalan; fitur AI saja yang nonaktif.
  cctv-ai:
    image: python:3.12-slim
    container_name: homedrive-cctv-ai
    restart: unless-stopped
    working_dir: /app
    # Start pertama memasang paket (±150 MB, butuh internet) - bisa beberapa menit. Diulang sampai 5x bila gagal. Lihat progres: docker logs -f homedrive-cctv-ai
    command: ["sh", "-c", "for i in 1 2 3 4 5; do python -c 'import cv2, onnxruntime, numpy' 2>/dev/null && break; echo Memasang-paket-AI-percobaan-$$i; pip install --no-cache-dir numpy opencv-python-headless onnxruntime && break; sleep 10; done; exec python /app/ai.py"]
    environment:
      PORT: "5000"
      MODEL_DIR: /models
      THREADS: "2"
      PYTHONUNBUFFERED: "1"
      # AGE_BASE_URL: ""   # opsional: folder tempat 4 berkas model usia (age_deploy.prototxt, age_net.caffemodel, opencv_face_detector.pbtxt, opencv_face_detector_uint8.pb); atau taruh berkasnya manual di ./data/ai
      # AI_MODEL_URL: ""   # opsional: alamat model .onnx sendiri (SSD-MobileNet atau YOLOv5/v8)
    volumes:
      - ./data/ai:/models
    configs:
      - source: ai_py
        target: /app/ai.py

configs:
  ai_py:
    content: |
      #!/usr/bin/env python3
      """HomeDrive CCTV AI - layanan deteksi objek (orang, kendaraan, hewan).

      POST /detect?conf=0.45&annotate=1   (body = JPEG)  ->  JSON {mode, w, h, detections:[{group,label,conf,box}], image(base64 JPEG beranotasi)}
      GET  /health                                       ->  JSON status model

      Model ONNX diunduh otomatis ke /models saat pertama jalan (AI_MODEL_URL, dipisah koma, dicoba berurutan).
      Jika model belum ada / gagal diunduh, layanan tetap hidup memakai detektor orang bawaan OpenCV (HOG).
      Mendukung model keluaran SSD (TensorFlow/ONNX Model Zoo) dan YOLOv5/YOLOv8/YOLO11 (ONNX).
      """
      import base64
      import json
      import os
      import sys
      import threading
      import time
      import urllib.request
      from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
      from urllib.parse import parse_qs, urlparse

      import cv2
      import numpy as np

      PORT = int(os.environ.get("PORT", "5000"))
      MODEL_DIR = os.environ.get("MODEL_DIR", "/models")
      THREADS = int(os.environ.get("THREADS", "2"))
      DEFAULT_URLS = ("https://github.com/onnx/models/raw/main/validated/vision/object_detection_segmentation/"
                      "ssd-mobilenetv1/model/ssd_mobilenet_v1_12.onnx")
      URLS = [u.strip() for u in os.environ.get("AI_MODEL_URL", DEFAULT_URLS).split(",") if u.strip()]

      COCO80 = ["person", "bicycle", "car", "motorcycle", "airplane", "bus", "train", "truck", "boat", "traffic light", "fire hydrant",
                "stop sign", "parking meter", "bench", "bird", "cat", "dog", "horse", "sheep", "cow", "elephant", "bear", "zebra", "giraffe"]
      # id kelas TensorFlow (91 kelas) -> nama; hanya yang relevan
      COCO91 = {1: "person", 2: "bicycle", 3: "car", 4: "motorcycle", 6: "bus", 8: "truck", 16: "bird", 17: "cat", 18: "dog", 19: "horse",
                20: "sheep", 21: "cow", 22: "elephant", 23: "bear", 24: "zebra", 25: "giraffe"}
      GROUPS = {"person": "person", "bicycle": "vehicle", "car": "vehicle", "motorcycle": "vehicle", "bus": "vehicle", "truck": "vehicle",
                "bird": "animal", "cat": "animal", "dog": "animal", "horse": "animal", "sheep": "animal", "cow": "animal",
                "elephant": "animal", "bear": "animal", "zebra": "animal", "giraffe": "animal"}
      LABEL_ID = {"person": "Orang", "vehicle": "Kendaraan", "animal": "Hewan"}
      COLORS = {"person": (60, 60, 255), "vehicle": (0, 165, 255), "animal": (80, 200, 80)}

      AGE_BASE = os.environ.get("AGE_BASE_URL", "https://github.com/smahesh29/Gender-and-Age-Detection/raw/master").rstrip("/")
      AGE_FILES = {"age_deploy.prototxt": AGE_BASE + "/age_deploy.prototxt", "age_net.caffemodel": AGE_BASE + "/age_net.caffemodel",
                   "opencv_face_detector.pbtxt": AGE_BASE + "/opencv_face_detector.pbtxt", "opencv_face_detector_uint8.pb": AGE_BASE + "/opencv_face_detector_uint8.pb"}
      AGE_BUCKETS = ["0-2", "4-6", "8-12", "15-20", "25-32", "38-43", "48-53", "60-100"]
      AGE_GROUP = ["anak", "anak", "anak", "remaja", "dewasa", "dewasa", "dewasa", "lansia"]
      AGE = {"state": "loading", "error": "", "face": None, "net": None}
      STATE = {"mode": "hog", "model": "", "loading": True, "error": "", "kind": "", "since": time.time(), "count": 0, "last_ms": 0}
      SESS = {"s": None, "inp": None, "outs": None}
      LOCK = threading.Lock()
      HOG = cv2.HOGDescriptor()
      HOG.setSVMDetector(cv2.HOGDescriptor_getDefaultPeopleDetector())


      # ----------------------------------------------------------------- pemuatan model
      def download(url, dest):
          req = urllib.request.Request(url, headers={"User-Agent": "HomeDrive-AI"})
          with urllib.request.urlopen(req, timeout=60) as r, open(dest + ".part", "wb") as f:
              while True:
                  b = r.read(1 << 20)
                  if not b:
                      break
                  f.write(b)
          if os.path.getsize(dest + ".part") < 100_000:
              os.remove(dest + ".part")
              raise ValueError("berkas terlalu kecil (bukan model)")
          os.replace(dest + ".part", dest)


      def load_session(path):
          import onnxruntime as ort
          so = ort.SessionOptions()
          so.intra_op_num_threads = THREADS
          s = ort.InferenceSession(path, so, providers=["CPUExecutionProvider"])
          outs = [o.name for o in s.get_outputs()]
          kind = "ssd" if any("detection_boxes" in n or "boxes" in n.lower() for n in outs) and len(outs) >= 3 else "yolo"
          SESS.update(s=s, inp=s.get_inputs()[0], outs=outs)
          STATE.update(kind=kind, mode="onnx", model=os.path.basename(path))


      def age_loader():
          """Muat detektor wajah + model usia (opsional). Tanpa ini deteksi orang tetap jalan, hanya usia yang tidak diketahui."""
          try:
              os.makedirs(MODEL_DIR, exist_ok=True)
              for name, url in AGE_FILES.items():
                  path = os.path.join(MODEL_DIR, name)
                  if not os.path.exists(path):
                      AGE["error"] = "mengunduh " + name
                      download(url, path) if not name.endswith(".pbtxt") and not name.endswith(".prototxt") else download_text(url, path)
              AGE["face"] = cv2.dnn.readNet(os.path.join(MODEL_DIR, "opencv_face_detector_uint8.pb"), os.path.join(MODEL_DIR, "opencv_face_detector.pbtxt"))
              AGE["net"] = cv2.dnn.readNetFromCaffe(os.path.join(MODEL_DIR, "age_deploy.prototxt"), os.path.join(MODEL_DIR, "age_net.caffemodel"))
              AGE.update(state="ready", error="")
              print("model usia dimuat", flush=True)
          except Exception as e:  # noqa
              AGE.update(state="off", error="model usia tidak tersedia: %s" % str(e)[:140])
              print(AGE["error"], file=sys.stderr, flush=True)


      def download_text(url, dest):
          req = urllib.request.Request(url, headers={"User-Agent": "HomeDrive-AI"})
          with urllib.request.urlopen(req, timeout=60) as r:
              data = r.read(2_000_000)
          if len(data) < 200:
              raise ValueError("berkas terlalu kecil")
          open(dest, "wb").write(data)


      def estimate_age(img, box):
          """Perkirakan usia satu orang dari wajahnya (bagian atas kotak orang). Mengembalikan dict; face=False bila wajah tidak terlihat."""
          h, w = img.shape[:2]
          x1, y1, x2, y2 = int(box[0] * w), int(box[1] * h), int(box[2] * w), int(box[3] * h)
          bh = y2 - y1
          top = img[max(0, y1 - int(bh * 0.03)):min(h, y1 + int(bh * 0.55)), max(0, x1 - int((x2 - x1) * 0.1)):min(w, x2 + int((x2 - x1) * 0.1))]
          if top.size == 0 or top.shape[0] < 28 or top.shape[1] < 28:
              return {"face": False}
          th, tw = top.shape[:2]
          AGE["face"].setInput(cv2.dnn.blobFromImage(top, 1.0, (300, 300), (104.0, 177.0, 123.0), False, False))
          det = AGE["face"].forward()
          best = None
          for i in range(det.shape[2]):
              c = float(det[0, 0, i, 2])
              if c >= 0.6 and (best is None or c > best[0]):
                  best = (c, det[0, 0, i, 3:7])
          if best is None:
              return {"face": False}
          fx1, fy1, fx2, fy2 = best[1]
          mx, my = (fx2 - fx1) * 0.2, (fy2 - fy1) * 0.2
          X1, Y1, X2, Y2 = int(max(0, (fx1 - mx) * tw)), int(max(0, (fy1 - my) * th)), int(min(tw, (fx2 + mx) * tw)), int(min(th, (fy2 + my) * th))
          face = top[Y1:Y2, X1:X2]
          if face.shape[0] < 20 or face.shape[1] < 20:
              return {"face": False}
          AGE["net"].setInput(cv2.dnn.blobFromImage(face, 1.0, (227, 227), (78.4263377603, 87.7689143744, 114.895847746), False))
          p = AGE["net"].forward().flatten()
          k = int(np.argmax(p))
          return {"face": True, "range": AGE_BUCKETS[k], "group": AGE_GROUP[k], "conf": round(float(p[k]), 3), "face_conf": round(best[0], 3)}


      def add_ages(img, dets):
          if AGE["state"] != "ready":
              return False
          for d in dets:
              if d["group"] == "person":
                  try:
                      d["age"] = estimate_age(img, d["box"])
                  except Exception as e:  # noqa
                      d["age"] = {"face": False, "error": str(e)[:80]}
          return True


      def model_loader():
          os.makedirs(MODEL_DIR, exist_ok=True)
          try:
              for url in URLS:
                  name = os.path.basename(url.split("?")[0]) or "model.onnx"
                  path = os.path.join(MODEL_DIR, name)
                  try:
                      if not os.path.exists(path):
                          STATE["error"] = "mengunduh model " + name + " …"
                          download(url, path)
                      load_session(path)
                      STATE["error"] = ""
                      print("model dimuat:", name, STATE["kind"], flush=True)
                      return
                  except Exception as e:  # noqa
                      STATE["error"] = "gagal memuat %s: %s" % (name, str(e)[:120])
                      print(STATE["error"], file=sys.stderr, flush=True)
                      try:
                          os.remove(path + ".part")
                      except OSError:
                          pass
              STATE["error"] += " — memakai detektor orang dasar (HOG)"
          finally:
              STATE["loading"] = False


      # ----------------------------------------------------------------- dekode keluaran model
      def decode_ssd(boxes, classes, scores, n, conf):
          out = []
          for i in range(int(n)):
              sc = float(scores[i])
              if sc < conf:
                  continue
              name = COCO91.get(int(classes[i]))
              if not name:
                  continue
              y1, x1, y2, x2 = [max(0.0, min(1.0, float(v))) for v in boxes[i]]
              if x2 > x1 and y2 > y1:
                  out.append({"label": name, "group": GROUPS[name], "conf": round(sc, 3), "box": [x1, y1, x2, y2]})
          return out


      def decode_yolo(pred, conf, ratio, padx, pady, w, h):
          p = pred[0] if pred.ndim == 3 else pred
          if p.shape[0] < p.shape[1]:  # (84, 8400) -> (8400, 84)
              p = p.T
          nc = p.shape[1]
          if nc == 85:  # YOLOv5: objectness + 80 kelas
              cls = p[:, 5:] * p[:, 4:5]
              xywh = p[:, :4]
          else:
              cls = p[:, 4:]
              xywh = p[:, :4]
          ids = cls.argmax(1)
          sc = cls.max(1)
          keep = [i for i in range(len(sc)) if sc[i] >= conf and ids[i] < len(COCO80) and COCO80[ids[i]] in GROUPS]
          if not keep:
              return []
          bx = [[float(xywh[i, 0] - xywh[i, 2] / 2), float(xywh[i, 1] - xywh[i, 3] / 2), float(xywh[i, 2]), float(xywh[i, 3])] for i in keep]
          sk = [float(sc[i]) for i in keep]
          idx = cv2.dnn.NMSBoxes(bx, sk, conf, 0.5)
          out = []
          for j in np.array(idx).flatten():
              x, y, bw, bh = bx[j]
              x1, y1 = (x - padx) / ratio, (y - pady) / ratio
              x2, y2 = (x + bw - padx) / ratio, (y + bh - pady) / ratio
              name = COCO80[ids[keep[j]]]
              out.append({"label": name, "group": GROUPS[name], "conf": round(sk[j], 3),
                          "box": [max(0.0, min(1.0, x1 / w)), max(0.0, min(1.0, y1 / h)), max(0.0, min(1.0, x2 / w)), max(0.0, min(1.0, y2 / h))]})
          return out


      def letterbox(img, size):
          h, w = img.shape[:2]
          r = min(size / h, size / w)
          nh, nw = int(round(h * r)), int(round(w * r))
          res = cv2.resize(img, (nw, nh), interpolation=cv2.INTER_LINEAR)
          canvas = np.full((size, size, 3), 114, np.uint8)
          px, py = (size - nw) // 2, (size - nh) // 2
          canvas[py:py + nh, px:px + nw] = res
          return canvas, r, px, py


      def run_onnx(img, conf):
          h, w = img.shape[:2]
          s, inp, outs = SESS["s"], SESS["inp"], SESS["outs"]
          rgb = cv2.cvtColor(img, cv2.COLOR_BGR2RGB)
          if STATE["kind"] == "ssd":
              sc = min(1.0, 640.0 / max(h, w))
              small = cv2.resize(rgb, (int(w * sc), int(h * sc))) if sc < 1 else rgb
              dt = np.uint8 if "uint8" in inp.type else np.float32
              res = dict(zip(outs, s.run(outs, {inp.name: small[None].astype(dt)})))
              pick = lambda key: next(v for k, v in res.items() if key in k.lower())
              return decode_ssd(pick("boxes")[0], pick("classes")[0], pick("scores")[0], pick("num")[0] if any("num" in k.lower() for k in res) else len(pick("scores")[0]), conf)
          shape = inp.shape
          size = int(shape[2]) if len(shape) == 4 and isinstance(shape[2], int) else 640
          lb, r, px, py = letterbox(rgb, size)
          x = (lb.astype(np.float32) / 255.0).transpose(2, 0, 1)[None]
          pred = s.run(None, {inp.name: x})[0]
          return decode_yolo(pred, conf, r, px, py, w, h)


      def run_hog(img, conf):
          h, w = img.shape[:2]
          sc = 640.0 / w if w > 640 else 1.0
          small = cv2.resize(img, (int(w * sc), int(h * sc))) if sc != 1.0 else img
          rects, weights = HOG.detectMultiScale(small, winStride=(8, 8), padding=(8, 8), scale=1.05)
          out = []
          sh, sw = small.shape[:2]
          for (x, y, bw, bh), wt in zip(rects, np.array(weights).flatten()):
              c = max(0.0, min(0.99, float(wt) / 2.5))
              if c >= conf:
                  out.append({"label": "person", "group": "person", "conf": round(c, 3), "box": [x / sw, y / sh, (x + bw) / sw, (y + bh) / sh]})
          return out


      def detect(img, conf):
          t0 = time.time()
          with LOCK:
              res = run_onnx(img, conf) if SESS["s"] is not None else run_hog(img, conf)
          STATE["count"] += 1
          STATE["last_ms"] = int((time.time() - t0) * 1000)
          res.sort(key=lambda d: -d["conf"])
          return res


      ID_NAME = {"person": "orang", "bicycle": "sepeda", "car": "mobil", "motorcycle": "motor", "bus": "bus", "truck": "truk", "bird": "burung",
                 "cat": "kucing", "dog": "anjing", "horse": "kuda", "sheep": "domba", "cow": "sapi", "elephant": "gajah", "bear": "beruang",
                 "zebra": "zebra", "giraffe": "jerapah"}
      GROUP_TAG = {"person": "orang", "vehicle": "kendaraan", "animal": "hewan"}


      def dhash(img):
          g = cv2.cvtColor(img, cv2.COLOR_BGR2GRAY)
          g = cv2.resize(g, (9, 8), interpolation=cv2.INTER_AREA)
          bits = (g[:, 1:] > g[:, :-1]).flatten()
          v = 0
          for b in bits:
              v = (v << 1) | int(b)
          return "%016x" % v


      def analyze(img, conf):
          """Label otomatis untuk satu foto: objek, kualitas, orientasi, warna dominan, dan sidik jari visual (dHash)."""
          h, w = img.shape[:2]
          sc = 800.0 / max(h, w)
          small = cv2.resize(img, (int(w * sc), int(h * sc)), interpolation=cv2.INTER_AREA) if sc < 1 else img
          gray = cv2.cvtColor(small, cv2.COLOR_BGR2GRAY)
          blur = float(cv2.Laplacian(gray, cv2.CV_64F).var())
          bright = float(gray.mean())
          hsv = cv2.cvtColor(small, cv2.COLOR_BGR2HSV)
          sat = float(hsv[:, :, 1].mean())
          tags, objs = [], []
          try:
              for d in detect(small, conf):
                  nm = ID_NAME.get(d["label"], d["label"])
                  if nm not in objs:
                      objs.append(nm)
                  for t in (nm, GROUP_TAG.get(d.get("group"), "")):
                      if t and t not in tags:
                          tags.append(t)
          except Exception:
              pass
          ratio = w / float(h)
          tags.append("lanskap" if ratio > 1.15 else "potret" if ratio < 0.87 else "persegi")
          if blur < 45:
              tags.append("buram")
          if bright < 55:
              tags.append("gelap")
          elif bright > 205:
              tags.append("terang")
          if sat < 18:
              tags.append("hitam-putih" if sat < 6 else "pucat")
          else:
              hue = hsv[:, :, 0][hsv[:, :, 1] > 60]
              if hue.size > small.shape[0] * small.shape[1] * 0.25:
                  hm = float(np.median(hue)) * 2
                  for lo, hi, nm in ((0, 15, "merah"), (15, 45, "oranye-kuning"), (45, 75, "kuning"), (75, 170, "hijau"), (170, 260, "biru"), (260, 330, "ungu"), (330, 361, "merah")):
                      if lo <= hm < hi:
                          tags.append(nm)
                          break
          return {"tags": tags, "objects": objs, "blur": round(blur, 1), "bright": round(bright, 1), "hash": dhash(img), "w": w, "h": h,
                  "mode": STATE["mode"]}


      def annotate(img, dets):
          h, w = img.shape[:2]
          for d in dets:
              x1, y1, x2, y2 = int(d["box"][0] * w), int(d["box"][1] * h), int(d["box"][2] * w), int(d["box"][3] * h)
              col = COLORS.get(d["group"], (255, 255, 255))
              cv2.rectangle(img, (x1, y1), (x2, y2), col, max(2, w // 400))
              txt = "%s %d%%" % (LABEL_ID.get(d["group"], d["group"]), int(d["conf"] * 100))
              ag = d.get("age")
              if ag and ag.get("face"):
                  txt += " | %s %s" % (ag["group"], ag["range"])
              (tw, th), _ = cv2.getTextSize(txt, cv2.FONT_HERSHEY_SIMPLEX, 0.6, 2)
              cv2.rectangle(img, (x1, max(0, y1 - th - 8)), (x1 + tw + 8, max(th + 8, y1)), col, -1)
              cv2.putText(img, txt, (x1 + 4, max(th + 2, y1 - 5)), cv2.FONT_HERSHEY_SIMPLEX, 0.6, (255, 255, 255), 2, cv2.LINE_AA)
          return img


      class H(BaseHTTPRequestHandler):
          protocol_version = "HTTP/1.1"

          def log_message(self, *a):
              pass

          def send(self, obj, code=200):
              b = json.dumps(obj).encode()
              self.send_response(code)
              self.send_header("Content-Type", "application/json")
              self.send_header("Content-Length", str(len(b)))
              self.end_headers()
              self.wfile.write(b)

          def do_GET(self):
              if urlparse(self.path).path == "/health":
                  return self.send({"ok": True, **{k: STATE[k] for k in ("mode", "model", "loading", "error", "kind", "count", "last_ms")}, "age": AGE["state"], "age_error": AGE["error"]})
              self.send({"error": "not found"}, 404)

          def do_POST(self):
              u = urlparse(self.path)
              n = int(self.headers.get("Content-Length") or 0)
              body = self.rfile.read(n) if 0 < n <= 12_000_000 else b""
              if u.path not in ("/detect", "/analyze") or not body:
                  return self.send({"error": "bad request"}, 400)
              q = parse_qs(u.query)
              if u.path == "/analyze":
                  img = cv2.imdecode(np.frombuffer(body, np.uint8), cv2.IMREAD_COLOR)
                  if img is None:
                      return self.send({"error": "gambar tidak valid"}, 400)
