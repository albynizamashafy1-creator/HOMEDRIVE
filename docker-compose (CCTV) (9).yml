      /* ---------- akses admin (owner) ---------- */
      CCT.drawAccess = async function(b) {
        let j; try { j = await api('cctv/access'); } catch(e) { b.innerHTML = emptyBox('alert', 'Gagal memuat', esc(e.message)); return; }
        if (!j.admins.length) { b.innerHTML = emptyBox('users', 'Belum ada admin', 'Buat akun admin di Panel owner → Pengguna, lalu berikan akses CCTV di sini.'); return; }
        const sw = (k, label, on) => `<label class="o"><span class="sw"><input type="checkbox" data-k="$${k}" $${on?'checked':''}><i></i></span>$${label}</label>`;
        b.innerHTML = `<p class="hint" style="margin:0 0 12px">Owner selalu punya akses penuh. Admin hanya melihat menu CCTV setelah Anda memberi akses. Admin tidak bisa mengubah kamera, menghapus rekaman, atau memberi akses ke orang lain.</p>`
          + j.admins.map(a => { const p = a.perms, all = !p || p.cams === 'all';
            return `<div class="cacc" data-u="$${a.id}"><div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">$${av2(a.username, 34)}<b style="flex:1">$${esc(a.username)}</b>$${p ? '<em class="pill">punya akses</em>' : '<em class="pill" style="background:var(--s2);color:var(--muted)">tanpa akses</em>'}$${a.disabled?'<em class="pill">nonaktif</em>':''}</div>`
              + `<div class="cams">$${sw('live','Lihat langsung', p ? p.live : true)}$${sw('ptz','Kendali PTZ', p ? p.ptz : false)}$${sw('rec','Rekaman', p ? p.rec : false)}$${sw('snap','Simpan gambar', p ? p.snap : true)}$${sw('talk','Bicara ke kamera', p ? p.talk : false)}</div>`
              + `<div class="lbl">Kamera yang boleh diakses</div><div class="cams"><label class="o"><input type="radio" name="r$${a.id}" value="all" $${all?'checked':''}>Semua kamera</label><label class="o"><input type="radio" name="r$${a.id}" value="sel" $${all?'':'checked'}>Pilih kamera</label></div>`
              + `<div class="cams" data-sel style="$${all?'display:none':''}">$${CCT.cams.map(c => `<label class="o"><input type="checkbox" data-c="$${c.id}" $${!all && p.cams.includes(c.id)?'checked':''}>$${esc(c.name)}</label>`).join('') || '<small class="hint">Belum ada kamera.</small>'}</div>`
              + `<div style="display:flex;gap:8px;margin-top:12px"><button class="btn pri sm" data-save>Simpan</button>$${p?'<button class="btn sm dng" data-rev>Cabut akses</button>':''}</div></div>`; }).join('');
        b.querySelectorAll('.cacc').forEach(card => {
          const uid = +card.dataset.u;
          card.querySelectorAll('input[type=radio]').forEach(r => r.onchange = () => card.querySelector('[data-sel]').style.display = card.querySelector('input[type=radio]:checked').value === 'sel' ? '' : 'none');
          card.querySelector('[data-save]').onclick = async () => {
