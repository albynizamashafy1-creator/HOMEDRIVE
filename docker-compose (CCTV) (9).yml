          <button class="pvb" id="pvAuto" title="Putar berurutan otomatis" style="font-size:11px;font-weight:800;letter-spacing:.3px">AUTO</button><button class="pvb" id="pvPlay" title="Slideshow">$${ic('play',20)}</button><button class="pvb hidden" id="pvCard" title="Kartu ucapan">$${ic('gift',20)}</button><button class="pvb" id="pvStar" title="Bintang"></button><button class="pvb" id="pvInfo" title="Detail">$${ic('info',20)}</button><button class="pvb" id="pvShare" title="Bagikan">$${ic('link',20)}</button><a class="pvb" id="pvDl" title="Unduh">$${ic('download',20)}</a><button class="pvb" id="pvTrash" title="Sampah">$${ic('trash',20)}</button></div>
          <div class="pvstage"><button class="pvnav l" id="pvL">$${ic('chevron',24)}</button><div id="pvBody"></div><button class="pvnav r" id="pvR">$${ic('chevron',24)}</button></div>`;
        document.body.append(pv);
        const cur = () => list[idx];
        let slide = null; const close = () => { clearInterval(slide); pv.remove(); PV = null; };
        const show = async (edit) => {
          const f = cur(), u = dl(f.id,true), k = kind(f), b = pv.querySelector('#pvBody'); b.classList.remove('zoom');
          pv.querySelector('#pvName').textContent = f.name; pv.querySelector('#pvCount').textContent = list.length>1 ? `$${idx+1} / $${list.length}` : fmtSize(f.size);
          pv.querySelector('#pvDl').href = dl(f.id); pv.querySelector('#pvStar').innerHTML = ic('star',20,f.starred?'fill':'');
