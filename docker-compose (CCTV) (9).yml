      .note code{background:var(--bg);padding:1px 5px;border-radius:5px}
      .spec{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg);margin-bottom:12px}
      .spec .a{font-size:30px;font-weight:800;line-height:1.1}.spec .b{color:var(--muted);margin-top:4px}
      /* ---- panggung pratinjau */
      #stage{position:relative;min-width:0;min-height:0;overflow:hidden;background:
       radial-gradient(color-mix(in srgb,var(--text) 10%,transparent) 1px,transparent 1.2px) 0 0/18px 18px,var(--bg)}
      #frameWrap{position:absolute;left:50%;top:14px;transform-origin:top center;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 24px 60px -20px rgba(0,0,0,.45),0 0 0 1px var(--line);transition:width .2s,height .2s}
      #frameWrap.phone{border-radius:34px;box-shadow:0 24px 60px -20px rgba(0,0,0,.5),0 0 0 9px #15171d,0 0 0 10px #343844}
      #frameWrap.tablet{border-radius:22px;box-shadow:0 24px 60px -20px rgba(0,0,0,.5),0 0 0 8px #15171d,0 0 0 9px #343844}
      #pv{width:100%;height:100%;border:0;display:block;background:var(--bg)}
      #cmp{position:absolute;top:22px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.78);color:#fff;padding:5px 14px;border-radius:99px;font-weight:650;pointer-events:none;z-index:3}
      #load{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);pointer-events:none}
      /* ---- modal & toast */
      .mbg{position:fixed;inset:0;background:rgba(8,9,14,.55);display:grid;place-items:center;z-index:50;padding:16px;backdrop-filter:blur(3px)}
      .modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;width:100%;max-width:440px;max-height:88vh;overflow:auto;box-shadow:0 30px 80px -20px rgba(0,0,0,.5)}
      .modal.wide{max-width:600px}
      .modal h2{margin:0 0 10px;font-size:17px}
      .modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
      #toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:60;align-items:center}
      .toast{background:#111827;color:#fff;padding:10px 16px;border-radius:12px;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);font-weight:600;animation:up .2s}
      .toast.err{background:var(--danger)}
      @keyframes up{from{opacity:0;transform:translateY(8px)}}
      #gate{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:80;text-align:center;padding:20px}
      #gate .box{max-width:380px}#gate h2{margin:12px 0 6px}#gate p{color:var(--muted)}
      @media(max-width:900px){
        #main{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) 52vh}
        #stage{order:-1}
        #left{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);border-right:0;border-top:1px solid var(--line)}
        #rail{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:6px}
        #rail button{min-width:58px}
      }
