        else html = j.items.length ? `<div class="smgrid">$${j.items.map(it => card(it, false)).join('')}</div>` : '';
        if (!html) { L.innerHTML = emptyBox('sparkle', t === 'dupes' ? 'Tidak ada foto kembar' : 'Tidak ada foto ' + (t === 'blurry' ? 'buram' : 'gelap'), 'Hanya foto yang sudah dianalisis yang diperiksa.'); return; }
        L.innerHTML = `<div class="cct-bar"><span class="cct-msg">Centang foto yang ingin dibuang, lalu pindahkan ke sampah (masih bisa dipulihkan).</span><button class="btn dng sm" id="smDel">$${ic('trash',15)}<span>Pindahkan ke sampah</span></button></div>` + html;
        L.querySelector('#smDel').onclick = async () => {
