        body.innerHTML = `<div class="pgrid" style="margin-top:0">` +
          `<div class="c6">$${panel('Pengumuman', `<p class="hint" style="margin:0 0 10px">Tampil sebagai banner untuk semua pengguna secara langsung, tanpa reload.</p><textarea id="owAnn" rows="3" maxlength="300" placeholder="Contoh: Server akan dimatikan Minggu pukul 02.00 untuk perawatan.">$${esc(ow.announcement||'')}</textarea><label class="chkline"><input type="checkbox" id="owNot"> Kirim juga sebagai notifikasi ke semua pengguna</label><div style="display:flex;gap:8px;margin-top:14px"><button class="btn sm" data-adm="ann-xmas">🎉 Template event</button><button class="btn pri sm" data-adm="ann-save">Simpan pengumuman</button>$${ow.announcement ? '<button class="btn sm" data-adm="ann-clear">Hapus</button>' : ''}</div>`)}</div>` +
          `<div class="c6">$${panel('Kebijakan penyimpanan', `<div class="fgrid"><div class="field"><label class="lbl">Batas ukuran per file (MB)</label><input type="number" id="cfMax" min="0" step="1" value="$${cfg.max_upload_mb || ''}" placeholder="Tanpa batas"><div class="hint">Tidak berlaku untuk owner.</div></div><div class="field"><label class="lbl">Kuota bawaan pengguna baru (GB)</label><input type="number" id="cfDq" min="0" step="any" value="$${cfg.default_quota_gb == null ? '' : cfg.default_quota_gb}" placeholder="Tidak ada"><div class="hint">Dipakai bila kuota dikosongkan saat membuat atau menyetujui pengguna.</div></div><div class="field"><label class="lbl">Sampah dikosongkan otomatis (hari)</label><input type="number" id="cfTd" min="0" step="1" value="$${cfg.trash_days == null ? '' : cfg.trash_days}" placeholder="Bawaan server ($${cfg.trash_days_env})"><div class="hint">0 = jangan hapus otomatis.</div></div></div><div class="setrow" style="margin-top:8px"><div class="st"><b>Izinkan pengguna membuat tautan berbagi</b><small>Tautan yang sudah ada tetap aktif sampai dicabut.</small></div><label class="sw"><input type="checkbox" id="cfSh" $${cfg.allow_share?'checked':''}><i></i></label></div><div style="margin-top:10px"><button class="btn pri sm" data-adm="cfg-save">Simpan kebijakan</button></div>`)}</div>` +
          `<div class="c6">$${panel('Kirim pesan', `<div class="field"><label class="lbl">Penerima</label><select id="msT"><option value="all">Semua pengguna</option>$${opts}</select></div><label class="lbl">Judul</label><input type="text" id="msH" maxlength="80" placeholder="Pesan dari owner"><label class="lbl">Isi pesan</label><textarea id="msB" rows="3" maxlength="300" placeholder="Tulis pesan…"></textarea><div style="margin-top:14px"><button class="btn pri sm" data-adm="msg-send">$${ic('send',16)}Kirim notifikasi</button></div>`)}</div>` +
          `<div class="c6">$${panel('Serahkan kepemilikan', `<p class="hint" style="margin:0 0 10px">Pindahkan peran owner ke pengguna lain. Anda tetap menjadi admin. Tindakan ini hanya bisa dibatalkan oleh owner yang baru.</p><div class="field"><label class="lbl">Owner baru</label><select id="xfU">$${opts || '<option value="">Belum ada pengguna lain</option>'}</select></div><label class="lbl">Konfirmasi dengan password Anda</label><input type="password" id="xfP" autocomplete="current-password"><div style="margin-top:14px"><button class="btn dng sm" data-adm="xfer" $${others.length?'':'disabled'}>$${ic('crown',16)}Serahkan kepemilikan</button></div>`)}</div></div>`;
      }

      /* ---------- penanganan klik / input ---------- */
      async function admAct(a, d, el, e) {
        const owner = !!S.me.is_owner;
        try {
          switch (a) {
            case 'goto': return admGoto(d.v);
            case 'user-open': return userDetail(+d.v);
            case 'user-menu': { const u = ADM.users.find(x => x.id === +d.v), r = el.getBoundingClientRect(); return showMenu(userMenuEntries(u), r.right, r.bottom + 4, true); }
            case 'user-chk': el.checked ? ADM.sel.add(+d.v) : ADM.sel.delete(+d.v); return drawUsers();
            case 'user-all': { const ok = ADM.users.filter(u => !u.is_owner && u.id !== S.me.id); if (el.checked) ok.forEach(u => ADM.sel.add(u.id)); else ADM.sel.clear(); return drawUsers(); }
            case 'uf': ADM.uf = d.v; return drawUsers();
            case 'user-add': return userAddDialog();
            case 'bulk': return bulkAct(d.op);
            case 'rq': return reqOp(d.k, d.op, +d.v);
            case 'act-more': return actLoad(false);
            case 'act-export': location.href = '/api/activity?' + actQS({export:'1'}); return;
            case 'sh-copy': { const url = location.origin + '/s/' + d.v; try { await navigator.clipboard.writeText(url); toast('Tautan disalin'); } catch(er) { toast(url); } return; }
            case 'sh-revoke': if (!await confirmBox('Cabut tautan ini?', 'Siapa pun yang memakai tautan ini tidak bisa lagi mengaksesnya.', 'Cabut')) return; await api('admin/share-revoke', {ref:d.v}); toast('Tautan dicabut'); return ADM.draw(true);
            case 'sh-all': if (!await confirmBox('Cabut semua tautan berbagi?', 'Semua tautan milik semua pengguna berhenti berfungsi sekarang juga.', 'Cabut semua')) return; await api('admin/shares-revoke-all', {}); toast('Semua tautan dicabut'); return ADM.draw(true);
            case 'se-revoke': await api('admin/session-revoke', {id:d.v}); toast('Sesi dikeluarkan'); return ADM.draw(true);
            case 'sys': if (d.v === 'cleanup') { const r = await api('system/cleanup', {}); toast(r.removed + ' file yatim dihapus, ' + fmtSize(r.freed) + ' dibebaskan'); }
              else { if (!await confirmBox('Hapus catatan tanpa file?', 'Catatan file yang isinya sudah hilang dari disk dihapus dari database beserta tautan berbaginya.', 'Hapus')) return; const r = await api('system/drop-missing', {}); toast(r.removed + ' catatan dihapus'); }
              return ADM.draw(true);
            case 'maint': { const on = el.checked; await api('owner/maintenance', {on}); toast(on ? 'Mode pemeliharaan aktif' : 'Mode pemeliharaan dimatikan'); return ADM.draw(true); }
            case 'bk-now': toast('Membuat cadangan…'); await api('owner/backup-now', {}); toast('Cadangan dibuat'); return ADM.draw(true);
            case 'bk-del': if (!await confirmBox('Hapus cadangan?', d.v, 'Hapus')) return; await api('owner/backup-delete', {file:d.v}); return ADM.draw(true);
            case 'ann-save': await api('owner/announce', {text:$$('#owAnn').value, notify:$$('#owNot').checked}); toast('Pengumuman disimpan'); return ADM.draw(true);
            case 'ann-xmas': $$('#owAnn').value = XM.greeting(); $$('#owNot').checked = true; return;
            case 'ev-pick': ADM.ev.key = d.v; ADM.ev.style = 0; return drawEvents();
            case 'ev-style': ADM.ev.style = +d.v; return drawEvents();
            case 'ev-prev': drawEvents(); return XM.preview(ADM.ev.key, ADM.ev.style);
            case 'ev-launch': { drawEvents(); const e = ADM.ev; if (!await evCountdown(e.key)) return toast('Peluncuran dibatalkan'); await api('owner/event', {key:e.key, style:e.style, days:e.days, notify:e.notify}); await refreshMe(); toast(EVD[e.key].emo + ' Event ' + EVD[e.key].name + ' diluncurkan'); return admEvents($$('#admBody'), ADM.seq); }
            case 'ev-sched': { drawEvents(); const e = ADM.ev; if (!e.at) { toast('Isi tanggal dan jam peluncuran'); return; } const at = new Date(e.at).getTime()/1000; await api('owner/event-schedule', {key:e.key, style:e.style, days:e.days, notify:e.notify, at}); e.at = ''; toast('Peluncuran ' + EVD[e.key].name + ' dijadwalkan'); return admEvents($$('#admBody'), ADM.seq); }
            case 'ev-unsched': await api('owner/event-unschedule', {id:d.v}); toast('Jadwal dibatalkan'); return admEvents($$('#admBody'), ADM.seq);
            case 'ev-stop': await api('owner/event', {key:''}); await refreshMe(); toast('Event dihentikan'); return admEvents($$('#admBody'), ADM.seq);
            case 'ann-clear': await api('owner/announce', {text:''}); toast('Pengumuman dihapus'); return ADM.draw(true);
            case 'cfg-save': await api('admin/config', {max_upload_mb:$$('#cfMax').value, default_quota_gb:$$('#cfDq').value, trash_days:$$('#cfTd').value, allow_share:$$('#cfSh').checked}); toast('Kebijakan disimpan'); refreshMe(); return;
            case 'msg-send': { const r = await api('admin/message', {id:$$('#msT').value, title:$$('#msH').value, text:$$('#msB').value}); toast('Pesan dikirim ke ' + r.count + ' pengguna'); $$('#msB').value = ''; $$('#msH').value = ''; return; }
            case 'xfer': { const sel = $$('#xfU'), who = sel.options[sel.selectedIndex] ? sel.options[sel.selectedIndex].text : ''; if (!sel.value) return;
              if (!await confirmBox('Serahkan kepemilikan ke ' + who + '?', 'Anda tidak lagi menjadi owner dan kehilangan akses ke pengaturan owner.', 'Serahkan')) return;
              await api('admin/transfer', {id:+sel.value, password:$$('#xfP').value}); toast('Kepemilikan diserahkan'); await refreshMe(); return route(); }
          }
        } catch(er) { toast(er.message); if (ADM.tab === 'settings' || ADM.tab === 'system') ADM.draw(true); }
      }
      $$('#content').addEventListener('click', e => {
        if (S.view !== 'admin') return;
        const t = e.target.closest('[data-adm-tab]'); if (t) { e.stopPropagation(); return go('#/admin/' + t.dataset.admTab); }
        const el = e.target.closest('[data-adm]'); if (!el) return;
        e.stopPropagation();
        if (el.matches('input[type=checkbox]') && el.dataset.adm !== 'maint' && el.dataset.adm !== 'user-chk' && el.dataset.adm !== 'user-all') return;
        admAct(el.dataset.adm, el.dataset, el, e);
      });
      $$('#content').addEventListener('input', e => {
        if (S.view !== 'admin') return; const id = e.target.id;
        if (id === 'admQ') { ADM.uq = e.target.value; drawUsers(); }
        else if (id === 'shQ') { ADM.shQ = e.target.value; drawShares(); }
        else if (id === 'seQ') { ADM.seQ = e.target.value; drawSessions(); }
        else if (id === 'acQ') { clearTimeout(ADM.qt); ADM.act.q = e.target.value.trim(); ADM.qt = setTimeout(() => actLoad(true).catch(er => toast(er.message)), 350); }
      });
      $$('#content').addEventListener('change', e => {
        if (S.view !== 'admin') return;
        if (e.target.id === 'acU') { ADM.act.user = e.target.value; actLoad(true).catch(er => toast(er.message)); }
        else if (e.target.id === 'acA') { ADM.act.action = e.target.value; actLoad(true).catch(er => toast(er.message)); }
      });

      /* =====================================================================
         VERIFIKASI WAJAH (langkah kedua login)
         Pengenalan dilakukan di browser (face-api, deskriptor 128 angka);
         server hanya menyimpan dan membandingkan angka, tidak pernah menerima foto.
         ===================================================================== */
      Object.assign(I, {
        face:'<path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><path d="M9 10v1.5M15 10v1.5M12 10.5v3h-1M9.2 15.5c.7.8 1.7 1.2 2.8 1.2s2.1-.4 2.8-1.2"/>',
        copy:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/>',
      });
      Object.assign(ACT, {face_on:['face','Mengaktifkan verifikasi wajah'], face_off:['face','Menonaktifkan verifikasi wajah'], face_fail:['shield','Verifikasi wajah gagal'],
        face_reset:['face','Reset verifikasi wajah'], face_codes:['key','Membuat kode pemulihan baru']});

      const FACE = {ready:false, loading:null, cdn:['https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12', 'https://unpkg.com/@vladmandic/face-api@1.7.12']};
      const sleep = ms => new Promise(r => setTimeout(r, ms));
      function loadScript(src) { return new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => { s.remove(); no(new Error('gagal')); }; document.head.append(s); }); }
      async function faceLoad() {
        if (FACE.ready) return window.faceapi;
        if (!FACE.loading) FACE.loading = (async () => {
          let base = null;
          if (!window.faceapi) for (const b of FACE.cdn) { try { await loadScript(b + '/dist/face-api.js'); base = b; break; } catch(e) {} }
          else base = FACE.cdn[0];
          if (!base || !window.faceapi) throw new Error('Pustaka pengenal wajah gagal dimuat. Pastikan perangkat ini terhubung ke internet, lalu coba lagi.');
          const u = base + '/model';
          await Promise.all([faceapi.nets.tinyFaceDetector.loadFromUri(u), faceapi.nets.faceLandmark68Net.loadFromUri(u), faceapi.nets.faceRecognitionNet.loadFromUri(u)]);
          FACE.ready = true;
        })().catch(e => { FACE.loading = null; throw e; });
        await FACE.loading; return window.faceapi;
      }
      const faceView = () => `<div class="fscan"><div class="fcam"><video playsinline muted></video><div class="fring"></div></div><div class="fmsg">Memuat…</div><div class="fsteps"><i></i><i></i><i></i></div></div>`;

      /* Pindai wajah: harus menghadap depan -> menoleh ke samping -> kembali ke depan (anti foto diam),
         lalu mengambil `count` deskriptor. Mengembalikan {promise, stop}. */
      function faceScan(box, count) {
        let stopped = false, stream = null;
        const msg = t => { const e = box.querySelector('.fmsg'); if (e) e.textContent = t; };
        const steps = n => box.querySelectorAll('.fsteps i').forEach((x, i) => x.classList.toggle('on', i < n));
        const promise = (async () => {
          try {
            steps(0); msg('Memuat model pengenal wajah…');
            const fa = await faceLoad();
            if (!window.isSecureContext || !(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) throw new Error('Kamera hanya bisa dipakai lewat HTTPS atau localhost. Buka HomeDrive dengan alamat https://.');
            try { stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user', width:{ideal:640}, height:{ideal:480}}, audio:false}); }
            catch(e) { throw new Error('Izin kamera ditolak atau kamera tidak ditemukan.'); }
            const v = box.querySelector('video'); v.srcObject = stream; await v.play();
            const opt = new fa.TinyFaceDetectorOptions({inputSize:320, scoreThreshold:.5});
            const t0 = Date.now(); let phase = 0, hold = 0;
            msg('Hadapkan wajah ke kamera'); steps(0);
            while (!stopped) {
              if (Date.now() - t0 > 50000) throw new Error('Waktu habis. Coba lagi.');
              const r = await fa.detectSingleFace(v, opt).withFaceLandmarks();
              await sleep(70);
              if (!r) { hold = 0; msg(phase ? 'Wajah tidak terlihat, tetap di depan kamera' : 'Hadapkan wajah ke kamera'); continue; }
              const p = r.landmarks.positions, ratio = (p[30].x - p[0].x) / (p[16].x - p[0].x), off = Math.abs(ratio - .5), big = r.detection.box.width > v.videoWidth * .22;
              if (!big) { hold = 0; msg('Dekatkan wajah ke kamera'); continue; }
              if (phase === 0) { if (off < .07) { if (++hold >= 3) { phase = 1; hold = 0; steps(1); msg('Bagus. Sekarang palingkan kepala ke samping'); } } else hold = 0; }
              else if (phase === 1) { if (off > .14) { if (++hold >= 2) { phase = 2; hold = 0; steps(2); msg('Kembali menghadap depan dan diam sebentar'); } } else hold = 0; }
              else if (off < .07) { if (++hold >= 3) break; } else hold = 0;
            }
            if (stopped) throw new Error('dibatalkan');
            steps(3); msg('Memindai wajah…');
            const out = [];
            for (let k = 0, tries = 0; out.length < count && tries < 20 && !stopped; tries++) {
              const r = await fa.detectSingleFace(v, opt).withFaceLandmarks().withFaceDescriptor();
              if (r) out.push(Array.from(r.descriptor));
              await sleep(300);
            }
            if (out.length < count) throw new Error('Wajah tidak terbaca jelas. Coba lagi dengan cahaya yang cukup.');
            return out;
          } finally { if (stream) stream.getTracks().forEach(t => t.stop()); }
        })();
        return {promise, stop: () => { stopped = true; if (stream) stream.getTracks().forEach(t => t.stop()); }};
      }
      const meanVec = vs => vs[0].map((_, i) => vs.reduce((a, v) => a + v[i], 0) / vs.length);

      /* ---------- langkah kedua saat login ---------- */
      function faceLoginStep(res) {
        const m = modal(`<h2>Verifikasi wajah</h2><p class="hint" style="margin:-6px 0 12px">Halo, <b>$${esc(res.username)}</b>. Pindai wajah Anda untuk menyelesaikan login.</p><div id="fbox">$${faceView()}</div>
          <div class="err" id="fe"></div><div class="actions" style="justify-content:space-between"><button class="btn" id="fc">Batal</button><span style="display:flex;gap:8px"><button class="btn hidden" id="fr">Coba lagi</button>$${res.recovery ? '<button class="btn" id="fk">Kode pemulihan</button>' : ''}</span></div>`);
        let scan = null, done = false;
        const fe = m.querySelector('#fe'), retry = m.querySelector('#fr');
        const finish = async () => { done = true; m.remove(); $$('#ap').value = ''; await boot(); };
        const fail = e => {
          if (e.code === 'face_expired') { done = true; m.remove(); showAuth(false); $$('#authErr').textContent = e.message; return; }
          fe.textContent = e.message; retry.classList.remove('hidden');
        };
        const start = () => {
          fe.textContent = ''; retry.classList.add('hidden');
          m.querySelector('#fbox').innerHTML = faceView();
          scan = faceScan(m.querySelector('#fbox'), 2);
          scan.promise.then(async d => {
            if (done) return;
            try { await api('face/verify', {ticket:res.ticket, descriptor:meanVec(d)}); await finish(); } catch(e) { fail(e); }
          }).catch(e => { if (!done) fail(e); });
        };
        const close = () => { done = true; if (scan) scan.stop(); m.remove(); };
        new MutationObserver((_, mo) => { if (!document.body.contains(m)) { mo.disconnect(); done = true; if (scan) scan.stop(); } }).observe(document.body, {childList:true});
        m.querySelector('#fc').onclick = close; retry.onclick = start;
        const fk = m.querySelector('#fk');
        if (fk) fk.onclick = () => {
          if (scan) scan.stop();
          m.querySelector('#fbox').innerHTML = `<label class="lbl">Kode pemulihan</label><input type="text" id="fcode" placeholder="XXXX-XXXX-XXXX" autocomplete="off" style="text-transform:uppercase;letter-spacing:1px"><p class="hint">Tiap kode hanya berlaku sekali. Setelah masuk, buat kode baru dari menu akun.</p><button class="btn pri" id="fgo" style="width:100%">Masuk dengan kode</button>`;
          fk.classList.add('hidden'); retry.classList.remove('hidden'); retry.textContent = 'Pakai wajah';
          retry.onclick = () => { retry.textContent = 'Coba lagi'; retry.onclick = start; fk.classList.remove('hidden'); start(); };
          const go = async () => { try { await api('face/verify', {ticket:res.ticket, code:m.querySelector('#fcode').value}); await finish(); } catch(e) { fail(e); retry.classList.remove('hidden'); } };
          m.querySelector('#fgo').onclick = go; m.querySelector('#fcode').onkeydown = e => { if (e.key === 'Enter') go(); }; m.querySelector('#fcode').focus();
        };
        start();
      }

      /* ---------- pengaturan di menu akun ---------- */
      function pwPrompt(title, text) {
        return new Promise(res => {
          const m = modal(`<h2>$${esc(title)}</h2>$${text ? `<p class="hint" style="margin:-6px 0 8px">$${text}</p>` : ''}<label class="lbl">Password Anda</label><input type="password" id="pp" autocomplete="current-password"><div class="actions"><button class="btn" id="pc">Batal</button><button class="btn pri" id="po">Lanjut</button></div>`);
          const i = m.querySelector('#pp'); i.focus(); let ended = false;
          const end = v => { if (ended) return; ended = true; m.remove(); res(v); };
          m.querySelector('#pc').onclick = () => end(null); m.querySelector('#po').onclick = () => end(i.value);
          i.onkeydown = e => { if (e.key === 'Enter') end(i.value); };
          new MutationObserver((_, mo) => { if (!document.body.contains(m)) { mo.disconnect(); end(null); } }).observe(document.body, {childList:true});
        });
      }
      function showCodes(codes, title) {
        const txt = 'Kode pemulihan HomeDrive (' + S.me.username + ')\nSimpan di tempat aman. Tiap kode hanya berlaku sekali.\n\n' + codes.join('\n') + '\n';
        const m = modal(`<h2>$${esc(title)}</h2><p class="hint" style="margin:-6px 0 10px">Simpan kode ini. Kode dipakai bila kamera rusak atau wajah tidak dikenali. <b>Kode hanya ditampilkan sekali.</b></p>
          <div class="codes">$${codes.map(c => `<code>$${c}</code>`).join('')}</div>
