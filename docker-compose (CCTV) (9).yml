          def api_activity(self, method, name, q):
              u = self.need_user()
              allq = q.get("all", [""])[0] == "1" and bool(u["is_admin"])
              export = allq and q.get("export", [""])[0] == "1"
              try:
                  limit = max(1, min(int(q.get("limit", ["150"])[0]), 5000 if export else 500))
              except ValueError:
                  limit = 150
              where, params = [], []
              if allq:
                  uf = q.get("user", [""])[0]
                  if uf.isdigit():
                      where.append("a.user_id=?")
                      params.append(int(uf))
              else:
                  where.append("a.user_id=?")
                  params.append(u["id"])
              act = q.get("action", [""])[0]
              if act:
                  where.append("a.action=?")
                  params.append(act[:30])
              term = q.get("q", [""])[0].strip()
              if term:
                  where.append("a.detail LIKE ? ESCAPE '\\'")
                  params.append("%" + term.replace("\\", "\\\\").replace("%", "\\%").replace("_", "\\_") + "%")
              before = q.get("before", [""])[0]
              if before.isdigit():
                  where.append("a.id<?")
                  params.append(int(before))
              sql = ("SELECT a.id,a.action,a.detail,a.ts,s.username AS who FROM activity a JOIN users s ON s.id=a.user_id"
                     + (" WHERE " + " AND ".join(where) if where else "") + " ORDER BY a.id DESC LIMIT ?")
              with db() as c:
                  rows = c.execute(sql, params + [limit + 1]).fetchall()
                  if export:
                      with_log = c
                      log(with_log, u["id"], "export", "Ekspor log aktivitas")
              more = len(rows) > limit
              rows = rows[:limit]
              if export:
                  buf = io.StringIO()
                  w = csv.writer(buf)
                  w.writerow(["waktu", "pengguna", "aksi", "detail"])
                  safe = lambda v: ("'" + v) if v[:1] in ("=", "+", "-", "@") else v
                  for r in rows:
                      w.writerow([time.strftime("%Y-%m-%d %H:%M:%S", time.localtime(r["ts"])), safe(r["who"]), r["action"], safe(r["detail"] or "")])
                  body = buf.getvalue().encode("utf-8-sig")
                  self._headers(200, "text/csv; charset=utf-8", len(body),
                                {"Content-Disposition": "attachment; filename=homedrive-aktivitas-%s.csv" % time.strftime("%Y%m%d-%H%M"), "Cache-Control": "no-store"})
                  if not self.head_only:
                      self.wfile.write(body)
                  return
              self.send_json({"items": [dict(r) for r in rows], "more": more, "next": rows[-1]["id"] if rows else None})

          def api_duplicates(self, method, name, q):
              u = self.need_user()
              with db() as c:
                  rows = c.execute(
                      "SELECT id,name,size,parent_id,modified FROM items WHERE user_id=? AND trashed=0 AND is_folder=0 AND size>0 AND size IN "
                      "(SELECT size FROM items WHERE user_id=? AND trashed=0 AND is_folder=0 AND size>0 GROUP BY size HAVING COUNT(*)>1) "
                      "ORDER BY size DESC LIMIT 1500", (u["id"], u["id"])).fetchall()
              groups = {}
              for r in rows:
                  path = BLOBS / r["id"]
                  if not path.exists():
                      continue
                  hs = hashlib.sha256()
                  with open(path, "rb") as f:
                      for chunk in iter(lambda: f.read(CHUNK), b""):
                          hs.update(chunk)
                  groups.setdefault((r["size"], hs.hexdigest()), []).append(dict(r))
              out = [{"size": k[0], "items": sorted(v, key=lambda x: x["modified"])} for k, v in groups.items() if len(v) > 1]
              out.sort(key=lambda g: g["size"] * (len(g["items"]) - 1), reverse=True)
              self.send_json({"groups": out[:200], "reclaim": sum(g["size"] * (len(g["items"]) - 1) for g in out)})

          # ---- info folder, analisis penyimpanan, ekstrak ZIP, sistem & cadangan
          def tree_sizes(self, c, uid):
              """Ukuran, jumlah file, dan jumlah subfolder rekursif untuk tiap folder aktif (bukan sampah)."""
              rows = c.execute("SELECT id,parent_id,name,is_folder,size FROM items WHERE user_id=? AND trashed=0", (uid,)).fetchall()
              kids = {}
              for r in rows:
                  kids.setdefault(r["parent_id"], []).append(r)
              order, stack = [], list(kids.get(None, []))
              while stack:
                  r = stack.pop()
                  order.append(r)
                  if r["is_folder"]:
                      stack.extend(kids.get(r["id"], []))
              agg = {}
              for r in reversed(order):  # anak selalu diproses sebelum induknya
                  if not r["is_folder"]:
                      continue
                  s = n = d = 0
                  for k in kids.get(r["id"], []):
                      if k["is_folder"]:
                          a = agg[k["id"]]
                          s += a[0]
                          n += a[1]
                          d += a[2] + 1
                      else:
                          s += k["size"]
                          n += 1
                  agg[r["id"]] = (s, n, d)
              return rows, agg

          def api_info(self, method, name, q):
              u = self.need_user()
              iid = q.get("id", [""])[0]
              with db() as c:
                  r = self.own_item(c, u["id"], iid)
                  if not r["is_folder"]:
                      return self.send_json({"is_folder": False, "size": r["size"]})
                  _, agg = self.tree_sizes(c, u["id"])
              s, n, d = agg.get(iid, (0, 0, 0))
              self.send_json({"is_folder": True, "size": s, "files": n, "folders": d})

          def api_analyze(self, method, name, q):
              """Folder dan file terbesar milik pengguna."""
              u = self.need_user()
              with db() as c:
                  rows, agg = self.tree_sizes(c, u["id"])
              by_id = {r["id"]: r for r in rows}

              def path(r):
                  parts, hops = [], 0
                  while r is not None and hops < 60:
                      parts.append(r["name"])
                      r = by_id.get(r["parent_id"])
                      hops += 1
                  return " / ".join(reversed(parts))

              top = sorted(((v[0], k) for k, v in agg.items()), reverse=True)[:25]
              big = sorted((r for r in rows if not r["is_folder"] and r["size"] > 0), key=lambda r: r["size"], reverse=True)[:15]
              self.send_json({
                  "folders": [{"id": k, "path": path(by_id[k]), "size": s, "files": agg[k][1]} for s, k in top if s > 0],
                  "files": [{"id": r["id"], "name": r["name"], "parent_id": r["parent_id"],
                             "path": path(by_id.get(r["parent_id"])) if r["parent_id"] else "", "size": r["size"]} for r in big],
              })

          def api_extract(self, method, name, q):
              """Ekstrak file .zip milik pengguna ke folder baru di sebelahnya (cek kuota & anti zip-slip)."""
              u = self.need_user()
              d = self.read_json()
              now = time.time()
              made = []
              try:
                  with db() as c:
                      uid = u["id"]
                      r = self.own_item(c, uid, d.get("id"))
                      if r["is_folder"] or r["trashed"] or not r["name"].lower().endswith(".zip") or not (BLOBS / r["id"]).exists():
                          raise ApiError(400, "Hanya file .zip yang bisa diekstrak")
                      try:
                          zf = zipfile.ZipFile(BLOBS / r["id"])
                      except zipfile.BadZipFile:
                          raise ApiError(400, "File ZIP rusak atau tidak valid")
                      with zf:
                          infos = zf.infolist()
                          if len(infos) > 5000:
                              raise ApiError(400, "ZIP berisi terlalu banyak entri (maks. 5000)")
                          self.ensure_space(c, u, sum(i.file_size for i in infos if not i.is_dir()))
                          root = unique_name(c, uid, r["parent_id"], r["name"][:-4] or "Ekstrak")
                          root_id = uuid.uuid4().hex
                          c.execute("INSERT INTO items(id,user_id,parent_id,name,is_folder,created,modified) VALUES(?,?,?,?,1,?,?)",
                                    (root_id, uid, r["parent_id"], root, now, now))
                          cache = {(): root_id}

                          def folder_for(parts):
                              key = tuple(parts)
                              if key in cache:
                                  return cache[key]
                              pid = folder_for(parts[:-1])
                              fid = uuid.uuid4().hex
                              c.execute("INSERT INTO items(id,user_id,parent_id,name,is_folder,created,modified) VALUES(?,?,?,?,1,?,?)",
                                        (fid, uid, pid, parts[-1], now, now))
                              cache[key] = fid
                              return fid

                          count = 0
                          for info in infos:
                              parts = []
                              for p in info.filename.replace("\\", "/").split("/"):
                                  if p in ("", ".", ".."):
                                      continue
                                  try:
                                      parts.append(clean_name(p))
                                  except ApiError:
                                      parts = []
                                      break
                              if not parts or parts[0] == "__MACOSX":
                                  continue
                              if info.is_dir():
                                  folder_for(parts)
                                  continue
                              pid = folder_for(parts[:-1])
                              nm = unique_name(c, uid, pid, parts[-1])
                              iid = uuid.uuid4().hex
                              tmp = TMP / iid
                              made.append(tmp)
                              written = 0
                              try:
                                  with zf.open(info) as src, open(tmp, "wb") as dst:
                                      while True:
                                          chunk = src.read(CHUNK)
                                          if not chunk:
                                              break
                                          written += len(chunk)
                                          if written > info.file_size:
                                              raise ApiError(400, "ZIP tidak valid (ukuran tidak cocok)")
                                          dst.write(chunk)
                              except (RuntimeError, NotImplementedError, zipfile.BadZipFile):
                                  raise ApiError(400, "ZIP terenkripsi atau rusak, tidak bisa diekstrak")
                              os.replace(tmp, BLOBS / iid)
                              made.append(BLOBS / iid)
                              c.execute("INSERT INTO items(id,user_id,parent_id,name,is_folder,size,mime,created,modified) VALUES(?,?,?,?,0,?,?,?,?)",
                                        (iid, uid, pid, nm, written, guess_mime(nm), now, now))
                              count += 1
                      log(c, uid, "extract", f"{r['name']} ({count} file)")
                      sync_warn(c, uid)
              except BaseException:
                  for p in made:
                      p.unlink(missing_ok=True)
                  raise
              self.send_json({"id": root_id, "name": root, "count": count})

          def sys_scan(self, c):
              rows = {r["id"]: r for r in c.execute(
                  "SELECT i.id,i.name,i.size,i.user_id,u.username FROM items i JOIN users u ON u.id=i.user_id WHERE i.is_folder=0").fetchall()}
              disk, now = {}, time.time()
              for p in BLOBS.iterdir():
                  try:
                      st = p.stat()
                      disk[p.name] = (st.st_size, st.st_mtime)
                  except OSError:
                      pass
              orphan = [k for k, v in disk.items() if k not in rows and now - v[1] > 600]  # >10 menit: bukan unggahan yang sedang berjalan
              missing = [k for k in rows if k not in disk]
              mism = [k for k in rows if k in disk and disk[k][0] != rows[k]["size"]]
              return rows, disk, orphan, missing, mism

          def api_system(self, method, name, q):
              """Kesehatan sistem & perawatan (khusus owner)."""
              u = self.need_user()
              if not u["is_owner"]:
                  raise ApiError(403, "Hanya owner")
              sub = name.split("/")[1] if "/" in name else ""
              with db() as c:
                  rows, disk, orphan, missing, mism = self.sys_scan(c)
                  if method == "POST":
                      self.read_json()
                      if sub == "cleanup":
                          freed = 0
                          for k in orphan:
                              freed += disk[k][0]
                              (BLOBS / k).unlink(missing_ok=True)
                          log(c, u["id"], "cleanup", f"{len(orphan)} file yatim, {fmt_size(freed)}")
                          return self.send_json({"ok": True, "removed": len(orphan), "freed": freed})
                      if sub == "drop-missing":
                          owners = {rows[k]["user_id"] for k in missing}
                          for k in missing:
                              c.execute("DELETE FROM shares WHERE item_id=?", (k,))
                              c.execute("DELETE FROM items WHERE id=?", (k,))
                          for o in owners:
                              sync_warn(c, o)
                          log(c, u["id"], "cleanup", f"{len(missing)} catatan tanpa file dihapus")
                          EVENTS.emit("files")
                          return self.send_json({"ok": True, "removed": len(missing)})
                      raise ApiError(404, "Endpoint tidak ada")
                  cnt = c.execute("SELECT COALESCE(SUM(is_folder=0),0) f, COALESCE(SUM(is_folder=1),0) d FROM items WHERE trashed=0").fetchone()
                  data = {
                      "version": APP_VERSION, "python": sys.version.split()[0], "uptime": time.time() - START,
                      "users": c.execute("SELECT COUNT(*) n FROM users").fetchone()["n"],
                      "files": cnt["f"], "folders": cnt["d"],
                      "shares": c.execute("SELECT COUNT(*) n FROM shares").fetchone()["n"],
                      "sessions": c.execute("SELECT COUNT(*) n FROM sessions WHERE expires>?", (time.time(),)).fetchone()["n"],
                      "trash": c.execute("SELECT COALESCE(SUM(size),0) s FROM items WHERE trashed=1 AND is_folder=0").fetchone()["s"],
                  }
              try:
                  du = shutil.disk_usage(DATA)
                  data["disk"] = {"total": du.total, "free": du.free, "used": du.used}
              except OSError:
                  data["disk"] = {"total": 0, "free": 0, "used": 0}
              try:
                  data["db_size"] = DB_PATH.stat().st_size
              except OSError:
                  data["db_size"] = 0
              data["blob_size"] = sum(v[0] for v in disk.values())
              data["orphans"] = {"count": len(orphan), "size": sum(disk[k][0] for k in orphan)}
              data["missing_count"] = len(missing)
              data["missing"] = [{"id": k, "name": rows[k]["name"], "user": rows[k]["username"]} for k in missing[:20]]
              data["mismatch"] = len(mism)
              self.send_json(data)

          def api_backup(self, method, name, q):
              """Unduh salinan konsisten database (akun, struktur folder, tautan). File asli ada di folder data/blobs."""
              u = self.need_user()
              if not u["is_owner"]:
                  raise ApiError(403, "Hanya owner")
              fn = q.get("file", [""])[0]
              if fn:
                  fp = BACKUPS / fn
                  if not re.fullmatch(r"(auto|manual)-\d{8}-\d{6}\.db", fn) or not fp.is_file():
                      raise ApiError(404, "Cadangan tidak ditemukan")
                  self._headers(200, "application/octet-stream", fp.stat().st_size,
                                {"Content-Disposition": f"attachment; filename={fn}", "Cache-Control": "no-store"})
                  if not self.head_only:
                      with open(fp, "rb") as f:
                          shutil.copyfileobj(f, self.wfile, CHUNK)
                  return
              tmp = TMP / ("backup-" + uuid.uuid4().hex)
              try:
                  src = db()
                  dst = sqlite3.connect(tmp)
                  try:
                      src.backup(dst)
                  finally:
                      dst.close()
                      src.close()
                  size = tmp.stat().st_size
                  stamp = time.strftime("%Y%m%d-%H%M", time.localtime())
                  with db() as c:
                      log(c, u["id"], "backup", f"{fmt_size(size)}")
                  self._headers(200, "application/octet-stream", size,
                                {"Content-Disposition": f"attachment; filename=homedrive-{stamp}.db", "Cache-Control": "no-store"})
                  if not self.head_only:
                      with open(tmp, "rb") as f:
                          shutil.copyfileobj(f, self.wfile, CHUNK)
              finally:
                  tmp.unlink(missing_ok=True)
          # ---- pusat kendali owner
          def api_owner(self, method, name, q):
              u = self.need_user()
              if not u["is_owner"]:
                  raise ApiError(403, "Hanya owner")
              sub = name.split("/")[1] if "/" in name else ""
              with db() as c:
                  if method == "GET":
                      if sub == "settings":
                          return self.send_json({"announcement": RUNTIME["announcement"], "maintenance": RUNTIME["maintenance"],
                                                 "backups": list_backups(), "backup_hours": BACKUP_HOURS, "backup_keep": BACKUP_KEEP,
                                                 "event": RUNTIME["event"], "event_active": current_event(), "schedule": get_sched(c)})
                      if sub == "shares":
                          rows = c.execute(
                              "SELECT s.token,s.created,s.expires,COALESCE(s.views,0) views,(s.pw_hash IS NOT NULL) has_pw,"
                              "i.name,i.is_folder,i.trashed,u.username FROM shares s JOIN items i ON i.id=s.item_id "
                              "JOIN users u ON u.id=i.user_id ORDER BY s.created DESC LIMIT 200").fetchall()
                          return self.send_json({"shares": [dict(r) for r in rows]})
                      raise ApiError(404, "Endpoint tidak ada")
                  d = self.read_json()
                  if sub == "announce":
                      text = (d.get("text") or "").strip()[:300]
                      set_setting(c, "announcement", text)
                      RUNTIME["announcement"] = text
                      if text and d.get("notify"):
                          for r in c.execute("SELECT id FROM users WHERE id!=?", (u["id"],)).fetchall():
                              notify(c, r["id"], "announce", "Pengumuman dari owner", text)
                      log(c, u["id"], "announce", text[:80] or "pengumuman dihapus")
                      EVENTS.emit("users")
                  elif sub == "maintenance":
                      on = bool(d.get("on"))
                      set_setting(c, "maintenance", "1" if on else "0")
                      RUNTIME["maintenance"] = on
                      log(c, u["id"], "maintenance", "diaktifkan" if on else "dimatikan")
                      EVENTS.emit("users")
                  elif sub == "event":
                      key = str(d.get("key") or "").strip()
                      if key and key not in EVENT_THEME:
                          raise ApiError(400, "Event tidak dikenal")
                      try:
                          st = max(0, min(2, int(d.get("style") or 0)))
                          days = max(0, min(3650, int(float(d.get("days") or 0))))
                      except (TypeError, ValueError):
                          raise ApiError(400, "Pengaturan event tidak valid")
                      set_event(c, key, st, days, bool(d.get("notify")), u["id"], u["id"])
                      EVENTS.emit("users")
                  elif sub == "event-schedule":
                      key = str(d.get("key") or "").strip()
                      if key not in EVENT_THEME:
                          raise ApiError(400, "Pilih event yang valid")
                      try:
                          st = max(0, min(2, int(d.get("style") or 0)))
                          days = max(0, min(3650, int(float(d.get("days") or 0))))
                          at = float(d.get("at"))
                      except (TypeError, ValueError):
                          raise ApiError(400, "Tanggal dan jam tidak valid")
                      if at < time.time() + 30:
                          raise ApiError(400, "Waktu peluncuran harus di masa depan")
                      if at > time.time() + 800 * 86400:
                          raise ApiError(400, "Jadwal maksimal sekitar 2 tahun ke depan")
                      lst = get_sched(c)
                      if len(lst) >= 30:
                          raise ApiError(400, "Maksimal 30 jadwal")
                      lst.append({"id": str(int(time.time() * 1000)), "key": key, "style": st, "days": days, "at": at, "notify": bool(d.get("notify"))})
                      lst.sort(key=lambda x: x["at"])
                      set_setting(c, "event_sched", json.dumps(lst))
                      log(c, u["id"], "event", "jadwal " + EVENT_THEME[key]["name"])
                  elif sub == "event-unschedule":
                      sid = str(d.get("id") or "")
                      set_setting(c, "event_sched", json.dumps([x for x in get_sched(c) if x["id"] != sid]))
                  elif sub == "backup-now":
                      p = make_backup("manual")
                      log(c, u["id"], "backup", f"{p.name} ({fmt_size(p.stat().st_size)})")
                  elif sub == "backup-delete":
                      fn = str(d.get("file") or "")
                      if not re.fullmatch(r"(auto|manual)-\d{8}-\d{6}\.db", fn):
                          raise ApiError(400, "Nama cadangan tidak valid")
                      (BACKUPS / fn).unlink(missing_ok=True)
                  elif sub == "share-revoke":
                      c.execute("DELETE FROM shares WHERE token=?", (str(d.get("token") or ""),))
                      log(c, u["id"], "unshare", "tautan dicabut owner")
                  else:
                      raise ApiError(404, "Endpoint tidak ada")
              self.send_json({"ok": True})

          # ---- panel admin & owner: ringkasan, detail pengguna, aksi massal, kebijakan, sesi
          def user_breakdown(self, c, uid):
              cats = {k: {"size": 0, "count": 0} for k in ("photos", "videos", "audio", "documents", "other")}
              trash = used = folders = 0
              for r in c.execute("SELECT name,mime,size,trashed,is_folder FROM items WHERE user_id=?", (uid,)).fetchall():
                  if r["is_folder"]:
                      if not r["trashed"]:
                          folders += 1
                      continue
                  used += r["size"]
                  if r["trashed"]:
                      trash += r["size"]
                  else:
                      k = cats[classify(r["name"], r["mime"])]
                      k["size"] += r["size"]
                      k["count"] += 1
              return cats, used, trash, folders

          def api_admin(self, method, name, q):
              u = self.need_user()
              if not u["is_admin"]:
                  raise ApiError(403, "Hanya admin")
              parts = name.split("/")
              sub = parts[1] if len(parts) > 1 else ""
              owner = bool(u["is_owner"])
              now = time.time()
              if method == "GET":
                  with db() as c:
                      if sub == "overview":
                          users = c.execute("SELECT u.id,u.username,u.is_admin,u.is_owner,u.quota_gb,COALESCE(u.disabled,0) disabled,"
                                            "(SELECT MAX(last_seen) FROM sessions s WHERE s.user_id=u.id) last_seen FROM users u").fetchall()
                          used = {r["user_id"]: r["s"] for r in c.execute("SELECT user_id, COALESCE(SUM(size),0) s FROM items WHERE is_folder=0 GROUP BY user_id").fetchall()}
                          cats = {k: {"size": 0, "count": 0} for k in ("photos", "videos", "audio", "documents", "other")}
                          trash = nfiles = 0
                          for r in c.execute("SELECT name,mime,size,trashed FROM items WHERE is_folder=0").fetchall():
                              if r["trashed"]:
                                  trash += r["size"]
                              else:
                                  k = cats[classify(r["name"], r["mime"])]
                                  k["size"] += r["size"]
                                  k["count"] += 1
                                  nfiles += 1
                          off = time.localtime().tm_gmtoff or 0
                          today = int((now + off) // 86400)
                          first = today - 13
                          daily = {d: {"ts": d * 86400, "uploads": 0, "logins": 0, "total": 0} for d in range(first, today + 1)}
                          for r in c.execute("SELECT CAST((ts+?)/86400 AS INTEGER) d, SUM(action='upload') up, SUM(action='login') lg, COUNT(*) t "
                                             "FROM activity WHERE ts>=? GROUP BY d", (off, (first * 86400) - off)).fetchall():
                              if r["d"] in daily:
                                  daily[r["d"]].update(uploads=r["up"] or 0, logins=r["lg"] or 0, total=r["t"] or 0)
                          alloc = sum(int(r["quota_gb"] * 1024**3) for r in users if not r["is_owner"] and r["quota_gb"])
                          top = sorted(({"id": r["id"], "username": r["username"], "used": used.get(r["id"], 0), "quota_gb": r["quota_gb"], "is_owner": bool(r["is_owner"])}
                                        for r in users), key=lambda x: x["used"], reverse=True)[:8]
                          recent = c.execute("SELECT a.action,a.detail,a.ts,s.username AS who FROM activity a JOIN users s ON s.id=a.user_id ORDER BY a.id DESC LIMIT 8").fetchall()
                          data = {
                              "users": len(users), "admins": sum(1 for r in users if r["is_admin"] and not r["is_owner"]),
                              "disabled": sum(1 for r in users if r["disabled"]),
                              "active7d": sum(1 for r in users if r["last_seen"] and now - r["last_seen"] < 7 * 86400),
                              "no_quota": sum(1 for r in users if not r["is_owner"] and r["quota_gb"] is None and not RUNTIME["default_quota"] and REQUIRE_QUOTA),
                              "files": nfiles, "folders": c.execute("SELECT COUNT(*) n FROM items WHERE is_folder=1 AND trashed=0").fetchone()["n"],
                              "used": sum(used.values()), "trash": trash, "alloc": alloc, "categories": cats,
                              "shares": c.execute("SELECT COUNT(*) n FROM shares").fetchone()["n"],
                              "sessions": c.execute("SELECT COUNT(*) n FROM sessions WHERE expires>?", (now,)).fetchone()["n"],
                              "pending_users": c.execute("SELECT COUNT(*) n FROM user_requests WHERE status='pending'").fetchone()["n"],
                              "pending_quota": c.execute("SELECT COUNT(*) n FROM quota_requests WHERE status='pending'").fetchone()["n"],
                              "failed_logins": c.execute("SELECT COUNT(*) n FROM activity WHERE action='login_fail' AND ts>?", (now - 86400,)).fetchone()["n"],
                              "daily": [daily[d] for d in sorted(daily)], "top": top, "recent": [dict(r) for r in recent],
                              "maintenance": RUNTIME["maintenance"],
                          }
                          try:
                              du = shutil.disk_usage(DATA)
                              data["disk"] = {"total": du.total, "free": du.free, "used": du.used}
                          except OSError:
                              data["disk"] = {"total": 0, "free": 0, "used": 0}
                          return self.send_json(data)
                      if sub == "user":
                          try:
                              uid = int(q.get("id", [""])[0])
                          except ValueError:
                              raise ApiError(400, "ID tidak valid")
                          t = c.execute("SELECT id,username,is_admin,is_owner,quota_gb,created,COALESCE(disabled,0) disabled, (face IS NOT NULL) face FROM users WHERE id=?", (uid,)).fetchone()
                          if not t:
                              raise ApiError(404, "Pengguna tidak ada")
                          cats, used_b, trash, folders = self.user_breakdown(c, uid)
                          cur = tok_hash(self.cookie("sid") or "")
                          srows = c.execute("SELECT token_hash,ua,ip,created,last_seen FROM sessions WHERE user_id=? AND expires>? "
                                            "ORDER BY COALESCE(last_seen,created,0) DESC", (uid, now)).fetchall()
                          out = {
                              "user": dict(t), "categories": cats, "used": used_b, "trash": trash, "folders": folders,
                              "files": sum(v["count"] for v in cats.values()),
                              "shares": c.execute("SELECT COUNT(*) n FROM shares s JOIN items i ON i.id=s.item_id WHERE i.user_id=?", (uid,)).fetchone()["n"],
                              "last_login": c.execute("SELECT MAX(ts) m FROM activity WHERE user_id=? AND action='login'", (uid,)).fetchone()["m"],
                              "fails7d": c.execute("SELECT COUNT(*) n FROM activity WHERE user_id=? AND action='login_fail' AND ts>?", (uid, now - 7 * 86400)).fetchone()["n"],
                              "session_count": len(srows),
                              "sessions": ([{"id": r["token_hash"][:16], "ua": r["ua"] or "", "ip": r["ip"] or "", "created": r["created"], "last_seen": r["last_seen"],
                                             "current": r["token_hash"] == cur} for r in srows] if owner else []),
                              "pending_gb": (c.execute("SELECT requested_gb FROM quota_requests WHERE user_id=? AND status='pending'", (uid,)).fetchone() or {"requested_gb": None})["requested_gb"],
                              "recent": [dict(r) for r in c.execute("SELECT action,detail,ts FROM activity WHERE user_id=? ORDER BY id DESC LIMIT 12", (uid,)).fetchall()],
                          }
                          return self.send_json(out)
                      if sub == "shares":
                          rows = c.execute(
                              "SELECT s.token,s.created,s.expires,COALESCE(s.views,0) views,(s.pw_hash IS NOT NULL) has_pw,"
                              "i.name,i.is_folder,i.trashed,i.size,u.username FROM shares s JOIN items i ON i.id=s.item_id "
                              "JOIN users u ON u.id=i.user_id ORDER BY s.created DESC LIMIT 300").fetchall()
                          out = []
                          for r in rows:
                              dct = dict(r)
                              dct["token"] = r["token"] if owner else None
                              dct["ref"] = tok_hash(r["token"])[:16]
                              out.append(dct)
                          return self.send_json({"shares": out, "owner": owner})
                      if not owner:
                          raise ApiError(403, "Hanya owner")
                      if sub == "sessions":
                          cur = tok_hash(self.cookie("sid") or "")
                          rows = c.execute("SELECT s.token_hash,s.ua,s.ip,s.created,s.last_seen,u.id uid,u.username FROM sessions s JOIN users u ON u.id=s.user_id "
                                           "WHERE s.expires>? ORDER BY COALESCE(s.last_seen,s.created,0) DESC LIMIT 300", (now,)).fetchall()
                          return self.send_json({"sessions": [{"id": r["token_hash"][:16], "ua": r["ua"] or "", "ip": r["ip"] or "", "created": r["created"],
                                                               "last_seen": r["last_seen"], "uid": r["uid"], "username": r["username"], "current": r["token_hash"] == cur}
                                                              for r in rows]})
                      if sub == "config":
                          return self.send_json({"max_upload_mb": RUNTIME["max_upload_mb"], "default_quota_gb": RUNTIME["default_quota"],
                                                 "trash_days": RUNTIME["trash_days"], "trash_days_env": TRASH_DAYS, "allow_share": RUNTIME["allow_share"],
                                                 "require_quota": REQUIRE_QUOTA})
                  raise ApiError(404, "Endpoint tidak ada")
              # ---- POST: khusus owner
              if not owner:
                  raise ApiError(403, "Hanya owner")
              d = self.read_json()
              with db() as c:
                  def target(allow_self=False):
                      try:
                          tid = int(d.get("id"))
                      except (TypeError, ValueError):
                          raise ApiError(400, "ID tidak valid")
                      t = c.execute("SELECT id,username,is_owner FROM users WHERE id=?", (tid,)).fetchone()
                      if not t:
                          raise ApiError(404, "Pengguna tidak ada")
                      if not allow_self and (tid == u["id"] or t["is_owner"]):
                          raise ApiError(400, "Tidak berlaku untuk akun owner")
                      return t
                  if sub == "rename":
                      t = target(True)
                      un = (d.get("username") or "").strip()
                      if not re.fullmatch(r"[A-Za-z0-9_.-]{3,32}", un):
                          raise ApiError(400, "Username 3-32 karakter (huruf, angka, _ . -)")
                      if c.execute("SELECT 1 FROM users WHERE username=? AND id!=?", (un, t["id"])).fetchone():
                          raise ApiError(409, "Username sudah dipakai")
                      c.execute("UPDATE users SET username=? WHERE id=?", (un, t["id"]))
                      log(c, u["id"], "rename_user", f"{t['username']} → {un}")
                      EVENTS.emit("users")
                  elif sub == "face-reset":
                      t = target(True)
                      c.execute("UPDATE users SET face=NULL, face_codes=NULL, face_at=NULL WHERE id=?", (t["id"],))
                      log(c, u["id"], "face_reset", t["username"])
                      notify(c, t["id"], "security", "Verifikasi wajah direset", "Owner menonaktifkan verifikasi wajah akun Anda. Aktifkan lagi dari menu akun.")
                      EVENTS.emit("users")
                  elif sub == "empty-trash":
                      t = target(True)
                      ids = [r["id"] for r in c.execute("SELECT id FROM items WHERE user_id=? AND trashed=1 AND (parent_id IS NULL OR parent_id NOT IN "
                                                        "(SELECT id FROM items WHERE trashed=1 AND user_id=?))", (t["id"], t["id"])).fetchall()]
                      freed = c.execute("SELECT COALESCE(SUM(size),0) s FROM items WHERE user_id=? AND trashed=1 AND is_folder=0", (t["id"],)).fetchone()["s"]
                      self.purge(c, ids)
                      log(c, u["id"], "cleanup", f"sampah {t['username']} dikosongkan ({fmt_size(freed)})")
                      sync_warn(c, t["id"])
                      EVENTS.emit("files", t["id"])
                      EVENTS.emit("users")
                      return self.send_json({"ok": True, "freed": freed})
                  elif sub == "bulk":
                      ids = []
                      for i in (d.get("ids") or [])[:200]:
                          try:
                              ids.append(int(i))
                          except (TypeError, ValueError):
                              pass
                      act = d.get("action")
                      if act not in ("quota", "disable", "enable", "logout") or not ids:
                          raise ApiError(400, "Aksi tidak valid")
                      val = parse_gb(d.get("quota_gb")) if act == "quota" else None
                      n = 0
                      for uid in ids:
                          t = c.execute("SELECT id,username,is_owner FROM users WHERE id=?", (uid,)).fetchone()
                          if not t or t["is_owner"] or uid == u["id"]:
                              continue
                          n += 1
                          if act == "quota":
                              c.execute("UPDATE users SET quota_gb=? WHERE id=?", (val, uid))
                              if val is None:
                                  notify(c, uid, "quota_set", "Kuota dicabut", "Owner mencabut kuota Anda. Anda tidak bisa mengunggah sampai kuota diatur lagi.")
                              else:
                                  notify(c, uid, "quota_set", "Kuota diatur", f"Kuota Anda sekarang {fmt_gb(val)}. Anda sudah bisa mengunggah file.")
                              sync_warn(c, uid)
                              EVENTS.emit("files", uid)
                          elif act == "disable":
                              c.execute("UPDATE users SET disabled=1 WHERE id=?", (uid,))
                              c.execute("DELETE FROM sessions WHERE user_id=?", (uid,))
                              EVENTS.emit("session", uid)
                          elif act == "enable":
                              c.execute("UPDATE users SET disabled=0 WHERE id=?", (uid,))
                          else:
                              c.execute("DELETE FROM sessions WHERE user_id=?", (uid,))
                              EVENTS.emit("session", uid)
                      label = {"quota": "kuota " + ("dicabut" if val is None else fmt_gb(val)), "disable": "dinonaktifkan", "enable": "diaktifkan", "logout": "dikeluarkan dari semua perangkat"}[act]
                      log(c, u["id"], "bulk", f"{n} pengguna {label}")
                      EVENTS.emit("users")
                      return self.send_json({"ok": True, "count": n})
                  elif sub == "transfer":
                      t = target()
                      key = "xfer%d" % u["id"]
                      if too_many_fails(key):
                          raise ApiError(429, "Terlalu banyak percobaan, coba lagi nanti")
                      if not hmac.compare_digest(hash_pw(d.get("password") or "", u["salt"]), u["pw_hash"]):
                          FAILS.setdefault(key, []).append(now)
                          raise ApiError(403, "Password Anda salah")
                      if c.execute("SELECT COALESCE(disabled,0) d FROM users WHERE id=?", (t["id"],)).fetchone()["d"]:
                          raise ApiError(400, "Akun tujuan sedang dinonaktifkan")
                      c.execute("UPDATE users SET is_owner=1, is_admin=1 WHERE id=?", (t["id"],))
                      c.execute("UPDATE users SET is_owner=0, is_admin=1 WHERE id=?", (u["id"],))
                      notify(c, t["id"], "announce", "Anda sekarang owner", f"{u['username']} menyerahkan kepemilikan HomeDrive kepada Anda.")
                      log(c, u["id"], "transfer", f"owner → {t['username']}")
                      EVENTS.emit("users")
                  elif sub == "message":
                      title = (d.get("title") or "").strip()[:80] or "Pesan dari owner"
                      text = (d.get("text") or "").strip()[:300]
                      if not text:
                          raise ApiError(400, "Isi pesan kosong")
                      if d.get("id") in (None, "", "all"):
                          ids = [r["id"] for r in c.execute("SELECT id FROM users WHERE id!=? AND COALESCE(disabled,0)=0", (u["id"],)).fetchall()]
                      else:
                          ids = [target()["id"]]
                      for i in ids:
                          notify(c, i, "announce", title, text)
                      log(c, u["id"], "message", f"{len(ids)} penerima: {title}")
                      return self.send_json({"ok": True, "count": len(ids)})
                  elif sub == "config":
                      try:
                          if "max_upload_mb" in d:
                              v = d.get("max_upload_mb")
                              mx = int(float(v)) if str(v).strip() != "" else 0
                              if mx < 0 or mx > 10_000_000:
                                  raise ValueError
                              set_setting(c, "max_upload_mb", str(mx))
                              RUNTIME["max_upload_mb"] = mx
                          if "default_quota_gb" in d:
                              g = parse_gb(d.get("default_quota_gb"))
                              set_setting(c, "default_quota_gb", "" if g is None else str(g))
                              RUNTIME["default_quota"] = g
                          if "trash_days" in d:
                              v = d.get("trash_days")
                              td = None if (v is None or str(v).strip() == "") else int(float(v))
                              if td is not None and (td < 0 or td > 3650):
                                  raise ValueError
                              set_setting(c, "trash_days", "" if td is None else str(td))
                              RUNTIME["trash_days"] = td
                          if "allow_share" in d:
                              on = bool(d.get("allow_share"))
                              set_setting(c, "allow_share", "1" if on else "0")
                              RUNTIME["allow_share"] = on
                      except ValueError:
                          raise ApiError(400, "Nilai pengaturan tidak valid")
                      log(c, u["id"], "config", "kebijakan diperbarui")
                      EVENTS.emit("users")
                  elif sub == "session-revoke":
                      sid = str(d.get("id") or "")
                      if not re.fullmatch(r"[0-9a-f]{8,64}", sid):
                          raise ApiError(400, "ID sesi tidak valid")
                      cur = tok_hash(self.cookie("sid") or "")
                      rows = c.execute("SELECT token_hash,user_id FROM sessions WHERE token_hash LIKE ?", (sid + "%",)).fetchall()
                      n = 0
                      for r in rows:
                          if r["token_hash"] == cur:
                              continue
                          c.execute("DELETE FROM sessions WHERE token_hash=?", (r["token_hash"],))
                          EVENTS.emit("session", r["user_id"])
                          n += 1
                      log(c, u["id"], "revoke", f"{n} sesi dicabut owner")
                  elif sub == "shares-revoke-all":
                      n = c.execute("SELECT COUNT(*) n FROM shares").fetchone()["n"]
                      c.execute("DELETE FROM shares")
                      log(c, u["id"], "unshare", f"semua tautan ({n}) dicabut owner")
                      EVENTS.emit("files")
                  elif sub == "share-revoke":
                      ref = str(d.get("ref") or "")
                      for r in c.execute("SELECT token FROM shares").fetchall():
                          if tok_hash(r["token"])[:16] == ref:
                              c.execute("DELETE FROM shares WHERE token=?", (r["token"],))
                              break
                      log(c, u["id"], "unshare", "tautan dicabut owner")
                      EVENTS.emit("files")
                  else:
                      raise ApiError(404, "Endpoint tidak ada")
              self.send_json({"ok": True})

          # ---- download
          def api_download(self, method, name, q):
              u = self.need_user()
              iid = name.split("/", 1)[1] if "/" in name else ""
              with db() as c:
                  r = self.own_item(c, u["id"], iid)
              if r["is_folder"]:
                  raise ApiError(400, "Gunakan /api/zip untuk folder")
              self.send_blob(r, inline=q.get("inline", [""])[0] == "1")

          def send_blob(self, r, inline):
              path = BLOBS / r["id"]
              if not path.exists():
                  raise ApiError(404, "File hilang dari penyimpanan")
              size = path.stat().st_size
              mime = r["mime"] or "application/octet-stream"
              safe = bool(inline and INLINE_OK.match(mime))
              extra = {
                  "Accept-Ranges": "bytes",
                  "Content-Disposition": f"{'inline' if safe else 'attachment'}; filename*=UTF-8''{quote(r['name'])}",
                  "Cache-Control": "private, max-age=0, must-revalidate",
              }
              if not safe:
                  extra["Content-Security-Policy"] = "sandbox"
              start, end, status = 0, size - 1, 200
              rng = self.headers.get("Range")
              if rng:
                  m = re.fullmatch(r"bytes=(\d*)-(\d*)", rng.strip())
                  if m and (m.group(1) or m.group(2)):
                      if m.group(1):
                          start = int(m.group(1))
                          end = int(m.group(2)) if m.group(2) else size - 1
                      else:
                          start = max(0, size - int(m.group(2)))
                      end = min(end, size - 1)
                      if start > end or start >= size:
                          return self._headers(416, "text/plain", 0, {"Content-Range": f"bytes */{size}"})
                      status = 206
                      extra["Content-Range"] = f"bytes {start}-{end}/{size}"
              length = end - start + 1 if size else 0
              self._headers(status, mime if safe else "application/octet-stream", length, extra)
              if self.head_only:
                  return
              with open(path, "rb") as f:
                  f.seek(start)
                  left = length
                  while left > 0:
                      chunk = f.read(min(CHUNK, left))
                      if not chunk:
                          break
                      self.wfile.write(chunk)
                      left -= len(chunk)

          def build_zip(self, c, uid, rows, zname):
              tmp = tempfile.NamedTemporaryFile(dir=TMP, delete=False)
              tmp.close()
              try:
                  with zipfile.ZipFile(tmp.name, "w", zipfile.ZIP_DEFLATED, allowZip64=True) as z:
                      def add(r, prefix):
                          if r["is_folder"]:
                              kids = c.execute("SELECT * FROM items WHERE parent_id=? AND user_id=? AND trashed=0", (r["id"], uid)).fetchall()
                              p = f"{prefix}{r['name']}/"
                              if not kids:
                                  z.writestr(p, "")
                              for k in kids:
                                  add(k, p)
                          elif (BLOBS / r["id"]).exists():
                              z.write(BLOBS / r["id"], f"{prefix}{r['name']}")
                      for r in rows:
                          add(r, "")
                  size = os.path.getsize(tmp.name)
                  self._headers(200, "application/zip", size, {"Content-Disposition": f"attachment; filename*=UTF-8''{quote(zname)}.zip"})
                  if not self.head_only:
                      with open(tmp.name, "rb") as f:
                          shutil.copyfileobj(f, self.wfile, CHUNK)
              finally:
                  os.unlink(tmp.name)

          def api_zip(self, method, name, q):
              """/api/zip/<id> untuk satu item, atau /api/zip?ids=a,b,c untuk banyak item."""
              u = self.need_user()
              ids = [i for i in q.get("ids", [""])[0].split(",") if i]
              if not ids and "/" in name:
                  ids = [name.split("/", 1)[1]]
              if not ids:
                  raise ApiError(400, "Tidak ada item")
              with db() as c:
                  rows = [self.own_item(c, u["id"], i) for i in ids]
                  zname = rows[0]["name"] if len(rows) == 1 else "HomeDrive"
                  self.build_zip(c, u["id"], rows, zname)


      # ===================== CCTV: bicara ke kamera (RTSP backchannel ONVIF, G.711) + hotspot =====================
      import struct

      TALKS = {}
      TALK_CAM = {}
      TALK_LOCK = threading.RLock()
      G711 = {}
      HOTSPOT_NETS = ["192.168.1.0/24", "192.168.0.0/24", "192.168.10.0/24", "192.168.43.0/24", "192.168.100.0/24", "10.0.0.0/24"]


      def _ulaw(s):
          s = max(-32768, min(32767, s))
          sign = 0x80 if s < 0 else 0
          if s < 0:
              s = -s
          s = min(s, 32635) + 0x84
          exp, mask = 7, 0x4000
          while exp > 0 and not (s & mask):
              exp -= 1
              mask >>= 1
          return (~(sign | (exp << 4) | ((s >> (exp + 3)) & 0x0F))) & 0xFF


      def _alaw(s):
          s = max(-32768, min(32767, s))
          v = s >> 3
          if v >= 0:
              mask = 0xD5
          else:
              mask = 0x55
              v = -v - 1
          seg = 8
          for i, end in enumerate((0x1F, 0x3F, 0x7F, 0xFF, 0x1FF, 0x3FF, 0x7FF, 0xFFF)):
              if v <= end:
                  seg = i
                  break
          if seg >= 8:
              return 0x7F ^ mask
          a = seg << 4
          a |= (v >> 1) & 0x0F if seg < 2 else (v >> seg) & 0x0F
          return a ^ mask


      def g711_table(name):
          if name not in G711:
              fn = _ulaw if name == "PCMU" else _alaw
              G711[name] = bytes(fn(u - 65536 if u >= 32768 else u) for u in range(65536))
          return G711[name]


      def g711_encode(pcm, name):
          n = len(pcm) // 2
          tab = g711_table(name)
          return bytes(tab[x & 0xFFFF] for x in struct.unpack("<%dh" % n, pcm[:n * 2]))


      class RtspTalk:
          """Klien RTSP minimal yang membuka jalur backchannel (audio ke kamera) lewat TCP interleaved."""

          def __init__(self, url, timeout=8):
              p = urlparse(url)
              if p.scheme != "rtsp" or not p.hostname:
                  raise ApiError(400, "Bicara ke kamera hanya didukung untuk alamat rtsp://")
              self.host, self.port = p.hostname, p.port or 554
              self.user, self.pw = unquote(p.username or ""), unquote(p.password or "")
              self.url = "rtsp://%s:%d%s" % (self.host, self.port, (p.path or "/") + ("?" + p.query if p.query else ""))
              self.timeout, self.sock, self.cseq, self.session = timeout, None, 0, None
              self.realm = self.nonce = self.basic = None
              self.chan, self.pt, self.codec = 0, 0, "PCMU"
              self.seq, self.ts, self.ssrc = secrets.randbelow(65536), secrets.randbelow(2 ** 32), secrets.randbelow(2 ** 32)
              self.lock = threading.Lock()
              self.alive = False

          def _auth(self, method, uri):
              if self.nonce:
                  md5 = lambda x: hashlib.md5(x.encode()).hexdigest()
                  ha1 = md5("%s:%s:%s" % (self.user, self.realm, self.pw))
                  ha2 = md5("%s:%s" % (method, uri))
                  return ('Digest username="%s", realm="%s", nonce="%s", uri="%s", response="%s"'
                          % (self.user, self.realm, self.nonce, uri, md5("%s:%s:%s" % (ha1, self.nonce, ha2))))
              if self.basic:
                  return "Basic " + base64.b64encode(("%s:%s" % (self.user, self.pw)).encode()).decode()
              return None

          def _read_response(self):
              buf = b""
              while True:
                  while buf[:1] == b"$":  # lewati data interleaved
                      while len(buf) < 4:
                          buf += self._recv()
                      ln = struct.unpack(">H", buf[2:4])[0]
                      while len(buf) < 4 + ln:
                          buf += self._recv()
                      buf = buf[4 + ln:]
                  if b"\r\n\r\n" in buf and buf[:1] != b"$":
                      break
                  buf += self._recv()
              head, _, rest = buf.partition(b"\r\n\r\n")
              lines = head.decode("utf-8", "ignore").split("\r\n")
              try:
                  status = int(lines[0].split()[1])
              except (IndexError, ValueError):
                  raise ApiError(502, "Respons RTSP kamera tidak valid")
              hdr = {}
              for ln in lines[1:]:
                  k, _, v = ln.partition(":")
                  hdr[k.strip().lower()] = v.strip()
              n = int(hdr.get("content-length") or 0)
              while len(rest) < n:
                  rest += self._recv()
              return status, hdr, rest[:n].decode("utf-8", "ignore")

          def _recv(self):
              d = self.sock.recv(65536)
              if not d:
                  raise ApiError(502, "Kamera menutup koneksi")
              return d

          def request(self, method, uri, extra=None, retry=True):
              self.cseq += 1
              lines = ["%s %s RTSP/1.0" % (method, uri), "CSeq: %d" % self.cseq, "User-Agent: HomeDrive"]
              a = self._auth(method, uri)
              if a:
                  lines.append("Authorization: " + a)
              if self.session:
                  lines.append("Session: " + self.session)
              for k, v in (extra or {}).items():
                  lines.append("%s: %s" % (k, v))
              self.sock.sendall(("\r\n".join(lines) + "\r\n\r\n").encode())
              status, hdr, body = self._read_response()
              if status == 401 and retry and self.user:
                  ch = hdr.get("www-authenticate", "")
                  if ch.lower().startswith("digest"):
                      kv = dict(re.findall(r'(\w+)="([^"]*)"', ch))
                      self.realm, self.nonce = kv.get("realm", ""), kv.get("nonce", "")
                  elif ch.lower().startswith("basic"):
                      self.basic = True
                  return self.request(method, uri, extra, False)
              return status, hdr, body

          def connect(self):
              try:
                  self.sock = socket.create_connection((self.host, self.port), self.timeout)
              except OSError:
                  raise ApiError(502, "Tidak bisa terhubung ke kamera (port RTSP %d)." % self.port)
              self.sock.settimeout(self.timeout)
              req = {"Require": "www.onvif.org/ver20/backchannel", "Accept": "application/sdp"}
              st, hdr, sdp = self.request("DESCRIBE", self.url, req)
              if st == 401:
                  raise ApiError(502, "Username atau password kamera salah (401).")
              if st in (551, 405, 501):
                  raise ApiError(502, "Kamera tidak mendukung audio dua arah lewat RTSP (backchannel).")
              if st != 200:
                  raise ApiError(502, "Kamera menolak permintaan suara (kode %d)." % st)
              base = (hdr.get("content-base") or hdr.get("content-location") or self.url).strip()
              media, cur = [], None
              for ln in sdp.replace("\r", "").split("\n"):
                  if ln.startswith("m="):
                      cur = {"kind": ln[2:].split()[0], "fmts": ln.split()[3:], "dir": "", "control": "", "map": {}}
                      media.append(cur)
                  elif cur is not None:
                      if ln.startswith("a=control:"):
                          cur["control"] = ln[10:].strip()
                      elif ln in ("a=sendonly", "a=recvonly", "a=sendrecv"):
                          cur["dir"] = ln[2:]
                      elif ln.startswith("a=rtpmap:"):
                          m = re.match(r"a=rtpmap:(\d+)\s+([\w-]+)/(\d+)", ln)
                          if m:
                              cur["map"][m.group(1)] = m.group(2).upper()
              tr = next((m for m in media if m["kind"] == "audio" and m["dir"] == "sendonly"), None)
              if not tr:
                  raise ApiError(502, "Kamera tidak menyediakan jalur suara masuk (tanpa speaker atau tidak mendukung ONVIF backchannel).")
              pick = None
              for f in tr["fmts"]:
                  name = tr["map"].get(f) or {"0": "PCMU", "8": "PCMA"}.get(f)
                  if name in ("PCMU", "PCMA"):
                      pick = (int(f), name)
                      break
              if not pick:
                  raise ApiError(502, "Kamera meminta codec audio yang belum didukung (%s)." % ",".join(tr["map"].values() or tr["fmts"]))
              self.pt, self.codec = pick
              ctl = tr["control"]
              if ctl.startswith("rtsp://"):
                  setup = ctl
              elif ctl in ("", "*"):
                  setup = base
              else:
                  setup = base.rstrip("/") + "/" + ctl.lstrip("/")
              st, hdr, _ = self.request("SETUP", setup, {"Require": "www.onvif.org/ver20/backchannel",
                                                         "Transport": "RTP/AVP/TCP;unicast;interleaved=0-1"})
              if st != 200:
                  raise ApiError(502, "Kamera menolak membuka jalur suara (SETUP %d)." % st)
              self.session = (hdr.get("session") or "").split(";")[0].strip() or None
              m = re.search(r"interleaved=(\d+)", hdr.get("transport", ""))
              self.chan = int(m.group(1)) if m else 0
              st, hdr, _ = self.request("PLAY", base, {"Require": "www.onvif.org/ver20/backchannel", "Range": "npt=0.000-"})
              if st != 200:
                  raise ApiError(502, "Kamera menolak memulai suara (PLAY %d)." % st)
              self.alive = True
              self.sock.settimeout(None)
              threading.Thread(target=self._drain, daemon=True).start()

          def _drain(self):
              try:
                  while self.alive:
                      if not self.sock.recv(65536):
                          break
              except OSError:
                  pass
              self.alive = False

          def keepalive(self):
              try:
                  self.cseq += 1
                  lines = ["OPTIONS %s RTSP/1.0" % self.url, "CSeq: %d" % self.cseq, "Session: %s" % self.session]
                  a = self._auth("OPTIONS", self.url)
                  if a:
                      lines.append("Authorization: " + a)
                  with self.lock:
                      self.sock.sendall(("\r\n".join(lines) + "\r\n\r\n").encode())
              except OSError:
                  self.alive = False

          def send(self, payload):
              pkt = struct.pack(">BBHII", 0x80, self.pt, self.seq & 0xFFFF, self.ts & 0xFFFFFFFF, self.ssrc) + payload
              self.seq += 1
              self.ts += len(payload)
              try:
                  with self.lock:
                      self.sock.sendall(b"$" + bytes([self.chan]) + struct.pack(">H", len(pkt)) + pkt)
              except OSError:
                  self.alive = False

          def close(self):
              self.alive = False
              try:
                  if self.sock and self.session:
                      self.cseq += 1
                      self.sock.sendall(("TEARDOWN %s RTSP/1.0\r\nCSeq: %d\r\nSession: %s\r\n\r\n" % (self.url, self.cseq, self.session)).encode())
              except OSError:
                  pass
              try:
                  self.sock.close()
              except Exception:
                  pass


      class TalkSession:
          def __init__(self, cid, uid, rt):
              self.sid, self.cid, self.uid, self.rt = secrets.token_urlsafe(12), cid, uid, rt
              self.q = collections.deque(maxlen=120)
              self.fs = 320 if getattr(rt, "codec", "") == "PCM" else 160
              self.buf = b""
              self.cv = threading.Condition()
              self.last, self.t0, self.closed = time.time(), time.time(), False
              threading.Thread(target=self._loop, daemon=True).start()

          def push(self, pcm):
              self.last = time.time()
              self.buf += pcm if self.rt.codec == "PCM" else g711_encode(pcm, self.rt.codec)
              with self.cv:
                  while len(self.buf) >= self.fs:
                      self.q.append(self.buf[:self.fs])
                      self.buf = self.buf[self.fs:]
                  self.cv.notify()

          def _loop(self):
              nxt, ka = time.monotonic(), time.time()
              while not self.closed and self.rt.alive:
                  now = time.time()
                  if now - self.last > 8 or now - self.t0 > 900:
                      break
                  if now - ka > 20:
                      ka = now
                      self.rt.keepalive()
                  with self.cv:
                      if not self.q:
                          self.cv.wait(0.05)
                      fr = self.q.popleft() if self.q else None
                  if fr is None:
                      nxt = time.monotonic()
                      continue
                  self.rt.send(fr)
                  nxt += 0.02
                  d = nxt - time.monotonic()
                  if d > 0:
                      time.sleep(d)
              self.close()

          def close(self):
              if self.closed:
                  return
              self.closed = True
              with TALK_LOCK:
                  TALKS.pop(self.sid, None)
                  if TALK_CAM.get(self.cid) == self.sid:
                      TALK_CAM.pop(self.cid, None)
              self.rt.close()


      def talk_start(cam, uid, uname):
          cid = cam["id"]
          if cam["brand"] in ("device", "local", "server"):
              with TALK_LOCK:
                  cur = TALKS.get(TALK_CAM.get(cid))
                  if cur and not cur.closed:
                      if cur.uid != uid:
                          raise ApiError(409, "Sedang dipakai bicara oleh pengguna lain.", "busy")
                      cur.close()
              if cam["brand"] == "device":
                  if time.time() - PUSH.get(cid, {}).get("poll", 0) > 30:
                      raise ApiError(409, "Perangkat belum menyiarkan (buka Siarkan di HP/laptop itu dulu).")
                  sink = DeviceSink(cid)
              else:
                  sink = SpeakerSink(spk_dev())
              s = TalkSession(cid, uid, sink)
              with TALK_LOCK:
                  TALKS[s.sid] = s
                  TALK_CAM[cid] = s.sid
              return s
          with TALK_LOCK:
              cur = TALKS.get(TALK_CAM.get(cid))
              if cur and not cur.closed:
                  if cur.uid != uid:
                      raise ApiError(409, "Kamera ini sedang dipakai bicara oleh pengguna lain.", "busy")
                  cur.close()
          rt = RtspTalk(cam_url(cam))
          try:
              rt.connect()
          except ApiError:
              rt.close()
              raise
          except (OSError, socket.timeout):
              rt.close()
              raise ApiError(502, "Kamera tidak menjawab saat membuka jalur suara.")
          s = TalkSession(cid, uid, rt)
          with TALK_LOCK:
              TALKS[s.sid] = s
              TALK_CAM[cid] = s.sid
          return s


      def cctv_hotspot_scan():
          pairs = [(str(h), p) for n in HOTSPOT_NETS for h in ipaddress.ip_network(n).hosts() for p in (554, 8554, 8899)]

          def chk(hp):
              try:
                  socket.create_connection(hp, 0.5).close()
                  return hp
              except OSError:
                  return None
          found = {}
          with ThreadPoolExecutor(128) as ex:
              for r in ex.map(chk, pairs):
                  if r:
                      found.setdefault(r[0], []).append(r[1])
          return [{"host": h, "ports": sorted(p)} for h, p in sorted(found.items(), key=lambda x: ipaddress.ip_address(x[0]))]


      # ===================== CCTV: endpoint API =====================
      def perms_public(p):
          return {"owner": bool(p.get("owner")), "live": bool(p.get("live")), "ptz": bool(p.get("ptz")), "rec": bool(p.get("rec")),
                  "snap": bool(p.get("snap")), "talk": bool(p.get("talk")), "manage": bool(p.get("manage")), "cams": p.get("cams", "all")}


      def cam_visible(p, r):
          return p.get("owner") or (r["enabled"] and (p["cams"] == "all" or r["id"] in p["cams"]))


      def cam_public(r, p):
          s = cam_state(r)
          d = {"id": r["id"], "name": r["name"], "brand": r["brand"], "audio": bool(r["audio"]), "rec": bool(r["rec"]),
               "motion": bool(r["motion"]), "enabled": bool(r["enabled"]), "ptz": bool(p.get("ptz") and r["onvif_port"]),
               "online": s["online"], "running": s["running"], "err": s["err"], "ai": bool(r["ai"]), "manual_left": manual_left(r["id"]),
               "device": r["brand"] == "device", "local": r["brand"] == "local", "battery": cam_battery(r), "snap_min": r["snap_min"], "has_zone": bool(r["motion_zone"]), "has_sched": bool(r["motion_sched"])}
          if p.get("owner"):
              d.update(host=r["host"], port=r["port"], username=r["username"], has_pass=bool(r["pass_enc"]), path=r["path_main"],
                       custom=bool(r["url_custom"]), onvif_port=r["onvif_port"], sens=r["sens"], transcode=bool(r["transcode"]),
                       motion_zone=r["motion_zone"], motion_sched=r["motion_sched"], ai_classes=r["ai_classes"], ai_conf=r["ai_conf"], ai_age=bool(r["ai_age"]))
          return d


      def get_cam(c, p, cid, need=None):
          try:
              cid = int(cid)
          except (TypeError, ValueError):
              raise ApiError(404, "Kamera tidak ditemukan")
          r = c.execute("SELECT * FROM cameras WHERE id=?", (cid,)).fetchone()
          if not r or not cam_visible(p, r):
              raise ApiError(404, "Kamera tidak ditemukan")
          if need and not p.get(need):
              raise ApiError(403, "Anda tidak punya izin untuk fitur ini")
          return r


      def serve_bytes_nocache(self, ctype, body, extra=None):
          ex = {"Cache-Control": "no-store"}
          ex.update(extra or {})
          self._headers(200, ctype, len(body), ex)
          if not self.head_only:
              self.wfile.write(body)


      def serve_file_range(self, path, ctype, extra=None):
          try:
              size = path.stat().st_size
          except OSError:
              raise ApiError(404, "File tidak ditemukan")
          ex = {"Accept-Ranges": "bytes", "Cache-Control": "private, max-age=0, must-revalidate"}
          ex.update(extra or {})
          start, end, status = 0, max(0, size - 1), 200
          rng = self.headers.get("Range")
          if rng:
              m = re.fullmatch(r"bytes=(\d*)-(\d*)", rng.strip())
              if m and (m.group(1) or m.group(2)):
                  if m.group(1):
                      start = int(m.group(1))
                      end = int(m.group(2)) if m.group(2) else size - 1
                  else:
                      start = max(0, size - int(m.group(2)))
                  end = min(end, size - 1)
                  if start > end or start >= size:
                      return self._headers(416, "text/plain", 0, {"Content-Range": "bytes */%d" % size})
                  status = 206
                  ex["Content-Range"] = "bytes %d-%d/%d" % (start, end, size)
          length = end - start + 1 if size else 0
          self._headers(status, ctype, length, ex)
          if self.head_only:
              return
          try:
              with open(path, "rb") as f:
                  f.seek(start)
                  left = length
                  while left > 0:
                      chunk = f.read(min(CHUNK, left))
                      if not chunk:
                          break
                      self.wfile.write(chunk)
                      left -= len(chunk)
          except OSError:
              pass


      def _cam_from_body(c, d, old=None):
          pl = cam_payload(d, dict(old) if old else None)
          return pl


      def cctv_dispatch(self, c, u, p, method, sub, parts, q):
          owner = bool(p.get("owner"))
          if method == "GET":
              _x = cctv_extra_get(self, c, u, p, sub, parts, q)
              if _x is None:
                  _x = cctv_hw_get(self, c, u, p, sub, parts, q)
              if _x is not None:
                  return _x
              if sub == "cams":
                  rows = c.execute("SELECT * FROM cameras ORDER BY sort,id").fetchall()
                  return self.send_json({"cams": [cam_public(r, p) for r in rows if cam_visible(p, r)], "perms": perms_public(p),
                                         "ffmpeg": bool(FFMPEG), "ffver": ffmpeg_version(), "ai_service": bool(AI_URL)})
              if sub == "hls" and len(parts) == 4:
                  if not p.get("live"):
                      raise ApiError(403, "Anda tidak punya izin melihat siaran langsung")
                  r = get_cam(c, p, parts[2])
                  fn = parts[3]
                  if not (fn == "live.m3u8" or re.fullmatch(r"seg_\d{5}\.ts", fn)):
                      raise ApiError(404, "Tidak ditemukan")
                  if not r["enabled"]:
                      raise ApiError(409, "Kamera dinonaktifkan", "disabled")
                  if fn == "live.m3u8":
                      cctv_wake(r["id"])
                  path = CCTV_LIVE / str(r["id"]) / fn
                  body = None
                  deadline = time.time() + (8 if (fn == "live.m3u8" and FFMPEG) else 0)
                  while True:  # tahan sampai playlist punya segmen pertama (maks. 8 dtk) agar pemutar tidak perlu mencoba ulang berkali-kali
                      try:
                          body = path.read_bytes()
                          if fn != "live.m3u8" or b"#EXTINF" in body:
                              break
                      except OSError:
                          body = None
