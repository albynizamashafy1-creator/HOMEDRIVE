      async function smTop(quiet) {
        let j; try { j = await api('ai/status'); } catch(e) { if (!quiet) $$('#smTop').innerHTML = emptyBox('alert', 'Gagal memuat', esc(e.message)); return; }
        const box = $$('#smTop'); if (!box) return;
        const pct = j.images ? Math.round((j.done + j.failed) / j.images * 100) : 100, ok = j.ai && j.ai.ok;
        const mode = !ok ? 'Tidak aktif' : j.ai.mode === 'hog' ? 'Aktif (dasar: label warna, kualitas, kembar; objek hanya orang)' : 'Aktif (model AI penuh)';
        const tags = j.tags.length ? j.tags.map(t => `<button class="chip" data-tg="$${esc(t[0])}">$${esc(t[0])} <small style="opacity:.6">$${t[1]}</small></button>`).join('') : '<span class="hint">Belum ada label. Unggah foto dan tunggu analisis selesai.</span>';
        box.innerHTML = `<div class="pgrid"><div class="c6">$${panel('Asisten AI', `<div class="setrow" style="padding-top:0"><div class="st"><b>$${mode}</b><small>$${ok ? '' : esc((j.ai && j.ai.error) || 'Layanan AI belum berjalan')}$${ok ? j.done + ' dari ' + j.images + ' foto sudah dianalisis' + (j.failed ? ' · ' + j.failed + ' gagal' : '') + (j.busy ? ' · sedang bekerja…' : '') : ''}</small><div class="cbar" style="margin-top:8px"><b style="width:$${pct}%"></b></div></div><span class="cdot $${ok?'on':'bad'}"></span></div>`
          + `<p class="hint">Foto Anda dianalisis otomatis di server sendiri (tidak dikirim ke internet): objek (orang, kucing, mobil…), warna, orientasi, buram/gelap, dan sidik visual untuk mencari foto kembar. Hasilnya bisa dicari lewat kotak pencarian, misalnya <b>kucing</b>, <b>gelap</b>, <b>biru</b>.</p>`
          + `<div class="cct-bar" style="margin:10px 0 0"><button class="btn sm" id="smGo">Analisis sekarang</button>$${j.failed ? '<button class="btn sm" id="smRetry">Ulangi yang gagal</button>' : ''}$${j.owner ? `<label class="chkline" style="margin:0 0 0 auto"><input type="checkbox" id="smOn" $${j.index_on ? 'checked' : ''}> Analisis otomatis</label>` : ''}</div>`)}</div>`
          + `<div class="c6">$${panel('Cari lewat label', `<div class="fchips" style="gap:8px">$${tags}</div>`)}</div></div>`;
        box.querySelectorAll('[data-tg]').forEach(b => b.onclick = () => go('#/search/' + encodeURIComponent(b.dataset.tg)));
        const go1 = box.querySelector('#smGo'); if (go1) go1.onclick = async () => { await api('ai/poke', {}); toast('Analisis dimulai'); setTimeout(() => smTop(true), 1500); };
        const rt = box.querySelector('#smRetry'); if (rt) rt.onclick = async () => { await api('ai/retry', {}); toast('Mencoba ulang'); smTop(true); };
        const on = box.querySelector('#smOn'); if (on) on.onchange = async () => { try { await api('ai/index', {on:on.checked}); toast(on.checked ? 'Analisis otomatis nyala' : 'Analisis otomatis mati'); } catch(er) { toast(er.message); } };
      }
      async function smTab(t) {
