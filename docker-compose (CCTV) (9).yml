      def as_basic_math(ctx, t, has):
          """Pemecah soal mapel tanpa model bahasa: persamaan, KPK/FPB, persen, konversi satuan, bangun datar/ruang."""
          t = t.replace("²", "^2").replace("³", "^3")
          nums = [float(x) for x in re.findall(r"\d+(?:\.\d+)?", t.replace(",", "."))]
          try:
              if "=" in t and "x" in t and re.search(r"\d", t):
                  m = re.search(r"([0-9x+\-*/^().,\s]+=[0-9x+\-*/^().,\s]+)", t)
                  if m:
                      r = tool_math_solve(ctx, {"equation": m.group(1)})
                      ctx["used"].append("math_solve")
                      return "**Langkah:**\n" + "\n".join("- " + x for x in r["langkah"]) + "\n\n**Jawaban:** " + r["jawaban"]
              if has("kpk", "fpb", "faktor prima") and nums:
                  op = "faktor_prima" if has("faktor prima") else "fpb_kpk"
                  r = tool_number_theory(ctx, {"numbers": nums, "op": op})
                  ctx["used"].append("number_theory")
                  fz = "\n".join("- %s = %s" % (k, v) for k, v in r["faktorisasi"].items())
                  return ("Faktorisasi prima:\n" + fz) if op == "faktor_prima" else "**FPB = %s**, **KPK = %s**\n" % (r["FPB"], r["KPK"]) + fz
              m = re.search(r"(\d+(?:\.\d+)?)\s*%\s*(?:dari|of)\s*(\d+(?:\.\d+)?)", t.replace(",", "."))
              if m:
                  ctx["used"].append("calculator")
                  return "%s%% dari %s = **%s**" % (m.group(1), m.group(2), _fs(_Fr(m.group(1)) * _Fr(m.group(2)) / 100))
              m = re.search(r"(\d+(?:\.\d+)?)\s*([a-z]+)\s*(?:ke|menjadi|jadi|to)\s*([a-z]+)\b", t.replace(",", "."))
              if m and (m.group(2) in sum((list(x) for x in _UNITS.values()), []) + ["c", "f", "k", "celsius", "fahrenheit", "kelvin"]):
                  r = tool_convert(ctx, {"value": m.group(1), "from": m.group(2), "to": m.group(3)})
                  ctx["used"].append("convert_units")
                  return "%s %s = **%s %s**" % (m.group(1), m.group(2), r["hasil"], r["satuan"])
              shp = next((k for k in ("lingkaran", "persegi panjang", "persegi", "segitiga", "kubus", "balok", "tabung") if k in t), None)
              if shp and has("luas", "keliling", "volume") and nums:
                  key = shp.replace(" ", "_")
                  order = {"lingkaran": ["d" if has("diameter") else "r"], "persegi": ["sisi"], "persegi_panjang": ["p", "l"], "segitiga": ["alas", "tinggi"], "kubus": ["sisi"],
                           "balok": ["p", "l", "t"], "tabung": ["r", "t"]}[key]
                  r = tool_geometry(ctx, {"shape": key, "values": dict(zip(order, nums))})
                  ctx["used"].append("geometry")
                  want = [k for k in ("volume", "luas_permukaan", "keliling", "luas") if k in r and has(k.replace("_", " "))]
                  if "luas" in r and has("luas") and "luas" not in want and not has("permukaan"):
                      want.append("luas")
                  want = want or [k for k in r if k != "rumus"]
                  return "\n".join("**%s** = %s" % (k.replace("_", " "), r[k]) for k in want) + "\nRumus: " + r["rumus"]
          except (ValueError, TypeError) as e:
              return "Maaf, " + str(e)
          return None


