        };
        const AC = window.AudioContext || window.webkitAudioContext;
        const audioOn = () => { if (!ac && AC) ac = new AC(); if (ac && ac.state === 'suspended') ac.resume().catch(() => {}); };
        const playPcm = b64 => {
          if (!ac || !g('bcSp').checked) return;
          const bin = atob(b64), len = bin.length >> 1, buf = ac.createBuffer(1, len, 8000), ch = buf.getChannelData(0);
          for (let i = 0; i < len; i++) { let v = bin.charCodeAt(2 * i) | (bin.charCodeAt(2 * i + 1) << 8); if (v > 32767) v -= 65536; ch[i] = v / 32768; }
          const src = ac.createBufferSource(); src.buffer = buf; src.connect(ac.destination);
          const now = ac.currentTime; if (nextT < now + 0.05 || nextT > now + 1.5) nextT = now + 0.12;
          src.start(nextT); nextT += buf.duration;
        };
        const siren = secs => {
          if (!ac || !g('bcSp').checked) return;
          try { if (osc) osc.stop(); } catch(e) {}
          const o = ac.createOscillator(), gn = ac.createGain(); o.type = 'square'; gn.gain.value = 0.35; o.connect(gn); gn.connect(ac.destination);
          const t0 = ac.currentTime; for (let i = 0; i < secs * 2; i++) o.frequency.setValueAtTime(i % 2 ? 1250 : 780, t0 + i * 0.5);
          o.start(t0); o.stop(t0 + secs); osc = o;
        };
        const say = text => { if (!g('bcSp').checked || !window.speechSynthesis) return; try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = 'id-ID'; u.volume = 1; speechSynthesis.speak(u); } catch(e) {} };
        const batTxt = () => !bat ? 'Baterai: tidak dapat dibaca di browser ini (Safari/Firefox tidak mendukung).' : 'Baterai perangkat: ' + Math.round(bat.level * 100) + '%' + (bat.charging ? ' · sedang mengisi daya ⚡' : '');
        (async () => { try { if (navigator.getBattery) { bat = await navigator.getBattery(); const u = () => { g('bcB').textContent = batTxt(); g('bcB').className = 'cres' + (bat.level <= .15 && !bat.charging ? ' bad' : ''); }; bat.onlevelchange = bat.onchargingchange = u; u(); } else g('bcB').textContent = batTxt(); } catch(e) { g('bcB').textContent = batTxt(); } })();
        const pollLoop = async my => {
          while (on && my === poll) {
            try {
              const qs = bat ? `?bat=$${bat.level.toFixed(2)}&chg=$${bat.charging ? 1 : 0}` : '';
              const r = await fetch(`/api/cctv/devpoll/$${c.id}$${qs}`, {credentials:'same-origin', headers:{'X-Requested-With':'drive'}});
              if (!r.ok) throw new Error(r.status);
              const j = await r.json();
              for (const it of j.items || []) { if (it.t === 'pcm') playPcm(it.d); else if (it.t === 'siren') siren(it.s || 6); else if (it.t === 'tts') say(it.text); else if (it.t === 'stop') { try { if (osc) osc.stop(); speechSynthesis.cancel(); } catch(e) {} } }
            } catch(e) { await new Promise(r => setTimeout(r, 2500)); }
