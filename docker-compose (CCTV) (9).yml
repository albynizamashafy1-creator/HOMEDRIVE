      def parse_gb(v):
          """Kosong/None = belum diatur, 0 = tanpa batas, angka lain = batas dalam GB."""
          if v is None or (isinstance(v, str) and not v.strip()):
              return None
          try:
              g = float(str(v).strip().replace(",", "."))
          except ValueError:
              raise ApiError(400, "Kuota tidak valid")
          if g != g or g < 0 or g > 1_000_000:
              raise ApiError(400, "Kuota tidak valid")
          return g


      def fmt_gb(g):
          return "tanpa batas" if not g else f"{g:g} GB"


      def notify(c, uid, kind, title, body="", ref=None):
          c.execute("INSERT INTO notifications(user_id,kind,title,body,ref,created) VALUES(?,?,?,?,?,?)",
                    (uid, kind, title[:120], (body or "")[:300], ref, time.time()))
          c.execute("DELETE FROM notifications WHERE user_id=? AND id NOT IN "
                    "(SELECT id FROM notifications WHERE user_id=? ORDER BY id DESC LIMIT 200)", (uid, uid))
          EVENTS.emit("notify", uid)


      def notify_owners(c, kind, title, body="", ref=None):
