      <body>

      <div id="auth" class="hidden">
        <div class="aw">
          <div class="abrand">
            <div class="logo"><i id="authLogo2"></i><span class="bn">HomeDrive</span></div>
            <div class="abody">
              <h2>Semua file Anda, aman di server sendiri.</h2>
              <p>Simpan, kelola, dan bagikan foto, video, dan dokumen tanpa bergantung pada layanan pihak ketiga.</p>
              <div class="afeat">
                <div><i id="af1"></i>Unggah dari HP atau laptop, tersinkron seketika</div>
                <div><i id="af2"></i>Kuota, peran, dan kontrol penuh di tangan owner</div>
                <div><i id="af3"></i>Bagikan lewat tautan dengan password dan masa berlaku</div>
              </div>
            </div>
            <small>Privat · Cepat · Sepenuhnya milik Anda</small>
          </div>
          <div class="aform">
            <form class="acard" id="authForm">
              <div class="logo"><i id="authLogo"></i><span class="bn">HomeDrive</span></div>
              <h1 id="authTitle">Masuk</h1>
              <p id="authSub" style="color:var(--muted);margin:0 0 22px">Penyimpanan file pribadi di server rumah Anda.</p>
              <label class="lbl" for="au">Username</label><input type="text" id="au" autocomplete="username" required>
              <label class="lbl" for="ap">Password</label>
              <div class="pwrap"><input type="password" id="ap" autocomplete="current-password" required><button type="button" class="ibtn" id="pwEye" aria-label="Tampilkan password"></button></div>
              <div class="err" id="authErr"></div>
              <button class="btn pri" id="authBtn" style="width:100%">Masuk</button>
            </form>
          </div>
        </div>
      </div>

      <div id="app" class="hidden">
        <aside id="side">
          <div class="logo" style="padding:2px 6px 4px"><i id="sideLogo"></i><span class="bn">HomeDrive</span></div>
          <button id="newBtn"></button>
          <nav id="nav"></nav>
          <div class="sidefoot">
            <div class="storage" id="storage"></div>
            <div class="uchip" id="uchip"><span class="uav" id="uav"></span><div class="uinfo"><b id="uname"></b><small id="urole"></small></div><button class="ibtn" id="logoutBtn" title="Keluar" aria-label="Keluar"></button></div>
          </div>
        </aside>
        <div class="mainc" id="main">
          <header>
            <button class="ibtn" id="menuBtn" aria-label="Menu"></button>
            <div class="search"><span id="searchIc"></span><input type="text" id="q" placeholder="Cari file dan folder" autocomplete="off"><kbd>/</kbd></div>
            <div class="hsp"></div>
            <button class="ibtn" id="bellBtn" title="Notifikasi"></button>
            <button class="ibtn" id="themeBtn" title="Ganti tema"></button>
            <button class="avatar" id="userBtn" title="Akun"></button>
          </header>
          <div class="pagehead"><div class="crumbs" id="crumbs"></div><button class="btn sm dng hidden" id="emptyTrash"></button><button class="ibtn" id="sortBtn" title="Urutkan"></button><div class="seg" id="seg"></div></div>
          <div id="chips" class="hidden"></div>
          <div id="notice" class="hidden" style="flex:none"></div>
          <div id="banner" class="hidden"></div>
          <div id="content"></div>
          <div id="drop" class="hidden">Lepaskan di sini untuk mengunggah</div>
        </div>
      </div>
      <div id="scrim"></div>
      <div id="tabbar"></div>
      <button id="fab" aria-label="Baru"></button>
      <div id="selbar" class="hidden"></div>
      <div id="uploads" class="hidden"></div>
      <div id="toasts"></div>
      <input type="file" id="fileIn" multiple class="hidden">
      <input type="file" id="dirIn" webkitdirectory class="hidden">
      <input type="file" id="photoIn" multiple accept="image/*,.heic,.heif" class="hidden">
      <input type="file" id="videoIn" multiple accept="video/*,.mkv,.mov" class="hidden">
      <input type="file" id="docIn" multiple accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.odt,.ods,.odp,.txt,.md,.rtf,.csv,.epub,text/*" class="hidden">
      <input type="file" id="camIn" accept="image/*,video/*" capture="environment" class="hidden">

      <script>
