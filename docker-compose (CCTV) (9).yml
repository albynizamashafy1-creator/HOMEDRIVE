      # ---------------------------------------------------------------- rahasia kamera
      def _ks(nonce, n):
          out, i = b"", 0
          while len(out) < n:
              out += hmac.new(SECRET, nonce + i.to_bytes(4, "big"), "sha256").digest()
              i += 1
          return out[:n]


      def enc_secret(s):
          if not s:
              return ""
          raw, nonce = s.encode(), secrets.token_bytes(12)
          return base64.urlsafe_b64encode(nonce + bytes(a ^ b for a, b in zip(raw, _ks(nonce, len(raw))))).decode()


      def dec_secret(t):
          if not t:
              return ""
          try:
              raw = base64.urlsafe_b64decode(t.encode())
              nonce, body = raw[:12], raw[12:]
              return bytes(a ^ b for a, b in zip(body, _ks(nonce, len(body)))).decode("utf-8")
          except Exception:
              return ""


      def scrub(text, cam=None):
          t = re.sub(r"(rtsps?|rtmps?|https?)://[^\s'\"]+", "[url]", str(text or ""))
          try:
              if cam:
                  pw = dec_secret(dict(cam).get("pass_enc") or "")
                  if len(pw) >= 3:
                      t = t.replace(pw, "***").replace(quote(pw, safe=""), "***")
          except Exception:
              pass
          return t[:300]


      def friendly(lines):
          t = " ".join(lines).lower() if not isinstance(lines, str) else lines.lower()
          if not t.strip():
              return ""
          if "401" in t or "unauthorized" in t:
              return "Username atau password kamera salah (401)."
          if "404" in t or "not found" in t:
              return "Path stream salah (404). Untuk V380 coba /live/ch00_0 atau /live/ch00_1."
          if "refused" in t:
              return "Kamera menolak koneksi. Pastikan RTSP aktif di kamera dan port benar."
          if "timed out" in t or "timeout" in t or "no route" in t or "unreachable" in t:
              return "Tidak bisa terhubung ke kamera (timeout). Periksa IP dan jaringan."
          if "no such file or directory" in t and "/dev/" in t:
              return "Perangkat tidak ditemukan di server. Teruskan /dev/video0 dan /dev/snd ke kontainer (lihat komentar di compose)."
          if "permission denied" in t:
              return "Akses ke perangkat ditolak. Pastikan perangkat diteruskan ke kontainer."
          if "resource busy" in t:
              return "Kamera sedang dipakai aplikasi lain di laptop server."
          if "cannot open audio device" in t or "alsa" in t and "error" in t:
              return "Mikrofon server tidak bisa dibuka (periksa /dev/snd dan nama perangkat audio)."
          if "error opening output" in t or "failed to open segment" in t or "could not write header" in t:
              ls = [x for x in (lines.split("\n") if isinstance(lines, str) else list(lines)) if "error opening output" not in x.lower()]
              return ("Gagal menulis berkas keluaran: " + (ls[-1] if ls else "Invalid argument"))[:200]
          if "invalid data" in t or "could not find codec" in t:
              return "Format stream tidak dikenali."
          last = (lines if isinstance(lines, str) else (list(lines)[-1] if lines else ""))
          return str(last)[:160]


      def cam_url(cam):
          cam = dict(cam)
          if cam.get("brand") == "device":
              return "pipe:0"
          if cam.get("brand") == "local":
              return cam.get("host") or "/dev/video0"
          if cam.get("url_custom"):
              return dec_secret(cam["url_custom"])
          user, pw = cam.get("username") or "", dec_secret(cam.get("pass_enc") or "")
          auth = ""
          if user:
              auth = quote(user, safe="") + (":" + quote(pw, safe="") if pw else "") + "@"
          path = cam.get("path_main") or "/"
          if not path.startswith("/"):
              path = "/" + path
          return "rtsp://%s%s:%d%s" % (auth, cam["host"], int(cam.get("port") or 554), path)


      def cam_sig(cam):
          cam = dict(cam)
          return json.dumps([cam_url(cam), cam.get("audio"), cam.get("rec_eff", cam.get("rec")), cam.get("motion"), cam.get("sens"),
                             cam.get("transcode"), cam.get("motion_zone")])


      # ---------------------------------------------------------------- hak akses
      def cctv_perms(c, u):
          if u["is_owner"]:
              return {"any": True, "owner": True, "live": True, "ptz": True, "rec": True, "snap": True, "talk": True, "manage": True, "cams": "all"}
          if not u["is_admin"]:
              return {"any": False}
          r = c.execute("SELECT perms FROM cctv_access WHERE user_id=?", (u["id"],)).fetchone()
          if not r:
              return {"any": False}
          try:
              p = json.loads(r["perms"])
          except ValueError:
              return {"any": False}
          cams = p.get("cams", "all")
          cams = "all" if cams == "all" else [int(x) for x in cams if str(x).isdigit()]
          out = {"any": False, "owner": False, "live": bool(p.get("live", 1)), "ptz": bool(p.get("ptz")), "rec": bool(p.get("rec")),
                 "snap": bool(p.get("snap", 1)), "talk": bool(p.get("talk")), "manage": False, "cams": cams}
          out["any"] = out["live"] or out["rec"]
          return out


      def cctv_me(u):
          with db() as c:
              p = cctv_perms(c, u)
          return {k: v for k, v in p.items()}


      def cctv_notify_targets(c, cid):
          out = [r["id"] for r in c.execute("SELECT id FROM users WHERE is_owner=1 AND COALESCE(disabled,0)=0").fetchall()]
          for r in c.execute("SELECT a.user_id, a.perms FROM cctv_access a JOIN users u ON u.id=a.user_id "
                             "WHERE u.is_admin=1 AND u.is_owner=0 AND COALESCE(u.disabled,0)=0").fetchall():
              try:
                  p = json.loads(r["perms"])
              except ValueError:
                  continue
              cams = p.get("cams", "all")
              if p.get("live", 1) and (cams == "all" or cid in cams):
                  out.append(r["user_id"])
          return out


      # ---------------------------------------------------------------- pengelola proses ffmpeg
      class CamProc:
          def __init__(self, cid):
              self.cid, self.p, self.sig = cid, None, None
              self.started, self.fails, self.next_try, self.last_event = 0.0, 0, 0.0, 0.0
              self.tail = collections.deque(maxlen=10)
              self.norec_until, self.rec_err = 0.0, ""


      def live_fresh(cid, age=10):
          try:
              return time.time() - (CCTV_LIVE / str(cid) / "live.m3u8").stat().st_mtime < age
          except OSError:
              return False


      def latest_seg(cid):
          segs = sorted((CCTV_LIVE / str(cid)).glob("seg_*.ts"))
          return segs[-2] if len(segs) >= 2 else (segs[-1] if segs else None)


      def cam_state(cam):
          st = CAMS.get(cam["id"])
          running = bool(st and st.p is not None and st.p.poll() is None)
          online = running and live_fresh(cam["id"], 12)
          err = ""
          if not FFMPEG:
              err = "ffmpeg belum terpasang di server."
          elif cam["brand"] == "device" and not running:
              err = "Menunggu perangkat menyiarkan (buka CCTV > Kamera > Siarkan di HP/laptop)."
          elif st and not online and st.tail and (not running or time.time() - st.started > 20):
              err = friendly(list(st.tail))
          elif st and st.norec_until > time.time() and st.rec_err:
              err = "Siaran jalan, tetapi REKAMAN gagal: " + st.rec_err
          return {"running": running, "online": online, "err": err, "fails": st.fails if st else 0}


      def cam_cmd(cam):
          cam = dict(cam)
          cid, url = cam["id"], cam_url(cam)
          live = CCTV_LIVE / str(cid)
          loc = cam.get("brand") == "local"
          dev = cam.get("brand") == "device"
          cmd = [FFMPEG, "-hide_banner", "-loglevel", "warning", "-nostdin" if not dev else "-hide_banner", "-protocol_whitelist", CCTV_WL + ",pipe"]
          audio = bool(cam.get("audio"))
          if url.startswith("rtsp"):
              cmd += ["-rtsp_transport", "tcp", "-timeout", "10000000"]
          if loc:
              # webcam + mikrofon laptop server (V4L2 + ALSA)
              cmd += ["-fflags", "+nobuffer", "-thread_queue_size", "512", "-f", "v4l2", "-framerate", "15", "-video_size", cam.get("username") or "1280x720",
                      "-use_wallclock_as_timestamps", "1", "-i", url]
              if audio:
                  cmd += ["-thread_queue_size", "512", "-f", "alsa", "-ac", "1", "-use_wallclock_as_timestamps", "1", "-i", cam.get("path_main") or "default"]
          else:
              # LATENSI RENDAH: jangan menimbun data saat membaca stream dan jangan menganalisis stream terlalu lama (bawaan ffmpeg: 5 detik)
              cmd += ["-fflags", "+nobuffer+genpts+discardcorrupt", "-flags", "low_delay",
                      "-probesize", "300000" if dev else "1000000", "-analyzeduration", "600000" if dev else "1000000",
                      ] + ([] if dev else ["-use_wallclock_as_timestamps", "1"]) + ["-i", url]
          maps = ["-map", "0:v:0"] + ((["-map", "1:a:0"] if loc else ["-map", "0:a:0?"]) if audio else [])
          aenc = ["-c:a", "aac", "-b:a", "48k", "-ac", "1"] if audio else ["-an"]
          if audio and dev:
              # audio dari browser (opus) punya cap waktu tidak rata: ratakan agar encoder AAC tidak "backward in time"
              aenc = ["-af", "aresample=async=1:min_hard_comp=0.100:first_pts=0"] + aenc
          if cam.get("transcode") or dev or loc or CCTV_LIVE_REENCODE:
              vh = ["-c:v", "libx264", "-preset", "veryfast", "-tune", "zerolatency", "-pix_fmt", "yuv420p",
                    "-vf", "scale='min(1280,iw)':-2", "-force_key_frames", "expr:gte(t,n_forced*1)", "-sc_threshold", "0", "-crf", "27", "-maxrate", "2500k", "-bufsize", "2500k"]
          else:
              vh = ["-c:v", "copy"]
          cmd += maps + vh + aenc + ["-muxdelay", "0", "-muxpreload", "0", "-f", "hls", "-hls_time", "1", "-hls_list_size", "4",
                                     "-hls_flags", "delete_segments+omit_endlist+independent_segments",
                                     "-hls_segment_filename", str(live / "seg_%05d.ts"), str(live / "live.m3u8")]
          if cam.get("rec_eff", cam.get("rec")):
              rd = CCTV_REC / str(cid)
              rd.mkdir(parents=True, exist_ok=True)
              rv = ["-c:v", "libx264", "-preset", "ultrafast", "-crf", "28", "-pix_fmt", "yuv420p", "-g", "30"] if (dev or loc) else ["-c:v", "copy"]
              cmd += maps + rv + aenc + ["-f", "segment", "-segment_time", "600", "-segment_atclocktime", "1",
                                                       "-reset_timestamps", "1", "-strftime", "1", "-segment_format", "mp4",
                                                       "-segment_format_options", "movflags=+frag_keyframe+empty_moov+default_base_moof",
                                                       str(rd / "%Y%m%d-%H%M%S.mp4")]
          if cam.get("motion"):
              cmd += ["-map", "0:v:0", "-an", "-vf", "fps=3,scale=64:36,format=gray", "-f", "rawvideo", "pipe:1"]
          return cmd


      def _pump_err(p, st, cam):
          try:
              for raw in iter(p.stderr.readline, b""):
                  line = raw.decode("utf-8", "ignore").strip()
                  if line:
                      st.tail.append(scrub(line, cam))
          except Exception:
              pass


      def cam_snapshot(cam, late=False):
          cam = dict(cam)
          if not FFMPEG:
              return None
          seg = latest_seg(cam["id"]) if live_fresh(cam["id"]) else None

          def run(cmd):
              cmd += ["-frames:v", "1", "-q:v", "3", "-f", "image2pipe", "-vcodec", "mjpeg", "-"]
              try:
                  r = subprocess.run(cmd, stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, timeout=25)
              except (subprocess.TimeoutExpired, OSError):
                  return None
              return r.stdout if r.stdout[:2] == b"\xff\xd8" else None
          if seg:
              base = [FFMPEG, "-loglevel", "error", "-nostdin"]
              if late:
                  out = run(base + ["-sseof", "-1.5", "-i", str(seg)])
                  if out:
                      return out
              return run(base + ["-i", str(seg)])
          if cam.get("brand") == "device":
              return None
          if cam.get("brand") == "local":
              return run([FFMPEG, "-loglevel", "error", "-nostdin", "-f", "v4l2", "-video_size", cam.get("username") or "1280x720", "-i", cam_url(cam)])
          url = cam_url(cam)
          cmd = [FFMPEG, "-loglevel", "error", "-nostdin", "-protocol_whitelist", CCTV_WL]
          if url.startswith("rtsp"):
              cmd += ["-rtsp_transport", "tcp", "-timeout", "8000000"]
          return run(cmd + ["-i", url])


      def cam_stop(st):
          p = st.p
          if p is not None and p.poll() is None:
              try:
                  p.terminate()
                  p.wait(timeout=4)
              except Exception:
                  try:
                      p.kill()
                  except Exception:
                      pass
          st.p = None


      def cam_start(cam, st):
          cam = dict(cam)
          d = CCTV_LIVE / str(cam["id"])
          shutil.rmtree(d, ignore_errors=True)
          d.mkdir(parents=True, exist_ok=True)
          st.tail.clear()
          try:
              p = subprocess.Popen(cam_cmd(cam), stdin=subprocess.PIPE if cam.get("brand") == "device" else subprocess.DEVNULL,
                                   stdout=subprocess.PIPE if cam.get("motion") else subprocess.DEVNULL, stderr=subprocess.PIPE)
          except OSError as e:
              st.tail.append("Gagal menjalankan ffmpeg: %s" % e)
              st.next_try = time.time() + 30
              return
          st.p, st.sig, st.started = p, cam_sig(cam), time.time()
          threading.Thread(target=_pump_err, args=(p, st, cam), daemon=True).start()
          if cam.get("motion"):
              threading.Thread(target=_pump_motion, args=(p, st, cam), daemon=True).start()


      def cctv_tick():
          if not FFMPEG:
              return
          now = time.time()
          with db() as c:
              cams = [dict(r) for r in c.execute("SELECT * FROM cameras WHERE enabled=1").fetchall()]
          with CAMS_LOCK:
              alive = set()
              for cam in cams:
                  cid = cam["id"]
                  alive.add(cid)
                  st = CAMS.get(cid)
                  if st is None:
                      st = CAMS[cid] = CamProc(cid)
                  cam["rec_eff"] = int(bool(cam["rec"] or manual_left(cid) > 0))
                  if st.norec_until > now:
                      cam["rec_eff"] = 0
                  if cam["brand"] == "device":
                      want = now - PUSH.get(cid, {}).get("t", 0) < 20
                  else:
                      want = bool(CCTV_ALWAYS_ON or cam["rec_eff"] or cam["motion"] or now - VIEWS.get(cid, 0) < 30)
                  running = st.p is not None and st.p.poll() is None
                  if running:
                      if not want or st.sig != cam_sig(cam):
                          cam_stop(st)
                          running, st.fails, st.next_try = False, 0, 0
                      elif now - st.started > (45 if cam["brand"] == "device" else 25) and not live_fresh(cid, 15):
                          st.tail.append("Tidak ada data dari kamera (timeout)")
                          cam_stop(st)
                          running = False
                          st.fails += 1
                          st.next_try = now + min(8, 2 * st.fails)
                      elif now - st.started > 60:
                          st.fails = 0
                  elif st.p is not None:
                      tl = " ".join(st.tail).lower()
                      if cam["rec_eff"] and ("error opening output" in tl or "failed to open segment" in tl or "could not write header" in tl):
                          # rekaman gagal dibuka: jalankan siaran tanpa rekaman 10 menit, lalu coba lagi
                          st.norec_until = now + 600
                          st.rec_err = friendly(list(st.tail))
                          cam["rec_eff"] = 0
                      st.p = None
                      st.fails += 1
                      st.next_try = now + min(8, 2 * st.fails)
                  if not running and want and now >= st.next_try:
                      cam_start(cam, st)
              for cid in list(CAMS):
                  if cid not in alive:
                      cam_stop(CAMS[cid])
                      CAMS.pop(cid, None)
                      shutil.rmtree(CCTV_LIVE / str(cid), ignore_errors=True)


      def cctv_wake(cid):
          VIEWS[cid] = time.time()
          st = CAMS.get(cid)
          if not (st and st.p is not None and st.p.poll() is None):
              cctv_tick()


      def rec_parse(name):
          m = re.fullmatch(r"(\d{8}-\d{6})\.mp4", name)
          if not m:
              return None
          try:
              return time.mktime(time.strptime(m.group(1), "%Y%m%d-%H%M%S"))
          except ValueError:
              return None


      def cctv_list_rec(cid, f, t):
          d, out, now = CCTV_REC / str(cid), [], time.time()
          if not d.is_dir():
              return out
          for p in d.glob("*.mp4"):
              s = rec_parse(p.name)
              if s is None:
                  continue
              try:
                  st = p.stat()
              except OSError:
                  continue
              end = max(s, st.st_mtime)
              if end < f or s > t:
                  continue
              out.append({"name": p.name, "start": s, "end": end, "size": st.st_size, "live": now - st.st_mtime < 25})
          out.sort(key=lambda x: x["start"])
          return out


      def cctv_usage():
          per, total = {}, 0
          for d in CCTV_REC.iterdir():
              if d.is_dir() and d.name.isdigit():
                  s = n = 0
                  for f in d.glob("*.mp4"):
                      try:
                          s += f.stat().st_size
                          n += 1
                      except OSError:
                          pass
                  per[int(d.name)] = {"size": s, "count": n}
                  total += s
          return per, total


      def cctv_prune():
          now, files = time.time(), []
          for d in CCTV_REC.iterdir():
              if d.is_dir():
                  for f in d.glob("*.mp4"):
                      try:
                          st = f.stat()
                      except OSError:
                          continue
                      if now - st.st_mtime > 120:
                          files.append([st.st_mtime, st.st_size, f])
          files.sort(key=lambda x: x[0])

          def drop(x):
              x[2].unlink(missing_ok=True)
              files.remove(x)

          if CCTV["keep_days"] > 0:
              for x in [x for x in files if now - x[0] > CCTV["keep_days"] * 86400]:
                  drop(x)
          if CCTV["max_gb"] > 0:
              cap = CCTV["max_gb"] * 1024 ** 3
              while files and sum(x[1] for x in files) > cap:
                  drop(files[0])
          try:
              free = shutil.disk_usage(DATA).free
              while files and free < 1024 ** 3:
                  free += files[0][1]
                  drop(files[0])
          except OSError:
              pass
          cut = now - max(CCTV["keep_days"], 3) * 86400
          with db() as c:
              for r in c.execute("SELECT id FROM cctv_events WHERE ts<?", (cut,)).fetchall():
                  (CCTV_EVT / ("%d.jpg" % r["id"])).unlink(missing_ok=True)
              c.execute("DELETE FROM cctv_events WHERE ts<?", (cut,))


      def cctv_loop():
          last = 0
          while True:
              try:
                  cctv_tick()
                  cctv_snap_tick()
                  if time.time() - last > 600:
                      last = time.time()
                      cctv_prune()
                      tl_prune()
              except Exception as e:  # noqa
                  sys.stderr.write("cctv: %r\n" % (e,))
              time.sleep(3)


      def cctv_shutdown():
          try:
              for st in list(CAMS.values()):
                  cam_stop(st)
          except Exception:
              pass


      def cctv_boot():
          threading.Thread(target=smart_loop, daemon=True).start()
          threading.Thread(target=liveai_loop, daemon=True).start()
          shutil.rmtree(CCTV_LIVE, ignore_errors=True)
          CCTV_LIVE.mkdir(parents=True, exist_ok=True)
          if FFMPEG:
              threading.Thread(target=cctv_loop, daemon=True).start()
          else:
              sys.stderr.write("cctv: ffmpeg tidak ditemukan, fitur CCTV tidak aktif\n")

          def bye(*a):
              cctv_shutdown()
              os._exit(0)
          try:
              signal.signal(signal.SIGTERM, bye)
          except ValueError:
              pass


      def ffmpeg_version():
          if _FFV["v"] is None:
              _FFV["v"] = ""
              if FFMPEG:
                  try:
                      out = subprocess.run([FFMPEG, "-version"], stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, timeout=5).stdout.decode("utf-8", "ignore")
                      _FFV["v"] = out.split("\n")[0].replace("ffmpeg version ", "")[:40]
                  except Exception:
                      pass
          return _FFV["v"]


      def probe_with_ffmpeg(cam, url):
          cmd = [FFMPEG, "-hide_banner", "-protocol_whitelist", CCTV_WL]
          if url.startswith("rtsp"):
              cmd += ["-rtsp_transport", "tcp", "-timeout", "8000000"]
          cmd += ["-i", url]
          try:
              r = subprocess.run(cmd, stdout=subprocess.DEVNULL, stderr=subprocess.PIPE, timeout=25)
          except subprocess.TimeoutExpired:
              return {"error": "Timeout: kamera tidak menjawab."}
          except OSError as e:
              return {"error": str(e)}
          txt = r.stderr.decode("utf-8", "ignore")
          out = {}
          m = re.search(r"Stream #\S+.*?: Video: (\w+).*?(\d{2,5})x(\d{2,5})", txt)
          if m:
              out["video"] = {"codec": m.group(1), "w": int(m.group(2)), "h": int(m.group(3)), "fps": None}
          a = re.search(r"Stream #\S+.*?: Audio: (\w+)", txt)
          if a:
              out["audio"] = {"codec": a.group(1), "rate": None}
          if "video" not in out:
              out["error"] = friendly(scrub(txt, cam)) or "Gagal membaca stream."
          return out


      def cam_probe(cam):
          url = cam_url(cam)
          if not FFPROBE:
              return probe_with_ffmpeg(cam, url) if FFMPEG else {"error": "ffmpeg belum terpasang di server."}
          cmd = [FFPROBE, "-v", "error", "-protocol_whitelist", CCTV_WL]
          if url.startswith("rtsp"):
              cmd += ["-rtsp_transport", "tcp", "-timeout", "8000000"]
          cmd += ["-print_format", "json", "-show_streams", url]
          try:
              r = subprocess.run(cmd, stdout=subprocess.PIPE, stderr=subprocess.PIPE, timeout=25)
          except subprocess.TimeoutExpired:
              return {"error": "Timeout: kamera tidak menjawab."}
          except OSError as e:
              return {"error": str(e)}
          if r.returncode != 0:
              msg = scrub(r.stderr.decode("utf-8", "ignore"), cam)
              return {"error": friendly(msg) or "Gagal membaca stream."}
          try:
              streams = json.loads(r.stdout.decode("utf-8", "ignore")).get("streams", [])
          except ValueError:
              return {"error": "Respons ffprobe tidak valid."}
          out = {}
          for s in streams:
              if s.get("codec_type") == "video" and "video" not in out:
                  out["video"] = {"codec": s.get("codec_name"), "w": s.get("width"), "h": s.get("height"), "fps": s.get("avg_frame_rate")}
              elif s.get("codec_type") == "audio" and "audio" not in out:
                  out["audio"] = {"codec": s.get("codec_name"), "rate": s.get("sample_rate")}
          if "video" not in out:
              out["error"] = "Stream tidak berisi video."
          return out


      # ---------------------------------------------------------------- ONVIF (PTZ)
      def onvif_env(body, user, pw, off=0.0):
          hdr = ""
          if user:
              nonce = os.urandom(16)
              created = time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime(time.time() + off))
              dig = base64.b64encode(hashlib.sha1(nonce + created.encode() + pw.encode()).digest()).decode()
              hdr = ('<s:Header><Security s:mustUnderstand="1" xmlns="http://docs.oasis-open.org/wss/2004/01/oasis-200401-wss-wssecurity-secext-1.0.xsd">'
                     '<UsernameToken><Username>%s</Username><Password Type="http://docs.oasis-open.org/wss/2004/01/oasis-200401-wss-username-token-profile-1.0#PasswordDigest">%s</Password>'
                     '<Nonce EncodingType="http://docs.oasis-open.org/wss/2004/01/oasis-200401-wss-soap-message-security-1.0#Base64Binary">%s</Nonce>'
                     '<Created xmlns="http://docs.oasis-open.org/wss/2004/01/oasis-200401-wss-wssecurity-utility-1.0.xsd">%s</Created></UsernameToken></Security></s:Header>'
                     % (xesc(user), dig, base64.b64encode(nonce).decode(), created))
          return '<?xml version="1.0" encoding="utf-8"?><s:Envelope xmlns:s="http://www.w3.org/2003/05/soap-envelope">' + hdr + "<s:Body>" + body + "</s:Body></s:Envelope>"


      def onvif_post(url, body, user="", pw="", off=0.0, timeout=6):
          req = urllib.request.Request(url, data=onvif_env(body, user, pw, off).encode(), headers={"Content-Type": "application/soap+xml; charset=utf-8"})
          try:
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  raw = r.read(2_000_000)
          except urllib.error.HTTPError as e:
              raise ApiError(502, "Kamera menolak perintah ONVIF (HTTP %d). Periksa username/password dan pastikan ONVIF aktif." % e.code)
          except (urllib.error.URLError, OSError):
              raise ApiError(502, "Tidak bisa menghubungi ONVIF kamera. Periksa port ONVIF dan jaringan.")
          try:
              return ET.fromstring(raw)
          except ET.ParseError:
              raise ApiError(502, "Respons ONVIF tidak valid.")


      def _tagend(e, name):
          return e.tag.endswith("}" + name) or e.tag == name


      def onvif_ctx(cam, fresh=False):
          cam = dict(cam)
          port = int(cam.get("onvif_port") or 0)
          if not port:
              raise ApiError(400, "Port ONVIF belum diatur untuk kamera ini.")
          key = (cam["host"], port, cam.get("username") or "", cam.get("pass_enc") or "")
          hit = ONVIF.get(key)
          if hit and not fresh and time.time() - hit["t"] < 600:
              return hit
          user, pw = cam.get("username") or "", dec_secret(cam.get("pass_enc") or "")
          dev = "http://%s:%d/onvif/device_service" % (cam["host"], port)
          off = 0.0
          try:
              root = onvif_post(dev, '<GetSystemDateAndTime xmlns="%s"/>' % NS_DEV)
              v = {}
              for e in root.iter():
                  for k in ("Year", "Month", "Day", "Hour", "Minute", "Second"):
                      if _tagend(e, k) and k not in v and (e.text or "").strip().isdigit():
                          v[k] = int(e.text)
              if len(v) == 6:
                  off = calendar.timegm((v["Year"], v["Month"], v["Day"], v["Hour"], v["Minute"], v["Second"])) - time.time()
          except ApiError:
              pass
          root = onvif_post(dev, '<GetCapabilities xmlns="%s"><Category>All</Category></GetCapabilities>' % NS_DEV, user, pw, off)
          urls = {}
          for e in root.iter():
              for nm, key2 in (("Media", "media"), ("PTZ", "ptz")):
                  if _tagend(e, nm):
                      for ch in e:
                          if _tagend(ch, "XAddr") and ch.text:
                              p = urlparse(ch.text.strip())
                              urls[key2] = "http://%s:%d%s" % (cam["host"], p.port or port, p.path or "/onvif/device_service")
          ctx = {"t": time.time(), "user": user, "pw": pw, "off": off, "media": urls.get("media") or dev, "ptz": urls.get("ptz"), "profile": None}
          root = onvif_post(ctx["media"], '<GetProfiles xmlns="%s"/>' % NS_MED, user, pw, off)
          first = None
          for e in root.iter():
              if _tagend(e, "Profiles") and e.attrib.get("token"):
                  first = first or e.attrib["token"]
                  if any(_tagend(ch, "PTZConfiguration") for ch in e):
                      ctx["profile"] = e.attrib["token"]
                      break
          ctx["profile"] = ctx["profile"] or first
          if not ctx["profile"]:
              raise ApiError(502, "Kamera tidak mengembalikan profil ONVIF.")
          if len(ONVIF) > 40:
              ONVIF.clear()
          ONVIF[key] = ctx
          return ctx


      def onvif_ptz(cam, body):
          ctx = onvif_ctx(cam)
          if not ctx["ptz"]:
              raise ApiError(400, "Kamera ini tidak mendukung PTZ lewat ONVIF.")
          return onvif_post(ctx["ptz"], body, ctx["user"], ctx["pw"], ctx["off"])


      def ptz_move(cam, pan, tilt, zoom):
          tok = xesc(onvif_ctx(cam)["profile"])
          onvif_ptz(cam, '<ContinuousMove xmlns="%s"><ProfileToken>%s</ProfileToken><Velocity><PanTilt x="%.3f" y="%.3f" xmlns="%s"/><Zoom x="%.3f" xmlns="%s"/></Velocity></ContinuousMove>'
                    % (NS_PTZ, tok, pan, tilt, NS_SCH, zoom, NS_SCH))


      def ptz_stop(cam):
          tok = xesc(onvif_ctx(cam)["profile"])
          onvif_ptz(cam, '<Stop xmlns="%s"><ProfileToken>%s</ProfileToken><PanTilt>true</PanTilt><Zoom>true</Zoom></Stop>' % (NS_PTZ, tok))


      def ptz_auto_stop(cam, ms):
          cid = cam["id"]
          old = PTZ_TIMERS.pop(cid, None)
          if old:
              old.cancel()

          def stop():
              PTZ_TIMERS.pop(cid, None)
              try:
                  ptz_stop(cam)
              except Exception:
                  pass
          t = threading.Timer(ms / 1000.0, stop)
          t.daemon = True
          PTZ_TIMERS[cid] = t
          t.start()


      def ptz_presets(cam):
          tok = xesc(onvif_ctx(cam)["profile"])
          root = onvif_ptz(cam, '<GetPresets xmlns="%s"><ProfileToken>%s</ProfileToken></GetPresets>' % (NS_PTZ, tok))
          out = []
          for e in root.iter():
              if _tagend(e, "Preset") and e.attrib.get("token"):
                  nm = ""
                  for ch in e:
                      if _tagend(ch, "Name"):
                          nm = ch.text or ""
                  out.append({"token": e.attrib["token"], "name": nm or ("Posisi " + e.attrib["token"])})
          return out


      def ptz_preset_op(cam, op, token="", name=""):
          tok = xesc(onvif_ctx(cam)["profile"])
          if op == "goto":
              onvif_ptz(cam, '<GotoPreset xmlns="%s"><ProfileToken>%s</ProfileToken><PresetToken>%s</PresetToken></GotoPreset>' % (NS_PTZ, tok, xesc(token)))
          elif op == "remove":
              onvif_ptz(cam, '<RemovePreset xmlns="%s"><ProfileToken>%s</ProfileToken><PresetToken>%s</PresetToken></RemovePreset>' % (NS_PTZ, tok, xesc(token)))
          elif op == "set":
              onvif_ptz(cam, '<SetPreset xmlns="%s"><ProfileToken>%s</ProfileToken><PresetName>%s</PresetName></SetPreset>' % (NS_PTZ, tok, xesc(name)))


      # ---------------------------------------------------------------- validasi, pemindai
      def _int(v, default, lo, hi):
          try:
              x = int(float(v))
          except (TypeError, ValueError):
              return default
          return max(lo, min(hi, x))


      def cam_payload(d, old=None):
          old = old or {}

          def s(k, n):
              v = d.get(k)
              return str(v).strip()[:n] if v is not None else ""
          name = re.sub(r"[\x00-\x1f<>]", "", s("name", 40)).strip()
          if not name:
              raise ApiError(400, "Nama kamera wajib diisi")
          brand = s("brand", 10)
          out = {"name": name, "brand": brand if brand in ("v380", "rtsp", "custom", "device", "local") else "rtsp"}
          if s("mode", 10) == "local":
              dv = s("host", 40)
              if not re.fullmatch(r"/dev/video\d{1,2}", dv):
                  raise ApiError(400, "Perangkat kamera harus berbentuk /dev/video0")
              size = s("size", 12) or "1280x720"
              if not re.fullmatch(r"\d{3,4}x\d{3,4}", size):
                  raise ApiError(400, "Resolusi tidak valid (contoh 1280x720)")
              ad = s("audio_dev", 40) or "default"
              if not re.fullmatch(r"[A-Za-z0-9_:,.=-]{1,40}", ad):
                  raise ApiError(400, "Nama perangkat audio tidak valid")
              out.update(brand="local", host=dv, port=0, username=size, pass_enc="", path_main=ad, url_custom="", onvif_port=0, transcode=1, sens=_int(d.get("sens"), 50, 1, 100))
              for k, dv2 in (("audio", True), ("rec", False), ("motion", False), ("enabled", True), ("ai", False), ("ai_age", False)):
                  out[k] = int(bool(d.get(k, dv2)))
              zone = s("motion_zone", 200)
              out["motion_zone"] = zone if re.fullmatch(r"[01]{144}", zone) and "1" in zone else ""
              out["motion_sched"] = sched_clean(d.get("motion_sched")) if d.get("motion_sched") else ""
              sm = _int(d.get("snap_min"), 0, 0, 1440)
              out["snap_min"] = sm if sm in (0, 1, 5, 10, 15, 30, 60) else 0
              cl = [x for x in GROUP_ORDER if x in str(d.get("ai_classes", "person,vehicle,animal")).split(",")]
              out["ai_classes"] = ",".join(cl) or "person"
              out["ai_conf"] = _int(d.get("ai_conf"), 50, 20, 95)
              if out["ai"]:
                  out["motion"] = 1
              return out
          if s("mode", 10) == "device":
              out.update(brand="device", host="perangkat", port=0, username="", pass_enc="", path_main="/", url_custom="", onvif_port=0, sens=_int(d.get("sens"), 50, 1, 100))
              for k, dv in (("audio", True), ("rec", False), ("motion", False), ("enabled", True), ("ai", False), ("ai_age", False)):
                  out[k] = int(bool(d.get(k, dv)))
              out["transcode"] = 1
              zone = s("motion_zone", 200)
              out["motion_zone"] = zone if re.fullmatch(r"[01]{144}", zone) and "1" in zone else ""
              out["motion_sched"] = sched_clean(d.get("motion_sched")) if d.get("motion_sched") else ""
              sm = _int(d.get("snap_min"), 0, 0, 1440)
              out["snap_min"] = sm if sm in (0, 1, 5, 10, 15, 30, 60) else 0
              cl = [x for x in GROUP_ORDER if x in str(d.get("ai_classes", "person,vehicle,animal")).split(",")]
              out["ai_classes"] = ",".join(cl) or "person"
              out["ai_conf"] = _int(d.get("ai_conf"), 50, 20, 95)
              if out["ai"]:
                  out["motion"] = 1
              return out
          if s("mode", 10) == "custom":
              url = s("url", 500)
              if url:
                  if not re.fullmatch(r"(rtsps?|rtmps?|https?)://[^\s'\"<>]{3,480}", url):
                      raise ApiError(400, "URL harus diawali rtsp://, rtmp:// atau http(s)://")
                  out["url_custom"] = enc_secret(url)
                  hn = urlparse(url).hostname or "-"
              elif old.get("url_custom"):
                  out["url_custom"], hn = old["url_custom"], old.get("host") or "-"
              else:
                  raise ApiError(400, "URL stream wajib diisi")
              out.update(host=hn[:253], port=0, username="", pass_enc="", path_main="/")
          else:
              host = s("host", 253)
              if not re.fullmatch(r"[A-Za-z0-9._-]{1,253}", host):
                  raise ApiError(400, "Alamat IP / host tidak valid")
              path = s("path", 200) or "/"
              if not re.fullmatch(r"/?[A-Za-z0-9_./?=&%:@+,;~-]{0,199}", path):
                  raise ApiError(400, "Path stream tidak valid")
              if not path.startswith("/"):
                  path = "/" + path
              pw = d.get("password")
              pe = old.get("pass_enc", "") if (pw is None or pw == "") else enc_secret(str(pw)[:128])
              if d.get("clear_pass"):
                  pe = ""
              out.update(host=host, port=_int(d.get("port"), 554, 1, 65535), username=re.sub(r"[\x00-\x1f]", "", s("username", 64)),
                         pass_enc=pe, path_main=path, url_custom="")
          out["onvif_port"] = _int(d.get("onvif_port"), 0, 0, 65535)
          out["sens"] = _int(d.get("sens"), 50, 1, 100)
          for k, dv in (("audio", True), ("rec", False), ("motion", False), ("transcode", False), ("enabled", True), ("ai", False), ("ai_age", False)):
              out[k] = int(bool(d.get(k, dv)))
          zone = s("motion_zone", 200)
          if zone and not re.fullmatch(r"[01]{144}", zone):
              raise ApiError(400, "Zona gerakan tidak valid")
          out["motion_zone"] = zone if "1" in zone else ""
          out["motion_sched"] = sched_clean(d.get("motion_sched")) if d.get("motion_sched") else ""
          sm = _int(d.get("snap_min"), 0, 0, 1440)
          out["snap_min"] = sm if sm in (0, 1, 5, 10, 15, 30, 60) else 0
          cl = [x for x in GROUP_ORDER if x in str(d.get("ai_classes", "person,vehicle,animal")).split(",")]
          out["ai_classes"] = ",".join(cl) or "person"
          out["ai_conf"] = _int(d.get("ai_conf"), 50, 20, 95)
          if out["ai"]:
              out["motion"] = 1
          return out


      CAM_COLS = ("name", "brand", "host", "port", "username", "pass_enc", "path_main", "url_custom", "onvif_port",
                  "audio", "rec", "motion", "sens", "transcode", "enabled", "motion_zone", "motion_sched", "snap_min", "ai", "ai_classes", "ai_conf", "ai_age")


      def cctv_scan(cidr):
          try:
              net = ipaddress.ip_network((cidr or "").strip(), strict=False)
          except ValueError:
              raise ApiError(400, "Rentang jaringan tidak valid. Contoh: 192.168.1.0/24")
          if net.version != 4 or not net.is_private:
              raise ApiError(400, "Hanya jaringan privat IPv4 yang boleh dipindai")
          if net.num_addresses > 512:
              raise ApiError(400, "Rentang terlalu besar (maksimal /23)")
          pairs = [(str(h), p) for h in net.hosts() for p in (554, 8554, 8899)]

          def chk(hp):
              try:
                  socket.create_connection(hp, 0.6).close()
                  return hp
              except OSError:
                  return None
          found = {}
          with ThreadPoolExecutor(96) as ex:
              for r in ex.map(chk, pairs):
                  if r:
                      found.setdefault(r[0], []).append(r[1])
          return [{"host": h, "ports": sorted(p)} for h, p in sorted(found.items(), key=lambda x: ipaddress.ip_address(x[0]))]


      MUTATING = {"folder", "upload", "savetext", "rename", "move", "copy", "star", "trash", "delete", "empty-trash", "color", "share", "extract"}


      # ---------------------------------------------------------------- handler
      class Handler(BaseHTTPRequestHandler):
          protocol_version = "HTTP/1.1"
          server_version = "HomeDrive"

          def log_message(self, fmt, *args):
              sys.stderr.write("%s - %s\n" % (self.address_string(), fmt % args))

          def _headers(self, status, ctype, length, extra=None):
              self.send_response(status)
              self.send_header("Content-Type", ctype)
              self.send_header("Content-Length", str(length))
              self.send_header("X-Content-Type-Options", "nosniff")
              self.send_header("Referrer-Policy", "same-origin")
              for k, v in (extra or {}).items():
                  self.send_header(k, v)
              self.end_headers()

          def send_json(self, obj, status=200, extra=None):
              body = json.dumps(obj, separators=(",", ":")).encode()
              extra = dict(extra or {})
              if len(body) > 1500 and "gzip" in (self.headers.get("Accept-Encoding") or ""):
                  body = gzip.compress(body, 3)
                  extra["Content-Encoding"] = "gzip"
                  extra["Vary"] = "Accept-Encoding"
              self._headers(status, "application/json; charset=utf-8", len(body), extra)
              self.wfile.write(body)

          def send_html(self, pair, extra=None):
              status, body = pair
              self._headers(status, "text/html; charset=utf-8", len(body), extra)
              if not self.head_only:
                  self.wfile.write(body)

          def read_json(self, limit=1_000_000):
              n = int(self.headers.get("Content-Length") or 0)
              if n > limit:
                  raise ApiError(413, "Permintaan terlalu besar")
              try:
                  return json.loads(self.rfile.read(n) or b"{}")
              except ValueError:
                  raise ApiError(400, "JSON tidak valid")

          def cookie(self, name):
              for part in (self.headers.get("Cookie") or "").split(";"):
                  k, _, v = part.strip().partition("=")
                  if k == name:
                      return v
              return None

          def current_user(self):
              t = self.cookie("sid")
              if not t:
                  return None
              with db() as c:
                  r = c.execute(
                      "SELECT u.*, s.last_seen AS sls FROM sessions s JOIN users u ON u.id=s.user_id "
                      "WHERE s.token_hash=? AND s.expires>? AND COALESCE(u.disabled,0)=0", (tok_hash(t), time.time())).fetchone()
                  if r and (r["sls"] is None or time.time() - r["sls"] > 60):
                      c.execute("UPDATE sessions SET last_seen=?, ip=? WHERE token_hash=?",
                                (time.time(), self.client_address[0], tok_hash(t)))
                  return r

          def need_user(self):
              u = self.current_user()
              if not u:
                  raise ApiError(401, "Belum login")
              self._uid = u["id"]
              return u

          def start_session(self, user_id):
              t = secrets.token_urlsafe(32)
              with db() as c:
                  c.execute("DELETE FROM sessions WHERE expires<?", (time.time(),))
                  now = time.time()
                  c.execute("INSERT INTO sessions(token_hash,user_id,expires,ua,ip,created,last_seen) VALUES(?,?,?,?,?,?,?)",
                            (tok_hash(t), user_id, now + SESSION_DAYS * 86400,
                             (self.headers.get("User-Agent") or "")[:300], self.client_address[0], now, now))
              flags = "HttpOnly; SameSite=Lax; Path=/; Max-Age=%d" % (SESSION_DAYS * 86400)
              if COOKIE_SECURE:
                  flags += "; Secure"
              return {"Set-Cookie": f"sid={t}; {flags}"}

          def quota_for(self, c, uid):
              r = c.execute("SELECT quota_gb FROM users WHERE id=?", (uid,)).fetchone()
              if r and r["quota_gb"] is not None:
                  return int(r["quota_gb"] * 1024**3)
              return QUOTA

          def uquota(self, uid):
              with db() as c:
                  return self.quota_for(c, uid)

          def used_bytes(self, c, uid):
              return c.execute("SELECT COALESCE(SUM(size),0) s FROM items WHERE user_id=? AND is_folder=0", (uid,)).fetchone()["s"]

          def storage_info(self, c, u):
              """Ringkasan penyimpanan akun. Non-owner wajib diberi kuota oleh owner (REQUIRE_QUOTA) sebelum bisa mengunggah."""
              uid = u["id"]
              r = c.execute("SELECT quota_gb FROM users WHERE id=?", (uid,)).fetchone()
              qset = bool(r) and r["quota_gb"] is not None
              qt = int(r["quota_gb"] * 1024**3) if qset else QUOTA
              owner = bool(u["is_owner"])
              can = owner or qset or not REQUIRE_QUOTA
              used = self.used_bytes(c, uid)
              try:
                  free = shutil.disk_usage(DATA).free
              except OSError:
                  free = None
              avail = max(0, qt - used) if qt else free
              if free is not None and avail is not None:
                  avail = min(avail, free)
              if not can:
                  avail = 0
              elif not qt and not (u["is_admin"] or owner):
                  avail = None  # tanpa batas: jangan bocorkan sisa disk server ke pengguna biasa
              return {"used": used, "quota": qt, "quota_set": qset, "can_upload": can, "available": avail,
                      "percent": round(used / qt * 100, 1) if qt else 0, "unlimited": bool(can and not qt), "owner": owner}

          def ensure_space(self, c, u, add, replace=0):
              """Tolak penyimpanan baru bila kuota belum diatur, kuota penuh, atau disk server hampir habis."""
              info = self.storage_info(c, u)
              if not info["can_upload"]:
                  raise ApiError(403, "Kuota Anda belum diatur oleh owner, jadi belum bisa mengunggah file.", "no_quota")
              if info["quota"] and info["used"] - replace + add > info["quota"]:
                  raise ApiError(413, "Kuota penyimpanan penuh. Minta tambahan kuota ke owner.", "quota_full")
              try:
                  if shutil.disk_usage(DATA).free < add + DISK_RESERVE:
                      raise ApiError(507, "Disk server hampir penuh, hubungi owner.", "disk_full")
              except OSError:
                  pass

          def unread_count(self, c, uid):
              return c.execute("SELECT COUNT(*) n FROM notifications WHERE user_id=? AND is_read=0", (uid,)).fetchone()["n"]

          # ---- dispatch
          def do_GET(self):
              self.route("GET")

          def do_HEAD(self):
              self.route("GET", head=True)

          def do_POST(self):
              self.route("POST")

          def route(self, method, head=False):
              self.head_only = head
              self._uid = None
              self.cid = (self.headers.get("X-Client-Id") or "")[:40]
              u = urlparse(self.path)
              q = parse_qs(u.query)
              path = u.path
              try:
                  if method == "GET" and path in ("/", "/index.html"):
                      return self.serve_index()
                  if method == "GET" and path == "/manifest.webmanifest":
                      return self.serve_bytes("application/manifest+json", build_manifest(), "no-cache")
                  if method == "GET" and path == "/sw.js":
                      self._headers(200, "application/javascript; charset=utf-8", len(SW_JS2),
                                    {"Cache-Control": "no-cache", "Service-Worker-Allowed": "/"})
                      if not self.head_only:
                          self.wfile.write(SW_JS2)
                      return
                  if method == "GET" and path == "/offline.html":
                      return self.serve_bytes("text/html; charset=utf-8", OFFLINE_HTML, "no-cache")
                  if method == "GET" and path.startswith("/pwa/"):
                      m = {"icon-192.png": (192, False), "icon-512.png": (512, False), "maskable-512.png": (512, True), "apple-180.png": (180, True)}.get(path[5:])
                      if not m:
                          raise ApiError(404, "Tidak ditemukan")
                      return self.serve_bytes("image/png", pwa_icon(*m), "public, max-age=86400")
                  if method == "GET" and path == "/icon.svg":
                      return self.serve_static("image/svg+xml", ICON_SVG)
                  if method == "GET" and path == "/design.css":
                      return self.serve_design_css()
                  if method == "GET" and path.startswith("/design/asset/"):
                      return self.serve_design_asset(path[14:])
                  if method == "GET" and path in ("/studio", "/studio/"):
                      return self.serve_studio()
                  if path.startswith("/s/"):
                      return self.public_share(method, path[3:], q)
                  if not path.startswith("/api/"):
                      raise ApiError(404, "Tidak ditemukan")
                  if method == "POST" and self.headers.get("X-Requested-With") != "drive":
                      raise ApiError(403, "Header X-Requested-With wajib")
                  name = path[5:].strip("/")
                  if method == "POST" and RUNTIME["maintenance"] and name.split("/")[0] in MUTATING:
                      cu = self.current_user()
                      if cu and not cu["is_owner"]:
                          raise ApiError(503, "Mode pemeliharaan aktif: penyimpanan sementara hanya-baca.", "maintenance")
                  fn = getattr(self, "api_" + name.split("/")[0].replace("-", "_"), None)
                  if not fn:
                      raise ApiError(404, "Endpoint tidak ada")
                  fn(method, name, q)
                  if method == "POST" and self._uid and name.split("/")[0] in MUTATING:
                      EVENTS.emit("files", self._uid, self.cid)  # perangkat/tab lain milik akun ini ikut diperbarui
              except ApiError as e:
                  if method == "POST":
                      self.close_connection = True
                  try:
                      if path.startswith("/s/"):
                          self.send_html(share_page("Tidak tersedia", f"<div class=card><h1>Tidak tersedia</h1><p class=muted>{h(e.msg)}</p></div>", e.status))
                      else:
                          self.send_json({"error": e.msg, **({"code": e.code} if e.code else {})}, e.status)
                  except Exception:
                      pass
              except (BrokenPipeError, ConnectionResetError):
                  self.close_connection = True
              except Exception as e:  # noqa
                  self.close_connection = True
                  sys.stderr.write("ERROR: %r\n" % (e,))
                  try:
                      self.send_json({"error": "Kesalahan server"}, 500)
                  except Exception:
                      pass
              finally:
                  EVENTS.flush()

          # ---- Studio desain
          def serve_design_css(self):
              body = RUNTIME["design_css"].encode()
              etag = '"d%s"' % RUNTIME["design_ver"]
              extra = {"Cache-Control": "no-cache", "ETag": etag}
              if self.headers.get("If-None-Match") == etag:
                  return self._headers(304, "text/css; charset=utf-8", 0, extra)
              self._headers(200, "text/css; charset=utf-8", len(body), extra)
              if not self.head_only:
                  self.wfile.write(body)

          def serve_design_asset(self, fname):
              if not DESIGN_ASSET_RE.match(fname) or not (DESIGN_DIR / fname).is_file():
                  raise ApiError(404, "Tidak ditemukan")
              body = (DESIGN_DIR / fname).read_bytes()
              ext = fname.rsplit(".", 1)[1]
              extra = {"Cache-Control": "public, max-age=31536000, immutable"}
              if ext == "svg":
                  extra["Content-Security-Policy"] = "default-src 'none'; style-src 'unsafe-inline'; sandbox"
              self._headers(200, DESIGN_MIME[ext], len(body), extra)
              if not self.head_only:
                  self.wfile.write(body)

          def serve_studio(self):
              p = BASE / "studio.html"
              if not p.is_file():
                  raise ApiError(404, "Studio belum terpasang")
              m = p.stat().st_mtime_ns
              if _STUDIO["m"] != m:
                  raw = p.read_bytes()
                  _STUDIO.update(m=m, raw=raw, gz=gzip.compress(raw, 6), etag='"s%x"' % m)
              extra = {"Cache-Control": "no-cache", "ETag": _STUDIO["etag"], "Vary": "Accept-Encoding"}
              if self.headers.get("If-None-Match") == _STUDIO["etag"]:
                  return self._headers(304, "text/html; charset=utf-8", 0, extra)
              body = _STUDIO["raw"]
              if "gzip" in (self.headers.get("Accept-Encoding") or ""):
                  body = _STUDIO["gz"]
                  extra["Content-Encoding"] = "gzip"
              self._headers(200, "text/html; charset=utf-8", len(body), extra)
              if not self.head_only:
                  self.wfile.write(body)

          def api_design(self, method, name, q):
              parts = name.split("/")
              sub = parts[1] if len(parts) > 1 else ""
              if method == "GET" and sub == "":  # publik: halaman login juga perlu tahu nama & teksnya
                  return self.send_json({"ver": RUNTIME["design_ver"], "design": RUNTIME["design"], "css": RUNTIME["design_css"]},
                                        extra={"Cache-Control": "no-cache"})
              u = self.need_user()
              if not u["is_owner"]:
                  raise ApiError(403, "Hanya owner yang bisa mendesain tampilan")
              with db() as c:
                  if method == "GET" and sub == "library":
                      assets = []
                      for p in sorted(DESIGN_DIR.iterdir(), key=lambda x: -x.stat().st_mtime):
                          if DESIGN_ASSET_RE.match(p.name):
                              assets.append({"url": "/design/asset/" + p.name, "size": p.stat().st_size, "ts": p.stat().st_mtime,
                                             "kind": "font" if p.suffix[1:] in ("woff2", "woff", "ttf", "otf") else "image"})
                      return self.send_json({"presets": _jlist(c, "design_presets"), "history": _jlist(c, "design_history"),
                                             "assets": assets, "ver": RUNTIME["design_ver"], "design": RUNTIME["design"], "css": RUNTIME["design_css"],
                                             "user": u["username"]})
                  if method != "POST":
                      raise ApiError(404, "Endpoint tidak ada")
                  if sub == "upload":
                      n = self.headers.get("Content-Length")
                      if not n or not n.isdigit():
                          raise ApiError(411, "Content-Length wajib")
                      n = int(n)
                      if n > DESIGN_MAX_IMG:
                          raise ApiError(413, "Berkas terlalu besar (maksimal 6 MB)")
                      raw = self.rfile.read(n)
                      ext = (q.get("name", [""])[0].rsplit(".", 1)[-1] or "").lower().replace("jpeg", "jpg")
                      if ext not in DESIGN_MIME or not design_asset_kind(raw, ext):
                          raise ApiError(400, "Format tidak didukung. Gunakan PNG, JPG, WEBP, GIF, SVG, AVIF, atau font WOFF2/WOFF/TTF/OTF yang valid.")
                      if ext in ("woff2", "woff", "ttf", "otf") and n > DESIGN_MAX_FONT:
                          raise ApiError(413, "Berkas font terlalu besar (maksimal 4 MB)")
                      fn = hashlib.sha256(raw).hexdigest()[:16] + "." + ext
                      if not (DESIGN_DIR / fn).exists():
                          tmp = DESIGN_DIR / (fn + ".part")
                          tmp.write_bytes(raw)
                          tmp.replace(DESIGN_DIR / fn)
                      return self.send_json({"ok": True, "url": "/design/asset/" + fn})
                  d = self.read_json(400_000)
                  if sub == "preview":
                      clean = sanitize_design(d.get("design"))
                      return self.send_json({"design": clean, "css": design_css(clean)})
                  if sub == "save":
                      clean = publish_design(c, u["id"], d.get("design"), "diterbitkan")
                      return self.send_json({"ok": True, "ver": RUNTIME["design_ver"], "design": clean})
                  if sub == "reset":
                      publish_design(c, u["id"], {}, "dikembalikan ke bawaan")
                      return self.send_json({"ok": True, "ver": RUNTIME["design_ver"], "design": {}})
                  if sub == "restore":
                      try:
                          ts = float(d.get("ts"))
                      except (TypeError, ValueError):
                          raise ApiError(400, "Versi tidak valid")
                      hit = next((x for x in _jlist(c, "design_history") if abs(x.get("ts", 0) - ts) < 1e-6), None)
                      if not hit:
                          raise ApiError(404, "Versi tidak ditemukan")
                      clean = publish_design(c, u["id"], hit.get("design"), "memulihkan versi lama")
                      return self.send_json({"ok": True, "ver": RUNTIME["design_ver"], "design": clean})
                  if sub == "preset":
                      nm = _txt(60)(d.get("name"))
                      if not nm:
                          raise ApiError(400, "Beri nama preset")
                      lst = _jlist(c, "design_presets")
                      pid = str(d.get("id") or "")
                      item = {"id": pid if any(x.get("id") == pid for x in lst) else uuid.uuid4().hex[:10], "name": nm, "ts": time.time(),
                              "design": sanitize_design(d.get("design"))}
                      lst = [x for x in lst if x.get("id") != item["id"]]
                      if len(lst) >= 40:
                          raise ApiError(400, "Maksimal 40 preset. Hapus yang tidak dipakai.")
                      set_setting(c, "design_presets", json.dumps([item] + lst, separators=(",", ":")))
                      return self.send_json({"ok": True, "preset": item})
                  if sub == "preset-delete":
                      lst = [x for x in _jlist(c, "design_presets") if x.get("id") != d.get("id")]
                      set_setting(c, "design_presets", json.dumps(lst, separators=(",", ":")))
                      return self.send_json({"ok": True})
                  if sub == "asset-delete":
                      url = str(d.get("url") or "")
                      fn = url.rsplit("/", 1)[-1]
                      if not url.startswith("/design/asset/") or not DESIGN_ASSET_RE.match(fn):
                          raise ApiError(400, "Aset tidak valid")
                      if url in json.dumps(RUNTIME["design"]) or url in get_setting(c, "design_presets", "[]"):
                          raise ApiError(409, "Aset ini masih dipakai desain aktif atau sebuah preset.")
                      try:
                          (DESIGN_DIR / fn).unlink()
                      except OSError:
                          pass
                      return self.send_json({"ok": True})
              raise ApiError(404, "Endpoint tidak ada")

          def serve_bytes(self, ctype, body, cache):
              self._headers(200, ctype, len(body), {"Cache-Control": cache})
              if not self.head_only:
                  self.wfile.write(body)

          def serve_static(self, ctype, body):
              self._headers(200, ctype, len(body), {"Cache-Control": "public, max-age=86400"})
              if not self.head_only:
                  self.wfile.write(body)

          def serve_index(self):
              p = BASE / "index.html"
              m = p.stat().st_mtime_ns
              if _INDEX["m"] != m:
                  raw = p.read_bytes()
                  _INDEX.update(m=m, raw=raw, gz=gzip.compress(raw, 6), etag='"%x"' % m)
              extra = {"Cache-Control": "no-cache", "ETag": _INDEX["etag"], "Vary": "Accept-Encoding"}
              if self.headers.get("If-None-Match") == _INDEX["etag"]:
                  return self._headers(304, "text/html; charset=utf-8", 0, extra)
              body = _INDEX["raw"]
              if "gzip" in (self.headers.get("Accept-Encoding") or ""):
                  body = _INDEX["gz"]
                  extra["Content-Encoding"] = "gzip"
              self._headers(200, "text/html; charset=utf-8", len(body), extra)
              if not self.head_only:
                  self.wfile.write(body)

          # ---- auth endpoints
          def api_me(self, method, name, q):
              u = self.current_user()
              with db() as c:
                  n = c.execute("SELECT COUNT(*) n FROM users").fetchone()["n"]
                  if not u:
                      return self.send_json({"user": None, "setup_needed": n == 0, "event": current_event()})
                  info = self.storage_info(c, u)
                  unread = self.unread_count(c, u["id"])
                  cp = cctv_perms(c, u)
                  pending = 0
                  if u["is_owner"]:
                      pending = (c.execute("SELECT COUNT(*) n FROM user_requests WHERE status='pending'").fetchone()["n"]
                                 + c.execute("SELECT COUNT(*) n FROM quota_requests WHERE status='pending'").fetchone()["n"])
                  elif u["is_admin"]:
                      pending = (c.execute("SELECT COUNT(*) n FROM user_requests WHERE status='pending' AND requested_by=?", (u["id"],)).fetchone()["n"]
                                 + c.execute("SELECT COUNT(*) n FROM quota_requests WHERE status='pending' AND requested_by=?", (u["id"],)).fetchone()["n"])
              self.send_json({"user": {"id": u["id"], "username": u["username"], "is_admin": bool(u["is_admin"]), "is_owner": bool(u["is_owner"]), "face": bool(u["face"])},
                              "used": info["used"], "quota": info["quota"], "storage": info, "unread": unread, "trash_days": trash_days(),
                              "pending": pending, "limits": {"max_upload_mb": RUNTIME["max_upload_mb"], "allow_share": RUNTIME["allow_share"], "default_quota_gb": RUNTIME["default_quota"] if u["is_admin"] else None},
                              "notice": {"text": RUNTIME["announcement"], "maintenance": RUNTIME["maintenance"]}, "event": current_event(), "design_ver": RUNTIME["design_ver"],
                              "cctv": perms_public(cp) if cp["any"] else None})

          def api_setup(self, method, name, q):
              d = self.read_json()
              with db() as c:
                  if c.execute("SELECT COUNT(*) n FROM users").fetchone()["n"]:
                      raise ApiError(403, "Setup sudah dilakukan")
                  un, pw = (d.get("username") or "").strip(), d.get("password") or ""
                  if not re.fullmatch(r"[A-Za-z0-9_.-]{3,32}", un):
                      raise ApiError(400, "Username 3-32 karakter (huruf, angka, _ . -)")
                  if len(pw) < 8:
                      raise ApiError(400, "Password minimal 8 karakter")
                  make_user(c, un, pw, True, True)
                  uid = c.execute("SELECT id FROM users WHERE username=?", (un,)).fetchone()["id"]
              self.send_json({"ok": True}, extra=self.start_session(uid))

          def api_login(self, method, name, q):
              ip = self.client_address[0]
              if too_many_fails(ip):
                  raise ApiError(429, "Terlalu banyak percobaan, coba lagi 5 menit lagi")
              d = self.read_json()
              with db() as c:
                  r = c.execute("SELECT * FROM users WHERE username=?", ((d.get("username") or "").strip(),)).fetchone()
              ok = bool(r) and hmac.compare_digest(hash_pw(d.get("password") or "", r["salt"]), r["pw_hash"])
              if not ok:
                  FAILS.setdefault(ip, []).append(time.time())
                  if r:
                      with db() as c:
                          log(c, r["id"], "login_fail", ip)
                  raise ApiError(401, "Username atau password salah")
              if r["disabled"]:
                  raise ApiError(403, "Akun ini dinonaktifkan oleh owner")
              if r["face"]:
                  now = time.time()
                  for k in [k for k, v in FACE_TICKETS.items() if v["exp"] < now]:
                      FACE_TICKETS.pop(k, None)
                  tk = secrets.token_urlsafe(24)
                  FACE_TICKETS[tk] = {"uid": r["id"], "exp": now + 300, "tries": 0}
                  return self.send_json({"need_face": True, "ticket": tk, "username": r["username"],
                                         "recovery": bool(r["face_codes"])})
              with db() as c:
                  log(c, r["id"], "login", ip)
              self.send_json({"ok": True}, extra=self.start_session(r["id"]))

          def api_face(self, method, name, q):
              """Verifikasi wajah sebagai langkah kedua login. Deskriptor 128-dimensi dihitung di browser."""
              sub = name.split("/")[1] if "/" in name else "status"
              ip = self.client_address[0]
              if sub == "verify":
                  if too_many_fails(ip):
                      raise ApiError(429, "Terlalu banyak percobaan, coba lagi 5 menit lagi")
                  d = self.read_json()
                  t = FACE_TICKETS.get(d.get("ticket") or "")
                  if not t or t["exp"] < time.time():
                      raise ApiError(401, "Sesi verifikasi habis. Masuk ulang dengan password.", "face_expired")
                  with db() as c:
                      r = c.execute("SELECT * FROM users WHERE id=?", (t["uid"],)).fetchone()
                      if not r or r["disabled"] or not r["face"]:
                          FACE_TICKETS.pop(d.get("ticket"), None)
                          raise ApiError(401, "Verifikasi tidak tersedia. Masuk ulang.", "face_expired")
                      ok, how = False, "wajah"
                      if d.get("code"):
                          nc = face_take_code(r["face_codes"], d.get("code"))
                          if nc is not None:
                              c.execute("UPDATE users SET face_codes=? WHERE id=?", (nc, r["id"]))
                              ok, how = True, "kode pemulihan"
                      else:
                          probe = d.get("descriptor")
                          if not face_valid(probe):
                              raise ApiError(400, "Data wajah tidak valid")
                          try:
                              ok = face_match(json.loads(r["face"]), probe)
                          except ValueError:
                              ok = False
                      if not ok:
                          t["tries"] += 1
                          FAILS.setdefault(ip, []).append(time.time())
                          log(c, r["id"], "face_fail", ip)
                          if t["tries"] >= 5:
                              FACE_TICKETS.pop(d.get("ticket"), None)
                              raise ApiError(401, "Terlalu banyak gagal. Masuk ulang dengan password.", "face_expired")
                          raise ApiError(401, "Kode pemulihan salah" if d.get("code") else "Wajah tidak cocok, coba lagi", "face_no")
                      FACE_TICKETS.pop(d.get("ticket"), None)
                      log(c, r["id"], "login", ip + " (" + how + ")")
                  return self.send_json({"ok": True}, extra=self.start_session(r["id"]))
              u = self.need_user()
              if sub == "status":
                  n = 0
                  try:
                      n = len(json.loads(u["face_codes"] or "{}").get("h", []))
                  except ValueError:
                      pass
                  return self.send_json({"enabled": bool(u["face"]), "since": u["face_at"], "codes": n})
              if method != "POST":
                  raise ApiError(405, "Metode tidak didukung")
              d = self.read_json()
              if not hmac.compare_digest(hash_pw(d.get("password") or "", u["salt"]), u["pw_hash"]):
                  FAILS.setdefault(ip, []).append(time.time())
                  raise ApiError(403, "Password salah")
              if too_many_fails(ip):
                  raise ApiError(429, "Terlalu banyak percobaan, coba lagi 5 menit lagi")
              with db() as c:
                  if sub == "enroll":
                      smp = d.get("samples")
                      if not isinstance(smp, list) or not 2 <= len(smp) <= 6 or not all(face_valid(x) for x in smp):
                          raise ApiError(400, "Data wajah tidak valid")
                      if max(face_dist(a, b) for a in smp for b in smp) > FACE_THRESHOLD:
                          raise ApiError(400, "Hasil pindai tidak konsisten. Ulangi dengan cahaya cukup dan wajah menghadap depan.")
                      plain, codes = face_new_codes()
                      c.execute("UPDATE users SET face=?, face_codes=?, face_at=? WHERE id=?",
                                (json.dumps([[round(x, 5) for x in v] for v in smp]), codes, time.time(), u["id"]))
                      log(c, u["id"], "face_on", ip)
                      return self.send_json({"ok": True, "codes": plain})
                  if sub == "disable":
                      c.execute("UPDATE users SET face=NULL, face_codes=NULL, face_at=NULL WHERE id=?", (u["id"],))
                      log(c, u["id"], "face_off", ip)
                      return self.send_json({"ok": True})
                  if sub == "codes":
                      if not u["face"]:
                          raise ApiError(400, "Verifikasi wajah belum aktif")
                      plain, codes = face_new_codes()
                      c.execute("UPDATE users SET face_codes=? WHERE id=?", (codes, u["id"]))
                      log(c, u["id"], "face_codes", ip)
                      return self.send_json({"ok": True, "codes": plain})
              raise ApiError(404, "Tidak ditemukan")

          def api_logout(self, method, name, q):
              try:
                  self.read_json()  # kuras body agar koneksi keep-alive tidak rusak untuk permintaan berikutnya
              except ApiError:
                  pass
              t = self.cookie("sid")
              u = self.current_user()
              with db() as c:
                  if u and q.get("all", [""])[0] == "1":
                      c.execute("DELETE FROM sessions WHERE user_id=?", (u["id"],))
                      EVENTS.emit("session", u["id"])  # perangkat lain langsung keluar
                  elif t:
                      c.execute("DELETE FROM sessions WHERE token_hash=?", (tok_hash(t),))
              self.send_json({"ok": True}, extra={"Set-Cookie": "sid=; Path=/; Max-Age=0"})

          def api_requests(self, method, name, q):
              """Permintaan tambah pengguna: admin mengajukan, owner menyetujui/menolak."""
              u = self.need_user()
              if not u["is_admin"]:
                  raise ApiError(403, "Hanya owner atau admin")
              sub = name.split("/")[1] if "/" in name else ""
              with db() as c:
                  if method == "GET":
                      cols = ("SELECT r.id,r.username,r.status,r.created,r.decided,a.username AS requester "
                              "FROM user_requests r JOIN users a ON a.id=r.requested_by ")
                      if u["is_owner"]:
                          rows = c.execute(cols + "ORDER BY (r.status='pending') DESC, r.created DESC LIMIT 50").fetchall()
                          pending = c.execute("SELECT COUNT(*) n FROM user_requests WHERE status='pending'").fetchone()["n"]
                      else:
                          rows = c.execute(cols + "WHERE r.requested_by=? ORDER BY (r.status='pending') DESC, r.created DESC LIMIT 20", (u["id"],)).fetchall()
                          pending = c.execute("SELECT COUNT(*) n FROM user_requests WHERE status='pending' AND requested_by=?", (u["id"],)).fetchone()["n"]
                      return self.send_json({"requests": [dict(r) for r in rows], "pending": pending, "owner": bool(u["is_owner"])})
                  d = self.read_json()
                  if sub == "":
                      if u["is_owner"]:
                          raise ApiError(400, "Owner bisa menambah pengguna langsung")
                      un, pw = (d.get("username") or "").strip(), d.get("password") or ""
                      if not re.fullmatch(r"[A-Za-z0-9_.-]{3,32}", un):
                          raise ApiError(400, "Username 3-32 karakter (huruf, angka, _ . -)")
                      if len(pw) < 8:
                          raise ApiError(400, "Password minimal 8 karakter")
                      if c.execute("SELECT 1 FROM users WHERE username=?", (un,)).fetchone():
                          raise ApiError(409, "Username sudah dipakai")
                      if c.execute("SELECT 1 FROM user_requests WHERE username=? AND status='pending'", (un,)).fetchone():
                          raise ApiError(409, "Permintaan untuk username ini sudah menunggu persetujuan")
                      salt = secrets.token_hex(16)
                      rid_new = c.execute("INSERT INTO user_requests(requested_by,username,pw_hash,salt,created) VALUES(?,?,?,?,?)",
                                          (u["id"], un, hash_pw(pw, salt), salt, time.time())).lastrowid
                      log(c, u["id"], "request", un)
                      notify_owners(c, "user_request", "Permintaan pengguna baru", f"Admin {u['username']} mengajukan pengguna “{un}”.", rid_new)
                      EVENTS.emit("users")
                      return self.send_json({"ok": True})
                  try:
                      rid = int(d.get("id") or 0)
                  except (TypeError, ValueError):
                      raise ApiError(400, "ID tidak valid")
                  r = c.execute("SELECT * FROM user_requests WHERE id=? AND status='pending'", (rid,)).fetchone()
                  if not r:
                      raise ApiError(404, "Permintaan tidak ditemukan atau sudah diproses")
                  if sub == "cancel":
                      if r["requested_by"] != u["id"]:
                          raise ApiError(403, "Bukan permintaan Anda")
                      c.execute("DELETE FROM user_requests WHERE id=?", (rid,))
                      EVENTS.emit("users")
                  elif sub in ("approve", "reject"):
                      if not u["is_owner"]:
                          raise ApiError(403, "Hanya owner yang bisa menyetujui")
                      status = "rejected"
                      if sub == "approve":
                          if c.execute("SELECT 1 FROM users WHERE username=?", (r["username"],)).fetchone():
                              c.execute("UPDATE user_requests SET status='rejected', decided=? WHERE id=?", (time.time(), rid))
                              c.commit()
                              raise ApiError(409, "Username sudah dipakai, permintaan ditolak otomatis")
                          c.execute("INSERT INTO users(username,pw_hash,salt,is_admin,created,is_owner,quota_gb) VALUES(?,?,?,0,?,0,?)",
                                    (r["username"], r["pw_hash"], r["salt"], time.time(), with_default_quota(parse_gb(d.get("quota_gb")))))
                          status = "approved"
                      c.execute("UPDATE user_requests SET status=?, decided=? WHERE id=?", (status, time.time(), rid))
                      log(c, u["id"], "approve" if status == "approved" else "reject", r["username"])
                      notify(c, r["requested_by"], "request_result", "Permintaan pengguna " + ("disetujui" if status == "approved" else "ditolak"),
                             f"Pengguna “{r['username']}” " + ("sudah dibuat. Kuotanya diatur owner, atau ajukan kuota untuknya." if status == "approved" else "ditolak owner."), rid)
                      EVENTS.emit("users")
                  else:
                      raise ApiError(404, "Endpoint tidak ada")
              self.send_json({"ok": True})

          def api_sessions(self, method, name, q):
              u = self.need_user()
              cur = tok_hash(self.cookie("sid") or "")
              with db() as c:
                  if method == "GET":
                      rows = c.execute(
                          "SELECT token_hash,ua,ip,created,last_seen FROM sessions WHERE user_id=? AND expires>? "
                          "ORDER BY COALESCE(last_seen,created,0) DESC", (u["id"], time.time())).fetchall()
                      return self.send_json({"sessions": [
                          {"id": r["token_hash"][:16], "ua": r["ua"] or "", "ip": r["ip"] or "",
                           "created": r["created"], "last_seen": r["last_seen"], "current": r["token_hash"] == cur}
                          for r in rows]})
                  d = self.read_json()
                  if name.endswith("/revoke"):
                      sid = str(d.get("id") or "")
                      if not re.fullmatch(r"[0-9a-f]{8,64}", sid):
                          raise ApiError(400, "ID perangkat tidak valid")
                      c.execute("DELETE FROM sessions WHERE user_id=? AND token_hash LIKE ? AND token_hash!=?", (u["id"], sid + "%", cur))
                  elif name.endswith("/revoke-others"):
                      c.execute("DELETE FROM sessions WHERE user_id=? AND token_hash!=?", (u["id"], cur))
                  else:
                      raise ApiError(404, "Endpoint tidak ada")
                  log(c, u["id"], "revoke", "Perangkat dikeluarkan")
                  EVENTS.emit("session", u["id"])  # perangkat yang dicabut langsung keluar
              self.send_json({"ok": True})

          def api_password(self, method, name, q):
              u = self.need_user()
              d = self.read_json()
              if not hmac.compare_digest(hash_pw(d.get("old") or "", u["salt"]), u["pw_hash"]):
                  raise ApiError(403, "Password lama salah")
              new = d.get("new") or ""
              if len(new) < 8:
                  raise ApiError(400, "Password baru minimal 8 karakter")
              salt = secrets.token_hex(16)
              with db() as c:
                  c.execute("UPDATE users SET pw_hash=?, salt=? WHERE id=?", (hash_pw(new, salt), salt, u["id"]))
              self.send_json({"ok": True})

          def api_users(self, method, name, q):
              u = self.need_user()
              if not u["is_admin"]:
                  raise ApiError(403, "Hanya admin")
              parts = name.split("/")
              with db() as c:
                  if method == "GET":
                      rows = c.execute(
                          "SELECT u.id,u.username,u.is_admin,u.is_owner,u.quota_gb,u.created,COALESCE(u.disabled,0) disabled, (u.face IS NOT NULL) face, "
                              "(SELECT MAX(last_seen) FROM sessions s WHERE s.user_id=u.id) last_seen,COALESCE(SUM(i.size),0) used, "
                              "(SELECT requested_gb FROM quota_requests q WHERE q.user_id=u.id AND q.status='pending' LIMIT 1) pending_gb FROM users u "
                          "LEFT JOIN items i ON i.user_id=u.id AND i.is_folder=0 GROUP BY u.id ORDER BY u.id").fetchall()
                      return self.send_json({"users": [dict(r) for r in rows]})
                  if not u["is_owner"]:
                      raise ApiError(403, "Hanya owner yang bisa mengelola pengguna. Admin bisa mengajukan permintaan tambah pengguna.")
                  d = self.read_json()
                  if len(parts) == 1:
                      un, pw = (d.get("username") or "").strip(), d.get("password") or ""
                      if not re.fullmatch(r"[A-Za-z0-9_.-]{3,32}", un):
                          raise ApiError(400, "Username 3-32 karakter (huruf, angka, _ . -)")
                      if len(pw) < 8:
                          raise ApiError(400, "Password minimal 8 karakter")
                      try:
                          make_user(c, un, pw, bool(d.get("is_admin")), quota_gb=with_default_quota(parse_gb(d.get("quota_gb"))))
                      except sqlite3.IntegrityError:
                          raise ApiError(409, "Username sudah dipakai")
                      c.commit()
                      EVENTS.emit("users")
                      return self.send_json({"ok": True})
                  if parts[1] == "delete":
                      uid = int(d.get("id", 0))
                      if uid == u["id"]:
                          raise ApiError(400, "Tidak bisa menghapus akun sendiri")
                      for r in c.execute("SELECT id FROM items WHERE user_id=? AND is_folder=0", (uid,)).fetchall():
                          (BLOBS / r["id"]).unlink(missing_ok=True)
                      c.execute("DELETE FROM shares WHERE item_id IN (SELECT id FROM items WHERE user_id=?)", (uid,))
                      c.execute("DELETE FROM items WHERE user_id=?", (uid,))
                      c.execute("DELETE FROM sessions WHERE user_id=?", (uid,))
                      c.execute("DELETE FROM activity WHERE user_id=?", (uid,))
                      c.execute("DELETE FROM user_requests WHERE requested_by=?", (uid,))
                      c.execute("DELETE FROM notifications WHERE user_id=?", (uid,))
                      c.execute("DELETE FROM quota_requests WHERE user_id=? OR requested_by=?", (uid, uid))
                      c.execute("DELETE FROM users WHERE id=?", (uid,))
                      c.commit()
                      EVENTS.emit("session", uid)
                      EVENTS.emit("users")
                      return self.send_json({"ok": True})
                  if parts[1] in ("disable", "logout"):
                      uid = int(d.get("id", 0))
                      tgt = c.execute("SELECT username,is_owner FROM users WHERE id=?", (uid,)).fetchone()
                      if not tgt:
                          raise ApiError(404, "Pengguna tidak ada")
                      if uid == u["id"] or tgt["is_owner"]:
                          raise ApiError(400, "Tidak berlaku untuk akun owner")
                      if parts[1] == "disable":
                          val = int(bool(d.get("disabled")))
                          c.execute("UPDATE users SET disabled=? WHERE id=?", (val, uid))
                          if val:
                              c.execute("DELETE FROM sessions WHERE user_id=?", (uid,))
                          log(c, u["id"], "disable", f"{tgt['username']}: {'dinonaktifkan' if val else 'diaktifkan'}")
                      else:
                          c.execute("DELETE FROM sessions WHERE user_id=?", (uid,))
                          log(c, u["id"], "revoke", f"Semua sesi {tgt['username']} dikeluarkan")
                      c.commit()
                      EVENTS.emit("session", uid)
                      EVENTS.emit("users")
                      return self.send_json({"ok": True})
                  if parts[1] in ("reset", "quota", "role"):
                      uid = int(d.get("id", 0))
                      if not c.execute("SELECT 1 FROM users WHERE id=?", (uid,)).fetchone():
                          raise ApiError(404, "Pengguna tidak ada")
                      if parts[1] == "reset":
                          pw = d.get("password") or ""
                          if len(pw) < 8:
                              raise ApiError(400, "Password minimal 8 karakter")
                          salt = secrets.token_hex(16)
                          c.execute("UPDATE users SET pw_hash=?, salt=? WHERE id=?", (hash_pw(pw, salt), salt, uid))
                          c.execute("DELETE FROM sessions WHERE user_id=?", (uid,))
                          EVENTS.emit("session", uid)
                      elif parts[1] == "quota":
                          val = parse_gb(d.get("quota_gb"))
                          c.execute("UPDATE users SET quota_gb=? WHERE id=?", (val, uid))
                          tgt = c.execute("SELECT username,is_owner FROM users WHERE id=?", (uid,)).fetchone()
                          if not tgt["is_owner"]:
                              if val is None:
                                  notify(c, uid, "quota_set", "Kuota dicabut", "Owner mencabut kuota Anda. Anda tidak bisa mengunggah sampai kuota diatur lagi.")
                              else:
                                  notify(c, uid, "quota_set", "Kuota diatur", f"Kuota Anda sekarang {fmt_gb(val)}. Anda sudah bisa mengunggah file.")
                              sync_warn(c, uid)
                              EVENTS.emit("files", uid)
                          log(c, u["id"], "quota", f"{tgt['username']}: {'dicabut' if val is None else fmt_gb(val)}")
                      else:
                          if uid == u["id"]:
                              raise ApiError(400, "Tidak bisa mengubah peran akun sendiri")
                          c.execute("UPDATE users SET is_admin=? WHERE id=?", (int(bool(d.get("is_admin"))), uid))
                          EVENTS.emit("users")
                          if not d.get("is_admin"):
                              c.execute("DELETE FROM user_requests WHERE requested_by=? AND status='pending'", (uid,))
                      c.commit()
                      return self.send_json({"ok": True})
              raise ApiError(404, "Endpoint tidak ada")

      # ---- pembaruan langsung (Server-Sent Events)
          def api_events(self, method, name, q):
              u = self.need_user()
              uid, cid = u["id"], (q.get("cid", [""])[0])[:40]
              self.close_connection = True
              self.send_response(200)
              for k, v in (("Content-Type", "text/event-stream; charset=utf-8"), ("Cache-Control", "no-cache, no-transform"),
                           ("Connection", "close"), ("X-Accel-Buffering", "no"), ("X-Content-Type-Options", "nosniff")):
                  self.send_header(k, v)
              self.end_headers()
              seq = EVENTS.seq
              last_w = last_chk = time.time()
              try:
                  self.wfile.write(b"retry: 2000\nevent: hello\ndata: {}\n\n")
                  while True:
                      EVENTS.wait(seq, 15)
                      seq, topics = EVENTS.since(seq, uid, cid)
                      now = time.time()
                      if topics:
                          self.wfile.write("".join(f"event: {t}\ndata: {{}}\n\n" for t in sorted(topics)).encode())
                          last_w = now
                      elif now - last_w >= 14:
                          self.wfile.write(b": ping\n\n")
                          last_w = now
                      if "session" in topics or now - last_chk >= 20:
                          last_chk = now
                          if not self.current_user():  # sesi dicabut / akun dinonaktifkan / dihapus
                              self.wfile.write(b"event: logout\ndata: {}\n\n")
                              break
              except OSError:
                  pass

          # ---- dinding ikrar (fitur Sumpah Pemuda)
          def api_wall(self, method, name, q):
              u = self.need_user()
              sub = name.split("/")[1] if "/" in name else ""
              ev = current_event()
              key = ev["key"] if ev else "sumpah"
              with db() as c:
                  if method == "GET":
                      rows = c.execute("SELECT w.id,w.user_id,w.text,w.ts,us.username FROM wall w JOIN users us ON us.id=w.user_id "
                                       "WHERE w.event=? ORDER BY w.ts DESC LIMIT 200", (key,)).fetchall()
                      return self.send_json({"items": [{"id": r["id"], "text": r["text"], "ts": r["ts"], "username": r["username"],
                                                        "mine": r["user_id"] == u["id"]} for r in rows], "owner": bool(u["is_owner"])})
                  d = self.read_json()
                  if sub == "delete":
                      try:
                          wid = int(d.get("id"))
                      except (TypeError, ValueError):
                          raise ApiError(400, "ID tidak valid")
                      row = c.execute("SELECT user_id FROM wall WHERE id=?", (wid,)).fetchone()
                      if not row:
                          raise ApiError(404, "Ikrar tidak ditemukan")
                      if row["user_id"] != u["id"] and not u["is_owner"]:
                          raise ApiError(403, "Tidak boleh menghapus ikrar orang lain")
                      c.execute("DELETE FROM wall WHERE id=?", (wid,))
                  elif sub == "":
                      text = " ".join(str(d.get("text") or "").split())
                      if len(text) < 3:
                          raise ApiError(400, "Ikrar minimal 3 huruf")
                      if len(text) > 140:
                          raise ApiError(400, "Ikrar maksimal 140 huruf")
                      c.execute("DELETE FROM wall WHERE user_id=? AND event=?", (u["id"], key))
                      c.execute("INSERT INTO wall(event,user_id,text,ts) VALUES(?,?,?,?)", (key, u["id"], text, time.time()))
                      log(c, u["id"], "wall", text[:60])
                  else:
                      raise ApiError(404, "Endpoint tidak ada")
              EVENTS.emit("wall")
              self.send_json({"ok": True})

          # ---- notifikasi
          def api_notifications(self, method, name, q):
              u = self.need_user()
              sub = name.split("/")[1] if "/" in name else ""
              with db() as c:
                  if method == "GET":
                      rows = c.execute("SELECT id,kind,title,body,ref,created,is_read FROM notifications WHERE user_id=? "
                                       "ORDER BY id DESC LIMIT 60", (u["id"],)).fetchall()
                      return self.send_json({"items": [dict(r, is_read=bool(r["is_read"])) for r in rows],
                                             "unread": self.unread_count(c, u["id"])})
                  d = self.read_json()
                  if sub == "read":
                      ids = [int(i) for i in (d.get("ids") or []) if str(i).isdigit()]
                      if d.get("all") or not ids:
                          c.execute("UPDATE notifications SET is_read=1 WHERE user_id=?", (u["id"],))
                      else:
                          c.execute("UPDATE notifications SET is_read=1 WHERE user_id=? AND id IN (%s)" % ",".join("?" * len(ids)),
                                    [u["id"]] + ids)
                  elif sub == "clear":
                      c.execute("DELETE FROM notifications WHERE user_id=? AND is_read=1", (u["id"],))
                  else:
                      raise ApiError(404, "Endpoint tidak ada")
                  unread = self.unread_count(c, u["id"])
              EVENTS.emit("notify", u["id"], self.cid)  # sinkronkan perangkat lain milik akun yang sama
              self.send_json({"ok": True, "unread": unread})

          # ---- permintaan kuota: pengguna/admin mengajukan, owner menyetujui
          def api_quota_requests(self, method, name, q):
              u = self.need_user()
              sub = name.split("/")[1] if "/" in name else ""
              with db() as c:
                  if method == "GET":
                      base = ("SELECT r.id,r.user_id,r.requested_by,r.requested_gb,r.granted_gb,r.note,r.status,r.created,r.decided,"
                              "t.username AS target,a.username AS requester FROM quota_requests r "
                              "JOIN users t ON t.id=r.user_id JOIN users a ON a.id=r.requested_by ")
                      if u["is_owner"]:
                          rows = c.execute(base + "ORDER BY (r.status='pending') DESC, r.created DESC LIMIT 50").fetchall()
                      else:
                          rows = c.execute(base + "WHERE r.requested_by=? OR r.user_id=? ORDER BY (r.status='pending') DESC, r.created DESC LIMIT 20",
                                           (u["id"], u["id"])).fetchall()
                      return self.send_json({"requests": [dict(r) for r in rows]})
                  d = self.read_json()
                  if sub == "":
                      if u["is_owner"]:
                          raise ApiError(400, "Owner bisa mengatur kuota langsung lewat Kelola pengguna")
                      tid = u["id"]
                      if d.get("user_id") not in (None, "", u["id"]):
                          if not u["is_admin"]:
                              raise ApiError(403, "Hanya admin yang bisa mengajukan kuota untuk pengguna lain")
                          try:
                              tid = int(d.get("user_id"))
                          except (TypeError, ValueError):
                              raise ApiError(400, "Pengguna tidak valid")
                      t = c.execute("SELECT id,username,is_owner FROM users WHERE id=?", (tid,)).fetchone()
                      if not t:
                          raise ApiError(404, "Pengguna tidak ditemukan")
                      if t["is_owner"]:
                          raise ApiError(400, "Owner tidak memerlukan kuota")
                      gb = parse_gb(d.get("quota_gb"))
                      if not gb:
                          raise ApiError(400, "Masukkan jumlah kuota (GB) lebih dari 0")
                      note = (d.get("note") or "").strip()[:200]
                      if c.execute("SELECT 1 FROM quota_requests WHERE user_id=? AND status='pending'", (tid,)).fetchone():
                          raise ApiError(409, "Sudah ada permintaan kuota untuk pengguna ini yang menunggu persetujuan owner")
                      rid = c.execute("INSERT INTO quota_requests(user_id,requested_by,requested_gb,note,created) VALUES(?,?,?,?,?)",
                                      (tid, u["id"], gb, note, time.time())).lastrowid
                      who = ("Admin " if u["is_admin"] else "") + u["username"]
                      body = f"{who} meminta kuota {fmt_gb(gb)}" + (f" untuk {t['username']}" if tid != u["id"] else "") + (f" — “{note}”" if note else "")
                      notify_owners(c, "quota_request", "Permintaan kuota baru", body, rid)
                      log(c, u["id"], "quota_request", f"{t['username']} {fmt_gb(gb)}")
                      EVENTS.emit("users")
                      return self.send_json({"ok": True, "id": rid})
                  try:
                      rid = int(d.get("id") or 0)
                  except (TypeError, ValueError):
                      raise ApiError(400, "ID tidak valid")
                  r = c.execute("SELECT * FROM quota_requests WHERE id=? AND status='pending'", (rid,)).fetchone()
                  if not r:
                      raise ApiError(404, "Permintaan tidak ditemukan atau sudah diproses")
                  if sub == "cancel":
                      if r["requested_by"] != u["id"]:
                          raise ApiError(403, "Bukan permintaan Anda")
                      c.execute("DELETE FROM quota_requests WHERE id=?", (rid,))
                  elif sub in ("approve", "reject"):
                      if not u["is_owner"]:
                          raise ApiError(403, "Hanya owner yang bisa memutuskan permintaan kuota")
                      t = c.execute("SELECT username FROM users WHERE id=?", (r["user_id"],)).fetchone()
                      if not t:
                          c.execute("DELETE FROM quota_requests WHERE id=?", (rid,))
                          c.commit()
                          raise ApiError(404, "Pengguna sudah tidak ada")
                      same = r["user_id"] == r["requested_by"]
                      if sub == "approve":
                          granted = parse_gb(d.get("quota_gb"))
                          if granted is None:
                              granted = r["requested_gb"]
                          c.execute("UPDATE users SET quota_gb=? WHERE id=?", (granted, r["user_id"]))
                          c.execute("UPDATE quota_requests SET status='approved', decided=?, granted_gb=? WHERE id=?", (time.time(), granted, rid))
                          msg = f"Kuota {'Anda' if same else t['username']} sekarang {fmt_gb(granted)}."
                          notify(c, r["requested_by"], "request_result", "Permintaan kuota disetujui",
                                 msg + (" Anda sudah bisa mengunggah file." if same else ""), rid)
                          if not same:
                              notify(c, r["user_id"], "quota_set", "Kuota diatur", f"Kuota Anda sekarang {fmt_gb(granted)}. Anda sudah bisa mengunggah file.", rid)
                          sync_warn(c, r["user_id"])
                          EVENTS.emit("files", r["user_id"])
                          log(c, u["id"], "approve", f"kuota {t['username']} {fmt_gb(granted)}")
                      else:
                          c.execute("UPDATE quota_requests SET status='rejected', decided=? WHERE id=?", (time.time(), rid))
                          why = (d.get("reason") or "").strip()[:150]
                          notify(c, r["requested_by"], "request_result", "Permintaan kuota ditolak",
                                 f"Permintaan kuota {fmt_gb(r['requested_gb'])} untuk {t['username']} ditolak owner." + (f" Alasan: {why}" if why else ""), rid)
                          log(c, u["id"], "reject", f"kuota {t['username']}")
                  else:
                      raise ApiError(404, "Endpoint tidak ada")
                  EVENTS.emit("users")
              self.send_json({"ok": True})

          # ---- item helpers
          def own_item(self, c, uid, iid):
              r = c.execute("SELECT * FROM items WHERE id=? AND user_id=?", (iid, uid)).fetchone()
              if not r:
                  raise ApiError(404, "Item tidak ditemukan")
              return r

          def check_parent(self, c, uid, parent):
              if parent in (None, "", "root"):
                  return None
              r = self.own_item(c, uid, parent)
              if not r["is_folder"] or r["trashed"]:
                  raise ApiError(400, "Folder tujuan tidak valid")
              return parent

          # ---- listing & stats
          def api_list(self, method, name, q):
              u = self.need_user()
              view = q.get("view", ["files"])[0]
              parent = q.get("parent", [""])[0] or None
              term = q.get("q", [""])[0].strip()
              only_folders = q.get("folders", [""])[0] == "1"
              crumbs = []
              with db() as c:
                  uid = u["id"]
                  order = "ORDER BY is_folder DESC, name COLLATE NOCASE"
                  if term:
                      like = "%" + term.replace("\\", "\\\\").replace("%", "\\%").replace("_", "\\_") + "%"
                      rows = c.execute(f"SELECT * FROM items WHERE user_id=? AND trashed=0 AND (name LIKE ? ESCAPE '\\' OR (? AND id IN "
                                       f"(SELECT item_id FROM ai_files WHERE ok=1 AND tags LIKE ? ESCAPE '\\'))) {order} LIMIT 500",
                                       (uid, like, int(len(term) >= 3), like)).fetchall()
                  elif view in CATEGORIES:
                      where, params = category_where(view)
                      rows = c.execute(f"SELECT * FROM items WHERE user_id=? AND trashed=0 AND is_folder=0 AND {where} "
                                       "ORDER BY modified DESC LIMIT 3000", [uid] + params).fetchall()
                  elif view == "shared":
                      rows = c.execute(f"SELECT * FROM items WHERE user_id=? AND trashed=0 AND id IN (SELECT item_id FROM shares) {order}", (uid,)).fetchall()
                  elif view == "large":
                      rows = c.execute("SELECT * FROM items WHERE user_id=? AND trashed=0 AND is_folder=0 AND size>0 "
                                       "ORDER BY size DESC LIMIT 100", (uid,)).fetchall()
                  elif view == "starred":
                      rows = c.execute(f"SELECT * FROM items WHERE user_id=? AND trashed=0 AND starred=1 {order}", (uid,)).fetchall()
                  elif view == "recent":
                      rows = c.execute("SELECT * FROM items WHERE user_id=? AND trashed=0 AND is_folder=0 "
                                       "ORDER BY modified DESC LIMIT 60", (uid,)).fetchall()
                  elif view == "trash":
                      rows = c.execute(
                          f"SELECT * FROM items WHERE user_id=? AND trashed=1 AND (parent_id IS NULL OR parent_id NOT IN "
                          f"(SELECT id FROM items WHERE trashed=1 AND user_id=?)) {order}", (uid, uid)).fetchall()
                  else:
                      if parent:
                          cur = self.own_item(c, uid, parent)
                          while cur:
                              crumbs.insert(0, {"id": cur["id"], "name": cur["name"]})
                              cur = c.execute("SELECT * FROM items WHERE id=?", (cur["parent_id"],)).fetchone() if cur["parent_id"] else None
                      extra = " AND is_folder=1" if only_folders else ""
                      rows = c.execute(f"SELECT * FROM items WHERE user_id=? AND trashed=0 AND parent_id IS ?{extra} {order}",
                                       (uid, parent)).fetchall()
                  shared = {r["item_id"] for r in c.execute(
                      "SELECT item_id FROM shares WHERE item_id IN (SELECT id FROM items WHERE user_id=?)", (uid,)).fetchall()}
                  info = self.storage_info(c, u)
              self.send_json({"items": [item_dict(r, shared) for r in rows], "crumbs": crumbs, "used": info["used"], "quota": info["quota"], "storage": info})

          def api_stats(self, method, name, q):
              u = self.need_user()
              cats = {k: {"size": 0, "count": 0} for k in ("photos", "videos", "audio", "documents", "other")}
              trash, all_used = 0, None
              with db() as c:
                  for r in c.execute("SELECT name,mime,size,trashed FROM items WHERE user_id=? AND is_folder=0", (u["id"],)).fetchall():
                      if r["trashed"]:
                          trash += r["size"]
                      else:
                          k = cats[classify(r["name"], r["mime"])]
                          k["size"] += r["size"]
                          k["count"] += 1
                  folders = c.execute("SELECT COUNT(*) n FROM items WHERE user_id=? AND is_folder=1 AND trashed=0", (u["id"],)).fetchone()["n"]
                  info = self.storage_info(c, u)
                  if u["is_admin"]:
                      all_used = c.execute("SELECT COALESCE(SUM(size),0) s FROM items WHERE is_folder=0").fetchone()["s"]
              try:
                  du = shutil.disk_usage(DATA)
                  disk = {"total": du.total, "free": du.free, "used": du.used}
              except OSError:
                  disk = {"total": 0, "free": 0, "used": 0}
              self.send_json({"categories": cats, "trash": trash, "folders": folders, "quota": info["quota"], "available": info["available"],
                              "storage": info, "disk": disk if u["is_admin"] else None, "all_used": all_used})

          # ---- mutations
          def api_folder(self, method, name, q):
              u = self.need_user()
              d = self.read_json()
              now = time.time()
              with db() as c:
                  parent = self.check_parent(c, u["id"], d.get("parent"))
                  nm = clean_name(d.get("name"))
                  if d.get("reuse"):
                      ex = c.execute("SELECT id FROM items WHERE user_id=? AND parent_id IS ? AND is_folder=1 AND trashed=0 AND name=? COLLATE NOCASE",
                                     (u["id"], parent, nm)).fetchone()
                      if ex:
                          return self.send_json({"id": ex["id"]})
                  else:
                      nm = unique_name(c, u["id"], parent, nm)
                  iid = uuid.uuid4().hex
                  c.execute("INSERT INTO items(id,user_id,parent_id,name,is_folder,created,modified) VALUES(?,?,?,?,1,?,?)",
                            (iid, u["id"], parent, nm, now, now))
                  log(c, u["id"], "folder", nm)
              self.send_json({"id": iid})

          def api_upload(self, method, name, q):
              u = self.need_user()
              fname = clean_name(q.get("name", [""])[0])
              length = self.headers.get("Content-Length")
              if length is None or not length.isdigit():
                  raise ApiError(411, "Content-Length wajib")
              length = int(length)
              mx = RUNTIME["max_upload_mb"]
              if mx and not u["is_owner"] and length > mx * 1048576:
                  raise ApiError(413, f"File melebihi batas {mx} MB per file yang ditetapkan owner.", "too_big")
              with db() as c:
                  parent = self.check_parent(c, u["id"], q.get("parent", [""])[0])
                  self.ensure_space(c, u, length)
              iid = uuid.uuid4().hex
              tmp = TMP / iid
              remaining = length
              try:
                  with open(tmp, "wb") as f:
                      while remaining > 0:
                          chunk = self.rfile.read(min(CHUNK, remaining))
                          if not chunk:
                              raise ApiError(400, "Upload terputus")
                          f.write(chunk)
                          remaining -= len(chunk)
                  os.replace(tmp, BLOBS / iid)
              except BaseException:
                  tmp.unlink(missing_ok=True)
                  raise
              now = time.time()
              with db() as c:
                  nm = unique_name(c, u["id"], parent, fname)
                  c.execute("INSERT INTO items(id,user_id,parent_id,name,is_folder,size,mime,created,modified) VALUES(?,?,?,?,0,?,?,?,?)",
                            (iid, u["id"], parent, nm, length, guess_mime(nm), now, now))
                  log(c, u["id"], "upload", nm)
                  sync_warn(c, u["id"])
              self.send_json({"id": iid, "name": nm})

          def api_versions(self, method, name, q):
              """Riwayat versi file teks: daftar (GET ?id=) dan pulihkan (POST {id, ver})."""
              u = self.need_user()
              with db() as c:
                  if method == "GET":
                      r = self.own_item(c, u["id"], (q.get("id") or [""])[0])
                      rows = c.execute("SELECT id,ts,size FROM file_versions WHERE item_id=? ORDER BY ts DESC", (r["id"],)).fetchall()
                      return self.send_json({"versions": [dict(x) for x in rows], "name": r["name"]})
                  d = self.read_json()
                  r = self.own_item(c, u["id"], d.get("id"))
                  v = c.execute("SELECT * FROM file_versions WHERE id=? AND item_id=?", (_int(d.get("ver"), 0, 0, 1 << 60), r["id"])).fetchone()
                  if not v or not (VERS / v["file"]).exists():
                      raise ApiError(404, "Versi tidak ditemukan")
                  if d.get("text"):
                      return self.send_json({"text": (VERS / v["file"]).read_bytes()[:3_000_000].decode("utf-8", "replace")})
                  data = (VERS / v["file"]).read_bytes()
                  self.ensure_space(c, u, len(data), replace=r["size"])
                  ver_save(c, r)
                  tmp = TMP / uuid.uuid4().hex
                  tmp.write_bytes(data)
                  os.replace(tmp, BLOBS / r["id"])
                  c.execute("UPDATE items SET size=?, modified=? WHERE id=?", (len(data), time.time(), r["id"]))
                  log(c, u["id"], "edit", "Memulihkan versi lama: " + r["name"])
                  sync_warn(c, u["id"])
                  c.commit()
              return self.send_json({"ok": True})

          def api_savetext(self, method, name, q):
              """Buat file teks baru (tanpa id) atau timpa isi file teks (dengan id)."""
              u = self.need_user()
              d = self.read_json(3_000_000)
              content = d.get("content")
              if not isinstance(content, str):
                  raise ApiError(400, "Isi tidak valid")
              data = content.encode("utf-8")
              now = time.time()
              with db() as c:
                  if d.get("id"):
                      r = self.own_item(c, u["id"], d["id"])
                      if r["is_folder"] or r["trashed"]:
                          raise ApiError(400, "Bukan file")
                      self.ensure_space(c, u, len(data), replace=r["size"])
                      ver_save(c, r)
                      tmp = TMP / uuid.uuid4().hex
                      tmp.write_bytes(data)
                      os.replace(tmp, BLOBS / r["id"])
                      c.execute("UPDATE items SET size=?, modified=? WHERE id=?", (len(data), now, r["id"]))
                      log(c, u["id"], "edit", r["name"])
                      sync_warn(c, u["id"])
                      c.commit()
                      return self.send_json({"id": r["id"]})
                  parent = self.check_parent(c, u["id"], d.get("parent"))
                  self.ensure_space(c, u, len(data))
                  nm = unique_name(c, u["id"], parent, clean_name(d.get("name") or "Catatan.txt"))
                  iid = uuid.uuid4().hex
                  (BLOBS / iid).write_bytes(data)
                  c.execute("INSERT INTO items(id,user_id,parent_id,name,is_folder,size,mime,created,modified) VALUES(?,?,?,?,0,?,?,?,?)",
                            (iid, u["id"], parent, nm, len(data), guess_mime(nm), now, now))
                  sync_warn(c, u["id"])
              self.send_json({"id": iid, "name": nm})

          def api_rename(self, method, name, q):
              u = self.need_user()
              d = self.read_json()
              with db() as c:
                  r = self.own_item(c, u["id"], d.get("id"))
                  nm = clean_name(d.get("name"))
                  mime = r["mime"] if r["is_folder"] else guess_mime(nm)
                  c.execute("UPDATE items SET name=?, mime=?, modified=? WHERE id=?", (nm, mime, time.time(), r["id"]))
                  log(c, u["id"], "rename", f"{r['name']} → {nm}")
              self.send_json({"ok": True})

          def api_move(self, method, name, q):
              u = self.need_user()
              d = self.read_json()
              ids = d.get("ids") or []
              with db() as c:
                  parent = self.check_parent(c, u["id"], d.get("parent"))
                  for iid in ids:
                      self.own_item(c, u["id"], iid)
                  if parent and parent in descendants(c, ids):
                      raise ApiError(400, "Tidak bisa memindahkan folder ke dalam dirinya sendiri")
                  c.executemany("UPDATE items SET parent_id=?, modified=? WHERE id=?", [(parent, time.time(), i) for i in ids])
                  log(c, u["id"], "move", f"{len(ids)} item")
              self.send_json({"ok": True})

          def api_copy(self, method, name, q):
              u = self.need_user()
              d = self.read_json()
              ids = d.get("ids") or []
              with db() as c:
                  uid = u["id"]
                  rows = [self.own_item(c, uid, i) for i in ids]
                  for r in rows:
                      if r["trashed"]:
                          raise ApiError(400, "Item ada di sampah")
                  dest_given = "parent" in d
                  dest = self.check_parent(c, uid, d.get("parent")) if dest_given else None
                  need = 0
                  for r in rows:
                      ids_ = descendants(c, [r["id"]])
                      need += c.execute("SELECT COALESCE(SUM(size),0) s FROM items WHERE is_folder=0 AND id IN (%s)" % ",".join("?" * len(ids_)), ids_).fetchone()["s"]
                  self.ensure_space(c, u, need)
                  now = time.time()

                  def clone(r, parent, newname):
                      nid = uuid.uuid4().hex
                      c.execute("INSERT INTO items(id,user_id,parent_id,name,is_folder,size,mime,created,modified) VALUES(?,?,?,?,?,?,?,?,?)",
                                (nid, uid, parent, newname, r["is_folder"], r["size"], r["mime"], now, now))
                      if r["is_folder"]:
                          for ch in c.execute("SELECT * FROM items WHERE parent_id=? AND user_id=? AND trashed=0", (r["id"], uid)).fetchall():
                              clone(ch, nid, ch["name"])
                      elif (BLOBS / r["id"]).exists():
                          shutil.copyfile(BLOBS / r["id"], BLOBS / nid)
                      return nid

                  new_ids = []
                  for r in rows:
                      parent = dest if dest_given else r["parent_id"]
                      nm = unique_name(c, uid, parent, ("Salinan " + r["name"])[:255] if not dest_given or parent == r["parent_id"] else r["name"])
                      new_ids.append(clone(r, parent, nm))
                  log(c, uid, "copy", f"{len(rows)} item")
                  sync_warn(c, uid)
              self.send_json({"ids": new_ids})

          def api_star(self, method, name, q):
              u = self.need_user()
              d = self.read_json()
              ids = d.get("ids") or ([d["id"]] if d.get("id") else [])
              with db() as c:
                  for iid in ids:
                      self.own_item(c, u["id"], iid)
                  c.executemany("UPDATE items SET starred=? WHERE id=?", [(int(bool(d.get("value"))), i) for i in ids])
              self.send_json({"ok": True})

          def api_trash(self, method, name, q):
              u = self.need_user()
              d = self.read_json()
              ids, restore = d.get("ids") or [], bool(d.get("restore"))
              with db() as c:
                  for iid in ids:
                      self.own_item(c, u["id"], iid)
                  all_ids = descendants(c, ids)
                  c.executemany("UPDATE items SET trashed=?, trashed_at=? WHERE id=?",
                                [(int(not restore), None if restore else time.time(), i) for i in all_ids])
                  log(c, u["id"], "restore" if restore else "trash", f"{len(ids)} item")
                  if restore:
                      for iid in ids:
                          r = c.execute("SELECT parent_id FROM items WHERE id=?", (iid,)).fetchone()
                          if r["parent_id"]:
                              p = c.execute("SELECT trashed FROM items WHERE id=?", (r["parent_id"],)).fetchone()
                              if not p or p["trashed"]:
                                  c.execute("UPDATE items SET parent_id=NULL WHERE id=?", (iid,))
              self.send_json({"ok": True})

          def purge(self, c, ids):
              all_ids = descendants(c, ids)
              for i in all_ids:
                  (BLOBS / i).unlink(missing_ok=True)
              c.executemany("DELETE FROM shares WHERE item_id=?", [(i,) for i in all_ids])
              c.executemany("DELETE FROM items WHERE id=?", [(i,) for i in all_ids])

          def api_delete(self, method, name, q):
              u = self.need_user()
              d = self.read_json()
              with db() as c:
                  for iid in d.get("ids") or []:
                      if not self.own_item(c, u["id"], iid)["trashed"]:
                          raise ApiError(400, "Pindahkan ke sampah dulu")
                  self.purge(c, d.get("ids") or [])
                  log(c, u["id"], "delete", f"{len(d.get('ids') or [])} item permanen")
                  sync_warn(c, u["id"])
              self.send_json({"ok": True})

          def api_empty_trash(self, method, name, q):
              u = self.need_user()
              with db() as c:
                  ids = [r["id"] for r in c.execute(
                      "SELECT id FROM items WHERE user_id=? AND trashed=1 AND (parent_id IS NULL OR parent_id NOT IN "
                      "(SELECT id FROM items WHERE trashed=1 AND user_id=?))", (u["id"], u["id"])).fetchall()]
                  self.purge(c, ids)
                  log(c, u["id"], "delete", "Sampah dikosongkan")
                  sync_warn(c, u["id"])
              self.send_json({"ok": True})

          # ---- sharing (pemilik)
          def share_info(self, row):
              if not row:
                  return {"token": None}
              exp = row["expires"]
              return {"token": row["token"], "expires": exp, "expired": bool(exp and exp < time.time()), "unlock": row["unlock"],
                      "has_password": bool(row["pw_hash"]), "views": row["views"] or 0}

          def api_share(self, method, name, q):
              u = self.need_user()
              iid = q.get("id", [""])[0]
              with db() as c:
                  it = self.own_item(c, u["id"], iid)
                  row = c.execute("SELECT * FROM shares WHERE item_id=?", (iid,)).fetchone()
                  if method == "GET":
                      return self.send_json(self.share_info(row))
                  d = self.read_json()
                  if d.get("revoke"):
                      c.execute("DELETE FROM shares WHERE item_id=?", (iid,))
                      log(c, u["id"], "unshare", it["name"])
                      c.commit()
                      return self.send_json({"token": None})
                  if not row:
                      if not RUNTIME["allow_share"] and not u["is_owner"]:
                          raise ApiError(403, "Pembuatan tautan berbagi dinonaktifkan oleh owner.", "share_off")
                      c.execute("INSERT INTO shares(token,item_id,created) VALUES(?,?,?)", (secrets.token_urlsafe(18), iid, time.time()))
                      log(c, u["id"], "share", it["name"])
                  if "expires_days" in d:
                      days = int(d.get("expires_days") or 0)
                      c.execute("UPDATE shares SET expires=? WHERE item_id=?", (time.time() + days * 86400 if days > 0 else None, iid))
                  if "unlock_at" in d:
                      try:
                          ua = float(d.get("unlock_at") or 0)
                      except (TypeError, ValueError):
                          raise ApiError(400, "Waktu buka kado tidak valid")
                      c.execute("UPDATE shares SET unlock=? WHERE item_id=?", (ua if ua > time.time() else None, iid))
                      log(c, u["id"], "gift", it["name"])
                  if "password" in d:
                      pw = d.get("password") or ""
                      if pw:
                          salt = secrets.token_hex(16)
                          c.execute("UPDATE shares SET pw_hash=?, salt=? WHERE item_id=?", (hash_pw(pw, salt), salt, iid))
                      else:
                          c.execute("UPDATE shares SET pw_hash=NULL, salt=NULL WHERE item_id=?", (iid,))
                  row = c.execute("SELECT * FROM shares WHERE item_id=?", (iid,)).fetchone()
              self.send_json(self.share_info(row))

          # ---- halaman publik
          def share_cookie_val(self, s):
              return hmac.new(SECRET, (s["token"] + (s["pw_hash"] or "")).encode(), "sha256").hexdigest()[:40]

          def public_share(self, method, path, q):
              parts = [p for p in path.split("/") if p]
              if not parts:
                  raise ApiError(404, "Tautan tidak valid")
              token = parts[0]
              with db() as c:
                  s = c.execute("SELECT * FROM shares WHERE token=?", (token,)).fetchone()
                  root = c.execute("SELECT * FROM items WHERE id=?", (s["item_id"],)).fetchone() if s else None
                  if not s or not root or root["trashed"]:
                      raise ApiError(404, "Tautan tidak valid atau sudah dihentikan")
                  if s["expires"] and s["expires"] < time.time():
                      raise ApiError(410, "Tautan ini sudah kedaluwarsa")
                  cname = "shk_" + token[:10]
                  authed = not s["pw_hash"] or hmac.compare_digest(self.cookie(cname) or "", self.share_cookie_val(s))
                  if method == "POST":
                      n = min(int(self.headers.get("Content-Length") or 0), 10_000)
                      form = parse_qs(self.rfile.read(n).decode("utf-8", "ignore"))
                      key = self.client_address[0] + token
                      if too_many_fails(key):
                          raise ApiError(429, "Terlalu banyak percobaan, coba lagi nanti")
                      pw = (form.get("pw") or [""])[0]
                      if s["pw_hash"] and hmac.compare_digest(hash_pw(pw, s["salt"]), s["pw_hash"]):
                          flags = "HttpOnly; SameSite=Lax; Path=/s/; Max-Age=86400" + ("; Secure" if COOKIE_SECURE else "")
                          return self._headers(303, "text/plain", 0, {"Location": "/s/" + token, "Set-Cookie": f"{cname}={self.share_cookie_val(s)}; {flags}"})
                      FAILS.setdefault(key, []).append(time.time())
                      return self.send_html(share_page("Dilindungi", self.pw_form("Password salah"), 401))
                  if not authed:
                      return self.send_html(share_page("Dilindungi", self.pw_form("")))
                  if s["unlock"] and s["unlock"] > time.time():
                      return self.send_html(share_page("Kado spesial", gift_body(s["unlock"], root["name"])))
                  owner = root["user_id"]
                  if len(parts) >= 3 and parts[1] == "file":
                      it = c.execute("SELECT * FROM items WHERE id=? AND user_id=? AND trashed=0 AND is_folder=0", (parts[2], owner)).fetchone()
                      if not it or not in_tree(c, root["id"], it["id"]):
                          raise ApiError(404, "File tidak ditemukan")
                      return self.send_blob(it, inline=q.get("dl", [""])[0] != "1")
                  if len(parts) >= 2 and parts[1] == "zip":
                      cur = q.get("f", [""])[0] or root["id"]
                      if not in_tree(c, root["id"], cur):
                          raise ApiError(404, "Folder tidak ditemukan")
                      r = c.execute("SELECT * FROM items WHERE id=? AND is_folder=1 AND trashed=0", (cur,)).fetchone()
                      if not r:
                          raise ApiError(404, "Folder tidak ditemukan")
                      return self.build_zip(c, owner, [r], r["name"])
                  c.execute("UPDATE shares SET views=COALESCE(views,0)+1 WHERE token=?", (token,))
                  c.commit()
                  base = "/s/" + token
                  if not root["is_folder"]:
                      return self.send_html(share_page(root["name"], self.file_card(base, root)))
                  cur_id = q.get("f", [""])[0] or root["id"]
                  cur = c.execute("SELECT * FROM items WHERE id=? AND user_id=? AND is_folder=1 AND trashed=0", (cur_id, owner)).fetchone()
                  if not cur or not in_tree(c, root["id"], cur["id"]):
                      raise ApiError(404, "Folder tidak ditemukan")
                  trail, node = [], cur
                  while node:
                      trail.insert(0, node)
                      node = None if node["id"] == root["id"] else c.execute("SELECT * FROM items WHERE id=?", (node["parent_id"],)).fetchone()
                  crumb = " › ".join(f"<a href='{base}?f={t['id']}'>{h(t['name'])}</a>" for t in trail)
                  kids = c.execute("SELECT * FROM items WHERE parent_id=? AND user_id=? AND trashed=0 ORDER BY is_folder DESC, name COLLATE NOCASE",
                                   (cur["id"], owner)).fetchall()
                  rows = []
                  for k in kids:
                      if k["is_folder"]:
                          rows.append(f"<div class=row><div class=ic>📁</div><a class=n href='{base}?f={k['id']}'>{h(k['name'])}</a></div>")
                      else:
                          ic = (f"<img loading=lazy src='{base}/file/{k['id']}'>" if (k["mime"] or "").startswith("image/") and INLINE_OK.match(k["mime"]) else "📄")
                          rows.append(f"<div class=row><div class=ic>{ic}</div><a class=n href='{base}/file/{k['id']}' target=_blank>{h(k['name'])}</a>"
                                      f"<span class=muted>{fmt_size(k['size'])}</span><a class='btn ghost' href='{base}/file/{k['id']}?dl=1'>Unduh</a></div>")
                  body = (f"<div class=card><h1>📁 {h(cur['name'])}</h1><div class=crumb>{crumb}</div>"
                          f"{''.join(rows) or '<p class=muted>Folder kosong</p>'}"
                          f"<p><a class=btn href='{base}/zip?f={cur['id']}'>Unduh semua (ZIP)</a></p></div>")
                  self.send_html(share_page(cur["name"], body))

          def pw_form(self, err):
              return ("<div class=card style='max-width:420px;margin:40px auto'><h1>🔒 Tautan dilindungi</h1>"
                      "<p class=muted>Masukkan password untuk membuka file ini.</p><form method=post>"
                      "<input type=password name=pw placeholder=Password autofocus required>"
                      f"<div class=err>{h(err)}</div><button class=btn>Buka</button></form></div>")

          def file_card(self, base, it):
              mime = it["mime"] or ""
              u = f"{base}/file/{it['id']}"
              if re.match(r"image/(png|jpeg|gif|webp|avif|bmp)", mime):
                  stage = f"<img src='{u}' alt=''>"
              elif mime.startswith("video/"):
                  stage = f"<video src='{u}' controls preload=metadata></video>"
              elif mime.startswith("audio/"):
                  stage = f"<audio src='{u}' controls style='width:90%;margin:30px'></audio>"
              elif mime == "application/pdf":
                  stage = f"<iframe src='{u}'></iframe>"
              else:
                  stage = "<div class=big>📄</div>"
              return (f"<div class=card><h1>{h(it['name'])}</h1><div class=muted>{fmt_size(it['size'])}</div>"
                      f"<div class=stage>{stage}</div><a class=btn href='{u}?dl=1'>⬇ Unduh</a></div>")

          # ---- fitur tambahan
          def api_speedtest(self, method, name, q):
              """Tes kecepatan: ping, unduh (server kirim data acak), unggah (server buang data)."""
              self.need_user()
              sub = name.split("/")[1] if "/" in name else ""
              nocache = {"Cache-Control": "no-store"}
              if sub == "ping":
                  return self.send_json({"ok": True}, extra=nocache)
              if sub == "down" and method == "GET":
                  try:
                      size = int(q.get("size", ["8388608"])[0])
                  except ValueError:
                      raise ApiError(400, "Ukuran tidak valid")
                  size = max(1, min(size, 64 * 1024 * 1024))
                  self._headers(200, "application/octet-stream", size, nocache)
                  if self.head_only:
                      return
                  left = size
                  while left > 0:
                      n = min(CHUNK, left)
                      self.wfile.write(SPEED_VIEW[:n])
                      left -= n
                  return
              if sub == "up" and method == "POST":
                  length = self.headers.get("Content-Length")
                  if length is None or not length.isdigit():
                      raise ApiError(411, "Content-Length wajib")
                  left = int(length)
                  if left > 32 * 1024 * 1024:
                      raise ApiError(413, "Data terlalu besar")
                  total = left
                  while left > 0:
                      chunk = self.rfile.read(min(CHUNK, left))
                      if not chunk:
                          raise ApiError(400, "Upload terputus")
                      left -= len(chunk)
                  return self.send_json({"ok": True, "bytes": total}, extra=nocache)
              raise ApiError(404, "Endpoint tidak ada")

