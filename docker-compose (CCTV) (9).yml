        if (S.notice && S.notice.maintenance && S.me && !S.me.is_owner) { toast('Mode pemeliharaan aktif: unggah dinonaktifkan sementara'); return false; }
        const s = S.storage; if (!s) return true;
        if (!s.can_upload) { limitDialog('no_quota'); return false; }
