      function cctScan() {
        let guess = '192.168.1.0/24'; const mm = location.hostname.match(/^(\d+\.\d+\.\d+)\.\d+$$/); if (mm) guess = mm[1] + '.0/24';
        const m = modal(`<h2>Cari kamera di jaringan</h2><p class="hint" style="margin:0 0 6px">Memeriksa alamat yang membuka port kamera (554 / 8554 / 8899). Gunakan rentang jaringan rumah Anda.</p><label class="lbl">Rentang jaringan</label><input type="text" id="scNet" value="$${guess}"><div id="scRes"></div><div class="actions"><button class="btn" id="scX">Tutup</button><button class="btn pri" id="scGo">$${ic('radar',16)}Pindai</button></div>`, 'cwide');
