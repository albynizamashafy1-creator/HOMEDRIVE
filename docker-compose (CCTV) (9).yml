      def as_tools(ctx):
          return [t for t in ASSIST_TOOLS if (not t[5] or ctx["p"].get("any")) and (t[0] != "send_telegram" or ctx["u"]["is_owner"])]


      def as_run_tool(ctx, name, args):
          for t in as_tools(ctx):
              if t[0] == name:
                  try:
                      res = t[4](ctx, args if isinstance(args, dict) else {})
                  except (ValueError, ApiError, KeyError, TypeError) as e:
                      res = {"error": str(getattr(e, "msg", None) or (e.args[0] if e.args else e))[:200]}
                  ctx["used"].append(name)
                  return json.dumps(res, ensure_ascii=False)[:7000]
          return json.dumps({"error": "alat tidak dikenal"})


