      /* ===== animasi (diatur dari Studio Desain) ===== */
      html{--spd:1;--ease:cubic-bezier(.22,.8,.24,1);--stg:28;--ae:a-rise;--ap:a-fade}
      @keyframes a-rise{from{opacity:0;transform:translateY(16px)}}
      @keyframes a-fade{from{opacity:0}}
      @keyframes a-zoom{from{opacity:0;transform:scale(.9)}}
      @keyframes a-slide{from{opacity:0;transform:translateX(-22px)}}
      @keyframes a-flip{from{opacity:0;transform:perspective(700px) rotateX(-20deg) translateY(12px)}}
      @keyframes a-pslide{from{opacity:0;transform:translateX(26px)}}
      @keyframes a-pop{from{opacity:0;transform:scale(.94) translateY(8px)}}
      @keyframes a-rip{to{transform:scale(1);opacity:0}}
      @keyframes a-aur{0%{transform:translate3d(-6%,-4%,0) rotate(0)}100%{transform:translate3d(6%,5%,0) rotate(14deg)}}
      @keyframes a-flt{0%{background-position:0% 0%,100% 10%,40% 100%}100%{background-position:35% 45%,60% 70%,90% 20%}}
      #content.play{animation:var(--ap) calc(.4s / var(--spd)) var(--ease) both}
      #content.play .item,#content.play .row:not(.head),#content.play .kpi,#content.play .panel{animation:var(--ae) calc(.5s / var(--spd)) var(--ease) both;animation-delay:calc(min(var(--i,0),16) * var(--stg) * 1ms)}
      html[data-ah] .item{transition:transform calc(.28s / var(--spd)) var(--ease),box-shadow calc(.28s / var(--spd)) var(--ease),border-color .2s,background .2s}
      html[data-ah=none] .item:hover{transform:none;box-shadow:var(--sh2)}
      html[data-ah=lift] .item:hover{transform:translateY(-5px);box-shadow:var(--sh)}
      html[data-ah=glow] .item:hover{transform:translateY(-2px);box-shadow:0 0 0 1.5px var(--acc),0 14px 36px -12px color-mix(in srgb,var(--acc) 60%,transparent)}
      html[data-ah=tilt] .item:hover{transform:perspective(700px) rotateX(3deg) rotateY(-4deg) translateY(-4px);box-shadow:var(--sh)}
      html[data-ah=pop] .item:hover{transform:scale(1.04);box-shadow:var(--sh)}
      html[data-ah]:not([data-ah=none]) .item:active{transform:scale(.97)}
      .rip{position:absolute;border-radius:50%;background:currentColor;opacity:.22;transform:scale(0);pointer-events:none;animation:a-rip calc(.6s / var(--spd)) ease-out forwards}
      @media(min-width:901px){
       html[data-ad=pop] .modal{animation:a-pop calc(.28s / var(--spd)) var(--ease)}
       html[data-ad=rise] .modal{animation:a-rise calc(.35s / var(--spd)) var(--ease)}
       html[data-ad=fade] .modal{animation:a-fade calc(.25s / var(--spd)) ease}
       html[data-ad=none] .modal,html[data-ad=none] .mbg{animation:none}
      }
      html[data-ab=aurora] body::after,html[data-ab=float] body::after{content:"";position:fixed;z-index:-1;pointer-events:none}
      html[data-ab=aurora] body::after{inset:-25%;background:radial-gradient(40% 40% at 25% 30%,var(--acc),transparent 70%),radial-gradient(35% 35% at 75% 25%,var(--acc2),transparent 70%),radial-gradient(45% 45% at 60% 80%,color-mix(in srgb,var(--acc) 60%,var(--acc2)),transparent 70%);filter:blur(70px);opacity:.3;animation:a-aur calc(24s / var(--spd)) ease-in-out infinite alternate}
      html[data-ab=float] body::after{inset:0;background:radial-gradient(closest-side,color-mix(in srgb,var(--acc) 38%,transparent),transparent) no-repeat,radial-gradient(closest-side,color-mix(in srgb,var(--acc2) 34%,transparent),transparent) no-repeat,radial-gradient(closest-side,color-mix(in srgb,var(--acc) 22%,transparent),transparent) no-repeat;background-size:46% 46%,40% 40%,52% 52%;animation:a-flt calc(20s / var(--spd)) ease-in-out infinite alternate}
