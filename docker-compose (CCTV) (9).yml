      .asatt{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.asatt figure{margin:0;width:128px}.asatt img{width:128px;height:90px;object-fit:cover;border-radius:10px;cursor:zoom-in;background:#000;display:block}.asatt figcaption{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
      .asq{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
      .asin{display:flex;gap:8px;align-items:flex-end;margin-top:6px}.asin textarea{flex:1;resize:none;min-height:46px;max-height:140px;border-radius:14px}
      .asdots span{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--muted);animation:cblink 1s infinite}
      .smgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:4px 2px}
      .smc{position:relative;display:block;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);cursor:pointer}.smc img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--s2)}
      .smc .ck{position:absolute;left:8px;top:8px;width:20px;height:20px;z-index:2}.smc span{display:block;padding:7px 9px;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.smc small{display:block;color:var(--muted)}
      .smg{margin-bottom:14px}
      .cbatt{flex:none;font-size:11px;font-weight:750;padding:2px 8px;border-radius:99px;background:rgba(255,255,255,.22);color:#fff}.cbatt.low{background:#dc2626}
      .caicv{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;display:none}
      .ctile.aimode .caicv{display:block}.ctile.aimode video,.ctile.aimode .csnap{display:none}
      .caibadge{position:absolute;right:10px;top:46px;z-index:3;background:rgba(0,0,0,.65);color:#22d3ee;font-weight:750;font-size:11.5px;padding:3px 10px;border-radius:99px;pointer-events:none;max-width:70%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
