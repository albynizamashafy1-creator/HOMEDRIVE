        b.querySelector('#smTabs').onclick = e => { const x = e.target.closest('[data-t]'); if (x) smTab(x.dataset.t); };
        let j; try { j = await api('ai/review?kind=' + t); } catch(e) { $$('#smList').innerHTML = emptyBox('alert', 'Gagal memuat', esc(e.message)); return; }
