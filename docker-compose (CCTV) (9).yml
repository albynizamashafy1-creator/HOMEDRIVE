      def too_many_fails(key):
          now = time.time()
          FAILS[key] = [t for t in FAILS.get(key, []) if now - t < 300]
          return len(FAILS[key]) >= 10


      FACE_TICKETS = {}      # tiket login tahap 2: token -> {uid, exp, tries}
      FACE_THRESHOLD = 0.5   # jarak Euclid maksimum antar-deskriptor (face-api: makin kecil makin mirip)


      def face_valid(d):
          return (isinstance(d, list) and len(d) == 128
                  and all(isinstance(x, (int, float)) and not isinstance(x, bool) and abs(x) < 10 for x in d))


      def face_dist(a, b):
          return sum((x - y) ** 2 for x, y in zip(a, b)) ** 0.5


      def face_match(samples, probe):
          return bool(samples) and min(face_dist(x, probe) for x in samples) < FACE_THRESHOLD


      def face_new_codes():
          plain = ["-".join(secrets.token_hex(2).upper() for _ in range(3)) for _ in range(8)]
          salt = secrets.token_hex(16)
          return plain, json.dumps({"salt": salt, "h": [hash_pw(c.replace("-", ""), salt) for c in plain]})


      def face_take_code(raw, code):
          """Cocokkan kode pemulihan; mengembalikan JSON baru tanpa kode yang dipakai, atau None."""
          try:
              o = json.loads(raw or "")
          except ValueError:
              return None
          h = hash_pw((code or "").upper().replace("-", "").replace(" ", ""), o["salt"])
          for x in o["h"]:
              if hmac.compare_digest(x, h):
                  o["h"].remove(x)
                  return json.dumps(o)
          return None


      class ApiError(Exception):
          def __init__(self, status, msg, code=None):
              self.status, self.msg, self.code = status, msg, code


      def clean_name(name):
          name = (name or "").replace("\x00", "").strip()
          name = re.sub(r"[\\/]", "_", name)
          if not name or name in (".", ".."):
              raise ApiError(400, "Nama tidak valid")
          return name[:255]


      def unique_name(c, uid, parent, name):
          def exists(n):
              return c.execute("SELECT 1 FROM items WHERE user_id=? AND parent_id IS ? AND trashed=0 AND name=? COLLATE NOCASE",
                               (uid, parent, n)).fetchone()
          if not exists(name):
              return name
          stem, dot, ext = name.rpartition(".")
          if not dot or not stem:
              stem, ext = name, ""
          else:
              ext = "." + ext
          i = 1
          while exists(f"{stem} ({i}){ext}"):
              i += 1
          return f"{stem} ({i}){ext}"


      def descendants(c, ids):
          if not ids:
              return []
          q = ",".join("?" * len(ids))
          rows = c.execute(
              f"""WITH RECURSIVE t(id) AS (
                    SELECT id FROM items WHERE id IN ({q})
                    UNION ALL SELECT i.id FROM items i JOIN t ON i.parent_id=t.id)
                  SELECT id FROM t""", list(ids)).fetchall()
          return [r["id"] for r in rows]


      def item_dict(r, shared=()):
          return {
              "id": r["id"], "parent_id": r["parent_id"], "name": r["name"],
              "is_folder": bool(r["is_folder"]), "size": r["size"], "mime": r["mime"],
              "created": r["created"], "modified": r["modified"],
              "starred": bool(r["starred"]), "trashed": bool(r["trashed"]), "shared": r["id"] in shared,
              "color": r["color"], "trashed_at": r["trashed_at"],
          }


      def fmt_size(n):
          for u in ("B", "KB", "MB", "GB", "TB"):
              if n < 1024 or u == "TB":
                  return f"{n:.0f} {u}" if u == "B" else f"{n:.1f} {u}"
              n /= 1024


      def in_tree(c, root_id, item_id):
          """True jika item_id sama dengan / berada di bawah root_id."""
          cur, hops = item_id, 0
          while cur and hops < 200:
              if cur == root_id:
                  return True
              r = c.execute("SELECT parent_id FROM items WHERE id=?", (cur,)).fetchone()
              cur = r["parent_id"] if r else None
              hops += 1
          return False


      # ---------------------------------------------------------------- pembaruan langsung, notifikasi, kuota
      class Bus:
          """Bus event untuk Server-Sent Events: browser diperbarui otomatis tanpa reload."""

          def __init__(self):
              self.cv = threading.Condition()
              self.seq = 0
              self.log = collections.deque(maxlen=1000)
              self.tl = threading.local()

          def emit(self, topic, uid=None, origin=None):
              """Antrekan event (uid=None -> semua pengguna). Baru dikirim saat flush(), setelah DB di-commit."""
              if not hasattr(self.tl, "p"):
                  self.tl.p = []
              self.tl.p.append((topic, uid, origin))

          def flush(self):
              p = getattr(self.tl, "p", None)
              if not p:
                  return
              self.tl.p = []
              with self.cv:
                  for t, uid, o in p:
                      self.seq += 1
                      self.log.append((self.seq, t, uid, o))
                  self.cv.notify_all()

          def wait(self, seq, timeout):
              with self.cv:
                  if self.seq == seq:
                      self.cv.wait(timeout)

          def since(self, seq, uid, cid):
              with self.cv:
                  cur = self.seq
                  if cur == seq:
                      return cur, set()
                  if self.log and self.log[0][0] > seq + 1:  # ketinggalan terlalu jauh: segarkan semuanya
                      return cur, {"files", "notify", "users"}
                  return cur, {t for s, t, u, o in self.log if s > seq and (u is None or u == uid) and not (o and o == cid)}


