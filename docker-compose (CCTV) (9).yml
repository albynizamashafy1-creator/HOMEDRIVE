      # ---- validasi
      def _col(v):
          v = str(v or "").strip()
          if re.fullmatch(r"#[0-9a-fA-F]{3}", v):
              v = "#" + "".join(ch * 2 for ch in v[1:])
          return v.lower() if re.fullmatch(r"#[0-9a-f]{6}", v.lower()) else None


      def _num(lo, hi, nd=0):
          def f(v):
              try:
                  x = float(v)
              except (TypeError, ValueError):
                  return None
              if x != x or x in (float("inf"), float("-inf")):
                  return None
              x = max(lo, min(hi, x))
              return int(round(x)) if nd == 0 else round(x, nd)
          return f


      def _enum(*opts):
          return lambda v: v if v in opts else None


      def _txt(n):
          return lambda v: re.sub(r"[\x00-\x1f\x7f<>]", "", str(v if v is not None else "")).strip()[:n]


      def _bool(v):
          return bool(v) if isinstance(v, (bool, int)) else None


      def _img(v):
          v = str(v or "").strip()
          if re.fullmatch(r"/design/asset/[a-f0-9]{16}\.(png|jpg|webp|gif|svg|avif)", v):
              return v
          if re.fullmatch(r"https://[A-Za-z0-9._~:/?#@!&*+,;=%-]{4,500}", v):
              return v
          return "" if v == "" else None


      def _font_url(v):
          v = str(v or "").strip()
          return v if re.fullmatch(r"/design/asset/[a-f0-9]{16}\.(woff2|woff|ttf|otf)", v) else ("" if v == "" else None)


      def _stack(v):
          v = str(v or "").strip()
          return v if re.fullmatch(r"[A-Za-z0-9 ,\"'_-]{1,120}", v) else ("" if v == "" else None)


      def _css_clean(v):
          s = str(v or "")[:DESIGN_CSS_MAX]
          s = s.replace("\x00", "").replace("<", "\\3c ")
          s = re.sub(r"@import[^;]*;?", "", s, flags=re.I)
          s = re.sub(r"expression\s*\(|javascript:|vbscript:|-moz-binding|behavior\s*:", "", s, flags=re.I)

          def keep(m):
              u = m.group(2).strip()
              ok = (re.fullmatch(r"/design/asset/[a-f0-9]{16}\.[a-z0-9]+", u) or re.fullmatch(r"https://[A-Za-z0-9._~:/?#@!&*+,;=%-]{4,500}", u)
                    or re.fullmatch(r"data:image/(png|jpeg|webp|gif|svg\+xml);base64,[A-Za-z0-9+/=]+", u))
              return m.group(0) if ok else "none"
          return re.sub(r"url\(\s*(['\"]?)(.*?)\1\s*\)", keep, s, flags=re.I | re.S)


      def _hex_rgb(c):
          return tuple(int(c[i:i + 2], 16) for i in (1, 3, 5))


      def _rgb_hex(r, g, b):
          return "#%02x%02x%02x" % tuple(max(0, min(255, int(round(x)))) for x in (r, g, b))


      def _mix(a, b, t):
          """Campur warna a dengan b; t = bagian b (0..1)."""
          ra, rb = _hex_rgb(a), _hex_rgb(b)
          return _rgb_hex(*[ra[i] * (1 - t) + rb[i] * t for i in range(3)])


      def _shift_hue(c, deg):
          r, g, b = [x / 255 for x in _hex_rgb(c)]
          hh, ll, ss = colorsys.rgb_to_hls(r, g, b)
          r, g, b = colorsys.hls_to_rgb((hh + deg / 360) % 1, ll, ss)
          return _rgb_hex(r * 255, g * 255, b * 255)


