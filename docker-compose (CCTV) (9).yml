          draw(); pollNotif();
        };
        onLive(m, () => draw());
        draw();
      }

      /* ---------- tes kecepatan ---------- */
      const mbps = v => v>=100 ? v.toFixed(0) : v>=10 ? v.toFixed(1) : v.toFixed(2);
      function spBlob(n) { const buf = new Uint8Array(n); for (let o=0;o<n;o+=65536) crypto.getRandomValues(buf.subarray(o, Math.min(n,o+65536))); return new Blob([buf]); }
      async function spPing() {
        const t = [];
        for (let i=0;i<7;i++) { const a = performance.now(); await fetch('/api/speedtest/ping?r='+Math.random(), {cache:'no-store', credentials:'same-origin'}); t.push(performance.now()-a); }
        t.shift(); const avg = t.reduce((a,b)=>a+b,0)/t.length;
        return {ms: avg, jitter: t.slice(1).reduce((a,b,i)=>a+Math.abs(b-t[i]),0)/(t.length-1)};
      }
      async function spDownload(onSpeed, dead, dur) {
        const t0 = performance.now(), ac = new AbortController(); let bytes = 0;
        const worker = async () => {
          while (performance.now()-t0 < dur && !dead()) {
            const r = await fetch('/api/speedtest/down?size=8388608&r='+Math.random(), {cache:'no-store', credentials:'same-origin', signal:ac.signal});
            if (!r.ok) throw new Error('Gagal');
            const rd = r.body.getReader();
            for (;;) {
              const {done, value} = await rd.read(); if (done) break;
              bytes += value.length; const el = (performance.now()-t0)/1000; if (el > 0.4) onSpeed(bytes*8/el/1e6);
              if (performance.now()-t0 >= dur || dead()) { ac.abort(); return; }
            }
          }
        };
        await Promise.all([worker(), worker(), worker()].map(p => p.catch(e => { if (e.name!=='AbortError') throw e; })));
        return bytes*8/((performance.now()-t0)/1000)/1e6;
      }
      function spUpload(onSpeed, dead, dur) {
        return new Promise((res, rej) => {
          const blob = spBlob(4*1024*1024), t0 = performance.now(), part = [0,0]; let done = 0, ended = 0, failed = false;
          const total = () => done + part[0] + part[1];
          const finish = () => { if (++ended === 2) failed ? rej(new Error('Unggah gagal')) : res(total()*8/((performance.now()-t0)/1000)/1e6); };
          const chain = i => {
            if (failed || performance.now()-t0 >= dur || dead()) return finish();
            const x = new XMLHttpRequest(); x.open('POST', '/api/speedtest/up'); x.setRequestHeader('X-Requested-With','drive');
            x.upload.onprogress = e => { part[i] = e.loaded; const el = (performance.now()-t0)/1000; if (el > 0.4) onSpeed(total()*8/el/1e6); };
            x.onload = () => { if (x.status!==200) { failed = true; return finish(); } done += blob.size; part[i] = 0; chain(i); };
            x.onerror = () => { failed = true; finish(); };
            x.send(blob);
          };
          chain(0); chain(1);
        });
      }
      async function speedDialog() {
        let last = null; try { last = JSON.parse(localStorage.getItem('speed') || 'null'); } catch(e) {}
        const m = modal(`<h2>Tes kecepatan</h2><p style="margin:0;color:var(--muted);font-size:13px">Mengukur kecepatan antara perangkat ini dan server HomeDrive, jadi hasilnya bergantung pada Wi-Fi atau jaringan yang sedang Anda pakai.</p>
          <div class="spbig"><b id="spNow">0</b><small>Mbps</small></div><div class="spstate" id="spState">Siap diuji</div>
          <div class="sgrid sp3"><div><small>Ping</small><b id="spPing">—</b><small id="spJit">&nbsp;</small></div><div><small>Unduh</small><b id="spDown">—</b><small id="spDownM">&nbsp;</small></div><div><small>Unggah</small><b id="spUp">—</b><small id="spUpM">&nbsp;</small></div></div>
          <div id="spLast" style="margin-top:12px;color:var(--muted);font-size:12.5px;text-align:center">$${last ? 'Hasil terakhir ('+fmtDT(last.t/1000)+'): ping '+last.ping.toFixed(0)+' ms · unduh '+mbps(last.down)+' Mbps · unggah '+mbps(last.up)+' Mbps' : ''}</div>
          <div class="actions"><button class="btn" id="spX">Tutup</button><button class="btn pri" id="spGo">$${ic('pulse',18)}Mulai tes</button></div>`);
        const gm = s => m.querySelector(s), dead = () => !document.body.contains(m); let running = false;
        gm('#spX').onclick = () => m.remove();
        gm('#spGo').onclick = async () => {
          if (running) return; running = true; const go = gm('#spGo'); go.disabled = true; go.style.opacity = .6;
          for (const id of ['#spPing','#spDown','#spUp']) gm(id).textContent = '—'; for (const id of ['#spJit','#spDownM','#spUpM']) gm(id).innerHTML = '&nbsp;';
          const live = v => { if (!dead()) gm('#spNow').textContent = mbps(v); }, state = t => { if (!dead()) gm('#spState').textContent = t; };
          try {
            state('Mengukur ping…'); const p = await spPing(); if (dead()) return;
            gm('#spPing').textContent = p.ms.toFixed(0)+' ms'; gm('#spJit').textContent = 'jitter '+p.jitter.toFixed(0)+' ms';
            state('Mengukur kecepatan unduh…'); const d = await spDownload(live, dead, 6000); if (dead()) return;
            gm('#spDown').textContent = mbps(d)+' Mbps'; gm('#spDownM').textContent = (d/8).toFixed(1)+' MB/s'; live(d);
            state('Mengukur kecepatan unggah…'); const u = await spUpload(live, dead, 6000); if (dead()) return;
            gm('#spUp').textContent = mbps(u)+' Mbps'; gm('#spUpM').textContent = (u/8).toFixed(1)+' MB/s'; live(u);
            state('Selesai'); try { localStorage.setItem('speed', JSON.stringify({t:Date.now(), ping:p.ms, down:d, up:u})); } catch(e) {}
            gm('#spLast').textContent = '';
          } catch(e) { state('Tes gagal: '+e.message); }
          running = false; if (!dead()) { go.disabled = false; go.style.opacity = ''; go.innerHTML = ic('retry',18)+'Ulangi'; }
        };
      }

      function devInfo(ua) {
        if (!ua) return {n:'Perangkat tidak dikenal', i:'laptop'};
        const os = /Android/.test(ua)?'Android':/iPhone|iPad|iPod/.test(ua)?'iOS':/Windows/.test(ua)?'Windows':/Mac OS X|Macintosh/.test(ua)?'macOS':/CrOS/.test(ua)?'ChromeOS':/Linux/.test(ua)?'Linux':'Perangkat';
        const br = /Edg\//.test(ua)?'Edge':/OPR\/|Opera/.test(ua)?'Opera':/Firefox\/|FxiOS/.test(ua)?'Firefox':/Chrome\/|CriOS/.test(ua)?'Chrome':/Safari\//.test(ua)?'Safari':'Browser';
        return {n:br+' di '+os, i:/Android|iPhone|iPad|iPod|Mobile/.test(ua)?'phone':'laptop'};
      }
      async function devicesDialog() {
        const m = modal(`<h2>Perangkat login</h2><div id="dvB" style="color:var(--muted)">Memuat…</div><div class="actions"><button class="btn" id="dvX">Tutup</button><button class="btn dng hidden" id="dvAll">Keluarkan semua perangkat lain</button></div>`, 'wide');
        m.querySelector('#dvX').onclick = () => m.remove();
        const draw = async () => {
          let j; try { j = await api('sessions'); } catch(e) { m.remove(); return toast(e.message); }
          const n = j.sessions.length, b = m.querySelector('#dvB');
          b.style.color = 'var(--text)';
          b.innerHTML = `<div style="margin-bottom:8px"><b>$${n}</b> perangkat sedang login di akun <b>$${esc(S.me.username)}</b></div><div class="acl">` + j.sessions.map(s => {
            const d = devInfo(s.ua), seen = s.current ? 'Aktif sekarang' : (s.last_seen ? 'Terakhir aktif '+ago(s.last_seen) : 'Aktivitas tidak tercatat');
            return `<div class="a"><span class="ai">$${ic(d.i,18)}</span><div class="at"><b>$${esc(d.n)}</b>$${s.current?'<em class="pill">perangkat ini</em>':''}<span>$${esc(s.ip||'IP tidak diketahui')} · $${seen}$${s.created?' · login '+fmtDate(s.created):''}</span></div>$${s.current?'':`<button class="btn sm dng" data-rv="$${s.id}">Keluarkan</button>`}</div>`;
          }).join('') + '</div>';
          m.querySelector('#dvAll').classList.toggle('hidden', n<2);
        };
        m.querySelector('#dvB').onclick = async e => { const r = e.target.closest('[data-rv]'); if (!r) return;
          try { await api('sessions/revoke',{id:r.dataset.rv}); toast('Perangkat dikeluarkan'); draw(); } catch(er) { toast(er.message); } };
        m.querySelector('#dvAll').onclick = async () => { if (!await confirmBox('Keluarkan semua perangkat lain?','Perangkat ini tetap login. Perangkat lain harus login ulang.','Keluarkan')) return;
          try { await api('sessions/revoke-others',{}); toast('Semua perangkat lain dikeluarkan'); draw(); } catch(er) { toast(er.message); } };
        draw();
      }
      async function doLogout(all) {
        if (all && !await confirmBox('Keluar dari semua perangkat?','Semua sesi login akun ini (HP, laptop, dll.) akan diakhiri.','Keluar semua')) return;
        const req = api('logout'+(all?'?all=1':''),{});   // permintaan ke server dikirim, tampilan tidak menunggu
        forceLogout(false);
        try { await req; } catch(e) { toast('Server tidak merespons, sesi mungkin masih aktif. Coba keluar lagi.'); }
      }
      $$('#logoutBtn').onclick = () => doLogout(false);

      /* ---------- aksi ---------- */
      const act = {
        async newFolder() { const n = await ask('Folder baru','Folder tanpa judul','Buat'); if (n===null) return; try { await api('folder',{parent:S.parent,name:n}); load(true,true); } catch(e){toast(e.message);} },
        async newText() { if (!canUpload(0)) return; const n = await ask('Catatan teks baru','Catatan.txt','Buat'); if (n===null) return; try { const j = await api('savetext',{parent:S.parent,name:n,content:''}); await load(true,true); const it=byId(j.id); if (it) preview(it,{edit:true}); } catch(e){storeErr(e);} },
        async rename(it) { const n = await ask('Ubah nama', it.name, 'Simpan'); if (n===null||n===it.name) return; optimistic(raw => raw.map(x => x.id===it.id ? {...x, name:n.trim()||x.name} : x), () => api('rename',{id:it.id,name:n}), {keep:true}); },
        async star(ids) { const val = !ids.every(i=>byId(i)?.starred); optimistic(raw => raw.map(x => ids.includes(x.id) ? {...x, starred:val} : x), () => api('star',{ids,value:val}), {keep:true}); },
        async trash(ids) { if (await optimistic(raw => raw.filter(x => !ids.includes(x.id)), () => api('trash',{ids}))) toast(ids.length+' item dipindahkan ke sampah',{label:'Urungkan',fn:()=>act.restore(ids,true)}); },
        async restore(ids, quiet) {
          const call = () => api('trash',{ids,restore:true});
          if (S.view==='trash') { if (await optimistic(raw => raw.filter(x => !ids.includes(x.id)), call) && !quiet) toast('Item dipulihkan'); }
          else { try { await call(); if (!quiet) toast('Item dipulihkan'); load(true,true); } catch(e){toast(e.message);} }
        },
        async purge(ids) { if (!await confirmBox('Hapus permanen?','Item yang dihapus tidak bisa dikembalikan.')) return; optimistic(raw => raw.filter(x => !ids.includes(x.id)), () => api('delete',{ids})); },
        async dup(ids) { try { await api('copy',{ids}); toast('Salinan dibuat'); load(true,true); } catch(e){ storeErr(e); } },
        async extract(it) { toast('Mengekstrak '+it.name+'…'); try { const j = await api('extract',{id:it.id}); toast(j.count+' file diekstrak ke “'+j.name+'”',{label:'Buka',fn:()=>go('#/files/'+j.id)}); load(true,true); } catch(e){ storeErr(e); } },
        download(ids) { const it = ids.length===1 ? byId(ids[0]) : null; location.href = it && !it.is_folder ? dl(it.id) : (it ? '/api/zip/'+it.id : '/api/zip?ids='+ids.join(',')); },
        async move(ids, copy) {
          let cur = null;
          const m = modal(`<h2>$${copy?'Salin':'Pindahkan'} $${ids.length} item ke…</h2><div id="pkPath" style="color:var(--muted);font-size:13px"></div><div class="picker" id="pk"></div><div class="actions"><button class="btn" id="pkC">Batal</button><button class="btn pri" id="pkOk">$${copy?'Salin':'Pindahkan'} ke sini</button></div>`);
          const draw = async () => {
            const j = await api('list?view=files&folders=1'+(cur?'&parent='+cur:''));
            m.querySelector('#pkPath').textContent = ['Drive Saya', ...j.crumbs.map(c=>c.name)].join('  ›  ');
            const pk = m.querySelector('#pk'); pk.innerHTML = '';
            if (cur) { const b=document.createElement('button'); b.innerHTML=ic('arrowUp',18)+'Naik satu level'; b.onclick=()=>{ cur = j.crumbs.length>1 ? j.crumbs[j.crumbs.length-2].id : null; draw(); }; pk.append(b); }
            j.items.filter(f=>copy||!ids.includes(f.id)).forEach(f => { const b=document.createElement('button'); b.innerHTML=`<span style="color:#f5a524">$${ic('folder',20,'soft')}</span>$${esc(f.name)}`; b.onclick=()=>{cur=f.id; draw();}; pk.append(b); });
            if (!pk.children.length) pk.innerHTML = '<div style="padding:16px;color:var(--muted)">Tidak ada subfolder</div>';
          };
          m.querySelector('#pkC').onclick = () => m.remove();
          m.querySelector('#pkOk').onclick = async () => { m.remove(); if (copy) { try { await api('copy',{ids,parent:cur}); toast('Disalin'); load(true,true); } catch(e){ storeErr(e); } } else moveItems(ids, cur); };
          draw();
        }
      };

      /* ---------- dialog: bagikan ---------- */
      async function shareDialog(it) {
        let info; try { info = await api('share?id='+it.id); } catch(e) { return toast(e.message); }
        const m = modal(`<h2>Bagikan “$${esc(it.name)}”</h2><div id="shB"></div><div class="actions"><button class="btn" id="shX">Selesai</button></div>`, 'wide');
        m.querySelector('#shX').onclick = () => { m.remove(); load(true); };
        const draw = info => {
          const b = m.querySelector('#shB'), has = !!info.token;
          const form = `<label class="lbl">Masa berlaku tautan</label><select id="shExp">$${has?'<option value="">Tidak diubah</option>':''}<option value="0">Tanpa batas waktu</option><option value="1">1 hari</option><option value="7">7 hari</option><option value="30">30 hari</option></select>
            <label class="lbl">$${has&&info.has_password?'Ganti password (kosongkan = tetap)':'Password (opsional)'}</label><input type="password" id="shPw" placeholder="Tanpa password" autocomplete="new-password"><label class="lbl">🎁 Kado: baru bisa dibuka pada (opsional)</label><input type="datetime-local" id="shUn" value="$${info.unlock&&info.unlock>Date.now()/1000?toLocalDT(info.unlock):''}"><div class="hint">Penerima melihat hitung mundur sampai waktu ini. Kosongkan untuk membuka sekarang.</div>`;
          if (!has) { b.innerHTML = `<p style="color:var(--muted);margin:0">Siapa pun yang memiliki tautan dapat melihat dan mengunduh $${it.is_folder?'isi folder':'file'} ini tanpa login.</p>$${form}<div class="actions"><button class="btn pri" id="shOn">$${ic('link',18)}Buat tautan</button></div>`; }
          else {
            const url = location.origin + '/s/' + info.token;
            const status = info.expired ? '<span style="color:var(--danger)">Sudah kedaluwarsa</span>' : (info.expires ? 'Berakhir '+fmtDT(info.expires) : 'Tanpa batas waktu');
            b.innerHTML = `<div style="display:flex;gap:8px"><input type="text" readonly value="$${esc(url)}" id="shUrl"><button class="btn pri" id="shCopy">$${ic('copy',18)}Salin</button></div>
              <div style="margin-top:10px;color:var(--muted);font-size:13px;display:flex;gap:14px;flex-wrap:wrap"><span>$${ic('clock',14)} $${status}</span><span>$${ic('lock',14)} $${info.has_password?'Dilindungi password':'Tanpa password'}</span><span>$${ic('pulse',14)} $${info.views||0}× dibuka</span></div>$${form}
              <div class="actions" style="justify-content:space-between"><button class="btn dng" id="shOff">Hentikan berbagi</button><span style="display:flex;gap:8px">$${info.has_password?'<button class="btn" id="shNoPw">Hapus password</button>':''}<button class="btn pri" id="shSave">Simpan</button></span></div>`;
            const inp = b.querySelector('#shUrl'); inp.onfocus = () => inp.select();
            b.querySelector('#shCopy').onclick = async () => { try { await navigator.clipboard.writeText(url); } catch(e){ inp.select(); document.execCommand('copy'); } toast('Tautan disalin'); };
            b.querySelector('#shOff').onclick = async () => draw(await api('share?id='+it.id,{revoke:true}));
            const np = b.querySelector('#shNoPw'); if (np) np.onclick = async () => { draw(await api('share?id='+it.id,{password:''})); toast('Password dihapus'); };
          }
          const collect = () => { const body={}; const ex=b.querySelector('#shExp').value; if (ex!=='') body.expires_days=+ex; const pw=b.querySelector('#shPw').value; if (pw) body.password=pw; const un=b.querySelector('#shUn'); if (un) body.unlock_at = un.value ? new Date(un.value).getTime()/1000 : 0; return body; };
          const on = b.querySelector('#shOn'); if (on) on.onclick = async () => { try { draw(await api('share?id='+it.id, collect())); } catch(e){toast(e.message);} };
          const sv = b.querySelector('#shSave'); if (sv) sv.onclick = async () => { try { draw(await api('share?id='+it.id, collect())); toast('Pengaturan disimpan'); } catch(e){toast(e.message);} };
        };
        draw(info);
      }

      /* ---------- dialog: detail, penyimpanan, akun ---------- */
      function detailDialog(it) {
