        };
        document.addEventListener('visibilitychange', async function vc() {
          if (!document.body.contains(m)) return document.removeEventListener('visibilitychange', vc);
          if (on && !document.hidden && navigator.wakeLock) { try { wl = await navigator.wakeLock.request('screen'); } catch(e) {} }
        });
        g('bcX').onclick = () => { stop(); m.remove(); };
