        </div>
      </div>
      <div id="gate" class="hidden"><div class="box"><div style="font-size:42px">🔒</div><h2>Hanya untuk owner</h2><p id="gateMsg">Masuk sebagai owner untuk membuka Studio Desain.</p><a class="btn pri" href="/">Ke HomeDrive</a></div></div>
      <div id="toasts"></div>
