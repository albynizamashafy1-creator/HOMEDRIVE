      def sanitize_design(d):
          """Saring JSON desain: hanya kunci & nilai yang dikenal, nilai tidak valid dibuang."""
          d = d if isinstance(d, dict) else {}
          out = {}
          for sec, spec in DESIGN_SPEC.items():
              src = d.get(sec)
              if not isinstance(src, dict):
                  continue
              r = {}
              for k, fn in spec.items():
                  if k in src:
                      v = fn(src[k])
                      if v is not None and v != "":
                          r[k] = v
              if r:
                  out[sec] = r
          for k, fn in DESIGN_TOP.items():
              if k in d:
                  v = fn(d[k])
                  if v is not None and v != "" and not (k == "mode" and v == "auto") and not (k == "motion" and v == "normal"):
                      out[k] = v
          cl = out.get("colors", {})
          if cl.get("acc") and not cl.get("acc2"):
              cl["acc2"] = _shift_hue(cl["acc"], 32)
          if cl.get("acc2") and not cl.get("acc"):
              cl["acc"] = _shift_hue(cl["acc2"], -32)
          return out


      # ---- generator CSS
      def _theme_vars(p):
          """Variabel warna satu tema; s2 dan garis diturunkan otomatis bila permukaan diubah tapi keduanya tidak."""
          p = dict(p or {})
          surf, txt = p.get("surface"), p.get("text") or None
          if surf and "s2" not in p:
              p["s2"] = _mix(surf, txt or ("#000000" if sum(_hex_rgb(surf)) > 382 else "#ffffff"), .045)
          if surf and "line" not in p:
              p["line"] = _mix(surf, txt or ("#000000" if sum(_hex_rgb(surf)) > 382 else "#ffffff"), .11)
          return "".join(f"--{k}:{p[k]};" for k in ("bg", "surface", "s2", "line", "text", "muted") if k in p)


