        const m = modal(`<h2>Penyimpanan</h2><div style="font-size:26px;font-weight:750;letter-spacing:-.5px">$${fmtSize(s.used)} <small style="font-size:14px;color:var(--muted);font-weight:500">$${s.quota?'dari '+fmtSize(s.quota):'terpakai'}</small></div>
          <div class="sbar" style="height:10px;margin-top:12px">$${segs}</div><div class="legend">$${rows}</div>
          <div class="sgrid"><div><small>Terpakai</small><b>$${fmtSize(s.used)}</b></div><div><small>Tersedia untuk Anda</small><b>$${s.available!=null?fmtSize(s.available):'—'}</b></div>
            $${s.quota?`<div><small>Kuota Anda</small><b>$${fmtSize(s.quota)}</b></div>`:''}
            $${st.disk&&st.disk.total?`<div><small>Disk server (total)</small><b>$${fmtSize(st.disk.total)}</b></div><div><small>Disk server (kosong)</small><b>$${fmtSize(st.disk.free)}</b></div><div><small>Disk server (terpakai)</small><b>$${fmtSize(st.disk.used)}</b></div>`:''}
            $${st.all_used!=null?`<div><small>Total pemakaian semua pengguna</small><b>$${fmtSize(st.all_used)}</b></div>`:''}</div>$${note}
          <div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);display:flex;justify-content:space-between"><span>$${st.folders} folder</span><span>Di sampah: $${fmtSize(st.trash)}</span></div><div class="actions">$${reqBtn}<button class="btn" id="sX">Tutup</button></div>`);
        wire(m);
      }

      function changePw() {
        const m = modal(`<h2>Ganti password</h2><label class="lbl">Password lama</label><input type="password" id="o" autocomplete="current-password"><label class="lbl">Password baru (min. 8 karakter)</label><input type="password" id="n" autocomplete="new-password"><div class="err" id="e"></div><div class="actions"><button class="btn" id="c">Batal</button><button class="btn pri" id="s">Simpan</button></div>`);
