              un = float(get_setting(c, "event_until", "0") or 0)
          except ValueError:
              un = 0
          RUNTIME["event"] = {"key": k, "style": max(0, min(2, st)), "until": un or None}


      def set_event(c, key, st, days, notify, uid, skip):
          """Aktifkan (atau hentikan, key kosong) event; dipakai tombol Luncurkan dan penjadwal."""
          until = time.time() + days * 86400 if (key and days) else 0
          set_setting(c, "event_key", key)
          set_setting(c, "event_style", str(st))
          set_setting(c, "event_until", str(until))
          RUNTIME["event"] = {"key": key, "style": st, "until": until or None} if key else None
          if key and notify:
              th = EVENT_THEME[key]
              for r in c.execute("SELECT id FROM users WHERE id<>?", (skip,)).fetchall():
                  notify_user(c, r["id"], th)
          log(c, uid, "event", EVENT_THEME[key]["name"] if key else "dihentikan")


      def notify_user(c, uid, th):
          notify(c, uid, "event", th["emo"] + " Event " + th["name"] + " dimulai!", "Buka HomeDrive dan coba fitur khas event ini.")


      def get_sched(c):
          try:
              lst = json.loads(get_setting(c, "event_sched", "[]"))
          except ValueError:
              return []
          return sorted([x for x in lst if isinstance(x, dict) and x.get("key") in EVENT_THEME and x.get("id")], key=lambda x: x.get("at", 0))


      def run_sched():
          """Jalankan jadwal event yang sudah jatuh tempo (dipanggil penjadwal tiap beberapa detik)."""
          now = time.time()
          with db() as c:
              lst = get_sched(c)
              due = [x for x in lst if x["at"] <= now]
              if not due:
                  return
              set_setting(c, "event_sched", json.dumps([x for x in lst if x["at"] > now]))
              x = due[-1]
              if x["days"] and x["at"] + x["days"] * 86400 <= now:
                  return
              ow = c.execute("SELECT id FROM users WHERE is_owner=1 LIMIT 1").fetchone()
              set_event(c, x["key"], x["style"], x["days"], x["notify"], ow["id"] if ow else None, 0)
              EVENTS.emit("users")
          EVENTS.flush()


      def sched_loop():
          while True:
              try:
                  run_sched()
              except Exception as e:  # noqa
                  sys.stderr.write("sched: %r\n" % (e,))
              time.sleep(15)


