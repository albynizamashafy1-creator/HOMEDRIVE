      def cctv_hw_get(self, c, u, p, sub, parts, q):
          owner = bool(p.get("owner"))
          if sub == "hw" and owner:
              return _done(self.send_json({"video": hw_video(), "audio": hw_audio(), "battery": hw_battery(), "spk": spk_dev(c), "ffmpeg": bool(FFMPEG)}))
          if sub == "devpoll" and len(parts) == 3:
              if not owner:
                  raise ApiError(403, "Hanya perangkat penyiar milik owner")
              r = get_cam(c, p, parts[2])
              cid = r["id"]
              pu = PUSH.setdefault(cid, {})
              try:
                  lv = (q.get("bat") or [""])[0]
                  if lv != "":
                      pu["bat"] = {"level": max(0, min(100, int(float(lv) * 100))), "chg": (q.get("chg") or ["0"])[0] == "1", "t": time.time()}
                      bat_note(cid, r["name"], pu["bat"]["level"], pu["bat"]["chg"])
              except ValueError:
                  pass
              pu["poll"] = time.time()

              def go():
                  qq = devq(cid)
                  out = []
                  with qq["cv"]:
                      if not qq["items"]:
                          qq["cv"].wait(12)
                      while qq["items"] and len(out) < 200:
                          out.append(qq["items"].popleft())
                  self.send_json({"items": out})
              return go
          return None


      def cctv_hw_post(self, c, u, p, sub, parts, q, d):
          owner = bool(p.get("owner"))
          if sub == "devcmd":
              if not p.get("talk"):
                  raise ApiError(403, "Anda tidak punya izin bicara/membunyikan perangkat")
              r = get_cam(c, p, d.get("cam"), "talk")
              if r["brand"] != "device":
                  raise ApiError(400, "Hanya untuk kamera dari HP/laptop")
              if time.time() - PUSH.get(r["id"], {}).get("poll", 0) > 30:
                  raise ApiError(409, "Perangkat belum menyiarkan atau halaman siarannya tertutup.")
              t = d.get("type")
              if t == "siren":
                  devq_put(r["id"], {"t": "siren", "s": _int(d.get("seconds"), 6, 1, 30)})
              elif t == "tts":
                  txt = re.sub(r"[\x00-\x1f]", " ", str(d.get("text") or "")).strip()[:300]
                  if not txt:
                      raise ApiError(400, "Teks kosong")
                  devq_put(r["id"], {"t": "tts", "text": txt})
              elif t == "stop":
                  devq_put(r["id"], {"t": "stop"})
              else:
                  raise ApiError(400, "Perintah tidak dikenal")
              log(c, u["id"], "cctv", "Perintah suara ke %s: %s" % (r["name"], t))
              return _done(self.send_json({"ok": True}))
          if not owner:
              return None
          if sub == "spk":
              if len(parts) == 3 and parts[2] == "set":
                  dev = str(d.get("device") or "default")[:40]
                  if not re.fullmatch(r"[A-Za-z0-9_:,.=-]{1,40}", dev):
                      raise ApiError(400, "Nama perangkat tidak valid")
                  set_setting(c, "local_spk", dev)
                  return _done(self.send_json({"ok": True}))
              if len(parts) == 3 and parts[2] == "test":
                  dev = spk_dev(c)

                  def go():
                      if not FFMPEG:
                          raise ApiError(503, "ffmpeg belum terpasang")
                      try:
                          r = subprocess.run([FFMPEG, "-loglevel", "error", "-nostdin", "-f", "lavfi", "-i", "sine=frequency=660:duration=1.2", "-af", "volume=0.6", "-f", "alsa", dev],
                                             stdout=subprocess.DEVNULL, stderr=subprocess.PIPE, timeout=15)
                      except subprocess.TimeoutExpired:
                          raise ApiError(504, "Speaker tidak merespons")
                      if r.returncode != 0:
                          raise ApiError(502, "Speaker server gagal: %s" % ((r.stderr or b"").decode("utf-8", "ignore").strip()[-150:] or "perangkat tidak ada (periksa /dev/snd di compose)"))
                      self.send_json({"ok": True})
                  return go
          return None



      PUSH = {}


      def cctv_push(self, c, u, p, parts, q):
          if not p.get("owner"):
              raise ApiError(403, "Hanya owner yang boleh menyiarkan kamera")
          r = get_cam(c, p, parts[2])
          if r["brand"] != "device":
              raise ApiError(400, "Ini bukan kamera perangkat")
          try:
              n = int((q.get("n") or ["0"])[0])
          except ValueError:
              raise ApiError(400, "Parameter tidak valid")
          sid = re.sub(r"[^A-Za-z0-9]", "", (q.get("s") or [""])[0])[:32]
          ln = int(self.headers.get("Content-Length") or 0)
          if ln > 8 * 1024 * 1024:
              raise ApiError(413, "Potongan video terlalu besar")
          data = self.rfile.read(ln)
          cid, now = r["id"], time.time()
          if n == 0:
              with CAMS_LOCK:
                  keep = {k: v for k, v in PUSH.get(cid, {}).items() if k in ("poll", "bat")}
                  PUSH[cid] = dict(keep, t=now, s=sid)
                  st = CAMS.get(cid)
                  if st is None:
                      st = CAMS[cid] = CamProc(cid)
                  cam_stop(st)
                  st.fails, st.next_try = 0, 0
                  cctv_tick()
          pu = PUSH.get(cid)
          st = CAMS.get(cid)
          if not pu or pu["s"] != sid or st is None or st.p is None or st.p.poll() is not None or st.p.stdin is None:
              raise ApiError(409, "Siaran perlu dimulai ulang", "restart")
          try:
              st.p.stdin.write(data)
              st.p.stdin.flush()
          except (OSError, ValueError):
              raise ApiError(409, "Siaran perlu dimulai ulang", "restart")
          pu["t"] = now
          return self.send_json({"ok": True, "online": live_fresh(cid, 12)}) and None


