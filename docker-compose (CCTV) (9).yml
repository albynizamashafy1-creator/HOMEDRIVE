        .sec{margin:16px 0 8px}
        .empty{padding:56px 16px}
      }
      /* ===== banner kuota, notifikasi ===== */
      .banner{--bc:#f59e0b;display:flex;align-items:center;gap:12px;margin:2px 26px 10px;padding:12px 14px 12px 16px;border-radius:20px;border:1px solid color-mix(in srgb,var(--bc) 35%,transparent);background:color-mix(in srgb,var(--bc) 11%,var(--surface));flex:none}
      .banner.lv2{--bc:#f97316}.banner.lv3{--bc:#ef4444}.banner.lv4{--bc:#64748b}
      .banner .bi{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--bc) 18%,transparent);color:var(--bc);flex:none}
      .banner .bt{flex:1;min-width:0;display:flex;flex-direction:column}.banner .bt span{color:var(--muted);font-size:13px}
      .pill.warn{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger)}
      .nfh{margin:16px 0 6px;font-size:12px;font-weight:750;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
      .acl.wrap .at span{white-space:normal}.acl .a.unread{background:var(--soft)}
      @media(max-width:900px){.banner{margin:2px 14px 8px;flex-wrap:wrap}.banner .btn{width:100%}}
      /* ===== v3: tampilan modern ===== */
      :root{--bg:#f3f4fa;--surface:#fff;--s2:#eff1f8;--line:rgba(26,30,70,.09);--text:#11132a;--muted:#686d8c;--r:22px;
        --sh:0 32px 80px -24px rgba(28,32,90,.38),0 10px 28px -12px rgba(28,32,90,.16);
        --sh2:0 1px 1px rgba(28,32,90,.04),0 8px 24px -14px rgba(28,32,90,.22);
        --glow:0 10px 26px -8px color-mix(in srgb,var(--acc) 62%,transparent),inset 0 1px 0 rgba(255,255,255,.25)}
      :root[data-theme=dark]{--bg:#08090f;--surface:#12141d;--s2:#1a1d29;--line:rgba(255,255,255,.08);--text:#eceef8;--muted:#8d93ad;
        --sh:0 32px 80px -24px rgba(0,0,0,.85),0 10px 28px -12px rgba(0,0,0,.6);--sh2:0 1px 1px rgba(0,0,0,.4),0 10px 26px -14px rgba(0,0,0,.7)}
      @media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#08090f;--surface:#12141d;--s2:#1a1d29;--line:rgba(255,255,255,.08);--text:#eceef8;--muted:#8d93ad;
        --sh:0 32px 80px -24px rgba(0,0,0,.85),0 10px 28px -12px rgba(0,0,0,.6);--sh2:0 1px 1px rgba(0,0,0,.4),0 10px 26px -14px rgba(0,0,0,.7)}}
      body{letter-spacing:-.006em;background:
        radial-gradient(1000px 600px at -8% -14%,color-mix(in srgb,var(--acc2) 20%,transparent),transparent 62%),
        radial-gradient(900px 640px at 108% 4%,color-mix(in srgb,var(--acc) 14%,transparent),transparent 60%),
        radial-gradient(800px 600px at 50% 120%,color-mix(in srgb,var(--acc2) 12%,transparent),transparent 60%),var(--bg);background-attachment:fixed}
      ::selection{background:color-mix(in srgb,var(--acc) 30%,transparent)}
      ::-webkit-scrollbar{width:8px;height:8px}

      /* tombol & input */
      .btn{min-height:40px;padding:8px 18px;border-radius:99px;font-weight:650;letter-spacing:-.01em;border:1px solid var(--line);background:var(--surface);box-shadow:var(--sh2);transition:transform .15s,box-shadow .15s,background .15s,filter .15s}
      .btn:hover{background:var(--s2);transform:translateY(-1px)}
      .btn:active{transform:scale(.97)}
      .btn.sm{min-height:34px;padding:5px 14px;font-size:13px}
      .btn.pri{background:linear-gradient(135deg,var(--acc),var(--acc2));border-color:transparent;box-shadow:var(--glow)}
      .btn.pri:hover{filter:brightness(1.08);background:linear-gradient(135deg,var(--acc),var(--acc2))}
      .btn.dng:hover{background:color-mix(in srgb,var(--danger) 10%,var(--surface))}
      .ibtn{border-radius:50%}
      input[type=text],input[type=password],input[type=number],select,textarea{border-radius:14px;padding:12px 15px;background:color-mix(in srgb,var(--s2) 60%,var(--surface));border-color:var(--line)}
      input[type=text]:focus,input[type=password]:focus,input[type=number]:focus,select:focus,textarea:focus{border-color:var(--acct);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 16%,transparent);background:var(--surface)}
      .pill{border-radius:99px}

      /* halaman masuk */
      #auth{overflow-x:hidden}
      #auth::before,#auth::after{content:"";position:fixed;width:540px;height:540px;border-radius:50%;filter:blur(100px);opacity:.45;pointer-events:none;animation:drift 20s ease-in-out infinite alternate}
      #auth::before{background:var(--acc);left:-160px;top:-180px}
      #auth::after{background:var(--acc2);right:-180px;bottom:-200px;animation-delay:-10s}
      @keyframes drift{to{transform:translate(70px,50px) scale(1.18)}}
      .acard{position:relative;z-index:1;border-radius:32px;padding:40px 36px;background:color-mix(in srgb,var(--surface) 78%,transparent);backdrop-filter:blur(28px) saturate(1.5);border:1px solid color-mix(in srgb,#fff 35%,var(--line));box-shadow:var(--sh)}
      .acard h1{font-size:30px;letter-spacing:-.9px}
      .acard .btn{min-height:50px;font-size:15px}
      .logo i{width:40px;height:40px;border-radius:14px}

      /* navigasi */
      nav a{border-radius:14px;padding:10px 14px;gap:12px;font-weight:620;transition:background .15s,color .15s,transform .15s}
      nav a:hover{transform:translateX(2px)}
      nav a.active{background:linear-gradient(90deg,color-mix(in srgb,var(--acc) 17%,transparent),color-mix(in srgb,var(--acc) 4%,transparent));color:var(--acct);box-shadow:none}
      nav a.active::before{display:block;content:"";left:0;top:11px;bottom:11px;width:3px;border-radius:0 3px 3px 0;background:var(--grad)}
      nav a.active svg{filter:drop-shadow(0 4px 8px color-mix(in srgb,var(--acc) 45%,transparent))}
      nav .nl{font-size:10.5px;letter-spacing:.14em;padding:16px 14px 6px}
      #newBtn{position:relative;overflow:hidden;border-radius:18px;min-height:50px;box-shadow:var(--glow)}
      #newBtn::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.3) 50%,transparent 70%);transform:translateX(-100%);transition:transform .65s}
      #newBtn:hover::after{transform:translateX(100%)}
      .storage{border-radius:22px;background:linear-gradient(160deg,color-mix(in srgb,var(--acc) 9%,var(--surface)),var(--surface));border:1px solid var(--line)}
      .ring{box-shadow:0 0 0 4px color-mix(in srgb,var(--rc,var(--acc)) 11%,transparent)}
      .logoutbtn{border-radius:14px;box-shadow:none;background:transparent;border-color:transparent}
      .logoutbtn:hover{background:color-mix(in srgb,var(--danger) 9%,transparent)}

      /* header */
      .search input{min-height:46px;border-radius:99px;background:color-mix(in srgb,var(--surface) 70%,var(--s2));border:1px solid var(--line);box-shadow:var(--sh2);transition:box-shadow .2s,border-color .2s}
      .search input:focus{box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 16%,transparent),var(--sh2)}
      .search input[type=text]{padding:12px 46px 12px 46px}
      header .ibtn{background:color-mix(in srgb,var(--surface) 70%,var(--s2));border:1px solid var(--line)}
      .avatar{width:42px;height:42px;border-radius:50%;box-shadow:0 0 0 3px var(--surface),0 0 0 4.5px color-mix(in srgb,var(--acc) 45%,transparent),var(--glow)}
      .seg{background:color-mix(in srgb,var(--s2) 80%,transparent);border:1px solid var(--line)}
      .chip{background:color-mix(in srgb,var(--surface) 80%,transparent);padding:7px 16px}
      .chip.on{background:var(--grad);color:#fff;border-color:transparent;box-shadow:var(--glow)}
      .sec{display:flex;align-items:center;gap:12px;font-size:11px;letter-spacing:.14em}
      .sec::after{content:"";flex:1;height:1px;background:var(--line)}

      /* kartu file & folder */
      .item{background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--sh2);transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s,border-color .2s,background .2s}
      .item:hover{transform:translateY(-4px);box-shadow:var(--sh);border-color:color-mix(in srgb,var(--acc) 30%,var(--line))}
      .item.file .thumb{margin:8px 8px 0;border-radius:16px}
      .item.sel{border-color:var(--acct);background:color-mix(in srgb,var(--acc) 9%,var(--surface));box-shadow:0 0 0 2px var(--acct),var(--sh2)}
      .item.folder{background:linear-gradient(135deg,color-mix(in srgb,var(--c,#f5a524) 17%,var(--surface)),var(--surface) 75%);border-color:color-mix(in srgb,var(--c,#f5a524) 20%,var(--line))}
      .item.folder .fi{border-radius:16px;background:linear-gradient(145deg,color-mix(in srgb,var(--c) 32%,transparent),color-mix(in srgb,var(--c) 12%,transparent));box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
      .item.ph{border-radius:14px;box-shadow:none;border:0}
      .item.ph:hover{transform:scale(1.025);box-shadow:var(--sh);z-index:2}
      .item .chk{border-radius:50%}
      .item.sel .chk{background:var(--grad);border-color:transparent}
      .nm{font-weight:620}
      .row{border-radius:16px}
      .row.head{backdrop-filter:blur(14px);background:color-mix(in srgb,var(--surface) 82%,transparent)}
      .empty .eic{width:104px;height:104px;background:linear-gradient(145deg,color-mix(in srgb,var(--acc) 22%,transparent),color-mix(in srgb,var(--acc2) 10%,transparent));box-shadow:inset 0 1px 0 rgba(255,255,255,.3),var(--sh2)}
      .banner{border-radius:22px}

      /* beranda: sapaan + pintasan kategori */
      .hero{margin:4px 0 6px}
      .hello h2{margin:6px 0 2px;font-size:28px;letter-spacing:-.9px;font-weight:800}
      .hello h2 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
      .hello p{margin:0;color:var(--muted)}
      .cats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0 2px}
      .cat{position:relative;overflow:hidden;display:flex;flex-direction:column;padding:16px;border-radius:22px;cursor:pointer;user-select:none;
        background:linear-gradient(150deg,color-mix(in srgb,var(--c) 18%,var(--surface)),var(--surface) 80%);border:1px solid color-mix(in srgb,var(--c) 18%,var(--line));
        box-shadow:var(--sh2);transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s}
      .cat::after{content:"";position:absolute;right:-26px;top:-26px;width:90px;height:90px;border-radius:50%;background:color-mix(in srgb,var(--c) 14%,transparent)}
      .cat:hover{transform:translateY(-3px);box-shadow:var(--sh)}
      .cat .ci{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;margin-bottom:12px;color:var(--c);background:color-mix(in srgb,var(--c) 20%,transparent);position:relative;z-index:1}
      .cat b{font-size:15px;letter-spacing:-.2px}
      .cat small{color:var(--muted);font-size:12.5px;margin-top:1px}

      /* melayang: bilah pilihan, menu, dialog, notifikasi */
      #selbar{background:color-mix(in srgb,var(--text) 92%,transparent);backdrop-filter:blur(20px) saturate(1.5);border-radius:99px;box-shadow:var(--sh);border:1px solid rgba(255,255,255,.08)}
      #selbar button{border-radius:99px}
      .menu{background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(22px) saturate(1.5);box-shadow:var(--sh);border:1px solid var(--line);padding:7px}
      .menu button{border-radius:12px;padding:10px 12px}
      .menu button:hover{background:color-mix(in srgb,var(--acc) 10%,transparent)}
      .mbg{background:rgba(8,10,22,.5);backdrop-filter:blur(10px)}
      .modal{border:1px solid var(--line);box-shadow:var(--sh)}
      .modal h2{font-size:21px;letter-spacing:-.5px}
      .toast{border-radius:99px;backdrop-filter:blur(14px);box-shadow:var(--sh)}
      #uploads{border-radius:26px;background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(20px) saturate(1.4)}
      #preview{background:rgba(6,8,14,.92);backdrop-filter:blur(18px) saturate(1.2)}
      .pvb{border-radius:50%}

      @media(min-width:901px){
        aside{border-radius:32px;background:color-mix(in srgb,var(--surface) 72%,transparent);backdrop-filter:blur(26px) saturate(1.4);border:1px solid var(--line);box-shadow:var(--sh2);padding:20px 14px 14px}
        .mainc{border-radius:32px;border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 84%,transparent);backdrop-filter:blur(26px) saturate(1.4)}
        .crumbs button{font-size:26px;letter-spacing:-.9px}
