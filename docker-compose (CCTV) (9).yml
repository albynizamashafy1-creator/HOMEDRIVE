        const cell = (l, v) => `<div><small>$${l}</small><b>$${v}</b></div>`;
        const row = (title, val, bad, btn) => `<div class="setrow"><div class="st"><b>$${title}</b></div><em class="pill $${bad?'warn':'ok'}" style="margin:0">$${val}</em>$${btn||''}</div>`;
