      /* ---------- 17 AGUSTUS: Kuis Kemerdekaan ---------- */
      function kuisDialog() {
        var y = new Date().getFullYear(), hut = y - 1945;
        var Q = [
          ['Kapan Proklamasi Kemerdekaan Indonesia dibacakan?', '17 Agustus 1945', ['17 Agustus 1944', '17 Agustus 1946', '17 Agustus 1950']],
          ['Siapa yang membacakan teks Proklamasi?', 'Soekarno', ['Mohammad Hatta', 'Sutan Sjahrir', 'Ahmad Soebardjo']],
          ['Siapa yang menjahit Bendera Pusaka Merah Putih?', 'Fatmawati', ['Kartini', 'Cut Nyak Dien', 'Dewi Sartika']],
          ['Di mana Proklamasi dibacakan?', 'Jl. Pegangsaan Timur No. 56, Jakarta', ['Lapangan Ikada', 'Gedung Sate, Bandung', 'Istana Merdeka']],
          ['Siapa yang mengetik naskah Proklamasi?', 'Sayuti Melik', ['Mohammad Yamin', 'Ki Hajar Dewantara', 'Tan Malaka']],
          ['Peristiwa pengamanan Soekarno-Hatta oleh para pemuda sebelum Proklamasi disebut?', 'Peristiwa Rengasdengklok', ['Peristiwa Bandung Lautan Api', 'Peristiwa Surabaya', 'Peristiwa Madiun']],
          ['Pukul berapa Proklamasi dibacakan?', '10.00 pagi', ['07.00 pagi', '12.00 siang', '17.00 sore']],
          ['Siapa pencipta lagu Indonesia Raya?', 'W.R. Supratman', ['Ismail Marzuki', 'C. Simanjuntak', 'H. Mutahar']],
          ['Tahun ' + y + ', Indonesia merayakan HUT RI yang ke berapa?', 'ke-' + hut, ['ke-' + (hut - 1), 'ke-' + (hut + 1), 'ke-' + (hut + 5)]],
          ['Dalam bendera Merah Putih, warna merah melambangkan?', 'Keberanian', ['Kesucian', 'Kemakmuran', 'Kedamaian']]
        ];
        var order = shuffle(Q), idx = 0, score = 0, best = +(localStorage.getItem('kuisBest') || 0);
        var m = modal('<h2>🏆 Kuis Kemerdekaan</h2><div id="kzB"></div>');
        var show = function() {
          var b = m.querySelector('#kzB');
          if (idx >= order.length) {
            var nb = score > best; if (nb) { best = score; try { localStorage.setItem('kuisBest', String(score)); } catch(e) {} }
            var msg = score >= 9 ? 'Pejuang sejati! Merdeka!' : score >= 7 ? 'Hebat, wawasan sejarahmu luas.' : score >= 4 ? 'Lumayan, ayo pelajari lagi!' : 'Semangat, sejarah menunggu untuk dijelajahi.';
            if (score >= 8) XM.burst(60);
            b.innerHTML = '<div class="spbig"><b>' + score + '/' + order.length + '</b></div><div class="spstate">' + msg + (nb ? ' Rekor baru!' : '') + '</div><div class="sgrid"><div><small>Skor terbaik</small><b>' + best + '/10</b></div><div><small>Skor sekarang</small><b>' + score + '/10</b></div></div><div class="actions"><button class="btn" id="kzX">Tutup</button><button class="btn pri" id="kzR">Main lagi</button></div>';
            b.querySelector('#kzX').onclick = function() { m.remove(); };
            b.querySelector('#kzR').onclick = function() { order = shuffle(Q); idx = 0; score = 0; show(); };
            return;
          }
          var q = order[idx], opts = shuffle([q[1]].concat(q[2]));
          b.innerHTML = '<div class="hint" style="margin:0 0 8px">Soal ' + (idx + 1) + ' dari ' + order.length + ' · Skor ' + score + ' · Terbaik ' + best + '</div><div class="pb2"><b style="width:' + (idx / order.length * 100) + '%"></b></div><p style="font-weight:650;font-size:16px;margin:14px 0">' + esc(q[0]) + '</p><div class="kzo">' + opts.map(function(o) { return '<button class="btn" data-o="' + esc(o) + '">' + esc(o) + '</button>'; }).join('') + '</div>';
          b.querySelector('.kzo').onclick = function(ev) {
            var t = ev.target.closest('[data-o]'); if (!t || b.dataset.lock) return; b.dataset.lock = '1';
            var ok = t.dataset.o === q[1]; if (ok) score++;
            b.querySelectorAll('[data-o]').forEach(function(x) { if (x.dataset.o === q[1]) x.classList.add('kok'); else if (x === t) x.classList.add('kbad'); });
            setTimeout(function() { delete b.dataset.lock; idx++; show(); }, 900);
          };
        };
        show();
      }

