              out = {"mode": STATE["mode"], "model": STATE["model"], "w": img.shape[1], "h": img.shape[0], "detections": dets, "age_ready": aged, "age_state": AGE["state"]}
              if (q.get("annotate") or ["0"])[0] == "1":
                  ok, jpg = cv2.imencode(".jpg", annotate(img.copy(), dets), [cv2.IMWRITE_JPEG_QUALITY, 85])
                  if ok:
                      out["image"] = base64.b64encode(jpg.tobytes()).decode()
              self.send(out)


      def main():
          threading.Thread(target=model_loader, daemon=True).start()
          threading.Thread(target=age_loader, daemon=True).start()
          srv = ThreadingHTTPServer(("0.0.0.0", PORT), H)
          srv.daemon_threads = True
          print("HomeDrive AI berjalan di port", PORT, flush=True)
          srv.serve_forever()


      if __name__ == "__main__":
          main()
