        const rail = $$('#rail'); TABS.forEach(([k, l]) => rail.append(el('button', { type: 'button', 'data-t': k, html: ic(k) + '<span>' + l + '</span>', onclick: () => setTab(k) })));
      }
      addEventListener('keydown', e => {
        const k = e.key.toLowerCase(), m = e.ctrlKey || e.metaKey, inField = /^(INPUT|TEXTAREA)$$/.test((document.activeElement || {}).tagName) && document.activeElement.type !== 'range' && document.activeElement.type !== 'color';
        if (m && k === 's') { e.preventDefault(); if (!$$('#pubBtn').disabled) publish(); }
        else if (m && k === 'z' && !inField) { e.preventDefault(); e.shiftKey ? redo() : undo(); } else if (m && k === 'y' && !inField) { e.preventDefault(); redo(); }
      });
      addEventListener('beforeunload', e => { if (isDirty()) { e.preventDefault(); e.returnValue = ''; } });

      /* ---------- mulai ---------- */
      (async function init() {
        bar();
        try { const j = await loadLib(); ST.draft = clone(j.design); ST.clean = clone(j.design); ST.css = j.css; }
        catch (e) { return gate(e.status === 401 ? 'Silakan masuk sebagai owner HomeDrive terlebih dahulu, lalu buka Studio Desain lagi.' : e.status === 403 ? 'Akun Anda bukan owner. Hanya owner yang boleh mengubah tampilan.' : e.message); }
        $$('#pv').src = '/?dsgpreview=1'; layoutStage(); renderPanel(); status(); syncHist();
        try { const s = JSON.parse(localStorage.getItem('dsgDraft') || 'null'); if (s && s.draft && stable(s.draft) !== stable(ST.pub)) {
          const bg = modal('Lanjutkan draf?', el('p', { text: 'Ada draf yang belum diterbitkan dari ' + new Date(s.ts).toLocaleString('id-ID') + '. Mau melanjutkannya?' }), [btn('Buang', () => { localStorage.removeItem('dsgDraft'); bg.remove(); }), btn('Lanjutkan draf', () => { bg.remove(); loadDraft(s.draft); }, 'pri')]); } } catch (e) {}
      })();
      </script>
