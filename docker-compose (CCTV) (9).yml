          else if (k==='audio') b.innerHTML = `<div class="nopv"><div class="eic">$${ic('music',44)}</div><div style="margin-bottom:16px">$${esc(f.name)}</div><audio src="$${u}" controls autoplay></audio></div>`;
          else if (k==='pdf') b.innerHTML = `<iframe src="$${u}"></iframe>`;
          else if (k==='text') {
            b.innerHTML = '<div class="nopv">Memuat…</div>';
            try {
              if (f.size > 1e6) throw 0;
              const text = await fetch(u,{credentials:'same-origin'}).then(r=>r.text()); if (cur()!==f) return;
              const draw = editing => {
                b.innerHTML = `<div class="txt"><div class="bar">$${editing?`<button class="btn sm" id="txC">Batal</button><button class="btn pri sm" id="txS">$${ic('check',16)}Simpan</button>`:`<button class="btn sm" id="txE" style="background:transparent;color:#fff;border-color:rgba(255,255,255,.3)">$${ic('edit',16)}Edit</button><button class="btn sm" id="txH" style="background:transparent;color:#fff;border-color:rgba(255,255,255,.3)">Riwayat versi</button>`}</div>$${editing?'<textarea id="txA" spellcheck="false"></textarea>':'<pre id="txP"></pre>'}</div>`;
                if (editing) { const a=b.querySelector('#txA'); a.value=text; a.focus(); b.querySelector('#txC').onclick=()=>draw(false);
                  b.querySelector('#txS').onclick = async () => { try { await api('savetext',{id:f.id,content:b.querySelector('#txA').value}); toast('Tersimpan'); load(true,true); close(); } catch(e){storeErr(e);} }; }
                else { b.querySelector('#txP').textContent = text; b.querySelector('#txE').onclick=()=>draw(true); b.querySelector('#txH').onclick=()=>versionDialog(f, () => { load(true,true); close(); }); }
