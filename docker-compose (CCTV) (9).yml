      def tool_calc(ctx, a):
          import ast
          import operator
          ops = {ast.Add: operator.add, ast.Sub: operator.sub, ast.Mult: operator.mul, ast.Div: operator.truediv, ast.Pow: operator.pow, ast.Mod: operator.mod,
                 ast.FloorDiv: operator.floordiv, ast.USub: operator.neg, ast.UAdd: operator.pos}

          def ev(n):
              if isinstance(n, ast.Constant) and isinstance(n.value, (int, float)) and not isinstance(n.value, bool):
                  return n.value
              if isinstance(n, ast.BinOp) and type(n.op) in ops:
                  l, r = ev(n.left), ev(n.right)
                  if isinstance(n.op, ast.Pow) and abs(r) > 100:
                      raise ValueError("pangkat terlalu besar")
                  return ops[type(n.op)](l, r)
              if isinstance(n, ast.UnaryOp) and type(n.op) in ops:
                  return ops[type(n.op)](ev(n.operand))
              raise ValueError("ekspresi tidak didukung")
          try:
              v = ev(ast.parse(str(a.get("expression") or "").replace("^", "**").replace(",", ".").replace("x", "*"), mode="eval").body)
          except (SyntaxError, ZeroDivisionError, OverflowError, TypeError) as e:
              raise ValueError("tidak bisa menghitung: %s" % e)
          return {"hasil": round(v, 10) if isinstance(v, float) else v}


      from fractions import Fraction as _Fr
      import math as _math


      def _fs(v):
          if isinstance(v, _Fr):
              return str(v.numerator) if v.denominator == 1 else "%d/%d" % (v.numerator, v.denominator)
          return ("%.10g" % v)


      def _sev(node, x=None):
          import ast
          if isinstance(node, ast.Constant) and isinstance(node.value, (int, float)) and not isinstance(node.value, bool):
              return _Fr(str(node.value))
          if isinstance(node, ast.Name) and node.id == "x" and x is not None:
              return x
          if isinstance(node, ast.BinOp):
              l, r = _sev(node.left, x), _sev(node.right, x)
              if isinstance(node.op, ast.Add):
                  return l + r
              if isinstance(node.op, ast.Sub):
                  return l - r
              if isinstance(node.op, ast.Mult):
                  return l * r
              if isinstance(node.op, ast.Div):
                  return l / r
              if isinstance(node.op, ast.Pow):
                  if r.denominator != 1 or abs(r) > 12:
                      raise ValueError("pangkat tidak didukung")
                  return l ** int(r)
          if isinstance(node, ast.UnaryOp):
              v = _sev(node.operand, x)
              return -v if isinstance(node.op, ast.USub) else v
          raise ValueError("ekspresi tidak didukung")


      def _prep(t):
          t = str(t).lower().replace("^", "**").replace("×", "*").replace("÷", "/").replace(",", ".").replace(" ", "")
          t = re.sub(r"(\d|\)|x)(?=x|\()", r"\1*", t)
          t = re.sub(r"(?<=x)(?=\d)", "*", t)
          return t


      def tool_math_solve(ctx, a):
          """Selesaikan persamaan linear/kuadrat satu variabel x secara eksak, lengkap dengan langkah."""
          import ast
          eq = str(a.get("equation") or "").replace("²", "^2")
          if "=" not in eq:
              raise ValueError("Tulis persamaan dengan tanda sama dengan, mis. 2x+3=11")
          l, r = eq.split("=", 1)
          try:
              lt, rt = ast.parse(_prep(l), mode="eval").body, ast.parse(_prep(r), mode="eval").body
              f = lambda v: _sev(lt, v) - _sev(rt, v)
              c, f1, fm = f(_Fr(0)), f(_Fr(1)), f(_Fr(-1))
              A, B = (f1 + fm) / 2 - c, (f1 - fm) / 2
              if f(_Fr(2)) != 4 * A + 2 * B + c or f(_Fr(3)) != 9 * A + 3 * B + c:
                  raise ValueError("hanya persamaan linear dan kuadrat satu variabel (x) yang didukung")
          except (SyntaxError, ZeroDivisionError, TypeError) as e:
              raise ValueError("persamaan tidak bisa dibaca (%s)" % e)
          st = ["Pindahkan semua suku ke satu ruas: %s x² + %s x + %s = 0" % (_fs(A), _fs(B), _fs(c))]
          if A == 0:
              if B == 0:
                  return {"langkah": st, "jawaban": "Semua x memenuhi" if c == 0 else "Tidak ada solusi"}
              x = -c / B
              st += ["Persamaan linear: %s x = %s" % (_fs(B), _fs(-c)), "x = %s / %s = %s" % (_fs(-c), _fs(B), _fs(x))]
              return {"langkah": st, "jawaban": "x = " + _fs(x), "desimal": round(float(x), 6)}
          D = B * B - 4 * A * c
          st.append("Diskriminan D = b² − 4ac = %s" % _fs(D))
          if D < 0:
              return {"langkah": st, "jawaban": "Tidak ada akar real (D < 0)"}
          if _math.isqrt(D.numerator) ** 2 == D.numerator and _math.isqrt(D.denominator) ** 2 == D.denominator:
              root = _Fr(_math.isqrt(D.numerator), _math.isqrt(D.denominator))
              x1, x2 = (-B + root) / (2 * A), (-B - root) / (2 * A)
              st.append("x = (−b ± √D) / 2a = (%s ± %s) / %s" % (_fs(-B), _fs(root), _fs(2 * A)))
              return {"langkah": st, "jawaban": ("x₁ = %s, x₂ = %s" % (_fs(x1), _fs(x2))) if x1 != x2 else "x = %s (akar kembar)" % _fs(x1)}
          x1, x2 = (-float(B) + _math.sqrt(float(D))) / (2 * float(A)), (-float(B) - _math.sqrt(float(D))) / (2 * float(A))
          st.append("x = (%s ± √%s) / %s" % (_fs(-B), _fs(D), _fs(2 * A)))
          return {"langkah": st, "jawaban": "x₁ ≈ %.6g, x₂ ≈ %.6g" % (x1, x2)}


      def _primes(n):
          out, d = [], 2
          while d * d <= n:
              while n % d == 0:
                  out.append(d)
                  n //= d
              d += 1
          if n > 1:
              out.append(n)
          return out


      def tool_number_theory(ctx, a):
          nums = [int(float(x)) for x in (a.get("numbers") or [])][:6]
          op = str(a.get("op") or "")
          if not nums or any(n < 1 or n > 10 ** 12 for n in nums):
              raise ValueError("Masukkan bilangan bulat positif (maksimal 10^12)")
          fx = lambda n: " × ".join(map(str, _primes(n))) if n > 1 else "1"
          if op == "faktor_prima":
              return {"faktorisasi": {str(n): fx(n) for n in nums}}
          g = nums[0]
          for n in nums[1:]:
              g = _math.gcd(g, n)
          l = nums[0]
          for n in nums[1:]:
              l = l * n // _math.gcd(l, n)
          return {"FPB": g, "KPK": l, "faktorisasi": {str(n): fx(n) for n in nums}}


