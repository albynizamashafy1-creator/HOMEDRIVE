          + `<div class="setrow"><div class="st"><b>Mikrofon & speaker</b><small>$${j.audio.length > 1 ? j.audio.length - 1 + ' perangkat suara terdeteksi' : 'Hanya perangkat bawaan (teruskan /dev/snd di compose agar terdeteksi)'}</small></div></div>`
