          + `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px"><button class="btn sm" id="hwTest">$${ic('vol',15)}Uji speaker server</button><button class="btn sm" id="hwTalk">$${ic('mic',15)}<span>Bicara ke speaker server</span></button><button class="btn sm" id="hwNew">$${ic('camera',15)}Tambah webcam server</button></div>`);
        const g = id => box.querySelector('#' + id);
        g('hwSpk').onchange = async () => { try { await api('cctv/spk/set', {device:g('hwSpk').value}); toast('Speaker server disimpan'); } catch(er) { toast(er.message); } };
        g('hwTest').onclick = async () => { try { await api('cctv/spk/test', {}); toast('Nada uji diputar di speaker server'); } catch(er) { toast(er.message); } };
        g('hwNew').onclick = () => cctCamForm(null, {mode:'local'});
        let T = null; const tk = g('hwTalk'), lab = (on, t) => { tk.classList.toggle('pri', on); tk.innerHTML = ic('mic',15) + '<span>' + t + '</span>'; };
        tk.onclick = async () => { if (T) { T.stop(); return; } tk.disabled = true; try { T = CCT.talk = await cctTalk({id:'server'}, msg => { T = null; CCT.talk = null; lab(false, 'Bicara ke speaker server'); if (msg) toast(msg); }); lab(true, 'Bicara… (klik berhenti)'); } catch(er) { if (er.message) toast(er.message); } finally { tk.disabled = false; } };
      }
      function cctBroadcast(c) {
        if (!c) return;
        if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) { cctCamHelp(); return; }
        let stream = null, rec = null, wl = null, on = false, sid = '', n = 0, q = [], sending = false, sent = 0, restarts = 0, bat = null, poll = 0, ac = null, nextT = 0, osc = null;
        const m = modal(`<h2>Siarkan: $${esc(c.name)}</h2><video id="bcV" muted playsinline autoplay style="width:100%;border-radius:12px;background:#000;aspect-ratio:16/9"></video>`
          + `<div class="cfld"><div><label class="lbl">Kamera</label><select id="bcFace"><option value="environment">Belakang</option><option value="user">Depan / laptop</option></select></div><div><label class="lbl">Kualitas</label><select id="bcQ"><option value="480">480p (hemat data)</option><option value="720" selected>720p</option></select></div></div>`
          + `<div class="chk"><div><b>Ikutkan suara</b></div><label class="sw"><input type="checkbox" id="bcA" checked><i></i></label></div><div class="chk"><div><b>Putar suara dari server di perangkat ini</b><small style="display:block;color:var(--muted)">Bicara dari panel, sirene, dan pesan suara dari owner akan terdengar di speaker perangkat ini.</small></div><label class="sw"><input type="checkbox" id="bcSp" checked><i></i></label></div><div class="cres" id="bcB">Baterai: memeriksa…</div><div id="bcS" class="cres">Siap. Klik Mulai, izinkan kamera, lalu biarkan halaman ini terbuka.</div>`
          + `<p class="hint">Layar HP dijaga tetap menyala selama siaran. Colokkan pengisi daya. Menutup jendela ini menghentikan siaran. Kamera ini bisa dilihat di tab Siaran langsung dan memakai deteksi gerakan/AI/rekaman seperti kamera lain.</p>`
          + `<div class="actions"><button class="btn" id="bcX">Tutup</button><button class="btn pri" id="bcGo">Mulai siaran</button></div>`, 'cwide');
        const g = id => m.querySelector('#' + id), st = (t, cls) => { g('bcS').className = 'cres ' + (cls || ''); g('bcS').textContent = t; };
        const mime = () => ['video/webm;codecs=vp8,opus', 'video/webm;codecs=vp9,opus', 'video/webm', 'video/mp4'].find(t => MediaRecorder.isTypeSupported(t)) || '';
        const pump = async () => {
          if (sending) return; sending = true;
          try {
            while (q.length && on) {
              const blob = q[0];
              const r = await fetch(`/api/cctv/push/$${c.id}?s=$${sid}&n=$${n}`, {method:'POST', credentials:'same-origin', headers:{'X-Requested-With':'drive','Content-Type':'application/octet-stream'}, body:blob});
              if (r.status === 409) { q = []; sending = false; return startRec(true); }
              if (!r.ok) throw new Error('Server menolak (' + r.status + ')');
              q.shift(); n++; sent += blob.size; st('Menyiarkan · ' + (sent / 1048576).toFixed(1) + ' MB terkirim' + (restarts ? ' · tersambung ulang ' + restarts + '×' : ''), 'ok');
              if (q.length > 12) { q = []; sending = false; return startRec(true); }
            }
          } catch(er) { st('Koneksi bermasalah: ' + er.message + ' — mencoba lagi…', 'bad'); setTimeout(() => { sending = false; if (on) startRec(true); }, 3000); return; }
          sending = false;
        };
        const startRec = restart => {
          if (!on) return;
          try { if (rec && rec.state !== 'inactive') { rec.ondataavailable = null; rec.stop(); } } catch(e) {}
          sid = Math.random().toString(36).slice(2, 12); n = 0; q = []; if (restart) restarts++;
          const mt = mime(), bits = g('bcQ').value === '480' ? 600000 : 1200000;
          rec = new MediaRecorder(stream, Object.assign({videoBitsPerSecond:bits}, mt ? {mimeType:mt} : {}));
          rec.ondataavailable = e => { if (e.data && e.data.size) { q.push(e.data); pump(); } };
          rec.onerror = () => st('Perekam error, mencoba ulang…', 'bad');
