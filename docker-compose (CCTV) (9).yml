      def design_asset_kind(raw, ext):
          """Cek tanda berkas (magic bytes) supaya hanya gambar/font asli yang diterima."""
          head = raw[:16]
          chk = {"png": head.startswith(b"\x89PNG"), "jpg": head.startswith(b"\xff\xd8\xff"), "gif": head[:4] == b"GIF8",
                 "webp": head[:4] == b"RIFF" and raw[8:12] == b"WEBP", "avif": raw[4:12] in (b"ftypavif", b"ftypavis"),
                 "svg": b"<svg" in raw[:2048].lower(), "woff2": head[:4] == b"wOF2", "woff": head[:4] == b"wOFF",
                 "ttf": head[:4] in (b"\x00\x01\x00\x00", b"true"), "otf": head[:4] == b"OTTO"}
          return chk.get(ext, False)

      # ===================== PWA: aplikasi yang bisa dipasang di HP & laptop =====================
      import struct, threading, zlib

      _ICONS = {}
      _ICON_LOCK = threading.Lock()


      def _png(w, h, rows):
          def chunk(t, d):
              return struct.pack(">I", len(d)) + t + d + struct.pack(">I", zlib.crc32(t + d) & 0xFFFFFFFF)
          raw = b"".join(b"\x00" + r for r in rows)
          return b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", struct.pack(">IIBBBBB", w, h, 8, 6, 0, 0, 0)) + chunk(b"IDAT", zlib.compress(raw, 6)) + chunk(b"IEND", b"")


      def _make_icon_py(size, c1, c2, full):
          """Gambar ikon (kotak gradien + simbol drive) tanpa pustaka tambahan, anti-alias 2x2."""
          a, b = _hex_rgb(c1), _hex_rgb(c2)
          s = size / 512.0
          rad = 0 if full else 118 * s
          # simbol: trapesium putih, celah gelap, titik LED (koordinat 512)
          tz = [(128, 340), (384, 340), (333, 180), (179, 180)]
          def in_trap(x, y):
              if y < 180 or y > 340:
                  return False
              t = (y - 180) / 160.0
              return (179 + (128 - 179) * t) <= x <= (333 + (384 - 333) * t)
          def in_slot(x, y):
              return 296 <= y <= 314 and 168 <= x <= 300
          def in_led(x, y):
              return (x - 340) ** 2 + (y - 305) ** 2 <= 100
          rows = []
          for py in range(size):
              row = bytearray()
              for px in range(size):
                  r = g = bl = al = 0.0
                  for sy in (.25, .75):
                      for sx in (.25, .75):
                          X, Y = px + sx, py + sy
                          inside = True
                          if rad:
                              cx = min(max(X, rad), size - rad); cy = min(max(Y, rad), size - rad)
                              inside = (X - cx) ** 2 + (Y - cy) ** 2 <= rad * rad
                          if not inside:
                              continue
                          t = (X + Y) / (2.0 * size)
                          col = [a[i] + (b[i] - a[i]) * t for i in range(3)]
                          gx, gy = X / s, Y / s
                          if in_trap(gx, gy):
                              col = [255, 255, 255]
                              if in_slot(gx, gy):
                                  col = [a[i] * .85 + 20 for i in range(3)]
                              if in_led(gx, gy):
                                  col = [b[i] for i in range(3)]
                          r += col[0]; g += col[1]; bl += col[2]; al += 1
                  if al:
                      row += bytes((int(r / al), int(g / al), int(bl / al), int(255 * al / 4)))
                  else:
                      row += b"\x00\x00\x00\x00"
              rows.append(bytes(row))
          return _png(size, size, rows)


      def _make_icon_logo(size, logo_path, full):
          try:
              from PIL import Image
          except Exception:
              return None
          try:
              im = Image.open(logo_path).convert("RGBA")
              bg = Image.new("RGBA", (size, size), (255, 255, 255, 255) if full else (0, 0, 0, 0))
              pad = int(size * (.2 if full else .06))
              im.thumbnail((size - 2 * pad, size - 2 * pad))
              bg.paste(im, ((size - im.width) // 2, (size - im.height) // 2), im)
              import io
              out = io.BytesIO(); bg.save(out, "PNG"); return out.getvalue()
          except Exception:
              return None


      def pwa_icon(size, full=False):
          d = RUNTIME["design"]
          cl = d.get("colors", {})
          c1, c2 = cl.get("acc", "#5b5ff0"), cl.get("acc2", "#8b5cf6")
          br = d.get("brand", {})
          logo = br.get("logo_url", "") if br.get("logo") == "image" else ""
          key = (size, full, c1, c2, logo)
          with _ICON_LOCK:
              if key in _ICONS:
                  return _ICONS[key]
          data = None
          if logo.startswith("/design/asset/") and not logo.endswith((".svg", ".avif")):
              data = _make_icon_logo(size, DESIGN_DIR / logo.rsplit("/", 1)[-1], full)
          if data is None:
              data = _make_icon_py(size, c1, c2, full)
          with _ICON_LOCK:
              if len(_ICONS) > 24:
                  _ICONS.clear()
              _ICONS[key] = data
          return data


