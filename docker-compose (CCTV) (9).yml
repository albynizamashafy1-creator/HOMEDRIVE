      };
      const ic = (n, sz=20, cls='') => `<svg class="ic $${cls}" width="$${sz}" height="$${sz}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">$${I[n]||''}</svg>`;

      /* ---------- desain buatan owner (Studio Desain) ---------- */
      const DSG = {
        d: {}, ver: '', def: null, pvTheme: 'auto', pvLocked: false, favDef: '',
        preview: /[?&]dsgpreview=1/.test(location.search), safe: /[?&]nodesign=1/.test(location.search),
        get b() { return this.d.brand || {}; },
        name() { return this.b.name || 'HomeDrive'; },
        pal() { const c = this.d.colors || {}; return c.acc ? [c.acc, c.acc2 || c.acc] : null; },
        locked() { return !!this.d.lock; },
        mode() { return this.d.mode === 'light' || this.d.mode === 'dark' ? this.d.mode : ''; },
        logoHtml() {
          const b = this.b;
          if (b.logo === 'image' && b.logo_url) return '<img src="' + esc(b.logo_url) + '" alt="">';
          if (b.logo === 'emoji' && b.emoji) return '<span class="lem">' + esc(b.emoji) + '</span>';
          return ic('drive', 20);
        },
        paintLogos() {
          const img = this.b.logo === 'image' && !!this.b.logo_url, h = this.logoHtml();
          ['authLogo', 'authLogo2', 'sideLogo'].forEach(id => { const e = document.getElementById(id); if (e) { e.innerHTML = h; e.classList.toggle('limg', img); } });
        },
        favicon() {
          const l = document.querySelector('link[rel=icon]'); if (!l) return;
          if (!this.favDef) this.favDef = l.getAttribute('href');
          const b = this.b; let h = this.favDef;
          if (b.logo === 'image' && b.logo_url) h = b.logo_url;
          else if (b.logo === 'emoji' && b.emoji) h = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><text x="16" y="26" font-size="26" text-anchor="middle">' + esc(b.emoji) + '</text></svg>');
          l.removeAttribute('type'); if (l.getAttribute('href') !== h) l.setAttribute('href', h);
        },
        title() { document.title = (typeof S !== 'undefined' && S.unread > 0 ? '(' + S.unread + ') ' : '') + this.name(); },
        auth() {
          const l = this.d.login || {};
          if (!this.def) {
            const fs = [...document.querySelectorAll('.afeat > div')];
            this.def = { text: $$('.abrand .abody > p').textContent, foot: $$('.abrand small').textContent, f: fs.map(d => { const t = [...d.childNodes].find(n => n.nodeType === 3); return t ? t.nodeValue : ''; }) };
          }
          if (l.title) $$('.abrand h2').textContent = l.title;
          $$('.abrand .abody > p').textContent = l.text || this.def.text;
          $$('.abrand small').textContent = l.foot || this.def.foot;
          document.querySelectorAll('.afeat > div').forEach((d, i) => { const t = [...d.childNodes].find(n => n.nodeType === 3), v = l['f' + (i + 1)]; if (t) t.nodeValue = v || this.def.f[i]; });
          if (!setupMode) { if (l.welcome) $$('#authTitle').textContent = l.welcome; if (l.sub) $$('#authSub').textContent = l.sub; }
        },
        apply(d) {
          this.d = this.safe ? {} : (d || {});
          document.querySelectorAll('.logo .bn').forEach(e => { e.textContent = this.name(); });
          this.paintLogos(); this.favicon(); this.title(); applyTheme(); applyAccent(); this.paintAnim();
          let want = (this.d.layout || {}).view || 'grid', has = null; try { has = localStorage.getItem('mode'); } catch (e) {}
          if (!has && S.mode !== want) { S.mode = want; try { if (S.me && S.view !== 'admin') render(); } catch (e) {} }
          if (!$$('#auth').classList.contains('hidden')) showAuth(setupMode);
        },
        async load() {
          try { const j = await fetch('/api/design', { credentials: 'same-origin' }).then(r => r.json()); if (this.pvLocked) return; this.ver = j.ver; this.apply(j.design); } catch (e) {}
        },
        async refresh() {
          if (this.preview || this.safe) return;
          try {
            const j = await fetch('/api/design', { credentials: 'same-origin', cache: 'no-store' }).then(r => r.json());
            if (j.ver === this.ver) return; this.ver = j.ver;
            const l = document.getElementById('dsgLink'); if (l) l.href = '/design.css?v=' + j.ver;
            this.apply(j.design);
          } catch (e) {}
        },
        screen(s) {
          if (s === 'auth') { showAuth(false); }
          else if (!$$('#auth').classList.contains('hidden') && S.me) { $$('#auth').classList.add('hidden'); $$('#app').classList.remove('hidden'); document.body.classList.remove('noapp'); }
        },
      };
      if (DSG.preview) addEventListener('message', e => {
        if (e.origin !== location.origin || !e.data || typeof e.data !== 'object') return;
        const m = e.data;
        if (m.type === 'dsg-apply') {
          DSG.pvLocked = true;
          const l = document.getElementById('dsgLink'); if (l) l.disabled = true;
          let st = document.getElementById('dsgPrev'); if (!st) { st = document.createElement('style'); st.id = 'dsgPrev'; document.head.append(st); }
          st.textContent = String(m.css || ''); DSG.pvTheme = m.theme || 'auto';
          DSG.apply(m.design); DSG.screen(m.screen);
        } else if (m.type === 'dsg-replay') { DSG.play(); }
        else if (m.type === 'dsg-nav' && S.me && typeof m.hash === 'string' && /^#\/[a-z\/]*$$/.test(m.hash)) go(m.hash);
      });
      if (DSG.preview) addEventListener('load', () => { try { parent.postMessage({ type: 'dsg-ready' }, location.origin); } catch (e) {} });
      DSG.ready = DSG.load();

      // catatan: fungsi global open() milik aplikasi menimpa window.open, jadi tab baru dibuka lewat tautan
      function openStudio() { const a = document.createElement('a'); a.href = '/studio'; a.target = '_blank'; a.rel = 'noopener'; document.body.append(a); a.click(); a.remove(); }

      Object.assign(DSG, {
        ANIM: { entry: 'rise', page: 'fade', hover: 'lift', ripple: true, speed: 1, stagger: 28, bg: 'none', ease: 'smooth', dialog: 'pop' },
        EASE: { smooth: 'cubic-bezier(.22,.8,.24,1)', spring: 'cubic-bezier(.34,1.56,.64,1)', snappy: 'cubic-bezier(.4,0,.2,1)' },
        lastKey: '', pt: 0,
        anim() { return Object.assign({}, this.ANIM, this.d.anim || {}); },
        paintAnim() {
          const a = this.anim(), r = document.documentElement, st = r.style, nm = v => v === 'none' ? 'none' : 'a-' + v;
          st.setProperty('--spd', a.speed); st.setProperty('--stg', a.stagger); st.setProperty('--ease', this.EASE[a.ease] || this.EASE.smooth);
          st.setProperty('--ae', nm(a.entry)); st.setProperty('--ap', a.page === 'slide' ? 'a-pslide' : nm(a.page));
          r.dataset.ah = a.hover; r.dataset.ad = a.dialog; r.dataset.ab = a.bg; r.dataset.ar = a.ripple ? 'on' : 'off';
        },
        play() {
          const c = $$('#content'); if (!c || this.d.motion === 'off') return;
          c.classList.remove('play'); void c.offsetWidth; c.classList.add('play');
          clearTimeout(this.pt); const a = this.anim(); this.pt = setTimeout(() => c.classList.remove('play'), 500 / a.speed + 16 * a.stagger + 250);
        },
        stag(root) { if (root) root.querySelectorAll('.item,.row:not(.head)').forEach((n, i) => n.style.setProperty('--i', i)); },
      });
      (function () {
        const r0 = render;
        render = function () {
          const k = S.view + '|' + S.parent + '|' + S.mode + '|' + S.term + '|' + (S.filter || '') + '|' + (S.sf || '') + '|' + (typeof ADM !== 'undefined' && S.view === 'admin' ? ADM.tab : '');
          if (k !== DSG.lastKey) { DSG.lastKey = k; DSG.play(); }
          const x = r0.apply(this, arguments); DSG.stag($$('#content')); return x;
        };
      })();
      addEventListener('pointerdown', e => {
