        drawShares();
      }
      function drawShares() {
        const l = $$('#shL'); if (!l) return; const q = ADM.shQ.trim().toLowerCase(), now = Date.now()/1000;
        l.innerHTML = ADM.shares.filter(r => !q || r.name.toLowerCase().includes(q) || r.username.toLowerCase().includes(q)).map(r => {
